number: 1014
title: '[SPEC-FIX] Spec guidelines prescribe tracking-document patterns — status markers,
  checkboxes, step numbering in specs'
status: closed
labels:
- needs-approval
body: '## Problem


  Issue #39 on viewport-editor was written with `[x]` completion checkboxes and a
  "Changes Made" section — as if the spec was a tracking document updated during implementation.
  This pattern was not accidental: the guidelines prescribe it.


  ## Root Cause


  The spec guidelines in `.opencode/guidelines/142-planning-archive-workflow.md` §7
  "Required Elements" explicitly mandate:


  - `STATUS: phase.step` header (e.g. `STATUS: 1.2`)

  - `☐`/`↻`/`☑`/`☒` status markers for each step

  - Numbered phases with numbered steps

  - The template in §6 shows `☐` checkboxes per step


  `140-planning-spec-creation.md` §101-108 shows the same template with step checkboxes
  and STATUS header.


  This conflates two concerns:


  1. **Spec = requirements document** (what must be done, with acceptance criteria)

  2. **Plan / sub-issues = tracking mechanism** (progress, status, completion)


  A spec should state requirements. Period. Status markers, checkboxes, and phase-step
  numbering belong in the plan and its sub-issues — never in the spec itself.


  ## What Happens


  When a spec has checkboxes and status markers, agents naturally update them during
  implementation tracking — turning the spec into a hybrid requirements-tracking document.
  This:


  - Pollutes the spec with implementation status that belongs in sub-issues

  - Causes spec drift (spec no longer states what needs to be done — it states what
  was done)

  - Breaks the spec-first workflow because the spec mutates during implementation


  ## Required Changes


  ### `142-planning-archive-workflow.md`


  - Remove §7 "Required Elements" — replace with a simple rule: "Spec states requirements
  only"

  - Remove STATUS header requirement from specs

  - Remove `☐`/`↻`/`☑`/`☒` marker requirement from specs

  - Remove numbered phase-step from specs (phases are fine as section headers, not
  for tracking)

  - Update the template in §6: remove checkboxes, remove STATUS header, remove numbered
  steps

  - Remove rule `spec-structure-007` which enforces status markers


  ### `140-planning-spec-creation.md`


  - Update the template in §101-108: remove checkboxes, remove STATUS header, remove
  numbered step tracking

  - Remove §143 "Executable Verification Commands in Success Criteria" — verification
  commands in the spec is fine, but the "must contain shell commands" prescription
  conflates SCs with test scripts. SCs should state conditions, not prescribe exact
  test commands.

  - Remove rule `spec-creation-006` which enforces executable verification commands


  ### `143-planning-spec-templates.md`


  - Update examples to show spec as requirements-only — no checkboxes, no completion
  markers

  - The "Success Criteria" examples with `✅` prefixes are borderline — these show
  examples of already-completed SCs, which is fine for illustration, but the convention
  of using `✅`/`☐` in specs should be removed


  ## Acceptance Criteria


  1. No guideline requires STATUS headers, checkboxes, or completion markers in specs

  2. Spec template shows requirements-only format (no tracking elements)

  3. Spec phases are section headers only — no numbered steps with status

  4. SCs state conditions without prescribing exact verification commands'
