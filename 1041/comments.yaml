comments:
- body: 'Additional finding during remediation — silent exception handler in `_ensure_worktree()`
    masks worktree creation failures.


    The `try/except Exception` at `tools/local-issues:323` catches ALL exceptions
    and silently returns `False` (plain-file fallback). The caller receives no indication
    that the worktree wasn''t created — no stderr, no warning, no error code.


    This caused the initial remediation attempt at step 4 to appear successful (`local-issues
    list` produced output) when in fact it was still using the plain `.issues/` directory.
    The worktree was only created after manually removing the plain directory and
    retrying.


    **Root cause:** `_ensure_worktree()` at line 233-298 saves existing `.issues/`
    content and removes the directory, but the `git worktree add` call at line 303
    still fails because the directory may have been recreated between save and add,
    or because the save/remove logic didn''t execute (e.g., if `has_existing` was
    False but the directory existed from a `git checkout` that restored it after `git
    rm --cached`).


    **Suggested fix:** Replace the bare `except Exception` with:

    1. Log the exception message to stderr before falling back

    2. On plain-file fallback, print a warning like `WARNING: failed to create issues
    worktree, using plain .issues/ directory`

    3. Return True/False status to the caller so CLI commands can optionally report
    the degraded state'
