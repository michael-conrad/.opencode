sweep_evidence: 'Addressed in the live tools/local-issues: _create_issues_worktree
  (line 811) now calls _migrate_existing_issues() and _setup_worktree() rmtree''s
  any pre-existing .issues/ directory before ''git worktree add'' (local-issues:761-776),
  eliminating the existing-plain-directory failure path, and every failure branch
  emits a ''warn:'' diagnostic to stderr instead of returning silently. The silent
  plain-file degradation described no longer exists.'
