body: '> **Full spec and artifacts: [`.issues/1151/`](https://github.com/michael-conrad/.opencode/tree/issues-data/1151-spec-agent-local-spec-artifact-routing-session-init)**
  — this issue is a condensed exec summary; the authoritative spec lives in the `issues-data`
  branch.

  >

  > **Local artifacts:** `.issues/1151/spec-artifacts/` — implementation plan, card
  catalogue, dependency contracts, research, designs, audit findings


  Five session-init/tool changes to make the agent resolve `repo#N` references locally
  before hitting the GitHub API:


  1. Replace Repo Information routing-verb prose with short disambiguation prose

  2. Rename `## Local Issue Artifacts` to `## Local Spec Artifacts` with `repo#:`/`spec
  artifacts:` keys

  3. Reorder sections: Local Spec Artifacts before Repo Information

  4. Add `local-issues locate` subcommand returning tree skeleton

  5. Update tool description to `Locate repo#N spec and plan artifacts. Create, read,
  and manage them.`


  SC-1: `## Local Spec Artifacts` emitted before `## Repo Information`

  SC-2: Section uses `repo#:` and `spec artifacts:` keys

  SC-3: Repo Information prose is short replacement

  SC-4: `locate --number N` returns tree skeleton

  SC-5: `locate --number repo#N` returns single tree

  SC-6: Tool description reports new text'
