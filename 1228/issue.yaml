  dependency contracts, research, designs, audit findings


  ## Exec Summary


  Agents executing plans sometimes skip, compress, reorder, or defer procedural workflow
  steps — baseline runs, RED-phase assertions, post-regression suite re-runs, verification
  dispatches — on the rationale that a step looks redundant or unnecessary. The defect
  surfaces at review or after merge, when the skipped step''s protection is missing.
  The current `implement` card forbids weakening criteria (rule 8, SC fidelity) but
  does not name this procedural rationalization.


  **Fix:** append one rule to `.opencode/skills/implement/SKILL.md` stating that every
  step of the pre-implementation checklist, the RED/GREEN chain, and the post-implementation
  gates (including steps defined in the implementation-workflow reference) runs in
  order; perceived redundancy is not grounds to skip a step; a step that cannot complete
  stops the cycle per the reference''s escalation rule instead of being silently omitted.


  ### Key Decisions


  - **Card-level, not artifact-level**: the admonishment lives where the temptation
  arises (`implement` loads before work and before every mid-cycle change). Stamping
  compliance boilerplate into every generated spec/plan body — the original proposal
  — would violate the `spec` card''s normative body footer allowlist, which bans process
  indicators from artifact bodies.

  - **One home**: `implement` only — the failure mode lives at execution; scattering
  the rule across other cards re-imports the boilerplate pattern.

  - **Structural verification only**: step-skipping is intent-decidable; the floor
  assigns intent-decidable rules to judgment, never mechanical enforcement, so the
  original behavioral tests and exact-wording lock are retired.


  ## Full Spec


  See local artifact directory at `.opencode/.issues/1228/` for the complete spec
  with success criteria table, risk analysis, and documentation sources.


  ## AI Agent Instructions


