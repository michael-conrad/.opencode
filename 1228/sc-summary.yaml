spec: 1228
title: "[SPEC-FIX] Forbid workflow-step skipping in the implement card"
scs:
  - id: SC-1
    criterion: implement/SKILL.md contains a rule stating that a workflow step appearing redundant or unnecessary is not grounds to skip, compress, reorder, or defer it
    evidence_type: string
  - id: SC-2
    criterion: The new rule covers the full workflow — pre-implementation checklist, RED/GREEN chain, post-implementation steps — including steps defined in the implementation-workflow reference
    evidence_type: string
  - id: SC-3
    criterion: The new rule routes steps that cannot complete to the escalation path rather than silent omission
    evidence_type: string
  - id: SC-4
    criterion: The change is append-only — rules 1–9 of implement/SKILL.md unchanged in numbering and content
    evidence_type: string
