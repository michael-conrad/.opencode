body: "> **Full spec and artifacts: [`.opencode/.issues/1539/`](https://github.com/michael-conrad/.opencode/tree/issues-data/1539)**\
  \ — this issue is a condensed exec summary; the authoritative spec lives in the\
  \ `issues-data` branch.\n>\n> **Local artifacts:** `.opencode/.issues/1539/` — implementation\
  \ plan, card catalogue, dependency contracts, research, designs, audit findings\n\
  \n# Investigate SearXNG MCP as DuckDuckGo Search Alternative\n\n## Problem\n\nDuckDuckGo's\
  \ public API (`ddg-search`) is rate-limited and subject to bot detection. When DDG\
  \ fails, there is no configured fallback search mechanism in the opencode config.\n\
  \n## Investigation Scope\n\n1. **SearXNG MCP server** (`searxng-mcp` — Python package,\
  \ runs via `uvx`, zero pip deps)\n   - Can connect to public SearXNG instances (no\
  \ self-hosting required)\n   - Examples: `https://search.bus-hit.me`, `https://searx.tiekoetter.com`\n\
  \   - Source: [searxng-mcp on PyPI](https://pypi.org/project/searxng-mcp/)\n\n2.\
  \ **Other search MCP alternatives** for comparison:\n   - tavily-mcp (Tavily API,\
  \ free tier 1000/mo)\n   - brave-search-mcp (Brave Search API, free tier 2000/mo)\n\
  \   - serpapi-mcp (SerpAPI, free tier 100/mo)\n   - kagi-search-mcp (Kagi API, paid\
  \ $5/mo)\n\n3. **Tor/Onion routing** for DDG — no known MCP server does this; SearXNG\
  \ behind Tor is the viable path\n\n## Key Questions\n\n- What are the rate limits\
  \ and reliability of public SearXNG instances?\n- How do these alternatives compare\
  \ on result quality, API stability, and privacy?\n- Should opencode config add a\
  \ fallback search strategy (e.g., try DDG → SearXNG → Brave)?\n- What is the minimal\
  \ config change to integrate any of these as an MCP server?\n\n## Success Criteria\n\
  \n- [ ] Survey all viable search MCP servers with their rate limits and API requirements\n\
  - [ ] Test connectivity to at least 2 public SearXNG instances\n- [ ] Produce a\
  \ recommendation: which single server (or combo) should be added to opencode.jsonc\n\
  - [ ] Document the config change needed (env vars, command, URL references)\n\n\
  ## Research Gaps\n\n- No existing research card on search MCP alternatives in this\
  \ repo\n\n\U0001F916 Co-authored with AI: OpenCode (deepseek-v4-flash)"
