body: '> **Full spec and artifacts: [`.opencode/.issues/1962/`](https://github.com/michael-conrad/.opencode/tree/issues-data/1962)**
  — this issue is a condensed exec summary; the authoritative spec lives in the `issues-data`
  branch.

  >

  > **Local artifacts:** `.opencode/.issues/1962/` — implementation plan, card catalogue,
  dependency contracts, research, designs, audit findings


  ## Exec Summary


  Fix structural defects in `writing-plans` and `writing-plans-creation` skills: correct
  TDT entries, contract paths, dispatch routing, add Z3 gates, and convert `writing-plans-creation`
  from a skill card to a task card.


  ### Cards (dependency order)

  1. **`writing-plans/SKILL.md`** — TDT with 4 entries (`create`, `update`, `retroactive`,
  `holistic-self-check`), Pipeline section with 4 workflows, Invocation with 4 canonical
  dispatch strings. Document `clean-room` as internal/referenced task.

  2. **`writing-plans-creation/SKILL.md`** — Convert from skill card to task card:
  remove YAML frontmatter, remove "Skill:" header, remove Contracts section, keep
  plain task list.

  3. **`create.md`** — Fix 11 contract paths from `writing-plans/contracts/` to `writing-plans-creation/contracts/`.
  Add plan-creation-pipeline dispatch step.

  4. **`update.md`, `retroactive.md`** — Fix contract paths.

  5. **`pre-plan-readiness.md`** — Add solve readiness gate (already done).


  ### Key Decisions

  - **One skill card**: `writing-plans/SKILL.md` is the single dispatchable entry
  point. `writing-plans-creation` is a task container (no TDT, no Invocation).

  - **4 TDT entries**: `create`, `update`, `retroactive`, `holistic-self-check`. Pipeline
  steps are documented in the Pipeline section — they are NOT TDT entries.

  - **Task container pattern**: `writing-plans-creation` follows `spec-creation-decomposition`
  pattern — plain task list, no YAML frontmatter, no "Skill:" header.

  - **`clean-room.md`**: Internal/referenced task only reachable via audit skill.
  No TDT entry.


  ### Risk Callouts

  - **No destructive operations** — Only skill metadata and task file references modified.

  - **Rollback**: `git checkout -- .opencode/skills/writing-plans*/` to revert all
  changes.


  ## Success Criteria


  | ID | Criterion | Evidence Type |

  |----|-----------|---------------|

  | SC-1 | `writing-plans` TDT has exactly 4 user-facing workflow entries | structural
  |

  | SC-2 | `writing-plans` Pipeline section documents 4 workflows with step-level
  dispatch | structural |

  | SC-3 | `writing-plans-creation` is a task card (no YAML frontmatter, no "Skill:"
  header) | structural |

  | SC-4 | All contract paths in `create.md`, `update.md`, `retroactive.md` resolve
  | structural |

  | SC-5 | `create` workflow dispatches to `plan-creation-pipeline` with Z3 gates
  | behavioral |

  | SC-6 | `pre-plan-readiness` has `solve` readiness gate | structural |

  | SC-7 | All canonical dispatch strings follow DISPATCH_GATE format | structural
  |

  | SC-8 | No orphaned tasks in `writing-plans-creation/tasks/` | structural |


  ## AI Agent Instructions


  This issue is an executive summary for human stakeholders.

  The authoritative spec and plan artifacts are at `.opencode/.issues/1962/`.

  After creation, `local-issues sync` MUST be run and the result committed to create
  the local `.opencode/.issues/1962/` entry.

  The implementation plan is at `.opencode/.issues/1962/plan.md` and `.opencode/.issues/1962/plan-01.md`.

  AI agents MUST read the local spec/plan files for implementation

  and MUST NOT base implementation on this summary.


