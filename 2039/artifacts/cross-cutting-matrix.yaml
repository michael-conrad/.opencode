# Cross-Cutting Matrix — Issue 2039
# Identifies SCs that span multiple concerns.

issue_number: 2039
source: .opencode/.issues/2039/spec.md

cross_cutting_scs:
  - sc: SC-1
    spans:
    - CONCERN-1 (Card Creation)
    - CONCERN-2 (TDT Reference Integrity)
    detail: "SC-1 mandates the cards exist OR the dangling reference is resolved for the two special cases (route, push-artifacts), coupling card creation with TDT integrity."
