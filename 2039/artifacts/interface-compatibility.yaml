# Interface Compatibility — Issue 2039
# Checks interface boundaries between affected modules (skill deck files) and
# the dependency contract for the solve/plan tools.

issue_number: 2039
source: .opencode/.issues/2039/spec.md

interface_assessment:
  - interface: multimodal-dispatch/SKILL.md -> multimodal-dispatch/tasks/route.md
    status: dangling
    sc: SC-3, SC-4
    detail: "TDT row + Invocation reference a non-existent route.md. Resolution: remove the stale row + Invocation (recommended), rerouting 'route'/'route task'/'dispatch to model' triggers to dispatch.md. No interface change to dispatch.md or resolve.md needed."
  - interface: issue-operations-core/SKILL.md -> issue-operations-core/tasks/push-artifacts.md
    status: compatible
    sc: SC-3, SC-4
    detail: "Core card now exists (thin dispatcher). Routes to platform-level card issue-operations/platforms/local/tasks/push-artifacts.md and captures artifact_url for spec-creation/tasks/reconcile-push.md consumer."
  - interface: issue-operations/SKILL.md -> issue-operations/platforms/local/tasks/push-artifacts.md
    status: compatible
    sc: SC-4
    detail: "Existing routing of push-artifacts to the platform-level card is correct; unaffected by the re-scope."
  - interface: brainstorming/SKILL.md -> brainstorming/tasks/top-down-analysis.md, cross-scope.md
    status: compatible
    sc: SC-1, SC-1.1
    detail: "Both cards exist and contain the required procedure content."
  - interface: programming-principles/SKILL.md -> tasks/check-limits.md, decompose.md
    status: compatible
    sc: SC-1
    detail: "Both cards exist."
  - interface: skill-creator/SKILL.md -> tasks/init.md, package.md, fragment-management.md
    status: compatible
    sc: SC-1
    detail: "All three cards exist."
  - interface: using-git-worktrees/SKILL.md -> tasks/verify-worktree.md
    status: compatible
    sc: SC-1
    detail: "Card exists."

