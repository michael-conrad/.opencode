# Structure — Issue 2039: Create 10 STILL-MISSING task cards + resolve 2 special-case dangling references
spec: .opencode/.issues/2039/spec.md
phase_count: 3
phases:
  - id: phase-1
    name: Create the 10 STILL-MISSING task cards
    scs: [SC-1, SC-1.1, SC-2]
    items:
      - {item: 1, sc: SC-1, evidence_type: string, verification: "verify each of the 10 task card .md files exists on disk"}
      - {item: 2, sc: SC-1.1, evidence_type: string, verification: "verify top-down-analysis.md and cross-scope.md contain all required procedure per §Brainstorming Task Card Requirements"}
      - {item: 3, sc: SC-2, evidence_type: string, verification: "sample audit — each of the 10 new task cards has entry criteria, inline steps, exit criteria"}
    skill_task:
      red: {skill: test-driven-development, dispatch: "execute red task from test-driven-development"}
      green: {skill: test-driven-development, dispatch: "execute green task from test-driven-development"}
      verify: {skill: verification-before-completion, dispatch: "execute verify task from verification-before-completion"}
      commit: {skill: orchestrator, dispatch: "git add <files> && git commit -m <message>"}
  - id: phase-2
    name: Resolve the two special-case dangling references
    scs: [SC-4]
    items:
      - {item: 4, sc: SC-4, evidence_type: string, verification: "verify route TDT row + Invocation either reference an existing card or are removed; verify push-artifacts core card routes correctly"}
    skill_task:
      red: {skill: test-driven-development, dispatch: "execute red task from test-driven-development"}
      green: {skill: test-driven-development, dispatch: "execute green task from test-driven-development"}
      verify: {skill: verification-before-completion, dispatch: "execute verify task from verification-before-completion"}
      commit: {skill: orchestrator, dispatch: "git add <files> && git commit -m <message>"}
  - id: phase-3
    name: Verify TDT-reference integrity across the skill deck
    scs: [SC-3]
    items:
      - {item: 5, sc: SC-3, evidence_type: string, verification: "cross-reference all TDTs against the filesystem — no TDT references a non-existent task card"}
    skill_task:
      red: {skill: test-driven-development, dispatch: "execute red task from test-driven-development"}
      green: {skill: test-driven-development, dispatch: "execute green task from test-driven-development"}
      verify: {skill: verification-before-completion, dispatch: "execute verify task from verification-before-completion"}
      commit: {skill: orchestrator, dispatch: "git add <files> && git commit -m <message>"}
dependency_dag:
  edges:
    - {from: phase-1, to: phase-2, reason: "Phase 2 resolves the special-case dangling references against the cards created in Phase 1"}
    - {from: phase-1, to: phase-3, reason: "Phase 3 cross-references all TDTs against the filesystem, covering cards created in Phase 1"}
    - {from: phase-2, to: phase-3, reason: "Phase 3 integrity check covers the TDT rows modified/resolved in Phase 2"}
triplet_co_location:
  status: PASS
  notes: Each SC's RED/GREEN/COMMIT steps are assigned to the same phase. No TRIPLET_SPLIT.
cross_phase_dependency:
  status: PASS
  notes: Phase 3 is a verification-only gate; no RED test in a later phase depends on SC output from an even later phase. No CROSS_PHASE_DEP.
