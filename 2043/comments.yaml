    - AC3 (.cache/uv passes isolation): satisfied — the allowlist case-pattern (line
    414) explicitly contains .cache/uv|.cache/uv/*, landing via the isolation hardening
    chain (#2106 → #2582).

    - AC1 (blanket * globs): superseded by a strictly stronger design. The shipped
