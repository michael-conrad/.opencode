    as leaks. Blanket globs would also conflict with the #2582 Docker-tier conditional
    exceptions (.cache/Microsoft, .cache/huggingface allowed only when TEST_ENV=docker).
    Implementing AC1 literally would weaken isolation and is deliberately not applied.


    Closing as completed: intent honored, prescribed mechanism superseded by better
    implementation consistent with the behavioral-testing deck card.'
