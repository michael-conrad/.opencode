body: '## Problem


  `approval-gate` routes 16 task references through `approval-gate-scope --task <name>`.
  The sub-agent loads `approval-gate-scope/SKILL.md`, gets a file list with no TDT,
  and has to find the task file by name. The sub-skill SKILL.md is dead weight.


  ## Scope


  Fix the approval-gate parent card and remove the approval-gate-scope sub-skill indirection.


  ## Affected Files


  - `.opencode/skills/approval-gate/SKILL.md`

  - `.opencode/skills/approval-gate-scope/SKILL.md` (to be removed from <available_skills>)

  - ~16 task files under `.opencode/skills/approval-gate-scope/tasks/`


  ## Key Changes


  1. Add Pre-Flight Gate to approval-gate/SKILL.md

  2. Remove global Invocation and DISPATCH_GATE sections

  3. Update TDT to reference task files by direct path (`approval-gate-scope/tasks/verify-authorization.md`)
  instead of `--task` qualifiers

  4. Add workflow sections for each task type

  5. Add contract sections to all task files

  6. Mark approval-gate-scope/SKILL.md for removal from <available_skills>


  ## Success Criteria


  | ID | Criterion | Evidence Type |

  |---|---|---|

  | SC-1 | approval-gate/SKILL.md has Pre-Flight Gate | `string` |

  | SC-2 | No global Invocation or DISPATCH_GATE | `string` |

  | SC-3 | TDT references task files by direct path, not `--task` qualifiers | `string`
  |

  | SC-4 | All task files have Dispatch Contract, Output Contract, Frugal Contract
  | `string` |

  | SC-5 | approval-gate-scope/SKILL.md removed from <available_skills> | `string`
  |


  ## Dependencies


  Blocked by T-1 and T-2. Prerequisite for C-1 (cleanup spec).'
