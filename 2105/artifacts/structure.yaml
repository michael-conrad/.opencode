spec: 2105
phases:
  - id: P1
    name: PR-creation merge gate
    scs: [SC-1]
    evidence_type: string
    skill_task: test-driven-development --task green
    dispatch: sub-agent
    description: Add post-creation HALT step to pr-creation.md prohibiting merge
    depends_on: []

  - id: P2
    name: Completion merge gate
    scs: [SC-2]
    evidence_type: string
    skill_task: test-driven-development --task green
    dispatch: sub-agent
    description: Add no-merge gate to completion.md checking for merge API calls
    depends_on: []

  - id: P3
    name: Authorization pre-merge check
    scs: [SC-3]
    evidence_type: string
    skill_task: test-driven-development --task green
    dispatch: sub-agent
    description: Add pre-merge block to verify-authorization.md
    depends_on: []

  - id: P4
    name: Behavioral test
    scs: [SC-4]
    evidence_type: behavioral
    skill_task: test-driven-development --task red
    dispatch: sub-agent
    description: Write behavioral test that verifies agent declines to merge
    depends_on: [P1, P2, P3]

  - id: P5
    name: Critical rules cross-reference
    scs: [SC-5]
    evidence_type: string
    skill_task: test-driven-development --task green
    dispatch: sub-agent
    description: Add cross-reference in 000-critical-rules.md to skill enforcement
    depends_on: []

dependency_dag:
  edges:
    - from: P1
      to: P4
      reason: Behavioral test (SC-4) verifies agent follows the merge prohibition rules — rules must exist first
    - from: P2
      to: P4
      reason: Behavioral test (SC-4) verifies agent follows the merge prohibition rules — rules must exist first
    - from: P3
      to: P4
      reason: Behavioral test (SC-4) verifies agent follows the merge prohibition rules — rules must exist first
  independent_phases: [P1, P2, P3, P5]
  dependent_phase: P4

implementation_pipeline_mapping:
  P1: green-phase
  P2: green-phase
  P3: green-phase
  P4: red-phase
  P5: green-phase
