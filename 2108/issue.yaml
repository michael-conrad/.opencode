body: '---

  number: 2108

  title: "[BUG] Fabricated ''requires VPN'' language keeps getting added back to specs"

  state: OPEN

  approved: for_pr

  ---


  ## Summary


  Specs and AGENTS.md files in this repo keep getting "requires VPN or office network"
  language added to them for database connections that are always available without
  a VPN. This is fabricated information that gets parroted from stale spec text without
  verification.


  ## Root Cause


  1. An initial spec or AGENTS.md includes "requires VPN" as a caveat

  2. Downstream agents copy that language verbatim into new specs without checking
  whether the DB is actually reachable

  3. The language propagates through the codebase as cargo-cult boilerplate


  ## Evidence


  - Multiple specs and AGENTS.md files across the codebase contain "requires VPN",
  "requires office network", or equivalent connectivity constraint language for resources
  (databases, APIs, services) that are always available without special network access

  - These claims propagate through cargo-cult copying: an initial spec includes the
  language, downstream agents copy it verbatim into new specs without verifying whether
  the resource is actually unreachable

  - No tool-call evidence (ping, curl, nc) was produced before including any of these
  connectivity constraint claims


  ## Affected Files


  | File | Repo | Change |

  |------|------|--------|

  | `.opencode/AGENTS.md` | Submodule (`.opencode`) | Add verification gate requiring
  tool-call evidence before any connectivity constraint claim is included in agent-facing
  text |


  ## Success Criteria


  | ID | Criterion | Evidence Type | Verification Method | Notes |

  |----|-----------|---------------|---------------------|-------|

  | SC-1 | `.opencode/AGENTS.md` contains a verification gate requiring tool-call
  evidence before any connectivity constraint claim is included in agent-facing text
  | `string` | `grep` for connectivity verification language in `.opencode/AGENTS.md`
  | Implementable from the `.opencode` submodule branch. |

  | SC-2 | Behavioral enforcement test exists that sends a prompt asking about database
  connectivity and verifies the agent does NOT fabricate VPN/network constraints without
  a tool call | `behavioral` | `opencode run` with `with-test-home` wrapper; assert
  agent does not include unverified connectivity claims in output | Implementable
  from the `.opencode` submodule branch. |


  ## Prevention


  Add a verification gate to `.opencode/AGENTS.md`: any spec or AGENTS.md that claims
  a resource is unreachable, restricted, or requires special connectivity (VPN, office
  network, firewall, proxy) must include tool-call evidence verifying that claim before
  the language is included. Fabricated connectivity constraints must not propagate.
  The verification gate applies to all agent-facing text — specs, AGENTS.md files,
  guidelines, skill cards, and task cards.


  ## Change Control


  | Date | Change | Reason | Authorized By |

  |------|--------|--------|---------------|

  | 2026-07-24 | Added success criteria table with evidence types, affected files
  section, and SC-4 behavioral enforcement test requirement | Bug report was narrative-only
  with no SCs; research completed on AI agent fabrication of connectivity constraints
  | `for_pr` scope authorization |

  | 2026-07-24 | Added Notes column to SC table noting parent-repo vs submodule scope;
  added Repo column to Affected Files table; added Cross-Repo Dependency section |
  SC-1 and SC-2 target parent repo files but implementation branch is on the `.opencode`
  submodule — these SCs cannot be implemented from the submodule branch | Revision
  request |

  | 2026-07-24 | Removed WeekliesXmlExport-specific Evidence, SC-1, SC-2, Cross-Repo
  Dependency, and WeekliesXmlExport from Affected Files; renumbered SC-3→SC-1, SC-4→SC-2;
  made Prevention section generic | SC-1 and SC-2 reference a specific parent repo
  (WeekliesXmlExport) that is not available — SCs should be treated generically |
  Revision request |

  '
