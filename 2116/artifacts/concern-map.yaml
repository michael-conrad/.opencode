spec_path: .opencode/.issues/2116/spec.md
concerns:
  - id: C1
    name: Inline decomposition criteria checklist
    description: Add a 'Decomposition Criteria' section to spec-creation/tasks/validate.md containing a structured checklist of the 4 spec-level criteria (atomicity, single deliverable, binary verifiability, PR-gate viability).
    scs: [SC-1]
    phase: Phase 2
  - id: C2
    name: Imperative binary PASS/FAIL decision-tree format
    description: Each criterion uses imperative binary decision tree with explicit PASS/FAIL branches, not prose guidance.
    scs: [SC-2]
    phase: Phase 2
  - id: C3
    name: Atomicity trigger-word sub-check
    description: Atomicity check includes trigger-word sub-check (and, or, comma-separated lists → FAIL).
    scs: [SC-3]
    phase: Phase 2
  - id: C4
    name: Binary verifiability disjunctive-pattern sub-check
    description: Binary verifiability check includes disjunctive pattern sub-check (either/or, alternatively, one of → FAIL).
    scs: [SC-4]
    phase: Phase 2
  - id: C5
    name: Binary verifiability vague-term sub-check
    description: Binary verifiability check includes vague term sub-check (should, could, ideally, as appropriate → FAIL).
    scs: [SC-5]
    phase: Phase 2
  - id: C6
    name: PR-gate viability meta RED/GREEN reference
    description: PR-gate viability check references the meta RED/GREEN principle.
    scs: [SC-6]
    phase: Phase 2
  - id: C7
    name: Cross-reference to master reference
    description: Inline copy includes cross-reference comment 'See audit/reference/decomposition-criteria.md for master definition'.
    scs: [SC-7]
    phase: Phase 2
  - id: C8
    name: Skip condition for single-SC/single-file specs
    description: Decomposition check skipped when spec has exactly 1 SC AND 1 affected file.
    scs: [SC-8]
    phase: Phase 2
  - id: C9
    name: Monolithic SC rejection behavior
    description: Behavioral test — spec with monolithic SC containing 'and' submitted to validate returns FAIL with correct reason.
    scs: [SC-9]
    phase: Phase 2
  - id: C10
    name: Atomic SC acceptance behavior
    description: Behavioral test — spec with single atomic SC submitted to validate returns PASS for decomposition criteria.
    scs: [SC-10]
    phase: Phase 2
phase_map:
  Phase 2:
    - SC-1
    - SC-2
    - SC-3
    - SC-4
    - SC-5
    - SC-6
    - SC-7
    - SC-8
    - SC-9
    - SC-10
