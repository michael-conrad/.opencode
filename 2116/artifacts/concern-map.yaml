concern_groups:
  - name: checklist-presence
    description: Inline decomposition criteria checklist with 4 criterion headings in validate.md
    scs: [SC-1]
    phase: Phase 2
  - name: decision-tree-format
    description: Imperative binary decision-tree format with explicit PASS/FAIL branches for each criterion
    scs: [SC-2]
    phase: Phase 2
  - name: atomicity-subchecks
    description: Atomicity trigger-word sub-check (and, or, comma-separated lists -> FAIL)
    scs: [SC-3]
    phase: Phase 2
  - name: binary-verifiability-subchecks
    description: Binary verifiability disjunctive-pattern and vague-term sub-checks (SC-4, SC-5)
    scs: [SC-4, SC-5]
    phase: Phase 2
  - name: pr-gate-viability
    description: PR-gate viability meta RED/GREEN principle reference
    scs: [SC-6]
    phase: Phase 2
  - name: cross-reference
    description: Cross-reference comment to master decomposition criteria file
    scs: [SC-7]
    phase: Phase 2
  - name: skip-guard
    description: Skip condition for single-SC/single-file specs
    scs: [SC-8]
    phase: Phase 2
  - name: behavioral-rejection
    description: Behavioral test - monolithic SC rejected with atomicity reason
    scs: [SC-9]
    phase: Phase 2
  - name: behavioral-acceptance
    description: Behavioral test - atomic SC accepted by decomposition criteria
    scs: [SC-10]
    phase: Phase 2
phase_boundaries:
  Phase 2: [SC-1, SC-2, SC-3, SC-4, SC-5, SC-6, SC-7, SC-8, SC-9, SC-10]
notes:
  - All 10 SCs map to a single phase (Phase 2) and a single edit target (validate.md); concern groups are sub-divisions of the same single-file change.
  - Concern groups SC-1..SC-8 are string-verifiable (static checklist content); SC-9/SC-10 are behavioral (runtime validate execution).
