spec_path: .opencode/.issues/2116/spec.md
cross_cutting_concerns:
  - id: XC1
    name: validate.md Decomposition Criteria section (single shared edit target)
    scs: [SC-1, SC-2, SC-3, SC-4, SC-5, SC-6, SC-7, SC-8, SC-9, SC-10, SC-11, SC-12, SC-13, SC-14]
    spans_concerns: [C1, C2, C3, C4, C5, C6, C7, C8, C9, C10, C11, C12, C13, C14]
    summary: >
      All 14 SCs edit or behaviorally verify the same validate.md Decomposition
      Criteria section. SC-1..SC-8 and SC-11/SC-12 are structural (string)
      edits to the section; SC-9/SC-10/SC-13/SC-14 are behavioral tests
      exercising the same section. There is no cross-file behavioral coupling —
      the master reference edit (SC-11/SC-12 lockstep) is doc-synchronization.
  - id: XC2
    name: Master reference lockstep synchronization
    scs: [SC-11, SC-12]
    spans_concerns: [C11, C12]
    summary: >
      SC-11 and SC-12 each touch BOTH the validate.md inline copy (behavioral
      target) AND the master reference decomposition-criteria.md (doc
      lockstep). The inline copy mirrors the criteria content; the master
      reference is the authoritative source. Both edits must stay in sync per
      the maintainer note.
  - id: XC3
    name: Skip-guard interaction with behavioral tests
    scs: [SC-8, SC-9, SC-10, SC-13, SC-14]
    spans_concerns: [C8, C9, C10, C13, C14]
    summary: >
      The SC-8 skip-guard (skip when 1 SC AND 1 affected file) interacts with
      the behavioral tests. SC-9/SC-10/SC-13/SC-14 all explicitly submit specs
      with MORE than 1 affected file so the guard does NOT fire — ensuring the
      decomposition criteria are actually evaluated.

phase_cross_cutting_impact:
  Phase 2: All 14 SCs land in Phase 2; no cross-phase dependencies exist in this
    spec (the plan-level criteria and audit evaluator are explicitly out of scope,
    deferred to #2115 and #2117).
