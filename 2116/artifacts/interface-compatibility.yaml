interfaces:
  - target: validate.md
    scs: [SC-1, SC-2, SC-3, SC-4, SC-5, SC-6, SC-7, SC-8]
    interface_type: task-card-content
    description: validate.md is a task card consumed by clean-room sub-agents during spec-creation dispatch; must remain self-contained (no runtime import), per Key Design Decision #1.
    compatibility: PASS
    notes: The spec deliberately avoids a runtime import of the master reference file to preserve clean-room self-containment; the cross-reference comment (SC-7) is the only linkage.
  - target: audit/reference/decomposition-criteria.md
    scs: [SC-7]
    interface_type: reference-source
    description: Master reference file is the authoritative source for the inline copy; validate.md inlines a copy with a cross-reference comment, so there is no runtime interface dependency.
    compatibility: PASS
    notes: The inline copy is the executable checklist; the master file is a read-only pointer target. Drift is governed by the maintainer note (SC-7).
  - target: existing Step 3.3 Compound-SC detection
    scs: [SC-3]
    interface_type: adjacent-check
    description: The existing Step 3.3 Compound-SC detection is retained; the new Atomicity trigger-word sub-check (SC-3) overlaps but operates as a distinct checklist. No removal or replacement (Key Design Decision #4).
    compatibility: PASS
    notes: Both checks may flag the same SC without conflict; documented in Edge Case 'Compound-SC detection overlap'.
boundary_summary:
  - Single-file edit target (validate.md); no cross-module interface changes.
  - The only external reference is the master decomposition-criteria.md file, consumed read-only via a cross-reference comment.
