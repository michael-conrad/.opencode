spec_path: .opencode/.issues/2116/spec.md
interface_boundaries:
  - module: .opencode/skills/spec-creation/tasks/validate.md
    interface: Task card procedure (Step 3 structural validation)
    change: Adds a new 'Decomposition Criteria' section after existing validation checks
    compatibility: Compatible - additive change; existing Step 3.3 Compound-SC detection retained as distinct check
    notes: No interface signature changes; validate.md remains a self-contained task card for clean-room dispatch
  - module: .opencode/audit/reference/decomposition-criteria.md
    interface: Master reference file (authoritative source)
    change: None - not modified by this spec
    compatibility: Compatible - validate.md inlines a copy with cross-reference comment (SC-7)
    notes: Inline copy mirrors criteria content, not numbered heading format; cross-reference comment governs drift
  - module: .opencode/tests-v2/behaviors/
    interface: Behavioral test scripts (artifact-only generators)
    change: New test scripts for SC-9 and SC-10
    compatibility: Compatible - follows Two-SC pattern per tests-v2/AGENTS.md §2/§5a
    notes: Scripts generate session.yaml artifacts via with-test-home (exit 0, no in-script assertion); clean-room sub-agent evaluates session.yaml
interface_conflicts: none
dependency_contract:
  variables:
    phase_2:
      type: bool
      description: "Add inline decomposition criteria checklist to validate.md with 4 criteria, binary PASS/FAIL decision trees, sub-checks, cross-reference comment, and skip-guard — SC-1 through SC-8 (all string SCs target validate.md)"
    behavioral_tests:
      type: bool
      description: "Add behavioral test scripts at .opencode/tests-v2/behaviors/ for SC-9 and SC-10 (Two-SC pattern, artifact-only generators)"
  preconditions:
    - "z3.Implies(behavioral_tests, phase_2)"
  invariants: []
  postconditions: []
  phases:
    phase_2:
      files:
        - .opencode/skills/spec-creation/tasks/validate.md
      scs:
        - SC-1
        - SC-2
        - SC-3
        - SC-4
        - SC-5
        - SC-6
        - SC-7
        - SC-8
    behavioral_tests:
      files:
        - .opencode/tests-v2/behaviors/
      scs:
        - SC-9
        - SC-10
  edges:
    - from: phase_2
      to: behavioral_tests
      rationale: "The decomposition check must exist in validate.md (Phase 2) before its behavioral rejection/acceptance behavior can be tested (SC-9, SC-10)"
  notes:
    - "All 10 SCs map to Phase 2 per the spec's Phase Mapping table. The dependency_contract splits Phase 2 into the validate.md content work (SC-1..SC-8) and the behavioral test scripts (SC-9, SC-10), which depend on the validate.md content being present."
    - "The master reference file .opencode/audit/reference/decomposition-criteria.md is a satisfied external dependency (issue #2118, closed/merged); it is read-only and not part of the phase work."
