interfaces:
  - module: .opencode/skills/spec-creation/tasks/validate.md
    module_role: validate task card (clean-room sub-agent execution)
    exposed_interface: validate task instructions/checklist consumed verbatim by
      spec-creation clean-room sub-agents
    compatibility_analysis: >
      The 'Decomposition Criteria' section is an additive inline section within
      the validate task card. It does not alter the task card's execution
      contract, entry/exit criteria, or dispatch path. Existing Step 3.3
      Compound-SC detection is retained (Key Design Decision 4), so no
      regression to the currently-shipped gate. Adding a new section is
      backward-compatible with all consumers of validate.md.
    breaking_change: false
  - module: .opencode/audit/reference/decomposition-criteria.md
    module_role: master decomposition criteria reference (authoritative source)
    interface: doc-only; read by maintainers and mirrored by inline copies
    compatibility: >
      SC-11/SC-12 add the Ceremony and Coverage spec-level criteria sections to
      the master reference. This is additive and does not modify the existing
      plan-level criteria (acyclic DAG, file collision freedom, explicit
      dependency declaration). No plan-level interface contract is changed.
    breaking_change: false
  - module: .opencode/skills/spec-creation/tasks/validate.md -> .opencode/tests-v2/behaviors/
    module_role: behavioral test generator scripts
    interface: Two-SC pattern — artifact-only generator scripts under
      .opencode/tests-v2/behaviors/ run specs through validate via
      with-test-home, producing session.yaml artifacts; clean-room sub-agents
      evaluate session.yaml (SQLite DB export, PRIMARY evidence per
      tests-v2/AGENTS.md §2/§5a)
    compatibility_notes: >
      The behavioral test scripts are new files added to .opencode/tests-v2/
      behaviors/. They must conform to the tests-v2 artifact-only generator
      pattern (exit 0, no in-script assertion). They depend on validate.md
      decomposition behavior (SC-9/SC-10/SC-13/SC-14). No existing interface
      changed.
    breaking_change: false

external_dependencies:
