# Planning problem — issue #2116
# Two work units: phase_2 (validate.md content SC-1..SC-8) then behavioral_tests (SC-9/SC-10).
# Edge: phase_2 -> behavioral_tests (the decomposition check must exist before its behavior is tested).
domain: decomposition-validate-plan
objects:
  - name: p2
    type: phase
  - name: pbt
    type: phase
fluents:
  - name: done
    params:
      - name: p
        type: phase
actions:
  - name: run_p2
    params: []
    preconditions:
      - not done(p2)
    effects:
      - done(p2)
  - name: run_pbt
    params: []
    preconditions:
      - done(p2)
      - not done(pbt)
    effects:
      - done(pbt)
init: []
goals:
  - done(p2)
  - done(pbt)
