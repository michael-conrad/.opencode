state_transitions:
  - sc: SC-1
    from: validate.md does not contain decomposition checklist
    to: validate.md contains inline decomposition criteria checklist with 4 criterion headings
    trigger: edit adds checklist section
  - sc: SC-2
    from: criteria blocks use prose guidance
    to: criteria blocks use imperative binary PASS/FAIL decision-tree format
    trigger: edit converts each criterion to decision tree
  - sc: SC-3
    from: atomicity check lacks trigger-word sub-check
    to: atomicity check flags and/or/comma-separated lists -> FAIL
    trigger: edit adds trigger-word sub-check to Atomicity block
  - sc: SC-4
    from: binary verifiability check lacks disjunctive-pattern sub-check
    to: binary verifiability check flags either/or/alternatively/one of -> FAIL
    trigger: edit adds disjunctive-pattern sub-check
  - sc: SC-5
    from: binary verifiability check lacks vague-term sub-check
    to: binary verifiability check flags should/could/ideally/as appropriate -> FAIL
    trigger: edit adds vague-term sub-check
  - sc: SC-6
    from: PR-gate viability check lacks meta RED/GREEN reference
    to: PR-gate viability check references meta RED/GREEN principle
    trigger: edit adds RED/GREEN reference to PR-Gate Viability block
  - sc: SC-7
    from: inline copy lacks cross-reference to master file
    to: inline copy includes cross-reference comment to audit/reference/decomposition-criteria.md
    trigger: edit adds cross-reference comment
  - sc: SC-8
    from: decomposition check always evaluated
    to: decomposition check skipped when spec has exactly 1 SC AND 1 affected file
    trigger: edit adds skip-condition guard
  - sc: SC-9
    from: monolithic SC passes validate (not rejected by decomposition criteria)
    to: monolithic SC (single SC 'The system validates email format AND sends confirmation email', >1 affected file) returns FAIL with reason 'SC contains trigger words indicating multiple concerns'
    trigger: runtime validate execution rejects monolithic SC
  - sc: SC-10
    from: atomic SC acceptance not verified
    to: single atomic SC ('The system validates email format on registration', >1 affected file) returns PASS for decomposition criteria
    trigger: runtime validate execution accepts atomic SC
transition_summary:
  - All state changes occur within the single edit target validate.md (SC-1..SC-8 static content) and its runtime execution path (SC-9, SC-10 behavioral).
  - Skip-guard (SC-8) introduces a conditional state: decomposition criteria are evaluated only when the spec has MORE than 1 SC OR MORE than 1 affected file.
  - Degenerate inputs (zero SCs or zero affected files) are out of scope for the skip-guard per the Edge Case section.
