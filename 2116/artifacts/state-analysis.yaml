spec_path: .opencode/.issues/2116/spec.md
state_transitions:
  - sc: SC-1
    from_state: validate.md lacks decomposition criteria checklist
    to_state: validate.md includes inline decomposition criteria checklist (4 criterion headings)
    trigger: Edit validate.md adding checklist
  - sc: SC-2
    from_state: criteria expressed as prose guidance
    to_state: criteria expressed as imperative binary decision trees with PASS/FAIL branches
    trigger: Edit validate.md decision-tree format
  - sc: SC-3
    from_state: Atomicity check lacks trigger-word sub-check
    to_state: Atomicity check flags and/or/comma-separated lists as FAIL
    trigger: Edit validate.md Atomicity decision tree
  - sc: SC-4
    from_state: Binary Verifiability check lacks disjunctive-pattern sub-check
    to_state: Binary Verifiability check flags either/or/alternatively/one of as FAIL
    trigger: Edit validate.md Binary Verifiability decision tree
  - sc: SC-5
    from_state: Binary Verifiability check lacks vague-term sub-check
    to_state: Binary Verifiability check flags should/could/ideally/as appropriate as FAIL
    trigger: Edit validate.md Binary Verifiability decision tree
  - sc: SC-6
    from_state: PR-Gate Viability check lacks meta RED/GREEN reference
    to_state: PR-Gate Viability check references meta RED/GREEN principle
    trigger: Edit validate.md PR-Gate Viability decision tree
  - sc: SC-7
    from_state: inline copy lacks cross-reference comment
    to_state: inline copy includes cross-reference comment to master reference
    trigger: Edit validate.md adding cross-reference comment
  - sc: SC-8
    from_state: decomposition check always evaluated
    to_state: decomposition check skipped when spec has exactly 1 SC AND 1 affected file
    trigger: Edit validate.md adding skip-condition guard
  - sc: SC-9
    from_state: monolithic SC (AND-email) not rejected by decomposition check
    to_state: monolithic SC rejected with atomicity reason 'SC contains trigger words indicating multiple concerns'
    trigger: Behavioral test via with-test-home; clean-room sub-agent evaluates session.yaml
  - sc: SC-10
    from_state: atomic SC not accepted by decomposition check
    to_state: atomic SC accepted (PASS) for decomposition criteria
    trigger: Behavioral test via with-test-home; clean-room sub-agent evaluates session.yaml
state_notes: |
  All state transitions are single-file edits to validate.md (SC-1..SC-8) plus behavioral
  test verification (SC-9, SC-10). No cross-module state coupling. The skip-guard (SC-8)
  is a short-circuit that prevents evaluation for single-SC/single-file specs.
