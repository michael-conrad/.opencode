spec_path: .opencode/.issues/2116/spec.md
state_transitions:
  - sc: SC-1..SC-8, SC-11, SC-12
    concern: C1..C8, C11, C12
    before: validate.md lacks a 'Decomposition Criteria' section with the 6 spec-level criteria and their PASS/FAIL sub-checks.
    after: validate.md includes the complete inline Decomposition Criteria section enforcing the 6 criteria.
    trigger: Adding the inline checklist, decision-tree format, sub-checks, cross-reference comment, and skip guard to validate.md.
    verification_signal: >
      String-level: grep for criterion headings, PASS —/FAIL — branch tokens,
      trigger words, and cross-reference comment. All structural (string)
      evidence.
  - sc: SC-9
    concern: C9
    before: A monolithic SC (contains AND) with >1 affected file is not rejected by validate.
    after: The decomposition check returns FAIL for the atomicity/decomposition check (monolithic SC rejected), FAIL reason indicating multiple concerns / compound SC.
    trigger: Behavioral test submitting a monolithic-SC spec through validate via with-test-home.
    verification_signal: >
      behavioral: clean-room sub-agent evaluates session.yaml (SQLite DB export)
      for FAIL evidence in agent tool calls/decisions.
  - sc: SC-10
    concern: C10
    before: A single atomic SC with >1 affected file is (unspecified whether) accepted.
    after: The decomposition check accepts the atomic SC — no FAIL verdict; WARN acceptable pass-equivalent.
    trigger: Behavioral test submitting a single atomic-SC spec through validate via with-test-home.
    verification_signal: >
      behavioral: clean-room sub-agent evaluates session.yaml for PASS / no-FAIL
      evidence.
  - sc: SC-13
    concern: C13
    before: A ceremony SC (identical deliverable + verification method as prior SC, no new requirement) is not rejected.
    after: The decomposition check returns FAIL for the ceremony check, reason indicating ceremony / no new verification signal.
    trigger: Behavioral test submitting a two-SC spec where the 2nd SC is identical to the 1st.
    verification_signal: >
      behavioral: clean-room sub-agent evaluates session.yaml for FAIL evidence
      on the ceremony check.
  - sc: SC-14
    concern: C14
    before: A covered-by-prior SC (requirement set already entailed) is not rejected.
    after: The decomposition check returns FAIL for the coverage check, reason indicating coverage / duplicate / covered-by-prior.
    trigger: Behavioral test submitting a two-SC spec where the 2nd SC's requirement set is entailed by the 1st.
    verification_signal: >
      behavioral: clean-room sub-agent evaluates session.yaml for FAIL evidence
      on the coverage check.

state_machine_summary: >
  The spec's state transitions are entirely about the validate.md Decomposition
  Criteria enforcement behavior. Structural SCs transition the section from
  absent → present with complete binary decision trees; behavioral SCs transition
  the validate gate's runtime behavior for monolithic / atomic / ceremony /
  covered-by-prior SC submissions. No runtime or persistent state outside
  validate.md's instruction content is affected.
