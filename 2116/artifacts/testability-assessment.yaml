spec: .opencode/.issues/2116/issue.yaml

target_file: .opencode/skills/spec-creation/tasks/validate.md

evidence_types:
  - id: SC-1
    evidence_type: string
    verification_method: grep for each criterion in validate.md
    testable: true
    testability_note: |
      Greppable presence check: each of the 4 criteria (atomicity, single
      deliverable, binary verifiability, PR-gate viability) present in the
      Decomposition Criteria section.

  - id: SC-2
    evidence_type: string
    verification_method: grep for PASS/FAIL branching
    testable: true
    testability_note: |
      Greppable: each criterion uses imperative binary decision tree with explicit
      PASS/FAIL branches.

  - id: SC-3
    evidence_type: string
    verification_method: grep for trigger word sub-check
    testable: true
    testability_note: |
      Greppable: atomicity criterion includes trigger-word sub-check (and, or,
      comma-separated lists → FAIL).

  - id: SC-4
    evidence_type: string
    verification_method: grep for disjunctive and vague term sub-checks
    testable: true
    testability_note: |
      Greppable: binary verifiability includes disjunctive (either/or,
      alternatively, one of) and vague term (should, could, ideally, as
      appropriate) sub-checks, both → FAIL.

  - id: SC-5
    evidence_type: string
    verification_method: grep for RED/GREEN reference
    testable: true
    testability_note: |
      Greppable: PR-gate viability criterion references meta RED/GREEN principle.

  - id: SC-6
    evidence_type: string
    verification_method: grep for cross-reference
    testable: true
    testability_note: |
      Greppable: inline copy includes cross-reference comment "See
      audit/reference/decomposition-criteria.md for master definition".

  - id: SC-7
    evidence_type: string
    verification_method: grep for trigger condition
    testable: true
    testability_note: |
      Greppable: skip condition present (decomposition check skipped when spec
      has exactly 1 SC AND 1 affected file).

  - id: SC-8
    evidence_type: behavioral
    verification_method: opencode run with assertion
    testable: true
    testability_note: |
      Behavioral: submit spec with monolithic SC containing "and" to validate;
      assert FAIL with correct reason. Requires stderr-based behavioral assertion
      per enforcement-test mandate. Must exceed skip threshold to force EVALUATED
      state.

  - id: SC-9
    evidence_type: behavioral
    verification_method: opencode run with assertion
    testable: true
    testability_note: |
      Behavioral: submit spec with single atomic SC to validate; assert PASS for
      decomposition criteria. Inverse of SC-8. Must exceed skip threshold.

evidence_type_taxonomy_check:
  result: PASS
  note: |
    All string SCs use grep-based verification matching the `string` evidence
    type. SC-8 and SC-9 use opencode run with assertion matching the `behavioral`
    evidence type. No EVIDENCE_TYPE_MISMATCH detected.
