spec_path: .opencode/.issues/2116/spec.md
testability_assessment:
  - sc: SC-1
    evidence_type: string
    method: "grep for each of the 6 criterion headings `### Atomicity`, `### Single Deliverable`, `### Binary Verifiability`, `### PR-Gate Viability`, `### Ceremony`, `### Coverage / Covered-by-Prior` in validate.md — all 6 must match."
    testable: true
  - sc: SC-2
    evidence_type: string
    method: "grep for exact branch tokens `PASS —` and `FAIL —` in each of the 6 decision-tree blocks."
    testable: true
  - sc: SC-3
    evidence_type: string
    method: "grep for `and`, `or`, `comma-separated` within the Atomicity decision-tree block."
    testable: true
  - sc: SC-4
    evidence_type: string
    method: "grep for `either/or`, `alternatively`, `one of` within the Binary Verifiability block."
    testable: true
  - sc: SC-5
    evidence_type: string
    method: "grep for `should`, `could`, `ideally`, `as appropriate` within the Binary Verifiability block."
    testable: true
  - sc: SC-6
    evidence_type: string
    method: "grep for `RED` and `GREEN` within the PR-Gate Viability block."
    testable: true
  - sc: SC-7
    evidence_type: string
    method: "grep for `See audit/reference/decomposition-criteria.md for master definition` in validate.md."
    testable: true
  - sc: SC-8
    evidence_type: string
    method: "grep for `1 SC` and `1 affected file` within the skip-condition guard."
    testable: true
  - sc: SC-9
    evidence_type: behavioral
    method: >
      Two-SC pattern: artifact-only generator script at
      .opencode/tests-v2/behaviors/ runs a monolithic-SC spec through validate
      via with-test-home, generating session.yaml. Clean-room sub-agent reads
      session.yaml (SQLite DB export — PRIMARY evidence per tests-v2/AGENTS.md
      §2/§5a) and evaluates whether agent tool calls/decisions show the
      decomposition check returned FAIL (monolithic SC rejected), reason
      indicating multiple concerns / compound SC.
    testable: true
  - sc: SC-10
    evidence_type: behavioral
    method: >
      Two-SC pattern: artifact-only generator script submits a single atomic-SC
      spec; clean-room sub-agent evaluates session.yaml for PASS / no-FAIL
      verdict.
    testable: true
  - sc: SC-11
    evidence_type: string
    method: "grep for `### Ceremony` heading, `PASS —`/`FAIL —` branch tokens, and `prior SCs` within the Ceremony block."
    testable: true
  - sc: SC-12
    evidence_type: string
    method: "grep for `### Coverage / Covered-by-Prior` heading, `PASS —`/`FAIL —` branch tokens, and `prior SCs` within the Coverage block."
    testable: true
  - sc: SC-13
    evidence_type: behavioral
    method: >
      Two-SC pattern: artifact-only generator script submits a ceremony-SC spec
      (2nd SC identical to 1st, >1 affected file); clean-room sub-agent evaluates
      session.yaml for FAIL evidence on the ceremony check.
    testable: true
  - sc: SC-14
    evidence_type: behavioral
    method: >
      Two-SC pattern: artifact-only generator script submits a covered-by-prior
      spec (2nd SC's requirement set entailed by 1st, >1 affected file);
      clean-room sub-agent evaluates session.yaml for FAIL evidence on the
      coverage check.
    testable: true

summary: >
  10 of 14 SCs (SC-1..SC-8, SC-11, SC-12) are string-type, mechanically testable
  via grep on validate.md. 4 of 14 SCs (SC-9, SC-10, SC-13, SC-14) are behavioral,
  requiring new artifact-only generator scripts under .opencode/tests-v2/behaviors/
  and clean-room session.yaml evaluation. The behavioral evidence is the PRIMARY
  evidence type per tests-v2/AGENTS.md — all 14 SCs are testable.
