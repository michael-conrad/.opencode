# Dependency contract — issue #2116
# Regenerated by writing-plans research task from interface-compatibility.yaml dependency_contract (14 SCs).
variables:
  phase_2:
    type: bool
    description: "Add inline decomposition criteria checklist to validate.md with 6 criteria (atomicity, single deliverable, binary verifiability, PR-gate viability, ceremony, coverage / covered-by-prior), binary PASS/FAIL decision trees, sub-checks, cross-reference comment, and skip-guard — SC-1 through SC-8, SC-11, SC-12 (all string SCs target validate.md; SC-11/SC-12 also update the master reference file in lockstep)"
  behavioral_tests:
    type: bool
    description: "Add behavioral test scripts at .opencode/tests-v2/behaviors/ for SC-9, SC-10, SC-13, SC-14 (Two-SC pattern, artifact-only generators)"
preconditions:
  - "z3.Implies(behavioral_tests, phase_2)"
invariants: []
postconditions: []
phases:
  phase_2:
    files:
      - .opencode/skills/spec-creation/tasks/validate.md
      - .opencode/audit/reference/decomposition-criteria.md
    scs:
      - SC-1
      - SC-2
      - SC-3
      - SC-4
      - SC-5
      - SC-6
      - SC-7
      - SC-8
      - SC-11
      - SC-12
  behavioral_tests:
    files:
      - .opencode/tests-v2/behaviors/
    scs:
      - SC-9
      - SC-10
      - SC-13
      - SC-14
edges:
  - from: phase_2
    to: behavioral_tests
    rationale: "The decomposition check must exist in validate.md (phase_2) before its behavioral rejection/acceptance behavior can be tested (SC-9, SC-10, SC-13, SC-14)"
notes:
  - "All 14 SCs map to Phase 2 per the spec's Phase Mapping table. The dependency_contract splits Phase 2 into the validate.md content work (SC-1..SC-8, SC-11, SC-12) and the behavioral test scripts (SC-9, SC-10, SC-13, SC-14), which depend on the validate.md content being present."
  - "SC-11 and SC-12 (Ceremony and Coverage criteria) also update the master reference file .opencode/audit/reference/decomposition-criteria.md in lockstep per the maintainer note; the master reference is otherwise a satisfied external dependency (issue #2118, closed/merged)."
