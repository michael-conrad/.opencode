title: '[SPEC] Phase 2: Add decomposition criteria to spec-creation validate'
status: open
labels:
- approved-for-for_pr
body: '> **Full spec and artifacts: [`.opencode/.issues/2116/`](https://github.com/michael-conrad/.opencode/tree/issues-data/2116)**
  — this issue is a condensed exec summary; the authoritative spec lives in the `issues-data`
  branch.


  ## Problem


  spec-creation''s validate task does not check whether SCs are properly decomposed
  to atomic work units. Monolithic SCs pass through to plan creation and implementation,
  where defects are more expensive to fix. The current `validate.md` Step 3.3 "Compound-SC
  detection" flags conjunctions but does not enforce the 4 spec-level decomposition
  criteria defined in the master reference.


  ## Scope


  - Add a ''Decomposition Criteria'' section to `spec-creation/tasks/validate.md`
  with the 4 spec-level criteria: atomicity, single deliverable, binary verifiability,
  PR-gate viability

  - Each criterion in imperative binary decision-tree format with explicit PASS/FAIL
  branches

  - Atomicity trigger-word sub-check (and, or, comma-separated lists → FAIL)

  - Binary verifiability disjunctive-pattern sub-check (either/or, alternatively,
  one of → FAIL)

  - Binary verifiability vague-term sub-check (should, could, ideally, as appropriate
  → FAIL)

  - PR-gate viability check referencing the meta RED/GREEN principle

  - Cross-reference comment to the master reference file

  - Skip condition when spec has 1 SC AND 1 affected file

  - Two behavioral enforcement tests (monolithic ''and'' SC → FAIL; single atomic
  SC → PASS), each submitted with MORE than 1 affected file so the skip-guard does
  not fire and the decomposition criteria are always evaluated, verified via the Two-SC
  pattern (artifact-only generator script + clean-room session.yaml evaluation)


  **Out of scope:** `audit/tasks/spec-audit-evaluator.md` (Phase 3, #2117), `writing-plans/tasks/validate.md`
  (plan-level criteria, #2115), and any modification to the master reference file
  `audit/reference/decomposition-criteria.md`.


  ## Approach


  Edit `spec-creation/tasks/validate.md` to add a new ''Decomposition Criteria'' section
  after existing validation checks. The section is a structured checklist with binary
  PASS/FAIL branching, mirroring the criteria in the master reference file `audit/reference/decomposition-criteria.md`.
  Entry condition: skip if spec has 1 SC AND 1 affected file. Each criterion uses
  an imperative binary decision tree with explicit PASS/FAIL branches.


  The spec now satisfies the full 6-field preamble required by spec-structure-standards
  §1: Problem Statement, Root Cause/Motivation, Approach, plus the added Alternatives
  Considered & Why Discarded (3 approaches evaluated and rejected), Key Design Decisions
  (4 decisions with named tradeoffs), and User Intent / Original Prompt (original
  prompt not recorded; recorded intent stated). It also includes an Edge Cases section
  (spec-structure-standards §11) covering input boundaries, state transitions, failure
  modes, concurrency, and recovery, and a Recency-Check Evidence section verifying
  current file state and commit history of validate.md and decomposition-criteria.md.


  The spec explicitly defines an "atomic work unit" (a single concern that cannot
  be further decomposed without losing meaning, and that maps to exactly one deliverable
  and one verifiable outcome) as the granularity standard the four criteria enforce.
  All 10 success criteria carry precise, independently-reproducible expected values:
  string SCs specify the exact grep pattern/string to match; behavioral SCs (SC-9,
  SC-10) specify the exact expected output and are verified via the Two-SC pattern
  per tests-v2/AGENTS.md §6a — a behavioral test script (artifact-only generator)
  at `.opencode/tests-v2/behaviors/` generates session.yaml artifacts via `with-test-home`
  (exit 0, no in-script assertion), and a clean-room sub-agent evaluates session.yaml
  (the SQLite DB export — PRIMARY evidence per §2/§5a) for FAIL/PASS evidence. Specifically,
  SC-9 states that submitting a spec whose SC contains the conjunction `AND` (single
  SC `The system validates email format AND sends confirmation email`, MORE than 1
  affected file) returns FAIL with the atomicity reason `SC contains trigger words
  indicating multiple concerns`; SC-10 states that submitting a spec with a single
  atomic SC (single SC `The system validates email format on registration`, MORE than
  1 affected file) returns PASS for decomposition criteria. The spec includes the
  Requirements (§4) and Items (§5) sections required by spec-structure-standards,
  with R-1..R-10 mapping to SC-1..SC-10 and per-SC RED/GREEN/verify/commit items.


  ## Impact


  - **Risk:** Decomposition criteria could conflict with the existing Step 3.3 Compound-SC
  detection. *Mitigation:* New section operates as a distinct checklist; Step 3.3
  is retained for its distinct purpose (documented as a Key Design Decision).

  - **Risk:** Behavioral tests may be time-intensive. *Mitigation:* Two targeted behavioral
  test scripts (artifact-only generators) run via `with-test-home`, scope-limited;
  evaluation is delegated to clean-room sub-agents reading session.yaml.

  - **Risk:** Inline copy could drift from the master reference. *Mitigation:* Cross-reference
  comment points to the authoritative source; maintainer note governs synchronization.

  - **Risk:** Inline copy vs runtime import tradeoff. *Mitigation:* Self-contained
  inline copy chosen for clean-room dispatch; drift is auditable via the cross-reference
  comment.


  Key dependency: Phase 1 (#2118) master reference file — satisfied; `audit/reference/decomposition-criteria.md`
  exists on disk.


  🤖 Co-authored with AI: OpenCode (deepseek-v4-flash)


  '
