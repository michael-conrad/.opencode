testability_notes: >
  20 of 25 SCs are string (deterministic grep) evidence; 5 SCs are behavioral and MUST be
  executed via the with-test-home opencode run harness against a real model. Per the
  EVIDENCE_TYPE_MISMATCH gate, the 5 behavioral SCs MUST NOT be substituted with structural
  or string checks — a grep for 'and' is not behavioral evidence that the evaluator renders
  a FAIL verdict. The behavioral SCs are the runtime-observable verdict transitions of the
  evaluator and are classified as runtime-behavioral changes requiring behavioral evidence.
  Master-reference verify-only SCs (SC-11..SC-16, SC-25) are string because they assert
  static content presence, which the EVIDENCE_TYPE_MISMATCH gate permits as string.
