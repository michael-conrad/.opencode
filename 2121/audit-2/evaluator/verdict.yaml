bidirectional_findings:
  - criterion_id: "SC-6"
    finding_type: "SPEC_AMBIGUOUS"
    description: "SC-6 verification method's third sub-grep uses `^## Channel-Routing Table` but the actual heading is `^### Channel-Routing Table — Issue Comments vs. Chat Output` at line 1194. The other two sub-greps (Mandate Tiering ^##, Interaction Rule ^###) are correctly specified. The Channel-Routing sub-grep will return exit=1 (not found) even when the spec is correctly implemented. This is a verification-method regression introduced in round 2 (round 1 had no SC-6 defect)."
    revision_option: "Change SC-6 verification method's Channel-Routing sub-grep from `grep -qE \"^## Channel-Routing Table\"` to `grep -qE \"^### Channel-Routing Table\"`. Single-character fix (^## → ^### on the Channel-Routing line). The other two sub-greps are correctly specified and require no change."

  - criterion_id: "SC-3"
    finding_type: "SPEC_AMBIGUOUS"
    description: "SC-3 verification method uses the template placeholder '<key forbidden/required phrase>' for per-rule enumeration. 'Key' language is per-rule unconstrained, deferring the actual forbidden/required content to the implementor. The Rules to Move table enumerates the 123 source rules with target file paths, but does not enumerate the key forbidden/required language per rule."
    revision_option: "Augment the Rules to Move table with a per-rule 'key forbidden/required phrase' column. The 123 rules are already enumerated; the per-rule phrase column is the missing element. Alternatively, accept that the implementor extracts the key language from the source rule and include this as a Phase 1 deliverable, with the spec explicitly stating this is a Phase 1 task."

  - criterion_id: "SC-7"
    finding_type: "SPEC_AMBIGUOUS"
    description: "The Universal Rules to Keep table has 18 rows but only 11 unique rule-IDs. Four rows share the truncated header '[critical-rules-006] CRITICAL VIOLATION' and four share '[critical-rules-XXX] CRITICAL VIOLATION', each for a distinct rule. SC-7's verification method `grep -qE \"^### <header>\"` matches the truncated prefix, so it would pass if 1 of 4 critical-rules-006 rules was kept, instead of all 4. The disambiguation relies on human review, not the verification method."
    revision_option: "Either (a) use full unique headers in the Keep table (e.g., '[critical-rules-006] CRITICAL VIOLATION — Question-as-Authorization...') and have the verification method match the full line, or (b) require the SC-7 verification to check that all N critical-rules-006 variants are present, not just one."

  - criterion_id: "SC-8"
    finding_type: "SPEC_AMBIGUOUS"
    description: "SC-8 verification method has two unconstrained terms: 'token' (word? stem? lemma? n-gram?) and 'diff-check' (tooling?). The threshold (80%) is defined but the unit is not. An implementor cannot write a deterministic verification command without further specification. This is a substantive improvement over round 1's 'wc -l < 400' file-size metric (which was rejected per 091-incremental-build.md and 080-code-standards.md) but the new wording still represents incomplete specification."
    revision_option: "Define 'token' (e.g., 'word token after lowercasing and stopword removal') and name a specific tool (e.g., 'compute Jaccard similarity between title and body word sets' or 'manual review against a checklist')."

  - criterion_id: "SC-2 (phase mapping)"
    finding_type: "SPEC_INCOMPLETE"
    description: "SC-2 covers 'Read [ cross-references to preloaded guidelines' (12 body stubs in the source file). Phase 4 only explicitly addresses the 2 intro cross-references (SC-1). The 12 body stubs (SC-2) have no explicit phase for their removal. Round 1 had no SC-2, so this is a new orphan coverage introduced by the round-2 expansion."
    revision_option: "Add a sub-step to Phase 4 (or a new Phase 4.1) that addresses the 12 body stubs explicitly, e.g., 'Delete all body-level `Read [..] (guidelines/0..)` cross-references identified in the problem analysis'."

  - criterion_id: "Problem section '12 of 48'"
    finding_type: "SPEC_OUTDATED"
    description: "Problem section line 6 says '12 of the 48 `Read [` cross-references' but the actual total is 52, not 48. The '12' distinct preloaded count is correct, but the denominator '48' is wrong. Additionally, the SC-2 verification regex returns 18 line-matches, not 12 or 48. This is a spec-internal inconsistency in the spec text, not in the SC-2 verification method."
    revision_option: "Either correct Problem section to '12 of the 52' (factual) or '12 distinct preloaded cross-references' (clearer). The SC-2 verification regex result (18 line-matches) is correct as written; the spec text is what needs updating."

  - criterion_id: "Holistic gate"
    finding_type: "SPEC_INCOMPLETE"
    description: "Holistic gate FAILs on 5 of 11 dimensions (Implementability, Internal Consistency, Completeness, Testability, Escape Hatches, Provenance, Traceability). Internal Consistency and Testability FAILs are driven by R2-D1 (SC-6 verification regression). Provenance FAILs on the R2-D2 '12 of 48' claim. Per Step 4.4, the holistic status is DRAFT and the spec is returned for remediation before narrow criteria can drive a holistic PASS."
    revision_option: "Resolve R2-D1 (single-character regex fix), R2-D2 (spec text correction), and tighten SC-3/SC-7/SC-8 verification methods to restore Internal Consistency, Testability, Provenance, and Escape Hatches to PASS."

