round2_residual_defects:
  - defect_id: "R2-D1"
    defect_class: "verification_method_regression"
    severity: "blocking"
    description: "SC-6 verification method uses `grep -qE \"^## Channel-Routing Table\"` but the actual heading is `### Channel-Routing Table — Issue Comments vs. Chat Output` at line 1194 (level-3, not level-2). The grep returns exit=1 (not found) and the SC-6 verification will fail even when the spec is correctly implemented."
    evidence: "Verified by direct grep: `grep -nE \"^## Channel-Routing Table\" .opencode/guidelines/000-critical-rules.md` returns no output (exit=1). Actual: `grep -nE \"Channel-Routing\" .opencode/guidelines/000-critical-rules.md` returns `1194:### Channel-Routing Table — Issue Comments vs. Chat Output`."
    is_investigator_flag_real: true
    remediation: "Change SC-6 verification method to `grep -qE \"^### Channel-Routing Table\"` (level-3). The other two sub-greps are correctly specified (Mandate Tiering is level-2, Interaction Rule is level-3)."

  - defect_id: "R2-D2"
    defect_class: "spec_internal_inconsistency"
    severity: "advisory"
    description: "Problem section line 6 says '12 of the 48 `Read [` cross-references' but the actual total is 52, not 48. The '12' distinct preloaded count is correct, but the denominator '48' is wrong. Additionally, the SC-2 verification regex returns 18 line-matches, not 12 or 48."
    evidence: "Verified by Python regex extraction: total 'Read [' occurrences = 52; distinct preloaded 'Read [...](guidelines/0[0-9]+...)' cross-references = 12. SC-2 verification regex returns 18 line-matches (some lines have multiple preloaded refs)."
    is_investigator_flag_real: true
    remediation: "Either correct Problem section to '12 of the 52' (factual) or '12 distinct preloaded cross-references' (clearer). The SC-2 verification regex result (18 line-matches) is correct as written; the spec text is what needs updating."

  - defect_id: "R2-D3"
    defect_class: "sc7_ambiguous_header"
    severity: "advisory"
    description: "The Universal Rules to Keep table has 18 rows but only 11 unique rule-IDs. Four of the 18 rows share the truncated header '[critical-rules-006] CRITICAL VIOLATION' (each for a distinct rule with a unique full title). SC-7's verification method `grep -qE \"^### <header>\"` only matches the truncated prefix, which matches ALL 4 occurrences of the prefix. The verification would pass even if only 1 of the 4 critical-rules-006 rules was kept — the disambiguation relies on human review, not the verification method."
    evidence: "Verified by direct grep: `grep -nE \"^### \\[(critical-rules-006|critical-rules-XXX)\\] CRITICAL VIOLATION\" .opencode/guidelines/000-critical-rules.md` returns 8 lines (4 critical-rules-006, 4 critical-rules-XXX). The Keep table has 4 critical-rules-006 and 4 critical-rules-XXX rows, each for a distinct rule."
    is_investigator_flag_real: true
    remediation: "Either (a) use full unique headers in the Keep table (e.g., '[critical-rules-006] CRITICAL VIOLATION — Question-as-Authorization...') and have the verification method match the full line, or (b) require the SC-7 verification to check that all N critical-rules-006 variants are present, not just one."

  - defect_id: "R2-D4"
    defect_class: "sc3_open_ended_verification"
    severity: "advisory"
    description: "SC-3 verification method uses the template `<key forbidden/required phrase>` for per-rule enumeration. 'Key' language is per-rule unconstrained, deferring the actual forbidden/required content to the implementor. This is partially carried over from round 1's 'equivalent content' (also unconstrained), and is a softer defect than the round-1 'Remove or inline' ambiguity but still represents incomplete enumeration."
    evidence: "SC-3 verification method text: 'For each (source rule, target file) pair, run `grep -E \"\\[critical-rules-NNN|<key forbidden/required phrase>\" <target file>` and confirm a match'."
    is_investigator_flag_real: true
    remediation: "Augment the Rules to Move table with a per-rule 'key forbidden/required phrase' column, or replace the placeholder with a concrete per-rule enumeration. Alternatively, accept that the implementor extracts the key language from the source rule and include this as a Phase 1 deliverable."

  - defect_id: "R2-D5"
    defect_class: "sc8_undefined_unit"
    severity: "advisory"
    description: "SC-8 '≥80% token overlap' defines a threshold but leaves 'token' undefined. Verification method 'diff-check' is unspecified tooling. Both are softer than round-1's 'wc -l < 400' file-size metric (which was rejected per 091-incremental-build.md) but still represent incomplete specification."
