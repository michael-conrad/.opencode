      - "After stripping '...': 4 real words"
      - "Spec criterion: 'distinctive 5-10 word phrase'"
    impact: "This row violates the spec's own constraint. Either the phrase should be extended to ≥5 real words, or the spec should relax the 5-10 word constraint."
