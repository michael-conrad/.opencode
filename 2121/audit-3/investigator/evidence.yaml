    defect_class: "spec_inconsistency_internal_count_mismatch"
    description: "Files Affected section (line 212) and 'Total rules to move: 123' (line 146) both claim 123 rules moved. The actual Move table has 111 rows. 12 source rules (8 unique IDs) are missing from the Move table. After Move+Keep, 3 source IDs are fully unaccounted: [critical-rules-024] (Uncommitted/Unpushed Changes), [critical-rules-040] (Un-Squashed PR), [critical-rules-accountability-ownership]. 5 IDs are partially missing: [critical-rules-013] (3 missing), [critical-rules-018] (3 missing), [critical-rules-023] (1 missing), [critical-rules-036] (1 missing), [critical-rules-039] (1 missing)."
    evidence:
      - "Spec Files Affected line 212: '.opencode/guidelines/000-critical-rules.md — 123 rules removed; 18 universal rules preserved'"
      - "Spec line 146: 'Total rules to move: 123'"
      - "Move table: 111 rows (verified by row count)"
      - "Source file: 141 total `^### [critical-rules-` headers, 18 in Keep table, 111 in Move table, 12 unaccounted"
      - "Unaccounted IDs: critical-rules-024, critical-rules-040, critical-rules-accountability-ownership (fully absent); critical-rules-013, critical-rules-018, critical-rules-023, critical-rules-036, critical-rules-039 (partially absent)"
    impact: "The spec's stated totals (123 moved, 123 removed) cannot be achieved because the Move table enumerates only 111 rules. An implementor following the spec will leave 12 rules unaccounted for, violating the Files Affected promise of '123 rules removed'."
  R3_NEW_DEFECT_TRUNCATION_MARKERS_IN_PHRASES:
    severity: "BLOCKING"
    defect_class: "verification_method_unverifiable"
    description: "28 of 111 key phrases in the Rules to Move table contain literal '...' truncation markers. With `grep -F` (fixed-string mode, the verification method declared in SC-3), these truncated phrases will NEVER match the actual rule content in the target files. The trailing '...' is literal text in the phrase, not a wildcard."
    evidence:
      - "Example 1: 'Using stash+checkout means contaminating your workspace s...' — actual source rule body has 'workspace state.' (no truncation). grep -F will not match."
      - "Example 2: 'Implementing from memory means implementing from training...' — source body has 'training data' (likely). grep -F will not match."
      - "28 phrases contain '...' (25% of 111 rows)"
      - "Spot-check: 'Using stash+checkout means contaminating your workspace s...' against .opencode/skills/using-git-worktrees/SKILL.md returns 0 matches"
    impact: "SC-3 verification will FAIL for 28 of 111 rows when the implementor runs the verification command. The spec's 5-10 word phrase column cannot be machine-verified for these rows. An implementor must either (a) manually verify the phrase matches the actual content, or (b) replace the truncated phrases with the complete first 5-10 words of the source rule body."
  R3_NEW_DEFECT_OUT_OF_RANGE_PHRASE:
    severity: "ADVISORY"
    defect_class: "verification_constraint_violation"
    description: "1 of 111 key phrases ('Approving batches without understanding interdependencies...') has only 4 real words after stripping the literal '...' marker, violating the spec's own 5-10 word range requirement."
