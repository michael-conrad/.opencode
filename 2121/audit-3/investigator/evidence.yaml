    description: "Two of the six round-3 remediations (R2-D1 and R2-D2) were correctly applied per the user's dispatch context. R2-D4 and R2-D5 were substantively applied but with residual gaps (tokenization scheme for SC-8; fixed-string semantics for SC-7 require the implementor to construct the right pattern). R2-D3 and R2-D6 were applied but introduced new defects: the key phrase column has 28 truncation markers and 1 out-of-range phrase; the SC-2/Phase-1 mapping is misleading."

