      - "  - [critical-rules-013] Closing Issues Before PR Merge → git-workflow-cleanup/SKILL.md"
      - "  - [critical-rules-039] Process Gaps Are Bugs — completed issues not auto-closed → verification-before-completion/SKILL.md"
      - "  - [critical-rules-040] Un-Squashed PR — creating single-issue PR with multiple commits → git-workflow-pr/SKILL.md"
      - "  - [critical-rules-accountability-ownership] Accountability/Remediation Ownership Model → audit/SKILL.md"
    impact: "SC-3 verification will FAIL for 12 of 123 rows. The spec contains a placeholder that explicitly admits the rule's distinctive phrase could not be identified. Either (a) replace the placeholder with an actual distinctive phrase from the source rule body, or (b) define an alternative verification method for placeholder rows."
  R3B_NEW_3_UNCLOSED_BACKTICK_IN_PHRASE:
