    defect_class: "phrase_syntax_defect"
    description: "1 of 123 Move table key phrases (line 58) has an unclosed backtick: 'The `issue-operations` dispatcher resolves platform selection automatically based on `github.' The source rule body has the full phrase 'The `issue-operations` dispatcher resolves platform selection automatically based on `github.platform`.' but the Move table truncated the phrase mid-content. This is a residual truncation defect from R3-NEW-2 that the round 3b remediation did not catch."
