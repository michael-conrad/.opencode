round3b_introduced_defects:
  R3B_NEW_1_PHRASE_LENGTH_VIOLATES_SC3_CRITERION:
    severity: "BLOCKING"
    defect_class: "spec_internal_contradiction"
    description: "SC-3 criterion states 'distinctive full sentence (5-10 words)' (line 19) and line 30 states 'full 5-10 word distinctive sentence from the rule body'. However, 75 of 123 Move table phrases (61%) have word count > 10 (range 11-41 words). The replacement of truncated '...' phrases with full first sentences from rule bodies produced phrases that exceed the SC-3 length constraint."
    evidence:
      - "SC-3 criterion line 19: 'distinctive full sentence (5-10 words) that MUST appear in the target file'"
      - "Line 30: 'full 5-10 word distinctive sentence from the rule body'"
      - "Word count distribution of 123 Move table phrases:"
      - "  - '[no phrase found]' placeholder: 12 rows"
      - "  - 5 words: 2 rows (within range)"
      - "  - 6 words: 6 rows (within range)"
      - "  - 7 words: 4 rows (within range)"
      - "  - 8 words: 5 rows (within range)"
      - "  - 9 words: 8 rows (within range)"
      - "  - 10 words: 8 rows (within range)"
      - "  - 11 words: 2 rows (out of range)"
      - "  - 12 words: 4 rows (out of range)"
      - "  - 13 words: 7 rows (out of range)"
      - "  - 14 words: 11 rows (out of range)"
      - "  - 15-20 words: 19 rows (out of range)"
      - "  - 21-30 words: 25 rows (out of range)"
      - "  - 31+ words: 5 rows (out of range, max 41 words)"
    impact: "An implementor running the SC-3 verification will find that 75 of 123 rows have phrases exceeding the spec's own 5-10 word length constraint. The spec is internally contradictory: it defines a length constraint that 61% of the data violates. Either the constraint must be relaxed (e.g., '5-30 words' or 'a distinctive phrase') or the data must be trimmed to 5-10 words."
  R3B_NEW_2_MISSING_PHRASE_PLACEHOLDERS:
    severity: "BLOCKING"
    defect_class: "verification_method_unverifiable"
    description: "12 of 123 Move table key phrases are the literal string '[no phrase found]'. These placeholders indicate that the spec author could not identify a distinctive phrase for these source rules. With `grep -F '[no phrase found]' <target file>`, the verification will either fail (no match) or match unintended content (e.g., documentation discussing the placeholder). SC-3 verification cannot pass for these 12 rows."
    evidence:
      - "Placeholder rows (12 total):"
      - "  - [critical-rules-036] Inferring GitHub Owner from File Paths/Usernames → issue-operations/SKILL.md"
      - "  - [critical-rules-018] Pipeline-Scoped Authorization with Hard HALT at Scope Boundary → 010-approval-gate.md"
      - "  - [critical-rules-024] Uncommitted/Unpushed Changes After Implementation → finishing-a-development-branch/SKILL.md"
      - "  - [critical-rules-023] Hardcoded Identity Values in Skills and Guidelines → 080-code-standards.md"
      - "  - [critical-rules-018] Sub-issue Structure Bypass — multi-task plans → issue-operations-sub-issues/SKILL.md"
      - "  - [critical-rules-018] Sub-issue Linkage Verification — phase count mismatch → issue-operations-sub-issues/SKILL.md"
      - "  - [critical-rules-013] Sub-issue Closure Timing → git-workflow-cleanup/SKILL.md"
