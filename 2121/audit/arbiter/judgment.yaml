# Post-arbiter corrections (added 2026-07-25T00:50:00Z by orchestrator after user feedback)
post_arbiter_corrections:
  trigger: "user flagged that line/word counts are not valid measures for this work"
  meta_finding:
    severity: "structural"
    summary: "The spec treats document size metrics (line count, KB) as primary success criteria. Per .opencode/guidelines/091-incremental-build.md and 080-code-standards.md, document size metrics (word count, line count, token count, byte-dispatch formulas) are NOT valid proxies for implementation complexity. Implementation work is measured ONLY by whether tested verified correct code operations pass with 100% clean PASS. The spec's framing (compaction from 88KB to 15-20KB) is the wrong optimization target — compaction should be driven by enumerated duplicated/harmful content, not by file size."
  affected_artifacts:
    - id: "SC-8"
      current: "Final file size between 200-400 lines | structural | wc -l < 400"
      defect: "Evidence type is 'structural' (file size as a proxy). Structural evidence is insufficient for compaction SCs. The success of compaction is determined by whether each removed category is gone and each preserved category is present, not by line count."
      recommendation: "Replace SC-8 with behavior-equivalent criteria: 'No remaining cross-references to removed preloaded guidelines (SC-2)'; 'No remaining dark prose framing (SC-4)'; 'No remaining Why This Matters tables (SC-5)'. Drop the line-count target entirely. The final line count is whatever the result of these categorical removals is."
    - id: "Proposed Solution (Problem + Approach sections)"
      current: "'Compact the file to ~200-300 lines / ~15-20KB'"
      defect: "File size as optimization goal violates the project's complexity-measurement policy. The metric couples implementation correctness to file size, which is a non-causal proxy."
      recommendation: "Reframe the success criterion as: 'Each of the 5 duplication categories identified in the Problem section is removed; each of the 3 required tables and the enumerated ~15-20 universal rules are preserved.' Remove the KB and line-count targets."
    - id: "Internal Consistency dimension finding"
      correction: "The 200-300 vs 200-400 contradiction is real, but the deeper defect is that the spec is using a non-policy metric (line count) as a primary criterion. Resolving the contradiction is necessary but not sufficient — both targets should be replaced with categorical-absence criteria."
  audit_self_defect:
    summary: "The audit itself reported '1211 lines / 88KB' and 'wc -l < 400' as facts without flagging the metric-policy violation. The Investigator, Validator, Evaluator, and Arbiter all reproduced the size-as-criterion framing instead of categorizing it as a Tier 1 guideline violation. A complete re-audit is warranted after spec revision, and the audit's own evidence chain contains the same defect the spec contains."
  updated_remediation_actions:
    - "DROP SC-8 (line-count criterion) entirely. Replace with categorical-absence criteria derived from SC-1 through SC-5 (each removal is a behavioral/string SC; the absence of each removed category is the true success condition)."
    - "Reframe Problem and Proposed Solution to describe the categorical content to be removed, not the resulting file size. Remove the '88KB' and '15-20KB' targets from the problem statement."
    - "Add an explicit reference to .opencode/guidelines/091-incremental-build.md and 080-code-standards.md in the spec, noting that success is measured by content correctness, not file size."
    - "The audit verdict's failure count (13 of 25) is undercounted. The size-metric defect is a structural policy violation that should escalate the entire compaction approach from 'revise SCs' to 'rethink success criteria'."
  next_step: "remediate_holistic — reframe success criteria away from size metrics, then re-audit"
