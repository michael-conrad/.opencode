bidirectional_findings:
  - criterion_id: "SC-1"
    finding_type: "SPEC_AMBIGUOUS"
    description: "Criterion text references pre-compaction line numbers '(lines 9-10)' which become invalid after the compaction is complete. Verification timing issue: the SC is testing a property of the pre-state file using the post-state verification target."
    revision_option: "Remove 'lines 9-10' from the criterion. Replace with content-based description: 'Remove two intro cross-references pointing to AGENTS.md and the guidelines directory.'"
  - criterion_id: "SC-3"
    finding_type: "SPEC_AMBIGUOUS"
    description: "'Remove or inline' is an explicit either/or ambiguity. The implementor must choose between two distinct actions without guidance. The verification method depends on which action is taken."
    revision_option: "Replace with single action: 'Move skill-card-specific rules to target skill/task cards (no inlining).' Add an explicit enumeration table mapping each moved rule to its target card path."
  - criterion_id: "SC-7"
    finding_type: "SPEC_AMBIGUOUS"
    description: "'~15-20' is an open-ended range with 5-rule tolerance window. Verification method 'etc.' is an open-ended enumeration. Proposed Solution rule list ends with '...' indicating incompleteness. Three separate ambiguity sources for the same SC."
    revision_option: "Replace '~15-20' with a fixed count. Remove 'etc.' from verification method. Provide the complete list of required rule headers in both the criterion and the verification method."
  - criterion_id: "SC-8"
    finding_type: "SPEC_AMBIGUOUS"
    description: "Direct contradiction between Proposed Solution '~200-300 lines' and SC-8 '200-400 lines'. The 100-line upper-bound discrepancy is a soft contradiction in target scope. Verification method 'wc -l < 400' only checks the upper bound."
    revision_option: "Either tighten SC-8 to 'between 200-300 lines' (matching Proposed Solution) or loosen Proposed Solution to '~200-400 lines' (matching SC-8). Add a lower-bound check to the verification method."
  - criterion_id: "SC-9"
    finding_type: "SPEC_AMBIGUOUS"
    description: "Term 'redundant subsections' is undefined. What makes a subsection redundant? Phase 4 says 'where the rule header is self-explanatory' but 'self-explanatory' is also subjective. No quantitative threshold or checkable pattern."
    revision_option: "Define 'redundant' explicitly: e.g., 'subsections whose body contains no content not present in the rule header.' Provide a checkable criterion (presence/absence pattern, word-count threshold, or content-overlap test)."
  - criterion_id: "SC-10"
    finding_type: "SPEC_AMBIGUOUS"
    description: "Behavioral SC requires 'equivalent content' with no enumeration of moved rules and no definition of 'equivalent'. Cannot write a behavioral test without both an enumeration and an equivalence definition."
    revision_option: "Add an explicit enumeration of moved rules (table or appendix). Define 'equivalent content' as a checkable threshold (e.g., 'the moved rule's full prose minus pure framing is present verbatim in the target card')."
  - criterion_id: "SC-DET"
    finding_type: "SPEC_INCOMPLETE"
    description: "Determinism gate FAILs across 5 SCs (SC-3, SC-7, SC-8, SC-9, SC-10). Two reasonable auditors cannot independently produce the same PASS/FAIL for any of these SCs in their current form."
    revision_option: "See individual SC remediation guidance. All 5 SCs require content updates to remove ambiguity and enable deterministic verification."
  - criterion_id: "SC-PRESCRIPTIVE-CODE"
    finding_type: "SPEC_OVERSPECIFIED"
    description: "Two prescriptive code references found: '(lines 9-10)' line number and 'Read [the authoritative list](AGENTS.md)' markdown link. Spec should use file area references only."
    revision_option: "Remove '(lines 9-10)' from SC-1 criterion. Remove or replace the markdown link pattern in SC-1 verification method with a content-only grep pattern."
  - criterion_id: "SC-REASONING"
    finding_type: "SPEC_AMBIGUOUS"
    description: "Two internal contradictions: (1) Proposed Solution '~200-300 lines' vs SC-8 '200-400 lines' size target discrepancy. (2) Proposed Solution rule list ends with '...' while SC-7 verification uses 'etc.' — both indicate incomplete rule enumeration."
    revision_option: "Resolve the 200-300 vs 200-400 contradiction (see SC-8). Provide the complete list of rules in Proposed Solution line 17 (remove the '...' open-ended marker)."
  - criterion_id: "research_adequacy.evidence_provenance"
    finding_type: "SPEC_INCOMPLETE"
    description: "4 unsupported factual assertions in Problem and root cause: '1211 lines / 88KB', '74 occurrences' (dark prose), '10 tables' (Why This Matters), '~20+ rules' (skill-card-specific). All four lack tool-call evidence."
    revision_option: "Add tool-call evidence (e.g., `wc -l`, `grep -c`, `ls -la`) to a Research/Evidence section in the spec. Or run the commands during spec-creation and cite the output verbatim."
  - criterion_id: "research_adequacy.investigation_breadth"
    finding_type: "SPEC_INCOMPLETE"
    description: "No alternatives considered. The 'compact to ~200-300 lines' approach is presented as the only option. Alternative approaches (archive, split, leave-as-is) are not discussed."
    revision_option: "Add an 'Alternatives Considered' section to the spec. For each alternative, list why it was discarded. Standard alternatives for this kind of refactoring: (1) leave file as-is, (2) split into multiple smaller files, (3) move to a separate reference document loaded on-demand, (4) keep but de-prioritize via metadata."
  - criterion_id: "research_adequacy.recency_check"
    finding_type: "SPEC_OUTDATED"
    description: "No commit history review cited. The 1211-line/88KB size claim is not anchored to a commit SHA or date. If 000-critical-rules.md has been modified since the claim was made, the count may be stale."
    revision_option: "Add a commit SHA and date for the version of 000-critical-rules.md the claims refer to. Re-run `wc -l` and `wc -c` against the current file before implementation to verify the claim is still accurate."
  - criterion_id: "gap_analysis.missing_coverage"
    finding_type: "SPEC_INCOMPLETE"
    description: "5 SCs (SC-3, SC-7, SC-8, SC-9, SC-10) have no boundary condition testing. No test for the case where 000-critical-rules.md is already shorter than 200 lines (SC-8 lower bound). No test for the case where skill/task card target files do not exist yet (SC-10 dependency)."
    revision_option: "Add boundary condition SCs or expand existing SC verification methods to cover: (1) SC-8 lower-bound failure case, (2) SC-10 target file existence precondition, (3) SC-7 'exactly N' rather than '~N' rules."
  - criterion_id: "gap_analysis.implicit_conditions"
    finding_type: "SPEC_INCOMPLETE"
    description: "3 implicit preconditions not stated: (1) all referenced skill/task card target files exist and are writable, (2) the '~20+ rules that are only relevant when a specific skill is dispatched' set is identifiable and enumerated, (3) skill/task cards can absorb the moved rules without exceeding their own size budgets."
    revision_option: "Add a 'Preconditions' or 'Assumptions' section to the spec listing all implicit preconditions explicitly. Verify each precondition during spec-creation by running the relevant tool calls."
  - criterion_id: "scope_narrowness.systemic_implication"
    finding_type: "SPEC_INCOMPLETE"
    description: "Systemic implication: similar verbosity may exist in other preloaded guidelines (010, 020, 060, 065, 067, 075, 080, 090, 091, 117, 130). The spec addresses only 000-critical-rules.md; if the same problem exists in the other 11 preloaded files, a true root-cause fix would address the preloaded instructions array as a whole."
    revision_option: "Either (1) add explicit 'out of scope' note acknowledging that the other 11 guidelines may have the same problem, or (2) create a follow-up spec for guideline compaction across the preloaded instructions array."

