    note: >
      SC-8's RED (behavioral comparison) depends on SC-1 through SC-6 output from Phases 1-4.
      This is a forward dependency (Phase 5 depends on earlier phases), not a backward one.
      Rule violation requires Y > X. Here X=5, Y=[1,2,3,4] so Y < X → NOT a violation.
