## Dependency DAG

dependency_dag:
  edges:
    - from: 1
      to: 2
      reason: >
        All phases modify 010-approval-gate.md (removing different sections). Sequential
        commit ordering required to prevent merge conflicts in the shared source file.
    - from: 2
      to: 3
      reason: >
        Sequential commit ordering on 010-approval-gate.md (shared source file for section removals).
    - from: 3
      to: 4
      reason: >
        Phase 4 targets approval-gate/SKILL.md (same target as Phase 1). Must execute after
        Phase 1-3 to ensure correct append-ordering in the shared target file and clean
        sequencing in the shared source file 010-approval-gate.md.
    - from: 4
      to: 5
      reason: >
        Phase 5 verification requires all 6 section moves from Phases 1-4 to be complete before
        SC-7 (keep sections remain), SC-8 (no content loss), and SC-9 (no orphaned refs) can
        produce meaningful results.
  structural_conflicts:
    - file: .opencode/guidelines/010-approval-gate.md
      phases: [1, 2, 3, 4]
      note: All 4 move phases remove distinct sections from this file — sequential commits required
    - file: .opencode/skills/approval-gate/SKILL.md
      phases: [1, 4]
      note: Phases 1 and 4 both append to this file — Phase 4 must follow Phase 1

