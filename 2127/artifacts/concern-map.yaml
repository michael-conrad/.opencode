description: >
  Maps each section of 020-go-prohibitions.md to the concern it addresses.
  Sections marked for removal are flagged with their disposition.

sections:
  - section: "§1 (core) — What GO Is Not & Self-Authorization Prohibitions"
    lines: 9-77
    concern: >
      Defines what constitutes valid authorization, what does not,
      and the behavioral prohibitions around solicitation, prompting,
      and self-authorization. 22 unique rules.
    disposition: KEEP
    evidence_of_duplication: null

  - section: "§1.1 Orchestrator Context Discipline"
    lines: 80-135
    concern: >
      Context management patterns: orchestrator holds routing metadata only,
      sub-agents get generous context, result contracts are frugal.
    disposition: REMOVE
    evidence_of_duplication: >
      Duplicated in 000-critical-rules.md lines 563 (Orchestrator Context Lean)
      and 568 (Result Contract Frugality). The three-mandate structure
      (Orchestrator Context Lean, Sub-Agent Context Generosity, Result Contract
      Frugality) is operational bookkeeping, not enforcement.

  - section: "§1.2 Interpretive Questions"
    lines: 137-144
    concern: >
      Interpretive questions (why, what does) are explanation-only,
      never modification authorization.
    disposition: MERGE_INTO_S1
    evidence_of_duplication: >
      Unique rule — not duplicated in 000 or 065. Only 3 lines of
      substantive content. Merge as additional bullet in §1.

  - section: "Authorization-Free Actions"
    lines: 148-162
    concern: >
      Actions that do not require authorization: issue creation,
      sub-issues, labels, lint/format, feature branches (with scope).
    disposition: KEEP
    evidence_of_duplication: null

  - section: "for_analysis Scope — Self-Assignment Rules"
    lines: 164-193
    concern: >
      Default floor scope, self-assignment conditions, branch restrictions,
      observe/ branch rules.
    disposition: KEEP
    evidence_of_duplication: null

  - section: "§1 (continued) — scope clarification, verb-prefix parsing, ALWAYS DO"
    lines: 195-243
    concern: >
      GO scope clarification, verb-prefix parsing table, 7 unique ALWAYS DO
      items (verify codebase state, HALT at scope boundary, parse authorization
      phrases, halt produces status, search before halt, scope-limited behavioral
      testing), plus 10 duplicated ALWAYS DO items.
    disposition: KEEP_UNIQUE_REMOVE_DUPLICATED
    evidence_of_duplication: >
      Lines 214-250 contain 10 ALWAYS DO items duplicated in 000 and 065:
      inline work, poisoned pipeline, discard on failure, edit-in-place,
      continue waiver, cost-blind, test substitution, remediate before escalate,
      PRELOADED_CONTEXT_REJECTED, submodule-only PR.

  - section: "§1.5 Soliciting Authorization"
    lines: 245-267
    concern: >
      Asking for confirmation after receiving pipeline-scoped authorization
      is a CRITICAL VIOLATION. Verb-prefix parsing table, prohibited patterns,
      required behaviors.
    disposition: COLLAPSE_INTO_S1
    evidence_of_duplication: >
      Unique rule (1 sentence) is the core. The rest (verb-prefix restatement,
      tables, cross-references) is restatement of approval-gate skill content.
      Collapse unique rule into §1 as bullet.

  - section: "§1.6 Discussion Mode Mandates"
    lines: 269-298
    concern: >
      Discussion mode rules: no question tool, no pigeon-holing, no topic
      mixing, no structured output by default, live tool calls, research
      card catalogue. 11 unique items.
    disposition: KEEP
    evidence_of_duplication: >
      3 lines (live tool call, training data, metadata) duplicated in 065.
      Remove those 3; keep remaining 11 unique items.

  - section: "§2 Iterative Feedback & Plan Revision"
    lines: 300-306
    concern: >
      Discussion sessions do not grant GO, GO must be explicit, revise/update
      are plan-only, plan revision invalidates approvals.
    disposition: KEEP
    evidence_of_duplication: null

  - section: "§3 Specialized Execution Gates"
    lines: 308
    concern: Empty section header.
    disposition: KEEP_EMPTY
    evidence_of_duplication: null

  - section: "§4 Node.js Prohibition in Python/Java Projects"
    lines: 310-343
    concern: >
      Node.js-specific prohibition: never install Node.js in Python/Java
      projects, never use NPX, never add npm dependencies.
    disposition: REPLACE
    evidence_of_duplication: >
      Duplicated in 070-environment.md lines 224-257. The spec proposes
      replacing with a general .tools/ rule that covers all project-local
      tooling, not just Node.js.

  - section: "§4.5 Project-Local Tool Installation Pattern"
    lines: 345-358
    concern: >
      Exception path to §4: .tools/<tool>/ pattern, gitignored, PATH-prefixed,
      system-isolated, cleanable.
    disposition: REPLACE
    evidence_of_duplication: >
      Content is already in 085-project-local-tools.md. The spec proposes
      merging §4 and §4.5 into a single general .tools/ rule.

  - section: "§5 Multi-task Plan Without Sub-issues"
    lines: 362-383
    concern: >
      Multi-task plans must have sub-issues before implementation.
      Sub-issues at phase level, single-task exemption, auto-creation.
    disposition: REMOVE
    evidence_of_duplication: >
      Sub-issue model is obsolete — plans are files in a spec folder.
      Sub-issue logic is implemented in skills (issue-operations-sub-issues,
      approval-gate-scope). The guideline is a historical artifact.

  - section: "§6 Progressive Iterative Implementation"
    lines: 385-397
    concern: >
      Rollback on verification failure using checkpoint tags.
      Pre-rollback diagnostics, git reset --hard, re-dispatch.
    disposition: REMOVE
    evidence_of_duplication: >
      Duplicated in 000-critical-rules.md (Checkpoint Rollback Exception).

  - section: '"stop" command section'
    lines: 399-413
    concern: >
      "stop" triggers terminal halt — zero output, zero tool calls,
      zero proposals. Hard state transition.
    disposition: REMOVE
    evidence_of_duplication: >
      Duplicated in 000-critical-rules.md (critical-rules-stop).

  - section: "Critical-rules-XXX entries (bottom of file)"
    lines: 415-658
    concern: >
      Individual critical violation entries: Offer-to-Edit Bypass,
      Authorization-Free Actions, Confirmation ≠ Authorization,
      Feedback ≠ Authorization, Silent Agent Termination, Inline Screening,
      Silent Halt Without Prompt, Inline Work, DISPATCH_GATE Checkpoint,
      Orchestrator Inline Work, Discard on Sub-Agent Failure, Tool-Recipe
      Task, Gate Non-Waiver, Skill Pre-Read, Preloading Context, Universal
      Re-Task, Orchestrator Context Lean, Result Contract Frugality,
      Canonical Dispatch String, Revision-Not-Replacement, No-Inline-Fix,
      Terminology Standardization, Channel-Routing Table.
    disposition: KEEP
    evidence_of_duplication: >
      These are the enforcement-level entries that cross-reference 000 and 065.
      They are NOT duplicated — they are the 020-specific enforcement layer
      that references the rules in 000/065. Removing them would lose the
      020-specific framing.
