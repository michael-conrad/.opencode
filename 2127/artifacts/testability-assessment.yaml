test_implementation_notes:
  - note: "String tests (SC-1 through SC-12, SC-14, SC-15)"
    implementation: >
      Simple grep-based assertions. Can be run as a shell script
      that greps for each pattern and exits with non-zero if any
      pattern is found (for absence tests) or not found (for
      presence tests).
    recommended_approach: >
      Single bash script with per-pattern grep assertions.
      No opencode run needed.

  - note: "Behavioral test (SC-13)"
    implementation: >
      Requires clean-room sub-agent dispatch. The sub-agent receives
      the pre-compaction 020 content and the current 000/065 content,
      and produces a PASS/FAIL verdict per removed rule.
    recommended_approach: >
      Use `opencode run` with a prompt that asks the agent to compare
      removed content against 000/065 equivalents. Assert via
      assert_semantic that the agent correctly identifies all
      equivalents.

  - note: "Cross-reference test (SC-14)"
    implementation: >
      grep across .opencode/ for each removed section name. Confirm
      no matches in 020-go-prohibitions.md. Matches in 000/065 are
      expected.
    recommended_approach: >
      Single bash script with per-name grep assertions, excluding
      020-go-prohibitions.md from the negative assertion.

  - note: "Regression risk"
    risk: >
      The critical-rules-XXX entries at the bottom of 020 reference
      §1.1 (lines 563, 568, 639). If these are not updated, they
      will contain broken cross-references.
    mitigation: >
      Include cross-reference update in Phase 1. Verify with SC-14.
