  6 Progressive Iterative Implementation | string |\n| SC-3 | Remove \"stop\" command\
  \ section | string |\n| SC-4 | Remove Channel-Routing Table | string |\n| SC-5 |\
  \ Remove 3 restated ALWAYS DO lines | string |\n| SC-6 | \xA71.2 merged into \xA7\
  1 as bullet | string |\n| SC-7 | \xA71.5 collapsed into \xA71 | string |\n| SC-8\
  \ | \xA74 replaced with general `.tools/` rule | string |\n| SC-9 | All keep sections\
