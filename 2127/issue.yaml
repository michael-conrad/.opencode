body: "---\nremote_issue: 2127\nremote_url: https://github.com/michael-conrad/.opencode/issues/2127\n\
  ---\n\n> **Full spec and artifacts: [`.opencode/.issues/2127/`](https://github.com/michael-conrad/.opencode/tree/issues-data/.opencode/.issues/2127/)**\
  \ \u2014 this issue is a condensed exec summary; the authoritative spec lives in\
  \ the `issues-data` branch.\n>\n> **Local artifacts:** `.opencode/.issues/2127/`\
  \ \u2014 implementation plan, card catalogue, dependency contracts, research, designs,\
  \ audit findings\n\n## Intent and Executive Summary\n\n- **Intent**: Compact `020-go-prohibitions.md`\
  \ by removing content duplicated in `000-critical-rules.md`, removing an obsolete\
  \ sub-issue model, and replacing a Node.js-specific prohibition with a general `.tools/`\
  \ rule.\n- **Problem Statement**: `020-go-prohibitions.md` is ~659 lines. Live verification\
  \ reveals the ACTUAL duplication is limited to: \xA76 Progressive Iterative Implementation\
  \ (restates 000's Checkpoint Rollback Exception), the \"stop\" command section,\
  \ and the Channel-Routing Table. \xA75 contains an obsolete sub-issue model. There\
  \ is internal duplication (3 restated ALWAYS DO lines). Content previously claimed\
  \ as duplicated (\xA71.1, live tool call lines, cost-blind lines, 10 ALWAYS DO items)\
  \ is actually unique to 020.\n- **Approach Chosen**: Remove verified-duplicated\
  \ sections, remove obsolete \xA75, remove internally-duplicated lines, collapse\
  \ adjacent sections, replace Node.js-specific rule with general `.tools/` rule.\
  \ Keep all unique-to-020 content.\n\n## All-or-Nothing SC Enforcement Gate\n\nAll\
  \ SCs MUST pass before the implementation is considered complete. A single FAIL\
  \ blocks the entire change.\n\n## Requirements\n\n| ID | Requirement | Evidence\
  \ Type |\n|----|------------|---------------|\n| REQ-1 | Remove \xA75 Multi-task\
  \ Plan Without Sub-issues | string |\n| REQ-2 | Remove \xA76 Progressive Iterative\
  \ Implementation | string |\n| REQ-3 | Remove \"stop\" command section | string\
  \ |\n| REQ-4 | Remove Channel-Routing Table | string |\n| REQ-5 | Remove 3 restated\
  \ ALWAYS DO lines | string |\n| REQ-6 | \xA71.2 merged into \xA71 as bullet | string\
  \ |\n| REQ-7 | \xA71.5 collapsed into \xA71 | string |\n| REQ-8 | \xA74 replaced\
  \ with general `.tools/` rule | string |\n| REQ-9 | All keep sections remain | string\
  \ |\n| REQ-10 | No content loss \u2014 removed sections verified as duplicated in\
  \ 000 | semantic |\n| REQ-11 | No orphaned cross-references to removed section names\
  \ | string |\n| REQ-12 | No line-count or word-count metrics used as success measurement\
  \ | string |\n| REQ-13 | Remove duplicate Node.js Prohibition section from 070-environment.md\
  \ (lines 224-257) | string |\n\n## Traceability\n\n| Requirement | Success Criterion\
  \ | Implementation Plan Phase |\n|------------|------------------|--------------------------|\n\
  | REQ-1 | SC-1 | Phase 1 |\n| REQ-2 | SC-2 | Phase 1 |\n| REQ-3 | SC-3 | Phase 1\
