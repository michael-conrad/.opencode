title: '[SPEC] Compact 067-context-completeness.md — remove teaching material, collapse
  duplicate sections'
status: open
labels:
- spec
body: "---\nremote_issue: 2130\nremote_url: https://github.com/michael-conrad/.opencode/issues/2130\n\
  labels: [spec]\n---\n\n## Intent and Executive Summary\n\n**Problem Statement:**\
  \ `067-context-completeness.md` (150 lines) contains structural redundancy — duplicate\
  \ rule statements, teaching material, and verbose decision tables — that degrades\
  \ agent compliance by reducing rule density in sub-agent context windows.\n\n**Root\
  \ Cause/Motivation:** The guideline was written for human readability (explanatory\
  \ tables, illustrative examples, cross-reference prose) without accounting for AI-agent\
  \ consumption where every line competes for limited sub-agent context. Two copies\
  \ of the same rule (\"read ALL comments\") create ambiguity about which is authoritative.\
  \ Teaching material (Why This Matters, Examples, Relationship to Other Critical\
  \ Rules) displaces enforceable rule content.\n\n**Approach Chosen:** Targeted compaction:\
  \ collapse duplicate sections, remove teaching material, replace verbose tables\
  \ with concise statements. Keep all enforceable rule content (Zero Tolerance, Scope\
  \ of Resources, Evidence Requirement, Staleness Rule, FORBIDDEN/REQUIRED, Related\
  \ Guidelines).\n\n**Alternatives Considered & Why Discarded:**\n- Partial compaction\
  \ (keep shortened versions): Rejected — partial tables imply some misses are unimportant.\n\
  - Condense to prose: Rejected — the table format is the problem, not the content.\n\
  - No compaction: Rejected — duplicate Core Principle is a real defect.\n\n**Key\
  \ Design Decisions:**\n- Teaching material is identified by function (explain/justify/illustrate),\
  \ not by format.\n- Cross-reference sections are split: explanatory prose (Relationship\
  \ to Other Critical Rules) is removed; compact reference list (Related Guidelines)\
  \ is kept.\n- Compliance is enforced structurally (behavioral tests, pre-commit\
  \ hooks), not motivationally.\n\n**Cost-Benefit Justification:** The compaction\
  \ removes 50+ lines of explanatory content to eliminate a concrete defect (duplicate\
  \ authoritative rule) and increase rule density for sub-agents. The cost is lost\
  \ explanatory context for human readers and sub-agents loading this guideline in\
  \ isolation. The benefit is unambiguous rule authority (one \"read ALL comments\"\
  \ statement) and higher rule-to-noise ratio in sub-agent context windows. For sub-agents\
  \ that load this guideline, every line of teaching material is a line that could\
  \ carry an enforceable rule — the compaction trades explanatory depth for enforcement\
  \ clarity. This tradeoff is justified because: (1) the duplicate rule is a real\
  \ defect that causes agent confusion, (2) behavioral tests and pre-commit hooks\
  \ enforce compliance structurally, and (3) the Related Guidelines section preserves\
  \ cross-reference navigation in compact form.\n\n## Problem\n\n`067-context-completeness.md`\
  \ (150 lines) contains structural redundancy that degrades agent compliance. Three\
  \ distinct problems:\n\n1. **Duplicate content**: Core Principle (## Core Principle\
  \ section) restates Zero Tolerance (## Zero Tolerance Rule section) with identical\
  \ wording (\"read ALL comments\", \"body/description alone is NEVER sufficient context\"\
  ). Two copies of the same rule in the same file create ambiguity about which is\
  \ authoritative — agents may treat one as binding and the other as advisory.\n\n\
  2. **Teaching material displaces rule density**: Why This Matters table (## Why\
  \ This Matters section), Examples table (### Examples subsection), and Relationship\
  \ to Other Critical Rules section (## Relationship to Other Critical Rules section)\
  \ explain, illustrate, or cross-reference the rule rather than stating it. For sub-agents\
  \ that load this guideline, every line of teaching material is a line that could\
  \ carry an enforceable rule. The guideline's purpose is to govern agent behavior\
  \ — not to educate the agent about why the rule exists.\n\n3. **Verbose decision\
  \ tables**: When This Applies table (## When This Applies section) is an 8-row decision\
  \ table that can be expressed as a single sentence with one exception clause. The\
  \ table format adds visual noise without adding rule content.\n\n## Proposed Solution\n\
  \n### Operational Definition of \"Teaching Material\"\n\n\"Teaching material\" means\
  \ content whose primary function is to explain, justify, illustrate, or cross-reference\
  \ a rule — not to state, enforce, or define the rule itself. Teaching material is\
  \ identified by:\n- **Explanatory framing**: \"Why This Matters\", \"This is consistent\
  \ with...\", \"This guideline complements...\"\n- **Illustrative examples**: Tables\
  \ showing hypothetical scenarios (Examples table), decision matrices with no normative\
  \ force\n- **Cross-reference catalogs**: Lists of related guidelines that do not\
  \ modify the rule's enforcement\n- **Redundant restatement**: Content that repeats\
  \ a rule already stated in the same file with identical normative force\n\nTeaching\
  \ material is not inherently harmful — it helps human readers. But for AI-agent-facing\
  \ text where every line competes for limited sub-agent context, teaching material\
  \ directly reduces rule density. The compaction removes teaching material only where\
  \ the rule is already stated unambiguously elsewhere in the same file.\n\n### Remove\
  \ (teaching material):\n\n| Section | Location | Rationale |\n|---|---|---|\n| Why\
  \ This Matters table | ## Why This Matters section | Explanatory — illustrates consequences\
  \ of non-compliance. Rule already stated in Zero Tolerance. |\n| Examples table\
  \ | ### Examples subsection | Illustrative — shows hypothetical scenarios for Staleness\
  \ Rule. Rule already stated with De Minimis Bound. |\n| Relationship to Other Critical\
  \ Rules | ## Relationship to Other Critical Rules section | Cross-reference catalog\
  \ — lists related rules without modifying enforcement. Agents with full context\
  \ already have these cross-references loaded. |\n\n### Collapse:\n\n| Section |\
  \ Action |\n|---|---|\n| Core Principle (## Core Principle section) | Merge into\
  \ Zero Tolerance — same rule, same wording. The merged section retains the Core\
  \ Principle's scope language (\"reviewing, auditing, or taking any action\") as\
  \ elaboration within Zero Tolerance, not as a separate section. |\n\n### Replace:\n\
  \n| Section | Current | Replacement |\n|---|---|---|\n| When This Applies table\
  \ (## When This Applies section) | 8-row decision table | One sentence: \"Before\
  \ any action on a resource, read all comments. Exception: passive reading (no subsequent\
  \ action) does not require comment reading.\" |\n\n### Keep:\n\n- Zero Tolerance\
  \ Rule (with Core Principle merged in)\n- Scope of Resources table (PR review comments\
  \ clarification is critical)\n- Evidence Requirement + COUNTS/NOT\n- Staleness Rule\
  \ + Significant Actions list + De Minimis Bound + Single Exchange Window\n- FORBIDDEN/REQUIRED\n\
  - Related Guidelines section (distinct from Relationship to Other Critical Rules\
  \ — Related Guidelines at ## Related Guidelines section is a compact reference list,\
  \ not teaching material)\n\n### Distinction: Related Guidelines vs. Relationship\
  \ to Other Critical Rules\n\nThe file has two cross-reference sections:\n- **Relationship\
  \ to Other Critical Rules** (## Relationship to Other Critical Rules section): Prose\
  \ paragraphs explaining how this guideline relates to each referenced rule. This\
  \ is teaching material — it explains rather than enforces.\n- **Related Guidelines**\
  \ (## Related Guidelines section): A compact bullet list of guideline names with\
  \ one-line descriptions. This is reference material — it tells sub-agents where\
  \ to find related rules without explaining them.\n\n**Action**: Remove Relationship\
  \ to Other Critical Rules (teaching material). Keep Related Guidelines (reference\
  \ material).\n\n### Scope Analysis: critical-rules-012 Cross-References\n\nThe file\
  \ contains two `critical-rules-012` entries (### [critical-rules-012] sections at\
  \ the bottom of the file) in the critical violations section at the bottom. These\
  \ are enforcement blocks that reference `067-context-completeness.md` and `issue-operations`\
  \ skill. These entries are NOT affected by the compaction — they reference the guideline\
  \ by name, not by section structure. The compaction does not rename or remove the\
  \ guideline's identity.\n\n**Staleness Rule subsections**: The Staleness Rule (##\
  \ Staleness Rule section) contains three subsections: the main rule, Significant\
  \ Actions Requiring Re-Read (### Significant Actions Requiring Re-Read subsection),\
  \ and De Minimis Bound (### De Minimis Bound subsection). All three are kept. The\
  \ Single Exchange Window (## Single Exchange Window section) is also kept as a separate\
  \ subsection.\n\n## Success Criteria\n\n| ID | Criterion | Evidence Type | Verification\
  \ Method |\n|----|-----------|---------------|---------------------|\n| SC-1 | Core\
  \ Principle content merged into Zero Tolerance — the phrase \"read ALL comments\"\
  \ appears exactly once in the file (in the merged Zero Tolerance section), not twice\
  \ | string | grep -c for 'read ALL comments' returns 1 |\n| SC-2 | Why This Matters\
  \ table removed | string | grep for absence of 'Why This Matters' |\n| SC-3 | When\
  \ This Applies table replaced with one-sentence exception containing \"passive reading\"\
  \ | string | grep for 'passive reading' returns exactly 1 match |\n| SC-4 | Examples\
  \ table removed | string | grep for absence of 'Resource last read' |\n| SC-5 |\
  \ Relationship to Other Critical Rules section removed | string | grep for absence\
  \ of 'Relationship to Other Critical Rules' |\n| SC-6a | Zero Tolerance, Scope of\
  \ Resources, Evidence Requirement, Staleness Rule (including Significant Actions,\
  \ De Minimis Bound, Single Exchange Window), FORBIDDEN/REQUIRED, and Related Guidelines\
  \ all remain with same content | string | diff each section against original; verify\
  \ no content changes |\n| SC-6b | Zero Tolerance, Scope of Resources, Evidence Requirement,\
  \ Staleness Rule (including Significant Actions, De Minimis Bound, Single Exchange\
  \ Window), FORBIDDEN/REQUIRED, and Related Guidelines remain in same position relative\
  \ to each other | string | grep for each section header; verify order preserved\
  \ |\n| SC-6c | Zero Tolerance, Scope of Resources, Evidence Requirement, Staleness\
  \ Rule (including Significant Actions, De Minimis Bound, Single Exchange Window),\
  \ FORBIDDEN/REQUIRED, and Related Guidelines remain at same heading level (##) |\
  \ string | grep for each section header at ## level; verify all at ## |\n\n**Enforcement\
  \ Gate:** All SCs MUST pass before the change is complete. If any SC fails, the\
  \ change is reverted.\n\n## Implementation Plan\n\n- [ ] 1. **Collapse Core Principle\
  \ into Zero Tolerance**\n  - Edit `.opencode/guidelines/067-context-completeness.md`:\
  \ Remove the ## Core Principle section header and body. Merge the scope language\
  \ \"reviewing, auditing, or taking any action\" into the ## Zero Tolerance Rule\
  \ section as elaboration.\n  - Verify: `grep -c 'read ALL comments'` returns exactly\
  \ 1.\n\n- [ ] 2. **Remove Why This Matters, Examples, Relationship to Other Critical\
  \ Rules**\n  - Edit `.opencode/guidelines/067-context-completeness.md`: Delete the\
  \ ## Why This Matters section (header + table + blank lines). Delete the ### Examples\
  \ subsection (header + table + blank lines). Delete the ## Relationship to Other\
  \ Critical Rules section (header + prose + blank lines).\n  - Verify: grep for absence\
  \ of 'Why This Matters', 'Resource last read', 'Relationship to Other Critical Rules'.\n\
  \n- [ ] 3. **Replace When This Applies table with one-sentence exception**\n  -\
  \ Edit `.opencode/guidelines/067-context-completeness.md`: Replace the ## When This\
  \ Applies section (header + 8-row table) with: \"Before any action on a resource,\
  \ read all comments. Exception: passive reading (no subsequent action) does not\
  \ require comment reading.\"\n  - Verify: `grep -c 'passive reading'` returns exactly\
  \ 1.\n\n- [ ] 4. **Verify all keep sections remain with same content (SC-6a), same\
  \ position (SC-6b), and same heading level (SC-6c)**\n  - Run `diff` on each keep\
  \ section against original to verify no content changes.\n  - Run `grep` for each\
  \ keep section header to verify order preserved.\n  - Run `grep` for each keep section\
  \ header at ## level to verify all at ##.\n\n## Documentation Sources\n\n- `.opencode/guidelines/067-context-completeness.md`\
  \ — Authoritative source guideline being compacted. Verified by read tool at session\
  \ start.\n\n## Files Affected\n\n- `.opencode/guidelines/067-context-completeness.md`\
  \ — compacted\n\n## Risks\n\n1. **Semantic loss from collapsing Core Principle**:\
  \ The Core Principle uses broader scope language (\"reviewing, auditing, or taking\
  \ any action\") while Zero Tolerance uses narrower phrasing (\"Acting on\"). Merging\
  \ them must preserve the broader scope. If the merge produces text that only covers\
  \ \"Acting on\", agents may not apply the rule to reviewing and auditing. **Mitigation**:\
  \ The merged section explicitly includes the broader scope language.\n\n2. **Reduced\
  \ agent compliance from removing Why This Matters**: The table concretely shows\
  \ what gets missed and the consequence. Removing it may reduce agent motivation\
  \ to follow the rule. **Mitigation**: The rule is enforced by pre-commit hooks and\
  \ behavioral tests — not by agent motivation. Compliance is structural, not motivational.\n\
  \n3. **Sub-agent context loss from removing Relationship to Other Critical Rules**:\
  \ Sub-agents that load this guideline in isolation may not know about related rules\
  \ (Verification Honesty, Bug Discovery, Authority Source). **Mitigation**: The Related\
  \ Guidelines section (kept) provides the same cross-references in a more compact\
  \ format. Sub-agents with full context already have these cross-references loaded\
  \ from the guidelines index.\n\n4. **Duplicate \"read ALL comments\" phrase if Core\
  \ Principle merge is incomplete**: If the merge leaves residual text containing\
  \ \"read ALL comments\" in the old Core Principle location, SC-1 will fail. **Mitigation**:\
  \ SC-1 explicitly tests for a single occurrence.\n\n## Edge Cases\n\n1. **Collapsing\
  \ Core Principle creates duplicate \"read ALL comments\" phrase**: If the merge\
  \ is done as a simple deletion of the Core Principle section header without removing\
  \ the body text, the phrase \"read ALL comments\" appears twice. **Resolution**:\
  \ The merge must remove the entire Core Principle section (header + body) and incorporate\
  \ its scope language into Zero Tolerance. SC-1 catches this.\n\n2. **Removing Why\
  \ This Matters reduces agent compliance**: Agents that previously saw the consequence\
  \ table may be less motivated to read comments. **Resolution**: Compliance is enforced\
  \ by behavioral tests and pre-commit hooks, not by motivational content. If behavioral\
  \ tests show regression, the table can be restored in a condensed form.\n\n3. **Sub-agents\
  \ need Relationship section for cross-reference context**: Sub-agents loading this\
  \ guideline in isolation lose the prose explanation of how each related rule connects.\
  \ **Resolution**: The Related Guidelines section (kept) provides the same cross-references.\
  \ Sub-agents that need deeper context can read the referenced guidelines directly.\n\
  \n4. **When This Applies replacement loses nuance**: The 8-row table distinguishes\
  \ between different action types (reviewing, acting, checking, responding, creating,\
  \ reporting, reading). A one-sentence replacement may lose this granularity. **Resolution**:\
  \ The exception clause (\"passive reading does not require comment reading\") captures\
  \ the only meaningful distinction. All other rows are covered by \"before any action\
  \ on a resource.\"\n\n5. **Examples table removal loses staleness illustration**:\
  \ The table shows concrete scenarios for when re-reading is required. **Resolution**:\
  \ The Staleness Rule text and De Minimis Bound already state the rule unambiguously.\
  \ The examples are illustrative, not normative.\n\n## Alternatives Considered\n\n\
  1. **Partial compaction (keep Why This Matters but shorten it)**: Keep the table\
  \ but reduce it to 2-3 rows covering the most critical misses (authorization, direction\
  \ change). **Rejected**: The table's value is completeness — a partial table implies\
  \ some misses are unimportant. Either keep all rows or remove the table entirely.\n\
  \n2. **Keep Why This Matters but condense to prose**: Replace the table with 1-2\
  \ sentences explaining why comment reading matters. **Rejected**: The table format\
  \ is the problem (visual noise), not the content. Prose would be shorter but still\
  \ teaching material.\n\n3. **Keep Relationship to Other Critical Rules but condense\
  \ it**: Reduce from 3 bullet points to 1 sentence. **Rejected**: The section's purpose\
  \ is explanatory — any version of it is teaching material. The Related Guidelines\
  \ section already provides the cross-references.\n\n4. **Keep When This Applies\
  \ table but reduce rows**: Keep only the most common actions. **Rejected**: The\
  \ one-sentence replacement with exception clause is strictly better — it covers\
  \ all cases with fewer lines.\n\n5. **No compaction at all**: Leave the file as-is.\
  \ **Rejected**: The duplicate Core Principle is a real defect that causes agent\
  \ confusion. The teaching material reduces rule density for sub-agents.\n\n## Dependencies\n\
  \n- None.\n\n---\n\n## Change Control\n\n| Date | Change | Reason | Author |\n|------|--------|--------|--------|\n\
  | 2026-07-31 | Revised spec: reframed Problem statement (semantic/behavioral justification),\
  \ substantiated all claims with operational definitions, defined SCs operationally\
  \ (SC-1/SC-3/SC-6), expanded scope analysis (critical-rules-012, Staleness Rule\
  \ subsections, Related Guidelines vs Relationship distinction), replaced Risks escape\
  \ hatch with honest assessment, added teaching material definition, added Alternatives\
  \ Considered, added Edge Cases | Spec-audit FAIL — 8 of 11 holistic dimensions failed\
  \ | OpenCode (deepseek-v4-flash) |\n| 2026-07-31 | Fixed heading name: \"Relationship\
  \ to Other Guidelines\" → \"Relationship to Other Critical Rules\" throughout spec.\
  \ Split SC-6 into SC-6a (content preservation), SC-6b (position preservation), SC-6c\
  \ (heading level preservation). Updated Phase 4 to reference SC-6a/SC-6b/SC-6c.\
  \ | Validation found 2 defects: wrong heading name and compound SC-6 | OpenCode\
  \ (deepseek-v4-flash) |\n| 2026-07-31 | Added Intent and Executive Summary preamble\
  \ with cost-frame justification. Replaced all line number references with stable\
  \ section header anchors. Added Documentation Sources section. Added enforcement\
  \ gate statement. Converted phases to checklist format with actionable sub-items.\
  \ | Re-audit found 7 narrow structural failures | OpenCode (deepseek-v4-flash) |\n\
  \n---\n\n\U0001F916 Co-authored with AI: OpenCode (deepseek-v4-flash)\n"
