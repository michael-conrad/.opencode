spec: .opencode/.issues/2131/spec.md
description: Interface boundaries between affected modules and compatibility analysis
dependency_contract:
  phases:
    - phase: 1
      description: Generalize Parsing Logic Changes and Libraries & Packages sections
      depends_on: []
      provides:
        - generalized-parsing-logic
        - generalized-libraries-packages
    - phase: 2
      description: Move Enforcement Test Mandate to test-driven-development skill card
      depends_on:
        - generalized-parsing-logic
        - generalized-libraries-packages
      provides:
        - enforcement-test-mandate-moved
    - phase: 3
      description: Remove Behavioral RED/GREEN section; verify Test Integrity Mandate stays
      depends_on:
        - enforcement-test-mandate-moved
      provides:
        - behavioral-red-green-removed
        - test-integrity-verified
    - phase: 4
      description: Verify all keep sections remain intact
      depends_on:
        - behavioral-red-green-removed
        - test-integrity-verified
      provides:
        - all-keep-sections-verified
interfaces:
  - source: .opencode/guidelines/080-code-standards.md
    destination: .opencode/skills/test-driven-development/SKILL.md
    type: CONTENT_MOVE
    description: Enforcement Test Mandate section moves from 080 to test-driven-development skill card
    compatibility_checks:
      - check: Section header compatibility
        status: COMPATIBLE
        detail: The section header "Enforcement Test Mandate" is a generic heading that fits naturally in a skill card about test-driven development
      - check: Cross-reference compatibility
        status: REQUIRES_UPDATE
        detail: Cross-references in the moved section that point to 080 or 000 must be updated to point to correct locations in the destination file
      - check: Content duplication
        status: REQUIRES_MERGE_CHECK
        detail: Before moving, check if test-driven-development/SKILL.md already has an Enforcement Test Mandate section. If present, merge and deduplicate.
  - source: .opencode/guidelines/080-code-standards.md
    destination: .opencode/guidelines/000-critical-rules.md
    type: CROSS_REFERENCE
    description: 080's Behavioral RED/GREEN section has a cross-reference to 000; 000 has a cross-reference to 080
    compatibility_checks:
      - check: Cross-reference staleness after removal
        status: REQUIRES_UPDATE
        detail: After removing Behavioral RED/GREEN section from 080, any cross-references in 080 that pointed to the removed section must be updated. 000's cross-reference to 080 (line 922) points to the section that will be removed — this cross-reference must be updated to point to the moved Enforcement Test Mandate in test-driven-development/SKILL.md.
  - source: .opencode/guidelines/080-code-standards.md
    destination: .opencode/guidelines/080-code-standards.md (self)
    type: INTERNAL_RESTRUCTURE
    description: Sections within 080 are generalized, moved, or removed; keep sections remain intact
    compatibility_checks:
      - check: Section ordering after changes
        status: COMPATIBLE
        detail: Removed sections leave gaps in numbering; adjacent keep sections are not affected. No reordering needed.
      - check: Cross-reference integrity within 080
        status: REQUIRES_AUDIT
        detail: Internal cross-references within 080 that pointed to removed sections must be updated or removed
