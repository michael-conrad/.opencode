domain: compaction-workflow
types:
  - name: phase
objects:
  - name: phase-1
    type: phase
  - name: phase-2
    type: phase
  - name: phase-3
    type: phase
  - name: phase-4
    type: phase
fluents:
  - name: done
    params:
      - name: p
        type: phase
actions:
  - name: complete-phase
    params:
      - name: p
        type: phase
    preconditions:
      - done(p)
    effects:
      - done(p)
init:
  - done(phase-1)
  - done(phase-2)
  - done(phase-3)
  - done(phase-4)
goals:
  - done(phase-1)
  - done(phase-2)
  - done(phase-3)
  - done(phase-4)
