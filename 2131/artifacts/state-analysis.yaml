spec: .opencode/.issues/2131/spec.md
description: State transitions required by each success criterion
states:
  - id: ST-1
    name: Pre-compaction state
    description: 080-code-standards.md contains all sections (project-specific, testing procedure, duplicated content, keep sections). test-driven-development/SKILL.md has no Enforcement Test Mandate section.
    files:
      - .opencode/guidelines/080-code-standards.md
      - .opencode/skills/test-driven-development/SKILL.md
  - id: ST-2
    name: Generalized state (Phase 1)
    description: Parsing Logic Changes and Libraries & Packages sections generalized to universal language. All other sections unchanged.
    transition_from: ST-1
    scs:
      - SC-1
      - SC-2
      - SC-7
    verification:
      - grep for absence of project-specific paths/names
      - semantic analysis of generalized text
  - id: ST-3
    name: Moved state (Phase 2)
    description: Enforcement Test Mandate section moved from 080 to test-driven-development/SKILL.md. 080 no longer has the section; destination has it.
    transition_from: ST-2
    scs:
      - SC-3
      - SC-8
    verification:
      - grep for section in destination
      - semantic analysis of moved content
  - id: ST-4
    name: Removed state (Phase 3)
    description: Behavioral RED/GREEN section removed from 080. Test Integrity Mandate verified to remain in 080.
    transition_from: ST-3
    scs:
      - SC-4
      - SC-5
      - SC-9
    verification:
      - grep for absence of removed section
      - grep for presence of Test Integrity Mandate
      - semantic analysis of constraint preservation
  - id: ST-5
    name: Verified state (Phase 4)
    description: All keep sections verified to remain in 080 with content intact. Compaction complete.
    transition_from: ST-4
    scs:
      - SC-6
    verification:
      - grep for each keep section header
      - semantic analysis comparing before/after content
  - id: ST-FAIL
    name: Lobotomization detected
    description: Behavioral enforcement test fails after move/removal — constraint loss detected. Revert and investigate.
    transition_from: ST-3 or ST-4
    trigger: Phase 3.5 lobotomization gate
    action: Revert the move/removal that caused the failure, investigate root cause, re-evaluate replacement text
