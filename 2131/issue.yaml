body: '# [SPEC] Compact 080-code-standards.md — generalize project-specific rules,
  move testing procedure to skill card


  > Full spec and plan artifacts: https://github.com/michael-conrad/.opencode/tree/issues-data/2131/


  ## Implementation Status


  **IMPLEMENTED — COMPLETED via PR #2238.**


  This spec was implemented and completed by PR #2238 (branch `feature/2131-compact-080`,
  merged to `main` on 2026-08-03, merge commit `98a6098a`). The compaction of `080-code-standards.md`
  proposed by this spec — generalizing project-specific references (REQ-1), moving
  the Enforcement Test Mandate to the `test-driven-development` skill card (REQ-2),
  removing the Behavioral RED/GREEN section (REQ-3), keeping the Test Integrity Mandate
  in 080 (REQ-4), and retaining all universal keep sections (REQ-5) — was fully executed
  by that PR. All 9 success criteria (SC-1 through SC-9) were verified **PASS**. The
  issue is closed as **completed**.


  This spec is a valid, actionable spec that was implemented — it is NOT obsolete
  and was NOT based on a false premise.


  ## Problem


  `080-code-standards.md` conflates multiple concerns in a single file: project-specific
  rules (parsing pipeline, ConfigurationManager), testing procedure that belongs in
  the `test-driven-development` skill card, and sections duplicated in `000-critical-rules.md`
  (Behavioral RED/GREEN). The file''s sprawl is a symptom of missing concern boundaries,
  not a size problem.


  ## Scope


  - Generalize project-specific references in Parsing Logic Changes and Libraries
  & Packages to universal language (REQ-1)

  - Move the Enforcement Test Mandate from 080 to the `test-driven-development` skill
  card (REQ-2)

  - Remove the Behavioral RED/GREEN section from 080, with normative content preserved
  in the moved Enforcement Test Mandate (REQ-3)

  - Keep the Test Integrity Mandate in 080 (REQ-4)

  - Keep all universal keep sections in 080 with content intact (REQ-5)


  **Out of scope:**

  - Full rewrite of 080 from scratch

  - Splitting 080 into multiple separate files

  - Removing any normative content without a destination that preserves it


  ## Approach


  Compaction of `080-code-standards.md` driven by concern-boundary enforcement rather
  than file size. Project-specific references (parsing pipeline, ConfigurationManager,
  NLTK) are generalized to universal language. The Enforcement Test Mandate testing
  procedure is moved to the `test-driven-development` skill card. The Behavioral RED/GREEN
  section, which restates the Enforcement Test Mandate, is removed with its normative
  content preserved in the moved section. Every move/removal is gated by semantic
  analysis verifying no constraint loss (SC-7, SC-8, SC-9), plus a lobotomization
  gate running behavioral enforcement tests before and after. Test Integrity Mandate
  stays in 080 because only a summary exists in 000.


  ## Impact


  - **Risk — content loss:** Removed section''s normative content must be preserved
  in the moved Enforcement Test Mandate. *Mitigation:* SC-4, SC-9 verify removal is
  safe via string + semantic evidence.

  - **Risk — lobotomization during move:** Moving content between files can silently
  drop constraints. *Mitigation:* Phase 3.5 lobotomization gate runs behavioral tests;
  SC-7, SC-8, SC-9 provide semantic verification of constraint preservation.

  - **Risk — cross-reference staleness:** Internal cross-references in 080 may point
  to removed sections. *Mitigation:* SC-9(c) requires cross-reference audit.


  **Dependencies:** None. **Call to action:** Closed as completed — all 9 SCs verified
  PASS via PR #2238.

  '
