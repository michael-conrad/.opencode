# Concern Map — Issue 2132
# Decompose success criteria into concern groups, each mapped to a phase boundary.
# Phase boundaries from spec Implementation Plan: Phase 1 (revise), Phase 2 (verify absence), Phase 3 (verify presence/scope).

concerns:
  - name: content_revision
    description: >-
      Revise the guideline file in place: preserve all existing rules verbatim, remove the 4
      project-specific references, add the 6 new data integrity categories, update cross-references.
    phase: Phase 1
    scs: [SC-1, SC-2, SC-3, SC-4, SC-5, SC-6, SC-7, SC-8, SC-9]
    items: [Item 1, Item 2, Item 3, Item 4, Item 5, Item 6, Item 7, Item 8, Item 9]

  - name: absence_verification
    description: >-
      Verify that all project-specific references are removed from the revised file (absence check).
    phase: Phase 2
    scs: [SC-2]
    items: [Item 2]

  - name: presence_verification
    description: >-
      Verify that all 6 category sections exist and cover their required concepts in the revised file
      (presence and scope checks).
    phase: Phase 3
    scs: [SC-1, SC-4, SC-5, SC-6, SC-7, SC-8, SC-9]
    items: [Item 1, Item 4, Item 5, Item 6, Item 7, Item 8, Item 9]

  - name: behavioral_enforcement
    description: >-
      Behavioral and semantic verification that agent runtime behavior conforms to the data integrity
      rules: refuses synthetic data (SC-10), raises ValueError on missing required data (SC-11),
      derives entity references dynamically (SC-12), preserves specific failure-mode rules (SC-13).
    phase: Phase 1 (rule content) + post-revision verification
    scs: [SC-10, SC-11, SC-12, SC-13]
    items: [Item 10, Item 11, Item 12, Item 13]

phase_boundaries:
  Phase 1: content revision (R-1 through R-7)
  Phase 2: absence verification gate (SC-2, R-7) — verification only, no removal
  Phase 3: presence and scope verification (SC-1, SC-4 through SC-9, R-1 through R-6)

dependency_notes: >-
  Phase 2 and Phase 3 both depend on Phase 1 and are independent of each other (disjoint
  verification sets). Phases 2 and 3 run sequentially after Phase 1 in either order; neither may
  be skipped.
