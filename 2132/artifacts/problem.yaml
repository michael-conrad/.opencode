# Problem YAML — Issue 2132
# Models phase execution for the dependency contract: phase_1 must complete before phase_2 and phase_3.
# Goals: all three phases complete.

domain: data-integrity-guideline-revision

types:
  - name: phase

objects:
  - name: phase_1
    type: phase
  - name: phase_2
    type: phase
  - name: phase_3
    type: phase

fluents:
  - name: phase_done
    params:
      - name: p
        type: phase

actions:
  - name: complete_phase
    params:
      - name: p
        type: phase
    preconditions:
      - not phase_done(p)
    effects:
      - phase_done(p)

init: []

goals:
  - phase_done(phase_1)
  - phase_done(phase_2)
  - phase_done(phase_3)
