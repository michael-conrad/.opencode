      - SC-5
      - SC-6
      - SC-7
      - SC-8
      - SC-9
    skill_task_selection:
      - step: verify
        skill: verification-before-completion
        dispatch: "execute verify task from verification-before-completion"

dependency_dag:
  edges:
    - from: phase_1
      to: phase_2
      rationale: "File must be revised (Phase 1) before its absence of project-specific references can be verified (Phase 2)"
    - from: phase_1
      to: phase_3
      rationale: "The 6 category sections must exist (Phase 1) before their presence and scope can be verified (Phase 3)"
  notes:
    - "Phases 2 and 3 both depend on Phase 1 and are independent of each other (disjoint verification sets). They run sequentially after Phase 1 in either order; neither may be skipped."
    - "Behavioral SCs (SC-10, SC-11, SC-12) and semantic SC-13 are created as rule content in Phase 1 and verified post-revision via opencode run (with-test-home) and a clean-room sub-agent respectively."

