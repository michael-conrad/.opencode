  ---


  ## Problem


  `090-data-integrity.md` contains narrow data processing pipeline failure modes from
  a specific project (PubMed XML pipeline). These rules are project-specific and don''t
  cover general data integrity concerns that apply across projects: validation at
  system boundaries, serialization integrity, data classification, migration integrity,
  audit trails, data retention.


  ## Proposed Solution


  Revise the file: preserve the specific battle-tested rules (no synthetic data, fail
  fast, no hardcoded IDs, batch ops, tqdm, cross-references) and add the broader 6-category
  framework as new sections.


  ### New Structure


  1. **Data validation at system boundaries** — validate structure, types, and constraints
  when data enters or exits the system. No unvalidated data crosses a boundary. Missing
  required data is a validation failure, not a processing branch. All entity references
  must be resolved dynamically from validated sources.


  2. **Serialization integrity** — all serialized formats must be versioned. Backward
  compatibility required. No silent format changes. Every data transformation must
  be traceable to its source.


  3. **Data classification** — classify data by sensitivity (PII, internal, public,
  production). Production data has restricted access. No tests against production
  data. No synthetic/fabricated data in any classification.


  4. **Migration integrity** — all data migrations must be reversible. Verify source
  against target before deployment. No unreviewed transformations. Sample before recommending
  schema changes.


  5. **Audit trail** — every data mutation must be traceable to its source and authorization.
  No silent data changes. All format changes require documented authorization.


  6. **Data retention** — define retention policies per classification. No data persists
  beyond its retention window without review.


  ### Existing Rules Superseded


  | Existing Rule | Superseded By |

  |---|---|

  | No synthetic/fabricated data | Data validation at boundaries + Data classification
  |

  | Fail fast on missing fields | Data validation at boundaries |

  | Verify before recommend (sampling) | Migration integrity |

  | No unauthorized semantic changes | Serialization integrity + Audit trail |

  | Production data protection | Data classification |

  | No hardcoded entity IDs | Data validation at boundaries |

  | Batch ops (pagination, parameter limits) | Data validation at boundaries |

  | tqdm | Preserved — operational rule for batch progress tracking |

  | Cross-reference to 200-errors.md | Preserved — navigation aid for error handling
  rules |


  > **Note:** All other existing rules are preserved and supplemented by the broader
  categories, not replaced.


  ## Requirements


  | ID | Requirement | Source |

  |----|-------------|--------|

  | REQ-1 | Data validation at system boundaries — validate structure, types, and
  constraints when data enters or exits the system | Proposed Solution §1 |

  | REQ-2 | Serialization integrity — all serialized formats must be versioned with
  backward compatibility and traceability | Proposed Solution §2 |

  | REQ-3 | Data classification — classify data by sensitivity (PII, internal, public,
  production) with restricted access for production data | Proposed Solution §3 |

  | REQ-4 | Migration integrity — all data migrations must be reversible with source-to-target
  verification before deployment | Proposed Solution §4 |

  | REQ-5 | Audit trail — every data mutation must be traceable to its source and
  authorization | Proposed Solution §5 |

  | REQ-6 | Data retention — define retention policies per classification; no data
  persists beyond its retention window without review | Proposed Solution §6 |

  | REQ-7 | Preserve existing specific rules — no synthetic data, fail fast, no hardcoded
  IDs, batch ops, tqdm, cross-references | Proposed Solution (Existing Rules Superseded)
  |


  ## Success Criteria


  | ID | Criterion | Evidence Type | Verification Method |

  |----|-----------|---------------|---------------------|

  | SC-1 | File contains 6 data integrity categories | string | grep for each category
  header |

  | SC-2 | No remaining project-specific references (pubmed_data_2, SEED_PM_IDS, MeSH,
  discovery_date) | string | grep for absence of each |

  | SC-3 | Existing specific rules preserved (no synthetic data, fail fast, no hardcoded
  IDs, batch ops, tqdm, cross-references) | string | grep for each preserved rule
  |

  | SC-4 | Data validation at boundaries covers structure, types, constraints, missing
  data, entity resolution | string | grep for each concept |

  | SC-5 | Serialization integrity covers versioning, backward compat, traceability
  | string | grep for each concept |

  | SC-6 | Data classification covers sensitivity levels, production data restrictions
  | string | grep for each concept |

  | SC-7 | Migration integrity covers reversibility, verification, sampling | string
  | grep for each concept |

  | SC-8 | Audit trail covers traceability, authorization, documented changes | string
  | grep for each concept |

  | SC-9 | Data retention covers retention policies per classification | string |
  grep for retention policy |

  | SC-10 | Agent rejects synthetic/fabricated data when generating code examples
  | behavioral | opencode run with prompt requesting fabricated data; verify agent
  declines |

  | SC-11 | Agent fails fast on missing required data instead of using defaults |
  behavioral | opencode run with prompt about missing field handling; verify agent
  raises error |

  | SC-12 | Agent does not hardcode entity IDs in generated code | behavioral | opencode
  run with prompt requiring entity references; verify dynamic derivation |

  | SC-13 | No specific failure-mode rules were lost in the revision | semantic |
  Sub-agent reads both old and new file; verifies all specific rules from old file
  are present in new file |


  ## Traceability


  | REQ | SCs | Phase |

  |-----|-----|-------|

  | REQ-1 | SC-1, SC-4 | Phase 1, Phase 3 |

  | REQ-2 | SC-1, SC-5 | Phase 1, Phase 3 |

  | REQ-3 | SC-1, SC-6 | Phase 1, Phase 3 |

  | REQ-4 | SC-1, SC-7 | Phase 1, Phase 3 |

  | REQ-5 | SC-1, SC-8 | Phase 1, Phase 3 |

  | REQ-6 | SC-1, SC-9 | Phase 1, Phase 3 |

  | REQ-7 | SC-2, SC-3, SC-10, SC-11, SC-12, SC-13 | Phase 1, Phase 2 |


  ## Implementation Plan


  ### Phase 1: Revise file: preserve existing rules, add 6 new categories, update
  cross-references (REQ-1–REQ-7)

  ### Phase 2: Verify all project-specific references removed (SC-2, REQ-7)

  ### Phase 3: Verify all 6 categories present with correct scope (SC-1, SC-4–SC-9,
  REQ-1–REQ-6)


  ## Files Affected


  - `.opencode/guidelines/090-data-integrity.md` — revised: preserve existing rules,
  add 6 new categories


  ## Risks


  - **Over-broadening**: If the categories are too abstract, they won''t constrain
  agent behavior. Mitigation: each category includes concrete examples of what it
  forbids and requires.

  - **Loss of specific failure modes**: The narrow rules (no synthetic data, fail
  fast) are real failure patterns. Mitigation: they''re subsumed under the broader
  categories, not lost.

  - **Lobotomization**: Removing specific failure-mode rules in favor of abstract
  categories. Mitigation: SC-13 verifies semantic preservation of all specific rules.


  ## Dependencies


  - None.


