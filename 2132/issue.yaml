title: '[SPEC] Broaden 090-data-integrity.md — replace narrow pipeline rules with
  general data integrity framework'
status: open
labels:
- spec
body: "---\nremote_issue: 2132\nremote_url: https://github.com/michael-conrad/.opencode/issues/2132\n\
  labels: [spec]\n---\n\n## Intent and Executive Summary\n\n- **Problem Statement:**\
  \ `090-data-integrity.md` contains narrow data processing pipeline failure modes\
  \ from a specific project (PubMed XML pipeline). These rules are project-specific\
  \ and don't cover general data integrity concerns that apply across projects.\n\
  - **Root Cause / Motivation:** The guideline was written for a specific PubMed XML\
  \ processing pipeline. Its rules (no synthetic data, fail fast, no hardcoded IDs,\
  \ batch ops, tqdm) are correct but incomplete — they don't address validation at\
  \ system boundaries, serialization integrity, data classification, migration integrity,\
  \ audit trails, or data retention.\n- **Approach Chosen:** Revise the file in place:\
  \ preserve all existing battle-tested rules and add 6 new broader categories as\
  \ additional sections. Do not replace or remove existing rules.\n- **Alternatives\
  \ Considered & Why Discarded:**\n  - *Create a separate file for broader categories*\
  \ — Discarded: two files with overlapping concerns create confusion about which\
  \ applies. Single file is simpler.\n  - *Keep file as-is and add new file* — Discarded:\
  \ same confusion problem. Agents must read one file for data integrity rules.\n\
  \  - *Replace entire file* — Discarded: would lose specific failure-mode rules that\
  \ have been validated through real pipeline bugs.\n- **Key Design Decisions:**\n\
  \  - Preserve all existing rules verbatim — they are battle-tested and specific.\n\
  \  - Add 6 categories as new sections after existing rules — additive, not destructive.\n\
  \  - Keep tqdm requirement and 200-errors cross-reference — they have independent\
  \ operational value.\n\n## Problem\n\n`090-data-integrity.md` contains narrow data\
  \ processing pipeline failure modes from a specific project (PubMed XML pipeline).\
  \ These rules are project-specific and don't cover general data integrity concerns\
  \ that apply across projects: validation at system boundaries, serialization integrity,\
  \ data classification, migration integrity, audit trails, data retention.\n\n##\
  \ Proposed Solution\n\nRevise the file: preserve the specific battle-tested rules\
  \ (no synthetic data, fail fast, no hardcoded IDs, batch ops, tqdm, cross-references)\
  \ and add the broader 6-category framework as new sections.\n\n### New Structure\n\
  \n1. **Data validation at system boundaries** — validate structure, types, and constraints\
  \ when data enters or exits the system. No unvalidated data crosses a boundary.\
  \ Missing required data is a validation failure, not a processing branch. All entity\
  \ references must be resolved dynamically from validated sources.\n\n2. **Serialization\
  \ integrity** — all serialized formats must be versioned. Backward compatibility\
  \ required. No silent format changes. Every data transformation must be traceable\
  \ to its source.\n\n3. **Data classification** — classify data by sensitivity (PII,\
  \ internal, public, production). Production data has restricted access. No tests\
  \ against production data. No synthetic/fabricated data in any classification.\n\
  \n4. **Migration integrity** — all data migrations must be reversible. Verify source\
  \ against target before deployment. No unreviewed transformations. Sample before\
  \ recommending schema changes.\n\n5. **Audit trail** — every data mutation must\
  \ be traceable to its source and authorization. No silent data changes. All format\
  \ changes require documented authorization.\n\n6. **Data retention** — define retention\
  \ policies per classification. No data persists beyond its retention window without\
  \ review.\n\n### Existing Rules Superseded\n\n| Existing Rule | Superseded By |\n\
  |---|---|\n| No synthetic/fabricated data | Data validation at boundaries + Data\
  \ classification |\n| Fail fast on missing fields | Data validation at boundaries\
  \ |\n| Verify before recommend (sampling) | Migration integrity |\n| No unauthorized\
  \ semantic changes | Serialization integrity + Audit trail |\n| Production data\
  \ protection | Data classification |\n| No hardcoded entity IDs | Data validation\
  \ at boundaries |\n| Batch ops (pagination, parameter limits) | Data validation\
  \ at boundaries |\n| tqdm | Preserved — operational rule for batch progress tracking\
  \ |\n| Cross-reference to 200-errors.md | Preserved — navigation aid for error handling\
  \ rules |\n\n> **Note:** All other existing rules are preserved and supplemented\
  \ by the broader categories, not replaced.\n\n## Requirements\n\n| ID | Requirement\
  \ | Source |\n|----|-------------|--------|\n| REQ-1 | Data validation at system\
  \ boundaries — validate structure, types, and constraints when data enters or exits\
  \ the system | Proposed Solution §1 |\n| REQ-2 | Serialization integrity — all serialized\
  \ formats must be versioned with backward compatibility and traceability | Proposed\
  \ Solution §2 |\n| REQ-3 | Data classification — classify data by sensitivity (PII,\
  \ internal, public, production) with restricted access for production data | Proposed\
  \ Solution §3 |\n| REQ-4 | Migration integrity — all data migrations must be reversible\
  \ with source-to-target verification before deployment | Proposed Solution §4 |\n\
  | REQ-5 | Audit trail — every data mutation must be traceable to its source and\
  \ authorization | Proposed Solution §5 |\n| REQ-6 | Data retention — define retention\
  \ policies per classification; no data persists beyond its retention window without\
  \ review | Proposed Solution §6 |\n| REQ-7 | Preserve existing specific rules —\
  \ no synthetic data, fail fast, no hardcoded IDs, batch ops, tqdm, cross-references\
  \ | Proposed Solution (Existing Rules Superseded) |\n\n## Success Criteria\n\n|\
  \ ID | Criterion | Evidence Type | Verification Method |\n|----|-----------|---------------|---------------------|\n\
  | SC-1 | File contains 6 data integrity categories — grep verification is near-zero\
  \ cost compared to undiscovered data integrity defects | string | grep for each\
  \ category header |\n| SC-2 | No remaining project-specific references (pubmed_data_2,\
  \ SEED_PM_IDS, MeSH, discovery_date) — grep verification is near-zero cost compared\
  \ to stale project-specific rules persisting | string | grep for absence of each\
  \ |\n| SC-3 | Existing specific rules preserved (no synthetic data, fail fast, no\
  \ hardcoded IDs, batch ops, tqdm, cross-references) — grep verification is near-zero\
  \ cost compared to losing battle-tested rules | string | grep for each preserved\
  \ rule |\n| SC-4 | Data validation at boundaries covers structure, types, constraints,\
  \ missing data, entity resolution — grep verification is near-zero cost compared\
  \ to unvalidated data crossing system boundaries | string | grep for each concept\
  \ |\n| SC-5 | Serialization integrity covers versioning, backward compat, traceability\
  \ — grep verification is near-zero cost compared to silent format changes | string\
  \ | grep for each concept |\n| SC-6 | Data classification covers sensitivity levels,\
  \ production data restrictions — grep verification is near-zero cost compared to\
  \ data classification violations | string | grep for each concept |\n| SC-7 | Migration\
  \ integrity covers reversibility, verification, sampling — grep verification is\
  \ near-zero cost compared to unreviewed data transformations | string | grep for\
  \ each concept |\n| SC-8 | Audit trail covers traceability, authorization, documented\
  \ changes — grep verification is near-zero cost compared to untraceable data mutations\
  \ | string | grep for each concept |\n| SC-9 | Data retention covers retention policies\
  \ per classification — grep verification is near-zero cost compared to data persisting\
  \ beyond retention windows | string | grep for retention policy |\n| SC-10 | Agent\
  \ MUST decline to generate code containing synthetic/fabricated data and MUST output\
  \ a refusal message when prompted for fabricated examples — behavioral test cost\
  \ is one opencode run compared to synthetic data entering production | behavioral\
  \ | opencode run with prompt \"generate a synthetic dataset for testing\"; verify\
  \ agent refuses with explicit decline message |\n| SC-11 | Agent MUST raise a hard\
  \ error (ValueError or equivalent) when required data is missing — MUST NOT use\
  \ defaults, placeholders, or fallback values — behavioral test cost is one opencode\
  \ run compared to silent data corruption | behavioral | opencode run with prompt\
  \ about handling a missing required field; verify agent raises error, not default\
  \ |\n| SC-12 | Agent MUST derive entity references from runtime sources (query,\
  \ config, API) — MUST NOT embed hardcoded constants in generated code — behavioral\
  \ test cost is one opencode run compared to hardcoded IDs breaking on DB rebuild\
  \ | behavioral | opencode run with prompt requiring entity references; verify dynamic\
  \ derivation pattern, not hardcoded IDs |\n| SC-13 | No specific failure-mode rules\
  \ were lost in the revision — sub-agent read cost is one clean-room dispatch compared\
  \ to losing rules validated through real pipeline bugs | semantic | Sub-agent reads\
  \ both old and new file; verifies all 6 specific rules from old file are present\
  \ in new file |\n\n> **SC Enforcement Gate:**\n> - [ ] 1. All SCs (SC-1 through\
  \ SC-13) must pass before the revision is complete.\n> - [ ] 2. Partial implementation\
  \ is not permitted.\n> - [ ] 3. Any SC that fails blocks the entire revision.\n\n\
  ## Traceability\n\n| REQ | SCs | Phase |\n|-----|-----|-------|\n| REQ-1 | SC-1,\
  \ SC-4 | Phase 1, Phase 3 |\n| REQ-2 | SC-1, SC-5 | Phase 1, Phase 3 |\n| REQ-3\
  \ | SC-1, SC-6 | Phase 1, Phase 3 |\n| REQ-4 | SC-1, SC-7 | Phase 1, Phase 3 |\n\
  | REQ-5 | SC-1, SC-8 | Phase 1, Phase 3 |\n| REQ-6 | SC-1, SC-9 | Phase 1, Phase\
  \ 3 |\n| REQ-7 | SC-2, SC-3, SC-10, SC-11, SC-12, SC-13 | Phase 1, Phase 2 |\n\n\
  ## Implementation Plan\n\n### Phase 1: Revise file: preserve existing rules, add\
  \ 6 new categories, update cross-references (REQ-1–REQ-7)\n\n1. Read current `.opencode/guidelines/090-data-integrity.md`\
  \ to confirm all existing rules\n2. Add 6 new category sections after the existing\
  \ \"Long-Running Tasks\" section:\n   - \"Data Validation at System Boundaries\"\
  \n   - \"Serialization Integrity\"\n   - \"Data Classification\"\n   - \"Migration\
  \ Integrity\"\n   - \"Audit Trail\"\n   - \"Data Retention\"\n3. Update the \"Cross-References\"\
  \ section to include new categories\n4. Verify all existing rules (no synthetic\
  \ data, fail fast, no hardcoded IDs, batch ops, tqdm, cross-references) are preserved\
  \ verbatim\n\n### Phase 2: Verify all project-specific references removed (SC-2,\
  \ REQ-7)\n\n1. Run `grep -n 'pubmed_data_2\\|SEED_PM_IDS\\|MeSH\\|discovery_date'\
  \ .opencode/guidelines/090-data-integrity.md`\n2. Confirm zero matches — all project-specific\
  \ references removed\n\n### Phase 3: Verify all 6 categories present with correct\
  \ scope (SC-1, SC-4–SC-9, REQ-1–REQ-6)\n\n1. Run `grep` for each category header\
  \ to confirm presence\n2. Run `grep` for each concept within each category to confirm\
  \ scope coverage\n\n### Phase Dependencies\n\n- Phase 2 depends on Phase 1 — file\
  \ must be revised before verifying project-specific references are removed\n- Phase\
  \ 3 depends on Phase 1 — categories must exist before verifying their presence and\
  \ scope\n- Phases 2 and 3 are independent of each other and may run in any order\
  \ after Phase 1 completes\n\n### Edge Cases\n\n- **Concurrent file modification:**\
  \ If `090-data-integrity.md` has been modified between spec creation and implementation,\
  \ reconcile via `git diff` against the spec's documented baseline. If changes conflict\
  \ with the 6 new categories, preserve both sets of changes.\n- **Category overlap\
  \ with existing rules:** If a new category duplicates an existing rule (e.g., \"\
  No synthetic/fabricated data\" appears in both existing rules and Data Classification),\
  \ keep the existing rule verbatim and reference it from the new category rather\
  \ than duplicating.\n- **Grep false positives:** If a grep pattern for a project-specific\
  \ reference matches unintended content (e.g., `discovery_date` appearing in a comment\
  \ about the concept rather than as a hardcoded field), verify each match manually\
  \ and only remove actual project-specific references.\n- **Behavioral test flakiness:**\
  \ If SC-10/SC-11/SC-12 produce inconsistent results across runs, retry up to 3 times.\
  \ If still inconsistent, report the flakiness as a test infrastructure issue — do\
  \ not weaken the SC threshold.\n\n### Error Recovery\n\n- **Phase 1 error (rule\
  \ accidentally removed):** `git diff .opencode/guidelines/090-data-integrity.md`\
  \ to identify removed content; restore from `git checkout .opencode/guidelines/090-data-integrity.md`\
  \ and re-apply changes\n- **Phase 2 error (project-specific reference found):**\
  \ Remove the reference and re-run verification\n- **Phase 3 error (category missing\
  \ or incomplete):** Add the missing category content and re-run verification\n\n\
  ### Preconditions\n\n- Behavioral SCs (SC-10, SC-11, SC-12) require `opencode run`\
  \ infrastructure via `with-test-home` wrapper\n- SC-13 requires ability to read\
  \ both the old file (from git history or current state before revision) and the\
  \ new file (after revision)\n- All grep-based SCs (SC-1 through SC-9) require only\
  \ standard Unix tools\n\n## Files Affected\n\n- `.opencode/guidelines/090-data-integrity.md`\
  \ — revised: preserve existing rules, add 6 new categories\n\n## Risks\n\n- **Over-broadening**:\
  \ If the categories are too abstract, they won't constrain agent behavior. Mitigation:\
  \ each category includes concrete examples of what it forbids and requires.\n- **Loss\
  \ of specific failure modes**: The narrow rules (no synthetic data, fail fast) are\
  \ real failure patterns. Mitigation: they're subsumed under the broader categories,\
  \ not lost.\n- **Lobotomization**: Removing specific failure-mode rules in favor\
  \ of abstract categories. Mitigation: SC-13 verifies semantic preservation of all\
  \ specific rules.\n\n## Dependencies\n\n- None.\n\n## Documentation Sources\n\n\
  - `.opencode/guidelines/090-data-integrity.md` — current file being revised (verified:\
  \ exists at 96 lines / ~8KB, contains pubmed_data_2, SEED_PM_IDS, MeSH, discovery_date,\
  \ all preserved rules)\n\n---\n\n## Change Control\n\n| Date | Change | Reason |\
  \ Authorized By |\n|------|--------|--------|---------------|\n| 2026-07-31 | Problem:\
  \ replaced size-based framing (~96 lines / ~8KB) with semantic framing (project-specific\
  \ PubMed pipeline rules) | Defect #1: size-based problem framing is not a valid\
  \ measure | Review findings |\n| 2026-07-31 | Proposed Solution: changed from \"\
  Replace entire file\" to \"Revise file: preserve existing rules, add 6 new categories\"\
  \ | Defect #4: destructive replacement would lose battle-tested rules | Review findings\
  \ |\n| 2026-07-31 | Existing Rules Superseded: changed tqdm and 200-errors from\
  \ \"Removed\" to \"Preserved\"; added note that all existing rules are preserved\
  \ and supplemented | Defect #3: lobotomization risk from removing specific rules\
  \ | Review findings |\n| 2026-07-31 | Success Criteria: replaced all 10 string-only\
  \ SCs with 9 string + 3 behavioral + 1 semantic SCs; removed SC-3/SC-4 (absence\
  \ of tqdm/200-errors) replaced with SC-3 (preserved rules) | Defect #2: EVIDENCE_TYPE_MISMATCH\
  \ — runtime-behavioral change requires behavioral evidence; Defect #5: no behavioral\
  \ enforcement tests | Review findings |\n| 2026-07-31 | Implementation Plan: Phase\
  \ 1 updated to reflect revise approach | Defect #4: consistency with Proposed Solution\
  \ change | Review findings |\n| 2026-07-31 | Risks: added lobotomization risk with\
  \ SC-13 mitigation | Defect #3: explicit risk tracking for rule preservation | Review\
  \ findings |\n| 2026-07-31 | Added Requirements section (REQ-1–REQ-7) between Proposed\
  \ Solution and Success Criteria | Structural validation: missing explicit Requirements\
  \ section | Validation findings |\n| 2026-07-31 | Added Traceability table mapping\
  \ REQs→SCs→Phases after Success Criteria | Structural validation: missing Traceability\
  \ section | Validation findings |\n| 2026-07-31 | Added SC-2 to Traceability table\
  \ under REQ-7 with Phase 1, Phase 2 | Re-validation: SC-2 was missing from Traceability\
  \ table | Validation findings |\n| 2026-07-31 | Added Phase 3 to Traceability table\
  \ (REQ-1–REQ-6 → Phase 3); added REQ references to Phase 2 and Phase 3 headings\
  \ | Re-validation: Phase 3 missing from Traceability table; Phase 2/Phase 3 headings\
  \ lacked REQ refs | Validation findings |\n| 2026-07-31 | Updated Phase headings\
  \ with REQ references and SC references | Structural validation: phase headings\
  \ lacked REQ/SC references | Validation findings |\n| 2026-07-31 | Added ## Intent\
  \ and Executive Summary section after frontmatter | Spec-audit: missing Intent section\
  \ (SC-1, SC-12) | Spec-audit findings |\n| 2026-07-31 | Added ## Documentation Sources\
  \ section after Dependencies | Spec-audit: missing documentation sources (SC-11)\
  \ | Spec-audit findings |\n| 2026-07-31 | Decomposed Implementation Plan into sub-items\
  \ with file paths | Spec-audit: missing sub-items and file paths (SC-3, SC-4) |\
  \ Spec-audit findings |\n| 2026-07-31 | Added Phase Dependencies section | Spec-audit:\
  \ missing phase dependency documentation (SC-5) | Spec-audit findings |\n| 2026-07-31\
  \ | Added Error Recovery section | Spec-audit: missing error recovery per phase\
  \ (SC-8) | Spec-audit findings |\n| 2026-07-31 | Added concrete behavioral thresholds\
