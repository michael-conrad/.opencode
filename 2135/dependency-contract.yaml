variables:
  phase_1:
    type: bool
    description: "Write dual-authority principle (spec authoritative for intent, code authoritative for current state) into 130-authority-source.md — SC-1"
  phase_2:
    type: bool
    description: "Write six rules (Rule 1-6) into 130-authority-source.md — SC-2, SC-3, SC-4, SC-5, SC-6, SC-7"
  phase_3:
    type: bool
    description: "Remove superseded sections from 130-authority-source.md and relocate content to spec-creation SKILL.md and 065-verification-honesty.md — SC-8a, SC-8b, SC-9a, SC-9b, SC-10a, SC-10b"
  phase_4:
    type: bool
    description: "Verify rewrite uses no word/line count compaction targets and no content-free section headers — SC-12"
  phase_5:
    type: bool
    description: "Clean-room semantic audit verifying no content loss across relocation boundaries and no compaction artifacts — SC-11a, SC-11b, SC-11c, SC-12"
preconditions:
  - "z3.Implies(phase_2, phase_1)"
  - "z3.Implies(phase_3, phase_2)"
  - "z3.Implies(phase_4, phase_3)"
  - "z3.Implies(phase_5, phase_4)"
invariants: []
postconditions: []
phases:
  phase_1:
    files:
      - .opencode/guidelines/130-authority-source.md
    scs:
      - SC-1
  phase_2:
    files:
      - .opencode/guidelines/130-authority-source.md
    scs:
      - SC-2
      - SC-3
      - SC-4
      - SC-5
      - SC-6
      - SC-7
  phase_3:
    files:
      - .opencode/guidelines/130-authority-source.md
      - .opencode/skills/spec-creation/SKILL.md
      - .opencode/guidelines/065-verification-honesty.md
    scs:
      - SC-8a
      - SC-8b
      - SC-9a
      - SC-9b
      - SC-10a
      - SC-10b
  phase_4:
    files:
      - .opencode/guidelines/130-authority-source.md
    scs:
      - SC-12
  phase_5:
    files:
      - .opencode/skills/spec-creation/SKILL.md
      - .opencode/guidelines/065-verification-honesty.md
      - .opencode/guidelines/130-authority-source.md
    scs:
      - SC-11a
      - SC-11b
      - SC-11c
      - SC-12
edges:
  - from: phase_1
    to: phase_2
    rationale: "The dual-authority principle (Phase 1) must be written before the six rules (Phase 2) that build on it"
  - from: phase_2
    to: phase_3
    rationale: "The six rules (Phase 2) must be written before the superseded sections are removed and relocated (Phase 3)"
  - from: phase_3
    to: phase_4
    rationale: "The rewrite and relocation (Phase 3) must complete before the no-mechanical-compaction check (Phase 4) runs against the final guideline"
  - from: phase_4
    to: phase_5
    rationale: "The compaction check (Phase 4) must pass before the clean-room semantic preservation audit (Phase 5) runs"
notes:
  - "Phases are strictly sequential (1 -> 2 -> 3 -> 4 -> 5). Phase 5 is a clean-room semantic audit gate that re-verifies SC-12 alongside SC-11a/11b/11c; SC-12's RED/GREEN/COMMIT triplet is co-located in Phase 4 (its Phase 5 appearance is a verification gate, not a triplet split)."
  - "All SCs are string/semantic evidence type, statically testable via grep and clean-room sub-agent reads. No runtime behavior changes; no code-level interface boundary is broken (documentation content relocation only)."
