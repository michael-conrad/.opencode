  Audit Code Deep Dive content |

  | SC-12 | Rewrite does not use word count, line count, or any quantitative metric
  as a compaction target — only semantic analysis determines what stays or goes |
  semantic | Clean-room sub-agent reads the final guideline and verifies the rewrite
  was guided by semantic necessity, not mechanical metrics |


  ## Implementation Plan


  ### Phase 1: Write new dual-authority principle [REQ-7]

  ### Phase 2: Write 6 new rules [REQ-1 through REQ-6]

  ### Phase 3: Remove superseded rules (Superseding Issues, Verification First, Plan
  Audit) [REQ-8]

  ### Phase 4: Verify all 6 rules present and removed content absent [REQ-9]

  ### Phase 5: Clean-room semantic audit — dispatch a clean-room sub-agent to compare
  source and target files for all three relocated sections, verifying no semantic
  content loss occurred before the rewrite is accepted [REQ-8, REQ-9]


  ## Files Affected


  - `.opencode/guidelines/130-authority-source.md` — rewritten

  - `.opencode/skills/spec-creation/SKILL.md` — receives Superseding Issues + Overlap
  Detection Checklist


  ## Risks


  - **Confusion between intent and state**: Agents may struggle to distinguish "spec
  is wrong about current state" from "code doesn''t implement spec intent." Mitigation:
  each rule includes concrete examples of both failure modes.

  - **Cross-reference breakage**: Other files referencing the old "code wins" framing.
  Mitigation: grep for ''code wins'' and ''code is the only absolute source of truth''
  across the codebase.

  - **Mechanical compaction**: Using word count, line count, or other quantitative
  metrics as compaction targets risks lobotomizing the guideline — removing content
  that is semantically important but verbose. Mitigation: SC-12 explicitly prohibits
  mechanical compaction targets; only semantic analysis determines what stays or goes.
  Phase 5 (clean-room semantic audit) enforces this gate.


  ## Dependencies


  - None.


