  | SC-9a | Verification First section absent from 130-authority-source.md | semantic
  | Clean-room sub-agent reads 130-authority-source.md and confirms the Verification
  First section is absent from the original location |

  | SC-9b | Verification First content present in 065-verification-honesty.md | semantic
  | Clean-room sub-agent reads 065-verification-honesty.md and verifies the Verification
  First content is present in the target location |

  | SC-10a | Plan Audit Code Deep Dive section absent from 130-authority-source.md
  | semantic | Clean-room sub-agent reads 130-authority-source.md and confirms the
  Plan Audit Code Deep Dive section is absent from the original location |

  | SC-10b | Plan Audit content present in spec-creation SKILL.md | semantic | Clean-room
