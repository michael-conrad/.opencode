  | SC-2 | Rule 1: Spec for intent, code for state | semantic | Clean-room sub-agent
  reads guideline and verifies the rule correctly expresses the dual-authority relationship
  (spec defines what to build, code implements it) |

  | SC-3 | Rule 2: Spec before code | semantic | Clean-room sub-agent reads guideline
  and verifies the rule correctly states that every code change requires an approved
  spec |

  | SC-4 | Rule 3: Documentation Drift Protocol | semantic | Clean-room sub-agent
  reads guideline and verifies the drift protocol correctly describes updating spec
  to match current code state as an administrative sync |

  | SC-5 | Rule 4: Spec revision revokes plan approval | semantic | Clean-room sub-agent
  reads guideline and verifies the rule correctly states that substantive spec revision
  revokes linked plan approvals |

