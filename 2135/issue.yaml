  reads guideline and verifies the rule correctly prohibits changing code to match
  a spec that is wrong about current state |

  | SC-7 | Rule 6: Verification against spec | semantic | Clean-room sub-agent reads
  guideline and verifies the rule correctly states that completion verification checks
  code against spec success criteria |

  | SC-8a | Superseding Issues section absent from 130-authority-source.md | semantic
  | Clean-room sub-agent reads 130-authority-source.md and confirms the Superseding
  Issues + Overlap Detection Checklist section is absent from the original location
  |

