  ## Problem


  `130-authority-source.md` currently asserts "code wins" — the filesystem is the
  only absolute source of truth. This framing is backwards for a spec-driven project
  where specs are the primary artifact for intent, the authorization mechanism, and
  the review target. The project''s own workflow demonstrates this: specs drive implementation,
  specs authorize changes, specs are what gets reviewed. The "code wins" position
  contradicts the project''s actual practice.


  > **Note on citations:** The following references are included as project-internal
  reasoning anchors, not as externally verified authority claims. They have not been
  verified against live sources and should not be treated as evidence in audit contexts.
  If external authority is needed, URLs must be added and verified before implementation.

  >

  > - **Augment Code (2026)**: "Spec-driven development inverts the traditional workflow
  by treating specifications as the source of truth and code as a generated or verified
  secondary artifact."

  > - **Martin Fowler / Thoughtworks (2025)**: Three levels of SDD — spec-first, spec-anchored,
  spec-as-source. All treat the spec as authoritative for intent.

  > - **GitHub spec-kit**: "In this new world, maintaining software means evolving
  specifications. The lingua franca of development moves to a higher level, and code
  is the last-mile approach."


  The project uses specs as the primary artifact — specs drive implementation, specs
  are the authorization mechanism, specs are what gets reviewed. The current "code
  wins" position is backwards.


  ## Proposed Solution


  Complete rewrite establishing a dual-authority model:


  ### Principle


  - **The spec is authoritative for intent** — what the system should do. The spec
  defines requirements, success criteria, and behavior.

  - **The code is authoritative for current state** — what the system actually does.
  The code is the implementation of the spec.

  - **Neither wins absolutely.** They converge through revision.


  ### Rules


  1. **Spec for intent, code for state** — When a spec makes an incorrect claim about
  current code behavior, revise the spec to match reality (Documentation Drift Protocol).
  When code fails to implement the spec''s intent, fix the code.


  2. **Spec before code** — Every code change requires an approved spec. The spec
  defines what to build; the code implements it. (Already in 010-approval-gate.md.)


  3. **Documentation Drift Protocol** — When spec and code diverge on matters of fact
  (the spec describes behavior the code doesn''t have, or the code has behavior the
  spec doesn''t describe), update the spec to reflect current state. This is an administrative
  sync, not a code change.


  4. **Spec revision revokes plan approval** — If a spec is revised (substantive change
  to intent), linked plan approvals are revoked per approval-gate-006.


  5. **Suppression of Reactive Remediation** — Do not change code to match a spec
  that is wrong about current state. Fix the spec first, then decide if the code needs
  changing.


  6. **Verification against spec** — Before claiming completion, verify the code implements
  the spec''s success criteria. The spec is the benchmark; the code is measured against
  it.


  ### Remove


  - Rule 2 (Superseding Issues + Overlap Detection Checklist) — move to `spec-creation`
  skill card

  - Rule 6 (Verification First) — already in 065

  - Rule 8 (Plan Audit Code Deep Dive) — move to `spec-creation` skill card (alongside
  Superseding Issues content)


  ## Requirements


  | ID | Requirement | Source |

  |----|-------------|--------|

  | REQ-1 | Spec for intent, code for state — When a spec makes an incorrect claim
  about current code behavior, revise the spec to match reality. When code fails to
  implement the spec''s intent, fix the code. | Rule 1 |

  | REQ-2 | Spec before code — Every code change requires an approved spec. | Rule
  2 |

  | REQ-3 | Documentation Drift Protocol — When spec and code diverge on matters of
  fact, update the spec to reflect current state as an administrative sync. | Rule
  3 |

  | REQ-4 | Spec revision revokes plan approval — Substantive spec revision revokes
  linked plan approvals per approval-gate-006. | Rule 4 |

  | REQ-5 | Suppression of Reactive Remediation — Do not change code to match a spec
  that is wrong about current state; fix the spec first. | Rule 5 |

  | REQ-6 | Verification against spec — Before claiming completion, verify the code
  implements the spec''s success criteria. | Rule 6 |

  | REQ-7 | Dual-authority principle — The spec is authoritative for intent; the code
  is authoritative for current state. Neither wins absolutely. | Principle |

  | REQ-8 | Removed sections preservation — All semantic content from removed sections
  (Superseding Issues, Verification First, Plan Audit Code Deep Dive) is preserved
  in target locations. | Remove |

  | REQ-9 | No mechanical compaction — Only semantic analysis determines what stays
  or goes; word count, line count, or quantitative metrics are not compaction targets.
  | Risks |


