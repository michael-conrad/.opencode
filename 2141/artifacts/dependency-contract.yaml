# Dependency contract for .opencode#2141
# Validates phase ordering constraints via Z3
variables:
  phase_1_completed:
    type: bool
  phase_2_completed:
    type: bool
  phase_3_completed:
    type: bool
  phase_4_completed:
    type: bool
  phase_5_completed:
    type: bool
invariants:
  # Phase-5 (RED tests) must precede all GREEN phases
  - "z3.Implies(phase_1_completed, phase_5_completed)"
  - "z3.Implies(phase_2_completed, phase_5_completed)"
  - "z3.Implies(phase_3_completed, phase_5_completed)"
  - "z3.Implies(phase_4_completed, phase_5_completed)"
  # Phase-1 must precede Phase-2
  - "z3.Implies(phase_2_completed, phase_1_completed)"
  # Phase-2 must precede Phase-3
  - "z3.Implies(phase_3_completed, phase_2_completed)"
  # Phase-3 must precede Phase-4
  - "z3.Implies(phase_4_completed, phase_3_completed)"
