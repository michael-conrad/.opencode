  correctness:
    problem_statement: "The approval-gate-scope authorization workflow has a circular dependency: it checks for recorded authorization in persistent issue state (.issues/{N}/comments.yaml, spec.md frontmatter, issue.yaml labels) before it has written the session authorization (given in chat) to that same state."
    root_cause: "Structural design defect: Step 0.5 (scope-auto-resolve) correctly parses session authorization from chat, but Step 1 (verify-explicit-authorization) reads issue comments for a pre-existing record — finding nothing because the authorization was just given in chat. Step 3 (apply-label) would apply the label, but it runs AFTER verification, and verification already failed because the label wasn't there."
