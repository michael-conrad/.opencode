reasoning_evidence:
  root_causes:
    - text: "Circular dependency: the verify-authorization workflow checks for recorded authorization (in comments.yaml, spec.md frontmatter, issue.yaml labels) that hasn't been written yet because the authorization was just given in chat session, not yet persisted to issue state"
      location: "Root Cause / Motivation (lines 24-32)"
  fix_approaches:
    - text: "Reorder the verify-authorization workflow to a record-then-verify pattern: (1) scope-auto-resolve, (2) record-authorization, (3) verify-recording, (4) apply-label, (5) auto-dispatch. A new record-authorization task writes session authorization into persistent issue state before any verification step reads it."
      location: "Approach Chosen (lines 37-38)"
  sc_to_root_cause:
    - sc_id: SC-1
      references_root_cause: true
      root_cause_text: "No record-authorization task exists — authorization is never persisted before verification"
    - sc_id: SC-2
      references_root_cause: true
      root_cause_text: "spec.md frontmatter never gets status: approved because no task writes it"
    - sc_id: SC-3
      references_root_cause: true
      root_cause_text: "comments.yaml never gets authorization record because no task appends it"
    - sc_id: SC-4
      references_root_cause: true
      root_cause_text: "issue.yaml never gets approved-for-{scope} label because no task writes it"
    - sc_id: SC-5
      references_root_cause: true
      root_cause_text: ".issues/ worktree changes never committed because no task commits them"
    - sc_id: SC-6
      references_root_cause: true
      root_cause_text: "Fast-path workflow has verify-explicit-authorization at step 2 before any recording step"
    - sc_id: SC-7
      references_root_cause: true
      root_cause_text: "Full-path workflow has verify-explicit-authorization at step 2 before any recording step"
    - sc_id: SC-8
      references_root_cause: true
      root_cause_text: "verify-explicit-authorization checks for recorded state that doesn't exist yet"
    - sc_id: SC-9
      references_root_cause: true
      root_cause_text: "verify-recording replaces verify-explicit-authorization to check recorded state after recording"
    - sc_id: SC-10
      references_root_cause: true
      root_cause_text: "apply-label runs at step 3 before authorization is recorded — label check fails"
    - sc_id: SC-11
      references_root_cause: true
      root_cause_text: "Gap-fill-path workflow has verify-explicit-authorization at step 2 before any recording step"
    - sc_id: SC-12
      references_root_cause: true
      root_cause_text: "record-authorization must be step 2 in all workflows to break the circular dependency"
  alternatives_considered:
    present: true
    items:
      - alternative: "Modify verify-explicit-authorization instead of replacing it"
        reason_discarded: "Adding write-then-read logic to the same task violates SRP — it would both record and verify, making the task responsible for two distinct concerns. A clean replacement (verify-recording) with a single responsibility (read-back confirmation) is simpler to implement, test, and audit."
      - alternative: "Use a different persistence mechanism (e.g., in-memory cache, environment variable)"
        reason_discarded: "In-memory state is lost on session restart, which breaks the authorization continuity guarantee. Environment variables are process-scoped and invisible to sub-agents. The .issues/ worktree is the canonical persistent state store for issue metadata."
      - alternative: "Skip recording and check chat directly"
        reason_discarded: "The chat transcript is ephemeral — it is not persisted in a structured, queryable format. Sub-agents cannot read the orchestrator's chat context. Recording to .issues/ makes authorization visible to all pipeline stages."
  edge_cases:
    present: true
    items:
      - ".issues/ Worktree Not Initialized — task returns BLOCKED with ISSUES_WORKTREE_NOT_INITIALIZED"
      - "Malformed spec.md Frontmatter — task returns BLOCKED with MALFORMED_FRONTMATTER"
      - "Missing comments.yaml — task creates the file with initial authorization record"
      - "Commit Failure — task returns BLOCKED with COMMIT_FAILED including git error output"
      - "Concurrent Authorization Attempts — task re-reads state, verifies compatibility, skips or overwrites, retries commit"
  potential_contradictions: []

