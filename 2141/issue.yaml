body: "---\nissue: .opencode#2141\ntitle: \"[SPEC] Fix: Authorization Workflow — Record\
  \ Session Authorization Before Verifying\"\nstatus: approved\napproved: 2026-07-25\n\
  created: 2026-07-25\nlicense: MIT\nprovenance: AI-generated\nphase: 1\nphase_name:\
  \ Authorization Workflow Fix\nauthors:\n  - OpenCode (deepseek-v4-flash)\n---\n\n\
  > **Full spec and artifacts: [`.opencode/.issues/2141/`](https://github.com/michael-conrad/.opencode/tree/issues-data/2141)**\
  \ — this issue is a condensed exec summary; the authoritative spec lives in the\
  \ `issues-data` branch.\n>\n> **Local artifacts:** `.opencode/.issues/2141/` — implementation\
  \ plan, card catalogue, dependency contracts, research, designs, audit findings\n\
  \n## Intent and Executive Summary\n\n### Problem Statement\n\nThe `approval-gate-scope`\
  \ authorization workflow has a circular dependency: it checks for recorded authorization\
  \ in persistent issue state (`.issues/{N}/comments.yaml`, `spec.md` frontmatter,\
  \ `issue.yaml` labels) before it has written the session authorization (given in\
  \ chat) to that same state. The agent receives valid authorization from the developer\
  \ in chat, but the workflow deadlocks because it verifies against state that hasn't\
  \ been written yet.\n\n### Root Cause / Motivation\n\nThe current `verify-authorization`\
  \ workflow in `approval-gate-scope` has a structural design defect:\n\n1. **Step\
  \ 0.5 (scope-auto-resolve):** Correctly parses session authorization from chat —\
  \ resolves `for_implementation`, `for_pr`, etc. ✅\n2. **Step 1 (verify-explicit-authorization):**\
  \ Reads issue comments / `comments.yaml` for a pre-existing \"approved\"/\"go\"\
  \ record — finds nothing because the authorization was just given in the chat session,\
  \ not yet recorded ❌\n3. **Step 3 (apply-label):** Would apply the label — but this\
  \ runs AFTER verification, and verification already failed because the label wasn't\
  \ there\n\n**Result:** The agent is authorized (the developer said \"approved\"\
  \ in chat) but the workflow deadlocks because it checks for recorded authorization\
  \ that it hasn't been allowed to write yet. This is a **confused deputy variant**:\
  \ the agent holds valid authority but its own workflow prevents it from exercising\
  \ that authority.\n\n**Research card:** `.issues/research-cards/authorization-session-vs-workflow-state.md`\
  \ documents the industry research supporting the record-then-verify pattern.\n\n\
  ### Approach Chosen\n\nReorder the `verify-authorization` workflow to a **record-then-verify**\
  \ pattern: (1) scope-auto-resolve, (2) record-authorization, (3) verify-recording,\
  \ (4) apply-label, (5) auto-dispatch. A new `record-authorization` task writes session\
  \ authorization into persistent issue state before any verification step reads it.\
  \ The existing `verify-explicit-authorization` task is replaced by a `verify-recording`\
  \ task that reads back the recorded state and confirms it matches what was written.\n\
  \n### Alternatives Considered & Why Discarded\n\n**(a) Modify `verify-explicit-authorization`\
  \ instead of replacing it.** The existing task is tightly coupled to reading pre-existing\
  \ authorization from issue comments. Adding write-then-read logic to the same task\
  \ violates SRP — it would both record and verify, making the task responsible for\
  \ two distinct concerns. A clean replacement (`verify-recording`) with a single\
  \ responsibility (read-back confirmation) is simpler to implement, test, and audit.\n\
  \n**(b) Use a different persistence mechanism (e.g., in-memory cache, environment\
  \ variable).** In-memory state is lost on session restart, which breaks the authorization\
  \ continuity guarantee. Environment variables are process-scoped and invisible to\
  \ sub-agents. The `.issues/` worktree is the canonical persistent state store for\
  \ issue metadata — using it ensures authorization records survive session boundaries\
  \ and are visible to all sub-agents.\n\n**(c) Skip recording and check chat directly.**\
  \ The chat transcript is ephemeral — it is not persisted in a structured, queryable\
  \ format. Sub-agents cannot read the orchestrator's chat context. Recording to `.issues/`\
  \ makes authorization visible to all pipeline stages, including clean-room sub-agents\
  \ that have no access to the orchestrator's session.\n\n### Key Design Decisions\n\
  \n- **Record before verify:** Authorization is written to persistent state before\
  \ any verification step reads it, eliminating the circular dependency.\n- **Single\
  \ responsibility per task:** `record-authorization` writes; `verify-recording` reads\
  \ back. No task does both.\n- **Three-file consistency:** Authorization is recorded\
  \ in three locations (`spec.md` frontmatter, `comments.yaml`, `issue.yaml` labels)\
  \ and all three are verified independently.\n- **Worktree commit:** The `.issues/`\
  \ worktree is committed after recording, ensuring the authorization record survives\
  \ session boundaries and is visible to sub-agents.\n\n## Not Included\n\n- Changes\
  \ to the `gap-fill-cascade` checklist items (they work correctly once authorization\
  \ is recorded)\n- Changes to `spec-to-plan-cascade` (it works correctly once spec\
  \ status is `approved`)\n- Changes to `scope-auto-resolve.md` (it works correctly)\n\
  - Changes to the `apply-label` task (it works correctly — just needs to run at the\
  \ right time)\n- Changes to the `verify-explicit-authorization` task (it will be\
  \ replaced by a `verify-recording` task)\n- Changes to the `verify-authorization`\
  \ workflow ordering in `approval-gate-scope/SKILL.md` Workflows section\n- Changes\
  \ to the `gap-fill-cascade` task files\n- Changes to the `auto-dispatch` task\n\n\
  ## Edge Cases\n\n### `.issues/` Worktree Not Initialized\n\nIf the `.issues/` worktree\
  \ has not been initialized (no orphan branch, no worktree checkout), the `record-authorization`\
  \ task cannot write to `comments.yaml`, `spec.md` frontmatter, or `issue.yaml`.\
  \ The task MUST check for worktree existence before writing and return BLOCKED with\
  \ `reason: ISSUES_WORKTREE_NOT_INITIALIZED` if the worktree is missing. The `verify-recording`\
  \ task MUST also check worktree existence and return BLOCKED if the worktree is\
  \ absent.\n\n### Malformed `spec.md` Frontmatter\n\nIf `spec.md` frontmatter is\
  \ malformed (missing YAML delimiters, invalid YAML, missing `status` field), the\
  \ `record-authorization` task MUST handle the parse failure gracefully — return\
  \ BLOCKED with `reason: MALFORMED_FRONTMATTER` rather than silently failing to update\
  \ the status field. The `verify-recording` task MUST also detect malformed frontmatter\
  \ and return BLOCKED.\n\n### Missing `comments.yaml`\n\nIf `comments.yaml` does\
  \ not exist (first-time authorization, or file was deleted), the `record-authorization`\
  \ task MUST create the file with the initial authorization record rather than failing.\
  \ The `verify-recording` task MUST handle a missing `comments.yaml` as a FAIL (no\
  \ authorization record exists) and return BLOCKED.\n\n### Commit Failure\n\nIf `git\
  \ commit` in the `.issues/` worktree fails (merge conflict, hook rejection, dirty\
  \ index), the `record-authorization` task MUST return BLOCKED with `reason: COMMIT_FAILED`\
  \ and include the git error output. The authorization data has been written to disk\
  \ but is not yet committed — the task MUST NOT report success without a successful\
  \ commit.\n\n### Concurrent Authorization Attempts\n\nIf two agents or sessions\
  \ attempt to record authorization for the same issue concurrently, the second commit\
  \ will fail (the worktree state changed between write and commit). The `record-authorization`\
  \ task MUST handle this by: (1) re-reading the current state, (2) verifying the\
  \ existing authorization record is compatible (same scope or higher), (3) either\
  \ skipping (if already authorized at same scope) or overwriting (if higher scope)\
  \ and retrying the commit. If the existing record has a conflicting scope, return\
  \ BLOCKED with `reason: CONCURRENT_AUTHORIZATION_CONFLICT`.\n\n## Cost Frame\n\n\
  This spec's success criteria are verified using the DDL (defect-discovery-latency)\
  \ cost model from `065-verification-honesty.md`. Cost is measured in defect-discovery-latency\
  \ — the time between defect introduction and defect discovery. Shorter DDL means\
  \ cheaper fixes; longer DDL means exponentially compounding cost.\n\n**Death spiral\
  \ dynamics:** Structural evidence (file exists, file non-empty) for a behavioral\
  \ change (workflow reordering that affects agent dispatch decisions) produces a\
  \ death spiral — the defect ships unchanged, is found in production, and the rework\
  \ cycle costs 1000× more than the skipped behavioral test would have cost. Each\
  \ rework cycle re-applies structural verification, which passes again for the next\
  \ behavioral defect. Cost compounds exponentially.\n\n**Break dynamics:** Behavioral\
  \ FAIL at gate 1 (pre-commit / pre-RED) catches the defect immediately. The test\
  \ costs minutes of execution time — a bounded delay. The fix costs the same bounded\
  \ delay. There is no downstream rework, no CI queue delay, no PR re-review, no production\
  \ incident. The total cost of the defect is the cost of running the behavioral test\
  \ — zero compared to the death spiral alternative.\n\nSCs that describe runtime-behavioral\
  \ changes (workflow reordering, agent dispatch decisions) are classified as `behavioral`\
  \ evidence type and verified via `opencode run` with stderr assertions. SCs that\
  \ describe file existence are classified as `structural` and verified via file existence\
  \ checks. This prevents the death spiral by catching behavioral defects at the earliest\
  \ possible gate.\n\n## SC Enforcement Gate\n\nAll success criteria MUST pass before\
  \ this implementation is considered complete. Partial implementation is not accepted.\
  \ Every SC has a declared evidence type and verification method — the verification\
  \ MUST use at minimum the evidence type specified. Using evidence below the minimum\
  \ type (e.g., structural evidence for a behavioral SC) is a CRITICAL VIOLATION per\
  \ `080-code-standards.md` §Evidence Type Taxonomy.\n\n## Success Criteria\n\n| ID\
  \ | Criterion | Evidence Type | Verification Method |\n|----|-----------|---------------|-------------------|\n\
  | SC-1 | A new `record-authorization` task exists at `approval-gate-scope/tasks/record-authorization.md`\
  \ that writes session authorization into persistent issue state | `structural` |\
  \ File exists at `approval-gate-scope/tasks/record-authorization.md` |\n| SC-2 |\
  \ The `record-authorization` task updates `spec.md` frontmatter to add `status:\
  \ approved` when the resolved scope is `for_implementation` or higher | `behavioral`\
  \ | Dispatch the task with a mock session authorization → verify `spec.md` frontmatter\
  \ contains `status: approved` |\n| SC-3 | The `record-authorization` task appends\
  \ an authorization record to `comments.yaml` with the authorization text, scope,\
  \ timestamp, and human attribution | `behavioral` | Dispatch the task → verify `comments.yaml`\
  \ contains a new entry with `author: \"human\"`, `scope: \"for_implementation\"\
  `, and a timestamp |\n| SC-4 | The `record-authorization` task updates `issue.yaml`\
  \ to add the `approved-for-{scope}` label | `behavioral` | Dispatch the task → verify\
  \ `issue.yaml` labels array contains `approved-for-implementation` (or matching\
  \ scope) |\n| SC-5 | The `record-authorization` task commits the `.issues/` worktree\
  \ changes after writing | `behavioral` | Dispatch the task → verify `git -C .issues/\
  \ status` shows clean working tree |\n| SC-6 | The `verify-authorization` fast-path\
  \ workflow in `approval-gate-scope/SKILL.md` is reordered to the record-then-verify\
  \ pattern: scope-auto-resolve → record-authorization → verify-recording → apply-label\
  \ → auto-dispatch | `behavioral` | Run `opencode run` with a prompt that triggers\
  \ the fast-path → assert stderr shows the new step order (record-authorization before\
  \ verify-recording, apply-label after verify-recording). Reference: `approval-gate-scope/SKILL.md`\
  \ Workflows section — fast-path workflow step sequence |\n| SC-7 | The `verify-authorization`\
  \ full-path workflow in `approval-gate-scope/SKILL.md` is reordered to the record-then-verify\
  \ pattern: scope-auto-resolve → record-authorization → verify-recording → apply-label\
  \ → item-decomposition → SC-traceability → sub-issues → spec-to-plan-cascade → gap-fill-cascade\
  \ → verify-codebase → verify-blockers → verify-closed-issue → verify-already-implemented\
  \ → auto-dispatch | `behavioral` | Run `opencode run` with a prompt that triggers\
  \ the full-path → assert stderr shows record-authorization at position 2 and verify-recording\
  \ at position 3. Reference: `approval-gate-scope/SKILL.md` Workflows section — full-path\
  \ workflow step sequence |\n| SC-8 | The `verify-explicit-authorization.md` task\
  \ is replaced by a `verify-recording.md` task that reads back the recorded state\
  \ and confirms it matches what was written | `structural` | File `verify-explicit-authorization.md`\
  \ no longer exists; file `verify-recording.md` exists at `approval-gate-scope/tasks/verify-authorization/verify-recording.md`\
  \ |\n| SC-9 | The `verify-recording` task checks that `spec.md` frontmatter has\
  \ `status: approved`, `comments.yaml` has the authorization record, and `issue.yaml`\
  \ has the label — and returns BLOCKED if any are missing | `behavioral` | Dispatch\
  \ the task after a successful record → verify PASS. Corrupt one of the three files\
  \ → verify BLOCKED with specific reason |\n| SC-10 | The `apply-label` task in the\
  \ fast-path and full-path workflows is moved to AFTER `record-authorization` and\
  \ `verify-recording` (it was previously step 3, now step 4) | `behavioral` | Run\
  \ `opencode run` with a prompt that triggers either workflow → assert stderr shows\
  \ apply-label dispatched after verify-recording. Reference: `approval-gate-scope/SKILL.md`\
  \ Workflows section — apply-label step position in both workflows |\n| SC-11 | The\
  \ `verify-authorization` gap-fill-path workflow in `approval-gate-scope/SKILL.md`\
  \ is reordered to the record-then-verify pattern: scope-auto-resolve → record-authorization\
  \ → verify-recording → gap-fill-cascade → auto-dispatch | `behavioral` | Run `opencode\
  \ run` with a prompt that triggers the gap-fill-path → assert stderr shows record-authorization\
  \ at position 2 and verify-recording at position 3. Reference: `approval-gate-scope/SKILL.md`\
  \ Workflows section — gap-fill-path workflow step sequence |\n| SC-12 | All three\
  \ workflows (fast-path, gap-fill-path, full-path) in `approval-gate-scope/SKILL.md`\
  \ have the `record-authorization` step inserted at position 2, immediately after\
  \ `scope-auto-resolve` | `behavioral` | Run `opencode run` with prompts that trigger\
  \ each workflow → assert stderr shows record-authorization is step 2 in all three.\
  \ Reference: `approval-gate-scope/SKILL.md` Workflows section — step numbering in\
  \ all three workflows |\n| SC-13 | The behavioral test harness MUST produce a `session.yaml`\
  \ artifact containing the SQLite DB export from the test home. If the SQLite DB\
  \ is missing from the test home, the harness MUST write `source_db: MISSING` (not\
  \ `null`, not a fallback path). The evaluation pipeline MUST treat `source_db: MISSING`\
  \ as a hard FAIL — no hunting for the DB elsewhere, no substitution with stderr/stdout\
  \ grep, no synthesis, no fabrication. The only recovery mechanism is to verify the\
  \ test does not violate clean-room separation (dedicated test home directory with\
  \ the test project inside it) | `behavioral` | Run a behavioral test → verify `session.yaml`\
  \ exists with `source_db:` pointing to a real path under `tmp/test-home-*/`. If\
  \ `source_db: MISSING`, the test is FAIL — diagnose the test home setup, not the\
  \ agent behavior |\n\n## Requirements\n\n1. The `record-authorization` task SHALL\
  \ write session authorization into persistent issue state.\n2. The `record-authorization`\
  \ task SHALL update `spec.md` frontmatter to add `status: approved` when the resolved\
  \ scope is `for_implementation` or higher.\n3. The `record-authorization` task SHALL\
  \ append an authorization record to `comments.yaml` with the authorization text,\
  \ scope, timestamp, and human attribution.\n4. The `record-authorization` task SHALL\
  \ update `issue.yaml` to add the `approved-for-{scope}` label.\n5. The `record-authorization`\
  \ task SHALL commit the `.issues/` worktree changes after writing.\n6. The `record-authorization`\
  \ task SHALL NOT verify that authorization exists — that is the `verify-recording`\
  \ task's responsibility.\n7. The `verify-recording` task SHALL read back the recorded\
  \ state and confirm it matches what was written.\n8. The `verify-recording` task\
  \ SHALL check `spec.md` frontmatter for `status: approved`, `comments.yaml` for\
  \ the authorization record, and `issue.yaml` for the label.\n9. The `verify-recording`\
  \ task SHALL return BLOCKED if any of the three checks fail.\n10. The `verify-explicit-authorization.md`\
  \ task SHALL be removed and replaced by `verify-recording.md`.\n11. The `apply-label`\
  \ task SHALL be moved to AFTER `record-authorization` and `verify-recording` in\
  \ all three workflows.\n12. The `record-authorization` step SHALL be step 2 in all\
  \ three workflows (fast-path, gap-fill-path, full-path), immediately after `scope-auto-resolve`.\n\
  13. The behavioral test harness `__export_sqlite_to_yaml` SHALL write `source_db:\
  \ MISSING` (not `null`, not a fallback path) when the SQLite DB is not found in\
  \ the test home.\n14. The behavioral test harness SHALL NOT fall back to production\
  \ XDG paths, environment variables, or any other location when the test home SQLite\
  \ DB is missing.\n15. The evaluation pipeline SHALL treat `source_db: MISSING` as\
  \ a hard FAIL — no substitution, no synthesis, no fabrication.\n13. The behavioral\
  \ test harness `__export_sqlite_to_yaml` SHALL write `source_db: MISSING` (not `null`,\
  \ not a fallback path) when the SQLite DB is not found in the test home.\n14. The\
  \ behavioral test harness SHALL NOT fall back to production XDG paths, environment\
  \ variables, or any other location when the test home SQLite DB is missing.\n15.\
  \ The evaluation pipeline SHALL treat `source_db: MISSING` as a hard FAIL — no substitution,\
  \ no synthesis, no fabrication.\n\n## Pipeline Gates\n\n- [ ] 1. Pre-work (git-workflow-branch)\
  \ — sub-agent: create feature branch, verify trunk tip\n- [ ] 2. SC-1, SC-8 (structural)\
  \ — sub-agent: create `record-authorization.md`, remove `verify-explicit-authorization.md`,\
  \ create `verify-recording.md`\n- [ ] 3. SC-2, SC-3, SC-4, SC-5 (behavioral) — sub-agent:\
  \ implement `record-authorization` task procedure\n- [ ] 4. SC-9 (behavioral) —\
  \ sub-agent: implement `verify-recording` task procedure\n- [ ] 5. SC-6, SC-7, SC-10,\
  \ SC-11, SC-12 (behavioral) — sub-agent: reorder three workflows in SKILL.md\n-\
  \ [ ] 6. Behavioral enforcement tests — sub-agent: write RED-phase tests for all\
  \ behavioral SCs\n- [ ] 6a. SC-13 (behavioral) — sub-agent: implement `source_db:\
  \ MISSING` in harness, remove production fallback paths\n- [ ] 7. Completeness gate\
  \ — sub-agent: verify all SCs covered\n- [ ] 8. Audit — sub-agent: adversarial audit\
  \ of all deliverables\n- [ ] 9. Finishing checklist — sub-agent: branch readiness,\
  \ pre-PR checks\n- [ ] 10. PR creation — sub-agent: create PR with evidence artifacts\n\
  \n## Items\n\n1. **SC-1, SC-8** — Create `record-authorization.md` task file; remove\
  \ `verify-explicit-authorization.md`; create `verify-recording.md` task file\n2.\
  \ **SC-2, SC-3, SC-4, SC-5** — Implement the `record-authorization` task procedure\
  \ (write spec.md, comments.yaml, issue.yaml, commit)\n3. **SC-9** — Implement the\
  \ `verify-recording` task procedure (read back and confirm)\n4. **SC-6, SC-7, SC-10,\
  \ SC-11, SC-12** — Reorder the three workflows in `approval-gate-scope/SKILL.md`\n\
  5. **SC-13** — Implement `source_db: MISSING` in harness `__export_sqlite_to_yaml`,\
  \ remove all production fallback paths\n\n## Dependencies\n\n- **Prerequisite:**\
  \ Research card at `.issues/research-cards/authorization-session-vs-workflow-state.md`\n\
  - **Prerequisite skill:** `approval-gate-scope` — the skill being modified\n- **Prerequisite\
  \ skill:** `spec-creation` — for the task card format reference\n- **Prerequisite\
  \ skill:** `git-workflow-branch` — for branch creation and commit workflow\n- **Prerequisite\
  \ skill:** `test-driven-development` — for RED/GREEN cycles\n\n## Traceability\n\
  \n| Requirement | SCs | Item |\n|-------------|-----|------|\n| REQ-1 | SC-1 | 1\
  \ |\n| REQ-2 | SC-2 | 2 |\n| REQ-3 | SC-3 | 2 |\n| REQ-4 | SC-4 | 2 |\n| REQ-5 |\
  \ SC-5 | 2 |\n| REQ-6 | SC-1 | 1 |\n| REQ-7 | SC-8, SC-9 | 1, 3 |\n| REQ-8 | SC-9\
  \ | 3 |\n| REQ-9 | SC-9 | 3 |\n| REQ-10 | SC-8 | 1 |\n| REQ-11 | SC-6, SC-7, SC-10,\
  \ SC-11, SC-12 | 4 |\n| REQ-12 | SC-6, SC-7, SC-11, SC-12 | 4 |\n| REQ-13, REQ-14,\
  \ REQ-15 | SC-13 | 5 |\n\n## Change Control\n\n| Date | Change | Reason | Authorized\
