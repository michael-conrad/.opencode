title: '[SPEC] Fix: Skill card descriptions reference abstract tool names instead
  of project-local paths'
status: open
labels:
- SPEC
- approved-for-pr
body: "---\nissue: .opencode#2142\ntitle: \"[SPEC] Fix: Skill card descriptions reference\
  \ abstract tool names instead of project-local paths\"\nstatus: draft\ncreated:\
  \ 2026-07-25\nlicense: MIT\nprovenance: AI-generated\nphase: 1\nphase_name: Skill\
  \ Description Fix\nauthors:\n  - OpenCode (deepseek-v4-flash)\n---\n\n> **Full spec\
  \ and artifacts: [`.opencode/.issues/2142/`](https://github.com/michael-conrad/.opencode/tree/issues-data/2142)**\
  \ — this issue is a condensed exec summary; the authoritative spec lives in the\
  \ `issues-data` branch.\n>\n> **Local artifacts:** `.opencode/.issues/2142/` — implementation\
  \ plan, card catalogue, dependency contracts, research, designs, audit findings\n\
  \n## Problem\n\nFour skill cards reference their tool dependencies by abstract domain\
  \ concept names in the YAML `description` field instead of by project-local path.\
  \ When the agent evaluates the description at Level 1 (the `<available_skills>`\
  \ list), the abstract name primes training-data lookups (e.g., `which z3`) instead\
  \ of consulting the `## Agent Tools` section from session-init.\n\nThis was discovered\
  \ during plan creation for `.opencode#2141` when the orchestrator ran `which z3`\
  \ instead of using `.opencode/tools/solve` — a tool that was listed in the `## Agent\
  \ Tools` section of session-init. The root cause was the `solve` skill's description\
  \ saying \"Z3 constraint solver\" which primed a system-binary lookup.\n\n## Affected\
  \ Skills\n\n| Skill | Description says | Primes agent to look for |\n|-------|----------------|------------------------|\n\
  | `solve` | \"Z3 constraint solver\" | `which z3` (system binary) |\n| `plan` |\
  \ \"Formal AI planning...PDDL conversion\" | `which unified-planning` or `pip list`\
  \ |\n| `plan-creation-pipeline` | \"Z3-verified state transitions\" | `which z3`\
  \ (system binary) |\n| `issue-operations-core` | \"routes to...GitBucket API\" |\
  \ `which gitbucket-api` (doesn't exist) |\n\n## Approach\n\nUpdate the `description`\
  \ field in each affected SKILL.md to lead with the project-local tool path (`.opencode/tools/<tool>`)\
  \ before the domain concept. This ensures the agent's first exposure to the skill\
  \ tells it where the tool lives, preventing training-data fallback.\n\n## Success\
  \ Criteria\n\n| ID | Criterion | Evidence Type | Verification Method |\n|----|-----------|---------------|---------------------|\n\
  | SC-1 | `solve/SKILL.md` description starts with `.opencode/tools/solve` | `string`\
  \ | grep on description field |\n| SC-2 | `plan/SKILL.md` description starts with\
  \ `.opencode/tools/plan` | `string` | grep on description field |\n| SC-3 | `plan-creation-pipeline/SKILL.md`\
  \ description references `.opencode/tools/solve` instead of bare \"Z3\" | `string`\
  \ | grep on description field |\n| SC-4 | `issue-operations-core/SKILL.md` description\
  \ references `.opencode/tools/gitbucket-api` instead of bare \"GitBucket API\" |\
  \ `string` | grep on description field |\n| SC-5 | All other skill descriptions\
  \ remain unchanged | `structural` | diff shows only 4 files modified |\n| SC-6 |\
  \ Behavioral test verifies agent does NOT run `which`/`command -v` for `.opencode/tools/`\
  \ tools | `behavioral` | `opencode run` with stderr assertions |\n\n## Requirements\n\
  \n| ID | Requirement | SC | Item |\n|----|-------------|----|------|\n| REQ-1 |\
  \ Update `solve/SKILL.md` description to lead with `.opencode/tools/solve` | SC-1\
  \ | 1 |\n| REQ-2 | Update `plan/SKILL.md` description to lead with `.opencode/tools/plan`\
  \ | SC-2 | 1 |\n| REQ-3 | Update `plan-creation-pipeline/SKILL.md` description to\
  \ reference `.opencode/tools/solve` | SC-3 | 1 |\n| REQ-4 | Update `issue-operations-core/SKILL.md`\
  \ description to reference `.opencode/tools/gitbucket-api` | SC-4 | 1 |\n| REQ-5\
  \ | Verify no other skill descriptions changed | SC-5 | 2 |\n| REQ-6 | Write behavioral\
  \ enforcement test for tool-lookup pattern | SC-6 | 3 |\n\n## Edge Cases\n\n1. **Description\
  \ length limit:** The description field is a Level 1 classifier with ~100 token\
  \ budget. Adding `.opencode/tools/solve` prefix must not push the description over\
  \ the effective limit. Verify each updated description stays within reasonable length.\n\
  2. **Existing consumers:** Skills that reference `solve` or `plan` by name in their\
  \ own descriptions (e.g., `writing-plans`, `implementation-pipeline`) are NOT affected\
  \ — they reference the skill name, not the tool path. No changes needed to consumer\
  \ skills.\n3. **`plan-creation-pipeline` references Z3 in body too:** The SKILL.md\
  \ body (not just description) mentions \"Z3-verified state transitions\" in the\
  \ description field. The body text is a separate concern — this spec only targets\
  \ the YAML `description` field.\n\n## Implementation Items\n\n1. Update 4 SKILL.md\
  \ description fields\n2. Verify no other descriptions changed (diff check)\n3. Write\
  \ behavioral enforcement test\n\n## Pipeline Gates\n\n| Gate | Phase | Check |\n\
  |------|-------|-------|\n| Pre-work | Before any edit | Branch creation, submodule\
  \ sync |\n| RED | Item 3 | Behavioral test fails before changes |\n| GREEN | Item\
  \ 1 | All 4 descriptions updated |\n| Verify | Item 2 | Diff shows exactly 4 files\
  \ changed |\n| Commit | After verify | All changes + test committed together |\n\
  | PR | After commit | PR created against main |\n"
