    implied_paths:
      - ".opencode/skills/writing-plans/tasks/structure.md"
    logic: "After phase decomposition, iterate over each SC's RED/GREEN/COMMIT steps. If any step belongs to a different phase than the SC's primary phase, reject with BLOCKED."
