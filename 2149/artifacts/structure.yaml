# Structure artifact for issue #2149
# Generated by structure task from writing-plans
# Decomposes SCs into phases, builds dependency DAG, selects skill+task from implementation-pipeline TDT

phases:
  - id: phase-1
    name: Centralized closing-keyword formatter
    description: Create a centralized closing-keyword formatter, update all PR body generation files, update downstream consumers, and add behavioral tests for valid keyword usage
    scs:
      - SC-1
      - SC-3
    items:
      - id: item-1
        sc: SC-1
        description: PR body uses only valid GitHub closing keywords (Fixes/Closes/Resolves/Implements)
        evidence_type: string + behavioral
        pipeline_steps:
          - red-phase
          - green-phase
          - structural-checks
          - green-doublecheck
          - green-vbc
      - id: item-2
        sc: SC-3
        description: All PR body generation files use a centralized closing-keyword formatter (or consistently correct inline patterns)
        evidence_type: string
        pipeline_steps:
          - red-phase
          - green-phase
          - structural-checks
          - green-doublecheck
          - green-vbc
    files:
      - .opencode/skills/git-workflow-pr/tasks/pr-creation/create-pr.md
      - .opencode/skills/git-workflow-pr/tasks/pair-pr-creation.md
      - .opencode/skills/requesting-code-review/tasks/prepare.md
      - .opencode/skills/pr-creation-workflow/tasks/pre-pr-checklist.md
      - .opencode/skills/git-workflow-pr/tasks/review-prep/report-url.md
      - .opencode/skills/git-workflow-cleanup/tasks/cleanup/issue-closure.md
      - .opencode/skills/audit/tasks/spec-summary/evaluator.md
      - .opencode/skills/audit/tasks/spec-summary/arbiter.md
    skill_task_selection:
      skill: implementation-pipeline
      task: assemble-work
      dispatch: orchestrator

  - id: phase-2
    name: Cross-repo closing keyword support
    description: Add cross-repo detection logic to all PR body generation files so that owner/repo#N format is used when the issue repo differs from the PR repo
    scs:
      - SC-2
    items:
      - id: item-3
        sc: SC-2
        description: Cross-repo references use owner/repo#N format when the issue repo differs from the PR repo
        evidence_type: behavioral
        pipeline_steps:
          - red-phase
          - green-phase
          - structural-checks
          - green-doublecheck
          - green-vbc
    files:
      - .opencode/skills/git-workflow-pr/tasks/pr-creation/create-pr.md
      - .opencode/skills/git-workflow-pr/tasks/pair-pr-creation.md
      - .opencode/skills/requesting-code-review/tasks/prepare.md
      - .opencode/skills/git-workflow-branch/tasks/provenance/trunk-push-provenance.md
    skill_task_selection:
      skill: implementation-pipeline
      task: assemble-work
      dispatch: orchestrator

  - id: phase-3
    name: Standalone reference and terminology fixes
    description: Fix invalid reference syntax in skill-card-change-types.md and rename autoclose list to issue-reference list in sub-issue-collection.md
    scs:
      - SC-4
      - SC-5
    items:
      - id: item-4
        sc: SC-4
        description: skill-card-change-types.md references use valid GitHub reference syntax (not .opencode#N)
        evidence_type: string
        pipeline_steps:
          - red-phase
          - green-phase
          - structural-checks
          - green-doublecheck
          - green-vbc
      - id: item-5
        sc: SC-5
        description: The sub-issue-collection.md task's "autoclose list" concept is renamed to "issue-reference list"
        evidence_type: semantic
        pipeline_steps:
          - red-phase
          - green-phase
          - structural-checks
          - green-doublecheck
          - green-vbc
    files:
      - .opencode/skills/reference/skill-card-change-types.md
      - .opencode/skills/pr-creation-workflow/tasks/sub-issue-collection.md
    skill_task_selection:
      skill: implementation-pipeline
      task: assemble-work
      dispatch: orchestrator

dependency_dag:
  edges:
    - from: phase-1
      to: phase-2
      reason: Cross-repo handling depends on centralized formatter being in place; phase-2 modifies the same files with additional cross-repo awareness
  independent_phases:
    - phase-3
    description: Phase 3 (reference fix + rename) has no dependency on either phase-1 or phase-2

triplet_integrity:
  status: PASS
  note: Each SC is fully contained within a single phase. SC-1 and SC-3 are co-located in phase-1. SC-2 is in phase-2. SC-4 and SC-5 are in phase-3.

cross_phase_dependency:
  status: PASS
  note: No RED test in any phase depends on uncommitted SC output from another phase. Phase-2 depends on phase-1 at the phase level (formatter must exist before cross-repo awareness is added), but each SC's RED/GREEN/COMMIT is self-contained within its phase.
