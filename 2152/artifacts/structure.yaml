  - sc: SC-7
    description: Verify no programmatic enforcement changes introduced
    evidence_type: structural
    verification_method: Confirm no new files in .opencode/plugins/, .opencode/hooks/, or .opencode/tools/; confirm no new enforcement code in diffs
    phase: final-verification
    pipeline_steps:
      - green-doublecheck (structural check: ls for new files, diff review for enforcement code)
      - sc-count-gate
      - pre-pr-gate

dependency_dag:
  edges:
    - from: phase-1
      to: phase-2
      rationale: Phase 2 modifies guideline files (000-critical-rules.md, 020-go-prohibitions.md) which are structurally independent of Phase 1's prompt/AGENTS.md changes. However, Phase 2 should follow Phase 1 to maintain a clean commit history — prompt changes first, then guideline changes.
  intra_phase_edges:
    phase-1:
      - from: item-1 (SC-1)
        to: item-3 (SC-3)
        rationale: SC-3 cross-references SC-1's Step 2.5 within default.txt. SC-1 must be applied first so the cross-reference target exists.
      - from: item-1 (SC-1)
        to: item-2 (SC-2)
        rationale: SC-2 replicates the same Step 2.5 wording to AGENTS.md. Apply to default.txt first (SC-1), then replicate to AGENTS.md (SC-2) for consistency.
    phase-2:
      - from: item-4 (SC-4)
        to: item-5 (SC-5)
        rationale: SC-5 corrects the restart target within the same sections modified by SC-4. Apply wording replacement first, then correct the restart target.
      - from: item-4 (SC-4)
        to: item-6 (SC-6)
        rationale: SC-6 changes tier classification in the same sections modified by SC-4. Apply wording replacement first, then change tier.

triplet_integrity:
