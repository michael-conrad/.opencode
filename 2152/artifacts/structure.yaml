  note: Each SC's RED, GREEN, and COMMIT steps are in the same phase. No SC has its test in one phase and implementation in another.

cross_phase_dependency:
  status: PASS
  note: Phase 1 RED tests (grep on default.txt, AGENTS.md) do not depend on Phase 2 output. Phase 2 RED tests (grep on guideline files) do not depend on Phase 1 output. No cross-phase RED dependency violations.

checkpoint_strategy:
  - phase-1: After item-1, item-2, item-3 committed (prompts/default.txt + AGENTS.md changes)
  - phase-2: After item-4, item-5, item-6 committed (guideline wording changes)
  - final: After SC-7 verification (no-programmatic-change constraint confirmed)

