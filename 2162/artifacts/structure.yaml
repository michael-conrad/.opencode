dependency_dag:
  edges:
    - from: 1
      to: 2
      reason: "Labels must exist (Phase 1) before they can be applied (Phase 2)"
    - from: 2
      to: 3
      reason: "Labels must be applied (Phase 2) before they can be documented (Phase 3)"
triplet_integrity:
  status: PASS
  notes: "All SCs have RED, GREEN, and COMMIT steps in the same phase. No triplet splits detected."
cross_phase_dependency:
  status: PASS
  notes: "No RED test depends on uncommitted SC output from another phase. Phase 2 RED tests are behavioral (opencode run) and test against live platform state, not Phase 1 output. Phase 3 RED test is a grep and does not depend on Phase 2 output."
