state_transitions:
  - sc: SC-1
    from: No timestamp in output
    to: Timestamp emitted in stdout
    trigger: main() execution
  - sc: SC-2
    from: Timestamp absent or misplaced
    to: Timestamp after Git branch line, before ## CLI Auth Status
