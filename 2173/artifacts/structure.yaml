        sc: SC-2
        description: chmod +x on session-init
        red: Verify session-init is NOT executable in committed submodule (git ls-tree shows 100644)
        green: git -C .opencode chmod +x tools/session-init
        verify: git -C .opencode ls-tree HEAD -- tools/session-init shows mode 100755
        commit: Commit mode change
      - item: 3
        sc: SC-3
        description: Verify session-init runs without Permission denied
        red: Write test that verifies session-init exits with code 0
        green: (already done by item 2 — chmod +x)
        verify: Run .opencode/tools/session-init; assert exit code 0
        commit: Included in item 2 commit
