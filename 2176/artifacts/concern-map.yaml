      - .opencode/skills/writing-plans/tasks/structure.md
      - .opencode/skills/writing-plans/tasks/solve.md
      - .opencode/skills/writing-plans/tasks/self-review.md
      # Cross-reference audit target
      - .opencode/ (entire tree)
    phases: [5]
    scs: [SC-7]

  z3_inline_check:
    description: Single inline Z3 check per phase after AUDIT, no bifurcation, no skip condition
    affected_files:
      - .opencode/skills/implementation-pipeline/SKILL.md
      - .opencode/skills/implementation-pipeline/pipeline-state-machine.yaml
    phases: [1]
    scs: [SC-8]
