# Concern Map — Spec #2176
# Maps concern areas to affected files

concerns:
  tdt_updates:
    description: Update implementation-pipeline TDT to remove old steps and add new 6-step cycle
    affected_files:
      - .opencode/skills/implementation-pipeline/SKILL.md
      - .opencode/skills/implementation-pipeline/pipeline-state-machine.yaml
    phases: [1, 4]
    scs: [SC-1]

  path_fixes:
    description: Fix stale git-workflow/tasks/ path references to correct sub-skill paths
    affected_files:
      - .opencode/skills/implementation-pipeline/SKILL.md
      - .opencode/skills/completion-core/SKILL.md
      - .opencode/skills/approval-gate-scope/tasks/verify-closed-issue.md
      - .opencode/skills/pr-creation-workflow/tasks/create.md
      - .opencode/guidelines/065-verification-honesty.md
      - .opencode/CHANGELOG.md
      - .opencode/.guidelines/registry.yaml
    phases: [2]
    scs: [SC-2]

  sub_agent_dispatch_prohibition:
    description: Remove skill()+task() imperative instructions from task files that sub-agents cannot execute
    affected_files:
      # 30+ task files across skills — full enumeration requires audit
      - .opencode/skills/implementation-pipeline/tasks/ (multiple)
      - .opencode/skills/writing-plans/tasks/ (multiple)
      - .opencode/skills/approval-gate/tasks/ (multiple)
      - .opencode/skills/git-workflow/tasks/ (multiple)
      - .opencode/skills/git-workflow-pr/tasks/ (multiple)
      - .opencode/skills/verification-before-completion/tasks/ (multiple)
      - .opencode/skills/audit/tasks/ (multiple)
      - .opencode/skills/spec-creation/tasks/ (multiple)
      - .opencode/skills/executing-plans/tasks/ (multiple)
      - .opencode/skills/finishing-a-development-branch/tasks/ (multiple)
    phases: [3]
    scs: [SC-3]

  resolve_models_cleanup:
    description: Remove stale resolve-models/auditor_1/auditor_2 references from SKILL.md Sub-Agent Routing sections
    affected_files:
      - .opencode/skills/implementation-pipeline/SKILL.md
      - .opencode/skills/audit/SKILL.md
      - .opencode/skills/verification-before-completion/SKILL.md
      - .opencode/skills/verification/SKILL.md
      - .opencode/skills/completeness-gate/SKILL.md
      - .opencode/skills/executing-plans/SKILL.md
      - .opencode/skills/finishing-a-development-branch/SKILL.md
      - .opencode/skills/git-workflow/SKILL.md
      - .opencode/skills/git-workflow-pr/SKILL.md
      - .opencode/skills/issue-operations/SKILL.md
      - .opencode/skills/issue-review/SKILL.md
      - .opencode/skills/pr-creation-workflow/SKILL.md
      - .opencode/skills/spec-creation/SKILL.md
      - .opencode/skills/writing-plans/SKILL.md
    phases: [3]
    scs: [SC-4]

  pipeline_restructuring:
    description: Collapse per-item cycle (15+ steps to 6) and writing-plans pipeline (8+ steps to 4)
    affected_files:
      - .opencode/skills/implementation-pipeline/SKILL.md
      - .opencode/skills/writing-plans/SKILL.md
      - .opencode/skills/writing-plans/tasks/explore.md
      - .opencode/skills/writing-plans/tasks/structure.md
      - .opencode/skills/writing-plans/tasks/solve.md
      - .opencode/skills/writing-plans/tasks/self-review.md
    phases: [4]
    scs: [SC-5]

  checkpoint_inline:
    description: Make checkpoint tag creation inline (orchestrator runs git directly), remove checkpoint-commit step
    affected_files:
      - .opencode/skills/implementation-pipeline/SKILL.md
      - .opencode/skills/implementation-pipeline/tasks/checkpoint-tag-create.md
    phases: [5]
    scs: [SC-6]

  legacy_file_removal:
    description: Remove 12 legacy task files and audit all cross-references
    affected_files:
      - .opencode/skills/implementation-pipeline/tasks/cross-validate.md
      - .opencode/skills/implementation-pipeline/tasks/resolve-models.md
      - .opencode/skills/implementation-pipeline/tasks/checkpoint-tag-create.md
      - .opencode/skills/implementation-pipeline/tasks/sc-count-gate.md
      - .opencode/skills/implementation-pipeline/tasks/pre-red-baseline.md
      - .opencode/skills/implementation-pipeline/tasks/post-red-enforcement.md
      - .opencode/skills/implementation-pipeline/tasks/post-green-enforcement.md
      - .opencode/skills/implementation-pipeline/tasks/tdd-chaining-gate.md
      - .opencode/skills/implementation-pipeline/tasks/pre-flight.md
