    risk: Phase 3 may modify the file, Phase 5 removes it
    mitigation: If Phase 3 modifies it, the modification is wasted work — file is removed in Phase 5.
          RECOMMENDATION: Remove in Phase 3 instead of Phase 5, or skip Phase 3 modifications for files slated for removal.

