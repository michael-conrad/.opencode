# Cross-Cutting Matrix — Spec #2176
# Files and concerns that appear in multiple phases

cross_cutting_concerns:
  - file: .opencode/skills/implementation-pipeline/SKILL.md
    appears_in_phases: [1, 4]
    concern: TDT updates (Phase 1) + pipeline restructuring (Phase 4)
    risk: Phase 4 depends on Phase 1 — TDT must be updated before pipeline restructuring
    mitigation: Phase 1 must complete before Phase 4 begins; same file modified twice

  - file: .opencode/skills/implementation-pipeline/SKILL.md
