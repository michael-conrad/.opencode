# Dependency Contract — Plan #2176
# Generated by revise task from writing-plans
# Encodes the phase dependency DAG for pipeline execution ordering

schema_version: "1.0"
issue: 2176

phases:
  - id: 1
    name: "TDT and state machine updates"
    scs: [SC-1, SC-8]
    depends_on: []
    parallel_with: []
    rationale: "Root phase — no dependencies. All other phases depend on Phase 1 completing first (shared implementation-pipeline/SKILL.md and pipeline-state-machine.yaml)."

  - id: 2
    name: "Fix path references"
    scs: [SC-2]
    depends_on: [1]
    parallel_with: [3]
    rationale: "Depends on Phase 1 because both modify implementation-pipeline/SKILL.md. Can run in parallel with Phase 3 (different file sets — Phase 3 modifies task files and SKILL.md files outside implementation-pipeline)."

  - id: 3
    name: "Sub-agent dispatch prohibition"
    scs: [SC-3, SC-4]
    depends_on: [1]
    parallel_with: [2]
    rationale: "Depends on Phase 1 because the skip_list references implementation-pipeline task files whose existence is guaranteed by Phase 1's state. Can run in parallel with Phase 2 (different file sets)."

  - id: 4
    name: "Pipeline restructuring"
    scs: [SC-5]
    depends_on: [1]
    parallel_with: []
    rationale: "Depends on Phase 1 — TDT must be updated first before the per-item cycle can be collapsed. Also modifies implementation-pipeline/SKILL.md."

  - id: 5
    name: "File cleanup"
    scs: [SC-6, SC-7]
    depends_on: [1, 2, 3, 4]
    parallel_with: []
    rationale: "Depends on all prior phases — removes legacy task files that may still be referenced by earlier phases' dispatch instructions, and modifies the same implementation-pipeline/SKILL.md and pipeline-state-machine.yaml."

edges:
  - from: 1
    to: 2
    type: sequential
    reason: "Shared file: implementation-pipeline/SKILL.md"
  - from: 1
    to: 3
    type: sequential
    reason: "Skip list references Phase 1 task files; Phase 1 must complete first"
  - from: 1
    to: 4
    type: sequential
    reason: "TDT must be updated before pipeline can be restructured"
  - from: 1
    to: 5
    type: sequential
    reason: "Phase 5 modifies same files as Phase 1"
  - from: 2
    to: 5
    type: sequential
    reason: "Phase 5 removes files that Phase 2 may reference"
  - from: 3
    to: 5
    type: sequential
    reason: "Phase 5 removes files that Phase 3 may reference"
  - from: 4
    to: 5
    type: sequential
    reason: "Phase 5 removes files that Phase 4 may reference"

parallel_groups:
  - group: 1
    phases: [2, 3]
    rationale: "Phases 2 and 3 modify different file sets and can execute concurrently after Phase 1 completes"

invariants:
  - "z3.Implies(phase_2_completed, phase_1_completed)"
  - "z3.Implies(phase_3_completed, phase_1_completed)"
  - "z3.Implies(phase_4_completed, phase_1_completed)"
  - "z3.Implies(phase_5_completed, z3.And(phase_1_completed, phase_2_completed, phase_3_completed, phase_4_completed))"
