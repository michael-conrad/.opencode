# Concern map for submodule detection mechanism replacement
# Issue: .opencode#2180

concerns:
  - id: submodule-detection-mechanism
    description: How submodules are discovered at the filesystem level
    old_approach: "ls -d .git/ */.git/ */.git/ glob with sed pipeline to strip .git suffix"
    new_approach: "git submodule status with awk '{print $2}' to extract paths"
    root_cause: "Glob trailing slash requires directory entries; gitdir files are not matched"

  affected_components:
    - skill: git-workflow-cleanup
