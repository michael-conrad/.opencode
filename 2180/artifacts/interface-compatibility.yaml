# Interface compatibility analysis for submodule detection replacement
# Issue: .opencode#2180

analysis:
  old_interface: "ls -d .git/ */.git/ */.git 2>/dev/null | sed 's|/\\.git$||' | sed 's|/$||'"
  new_interface: "git submodule status 2>/dev/null | awk '{print $2}'"

output_comparison:
  old_output_format: |
    Directory names with .git suffix stripped:
    - "." (self/parent repo)
    - ".opencode" (submodule)
    - "some-other-submodule"
  new_output_format: |
    Paths from git submodule status column 2:
    - ".opencode"
    - "some-other-submodule"
    (Note: parent repo "." is NOT included in git submodule status output)

  compatibility: functionally_equivalent
  differences:
    - attribute: parent_repo_inclusion
      old: includes "." for parent repo
      new: does NOT include "." (git submodule status only lists registered submodules)
      impact: SUBMODULE_PATHS filtering already skips "." — no behavioral change
    - attribute: path_format
      old: paths without .git suffix (via sed stripping)
      new: paths without .git suffix (native from git submodule status)
      impact: identical format
    - attribute: submodule_registration
      old: detects any directory with a .git/ subdirectory (registered or unregistered)
      new: detects only registered submodules (those in .gitmodules)
      impact: This is the INTENDED behavior — unregistered submodules should not be cleaned up
    - attribute: gitdir_file_handling
      old: FAILS when .git is a gitdir file (the bug being fixed)
      new: WORKS correctly with gitdir files
      impact: This is the PRIMARY fix — the whole reason for the change

downstream_consumers:
  - consumer: SUBMODULE_PATHS filtering loop
    old_input: "REPO_PATHS containing '.' and submodule dirs"
    new_input: "REPO_PATHS containing submodule dirs only (no '.')"
    compatibility: fully_compatible
    reason: "The loop already skips '.' with '[ \"$RP\" = \".\" ] && continue'. With new output, this check is a no-op but harmless"

  - consumer: branch-cleanup submodule descent
    old_input: "Submodule directory paths"
    new_input: "Submodule directory paths"
    compatibility: fully_compatible
    reason: "Same path format, same iteration pattern"

  - consumer: issue-closure fallback repo mapping
    old_input: "Submodule directory paths"
    new_input: "Submodule directory paths"
    compatibility: fully_compatible
    reason: "Same path format, same git -C \"$RP\" remote URL resolution"

  - consumer: cleanup routing context
    old_input: "Submodule directory paths"
    new_input: "Submodule directory paths"
    compatibility: fully_compatible
    reason: "Same path format, same SUBMODULE_PATHS construction"

  - consumer: operating-protocol tag suffix derivation
    old_input: "Submodule directory paths"
    new_input: "Submodule directory paths"
    compatibility: fully_compatible
    reason: "Same path format, same directory name extraction"

  - consumer: pre-work submodule initialization check
    old_input: "Submodule directory paths"
    new_input: "Submodule directory paths"
    compatibility: fully_compatible
    reason: "Same path format, same 'if non-root repos found' logic"

  - consumer: provenance entry criteria
    old_input: "Glob scan detects non-root git repos"
    new_input: "git submodule status detects registered submodules"
    compatibility: fully_compatible
    reason: "Both detect submodules; new method is more correct"

verdict: functionally_equivalent
rationale: "The replacement produces the same set of submodule paths for all registered submodules. The only difference is that unregistered submodules are no longer detected — this is the intended fix, not a regression. All downstream consumers are compatible with the new output format."
