    verification_command: |
      grep -n "ls -d \.git/" .opencode/skills/git-workflow-cleanup/tasks/cleanup.md && echo "FAIL" || echo "PASS"
      grep -n "git submodule status" .opencode/skills/git-workflow-cleanup/tasks/cleanup.md | grep "awk" && echo "PASS" || echo "FAIL"

  - id: TC-6
    sc: SC-6
