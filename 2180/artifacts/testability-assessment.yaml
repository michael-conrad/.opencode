global_verification:
  - id: GV-1
    description: "Verify NO occurrences of old pattern remain in any affected skill"
    command: |
      grep -rn "ls -d \.git/" .opencode/skills/git-workflow-cleanup/ .opencode/skills/git-workflow-branch/
    expected: "No output (zero matches)"

  - id: GV-2
    description: "Verify sed pipeline is removed from all code-block contexts"
    command: |
      grep -rn "sed 's|/\\.git" .opencode/skills/git-workflow-cleanup/ .opencode/skills/git-workflow-branch/
    expected: "No output (zero matches) — sed pipeline should be removed from all 5 code-block contexts"

  - id: GV-3
    description: "Verify new pattern exists in all 7 affected files"
    command: |
      for f in \
        .opencode/skills/git-workflow-cleanup/tasks/cleanup/branch-cleanup.md \
        .opencode/skills/git-workflow-cleanup/tasks/cleanup/issue-closure.md \
        .opencode/skills/git-workflow-cleanup/tasks/check-pr.md \
        .opencode/skills/git-workflow-cleanup/tasks/cleanup.md \
        .opencode/skills/git-workflow-branch/tasks/operating-protocol.md \
        .opencode/skills/git-workflow-branch/tasks/pre-work.md \
        .opencode/skills/git-workflow-branch/tasks/provenance.md; do
        grep -q "git submodule status" "$f" && echo "PASS: $f" || echo "FAIL: $f"
      done
    expected: "All 7 files report PASS"

test_environment:
  required_tools: [grep]
  setup: "None — verification is grep-only on task files"
  isolation: "No test home needed (no opencode run required)"
