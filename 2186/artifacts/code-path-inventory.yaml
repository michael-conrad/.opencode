      ### Step 8.1: Apply lifecycle labels gated on PASS

      When the final judgment is PASS, apply the `spec-passed-review` label and remove
      `spec-under-review`:

      1. Read `final_judgment.status` from the synthesized judgment
      2. If `final_judgment.status == "PASS"`:
         a. Use the platform's label API to add `spec-passed-review` to the spec issue
            identified by `spec_issue_number`
         b. Use the platform's label API to remove `spec-under-review` from the spec issue
         c. The `spec-passed-review` label indicates the spec has passed audit review
      3. If `final_judgment.status == "DRAFT"` or `"FAIL"`:
         a. Leave labels unchanged — spec remains `spec-under-review`
