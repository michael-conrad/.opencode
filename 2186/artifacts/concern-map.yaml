## Concern Definition

concerns:
  - id: C-1
    name: "Lifecycle label placement in spec-audit DiMo chain"
    description: >
      Which role in the spec-audit chain (Investigator → Validator → Evaluator → Arbiter)
      is responsible for applying lifecycle labels (spec-under-review, spec-passed-review)
      to the spec issue. Currently labels are applied prematurely by Validator and Evaluator.
      The fix moves all lifecycle label application to the Arbiter, gated on clean PASS.

