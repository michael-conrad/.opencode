## Success Criteria Testability

success_criteria:
  - id: SC-1
    description: "spec-audit-validator.md no longer contains spec-passed-review or spec-draft label operations"
    evidence_type: "string"
    verification_method: "grep for absence of spec-passed-review and spec-draft in validator file"
    testable: true
    test_command: "grep -n 'spec-passed-review\\|spec-draft' .opencode/skills/audit/tasks/spec-audit-validator.md"
    expected_result: "exit code 1 (no matches)"
    notes: "Simple grep for absence. Both label strings must be absent from the file."

  - id: SC-2
    description: "spec-audit-arbiter.md contains label-application logic gated on clean PASS"
    evidence_type: "string"
    verification_method: "grep for spec-passed-review and spec-under-review in arbiter file, with conditional on PASS"
    testable: true
    test_command: >
      grep -n 'spec-passed-review' .opencode/skills/audit/tasks/spec-audit-arbiter.md &&
      grep -n 'spec-under-review' .opencode/skills/audit/tasks/spec-audit-arbiter.md &&
      grep -n 'PASS' .opencode/skills/audit/tasks/spec-audit-arbiter.md
    expected_result: "Both label strings present, with PASS conditional context"
    notes: "Verification requires checking that label operations are gated on final_judgment.status == PASS, not just that the strings exist."

  - id: SC-3
    description: "spec-audit-evaluator.md no longer contains spec-passed-review label application in Step 4"
    evidence_type: "string"
    verification_method: "grep for absence of spec-passed-review in evaluator file (Step 0.1 spec-under-review is preserved)"
    testable: true
    test_command: "grep -n 'spec-passed-review' .opencode/skills/audit/tasks/spec-audit-evaluator.md"
    expected_result: "exit code 1 (no matches)"
    notes: >
      Only spec-passed-review must be absent. spec-under-review is expected in Step 0.1
      and must be preserved. Test must distinguish between the two labels.

  - id: SC-4
    description: "No other role in the spec-audit chain applies lifecycle labels"
    evidence_type: "string"
    verification_method: "grep all 4 spec-audit task files for label operations — only arbiter and evaluator Step 0.1 may have them"
    testable: true
    test_command: >
      for f in .opencode/skills/audit/tasks/spec-audit-{investigator,validator,evaluator,arbiter}.md; do
        echo "=== $f ===";
        grep -n 'spec-passed-review\\|spec-under-review\\|spec-draft' "$f" || echo "(none)";
      done
    expected_result: >
      Only evaluator.md (spec-under-review in Step 0.1) and arbiter.md
      (spec-passed-review and spec-under-review) may have matches.
      investigator.md and validator.md must have zero matches.
    notes: "Investigator should have no label operations. Validator should have none after fix."

