# Testability Assessment — gh-cli Skill Creation
# Generated: 2026-07-30
# Source: .opencode/.issues/2191/spec.md

spec_path: .opencode/.issues/2191/spec.md
issue: 2191
title: "gh-cli skill creation"

# Testability assessment per SC with evidence type, method, and DDL cost

sc_testability:
  - sc: SC-1
    description: "SKILL.md exists with valid YAML frontmatter"
    evidence_type: structural
    test_method: "ls + head + wc -c"
    test_command: "ls .opencode/skills/gh-cli/SKILL.md && head -5 .opencode/skills/gh-cli/SKILL.md | grep -E '^name:|^description:|^license:' && wc -c < .opencode/skills/gh-cli/SKILL.md | awk '{print $1}'"
    ddl_cost: "seconds"
    ddl_multiplier: "1x"
    automation_possible: true
    ci_suitable: true
    notes: "Static file check — no runtime needed"

  - sc: SC-2
    description: "SKILL.md uses routing-only template (no procedure sections)"
    evidence_type: string
    test_method: "grep for prohibited section headers"
    test_command: "grep -E '^## (Entry Criteria|Procedure|Operating Protocol)' .opencode/skills/gh-cli/SKILL.md"
    ddl_cost: "seconds"
    ddl_multiplier: "1x"
    automation_possible: true
    ci_suitable: true
    notes: "Pattern match — no runtime needed"

  - sc: SC-3
    description: "Description uses agent-intent format (no meta-instruction patterns)"
    evidence_type: string
    test_method: "grep for prohibited meta-instruction patterns"
    test_command: "grep -E '(Load via skill\\(\\) when|User phrases:|Dispatch when)' .opencode/skills/gh-cli/SKILL.md"
    ddl_cost: "seconds"
    ddl_multiplier: "1x"
    automation_possible: true
    ci_suitable: true
    notes: "Pattern match — no runtime needed"

  - sc: SC-13
    description: "Source description remediated from user-utterance format"
    evidence_type: string
    test_method: "grep for user-utterance framing patterns"
    test_command: "grep -E '(when the user asks|Use this skill when|when the user)' .opencode/skills/gh-cli/SKILL.md"
    ddl_cost: "seconds"
    ddl_multiplier: "1x"
    automation_possible: true
    ci_suitable: true
    notes: "Pattern match — no runtime needed"

  - sc: SC-4
    description: "Exactly 4 core workflow task cards exist"
    evidence_type: structural
    test_method: "ls + count"
    test_command: "ls .opencode/skills/gh-cli/tasks/ | grep -E '^(authenticate|create-pr|triage-issues|review-pr)\\.md$' | wc -l"
    ddl_cost: "seconds"
    ddl_multiplier: "1x"
    automation_possible: true
    ci_suitable: true
    notes: "File count — no runtime needed"

  - sc: SC-5
    description: "Each task card has all 6 required sections"
    evidence_type: string
    test_method: "grep for section headers in each task card"
    test_command: "for f in .opencode/skills/gh-cli/tasks/*.md; do grep -q '^## Purpose' $f && grep -q '^## Task Discipline' $f && grep -q '^## Entry Criteria' $f && grep -q '^## Procedure' $f && grep -q '^## Exit Criteria' $f && grep -q '^## Result Contract' $f || echo MISSING_SECTIONS: $f; done"
    ddl_cost: "seconds"
    ddl_multiplier: "1x"
    automation_possible: true
    ci_suitable: true
    notes: "Pattern match across all files — no runtime needed"

  - sc: SC-6
    description: "No gh command overlap with git-workflow"
    evidence_type: semantic
    test_method: "Sub-agent reads both gh-cli and git-workflow task cards, compares procedure steps"
    test_command: "Sub-agent dispatch: read gh-cli tasks + git-workflow tasks, compare for duplicate gh commands"
    ddl_cost: "minutes"
    ddl_multiplier: "10x"
    automation_possible: false
    ci_suitable: false
    notes: "Requires semantic understanding — sub-agent must read and compare. String matching alone insufficient because same operation may use different flag order."

  - sc: SC-7
    description: "Auth status check in entry criteria for all auth-dependent operations"
    evidence_type: string
    test_method: "grep for auth status in all task cards"
    test_command: "grep -l 'auth status\\|gh auth' .opencode/skills/gh-cli/tasks/*.md | wc -l"
    ddl_cost: "seconds"
    ddl_multiplier: "1x"
    automation_possible: true
    ci_suitable: true
    notes: "Pattern match — no runtime needed"

  - sc: SC-8
    description: "Skill appears in available_skills at runtime"
    evidence_type: behavioral
    test_method: "opencode run with prompt that triggers gh CLI intent; verify skill appears in available_skills via stderr"
    test_command: "bash .opencode/tests-v2/with-test-home opencode run 'list my open issues' | grep -q 'gh-cli'"
    ddl_cost: "minutes"
    ddl_multiplier: "1x (break)"
    automation_possible: true
    ci_suitable: true
    notes: "Requires behavioral test with real AI model. Only behavioral testing catches runtime auto-discovery failures. Structural check (file exists) would pass even if auto-discovery is broken."

  - sc: SC-9
    description: "All 20 command categories covered across 16 workflow task cards"
    evidence_type: string
    test_method: "grep for each of the 20 command categories across all task cards"
    test_command: "for cat in auth pr issue release repo run secret codespace org gist ssh-key gpg-key project alias extension completion search browse label api; do grep -q -i $cat .opencode/skills/gh-cli/tasks/*.md || echo MISSING: $cat; done"
    ddl_cost: "seconds"
    ddl_multiplier: "1x"
    automation_possible: true
    ci_suitable: true
    notes: "Pattern match — no runtime needed"

  - sc: SC-10
    description: "Exactly 3 end-to-end workflow examples"
    evidence_type: structural
    test_method: "Count example sections in common-workflows.md"
    test_command: "grep -c '^### Example' .opencode/skills/gh-cli/tasks/common-workflows.md"
    ddl_cost: "seconds"
    ddl_multiplier: "1x"
    automation_possible: true
    ci_suitable: true
    notes: "Section count — no runtime needed"

  - sc: SC-11
    description: "gh pr merge prohibition with critical violation block"
    evidence_type: string
    test_method: "grep for pr merge prohibition or critical-rules-merge reference"
    test_command: "grep -E 'pr merge|critical-rules-merge' .opencode/skills/gh-cli/tasks/pr-management.md"
    ddl_cost: "seconds"
    ddl_multiplier: "1x"
    automation_possible: true
    ci_suitable: true
    notes: "Pattern match — no runtime needed"

  - sc: SC-12
    description: "SPDX + provenance headers and AI byline in all files"
    evidence_type: string
    test_method: "grep for SPDX and byline in all task cards"
    test_command: "for f in .opencode/skills/gh-cli/tasks/*.md; do grep -q 'SPDX-FileCopyrightText' $f && grep -q 'Co-authored with AI' $f || echo MISSING_HEADERS: $f; done"
    ddl_cost: "seconds"
    ddl_multiplier: "1x"
    automation_possible: true
    ci_suitable: true
    notes: "Pattern match across all files — no runtime needed"

# Test execution strategy
test_execution_strategy:
  pre_commit:
    - structural checks: SC-1, SC-4, SC-10
    - string checks: SC-2, SC-3, SC-5, SC-7, SC-9, SC-11, SC-12, SC-13
    notes: "All structural and string checks can run in pre-commit hook (<1s each)"

  pre_pr:
    - semantic check: SC-6
    notes: "Semantic check requires sub-agent dispatch — run before PR creation"

  behavioral:
    - behavioral test: SC-8
    notes: "Behavioral test requires opencode run with real AI model — run in CI or pre-merge"

