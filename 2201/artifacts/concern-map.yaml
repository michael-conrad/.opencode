artifact_name: concern-map
generated_at: 2026-08-12
source: "Spec #2201"
content:
  description: "Map of concerns to phases for the 6-phase gb-cli skill creation"
  phases:
    - phase: 1
      name: "Local GitBucket investigation"
      concern: "Per-workflow applicability assessment against local test GitBucket instance"
      scs:
        - SC-17
      dependencies: []
      key_deliverables:
        - "gb-workflow-applicability.yaml artifact with APPLIES/REVISED/DISCARDED per gh-cli workflow"
        - "Identification of gb-specific workflows (milestones, repo fork/delete, api-requests)"
      dispatch: "investigation task"
    - phase: 2
      name: "Skill directory and SKILL.md creation"
      concern: "Create gb-cli skill card with valid routing-only frontmatter"
      scs:
        - SC-1
        - SC-2
        - SC-3
        - SC-4
        - SC-5
      dependencies:
        - "Phase 1 (workflow applicability assessment determines dispatch contracts)"
      key_deliverables:
        - ".opencode/skills/gb-cli/SKILL.md with name: gb-cli, description <=1024 chars, agent-intent format"
        - "Routing-only template (no procedure text)"
        - "SPDX, Provenance, AI co-authored byline headers"
      dispatch: "per-item RED/GREEN"
    - phase: 3
      name: "Task cards creation"
      concern: "Workflow-based task cards adapted from gh-cli, filtered by Phase 1"
      scs:
        - SC-6
        - SC-7
        - SC-8
        - SC-9
        - SC-11
        - SC-12
        - SC-13
      dependencies:
        - "Phase 2 (SKILL.md Workflows section references task cards)"
      key_deliverables:
        - "11 task cards (authenticate, create-pr, triage-issues, review-pr, manage-repo, manage-labels, manage-milestones, search-investigate, api-requests, completion, common-workflows)"
        - "Canonical 6-section structure in each task card"
        - "gb auth status entry criterion in auth-dependent task cards"
        - "gb pr merge prohibition with CRITICAL VIOLATION block"
        - "No duplicate gb commands vs git-workflow task cards"
        - "SPDX, Provenance, AI co-authored byline headers"
      dispatch: "per-item RED/GREEN"
    - phase: 4
      name: "Cross-reference integration"
      concern: "Wire gb-cli into existing skills and AGENTS.md"
      scs:
        - SC-18
      dependencies:
        - "Phase 2 (gb-cli skill exists to reference)"
      key_deliverables:
        - "gb-cli cross-references in git-workflow, issue-operations, gitbucket-api, release-promoter SKILL.md files"
        - "AGENTS.md gb CLI documentation section updated"
      dispatch: "per-item RED/GREEN"
    - phase: 5
      name: "Behavioral enforcement tests"
      concern: "Behavioral tests for skill discovery, auth checks, merge prohibition"
      scs:
        - SC-10
      dependencies:
        - "Phases 2-3 (skill and task cards exist to be discovered)"
      key_deliverables:
        - "3 behavioral test scripts: gb-cli-skill-discovery.sh, gb-cli-auth-check.sh, gb-cli-merge-prohibition.sh"
        - "gb-cli appears in <available_skills> after deployment"
      dispatch: "behavioral RED/GREEN"
    - phase: 6
      name: "gitbucket-api adaptation"
      concern: "Adapt gitbucket-api sub-skill to delegate to gb-cli"
      scs:
        - SC-19
        - SC-20
      dependencies:
        - "Phases 2-3 (gb-cli skill and task cards exist as delegation targets)"
      key_deliverables:
        - "gitbucket-api SKILL.md delegates to gb-cli for workflow-level operations"
        - "7 gitbucket-api task files have duplicated gb CLI command reference tables removed/replaced with cross-references"
      dispatch: "per-item RED/GREEN"
  concern_to_phase_mapping:
    "Per-workflow applicability assessment": 1
    "gb-cli SKILL.md creation": 2
    "Workflow-based task cards": 3
    "Cross-reference integration": 4
    "Behavioral enforcement tests": 5
    "gitbucket-api delegation adaptation": 6
  phase_independence:
    description: "Phases are strictly sequential — each phase depends on the previous"
    independent_phases: []
    prerequisite_phase: 1
    dependent_phase: 6
