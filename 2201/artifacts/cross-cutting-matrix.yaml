artifact_name: cross-cutting-matrix
generated_at: 2026-08-12
source: "Spec #2201"
content:
  description: "Cross-cutting concerns across the 6-phase gb-cli skill creation, mapped to SCs and verification gates"
  cross_cutting_concerns:
    - sc_ids:
        - SC-1
        - SC-2
        - SC-3
        - SC-6
        - SC-7
        - SC-12
        - SC-14
        - SC-15
        - SC-16
      name: "File creation integrity — new files exist, are structurally valid, and carry required headers"
      evidence_type: "structural + string"
      verification_method: "ls for existence (structural); grep for frontmatter name, description length via wc -c, 6-section headers, SPDX-FileCopyrightText, Provenance:, Co-authored with AI (string)"
      phases_affected:
        - 2
        - 3
      verification_gate: pre-commit
      remediation: "Create missing files; add missing headers; fix frontmatter; trim description to <=1024 chars"
    - sc_ids:
        - SC-4
        - SC-5
      name: "SKILL.md template compliance — routing-only, agent-intent description"
      evidence_type: string
      verification_method: "grep for prohibited sections (Entry Criteria, Procedure, Operating Protocol) and prohibited meta-instruction patterns (Load via skill() when, User phrases:, Dispatch when)"
      phases_affected:
        - 2
      verification_gate: pre-commit
      remediation: "Remove procedure text; rewrite description in agent-intent format"
    - sc_ids:
        - SC-9
        - SC-13
      name: "Safety and authentication guards — auth status entry criterion and merge prohibition"
      evidence_type: string
      verification_method: "grep all auth-dependent task cards for 'auth status' in Entry Criteria; grep create-pr and review-pr task cards for 'pr merge' prohibition or 'critical-rules-merge'"
      phases_affected:
        - 3
      verification_gate: pre-commit
      remediation: "Add gb auth status entry criterion to auth-dependent task cards; add CRITICAL VIOLATION block for gb pr merge"
    - sc_ids:
        - SC-8
      name: "No overlap with git-workflow — gb commands must not duplicate git-workflow procedures"
      evidence_type: semantic
      verification_method: "Sub-agent reads both gb-cli and git-workflow task cards; confirms no duplicate procedure steps for PR creation, branch management, or commit operations"
      phases_affected:
        - 3
      verification_gate: post-implementation
      remediation: "Remove duplicated procedure steps from gb-cli task cards; add cross-reference to git-workflow"
    - sc_ids:
        - SC-11
      name: "Command coverage — all gb CLI commands from capability manifest covered"
      evidence_type: string
      verification_method: "grep task cards for each gb command category (auth, pr, issue, label, milestone, repo, api, completion)"
      phases_affected:
        - 3
      verification_gate: pre-commit
      remediation: "Add missing gb command categories to appropriate task cards"
    - sc_ids:
        - SC-10
      name: "Skill discovery — gb-cli appears in <available_skills> after deployment"
      evidence_type: behavioral
      verification_method: "opencode run with prompt triggering gb CLI intent; verify gb-cli appears in available_skills via stderr"
      phases_affected:
        - 5
      verification_gate: post-implementation
      remediation: "Fix skill directory structure or frontmatter; re-run behavioral test"
    - sc_ids:
        - SC-17
      name: "Investigation artifact — per-workflow applicability assessment"
      evidence_type: string
      verification_method: "Artifact file exists at .opencode/.issues/2201/artifacts/gb-workflow-applicability.yaml with entries for each gh-cli workflow and rationale"
      phases_affected:
        - 1
      verification_gate: pre-commit
      remediation: "Produce the applicability assessment artifact in Phase 1"
    - sc_ids:
        - SC-18
      name: "Cross-reference integration — gb-cli referenced in 4 target SKILL.md files"
      evidence_type: string
      verification_method: "grep each SKILL.md (git-workflow, issue-operations, gitbucket-api, release-promoter) for gb-cli cross-reference entry"
      phases_affected:
        - 4
      verification_gate: pre-commit
      remediation: "Add missing gb-cli cross-reference to target SKILL.md files"
    - sc_ids:
        - SC-19
        - SC-20
      name: "Delegation — gitbucket-api delegates to gb-cli for workflow-level operations"
      evidence_type: semantic + string
      verification_method: "SC-19: sub-agent reads both SKILL.md files, confirms gb-cli is primary entry point and gitbucket-api delegates. SC-20: grep 7 gitbucket-api task files for gb CLI command reference tables — confirm removed or replaced with gb-cli cross-references"
      phases_affected:
        - 6
      verification_gate: post-implementation
      remediation: "Update gitbucket-api SKILL.md description and cross-references; replace duplicated gb command tables with gb-cli references"
  cross_cutting_verification_gates:
    - gate: pre-commit
      scs:
        - SC-1
        - SC-2
        - SC-3
        - SC-4
        - SC-5
        - SC-6
        - SC-7
        - SC-9
        - SC-11
        - SC-12
        - SC-13
        - SC-14
        - SC-15
        - SC-16
        - SC-17
        - SC-18
    - gate: post-implementation
      scs:
        - SC-8
        - SC-10
        - SC-19
        - SC-20
