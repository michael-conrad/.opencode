# Per-Workflow Applicability Assessment: gh-cli → gb CLI v0.6.1
# Issue: .opencode#2201 — Phase 1 Local GitBucket Investigation (SC-17)
# Date: 2026-08-12
# Method: each gh-cli reference workflow assessed against live gb CLI v0.6.1
#   commands run against a local test GitBucket instance (provisioned via the
#   sanctioned test harness __ensure_gitbucket, port 33905, repo root/test-repo).

investigation:
  issue: .opencode#2201
  phase: 1
  sc: SC-17
  date: "2026-08-12"
  instance: "local test GitBucket (GitBucket 4.46.x WAR, port 33905)"
  reference_template: "gh-cli skill workflows (20 workflows)"
  tool_version: "gb 0.6.1"
  evidence:
    - "gb auth status -H http://localhost:33905 → logged in as root"
    - "gb repo view root/test-repo → repository details returned"
    - "gb repo list root → root/test-repo listed"
    - "gb issue create -t test-issue -R root/test-repo → created issue #1"
    - "gb issue view 1 --comments -R root/test-repo → issue + comments returned"
    - "gb issue close 1 -R root/test-repo → web fallback notice (REST state update unavailable)"
    - "gb label list -R root/test-repo → bug/duplicate/enhancement/invalid returned"
    - "gb label create test-label --color #123456 -R root/test-repo → created"
    - "gb milestone create v1.0 -R root/test-repo → created milestone #1"
    - "gb milestone list -R root/test-repo → #1 OPEN v1.0"
    - "gb pr create -t test-pr --head main -B main -R root/test-repo → prompts (not a terminal); PR view/diff need a real PR"
    - "gb pr comment 1 -b test-comment -R root/test-repo → comment added"
    - "gb pr merge --help → merge command exists (PROHIBITED for agent use per critical-rules-merge)"
    - "gb pr checkout --help → checkout command exists"
    - "gb repo fork root/test-repo → web fallback notice (REST fork unavailable, browser prompt)"
    - "gb repo delete --help → delete command exists"
    - "gb api /repos/root/test-repo -R root/test-repo → JSON returned"
    - "gb api /repos/root/test-repo/branches -R root/test-repo → branches JSON returned"
    - "gb api /user → user JSON returned"
    - "gb completion bash → shell completion script emitted"
    - "gb search --help → 'unrecognized subcommand' (no search command)"
    - "gb ssh-key --help → 'unrecognized subcommand' (no ssh-key command)"
    - "gb gpg-key --help → 'unrecognized subcommand' (no gpg-key command)"

workflows:
  authenticate:
    gh_reference: "gh auth status / login"
    classification: APPLIES
    rationale: "gb auth status and gb auth login map 1:1 to gh auth status/login. Entry criterion verified live: gb auth status reports logged-in identity per host."
    gb_commands: ["gb auth status", "gb auth login -H <host> -t <token> --protocol <http|https>"]
  create-pr:
    gh_reference: "gh pr create / gh pr view"
    classification: APPLIES
    rationale: "gb pr create -t <title> -b <body> --head <branch> -B <base> -R O/R and gb pr view map to gh pr create/view. --detect-existing prevents duplicate PRs. NOTE: gb pr merge exists but is PROHIBITED for agent use per critical-rules-merge (human-only merge)."
    gb_commands: ["gb pr create -t <title> -b <body> --head <branch> -B <base> -R O/R", "gb pr view <N> -R O/R"]
    restrictions: ["gb pr merge MUST NOT be invoked by agents — human-only merge per critical-rules-merge"]
  triage-issues:
    gh_reference: "gh issue list / view / edit / comment / close"
    classification: APPLIES
    rationale: "gb issue list/view/edit/close/reopen/comment map 1:1 to gh issue operations. Verified live: create, view --comments, close (close uses web fallback for state update on this instance)."
    gb_commands: ["gb issue list -R O/R [--state ...]", "gb issue view <N> --comments -R O/R", "gb issue edit <N> -R O/R", "gb issue close <N> -R O/R", "gb issue comment <N> -b <body> -R O/R"]
  review-pr:
    gh_reference: "gh pr list / view --diff / checkout / review"
    classification: REVISED
    rationale: "gb pr list/view/diff/checkout exist, but there is NO gb pr review command (no formal review-approval flow). PR review is performed via gb pr diff + gb pr comment. Task card must adapt the review workflow to comment-based feedback."
    gb_commands: ["gb pr list -R O/R", "gb pr view <N> -R O/R", "gb pr diff <N> -R O/R", "gb pr checkout <N> -R O/R", "gb pr comment <N> -b <body> -R O/R"]
    replaced_by: "comment-based review — no formal review approval API in gb CLI"
  do-release:
    gh_reference: "git tag + gh release create / upload / view"
    classification: DISCARDED
    rationale: "gb has NO release command and GitBucket has no Releases concept. Tag creation stays on git CLI; release artifact creation is via gb api passthrough or the platform web UI. The gh release workflow does not map to a gb workflow."
    gb_commands: []
    alternative: "git tag -a + gb api passthrough to repo endpoint; release-promoter skill remains the release owner"
  search-investigate:
    gh_reference: "gh search repos/issues/prs/code + gh browse"
    classification: REVISED
    rationale: "gb has NO search subcommand (verified: 'unrecognized subcommand'). Search is performed by iterative listing + client-side filter (gb issue list / gb pr list / gb repo list) or gb api passthrough to available endpoints. gb browse exists and maps to gh browse."
    gb_commands: ["gb issue list -R O/R", "gb pr list -R O/R", "gb repo list [owner]", "gb api <endpoint> -R O/R", "gb browse"]
  manage-repo:
    gh_reference: "gh repo create / fork / edit"
    classification: REVISED
    rationale: "gb repo create/list/view/clone/delete/fork exist. fork uses web fallback (browser prompt) on this instance; repo edit is NOT a gb command — settings changes go through gb api passthrough or web UI. gb-specific: fork and delete are first-class gb commands (delete is NOT available in gh)."
    gb_commands: ["gb repo create <name> [-g group]", "gb repo fork O/R", "gb repo delete O/R", "gb repo view O/R", "gb repo list [owner]", "gb repo clone O/R"]
    gb_specific: true
  run-ci-cd:
    gh_reference: "gh run list / view / rerun / cancel"
    classification: DISCARDED
    rationale: "gb has NO Actions/run command (verified: no run subcommand). GitBucket has no GitHub Actions equivalent. CI/CD is outside the gb CLI surface."
    gb_commands: []
  manage-secrets:
    gh_reference: "gh secret / gh variable"
    classification: DISCARDED
    rationale: "gb has NO secret or variable commands. GitBucket has no Actions secrets concept exposed via gb CLI."
    gb_commands: []
  manage-codespaces:
    gh_reference: "gh codespace"
    classification: DISCARDED
    rationale: "gb has NO codespace command. GitBucket has no Codespaces feature."
    gb_commands: []
  manage-org:
    gh_reference: "gh org view / list-members / repo list"
    classification: DISCARDED
    rationale: "gb has NO org command. GitBucket groups are exposed only through gb repo create -g <group> and gb repo list [owner]; there is no org member-management or org-details surface in gb CLI."
    gb_commands: ["gb repo list [owner]", "gb repo create <name> -g <group>"]
  manage-gists:
    gh_reference: "gh gist"
    classification: DISCARDED
    rationale: "gb has NO gist command. GitBucket gist plugin exists on the platform but is not exposed through the gb CLI."
    gb_commands: []
  ssh-gpg-keys:
    gh_reference: "gh ssh-key / gh gpg-key"
    classification: DISCARDED
    rationale: "gb has NO ssh-key or gpg-key commands (verified: both 'unrecognized subcommand'). Key management is not exposed through the gb CLI."
    gb_commands: []
  label-management:
    gh_reference: "gh label list / create / edit / delete"
    classification: APPLIES
    rationale: "gb label list/view/create/edit/delete map 1:1 to gh label operations. Verified live: list and create work against the instance."
    gb_commands: ["gb label list -R O/R", "gb label view <name> -R O/R", "gb label create <name> --color <hex> -R O/R", "gb label edit <name> -R O/R", "gb label delete <name> --yes -R O/R"]
  project-management:
    gh_reference: "gh project list / view"
    classification: DISCARDED
    rationale: "gb has NO project command and GitBucket has no GitHub Projects equivalent. Milestones (gb milestone) are the nearest analog and are covered by the gb-specific manage-milestones workflow."
    gb_commands: ["gb milestone list -R O/R", "gb milestone create <title> -R O/R"]
  status:
    gh_reference: "gh status"
    classification: REVISED
    rationale: "gb has no single status-overview command (gb auth status covers auth only). An account/workflow status overview is composed from gb issue list + gb pr list with state filters. Task card must document the composed check."
    gb_commands: ["gb issue list -R O/R --state open", "gb pr list -R O/R --state open"]
  aliases-extensions:
    gh_reference: "gh alias / gh extension"
    classification: DISCARDED
    rationale: "gb has NO alias or extension commands. The gb config subcommand manages host profiles, not shell aliases or CLI extensions."
    gb_commands: ["gb config list", "gb config get <key>", "gb config set <key> <value>"]
  api-requests:
    gh_reference: "gh api"
    classification: APPLIES
    rationale: "gb api <endpoint> [-X method] [--input ...] maps 1:1 to gh api and is the gb-specific passthrough for operations without a dedicated command (e.g., releases/tags, post-creation label mutation). Verified live: /repos/root/test-repo, /repos/root/test-repo/branches, /user all return JSON."
    gb_commands: ["gb api <endpoint> [-X <method>] [--input <json>] -R O/R"]
    gb_specific: true
  completion:
    gh_reference: "gh completion -s <shell>"
    classification: APPLIES
    rationale: "gb completion <shell> maps 1:1 to gh completion. Verified live: gb completion bash emits a completion script."
    gb_commands: ["gb completion <shell>"]
  common-workflows:
    gh_reference: "gh end-to-end workflow examples (PR creation, issue triage, release management)"
    classification: REVISED
    rationale: "End-to-end examples must be adapted: PR creation (gb pr create) and issue triage (gb issue CRUD) apply directly; the release-management example has no gb equivalent and is replaced by a milestone-management or tag+api example. New examples may be validated against the local instance."
    gb_commands: ["gb pr create ... + gb pr view ...", "gb issue list ... + gb issue edit ... + gb issue comment ...", "gb milestone create ... + gb milestone list ..."]

gb_specific_workflows:
  - name: manage-milestones
    rationale: "gb milestone list/view/create/edit/delete is a first-class gb command group with no gh-cli counterpart workflow (gh project management is discarded in favor of milestones). Verified live: milestone create and list work against the instance."
    commands: ["gb milestone list -R O/R", "gb milestone view <N> -R O/R", "gb milestone create <title> -R O/R", "gb milestone edit <N> -R O/R", "gb milestone delete <N> -R O/R"]
  - name: manage-repo-with-fork-delete
    rationale: "gb repo exposes fork and delete as first-class commands (delete has no gh equivalent; fork exists in gh but is surfaced differently in gb and requires web fallback on this instance). These make manage-repo a gb-specific workflow distinct from the gh manage-repo reference."
    commands: ["gb repo create <name> [-g group]", "gb repo fork O/R", "gb repo delete O/R", "gb repo view O/R", "gb repo list [owner]"]
  - name: api-requests
    rationale: "gb api passthrough is the gb-specific mechanism for operations without a dedicated command (releases/tags, post-creation label mutation, repository settings edit). Verified live against the instance."
    commands: ["gb api <endpoint> [-X <method>] [--input <json>] -R O/R"]

summary:
  total_gh_workflows: 20
  applies: [authenticate, create-pr, triage-issues, label-management, api-requests, completion]
  revised: [review-pr, search-investigate, manage-repo, status, common-workflows]
  discarded: [do-release, run-ci-cd, manage-secrets, manage-codespaces, manage-org, manage-gists, ssh-gpg-keys, project-management, aliases-extensions]
  gb_specific_added: [manage-milestones, manage-repo-with-fork-delete, api-requests]

downstream_notes:
  - "Phase 2 (SKILL.md) Workflows section dispatch contracts derive from this assessment: APPLIES workflows map directly; REVISED workflows get adapted dispatch; DISCARDED workflows are omitted."
  - "Phase 3 task cards: 11 task cards (authenticate, create-pr, triage-issues, review-pr, manage-repo, manage-labels, manage-milestones, search-investigate, api-requests, completion, common-workflows) per plan context."
  - "gb pr merge prohibition (critical-rules-merge) is scoped to create-pr and review-pr task cards."
