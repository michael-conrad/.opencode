artifact_name: interface-compatibility
generated_at: 2026-08-12
source: "Spec #2201"
content:
  description: "Interface boundaries and compatibility analysis for the gb-cli skill creation"
  regression_invariants:
    - invariant: "Existing gitbucket-api sub-skill keeps its platform-scoped routing role (issue/PR/label/repo CRUD routing, owner/repo resolution, auth verification, error recovery)"
      verification: "gitbucket-api task files retain platform-specific routing logic after adaptation (SC-20)"
    - invariant: "git-workflow skill remains the sole owner of git operations (branch, commit, merge, PR creation via git)"
      verification: "SC-8 — no gb command in gb-cli task cards duplicates git-workflow procedures"
    - invariant: "issue-operations dispatcher remains the entry point for issue platform routing"
      verification: "issue-operations/SKILL.md unchanged except added gb-cli cross-reference"
    - invariant: "release-promoter retains its release workflow ownership"
      verification: "release-promoter/SKILL.md unchanged except added gb-cli cross-reference"
    - invariant: "gb pr merge remains human-only (critical-rules-merge)"
      verification: "SC-13 — CRITICAL VIOLATION block in create-pr and review-pr task cards"
    - invariant: "New gb-cli skill must not create naming/path conflicts in .opencode/skills/"
      verification: "Phase 2 conflict check — no existing gb-cli directory (verified ABSENT in blast-radius)"
  interface_boundaries:
    skill_calls:
      status: "ADDED"
      description: "skill({name: 'gb-cli'}) becomes a new entry point for gb CLI workflows"
      affected_skills:
        - gb-cli (new)
        - git-workflow (cross-reference)
        - issue-operations (cross-reference)
        - gitbucket-api (delegation target)
        - release-promoter (cross-reference)
    task_calls:
      status: "ADDED"
      description: "task(..., prompt: 'execute <workflow> from gb-cli') dispatches to gb-cli task cards (authenticate, create-pr, triage-issues, review-pr, manage-repo, manage-labels, manage-milestones, search-investigate, api-requests, completion, common-workflows)"
    delegation_contract:
      status: "NEW"
      description: "gitbucket-api delegates workflow-level gb command sequences to gb-cli task cards"
      details:
        - "gitbucket-api SKILL.md description updated to indicate delegation"
        - "7 gitbucket-api task files retain platform routing but reference gb-cli task cards for gb command sequences"
      precedence: "gb-cli is the PRIMARY entry point for gb workflows (SC-19)"
    git_operation_boundary:
      status: "UNCHANGED"
      description: "git operations (branch, commit, merge) remain owned by git-workflow; gb-cli create-pr/review-pr task cards reference git-workflow for branch operations"
      rationale: "Prevents command duplication per SC-8"
    available_skills_discovery:
      status: "AUTO"
      description: "opencode auto-discovers skills in .opencode/skills/ — gb-cli appears in <available_skills> after deployment (SC-10)"
      requirement: "Valid YAML frontmatter (name, description <=1024 chars, license, compatibility)"
  external_interface_impact:
    skill_api: "ADDITIVE — new gb-cli skill; no existing skill removed"
    task_api: "ADDITIVE — new gb-cli task cards; no existing task removed"
    cross_references: "MINOR — gitbucket-api/git-workflow/issue-operations/release-promoter SKILL.md files gain gb-cli references; gitbucket-api description updated"
    user_facing: "NONE — no user-facing API changes; gitbucket-api behavior preserved through delegation"
    test_suite: "ADDITIVE — 3 new behavioral tests in .opencode/tests-v2/behaviors/"
dependency_contract:
  variables:
    phase_1:
      type: bool
      description: "Local GitBucket investigation — SC-17"
    phase_2:
