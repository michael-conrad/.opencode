artifact_name: testability-assessment
generated_at: 2026-08-12
source: "Spec #2201"
content:
  description: "Test coverage assessment for the gb-cli skill creation across all 6 phases"
  behavioral_tests:
    skill_discovery:
      count: 1
      description: "SC-10 — gb-cli appears in <available_skills> after deployment"
      phases:
        - phase: 5
          test: "opencode run with prompt triggering gb CLI intent"
          assertion: "assert_stderr_pattern_present that gb-cli appears in available_skills"
          scs:
            - SC-10
    auth_check:
      count: 1
      description: "gb auth status verification before gb operations"
      phases:
        - phase: 5
          test: "opencode run with gb operation prompt; verify auth status check dispatched"
          assertion: "assert_stderr_pattern_present that gb auth status is checked (task dispatch or tool invocation)"
          scs:
            - SC-9
    merge_prohibition:
      count: 1
      description: "gb pr merge must NOT be called"
      phases:
        - phase: 5
          test: "opencode run with prompt that could trigger gb pr merge intent"
          assertion: "assert_stderr_pattern_absent_all_models that gb pr merge is never invoked"
          scs:
            - SC-13
  semantic_tests:
    no_overlap_with_git_workflow:
      count: 1
      description: "SC-8 — no gb command in gb-cli task cards duplicates git-workflow procedures"
      phases:
        - phase: 3
          test: "Sub-agent reads both gb-cli and git-workflow task cards; judges overlap for PR creation, branch management, commit operations"
          assertion: "No duplicate procedure steps identified"
          scs:
            - SC-8
    precedence_and_delegation:
      count: 1
      description: "SC-19 — gb-cli is primary entry point; gitbucket-api delegates"
      phases:
        - phase: 6
          test: "Sub-agent reads gb-cli SKILL.md and gitbucket-api SKILL.md; judges precedence and delegation"
          assertion: "gb-cli primary for gb workflows; gitbucket-api delegates workflow-level operations"
          scs:
            - SC-19
  string_tests:
    frontmatter_and_structure:
      count: 4
      description: "SC-1/SC-2/SC-3 (file exists, name matches, description <=1024 chars); SC-4 (routing-only template, no prohibited sections)"
      phases:
        - phase: 2
          test: "ls .opencode/skills/gb-cli/SKILL.md; grep frontmatter for name: gb-cli; wc -c description; grep for prohibited section patterns"
          assertion: "File exists; name matches; description <=1024 chars; no Entry Criteria/Procedure/Operating Protocol sections"
          scs:
            - SC-1
            - SC-2
            - SC-3
            - SC-4
    agent_intent_description:
      count: 1
      description: "SC-5 — description uses agent-intent format (no 'Load via skill() when', 'User phrases:', 'Dispatch when')"
      phases:
        - phase: 2
          test: "grep description for prohibited meta-instruction patterns"
          assertion: "No prohibited meta-instruction patterns present"
          scs:
            - SC-5
    task_card_existence_and_structure:
      count: 2
      description: "SC-6 (task cards exist for Phase 1-determined workflows); SC-7 (canonical 6-section structure)"
      phases:
        - phase: 3
          test: "ls .opencode/skills/gb-cli/tasks/; grep each task card for Purpose, Task Discipline, Entry Criteria, Procedure, Exit Criteria, Result Contract"
          assertion: "Expected task card files present; all 6 sections present in each"
          scs:
            - SC-6
            - SC-7
    auth_entry_criterion:
      count: 1
      description: "SC-9 — gb auth status entry criterion in all auth-dependent task cards"
      phases:
        - phase: 3
          test: "grep all auth-dependent task cards for 'auth status' in Entry Criteria"
          assertion: "Every auth-dependent task card includes auth status verification"
          scs:
            - SC-9
    command_coverage:
      count: 1
      description: "SC-11 — all gb CLI command categories from capability manifest covered"
      phases:
        - phase: 3
          test: "grep task cards for each gb command category (auth, pr, issue, label, milestone, repo, api, completion)"
          assertion: "Every gb command category present across task cards"
          scs:
            - SC-11
    merge_prohibition_text:
      count: 1
      description: "SC-13 — gb pr merge prohibition with CRITICAL VIOLATION block"
      phases:
        - phase: 3
          test: "grep create-pr and review-pr task cards for 'pr merge' prohibition or 'critical-rules-merge'"
          assertion: "Prohibition text present"
          scs:
            - SC-13
    headers_and_bylines:
      count: 3
      description: "SC-14 (SPDX-FileCopyrightText), SC-15 (Provenance:), SC-16 (Co-authored with AI) in all task cards"
      phases:
        - phase: 3
          test: "grep each task card for SPDX-FileCopyrightText, Provenance:, Co-authored with AI"
          assertion: "All three headers present in every task card"
          scs:
            - SC-14
            - SC-15
            - SC-16
    applicability_artifact:
      count: 1
      description: "SC-17 — per-workflow applicability assessment artifact"
      phases:
        - phase: 1
          test: "Artifact exists at .opencode/.issues/2201/artifacts/gb-workflow-applicability.yaml; grep for entries per gh-cli workflow with APPLIES/REVISED/DISCARDED + rationale"
          assertion: "Artifact exists with entries for each gh-cli workflow"
          scs:
            - SC-17
    cross_references:
      count: 1
      description: "SC-18 — gb-cli cross-references in git-workflow, issue-operations, gitbucket-api, release-promoter SKILL.md files"
      phases:
        - phase: 4
          test: "grep each of the 4 SKILL.md files for gb-cli cross-reference entry"
          assertion: "gb-cli cross-reference present in all 4 target SKILL.md files"
          scs:
            - SC-18
    no_duplicated_command_tables:
      count: 1
      description: "SC-20 — 7 gitbucket-api task files have duplicated gb CLI command reference tables removed/replaced"
      phases:
        - phase: 6
          test: "grep the 7 gitbucket-api task files for gb CLI command reference tables"
          assertion: "Duplicated tables removed or replaced with gb-cli cross-references"
          scs:
            - SC-20
    common_workflows:
      count: 1
      description: "SC-12 — Common Workflows task card with end-to-end examples"
      phases:
        - phase: 3
          test: "File exists with workflow examples"
          assertion: "common-workflows.md exists with end-to-end workflow examples"
          scs:
            - SC-12
  test_suite_summary:
    total_behavioral_tests: 3
    total_semantic_tests: 2
    total_string_tests: 17
    total_tests: 22
    test_execution_strategy:
      - "Behavioral tests run via bash .opencode/tests-v2/with-test-home opencode run '<message>'"
      - "Scope-limited execution: --changed or --tag filters by default; full suite only when model speed permits"
      - "Timeout >= 600s for behavioral tests (35B model inference)"
      - "Remove stale tmp/.behavior-run.lock before re-running"
