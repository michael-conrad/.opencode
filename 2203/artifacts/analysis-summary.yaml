artifact_type: analysis-summary
spec_title: "Decouple plan-writing from implementation-pipeline"
issue_number: 2203
generated_at: 2026-07-30T17:35:00Z

summary: |
  This spec refactors the plan-writing pipeline to remove its runtime dependency on the
  implementation-pipeline skill. The core approach is "delete-not-strip": all 23 sections
  of implementation-pipeline/SKILL.md (plus 4 enforcement docs and state machine) are
  subsumed into a static reference card at skills/writing-plans/reference/implementation-workflow.md.
  The plan writer tasks, research task, and validation task read this card instead of
  loading the live skill. The implementation-pipeline directory is then deleted entirely.

  The refactoring spans 4 phases across 13 items/SCs:
  - Phase 1: Create and populate the reference card
  - Phase 2: Update plan-writing tasks (create, research, validate, plan-artifact-format)
  - Phase 3: Delete source skill, update all cross-references, migrate coercion rule
  - Phase 4: Add behavioral enforcement tests, run final orphan reference sweep

  Key risks: partial cross-reference updates (mitigated by SC-13 grep sweep), behavioral
  test infrastructure failure (SC-3/4/5/10 would FAIL if harness unavailable).

key_findings:
  - finding: "Two-phase lookup problem eliminated"
    detail: Plan writer no longer calls skill() at runtime — reads static .md file directly
    confidence: HIGH

  - finding: "Zero parent-repo impact"
    detail: All changes are internal to .opencode/ — no files outside .opencode/ are affected
    confidence: HIGH

  - finding: "Pipeline chain is a rename, not structural change"
    detail: Old "implementation-pipeline" → new "execute-plan" preserves same phase ordering
    confidence: HIGH

  - finding: "Solve-based state management removed"
    detail: Plan step order IS the state machine — no explicit state file needed
    confidence: MEDIUM
    note: State guidance preserved as optional section in reference card

