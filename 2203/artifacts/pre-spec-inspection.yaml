patterns_and_conventions:
  - Convention: Reference cards live in `skills/<skill>/reference/` directory
    example: writing-plans/reference/plan-artifact-format.md
  - Convention: Skill task files read reference docs at runtime for authoritative data
    example: create.md reads plan-artifact-format.md for plan schema
  - Convention: TDT is currently the single source of truth for dispatch strings
    problem: Orchestrator must load implementation-pipeline skill at execution time to get strings
  - Convention: Cross-references use Read [Text](path) pattern
  - Convention: Audit tasks read implementation-pipeline/SKILL.md for gate sequence verification
