body: '## Objective

  Decouple the plan-writing pipeline from the implementation-pipeline skill by creating
  a static reference card containing ALL workflow content — dispatch strings, enforcement
  rules, coercion rule, artifact retention, remediation routing — so plans become fully
  self-contained and the orchestrator no longer depends on loading the implementation-pipeline
  skill.

  ## Background

  All content from `skills/implementation-pipeline/` (23 sections, 314 lines) is subsumed
  into a reference card at `skills/writing-plans/reference/implementation-workflow.md`.
  The skill directory is deleted entirely — no stripped shell remains, zero dependency
  on the implementation-pipeline skill.

  The refactoring moves ALL 23 content sections into the static reference card. The
  plan writer, research task, and validation task read this card instead of loading
  the live skill. All cross-references across `.opencode/` are updated. The pipeline
  chain `pre-work → implementation-pipeline → verification-before-completion → finishing-checklist
  → review-prep` is replaced with `pre-work → execute-plan → verification-before-completion
  → finishing-checklist → review-prep`.

  ## Not Included

  - CHANGELOG.md, README.md — informational only
  - dispatch-table.yaml — already DEPRECATED
  - scripts/session_context_triggers.py — name-only reference
  - tmp/rewrite_descriptions.py — throwaway script

  ## Success Criteria

  | ID | Criterion | Evidence Type |
  |----|-----------|---------------|
  | SC-1 | Reference card file exists | structural |
  | SC-2 | Card contains all 23 sections from pipeline skill | string |
  | SC-3 | create.md reads card instead of TDT | behavioral |
  | SC-4 | research.md reads card for skill+task selection | behavioral |
  | SC-5 | validate.md validates against card | behavioral |
  | SC-6 | plan-artifact-format.md references card | string |
  | SC-7 | skills/implementation-pipeline/ deleted entirely | string + structural |
  | SC-8 | ALL cross-references updated (45+ files) | string |
  | SC-9 | Pipeline chain references updated | string |
  | SC-10 | Behavioral enforcement tests exist | behavioral |
  | SC-11 | Coercion rule preserved in card; consumer refs updated | string |
  | SC-12 | State management guidance in card (optional section) | structural |
  | SC-13 | No orphaned references to deleted paths | string |

  ## Requirements

  1. Create reference card with all 23 content sections
  2. Update create.md to read reference card
  3. Update research.md to read reference card
  4. Update validate.md to validate against reference card
  5. Update plan-artifact-format.md validation rule
  6. DELETE skills/implementation-pipeline/ entirely
  7. Update ALL cross-references across .opencode/
  8. Update pipeline chain references
  9. Behavioral enforcement tests
  10. Coercion rule migration verified across consumers
  11. Zero orphaned references to deleted paths

  ## Phases

  Phase 1 — Reference Card Creation (items 1-2, SC-1/2)
  Phase 2 — Plan Writer Update (items 3-6, SC-3/4/5/6)
  Phase 3 — Delete + Cross-References (items 7/8/9/11/12, SC-7/8/9/11/12)
  Phase 4 — Cleanup & Tests (items 10/13, SC-10/13)

  > **Full spec and artifacts: [`.opencode/.issues/2203/`](https://github.com/michael-conrad/.opencode/tree/issues-data/2203)**
  — this issue is a condensed exec summary; the authoritative spec lives in the `issues-data`
  branch.

  >
  > **Local artifacts:** `.opencode/.issues/2203/` — implementation plan, card catalogue,
  dependency contracts, research, designs, audit findings'
