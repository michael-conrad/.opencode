    producers:
      - .opencode/reference/spec-structure-standards.md
      - .opencode/reference/plan-structure-standards.md
      - .opencode/reference/cost-model-standards.md
    compatibility_concerns:
      - Reference doc format must be parseable by LLM reading the task file
      - Relative path from task file to reference doc must be correct
