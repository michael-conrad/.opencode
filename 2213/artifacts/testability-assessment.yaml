# testability-assessment.yaml
# Generated by backfill task from spec.md
# Spec: .opencode/.issues/2213/spec.md
# Date: 2026-08-01

spec_path: ".opencode/.issues/2213/spec.md"
issue_number: 2213

testability_assessment:
  SC-1:
    evidence_type: structural
    test_method: "ls + git status"
    test_command: "ls .opencode/skills/plan-creation-pipeline/ 2>&1 || echo 'DELETED'"
    expected_result: "Directory does not exist"
    difficulty: TRIVIAL
    automation_possible: true
    notes: "Simple file existence check. Can be automated in CI with a shell script."

  SC-2:
    evidence_type: string + behavioral
    test_methods:
      - type: string
        description: "Verify handoff.md exists and contains approval-gate call"
        test_command: "grep -q 'approval-gate.*verify-authorization' .opencode/skills/writing-plans/tasks/handoff.md"
        expected_result: "Exit code 0"
        difficulty: TRIVIAL
        automation_possible: true
      - type: behavioral
        description: "Verify agent dispatches handoff task before analyze when creating a plan"
        test_command: "opencode run 'create a plan from spec #2213' --model <model> 2>&1 | grep -E 'handoff|verify-authorization'"
        expected_result: "Agent calls handoff task before analyze"
        difficulty: MODERATE
        automation_possible: true
        requires_model: true
        notes: "Behavioral test requires real model inference. Use with-test-home wrapper."

  SC-3:
    evidence_type: string
    test_method: "grep workflow order in SKILL.md"
    test_command: "grep -A 20 'Create a plan from an approved spec' .opencode/skills/writing-plans/SKILL.md | head -25"
    expected_result: "Workflow order shows: handoff -> analyze -> research -> create -> validate -> (revise loop) -> completion"
    difficulty: TRIVIAL
    automation_possible: true
    notes: "Simple string pattern check in SKILL.md Workflows section."

  SC-4:
    evidence_type: string + behavioral
    test_methods:
      - type: string
        description: "Verify completion.md contains local-issues sync"
        test_command: "grep -q 'local-issues sync' .opencode/skills/writing-plans/tasks/completion.md"
        expected_result: "Exit code 0"
        difficulty: TRIVIAL
        automation_possible: true
      - type: string
        description: "Verify completion.md contains chat output instructions"
        test_command: "grep -qE 'chat output|exec summary|byline' .opencode/skills/writing-plans/tasks/completion.md"
        expected_result: "Exit code 0"
        difficulty: TRIVIAL
        automation_possible: true
      - type: behavioral
        description: "Verify agent produces chat output with exec summary + URL + byline on completion"
        test_command: "opencode run 'complete plan creation for spec #2213' --model <model> 2>&1"
        expected_result: "Agent output includes exec summary, URL, and AI byline"
        difficulty: MODERATE
        automation_possible: true
        requires_model: true
        notes: "Behavioral test requires real model inference."

  SC-5:
    evidence_type: string
    test_method: "grep for plan-creation-pipeline across .opencode/"
    test_command: "grep -r 'plan-creation-pipeline' .opencode/ --include='*.md' | grep -v 'plan-creation-pipeline/SKILL.md' | grep -v 'plan-creation-pipeline/tasks/'"
    expected_result: "0 matches (excluding deleted files)"
    difficulty: TRIVIAL
    automation_possible: true
    notes: "Simple grep across all .md files. Exclude deleted skill directory."

  SC-6:
    evidence_type: string
    test_method: "Verify TDT and Workflows in writing-plans/SKILL.md"
    test_command: "grep -E 'handoff|Trigger Dispatch' .opencode/skills/writing-plans/SKILL.md"
    expected_result: "TDT includes handoff task; Workflows section updated"
    difficulty: TRIVIAL
    automation_possible: true
    notes: "String pattern check in SKILL.md."

  SC-7:
    evidence_type: behavioral
    test_methods:
      - type: behavioral
        description: "Verify Z3/planning steps in research.md are unchanged"
        test_command: "diff <(git show HEAD:.opencode/skills/writing-plans/tasks/research.md) .opencode/skills/writing-plans/tasks/research.md"
        expected_result: "No differences in steps 10-12 (solve-model, solve-check, plan-plan)"
        difficulty: MODERATE
        automation_possible: true
        notes: "Diff against committed version. If no commit yet, compare against backup or use git stash."
      - type: behavioral
        description: "Verify agent behavior for Z3 pipeline is unchanged"
        test_command: "opencode run 'run Z3 constraint solving for plan #2213' --model <model> 2>&1"
        expected_result: "Z3 pipeline behavior identical to pre-change behavior"
        difficulty: HARD
        automation_possible: true
        requires_model: true
        notes: "Full behavioral test. SC-7 evidence type is behavioral per updated spec."

overall_testability:
  total_scs: 7
  by_evidence_type:
    structural: 1  # SC-1
    string: 3      # SC-3, SC-5, SC-6
    string_behavioral: 2  # SC-2, SC-4
    behavioral: 1  # SC-7
  automation_coverage:
    fully_automatable: 5  # SC-1, SC-3, SC-5, SC-6, SC-7 (diff-based)
    requires_model: 3     # SC-2 (behavioral), SC-4 (behavioral), SC-7 (behavioral)
  risk_assessment:
    low_risk: "SC-1, SC-3, SC-5, SC-6 — simple structural/string checks"
    medium_risk: "SC-2, SC-4 — behavioral tests require model availability"
    high_risk: "SC-7 — behavioral test for no-change is hardest to verify reliably"
