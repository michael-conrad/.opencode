      Assert via assert_semantic for decision logic.
    feasibility: HIGH
    complexity: MEDIUM
    risk: Medium — requires setting up submodule repo with controlled PR state
    behavioral_test_required: true

  - sc: SC-3
    evidence_type: behavioral
    test_method: opencode run with test repo
    test_description: |
      After dead-branch detection and submodule PR merge confirmation, verify agent
      deletes local + remote branch and parks at trunk tip. Assert via assert_semantic
      for deletion + parking actions, with assert_stderr_pattern as secondary
      corroboration.
    feasibility: HIGH
    complexity: LOW
    risk: Low — deletion commands are standard git operations
    behavioral_test_required: true

  - sc: SC-4
    evidence_type: behavioral
    test_method: opencode run with test repo
    test_description: |
      After trunk parking, verify agent does NOT commit the dirty submodule pointer.
      Assert via assert_semantic for dirty pointer preservation, with
      assert_stderr_pattern_absent as secondary corroboration.
    feasibility: HIGH
    complexity: LOW
    risk: Low — dirty pointer preservation is a no-op (do nothing)
    behavioral_test_required: true

  - sc: SC-5
    evidence_type: behavioral
    test_method: opencode run with mixed-content branch
    test_description: |
      Create a branch with both submodule pointer changes and real code changes.
      Verify agent does NOT delete the branch — falls through to Phase 6.
