# Structure artifact — issue #2220
# Phase decomposition, dependency DAG, and skill+task selection

phases:
  phase_1:
    name: "Merge and rename"
    description: "Merge SKILL.md content and update dispatch calls before deleting source files"
    scs: [SC-1, SC-3]
    dependencies: []
    items:
      - sc: SC-1
        description: "Merge approval-gate-scope/SKILL.md content into approval-gate/SKILL.md with all 4 section groups"
        evidence_type: semantic
        red:
          skill: test-driven-development
          task: "execute red task from test-driven-development"
          description: "Write a semantic test that verifies the merged content does not yet exist in approval-gate/SKILL.md"
        green:
          skill: test-driven-development
          task: "execute green task from test-driven-development"
          description: "Merge all 4 section groups (routing metadata, scope model, bug discovery protocol, DISPATCH_GATE protocol) from approval-gate-scope/SKILL.md into approval-gate/SKILL.md"
        commit:
          action: orchestrator_inline
          description: "git add .opencode/skills/approval-gate/SKILL.md && git commit -m 'feat: merge approval-gate-scope SKILL.md content into approval-gate SKILL.md'"
      - sc: SC-3
        description: "Update all skill() dispatch calls from approval-gate-scope to approval-gate"
        evidence_type: string
        red:
          skill: test-driven-development
          task: "execute red task from test-driven-development"
          description: "Write a grep test that shows skill({name: 'approval-gate-scope'}) still exists in .opencode/"
        green:
          skill: test-driven-development
          task: "execute green task from test-driven-development"
          description: "Replace all skill({name: 'approval-gate-scope'}) with skill({name: 'approval-gate'}) in .opencode/skills/approval-gate/SKILL.md and .opencode/guidelines/000-critical-rules.md"
        commit:
          action: orchestrator_inline
          description: "git add .opencode/skills/approval-gate/SKILL.md .opencode/guidelines/000-critical-rules.md && git commit -m 'refactor: update skill() dispatch calls from approval-gate-scope to approval-gate'"

  phase_2:
    name: "Delete files"
    description: "Delete all approval-gate-scope files and directories"
    scs: [SC-2, SC-4, SC-5, SC-6, SC-7, SC-8, SC-9]
    dependencies: [phase_1]
    items:
      - sc: SC-2
        description: "Delete approval-gate-scope/SKILL.md"
        evidence_type: structural
        red:
          skill: test-driven-development
          task: "execute red task from test-driven-development"
          description: "Write a test that ls .opencode/skills/approval-gate-scope/SKILL.md succeeds (file exists)"
        green:
          skill: test-driven-development
          task: "execute green task from test-driven-development"
          description: "git rm .opencode/skills/approval-gate-scope/SKILL.md"
        commit:
          action: orchestrator_inline
          description: "git commit -m 'refactor: delete approval-gate-scope/SKILL.md'"
      - sc: SC-4
        description: "Delete 22 task files in approval-gate-scope/tasks/"
        evidence_type: structural
        red:
          skill: test-driven-development
          task: "execute red task from test-driven-development"
          description: "Write a test that ls .opencode/skills/approval-gate-scope/tasks/ shows files"
        green:
          skill: test-driven-development
          task: "execute green task from test-driven-development"
          description: "git rm -r .opencode/skills/approval-gate-scope/tasks/ (all 22 files)"
        commit:
          action: orchestrator_inline
          description: "git commit -m 'refactor: delete 22 task files in approval-gate-scope/tasks/'"
      - sc: SC-5
        description: "Delete 5 enforcement files in approval-gate-scope/enforcement/"
        evidence_type: structural
        red:
          skill: test-driven-development
          task: "execute red task from test-driven-development"
          description: "Write a test that ls .opencode/skills/approval-gate-scope/enforcement/ shows files"
        green:
          skill: test-driven-development
          task: "execute green task from test-driven-development"
          description: "git rm -r .opencode/skills/approval-gate-scope/enforcement/"
        commit:
          action: orchestrator_inline
          description: "git commit -m 'refactor: delete 5 enforcement files in approval-gate-scope/enforcement/'"
      - sc: SC-6
        description: "Delete 13 verify-authorization sub-task files"
        evidence_type: structural
        red:
          skill: test-driven-development
          task: "execute red task from test-driven-development"
          description: "Write a test that ls .opencode/skills/approval-gate-scope/tasks/verify-authorization/ shows files"
        green:
          skill: test-driven-development
          task: "execute green task from test-driven-development"
          description: "git rm -r .opencode/skills/approval-gate-scope/tasks/verify-authorization/"
        commit:
          action: orchestrator_inline
          description: "git commit -m 'refactor: delete 13 verify-authorization sub-task files'"
      - sc: SC-7
        description: "Delete 2 screen sub-task files"
        evidence_type: structural
        red:
          skill: test-driven-development
          task: "execute red task from test-driven-development"
          description: "Write a test that ls .opencode/skills/approval-gate-scope/tasks/screen/ shows files"
        green:
          skill: test-driven-development
          task: "execute green task from test-driven-development"
          description: "git rm -r .opencode/skills/approval-gate-scope/tasks/screen/"
        commit:
          action: orchestrator_inline
          description: "git commit -m 'refactor: delete 2 screen sub-task files'"
      - sc: SC-8
        description: "Delete 3 gap-fill-cascade sub-task files"
        evidence_type: structural
        red:
          skill: test-driven-development
          task: "execute red task from test-driven-development"
          description: "Write a test that ls .opencode/skills/approval-gate-scope/tasks/gap-fill-cascade/ shows files"
        green:
          skill: test-driven-development
          task: "execute green task from test-driven-development"
          description: "git rm -r .opencode/skills/approval-gate-scope/tasks/gap-fill-cascade/"
        commit:
          action: orchestrator_inline
          description: "git commit -m 'refactor: delete 3 gap-fill-cascade sub-task files'"
      - sc: SC-9
        description: "Delete 6 pre-impl sub-task files"
        evidence_type: structural
        red:
          skill: test-driven-development
          task: "execute red task from test-driven-development"
          description: "Write a test that ls .opencode/skills/approval-gate-scope/tasks/pre-impl/ shows files"
        green:
          skill: test-driven-development
          task: "execute green task from test-driven-development"
          description: "git rm -r .opencode/skills/approval-gate-scope/tasks/pre-impl/"
        commit:
          action: orchestrator_inline
          description: "git commit -m 'refactor: delete 6 pre-impl sub-task files'"

  phase_3:
    name: "Update references and verify"
    description: "Update cross-references, behavioral tests, and final verification sweep"
    scs: [SC-10, SC-11, SC-12]
    dependencies: [phase_2]
    items:
      - sc: SC-10
        description: "Update cross-references to deleted task files in other skills/guidelines"
        evidence_type: string
        red:
          skill: test-driven-development
          task: "execute red task from test-driven-development"
          description: "Write a grep test that shows approval-gate-scope/tasks/ references still exist in .opencode/"
        green:
          skill: test-driven-development
          task: "execute green task from test-driven-development"
          description: "Update or remove all Read [Text](path) references to approval-gate-scope/tasks/ in .opencode/guidelines/000-critical-rules.md and .opencode/skills/approval-gate/SKILL.md"
        commit:
          action: orchestrator_inline
          description: "git add .opencode/guidelines/000-critical-rules.md .opencode/skills/approval-gate/SKILL.md && git commit -m 'refactor: update cross-references to deleted approval-gate-scope task files'"
      - sc: SC-11
        description: "Update behavioral enforcement tests to use new dispatch interface"
        evidence_type: behavioral
        red:
          skill: test-driven-development
          task: "execute red task from test-driven-development"
          description: "Write a behavioral test that dispatches to the old approval-gate-scope skill and verify it fails"
        green:
          skill: test-driven-development
          task: "execute green task from test-driven-development"
          description: "Update .opencode/tests-v2/behaviors/approval-gate-scope-routing.sh and .opencode/tests-v2/behaviors/fast-path-workflow-reorder.sh to dispatch to the merged approval-gate skill"
        commit:
          action: orchestrator_inline
          description: "git add .opencode/tests-v2/behaviors/ && git commit -m 'refactor: update behavioral tests to dispatch to merged approval-gate skill'"
      - sc: SC-12
        description: "Verify no remaining references to approval-gate-scope in any .opencode/ file"
        evidence_type: string
        red:
          skill: test-driven-development
          task: "execute red task from test-driven-development"
          description: "Write a grep test that shows remaining approval-gate-scope references in .opencode/"
        green:
          skill: test-driven-development
          task: "execute green task from test-driven-development"
          description: "Clean up any remaining references to approval-gate-scope in .opencode/ files"
        commit:
          action: orchestrator_inline
          description: "git add .opencode/ && git commit -m 'refactor: final cleanup of approval-gate-scope references'"

dependency_dag:
  edges:
    - from: phase_1
      to: phase_2
      rationale: "Phase 1 must complete (merge SKILL.md + update dispatch calls) before Phase 2 deletes the source files, or the content to merge would be lost and in-flight dispatches would break"
    - from: phase_2
      to: phase_3
      rationale: "Phase 2 must complete (delete all files) before Phase 3 updates cross-references and runs final verification, or deleted files would produce false positive grep matches"
  ordering: strict
  parallel_across_phases: false

internal_parallelism:
  phase_1:
    items: [SC-1, SC-3]
    parallel: false
    rationale: "SC-1 (merge content) and SC-3 (update dispatch calls) touch overlapping files — must be sequential to avoid conflicts"
  phase_2:
    items: [SC-2, SC-4, SC-5, SC-6, SC-7, SC-8, SC-9]
    parallel: true
    rationale: "All delete operations are independent — they target different files/directories. SC-2 (delete SKILL.md) must complete before the parent directory can be fully removed, but all sub-directory deletes (SC-4..9) can run in parallel"
  phase_3:
    items: [SC-10, SC-11, SC-12]
    parallel: false
    rationale: "SC-10 (cross-references) and SC-11 (behavioral tests) can run in parallel. SC-12 (final sweep) must run last as it verifies all other SCs are complete"

triplet_co_location: PASS
cross_phase_dependency: PASS
