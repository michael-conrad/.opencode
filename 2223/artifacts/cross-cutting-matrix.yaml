cross_cutting_concerns:
  - concern: Attestation language consistency
    description: All "dual-auditor" references must use identical replacement text "DiMo chain"
    affected_phases: [1, 5]
    affected_scs: [SC-9, SC-10, SC-11, SC-22, SC-23, SC-24, SC-25, SC-26]
    risk: Inconsistent replacement text across 6 files (create-pr.md + 5 guideline/task files)
    mitigation: Use grep to verify zero remaining "dual-auditor" occurrences after Phase 5

  - concern: create-pr.md edit coordination
    description: Phase 1 and Phase 5 both modify create-pr.md — template extraction and attestation updates
    affected_phases: [1, 5]
    affected_scs: [SC-1 through SC-12, SC-27, SC-28]
    risk: Sequential edits to same file must not conflict; Phase 5 attestation changes in create-pr.md must be coordinated with Phase 1 template extraction
    mitigation: Apply all create-pr.md changes in Phase 1 (template extraction + attestation + gate updates) to avoid Phase 5 re-edit

  - concern: pr-creation-workflow deletion timing
    description: Cross-references must be updated before or simultaneously with directory deletion
    affected_phases: [2, 6]
    affected_scs: [SC-13, SC-29, SC-30]
    risk: Deleting directory before updating cross-references breaks grep-based verification; updating cross-references before deletion leaves dangling references
    mitigation: Update all cross-references first (Phase 6), then delete directory (Phase 2), or coordinate as single atomic change

  - concern: closing-keywords.md move integrity
    description: File content must be preserved exactly during move
    affected_phases: [2]
    affected_scs: [SC-14]
    risk: Content corruption during copy-then-delete sequence
    mitigation: Verify checksum or content match before deleting source

  - concern: git-workflow-pr SKILL.md structural rewrite
    description: Trigger Dispatch Table → Workflows section changes orchestrator dispatch protocol
    affected_phases: [3]
    affected_scs: [SC-15, SC-16, SC-17, SC-18, SC-19]
    risk: All consumers of git-workflow-pr must understand new dispatch protocol
    mitigation: Verify all task files that reference git-workflow-pr dispatch are compatible with Workflows section format

  - concern: Audit skill Trigger Dispatch Table format
    description: New pr-body-audit task entry must follow existing table format
    affected_phases: [4]
    affected_scs: [SC-20]
    risk: Format mismatch breaks automated table parsing
    mitigation: Match existing row format exactly (User says / Context | Task | Dispatch | Context passed)

