    name: "Move task file"
    scs: [SC-1]
    depends_on: []
    skill: test-driven-development
    task: full daisy-chain per SC
  - id: phase-2
    name: "Remove from approval-gate SKILL.md files"
    scs: [SC-2, SC-3, SC-7, SC-8]
    depends_on: [phase-1]
    skill: test-driven-development
    task: full daisy-chain per SC
  - id: phase-3
    name: "Update writing-plans/SKILL.md"
    scs: [SC-4, SC-5, SC-6, SC-9, SC-10, SC-11]
    depends_on: [phase-1]
    skill: test-driven-development
    task: full daisy-chain per SC
  - id: phase-4
    name: "Verify behavioral routing"
    scs: [SC-12]
    depends_on: [phase-2, phase-3]
    skill: test-driven-development
    task: full daisy-chain per SC
post_implementation:
