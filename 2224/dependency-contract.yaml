  - id: post-2
    name: "z3-check"
    skill: "(orchestrator)"
    dispatch: '.opencode/tools/solve check --state-path ... --contract-path ...'
  - id: post-3
    name: "structural-checks"
    skill: finishing-a-development-branch
    dispatch: 'task(..., prompt: "execute checklist task from finishing-a-development-branch")'
  - id: post-4
    name: "pre-pr-gate"
    skill: verification-before-completion
    dispatch: 'task(..., prompt: "execute verify task from verification-before-completion")'
  - id: post-5
    name: "regression-check"
    skill: test-driven-development
    dispatch: 'task(..., prompt: "execute phase-4 task from test-driven-development")'
  - id: post-6
    name: "review-prep"
    skill: git-workflow-pr
    dispatch: 'task(..., prompt: "execute review-prep from git-workflow-pr...")'
  - id: post-7
    name: "create-pr"
    skill: git-workflow-pr
    dispatch: 'task(..., prompt: "execute pr-creation from git-workflow-pr...")'
  - id: post-8
    name: "exec-summary"
    skill: completion-core
    dispatch: 'task(..., prompt: "execute completion task from completion-core")'
