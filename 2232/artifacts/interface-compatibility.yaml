spec_path: .opencode/.issues/2232/spec.md
interfaces:
  - module: .opencode/skills/writing-plans/tasks/analyze.md
    interfaces:
      - name: approval_check
        type: read
        current: reads spec frontmatter approved field
        target: reads issue.yaml labels for approved-for-* pattern
        compatibility: FULL — issue.yaml is always present (synced from remote API via local-issues sync); labels field is always a list; approved-for-* pattern is a simple string match
        breaking: false
  - module: .opencode/skills/writing-plans/tasks/research.md
    interfaces:
      - name: dependency_contract_input
        type: read
        current: reads dependency-contract.yaml from disk, BLOCKs if missing
        target: generates dependency-contract.yaml from interface-compatibility.yaml dependency_contract section, then reads it
        compatibility: FULL — interface-compatibility.yaml is generated by backfill/create pipeline before research runs; dependency_contract section is a defined field in the artifact schema
        breaking: false
  - module: .opencode/skills/writing-plans/tasks/research.md
    interfaces:
      - name: z3_solve_input
        type: read
        current: consumes dependency-contract.yaml in Steps 10-12
        target: consumes dependency-contract.yaml in Steps 10-12 (same — no change to consumption, only to generation)
        compatibility: FULL — consumption unchanged; only generation step changes
        breaking: false
dependency_contract:
  phase_1:
    - .opencode/skills/writing-plans/tasks/analyze.md
  phase_2:
    - .opencode/skills/writing-plans/tasks/research.md
  phase_3:
    - .opencode/skills/*/tasks/*.md (audit)
  edges:
    - from: phase_1
      to: phase_2
      rationale: research.md changes depend on analyze.md pattern being established first
    - from: phase_2
      to: phase_3
      rationale: cross-skill audit depends on the pattern established by both analyze.md and research.md fixes
