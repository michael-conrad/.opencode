body: "---\nplan_schema_version: \"1.0\"\nissue: 2239\ntitle: \"Remove redundant check-pr\
  \ task, fix cleanup processing order\"\nauthorization_scope: for_implementation\n\
  pr_strategy: stacked\nphase_count: 3\n---\n\n# Implementation Plan — #2239 — Remove\
  \ redundant check-pr task, fix cleanup processing order\n\n> GitHub Issue: https://github.com/michael-conrad/.opencode/issues/2239\n\
  \n**Goal:** Delete the redundant `check-pr.md` task file from `git-workflow-cleanup`,\
  \ remove all references to it, and fix the cleanup processing order to process submodules\
  \ before the parent repo.\n\n**Architecture:** Two independent work phases plus\
  \ a post-phase behavioral verification. Phase 1 deletes the duplicate file and updates\
  \ all references. Phase 2 fixes the submodule-first processing order in `cleanup.md`.\
  \ Phase 3 (post) verifies behavioral backward compatibility via `opencode run`.\n\
  \n**Files:**\n- `.opencode/skills/git-workflow-cleanup/tasks/check-pr.md` (DELETE)\n\
  - `.opencode/skills/git-workflow-cleanup/SKILL.md` (MODIFY)\n- `.opencode/skills/git-workflow/SKILL.md`\
  \ (MODIFY)\n- `.opencode/skills/git-workflow-cleanup/tasks/cleanup.md` (MODIFY)\n\
  \n---\n\n## Phase Table\n\n| Phase | Skill | Task | Target | SCs | Depends On |\n\
  |-------|-------|------|--------|-----|------------|\n| 1 — Remove check-pr and\
  \ update references | `test-driven-development` | `red` | `.opencode/skills/git-workflow-cleanup/tasks/check-pr.md`,\
  \ `git-workflow-cleanup/SKILL.md`, `git-workflow/SKILL.md`, `cleanup.md` | SC-1,\
  \ SC-2, SC-3a, SC-3b, SC-5 | — |\n| 2 — Fix cleanup processing order | `test-driven-development`\
  \ | `green` | `.opencode/skills/git-workflow-cleanup/tasks/cleanup.md` | SC-6, SC-7\
  \ | — |\n| 3 — Behavioral backward compatibility | `test-driven-development` | `red`\
  \ | `git-workflow/SKILL.md` TDT | SC-8 | 1, 2 |\n\n---\n\n## Phase Details\n\n###\
  \ Phase 1 — Remove check-pr and update references\n\n| Field | Value |\n|-------|-------|\n\
  | Skill | `test-driven-development` |\n| Task | `red` |\n| Target | `.opencode/skills/git-workflow-cleanup/tasks/check-pr.md`,\
  \ `git-workflow-cleanup/SKILL.md`, `git-workflow/SKILL.md`, `cleanup.md` |\n| SCs\
  \ | SC-1, SC-2, SC-3a, SC-3b, SC-5 |\n| Depends On | — |\n\n**Context:**\n```yaml\n\
  files_to_delete:\n  - .opencode/skills/git-workflow-cleanup/tasks/check-pr.md\n\
  files_to_modify:\n  - .opencode/skills/git-workflow-cleanup/SKILL.md\n  - .opencode/skills/git-workflow/SKILL.md\n\
  \  - .opencode/skills/git-workflow-cleanup/tasks/cleanup.md\nsc_ids: [SC-1, SC-2,\
  \ SC-3a, SC-3b, SC-5]\n```\n\n### Phase 2 — Fix cleanup processing order\n\n| Field\
  \ | Value |\n|-------|-------|\n| Skill | `test-driven-development` |\n| Task |\
  \ `green` |\n| Target | `.opencode/skills/git-workflow-cleanup/tasks/cleanup.md`\
  \ |\n| SCs | SC-6, SC-7 |\n| Depends On | — |\n\n**Context:**\n```yaml\nfiles_to_modify:\n\
  \  - .opencode/skills/git-workflow-cleanup/tasks/cleanup.md\nsc_ids: [SC-6, SC-7]\n\
  change_description: \"Update Step 3 to iterate submodules before parent; update\
  \ Step 4 to list submodules before parent\"\n```\n\n### Phase 3 — Behavioral backward\
  \ compatibility\n\n| Field | Value |\n|-------|-------|\n| Skill | `test-driven-development`\
  \ |\n| Task | `red` |\n| Target | `git-workflow/SKILL.md` TDT |\n| SCs | SC-8 |\n\
  | Depends On | 1, 2 |\n\n**Context:**\n```yaml\nsc_ids: [SC-8]\ntrigger_phrase:\
  \ \"check pr\"\nexpected_dispatch: \"git-workflow-cleanup --task cleanup\"\n```\n\
  \n---\n\n## Exit Criteria\n\n- [ ] C1. `check-pr.md` is deleted from `.opencode/skills/git-workflow-cleanup/tasks/`\n\
  - [ ] C2. `git-workflow-cleanup/SKILL.md` has no `check-pr` references in TDT or\
  \ Tasks table\n- [ ] C3. `git-workflow/SKILL.md` has no `check-pr` references in\
  \ TDT, Invocation, or Sub-Skills\n- [ ] C4. `git-workflow/SKILL.md` lists `git-workflow-cleanup`\
  \ task count as 3\n- [ ] C5. `cleanup.md` has no `check-pr` references in Related\
  \ tasks or Automatic Cleanup Detection sections\n- [ ] C6. `cleanup.md` Step 3 specifies\
  \ submodule-first iteration order for branch-cleanup\n- [ ] C7. `cleanup.md` Step\
  \ 4 lists submodules before parent in repo verification list\n- [ ] C8. Dispatching\
  \ \"check pr\" routes to `git-workflow-cleanup --task cleanup` (not `check-pr`)\n"
