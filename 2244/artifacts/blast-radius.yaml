## Risk Matrix

| Risk | Severity | Likelihood | Mitigation |
|------|----------|-----------|------------|
| Default behavior regression (all tests break) | High | Low (opt-in default) | SC4 no-regression behavioral gate |
| Private fixture repo auth in isolated env | High | Medium | Wire test-submodules as local git repos OR document auth; design decision in create |
| Origin-wiring conflict with bare-remote tests | Medium | Medium | Reconcile helpers.sh origin-add vs bare-remote branch |
| Isolation leak via new env passthrough | High | Low | Keep new vars out of forbidden set; extend allowlist deliberately |
| Cleanup leaves orphan clones/processes | Medium | Medium | Extend `--clean-all` + `__kill_gitbucket`; SC5 gate |

