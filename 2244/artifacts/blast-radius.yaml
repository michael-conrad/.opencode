## Ripple Effects Beyond Framework

| Component | Impact | Blast level |
|-----------|--------|-------------|
| Existing behavioral tests | Shared `helpers.sh` — any default-behavior change could silently alter all tests | HIGH (mitigated by opt-in default) |
| Isolation contract (AGENTS.md §5/§9) | New env vars + clone logic | MEDIUM |
| .opencode PR #2242 | SC6/SC7 consume this capability for the cleanup test | DIRECT — this spec is prerequisite infrastructure |
| Root opencode-config | Only submodule pointer bumps when .opencode PR merges | LOW (pointer only) |
