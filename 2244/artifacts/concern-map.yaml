## Concern Conflict Check

- **Submodule provisioning vs Remote platform:** Both touch `helpers.sh` and the attempt-workdir. SC1 adds submodules to the workdir; SC2 wires origin on the same workdir. ORDER: submodules added before origin wiring (origin remote add + push needs the workdir committed, which already happens). No conflict — sequential.
- **Remote platform (SC2) vs Bare remote (existing `BEHAVIOR_SET_BARE_REMOTE`):** Both add an `origin` remote. helpers.sh lines 505-511 (GitBucket origin) are already gated on `BEHAVIOR_NEEDS_REMOTE`, while lines 491-496 (bare) are gated on `BEHAVIOR_SET_BARE_REMOTE`. A test must not set both. The new spec must document mutual exclusion.
- **Env isolation (SC3) vs Cleanup (SC5):** No overlap — env is input plumbing, cleanup is output lifecycle.

## Single-Concern Compliance
Each SC targets one file category and one verification domain:
- SC1: helpers.sh — submodule provisioning (structural)
- SC2: helpers.sh + fixtures — remote platform (behavioral)
- SC3: with-test-home — env isolation (structural)
- SC4: helpers.sh + with-test-home — regression (behavioral)
- SC5: helpers.sh + with-test-home — cleanup (behavioral)
- SC6: 2242-sc6 test + fixture — full-env opt-in (behavioral)
