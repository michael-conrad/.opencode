# Concern Map — Issue 2244

## Concern Boundaries

| Concern | File(s) | Separation principle |
|---------|---------|----------------------|
| **Submodule provisioning** | `helpers.sh` (behavior_run) + `with-test-home` | Existing single-`.opencode` clone logic; NEW opt-in multi-submodule clone logic. Each is a discrete function; opt-in flag separates them. |
| **Remote platform simulation** | `helpers.sh` (`__ensure_gitbucket`, origin wiring) | GitBucket provisioning is already a self-contained concern (SC1-SC6); origin-wiring is the bridge to the test workdir. |
| **Env isolation** | `with-test-home` | The `env -i` allowlist is a single concern; adding GB + fixture vars is an extension of that concern, NOT a new one. |
| **Cleanup** | `helpers.sh` (`__kill_gitbucket`) + `with-test-home` (`--clean-all`) | Existing cleanup concern extended to new artifacts. |
| **Per-scenario fixture state** | `fixtures/setup/<scenario-name>.sh` | Test-specific repo state lives here per AGENTS.md §3 Step 0b — NOT in helpers.sh. |

