artifact_name: concern-map
generated_at: 2026-08-05
source: "Spec #2244 spec.md (§3 Success Criteria, §5 Items, §6 Dependencies), plan.md (phase table + details), dependency-contract.yaml"
content:
  description: "Concern-to-phase mapping for full-environment simulation support. Revised to 20 SCs: added C10 (SC19/SC20 executor GB_* suite + gb config.toml seeding) as a prerequisite for the behavioral discovery SCs; corrected SC17 scoping semantics (test-env constants always set, GB_TOKEN provisioned-scoped)."
  phases:
    - phase: 1
      name: "Allowlist Extension + Isolation"
      concern: "env -i allowlist extension + isolation"
      scs:
        - SC5
        - SC6
        - SC7
        - SC14
        - SC15
      dependencies: []
      dispatch: "per-SC items (Items 5,6,7,14,15)"
      key_deliverables:
        - "env -i allowlist passes the three new opt-in flags as strict superset (SC5)"
        - "set-env.sh records the three flags (SC6)"
        - "isolation verification procedure still passes after extension (SC7)"
        - "allowlist enumerates exactly the minimal infrastructure set (SC14)"
        - "no parent-sourced secret/credential/token/env-specific variable admitted (SC15)"
    - phase: 2
      name: "Test-Provisioned Env Rule + GB Scoping"
      concern: "test-provisioned environment rule + GB_* scoping"
      scs:
        - SC13
        - SC16
        - SC17
      dependencies:
        - "Phase 1 (allowlist extended)"
      dispatch: "per-SC items (Items 13,16,17)"
      key_deliverables:
        - "every required test value set by do_setup/seed_model_config/test-home provisioning, never inherited (SC13)"
        - "required test values generated/set by setup, not read through from parent (SC16)"
        - "test-env constants (GB_HOST, GB_REPO, GB_PROTOCOL, GITBUCKET_PORT) always set to harness constants; GB_TOKEN provisioned-scoped only when BEHAVIOR_NEEDS_REMOTE=1; no parent leakage (SC17 corrected)"
    - phase: 3
      name: "Multi-Submodule Provisioning"
      concern: "multi-submodule fixture provisioning"
      scs:
        - SC1
      dependencies:
        - "Phase 1 (allowlist carries BEHAVIOR_NEEDS_MULTI_SUBMODULES)"
      dispatch: "Item 1"
      key_deliverables:
        - "behavior_run provisions test-submodule-1/2 as local git repos when flag set, not when unset"
    - phase: 4
      name: "Remote-Strategy Mutual Exclusion"
      concern: "remote strategy mutual exclusion"
      scs:
        - SC4
      dependencies:
        - "Phase 1 (allowlist carries both remote flags)"
      dispatch: "Item 4"
      key_deliverables:
        - "both BEHAVIOR_NEEDS_REMOTE and BEHAVIOR_SET_BARE_REMOTE together trigger HARNESS_FAILURE"
        - "no origin wiring attempted on ambiguous config"
    - phase: 5
      name: "Cleanup"
      concern: "cleanup of provisioned state"
      scs:
        - SC9
      dependencies:
        - "Phase 3 (fixture clones exist)"
        - "Phase 4 (mutual-exclusion-rejected partial state)"
      dispatch: "Item 9"
      key_deliverables:
        - "--clean-all/__kill_gitbucket/__reset_gitbucket remove all provisioned clones + GitBucket state"
        - "repeated run starts clean; no orphan processes/clones"
    - phase: 6
      name: "GitBucket Origin Wiring + Discovery"
      concern: "GitBucket origin wiring + merged-PR discovery"
      scs:
        - SC2
        - SC3
      dependencies:
        - "Phase 2 (test-env constants + scoped GB_TOKEN)"
        - "Phase 3 (fixture repos)"
        - "Phase 4 (mutual-exclusion rejection)"
      dispatch: "per-SC items (Items 2,3)"
      key_deliverables:
        - "behavior_run attaches GitBucket origin when BEHAVIOR_NEEDS_REMOTE=1 + GitBucket provisioned (SC2)"
        - "gh pr list in isolated env discovers merged branches/open issues without GitHub auth (SC3)"
    - phase: 7
      name: "2242-sc6 Full-Env Opt-In + Verification"
      concern: "2242-sc6 full-env opt-in + cleanup-dispatch verification"
      scs:
        - SC10
        - SC11
        - SC12
      dependencies:
        - "Phase 6 (wired origin + discovery)"
        - "Phase 10 (executor can authenticate gb: full GB_* suite + seeded gb config.toml)"
      dispatch: "per-SC items (Items 10,11,12)"
      key_deliverables:
        - "full-env opt-in enables merged-branch/PR discovery (any mechanism; specific command NOT the measure) and cleanup proceeds (SC10)"
        - "cleanup dispatch follows correct task card (tasks/cleanup.md) and completes, producing a result contract (SC11)"
        - "no question-tool/PR-context halt (SC12)"
    - phase: 8
      name: "Documentation"
      concern: "documentation of mutual-exclusion + full-env opt-in capability"
      scs:
        - SC18
      dependencies:
        - "Phase 4 (mutual-exclusion rule implemented)"
      dispatch: "Item 18"
      key_deliverables:
        - "tests-v2/AGENTS.md documents mutual-exclusion rule + full-env opt-in capability"
    - phase: 9
      name: "No-Regression Default Gate"
      concern: "no-regression default gate"
      scs:
        - SC8
      dependencies:
        - "Phase 1 (allowlist extension)"
        - "Phase 3 (multi-submodule provisioning)"
        - "Phase 4 (mutual-exclusion rejection)"
        - "Phase 6 (origin wiring)"
      dispatch: "Item 8"
      key_deliverables:
        - "default path (no opt-in) provisions single .opencode + local platform, byte-for-byte unchanged"
    - phase: 10
      name: "Executor GB_* Suite + gb Config.toml Seeding"
      concern: "executor full GB_* suite + gb config.toml seeding (prerequisite for behavioral discovery SCs)"
      scs:
        - SC19
        - SC20
      dependencies:
        - "Phase 2 (test-env constants + GB_TOKEN scoping)"
      dispatch: "per-SC items (Items 19,20)"
      key_deliverables:
        - "GB_ENV_ARGS propagates full GB_* suite (GB_TOKEN, GB_HOST, GITBUCKET_PORT, GB_REPO, GB_PROTOCOL) into isolated env; test-env constants always set, GB_TOKEN scoped to provisioned test instance only when BEHAVIOR_NEEDS_REMOTE=1 (SC19)"
        - "test home seeds pre-fabricated gb config.toml at $TEST_HOME/.config/gb/config.toml with default_host constant + host token (only when GitBucket provisioned), so gb authenticates without gb auth login (SC20)"
  concern_to_phase_mapping:
    "env -i allowlist extension + isolation": 1
    "test-provisioned environment rule + GB_* scoping": 2
    "multi-submodule fixture provisioning": 3
    "remote strategy mutual exclusion": 4
    "cleanup of provisioned state": 5
    "GitBucket origin wiring + merged-PR discovery": 6
    "2242-sc6 full-env opt-in + cleanup-dispatch verification": 7
    "documentation of mutual-exclusion + full-env opt-in": 8
    "no-regression default gate": 9
    "executor full GB_* suite + gb config.toml seeding": 10
  phase_independence:
    description: "Phases 1-10 sequential with dependency edges per the dependency contract; Phase 10 (C10) precedes Phase 7 (C8) because the executor cannot authenticate gb without both the full GB_* suite and the seeded gb config.toml"
    independent_phases: []
    prerequisite_phase: 1
    dependent_phase: 7
