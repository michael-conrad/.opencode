# Cross-Cutting Matrix — Issue 2444

## Cross-Cutting Concerns

| Concern | Applies to SCs | Files | Owner decision |
|---------|----------------|-------|----------------|
| **Opt-in flagging convention** | SC1, SC2, SC3, SC4, SC6 | helpers.sh, with-test-home | New `BEHAVIOR_*` flags must follow existing convention (BEHAVIOR_NEEDS_REMOTE pattern). |
| **Isolation contract** | SC1, SC3 | with-test-home | Env allowlist + HOME/XDG handling must not leak prod state; §9 requires approved spec (this is it). |
| **Cleanup / lifecycle** | SC5, SC6 | helpers.sh, with-test-home | New clones + GitBucket state must be removed by `--clean-all`/`__kill_gitbucket`. |
| **Default-behavior preservation** | SC1, SC2, SC3, SC4 | helpers.sh, with-test-home | Every change must keep single-`.opencode`/`local` default when no opt-in. |
| **Clean-room artifact generation** | SC2, SC4, SC6 | helpers.sh | helpers.sh generates only; evaluation is orchestrator's job. |
| **Private-repo auth** | SC1, SC6 | helpers.sh | test-submodule-1/2 are private; must wire as local repos or document auth. |
| **GitBucket remote lifecycle** | SC2, SC5 | helpers.sh | Ensure idempotent start, clean reset between tests. |
| **Fixture state location** | SC6 | fixtures/setup/ | Per-scenario state in `fixtures/setup/` scripts — NOT helpers.sh scenario flags. |
| **Bash-timeout / no-GNU-timeout** | all | all test scripts | 600s+ mandate; no `timeout` command. |
| **Documentation sync** | SC1-SC6 | AGENTS.md | Harness spec §5/§12 updated to document new capabilities. |

