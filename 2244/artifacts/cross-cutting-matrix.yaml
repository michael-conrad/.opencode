## Highest-cross-cutting concerns (must be decided in create phase)

1. **Opt-in flag naming/default** — crosscuts SC1/2/3/4/6. Default must be OFF.
2. **Isolation contract** — crosscuts SC1/3/4. Deliberate, minimal env allowlist extension.
3. **Private-repo auth** — crosscuts SC1/6. The pivotal design decision (local-repo wiring vs. authenticated remote clone).
4. **Default-behavior preservation** — crosscuts SC1/2/3/4. The SC4 no-regression gate.
