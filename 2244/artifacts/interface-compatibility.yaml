## Compatibility Classifications

- **New interface:** the opt-in multi-submodule/remote flag(s). Internal-only, default-off → non-breaking.
- **Modified (internal only):** `__ensure_gitbucket`, `__kill_gitbucket`, origin-wiring. Backward compatible — existing callers unaffected.
- **Unchanged:** `behavior_run` signature, `with-test-home` CLI, fixture script interface.
- **Removed:** none.

## API / Contract Notes

- No external API change. All changes internal to the `.opencode` test-harness submodule.
- `behavior_run` positional-arg signature is preserved — existing ~80 test scripts that call `behavior_run "name" "prompt"` remain valid.
- New opt-in flag follows the `BEHAVIOR_*` env convention; default value preserves current behavior (SC4).
- Private fixture repos (test-submodule-1/2) introduce an auth consideration but no public API change — the harness wires them as local repos or documents the auth path internally.

