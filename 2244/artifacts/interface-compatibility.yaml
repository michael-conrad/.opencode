dependency_contract:
  description: "Cross-phase dependency ordering for full-environment simulation support (env -i allowlist hardening + multi-submodule fixtures + GitBucket origin wiring)"
  notes: "Every edge below traces to spec.md §6 Dependencies (Dependency DAG, spec line 267). Reference: SC1 + SC5 + SC9 precede SC2; SC4 verified before SC2's wiring; SC2 precedes SC10; SC10 precedes SC11/SC12; SC5/SC14/SC15 verified together; SC13 precedes SC17 and is verified with SC2's provisioning and the default path; SC16 verified with SC13; SC18 independent; SC8 final regression gate."
  dependency_order:
    - phase: 1
      scs: ["SC5", "SC6", "SC13", "SC14", "SC15", "SC16"]
      requires: []
      description: "Env isolation foundation: extend the env -i allowlist with the three flags as a strict superset (SC5), record them in set-env.sh (SC6), apply the general env-set rule so the test env is provisioned by setup not inherited (SC13), constrain the allowlist to the minimal infra set (SC14), exclude parent-sourced secrets/credentials (SC15), and generate/set required test values in setup (SC16). SC5/SC14/SC15 all concern the same env -i allowlist block and are verified together (spec §6). SC16 is verified with SC13 (spec §6)."
    - phase: 2
      scs: ["SC17"]
      requires: ["phase-1"]
      description: "GB_* concrete instance of the env-set rule: no parent-sourced GB_*/GITBUCKET_PORT leak; scoped test-instance values when GitBucket provisioned, absent otherwise. SC13 precedes SC17 (spec §6)."
    - phase: 3
      scs: ["SC1", "SC4", "SC9"]
      requires: ["phase-1"]
      description: "Provisioning + cleanup + rejection primitives that SC2 depends on: multi-submodule fixture provisioning (SC1), mutual-exclusion rejection of both remote flags with HARNESS_FAILURE (SC4), and cleanup of all provisioned state (SC9). SC1 and SC9 precede SC2; SC4 must be verified before SC2's wiring (mutual-exclusion rejection precedes origin wiring) (spec §6)."
    - phase: 4
      scs: ["SC2"]
      requires: ["phase-1", "phase-2", "phase-3"]
      description: "GitBucket origin wiring: wire the GitBucket instance as the test repo's origin remote when BEHAVIOR_NEEDS_REMOTE=1. Preceded by SC1 + SC5 + SC9 (phase-1/phase-3), by SC4 rejection (phase-3), and by SC17 scoped GB_* values (phase-2); SC13 is verified alongside SC2's GitBucket provisioning (spec §6)."
    - phase: 5
      scs: ["SC3"]
      requires: ["phase-4"]
      description: "Merged-PR/issue discovery succeeds in the isolated env via gh pr list without GitHub auth, against the wired origin."
    - phase: 6
      scs: ["SC10"]
      requires: ["phase-4"]
      description: "Opt-in full-env simulation for the 2242-sc6 test: merged-PR discovery succeeds. SC2 precedes SC10 (spec §6)."
    - phase: 7
      scs: ["SC11", "SC12"]
      requires: ["phase-6"]
      description: "2242-sc6 verification: cleanup dispatch completes without a task-card read (SC11) and never halts for PR/branch context (SC12). SC10 precedes SC11 and SC12 (spec §6)."
    - phase: 8
      scs: ["SC18"]
      requires: []
      description: "Independent string gate: tests-v2/AGENTS.md documents the mutual-exclusion rule and the new opt-in capability. SC18 is an independent string gate, not ordered against the implementation phases (spec §6)."
    - phase: 9
      scs: ["SC8"]
      requires: ["phase-1", "phase-3", "phase-4"]
      description: "Final no-regression gate: with no opt-in flags, default provisioning remains single-.opencode + local platform byte-for-byte. SC8 is the final regression gate (spec §6)."
  invariants:
    - "SC4 mutual-exclusion rejection MUST be verified before SC2's origin wiring — ambiguous origin must never be attempted (spec §6: 'SC4 must be verified before SC2's wiring')."
    - "SC5, SC14, and SC15 concern the same env -i allowlist block and MUST be verified together (spec §6)."
