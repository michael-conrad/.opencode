- `BEHAVIOR_*` env-var opt-in flags: `BEHAVIOR_NEEDS_REMOTE`, `BEHAVIOR_FIXTURE_ISSUES`, `BEHAVIOR_SET_BARE_REMOTE`, `BEHAVIOR_SETUP_STALE_WORKTREE`, `BEHAVIOR_SUBMODULE_COMMIT`, `BEHAVIOR_MODEL`, `BEHAVIOR_PHASE`, `BEHAVIOR_HARNESS_VERSION`
- GitBucket env vars: `BEHAVIOR_NEEDS_REMOTE`, `GITBUCKET_PORT`, `GB_TOKEN`, `GB_HOST`
- Per-scenario fixtures auto-sourced from `fixtures/setup/<scenario-name>.sh` with `$1` = workdir
- Fixture issues auto-injected from `fixtures/issues/{N}/` via `setup_fixture_issues()`
- Submodule clone pattern duplicated in both `helpers.sh` (behavior_run) and `with-test-home` (do_setup + run path) — 3 near-identical clone blocks
- Isolation contract in with-test-home: `env -i` allowlist + test-home XDG; `GB_TOKEN`/`GB_HOST`/`GITBUCKET_PORT` already passthrough

## Key Constraints / Risk

- **Isolation contract (§9 of AGENTS.md):** "DO NOT change isolation requirements without an approved spec." Adding test-submodule clones + GitBucket-as-origin touches isolation.
- **Opt-in mandate from problem statement:** full-env simulation used ONLY when a test requires it, not as universal replacement for the `.opencode` clone.
- **Cleanup contract:** `__kill_gitbucket` / `--clean-all` must clean the new test-submodule clones and any provisioned remote.
- **Fixture-repo authentication:** test-submodule-1/2 are PRIVATE. The harness test env has no GitHub auth (local platform). Provisioning must either wire the test-submodule repos as local git repos (not remote clones) OR configure auth — this is a design decision the spec must resolve.
- **GitBucket is a private local HTTP instance** already reachable in test env via `GB_HOST`/`GITBUCKET_PORT` passthrough — it IS the simulated remote platform; no GitHub auth needed for it.
