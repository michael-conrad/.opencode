  dependency_ordering_verification:
    - "SC19/SC20 (Phase 10) precede SC10/SC11 (Phase 7) — the executor cannot authenticate gb without the full GB_* suite and the seeded gb config.toml"
    - "SC17 (Phase 2) corrected: test-env constants always set, GB_TOKEN provisioned-scoped; precedes SC19/SC20 (Phase 10) which build on it"
    - "SC2/SC3/SC4 mutually exclusive remote strategies precede origin wiring (SC2) and behavioral discovery (SC3/SC10)"
