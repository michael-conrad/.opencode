spec_path: .opencode/.issues/2244/spec.md
description: "Cross-phase dependency ordering for full-environment simulation support (env -i allowlist hardening + multi-submodule fixtures + GitBucket origin wiring)"
variables:
  phase_1:
    type: bool
    description: "C4 env -i allowlist extension + isolation check — SC5, SC6, SC7, SC14, SC15"
  phase_2:
    type: bool
    description: "C5 test-provisioned environment rule + GB_* scoping — SC13, SC16, SC17"
  phase_3:
    type: bool
    description: "C1 multi-submodule fixture provisioning — SC1"
  phase_4:
    type: bool
    description: "C3 remote strategy mutual exclusion — SC4"
  phase_5:
    type: bool
    description: "C7 cleanup of provisioned state — SC9"
  phase_6:
    type: bool
    description: "C2 GitBucket origin wiring + merged-PR discovery — SC2, SC3"
  phase_7:
    type: bool
    description: "C8 2242-sc6 full-env opt-in + cleanup-dispatch verification — SC10, SC11, SC12"
  phase_8:
    type: bool
    description: "C9 documentation of mutual-exclusion + full-env opt-in — SC18"
  phase_9:
    type: bool
    description: "C6 final no-regression default gate — SC8"
preconditions:
  - "z3.Implies(phase_2, phase_1)"
  - "z3.Implies(phase_3, phase_1)"
  - "z3.Implies(phase_4, phase_1)"
  - "z3.Implies(phase_5, phase_3)"
  - "z3.Implies(phase_5, phase_4)"
  - "z3.Implies(phase_6, phase_2)"
  - "z3.Implies(phase_6, phase_3)"
  - "z3.Implies(phase_6, phase_4)"
  - "z3.Implies(phase_7, phase_6)"
  - "z3.Implies(phase_8, phase_4)"
  - "z3.Implies(phase_9, phase_1)"
  - "z3.Implies(phase_9, phase_3)"
  - "z3.Implies(phase_9, phase_4)"
  - "z3.Implies(phase_9, phase_6)"
invariants:
  - "z3.Implies(phase_2, phase_1)"
  - "z3.Implies(phase_3, phase_1)"
  - "z3.Implies(phase_4, phase_1)"
  - "z3.Implies(phase_5, phase_3)"
  - "z3.Implies(phase_5, phase_4)"
  - "z3.Implies(phase_6, phase_2)"
  - "z3.Implies(phase_6, phase_3)"
  - "z3.Implies(phase_6, phase_4)"
  - "z3.Implies(phase_7, phase_6)"
  - "z3.Implies(phase_8, phase_4)"
  - "z3.Implies(phase_9, phase_1)"
  - "z3.Implies(phase_9, phase_3)"
  - "z3.Implies(phase_9, phase_4)"
  - "z3.Implies(phase_9, phase_6)"
postconditions: []
phases:
  phase_1:
    files:
      - tests-v2/with-test-home (env -i allowlist, set-env.sh)
    scs:
      - SC5
      - SC6
      - SC7
      - SC14
      - SC15
  phase_2:
    files:
      - tests-v2/with-test-home (do_setup/seed_model_config, GB_* scoping)
      - tests-v2/behaviors/helpers.sh (__ensure_gitbucket scoping)
    scs:
      - SC13
      - SC16
      - SC17
  phase_3:
    files:
      - tests-v2/behaviors/helpers.sh (behavior_run multi-submodule provisioning)
    scs:
      - SC1
  phase_4:
    files:
      - tests-v2/behaviors/helpers.sh (behavior_run mutual-exclusion rejection)
    scs:
      - SC4
  phase_5:
    files:
      - tests-v2/behaviors/helpers.sh (__kill_gitbucket, __reset_gitbucket)
      - tests-v2/with-test-home (do_clean_all)
    scs:
      - SC9
  phase_6:
    files:
      - tests-v2/behaviors/helpers.sh (behavior_run origin-wiring + gh pr list)
    scs:
      - SC2
      - SC3
  phase_7:
    files:
      - tests-v2/behaviors/2242-sc6-cleanup-dispatch-no-task-card-read.sh
      - tests-v2/behaviors/fixtures/setup/2242-sc6-cleanup-dispatch-no-task-card-read.sh
    scs:
      - SC10
      - SC11
      - SC12
  phase_8:
    files:
      - tests-v2/AGENTS.md
    scs:
      - SC18
  phase_9:
    files:
      - tests-v2/behaviors/helpers.sh (default provisioning path)
      - tests-v2/with-test-home
    scs:
      - SC8
edges:
  - from: phase_1
    to: phase_2
    rationale: C5 env-set rule and GB_* scoping build on the allowlist extended in C4
  - from: phase_1
    to: phase_3
    rationale: C1 multi-submodule provisioning requires the BEHAVIOR_NEEDS_MULTI_SUBMODULES flag passed through the C4 allowlist
  - from: phase_1
    to: phase_4
    rationale: C4 mutual-exclusion rejection requires both remote flags passed through the C4 allowlist
  - from: phase_3
    to: phase_5
    rationale: C7 cleanup removes the C1-provisioned fixture clones
  - from: phase_4
    to: phase_5
    rationale: C7 cleanup must account for the C4 mutual-exclusion-rejected partial state
  - from: phase_2
    to: phase_6
    rationale: C2 origin wiring requires the scoped GB_* values from C5/SC17
  - from: phase_3
    to: phase_6
    rationale: C2 origin wiring requires the C1 fixture repos
  - from: phase_4
    to: phase_6
    rationale: C2 origin wiring must respect the C4 mutual-exclusion rejection
  - from: phase_6
    to: phase_7
    rationale: C8 2242-sc6 full-env opt-in requires the C2 wired origin and discovery
  - from: phase_4
    to: phase_8
    rationale: C9 documentation covers the C4 mutual-exclusion rule, so must follow it
  - from: phase_1
    to: phase_9
    rationale: C6 default path unchanged after C4 allowlist extension
  - from: phase_3
    to: phase_9
    rationale: C6 default path unchanged after C1 provisioning
  - from: phase_4
    to: phase_9
    rationale: C6 default path unchanged after C4 mutual-exclusion rejection
  - from: phase_6
    to: phase_9
    rationale: C6 final regression gate after C2 origin wiring
