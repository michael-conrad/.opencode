  ### 2026-08-05 — Revise (spec-creation revise pipeline, developer-directed correct-execution
  SCs)


  - **What changed:** Revised SC10 and SC11 to measure correct task execution rather
  than literal tool-call mechanics. SC10 no longer measures the literal `gh pr list`
  command; it now measures whether the full-env opt-in enables the agent to discover
  the merged branch/PR state needed to execute cleanup (via any discovery mechanism
  the agent uses) and that cleanup proceeds. SC11 no longer measures whether the orchestrator
  read or did not read `tasks/cleanup.md`; it now measures whether the git-workflow-cleanup
  dispatch followed the correct task card''s instructions and completed correctly,
  producing a result contract. Updated the matching cost-frames, Approach step 10,
  Item 10/Item 11, and R-8. SC12 (no PR-context halt) unchanged. Both evidence types
  remain behavioral.

  - **Why:** Developer-directed revision (revision_reason: SC10 and SC11 defined success
  by literal tool-call mechanics rather than by correct task execution). The measure
  of success is whether the task was executed correctly — the correct task card''s
  instructions were followed and the cleanup completed — not whether a specific command
  (`gh pr list`) or read/no-read pattern occurred.

  - **Who authorized the change:** Developer-directed revision (revision_reason: correct-execution
  SC10/SC11).


