body: '# [SPEC] Full-Environment Simulation Support in `.opencode/tests-v2` Test Harness


  > **Full spec and artifacts: [`.opencode/.issues/2244/`](https://github.com/michael-conrad/.opencode/tree/issues-data/2244)**
  — this issue is a condensed exec summary; the authoritative spec lives in the `issues-data`
  branch.

  >

  > **Local artifacts:** `.opencode/.issues/2244/` — implementation plan, card catalogue,
  dependency contracts, research, designs, audit findings


  ## Problem


  The behavioral test harness in `.opencode/tests-v2/` provisions only a single `.opencode`
  submodule in the isolated test environment and defaults to the `local` platform
  (no remote, no GitHub auth). Tests that require real remote-PR or branch-discovery
  behavior cannot complete because the agent''s `gh pr list` / PR-discovery calls
  fail against a `local` platform with no origin remote, causing the model to halt
  and ask the developer for PR/branch context instead of completing the workflow.


  The motivating test `2242-sc6-cleanup-dispatch-no-task-card-read.sh` dead-ended
  in exactly this way: the model loaded git-workflow-cleanup, tried `gh pr list` (which
  fails with no GitHub remote/auth in the isolated `local`-platform test repo), and
  asked the user for the PR/branch instead of dispatching cleanup. Correcting this
  requires a **full-environment simulation** capability: provision optional sibling
  submodule fixture repos and/or wire a GitBucket instance as the test repo''s `origin`
  remote so merged-PR discovery and cleanup dispatch succeed.


  This capability is **opt-in** — it MUST be used only when a test requires it (e.g.,
  the #2242 SC6/SC7 cleanup-dispatch test), NOT as a universal replacement for the
  single-`.opencode` clone. It is prerequisite infrastructure for `.opencode` issue
  #2242 SC6/SC7.


  ## Success Criteria


  ### SC Table


  | ID | Criterion | Evidence Type | Verification Method | Documentation Sources |

  |----|-----------|---------------|---------------------|----------------------|

  | SC1 | Opt-in multi-submodule fixture provisioning: when `BEHAVIOR_NEEDS_MULTI_SUBMODULES=1`
  is set, the harness provisions the `test-submodule-1` and `test-submodule-2` fixture
  repos as **local git repos** (not remote clones) inside the attempt workdir, in
  addition to the existing `.opencode` clone. When the flag is absent, the default
  single-`.opencode` behavior is preserved. | structural | RED: flag absent → no sibling
  submodules in workdir; GREEN: flag set → sibling submodule fixture repos present.
  Inspect workdir `git submodule status` / repo dirs. | `.opencode/tests-v2/behaviors/helpers.sh`
  (`behavior_run()` submodule-provisioning block); `.opencode/tests-v2/behaviors/fixtures/`
  |

  | SC2 | GitBucket origin wiring: when `BEHAVIOR_NEEDS_REMOTE=1` is set and GitBucket
  is provisioned, `behavior_run()` wires the GitBucket instance as the test repo''s
  `origin` remote in the attempt workdir. | structural | Inspect the `behavior_run()`
  origin-wiring block in `helpers.sh`; run with `BEHAVIOR_NEEDS_REMOTE=1` and confirm
  `git remote -v` in the attempt workdir shows the GitBucket `origin`. | `.opencode/tests-v2/behaviors/helpers.sh`
  (`__ensure_gitbucket()`, origin-wiring block) |

  | SC3 | Merged-PR/issue discovery: with the GitBucket origin wired (SC2), the agent''s
  `gh pr list` call in the isolated test env discovers merged branches and open issues
  without GitHub auth. | behavioral | `opencode run` with `BEHAVIOR_NEEDS_REMOTE=1`;
  clean-room evaluation of `session.yaml` confirms `gh pr list` returns merged-branch/issue
  results and the agent does NOT halt for missing PR context. | `.opencode/tests-v2/behaviors/helpers.sh`
  (`__ensure_gitbucket()`, origin-wiring block); `.opencode/tests-v2/AGENTS.md` §12
  |

  | SC4 | Mutual-exclusion rejection: when both `BEHAVIOR_NEEDS_REMOTE=1` and `BEHAVIOR_SET_BARE_REMOTE=1`
  are set, `behavior_run()` rejects the configuration with a `HARNESS_FAILURE` exit
  and does not attempt ambiguous origin wiring. | behavioral | Run `behavior_run()`
  with both flags set; assert the `HARNESS_FAILURE` exit and that no origin-wiring
  is attempted. | `.opencode/tests-v2/behaviors/helpers.sh` (`BEHAVIOR_SET_BARE_REMOTE`
  block, mutual-exclusion rejection check) |

  | SC5 | Env passthrough superset: `BEHAVIOR_NEEDS_MULTI_SUBMODULES`, `BEHAVIOR_NEEDS_REMOTE`,
  and `BEHAVIOR_SET_BARE_REMOTE` are passed through the `env -i` allowlist in `with-test-home`
  as a strict superset — no existing allowlisted variable is removed or reordered.
  | structural | Inspect the `env -i` invocation + allowlist block in `with-test-home`
  for the three new variable names; confirm all previously allowlisted variables remain.
  | `.opencode/tests-v2/with-test-home` (env allowlist) |

  | SC6 | `set-env.sh` records the three new flags (`BEHAVIOR_NEEDS_MULTI_SUBMODULES`,
  `BEHAVIOR_NEEDS_REMOTE`, `BEHAVIOR_SET_BARE_REMOTE`) as documented debugging aids.
  | structural | Inspect `set-env.sh` for the three new variable names. | `.opencode/tests-v2/with-test-home`
  (`set-env.sh`) |

  | SC7 | Isolation check still passes after extension: the isolation verification
  procedure (no production state leaked into the test env) passes after the allowlist
  extension with the three new flags. | structural | Run the isolation verification
  procedure against the extended allowlist; confirm no production secret, credential,
  platform token, or environment-specific configuration is admitted. | `.opencode/tests-v2/with-test-home`
  (env allowlist); `.opencode/tests-v2/AGENTS.md` §5 (Isolation Verification Procedure)
  |

  | SC8 | No-regression default: with no opt-in flags set, a representative behavioral
  test still provisions ONLY `.opencode` (single submodule) and `local` platform (no
  remote) — default behavior is byte-for-byte unchanged for the ~80 existing test
  scripts. | behavioral | Run a representative non-opt-in behavioral test; clean-room
  evaluation confirms single-`.opencode` + local platform provisioning. | `.opencode/tests-v2/behaviors/helpers.sh`;
  `.opencode/tests-v2/with-test-home` |

  | SC9 | Cleanup: after a full-env provisioned run, `--clean-all` / `__kill_gitbucket`
  removes all new test-submodule clones, GitBucket process, and stale state — no orphan
  clones or processes remain, and repeated runs start clean. | behavioral | After
  a provisioned run, call `--clean-all`/`__kill_gitbucket`; assert no orphan GitBucket
  process, no stale `tmp/` clones/state remain; then run again and confirm a clean
  start. | `.opencode/tests-v2/with-test-home` (`do_clean()`, `do_clean_all()`); `.opencode/tests-v2/behaviors/helpers.sh`
  (`__reset_gitbucket()`, `__kill_gitbucket()`) |

  | SC10 | Opt-in full-env simulation for the 2242-sc6 cleanup-dispatch test: `2242-sc6-cleanup-dispatch-no-task-card-read.sh`
  runs with the full-env opt-in (`BEHAVIOR_NEEDS_MULTI_SUBMODULES=1` + `BEHAVIOR_NEEDS_REMOTE=1`),
  and the full-env opt-in enables the agent to discover the merged branch/PR state
  needed to execute cleanup (via any discovery mechanism the agent uses — git primitives,
  `gb pull-request list`, `gh pr list`, or any other), and cleanup proceeds. The specific
  discovery command is NOT the measure; discovery yielding the merged branch that
  lets cleanup execute correctly IS the measure. | behavioral | Run `2242-sc6` test
  with the full-env opt-in; clean-room evaluation of `session.yaml` confirms the agent
  discovered the merged branch (by whatever discovery mechanism it used) and cleanup
  executed against it. | `.opencode/tests-v2/behaviors/2242-sc6-cleanup-dispatch-no-task-card-read.sh`;
  `.opencode/tests-v2/behaviors/fixtures/setup/2242-sc6-cleanup-dispatch-no-task-card-read.sh`
  |

  | SC11 | Cleanup dispatch completes correctly: in the SC10 run, the git-workflow-cleanup
  dispatch follows the instructions in the correct task card (`tasks/cleanup.md`)
  and completes, producing a result contract. Whether the orchestrator read or did
  not read the task card itself is NOT the measure — what matters is that the correct
  task card''s instructions were followed and the cleanup dispatch completed correctly.
  | behavioral | Clean-room evaluation of the SC10 `session.yaml` confirms the cleanup
  dispatch produced a result contract by following the correct task card (`tasks/cleanup.md`)
  instructions. | `.opencode/tests-v2/behaviors/2242-sc6-cleanup-dispatch-no-task-card-read.sh`
  |

  | SC12 | No PR-context halt: in the SC10 run, `session.yaml` shows the agent never
  halted to ask the user for PR/branch context (no question-tool call or "provide
  PR" style halt). | behavioral | Clean-room evaluation of the SC10 `session.yaml`
  confirms no PR/branch-context halt or question-tool invocation. | `.opencode/tests-v2/behaviors/2242-sc6-cleanup-dispatch-no-task-card-read.sh`
  |

  | SC13 | General env-set rule: the isolated test environment is provisioned entirely
  by the test harness setup itself — every environment variable a test requires is
  set within `do_setup`/`seed_model_config`/test-home provisioning, never inherited
  from the parent/production shell. | string | Inspect `with-test-home` (`do_setup`,
  `seed_model_config`) and test-home provisioning; confirm every required test value
  is set within the setup. | `.opencode/tests-v2/with-test-home` (`do_setup`, `seed_model_config`,
  test-home provisioning) |

  | SC14 | env -i allowlist minimal set: the allowlist SHALL contain ONLY the minimal,
  explicitly enumerated infrastructure set — exactly `PATH`, `SHELL`, `TERM`, `LANG`,
  `USER`, `LOGNAME`, `GIT_CONFIG_NOSYSTEM`, `XDG_*` into the test home, `SNAP_USER_DATA`/`SNAP_USER_COMMON`,
  and test-provisioned values. | string | Inspect the `env -i` allowlist block in
  `with-test-home`; confirm it enumerates exactly this minimal infrastructure set
  and nothing more. | `.opencode/tests-v2/with-test-home` (env allowlist) |

  | SC15 | env -i allowlist no secrets: the allowlist SHALL NOT include any parent-sourced
  variable carrying secrets, credentials, platform tokens, or environment-specific
  configuration — namely none of `GB_*`, `GITHUB_*`, `GH_*`, `NODE_ENV`, `VIRTUAL_ENV`,
  `CONDA_DEFAULT_ENV`, `OPENCODE_CONFIG_CONTENT`, or API keys. | string | Inspect
  the `env -i` allowlist block in `with-test-home`; confirm none of the enumerated
  secret/credential/token/env-specific variables is admitted from the parent env.
  | `.opencode/tests-v2/with-test-home` (env allowlist) |

  | SC16 | Required values generated by setup: any value a test needs (GitBucket token/host,
  model, config) is generated/set by the test setup, never read through from the parent
  env. | string | Confirm `do_setup`/`seed_model_config`/test-home provisioning in
  `with-test-home` generate or set model, config, and (when provisioned) GitBucket
  token/host values. | `.opencode/tests-v2/with-test-home` (`do_setup`, `seed_model_config`,
  test-home provisioning) |

  | SC17 | GB_* scoping (concrete instance of SC13–SC16): the test-env-specific `GB_*`/`GITBUCKET_PORT`
  values (`GB_HOST`, `GB_REPO`, `GB_PROTOCOL`, `GITBUCKET_PORT`) are ALWAYS set to
  the harness''s test-env constants in the isolated test environment — regardless
  of whether a test GitBucket is running. Only `GB_TOKEN` (the credential secret)
  is set when and only when `BEHAVIOR_NEEDS_REMOTE=1` provisions a test GitBucket,
  to the test instance''s own generated value; it is absent/empty otherwise. Parent-sourced
  `GB_*`/`GITBUCKET_PORT` values are NEVER passed through the `env -i` allowlist or
  `set-env.sh`. | string | Inspect the `env -i` allowlist, `GB_ENV_ARGS`, and `set-env.sh`
  in `with-test-home` for `GB_*` sourcing; confirm the test-env constants are always
  set and `GB_TOKEN` is scoped to the test instance only when provisioned. | `.opencode/tests-v2/with-test-home`;
  `.opencode/tests-v2/behaviors/helpers.sh` (`__ensure_gitbucket()`); `.opencode/tests-v2/AGENTS.md`
  §5 |

  | SC18 | Documentation: `.opencode/tests-v2/AGENTS.md` documents the `BEHAVIOR_NEEDS_MULTI_SUBMODULES`
  / `BEHAVIOR_SET_BARE_REMOTE` mutual-exclusion rule and the new full-environment
  opt-in capability (multi-submodule fixtures and GitBucket origin wiring). | string
  | Inspect `.opencode/tests-v2/AGENTS.md` for a section documenting the mutual-exclusion
  rule and the opt-in capability. | `.opencode/tests-v2/AGENTS.md` |

  | SC19 | Full GB_* env suite propagation: when `BEHAVIOR_NEEDS_REMOTE=1`, `with-test-home`
  propagates the full `GB_*` env suite — `GB_TOKEN`, `GB_HOST`, `GITBUCKET_PORT`,
  `GB_REPO`, `GB_PROTOCOL` — into the isolated test env via `GB_ENV_ARGS`. The test-env
  constants (`GB_HOST`, `GB_REPO`, `GB_PROTOCOL`, `GITBUCKET_PORT`) are always set
  to the harness''s constants; `GB_TOKEN` is set to the test instance''s value only
  when `BEHAVIOR_NEEDS_REMOTE=1`. | structural | Inspect the `GB_ENV_ARGS` array and
  `env -i` invocation in `with-test-home` for all five variable names; confirm the
  four constants are always set and `GB_TOKEN` is populated only when provisioned.
  | `.opencode/tests-v2/with-test-home` (`GB_ENV_ARGS`, `env -i`); `.opencode/tests-v2/behaviors/helpers.sh`
  (`__ensure_gitbucket()`) |

  | SC20 | Pre-fabricated gb config: when `BEHAVIOR_NEEDS_REMOTE=1`, the test home
  seeds a pre-fabricated `gb` config.toml at `$TEST_HOME/.config/gb/config.toml` with
  the harness''s `default_host` constant and host token matching the provisioned test
  GitBucket (token present only when GitBucket is provisioned), so `gb` authenticates
  deterministically without `gb auth login`. | structural | Inspect `do_setup`/test-home
  provisioning in `with-test-home` for the `gb` config.toml seeding block. | `.opencode/tests-v2/with-test-home`
  (`do_setup`, test-home provisioning); `.opencode/tests-v2/behaviors/helpers.sh`
  (`__ensure_gitbucket()`) |


  ### Per-SC Cost-Frame (dark-prose-007)


  | ID | Cost-Frame |

  |----|------------|

  | SC1 | Failing to provision fixture submodules means every remote-sensitive test
  inherits the dead-end halt. A test that cannot see its merged branch and open issue
  cannot exercise cleanup — it burns a model run to end in a question. You will accept
  that cost every single time you skip this. |

  | SC2 | Wiring GitBucket as origin is the difference between a workflow that completes
  and one that stalls at `gh pr list`. An unwired origin leaves `gh pr list` with
  nothing to query — the capability silently does nothing. |

  | SC3 | A `gh pr list` that returns nothing is not proof of isolation — it is proof
  of nothing to discover. The discovery claim must be verified against the wired origin,
  not assumed from the wiring. |

  | SC4 | Allowing both remote flags to be set simultaneously produces an ambiguous
  `origin` — a harness that silently picks one strategy corrupts the isolation contract.
  Contradictory config rejected early is a harness that fails loudly instead of failing
  silently. |

  | SC5 | Leaking production state through a careless allowlist extension silently
  corrupts every test that follows. The isolation contract is the wall between your
  test and your real repo. A breach here is not a flaky test — it is a data-integrity
  event in your working tree. |

  | SC6 | A flag that is not recorded in `set-env.sh` is a flag a debugging session
  cannot see. Documentation-by-recording is cheap; a silent gap costs a confused test
  author an afternoon. |

  | SC7 | An allowlist that passes the diff but fails the isolation check has not
  been verified — it has been edited. The isolation procedure is the proof that the
  extension did not open a pipe to production. |

  | SC8 | A regression in the default single-`.opencode` path breaks all ~80 existing
  tests at once. The opt-in design is the shield; SC8 is the proof the shield holds.
  Without it, you ship a change whose blast radius you have not measured. |

  | SC9 | Orphan GitBucket processes and stale clones poison every subsequent run
  and hold the flock. A harness that cannot clean itself is a harness that eventually
  stops working for reasons nobody can reproduce. Cleanup is not housekeeping — it
  is the precondition for a reliable next run. |

  | SC10 | The motivating test exists to prove the git-workflow cleanup dispatch completes.
  If the full-env opt-in does not let the agent discover the merged branch it needs
  to execute cleanup, the #2242 SC6/SC7 evidence is unobtainable and the whole skill-card
  migration is unverifiable. This SC is not optional scope — it is the point of the
  capability. |

  | SC11 | A cleanup dispatch that does not follow the correct task card (`tasks/cleanup.md`)
  and complete is not a completed cleanup — it is a stalled or mis-routed one. If
  the dispatch does not execute cleanup per the correct task card, the behavioral
  evidence is invalid and the migration claim is unsupported. |

  | SC12 | A run that halts to ask the user for PR/branch context is not a completed
  cleanup dispatch — it is a deferred question. If the agent asks instead of acting,
  the SC10/SC11 evidence is unobtainable and the capability has not delivered. |

  | SC13 | A test env that does not set its own required values is not a test env
  at all — it is a sandbox that begs values from a production shell it has no business
  reading. Every value a test needs must be set by the test setup itself. |

  | SC14 | An allowlist that admits anything beyond the minimal infrastructure set
  is an isolation wall with a door in it. The wall holds only if the enumerated set
  is exhaustive — not illustrative. |

  | SC15 | A single parent-sourced credential in the allowlist silently authenticates
  a test you believed was sandboxed — that is a data-integrity event, not a flaky
  test. The exclusion must be enumerated, because "and so on" is how a credential
  slips through. |

  | SC16 | A required value read through from the parent is a value you did not control.
  If model, config, or GitBucket token comes from the parent shell, the test is exercising
  your environment, not the harness. |

  | SC17 | Treating `GB_*` as absent-unless-provisioned means the isolated test env
  is missing the test-env constants the executor needs to address any GitBucket host
  — so even a provisioned run cannot authenticate. But treating parent-sourced `GB_*`
  as usable means every no-GitBucket test silently talks to — or authenticates as
  — your production GitBucket. The correct line: the test-env constants (`GB_HOST`,
  `GB_REPO`, `GB_PROTOCOL`, `GITBUCKET_PORT`) are always the harness''s own; only
  the `GB_TOKEN` credential is provisioned-scoped. |

  | SC18 | A mutual-exclusion rule and opt-in capability that are not documented are
  rules a future test author will violate by accident. Undocumented behavior is not
  a rule — it is a trap set for the next person. |

  | SC19 | A `GB_*` suite that reaches the executor incomplete is a suite that cannot
  authenticate. `gb` reads host, token, repo, and protocol together; an executor holding
  `GB_TOKEN` but no `GB_REPO`/`GB_PROTOCOL` still fails ''Not authenticated'' against
  a host it cannot address. |

  | SC20 | A test home without a seeded `gb` config.toml forces the executor to attempt
  `gb auth login` interactively — a prompt the harness cannot answer — and the discovery
  call fails with ''Not authenticated''. |


  ## Approach


  1. **SC1 — Multi-submodule fixture provisioning:** Add the opt-in flag `BEHAVIOR_NEEDS_MULTI_SUBMODULES=1`
  in `helpers.sh` `behavior_run()`. When set, provision `test-submodule-1` and `test-submodule-2`
  fixture repos as **local git repos** (created/`git init` locally from fixture templates,
  NOT `git clone` of the private GitHub repos) inside the attempt workdir, alongside
  `.opencode`. This avoids GitHub auth in the isolated env and is deterministic. Default
  off preserves the single-`.opencode` path.

  2. **SC2 — GitBucket origin wiring:** Ensure the origin-wiring block in `behavior_run()`
  (helpers.sh) attaches the GitBucket instance as the test repo''s `origin`.

  3. **SC3 — Merged-PR/issue discovery:** Verify, via `opencode run` with `BEHAVIOR_NEEDS_REMOTE=1`,
  that `gh pr list` against the wired GitBucket origin discovers merged branches and
  open issues without GitHub auth and without halting.

  4. **SC4 — Mutual-exclusion rejection:** Add explicit rejection in `behavior_run()`
  when both `BEHAVIOR_NEEDS_REMOTE=1` and `BEHAVIOR_SET_BARE_REMOTE=1` are set — contradictory
  config is rejected with `HARNESS_FAILURE` before either wiring block runs.

  5. **SC5 — Env passthrough superset:** Extend the `env -i` allowlist in `with-test-home`
  (superset only) with `BEHAVIOR_NEEDS_MULTI_SUBMODULES`, `BEHAVIOR_NEEDS_REMOTE`,
  and `BEHAVIOR_SET_BARE_REMOTE`. No existing allowlisted variable is removed.

  6. **SC6 — set-env.sh records flags:** Add the three new flags to `set-env.sh` in
  `with-test-home`.

  7. **SC7 — Isolation check:** Run the isolation verification procedure against the
  extended allowlist; confirm no production state leaks.

  8. **SC8 — No-regression gate:** Verify the default path (no opt-in) provisions
  exactly the current single-`.opencode`/`local` state via a representative behavioral
  test.

  9. **SC9 — Cleanup:** Extend `--clean-all` and `__kill_gitbucket`/`__reset_gitbucket`
  to remove new test-submodule clones and any provisioned remote state; verify idempotent
  clean.

  10. **SC10/SC11/SC12 — Opt-in full-env for 2242-sc6:** Extend the `2242-sc6` test
  + its per-scenario fixture to set the full-env opt-in (`BEHAVIOR_NEEDS_MULTI_SUBMODULES=1`
  + `BEHAVIOR_NEEDS_REMOTE=1`) so the agent discovers the merged branch it needs to
  execute cleanup (by whatever discovery mechanism it uses), the cleanup dispatch
  completes correctly by following the correct task card, and the run never halts
  for PR/branch context.

  11. **SC13–SC16 — General env-set rule:** Refactor the `env -i` allowlist in `with-test-home`
  to contain ONLY the minimal, explicitly enumerated infrastructure set (SC14), exclude
  all parent-sourced secret/credential/token/env-specific variables (SC15), and ensure
  `do_setup`/`seed_model_config`/test-home provisioning sets every required test value
  (SC13/SC16).

  12. **SC17 — GB_* test-env constants + token non-leakage:** In `with-test-home`,
  set the test-env constants (`GB_HOST`, `GB_REPO`, `GB_PROTOCOL`, `GITBUCKET_PORT`)
  to the harness''s constant values in the `env -i` allowlist/`GB_ENV_ARGS`/`set-env.sh`
  always. Scope `GB_TOKEN` to the provisioned test instance''s generated value only
  when `BEHAVIOR_NEEDS_REMOTE=1` (via `__ensure_gitbucket()` in `helpers.sh`); otherwise
  it is absent/empty. Never pass through parent-sourced `GB_*`/`GITBUCKET_PORT` values.

  13. **SC18 — Documentation:** Update `tests-v2/AGENTS.md` §5 (single-submodule clone)
  and §12 (GitBucket) to document the new opt-in capabilities and the `BEHAVIOR_NEEDS_MULTI_SUBMODULES`/`BEHAVIOR_SET_BARE_REMOTE`
  mutual-exclusion rule, plus the GB_* non-leakage contract.

  14. **SC19 — Full GB_* env suite:** Set the test-env constants (`GB_HOST`, `GB_REPO`,
  `GB_PROTOCOL`, `GITBUCKET_PORT`) in `with-test-home` (`GB_ENV_ARGS`/`env -i` allowlist)
  always; extend `__ensure_gitbucket()` in `helpers.sh` to export `GB_REPO`/`GB_PROTOCOL`
  and scope `GB_TOKEN` to the test instance when `BEHAVIOR_NEEDS_REMOTE=1`; propagate
  `GB_TOKEN`, `GB_HOST`, `GITBUCKET_PORT`, `GB_REPO`, `GB_PROTOCOL` into the isolated
  env.

  15. **SC20 — gb config.toml seeding:** Add a `do_setup`/test-home provisioning block
  in `with-test-home` that writes `$TEST_HOME/.config/gb/config.toml` with `default_host`
  and host token matching the provisioned test GitBucket so `gb` authenticates without
  `gb auth login`.


  ## Affected Files


  - `.opencode/tests-v2/behaviors/helpers.sh` — opt-in multi-submodule provisioning,
  GitBucket origin wiring, mutual-exclusion with `BEHAVIOR_SET_BARE_REMOTE`, cleanup
  functions

  - `.opencode/tests-v2/with-test-home` — `env -i` allowlist refactor (minimal infrastructure
  set, no parent secrets), `set-env.sh`, `do_setup`/`seed_model_config` (test-provisioned
  values), cleanup (`--clean`, `--clean-all`)

  - `.opencode/tests-v2/AGENTS.md` — harness spec §5/§12 documentation updates

  - `.opencode/tests-v2/behaviors/2242-sc6-cleanup-dispatch-no-task-card-read.sh`
  — set full-env opt-in

  - `.opencode/tests-v2/behaviors/fixtures/setup/2242-sc6-cleanup-dispatch-no-task-card-read.sh`
  — extend to provision full environment

  - New fixture/setup files under `.opencode/tests-v2/behaviors/fixtures/` implementing
  full-environment provisioning (test-submodule-1/2 local repo fixtures, GitBucket
  origin wiring)


  ## Traceability


  | Requirement | SC(s) |

  |-------------|-------|

  | R-1 | SC1 |

  | R-2 | SC2 |

  | R-3 | SC4 |

  | R-4 | SC5, SC7 |

  | R-5 | SC8 |

  | R-6 | SC9 |

  | R-7 | SC9 |

  | R-8 | SC10, SC11, SC12 |

  | R-13 | SC3 |

  | R-9 | SC18 |

  | R-10 | SC6 |

  | R-11 | SC13, SC14, SC15, SC16 |

  | R-12 | SC17 |

  | R-14 | SC19 |

  | R-15 | SC20 |


  Dependency DAG: SC1 + SC5 + SC9 precede SC2; SC4 must be verified before SC2''s
  wiring (mutual-exclusion rejection precedes origin wiring); SC2 precedes SC10; SC10
  precedes SC11 and SC12; SC5/SC14/SC15 concern the same `env -i` allowlist block
  and are verified together; SC13 precedes SC17 and is verified alongside SC2''s GitBucket
  provisioning (test-env constants always set; `GB_TOKEN` scoped to the provisioned
  instance only) and the default path (test-env constants still set; no `GB_TOKEN`
  when no GitBucket); SC16 is verified with SC13; SC18 is an independent string gate;
  SC19 and SC20 are prerequisites for SC10/SC11 (they precede the behavioral discovery
  SCs — the executor cannot authenticate `gb` until both the full `GB_*` env suite
  reaches it and the test home carries a seeded `gb` config); SC8 is the final regression
  gate.


  ## Change Control


  ### 2026-08-05 — Revise (spec-creation revise pipeline, developer-directed GB_*
  scoping semantics)


  - **What changed:** Corrected the GB_* scoping semantics across SC17, SC19, SC20,
  R-12, R-14, R-15, Approach steps 12/14/15, cost-frames, the Dependency DAG, and
  the §10 edge cases. The corrected model: the test-env-specific `GB_*` values (`GB_HOST`,
  `GB_REPO`, `GB_PROTOCOL`, `GITBUCKET_PORT`) are test-env constants the harness ALWAYS
  sets in the isolated test environment — regardless of whether a test GitBucket is
  running. Only `GB_TOKEN` (the credential secret) is set when and only when the harness
  provisioned a test GitBucket (`BEHAVIOR_NEEDS_REMOTE=1`); it is absent/empty otherwise.
  No parent-sourced `GB_*`/`GITBUCKET_PORT` value ever leaks into the isolated test
  env. The `gb` config.toml fixture (SC20/R-15) seeds the harness''s `default_host`
  constant always, with the host token present only when GitBucket is provisioned.

  - **Why:** Developer-directed revision (revision_reason: clarify GB_* scoping semantics).
  The prior wording ("GB_* absent unless scoped to the provisioned test GitBucket")
  was incorrect: the test-env constants are always present as harness constants; only
  the `GB_TOKEN` credential is provisioned-scoped.

  - **Who authorized the change:** Developer-directed revision (revision_reason: clarify
  GB_* scoping semantics).


