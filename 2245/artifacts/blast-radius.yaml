blast_radius:
  phases:
    sc2_convert_scripts:
      phase: SC-2
      title: Convert 12 behavior scripts to artifact-only generators
      directly_affected:
        - tests-v2/behaviors/2219-sc10-non-pointer-guard.sh
        - tests-v2/behaviors/2219-sc11-existing-cleanup.sh
        - tests-v2/behaviors/2219-sc15-decline-submodule-pr.sh
        - tests-v2/behaviors/2219-sc16-stale-pointer-block.sh
        - tests-v2/behaviors/2219-sc19-release-pr-prework.sh
        - tests-v2/behaviors/2219-sc3-prework-ordering.sh
        - tests-v2/behaviors/2219-sc6-dead-branch-detection.sh
        - tests-v2/behaviors/2219-sc7-submodule-pr-verification.sh
        - tests-v2/behaviors/2219-sc8-dead-branch-deletion.sh
        - tests-v2/behaviors/2219-sc9-dirty-pointer.sh
        - tests-v2/behaviors/2239-sc8-check-pr-routing.sh
        - tests-v2/behaviors/skill-deck-completeness.sh
      ripple:
        - "Each converted script is invoked via `bash .opencode/tests-v2/behaviors/<scenario>.sh`. Removing evaluation changes exit behavior from 'evaluated exit 0' to 'artifact-only exit 0'. No external consumer depends on non-zero exit (scripts already exit 0 unconditionally)."
        - "Behavioral SC verification for scenarios (2219, 2239, skill-deck-completeness) relies on generated artifacts (session.yaml). Evaluation responsibility shifts from inline assert_semantic to orchestrator-dispatched clean-room sub-agent."
      risk: low
    sc1_remove_function:
      phase: SC-1
      title: Remove assert_semantic() from helpers.sh
      directly_affected:
        - tests-v2/behaviors/helpers.sh (function block lines 653-706)
      ripple:
        - "helpers.sh is sourced by ALL behavior scripts. Removing assert_semantic must occur AFTER all 12 call sites are removed (SC-2 to SC-1 dependency), else `set -euo pipefail` turns an undefined-function call into an error."
        - "session-to-timeline tool is NOT affected (separate, used by behavior_run artifact export)."
      risk: low (after SC-2)
    sc3_evaluation_contract:
      phase: SC-3
      title: Document orchestrator-dispatched clean-room sub-agent evaluation contract
      directly_affected:
        - tests-v2/AGENTS.md
      ripple:
        - "Defines how downstream SC-N+1 verification is executed for behavioral SCs. Affects how future behavioral SCs are written and verified."
      risk: low
    sc4_sc5_sc6_docs:
      phase: SC-4/SC-5/SC-6
      title: Update active enforcement documentation
      directly_affected:
        - skills/test-driven-development/SKILL.md
        - skills/verification-before-completion/tasks/verify.md
      ripple:
        - "These docs guide agents writing behavioral tests. Updating them changes how future behavioral SCs are described and verified. No code consumers depend on doc text."
      risk: low
  out_of_scope_no_ripple:
    - tests-v2/test-enforcement.sh (content-verification)
    - tests-v2/with-test-home
    - .opencode/tools/session-to-timeline
    - historical .issues/ archival files
  summary: "Change is tightly scoped to tests-v2 behavior scripts, helpers.sh, and three active enforcement docs. No production code, public API, or cross-repo consumers depend on assert_semantic. Ripple risk is low and confined to the tests-v2 framework and its documentation."
