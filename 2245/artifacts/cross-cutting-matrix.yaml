summary: "The dominant cross-cutting concern is clean-room discipline: this spec replaces inline evaluation with orchestrator-dispatched clean-room sub-agent evaluation. Every SC must uphold the clean-room isolation contract and preserve the behavioral verification signal (no lobotomization). session.yaml-primary and doc coherence are secondary concerns spanning the doc and contract SCs."
