# Pipeline readiness gate for issue 2245

## Checks

check_atomicity:
  result: PASS
  detail: "Every proposed SC maps to exactly one RED/GREEN/COMMIT cycle. SC-1 (function removal), SC-2 (script conversion), SC-3 (contract), SC-4/5/6 (docs). Each is a single independently verifiable concern."

check_dependency_ordering:
  result: PASS
  detail: "SC DAG is acyclic: SC-2 → SC-1 (scripts must stop calling assert_semantic before the function is removed); SC-3 → SC-4/5/6 (contract documented before docs reference it); SC-4, SC-5, SC-6 mutually independent. No cycles."

check_single_concern:
  result: PASS
  detail: "Each SC targets one file category and one verification domain: SC-1 (helpers.sh), SC-2 (behavior scripts), SC-3 (AGENTS.md contract), SC-4 (AGENTS.md), SC-5 (TDD SKILL.md), SC-6 (verify.md). No SC spans multiple unrelated concerns."

check_phase_dependency:
  result: PASS
  detail: "Phase dependency graph is acyclic and linear: convert scripts (SC-2) → remove function (SC-1); contract (SC-3) → docs (SC-4/5/6)."

check_three_tier_structure:
  result: PASS
  detail: "Multi-phase spec has pre (SC-2 conversion, SC-3 contract) / per-file (SC-1 helpers.sh, SC-4/5/6 docs) / post (final grep sweep for assert_semantic absence across all active docs) structure. The plan can organize phases accordingly."

## Proposed Phase Structure

phases:
  - phase: Phase 1
    scs: [SC-2]
    title: Convert 12 behavior scripts to artifact-only generators
    concern: Remove inline assert_semantic evaluation from behavior scripts; preserve generation.
  - phase: Phase 2
    scs: [SC-1]
    title: Remove assert_semantic() from helpers.sh
    concern: Pure deletion of the inline-evaluation function (dead code after Phase 1).
  - phase: Phase 3
    scs: [SC-3]
    title: Document orchestrator-dispatched clean-room sub-agent evaluation contract
    concern: Formalize the replacement evaluation mechanism in AGENTS.md.
  - phase: Phase 4
    scs: [SC-4, SC-5, SC-6]
    title: Update active enforcement documentation
    concern: Purge assert_semantic from AGENTS.md, TDD SKILL.md, verify.md; reflect two-SC clean-room pattern.

## Gate Verdict

status: PASS
detail: "The proposed SC set satisfies all pipeline-readiness checks. SC-2 must precede SC-1 (dependency). All SCs are single-concern, atomic, and the phase DAG is acyclic with a pre/per-file/post structure."
