## Key Findings

finding_1:
  summary: "assert_semantic() is the ONLY assertion helper actually defined in helpers.sh."
  evidence:
    - "grep of function defs in helpers.sh shows only: __find_project_root, __ensure_gitbucket, __reset_gitbucket, __kill_gitbucket, __model_slug, __artifact_dir, __export_sqlite_to_yaml, behavior_run, behavior_get_stdout, behavior_get_stderr, __init_model_pool, behavior_run_pool, assert_semantic."
    - "No assert_stderr_pattern_present / assert_skill_called / assert_tool_calls_made / assert_forbidden_pattern_absent / assert_required_pattern_present / assert_no_skill_called functions exist in helpers.sh."
  implication: "Docs (verify.md, TDD SKILL.md, AGENTS.md) reference assertion helpers that do not exist in helpers.sh. Removing assert_semantic leaves helper.sh with NO assertion helpers — consistent with the artifact-only paradigm."

finding_2:
  summary: "12 behavior scripts call assert_semantic inline after behavior_run."
  count: 12
  scripts:
    - 2219-sc10-non-pointer-guard.sh
    - 2219-sc11-existing-cleanup.sh
    - 2219-sc15-decline-submodule-pr.sh
    - 2219-sc16-stale-pointer-block.sh
    - 2219-sc19-release-pr-prework.sh
    - 2219-sc3-prework-ordering.sh
    - 2219-sc6-dead-branch-detection.sh
    - 2219-sc7-submodule-pr-verification.sh
    - 2219-sc8-dead-branch-deletion.sh
    - 2219-sc9-dirty-pointer.sh
    - 2239-sc8-check-pr-routing.sh
    - skill-deck-completeness.sh
  implication: "All 12 currently run behavior_run then assert_semantic then exit 0. Each should be reduced to artifact-only: behavior_run + exit 0."

finding_3:
  summary: "assert_semantic does its own inline `opencode run` with a clean-room inspector prompt."
  evidence:
    - "helpers.sh lines 686-700: builds inspector_prompt and runs `${OPENCODE_CMD[@]} run \"$inspector_prompt\" --model \"$model\"`."
  implication: "This is INLINE evaluation embedded in the script — exactly what the artifact-only paradigm forbids. The clean-room inspector model runs inside the script rather than being dispatched by the orchestrator. Spec topic replaces this inline run with orchestrator-dispatched clean-room sub-agent evaluation."

finding_4:
  summary: "Canonical artifact-only target already exists: 2230-sc1-trunk-tip-dispatch.sh."
  evidence:
    - "2230-sc1-trunk-tip-dispatch.sh sources helpers.sh, sets SCENARIO_NAME/PROMPT, calls behavior_run, then `exit 0` — no assertion helper, no evaluation, no OVERALL_RESULT."
  implication: "This script is the reference model for converting the 12 call sites."

finding_5:
  summary: "session.yaml (SQLite DB export) is the PRIMARY evaluation source per tests-v2/AGENTS.md §1."
  evidence:
    - "AGENTS.md states session.yaml is PRIMARY; stdout.log is prose only; stderr.log is diagnostics only; assertion helpers that grep stdout/stderr are FORBIDDEN for behavioral SC evaluation."
  implication: "Clean-room sub-agent evaluation must consume session.yaml, not inline opencode-run of stdout/stderr. The orchestrator-dispatched evaluation receives the artifact dir path + SC criterion and reads session.yaml."

finding_6:
  summary: "AGENTS.md §6a already prescribes the two-SC pattern (artifact generation + clean-room evaluation)."
  evidence:
    - "AGENTS.md '6a. Two-SC Pattern: Artifact Generation + Clean-Room Evaluation' table: SC-N generates artifacts, SC-N+1 dispatches clean-room sub-agent to read session.yaml."
  implication: "The docs already define the target pattern. The doc update must remove assert_semantic-specific references and align with this two-SC pattern. This spec's SCs should follow the same pattern: behavior scripts become artifact-only, and evaluation moves to orchestrator-dispatched clean-room sub-agents."

finding_7:
  summary: "TDD SKILL.md and verify.md still list assert_semantic as PRIMARY behavioral assertion."
  evidence:
    - "TDD SKILL.md lines 209/213/223/374/378/422/429/436 reference assert_semantic as PRIMARY assertion for behavioral SCs."
    - "verify.md line 270 lists assert_semantic among assertion helpers."
  implication: "These docs must be updated to reflect that behavioral SC evaluation is performed by orchestrator-dispatched clean-room sub-agents reading session.yaml, not by inline assert_semantic."

finding_8:
  summary: "Many historical .issues/ plan/spec/artifact files reference assert_semantic."
  evidence:
    - "grep shows dozens of files under .issues/ referencing assert_semantic (e.g., 2166/spec.md, 2219/plan.md, 2230/plan.md, 1881/artifacts)."
  implication: "These are historical/archival records of completed work, not active enforcement documentation. Per spec scope (removing assert_semantic from tests-v2 behavioral test framework + updating documentation), historical issue files are NOT in scope. Only active enforcement docs (TDD SKILL.md, verify.md, AGENTS.md) and live test scripts are in scope."

finding_9:
  summary: "tests-v2/behaviors/fixtures/issues/2230/plan.md references assert_semantic."
  evidence:
    - "fixture file line 221: 'Use assert_semantic for behavioral assertions (SC-1, SC-2)'."
  implication: "This fixture is a plan document used as test input data. It is fixture content, not active enforcement code. Optional doc update — should be evaluated in create phase whether to update fixture content. It does not affect test execution."

finding_10:
  summary: "behavior_run signature supports model/workdir/agent args; convert scripts preserve generation behavior."
  evidence:
    - "behavior_run() signature: scenario_name, message, model (default DEFAULT_TEST_MODEL), workdir, agent. Some call sites pass '' '' 'general' (e.g., 2219-sc10 passes 'general' agent)."
  implication: "When converting to artifact-only, preserve the existing behavior_run invocation arguments to avoid changing generation behavior. Only remove the assert_semantic call and the '# Evaluate with assert_semantic' comment."

## Conventions

conventions:
  - "Every behavior script begins with the mandatory cross-reference header: '#!/bin/bash / # Behavioral test: <name> / # See .opencode/tests-v2/AGENTS.md ... / # This script is an artifact-only generator — it does NOT evaluate model output.'"
  - "Scripts use `set -euo pipefail`, source helpers.sh via SCRIPT_DIR, define SCENARIO_NAME/SCENARIO_PROMPT, call behavior_run, then `exit 0`."
  - "Exit code 0 unconditionally signals 'artifacts produced', not test PASS."
  - "YAML is used for LLM-to-LLM data transfers (result contracts, artifacts)."
