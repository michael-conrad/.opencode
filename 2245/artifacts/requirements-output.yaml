    verified: "grep confirms assert_semantic() defined at helpers.sh line 653, no other defs."
    consumer: "SC for function removal; the function's inline opencode-run evaluation is the anti-pattern."
  - id: REQ-2
    description: "Remove all 12 assert_semantic call sites from behavior test scripts (convert each to artifact-only generator)."
    verified: "grep confirms 12 scripts call assert_semantic inline after behavior_run."
    scripts:
      - 2219-sc10
      - 2219-sc11
      - 2219-sc15
      - 2219-sc16
      - 2219-sc19
      - 2219-sc3
      - 2219-sc6
      - 2219-sc7
      - 2219-sc8
      - 2219-sc9
      - 2239-sc8
      - skill-deck-completeness
  - id: REQ-3
    description: "Replace inline opencode-run evaluation (assert_semantic's mechanism) with orchestrator-dispatched clean-room sub-agent evaluation."
    verified: "assert_semantic runs `opencode run` inline (helpers.sh ~700). AGENTS.md section 6a prescribes orchestrator-dispatched clean-room sub-agent reading session.yaml."
    consumer: "SCs for the evaluation mechanism."
  - id: REQ-4
    description: "Update active enforcement documentation to remove assert_semantic references and reflect the two-SC clean-room pattern."
    verified: "TDD SKILL.md (lines 209/213/223/374/378/422/429/436), verify.md (line 270), tests-v2/AGENTS.md reference assert_semantic."
    consumer: "SCs for doc updates."
  - id: REQ-5
    description: "Preserve behavior test generation behavior — conversion removes evaluation but keeps behavior_run invocation (including model/workdir/agent args)."
    verified: "Call sites pass varying args (some empty empty general)."
    consumer: "conversion SCs; regression constraint."
implicit_requirements:
  - id: REQ-6
    description: "Converted behavior scripts MUST retain the mandatory cross-reference header and exit 0 semantics (artifact-only generator paradigm)."
    verified: "AGENTS.md section 1 mandates header + exit 0; 2230-sc1 is the reference."
    consumer: "conversion SCs."
  - id: REQ-7
    description: "The evaluation sub-agent receives ONLY artifact dir path + SC criterion (+ github.owner/repo context) — no orchestrator reasoning or expected outcomes."
    verified: "AGENTS.md section 6a 'The evaluation sub-agent receives ONLY: The artifact directory path, The SC criterion text, github.owner, github.repo'."
    consumer: "clean-room evaluation SCs."
  - id: REQ-8
    description: "session.yaml (SQLite DB export) remains the PRIMARY evaluation evidence source; stdout.log/stderr.log are not primary."
    verified: "AGENTS.md sections 1 and 2."
    consumer: "clean-room evaluation SCs."
constraint_requirements:
  - id: REQ-9
    description: "Historical/archival .issues/ plan/spec/artifact files referencing assert_semantic are NOT in scope (completed-work records, not active enforcement)."
    verified: "Dozens of .issues/ files reference assert_semantic; modifying them is out of scope."
    consumer: "scope boundary."
  - id: REQ-10
    description: "Fixture content (e.g., tests-v2/behaviors/fixtures/issues/2230/plan.md line 221 referencing assert_semantic) is test input data. Optional update, non-blocking for test execution."
    verified: "Fixture file reference exists."
    consumer: "scope boundary decision."
  - id: REQ-11
    description: "Clean-room discipline — orchestrator MUST NOT inline the evaluation work; dispatch via task()."
    verified: "spec-creation-state research card; critical-rules-034/043."
    consumer: "evaluation SCs."
non_requirements:
  - "Removing other assertion helpers — none exist in helpers.sh besides assert_semantic."
  - "Rewriting the session-to-timeline tool or with-test-home harness."
  - "Changing behavior_run() generation logic or artifact directory structure."
  - "Modifying content-verification test framework (test-enforcement.sh) — it greps files, not assert_semantic."
  - "Editing historical .issues/ archival files."
verification: "Every REQ above was verified against the live codebase via grep of helpers.sh function defs, grep of assert_semantic call sites across tests-v2/behaviors/, reading assert_semantic definition (helpers.sh 653-706), reading AGENTS.md sections 1/2/6a, reading 2230-sc1-trunk-tip-dispatch.sh as the canonical target, and reading TDD SKILL.md / verify.md reference lines."
sc_mapping_preliminary:
