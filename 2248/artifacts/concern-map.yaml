## Concern Separation
- Each concern is a single, independently verifiable claim.
- ITEM-1, ITEM-2, ITEM-4 are distinct behavioral facets of the same underlying rule (no-outguess), but each maps to a separate SC with a separate verification domain and test scenario.
- ITEM-3 (documentation) is the foundational concern that the behavioral items verify against.
- No concern overlaps: SC-1 (test-time model usage), SC-2 (failure-path diagnostics), SC-4 (excuse fabrication) are three distinct behavioral facets; SC-3 is the textual mandate.

