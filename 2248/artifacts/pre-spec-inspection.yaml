- **§9 Change Control / Default Model (lines 501-513):** "The default test model is defined in `default-model.sh` as `DEFAULT_TEST_MODEL`. This is the single source of truth." Mandate #5 (Test Isolation Mandates, lines 394, 397): "**Default model MUST NOT be changed** without an approved spec. `DEFAULT_TEST_MODEL` in `default-model.sh` is the single source of truth. grep for model strings outside `default-model.sh` returns 0 matches."
