## Recurring Defect Evidence (from #2244 implementation)

The recurring defect pattern is documented by:
- Hand-selected model overrides in behavioral-evidence artifacts:
  - `tmp/behavioral-evidence-*GREEN-ollama-devstral-small-2-24b-384k/` (multiple dirs)
  - `tmp/behavioral-evidence-*GREEN-ollama-gemma4-31b-cloud/` (multiple dirs)
  - `tmp/behavioral-evidence-*GREEN-ollama-deepseek-v4-flash-cloud/` (multiple dirs)
- These are self-selected cloud/override models NOT equal to `DEFAULT_TEST_MODEL=ollama/qwen3.6:35b-256k`.
- Evidence: `tmp/sc3-run4.log` line 349 references a run against `ollama-devstral-small-2-24b-384k` during #2242 SC6 verification.
- Root cause: agent probed GPU VRAM via `ollama-probe hw`, concluded default model OOM, and hand-picked an override — then reached invalid PASS/FAIL from degenerate empty-response runs.

## Existing Controls (partial coverage)

| Existing Control | Covers |
|-----------------|--------|
| §10.4 model-excuse prohibition | Agent cannot CLAIM model unavailability. Does NOT prohibit agent from actively hand-selecting a model override. |
| Mandate #5 default-model-not-changed | Prevents changing `default-model.sh`. Does NOT prevent an agent from passing a different `DEFAULT_TEST_MODEL` env override during a run. |
| §11 prompt construction | Prevents prose-recall prompts. Unrelated to model selection. |

**Gap:** No rule explicitly states that the agent MUST NOT outguess model/GPU selection by probing hardware and hand-selecting an override. §10.4 only covers fabricated excuses (claiming unavailability); it does not cover the active-outguessing behavior (probing VRAM + substituting a model). This spec closes that gap.
