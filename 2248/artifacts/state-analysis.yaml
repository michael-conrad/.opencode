# State Analysis — No Model/GPU Outguessing (Issue .opencode#2246)
# Generated: 2026-08-05

## State Machine Transitions

### State: Behavioral test run (SC-1)
```
IDLE → RUN (agent uses DEFAULT_TEST_MODEL)
     → [FORBIDDEN] OUTGUESS (agent probes VRAM, substitutes model)
```

| From | To | Trigger | Valid? |
|------|----|---------|--------|
| RUN | Artifacts produced | agent runs with DEFAULT_TEST_MODEL | VALID |
| RUN | OUTGUESS | agent runs `ollama-probe hw` + sets model override | FORBIDDEN by this spec |

### State: Test failure/timeout (SC-2)
```
FAILURE/TIMEOUT → REMEDIATE (stale lock → bash timeout → stderr TEST_HOME → manual export → FAIL w/ evidence)
                → [FORBIDDEN] OUTGUESS-ON-FAIL (probe VRAM, diagnose "model too big", switch model)
```

| From | To | Trigger | Valid? |
|------|----|---------|--------|
| FAILURE | REMEDIATE | agent follows §10.1/10.2/10.3/10.5 | VALID |
| FAILURE | OUTGUESS-ON-FAIL | agent diagnoses VRAM, switches model | FORBIDDEN |

### State: Perceived model unavailability (SC-4)
```
UNAVAILABILITY → REMEDIATION-FIRST (§10.4 steps 1-5)
               → [FORBIDDEN] FABRICATE-EXCUSE
```

| From | To | Trigger | Valid? |
|------|----|---------|--------|
| UNAVAILABILITY | REMEDIATION-FIRST | agent runs §10.4 protocol | VALID |
| UNAVAILABILITY | FABRICATE-EXCUSE | agent claims model unavailable w/o evidence | FORBIDDEN |

## Phase Dependencies
- SC-3 (doc mandate) must be in place (state: DOCUMENTED) before behavioral SCs (SC-1/2/4) can pass GREEN — the agent must be able to read the mandate.
- DAG acyclic: DOCUMENTED → BEHAVIORAL-RUNS.
