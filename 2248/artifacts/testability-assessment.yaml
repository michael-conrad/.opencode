## Mixed-Test Plan
- SC-3: string/structural (grep).
- SC-1/2/4: behavioral (artifact generation + clean-room session.yaml evaluation).
- This is the "mixed" testability category — one structural SC + three behavioral SCs.

## Risk: Behavioral Prompt Engineering
The hardest part is constructing a real-domain prompt that:
1. Triggers natural model-selection/outguess behavior, AND
2. Is not a prose-recall interview (§11 hard-fail).

Mitigation: the #2244 implementation already produced evidence of the outguess behavior from real-domain prompts (SC6 cleanup-dispatch scenario). Reuse a similar real-domain scenario where the agent is expected to run a behavioral test and is tempted to outguess.

## Test Environment
All behavioral runs via `with-test-home` with bash-tool timeout >= 600000ms (Constraint C3/C4).
