code_path_inventory:
  issue: 2249
  nature: documentation/guidance change, not a code change
  consumption_paths:
    - id: PATH-1
      name: Guideline Load (Tier 1 instruction)
      steps:
        - Agent session starts; opencode.jsonc instructions array loads Tier 1 files, including 080-code-standards.md.
        - Agent reads the new DI section (generic principle + framework table + selection guidance + HTML/CSS exclusion).
        - Agent applies the DI mandate when writing code or unit tests in any supported language.
    - id: PATH-2
      name: INDEX.md Routing
      steps:
        - Agent encounters DI-related patterns (dependency injection, di, inject, container) in a task or codebase.
        - INDEX.md row for 080-code-standards.md routes the agent to the DI section.
        - Agent loads the section and applies the mandate.
    - id: PATH-3
      name: Behavioral Enforcement Test
      steps:
        - A behavioral test dispatches a real-domain prompt via opencode run.
        - The test produces session.yaml artifacts (SQLite DB export) recording agent tool calls and decisions.
        - A clean-room sub-agent evaluates session.yaml to confirm the agent applied the DI mandate.
  existing_code_paths_touched: none
  execution_paths_through_affected_code: not applicable — no runtime code is affected; the affected artifact is static markdown consumed by agents at session start and on-demand routing.
