concern_map:
  issue: 2249
  classification: single-concern, single-task spec
  concerns:
    - id: CONCERN-1
      name: Generic DI principle
      boundary: The enforceable rule is "use a DI approach," not "use framework X."
      affected_area: 080-code-standards.md new section
    - id: CONCERN-2
      name: Curated framework table
      boundary: Per-language guidance, explicitly advisory, three tiers (Clear standard, Contested, Non-idiomatic/guidance-only).
      affected_area: 080-code-standards.md new section
    - id: CONCERN-3
      name: Selection guidance
      boundary: Framework choice driven by code analysis + spec requirements, not a fixed pin; combinations allowed when warranted.
      affected_area: 080-code-standards.md new section
    - id: CONCERN-4
      name: HTML/CSS exclusion
      boundary: Explicitly excluded — not programming languages.
      affected_area: 080-code-standards.md new section
    - id: CONCERN-5
      name: Trigger routing
      boundary: DI-related patterns route agents to the section.
      affected_area: INDEX.md row update
    - id: CONCERN-6
      name: Behavioral enforcement — artifact generation
      boundary: Dispatch a real-domain prompt via opencode run producing session.yaml that records agent tool calls and decisions; the prompt requires designing a solution/unit test where a DI approach exists.
      affected_area: tests-v2/behaviors/ new test (artifact generation)
    - id: CONCERN-7
      name: Behavioral enforcement — clean-room evaluation
      boundary: A clean-room sub-agent evaluates the session.yaml artifact and confirms the agent applied the DI mandate (selected a DI approach rather than hand-rolling manual wiring), covering at least one Clear-standard and one Contested/Non-idiomatic language, plus the HTML/CSS exclusion.
      affected_area: tests-v2/behaviors/ new test (clean-room evaluation)
  concern_boundary_annotations:
    - No item crosses an architectural concern boundary. All items are within the single "agent-facing coding standards" concern.
    - The behavioral enforcement test decomposes into two distinct verification phases (artifact generation and clean-room evaluation). CONCERN-6 and CONCERN-7 are separate verification concerns — each phase addresses exactly one concern.
