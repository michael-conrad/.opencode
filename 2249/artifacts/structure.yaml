dependency_dag:
  edges:
    - from: phase_1
      to: phase_2
      rationale: "The framework table lives in the same new section; the section's generic principle must be documented first."
    - from: phase_1
      to: phase_3
      rationale: "Selection guidance references the generic principle in the same section."
    - from: phase_2
      to: phase_3
      rationale: "Selection guidance references the curated framework table."
    - from: phase_1
      to: phase_4
      rationale: "The HTML/CSS exclusion is part of the same new section."
    - from: phase_4
      to: phase_5
      rationale: "INDEX.md triggers route to a fully documented section (principle + table + guidance + exclusion)."
    - from: phase_5
      to: phase_6
      rationale: "The behavioral test verifies the fully-documented mandate; the test runs after the doc and routing exist."
    - from: phase_6
      to: phase_7
      rationale: "Clean-room evaluation reads the session.yaml artifact produced by SC-6."

triplet_colocation:
  status: VERIFIED
  notes: "All SC-1..7 have RED/GREEN/COMMIT steps assigned to a single phase (SC-1 -> phase_1, SC-2 -> phase_2, SC-3 -> phase_3, SC-4 -> phase_4, SC-5 -> phase_5, SC-6 -> phase_6, SC-7 -> phase_7). No split triplets."

cross_phase_dependency:
  status: VERIFIED
  notes: "No RED test in phase X depends on SC output committed in phase Y where Y > X. The dependency chain is strictly forward (phase_1 -> phase_2/3/4 -> phase_5 -> phase_6 -> phase_7); each phase's RED depends only on output committed within the same or an earlier phase. No forward RED dependency."

