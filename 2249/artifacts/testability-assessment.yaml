testability_assessment:
  issue: 2249
  existing_coverage: none for guideline content; the relevant test surface is the behavioral enforcement test framework in .opencode/tests-v2/.
  behavioral_test_requirement:
    - Per 080-code-standards.md §Enforcement Test Mandate and critical-rules-BEH-EV, this change affects runtime behavior (how agents write code and unit tests across languages). Therefore SCs MUST declare behavioral evidence type.
    - A behavioral enforcement test SHALL be added to verify agents follow the DI mandate.
    - The test MUST run via opencode run against real AI models in clean-room isolation (with-test-home) — NOT grep/static analysis.
    - RED phase: agent does NOT follow the new rule. GREEN phase: agent DOES follow it.
    - Evaluation uses session.yaml (SQLite DB export) as PRIMARY evidence source via clean-room sub-agent inspection.
  test_strategy:
    - phase: guideline content (SC-1..SC-5)
      strategy: behavioral for SC-1..SC-4 (runtime-behavioral change), structural for SC-5 (INDEX.md row)
    - phase: behavioral enforcement (SC-6, SC-7)
      strategy: two-SC pattern — SC-6 artifact generation (opencode run → session.yaml), SC-7 clean-room evaluation of session.yaml
  test_design_notes:
    - Prompt should require the agent to design a solution/unit test where a DI approach exists, and verify the agent selects a DI approach rather than hand-rolling manual wiring.
    - The test should cover at least one "Clear standard" language (e.g., Python) and one "Contested"/"Non-idiomatic" language to verify the tiered guidance is applied correctly.
    - HTML/CSS exclusion should be verified: agent must NOT attempt DI on markup/styling.
  verdict: required — behavioral testability is the primary verification mechanism for this spec.
