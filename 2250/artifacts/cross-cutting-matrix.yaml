      description: >
        Audit dispatch contracts carry exactly {spec_local_dir, artifact_evidence_dir} and no
        audit_phase. F12 aligns TDT (plan_local_dir -> spec_local_dir); F19 removes audit_phase.
      scs: [SC-12, SC-19]
