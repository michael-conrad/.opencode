decompose_output:
  spec_title: "Plan Writer and Plan Audit Skill Card Internal-Consistency Audit Remediation"
  issue_number: "TBD (claimed by create task)"
  decomposition_date: "2026-08-05"
  decomposition_model: >
    One SC per audit finding (F1-F19), each mapping to exactly one RED/GREEN/verify/commit cycle.
    Findings grouped into 3 phases by concern domain. Phase dependency graph is acyclic.
    Grouping rationale: phase 1 (audit card consistency) must land before phase 2 (plan-writer
    consistency) because audit tasks consume plan-structure-standards.md reference paths; phase 3
    (plan CLI card) is independent of both.

  phase_structure:
    phase_1:
      name: "Audit skill card consistency (cross-validate removal, role-file refs, single-plan model)"
      scope: "skills/audit/SKILL.md, skills/audit/tasks/*, reference/holistic-dimensions.yaml, skills/git-workflow-cleanup/tasks/cleanup/branch-cleanup.md"
      scs: [SC-1, SC-4, SC-5, SC-9, SC-10, SC-12, SC-13, SC-19, SC-2]
    phase_2:
      name: "Plan writer (writing-plans) consistency (task count, contracts, reference paths, completion)"
      scope: "skills/writing-plans/SKILL.md, skills/writing-plans/tasks/*, skills/writing-plans/contracts/*, reference/plan-structure-standards.md"
      scs: [SC-3, SC-6, SC-7, SC-8, SC-11, SC-16, SC-17]
    phase_3:
      name: "Plan CLI card consistency (discover task, description cleanup)"
      scope: "skills/plan/SKILL.md, skills/plan/tasks/discover.md"
      scs: [SC-14, SC-15, SC-18]

  success_criteria:
    - sc_id: SC-1
      finding: F1
      phase: 1
      summary: "DELETE all cross-validate references from audit/SKILL.md (TDT line 79/102, Tasks table, Mandatory Task Discipline item 5 line 32)"
      evidence_type: behavioral
      verification: "grep audit/SKILL.md for cross-validate returns zero matches; behavior test dispatches a plan-fidelity audit and confirms no cross-validate dispatch, Arbiter performs consensus"
      files: [skills/audit/SKILL.md]

    - sc_id: SC-2
      finding: F2
      phase: 1
      summary: "DELETE stale 'Main task file' / 'Evaluator role' cross-reference lines pointing to deleted monolithic files (tasks/plan-fidelity.md, tasks/spec-audit.md, tasks/verification-audit.md, tasks/test-quality-audit.md) across 9 audit role files"
      evidence_type: string
      verification: "grep audit/tasks/ for 'tasks/plan-fidelity.md', 'tasks/spec-audit.md', 'tasks/verification-audit.md', 'tasks/test-quality-audit.md' returns zero matches"
      files:
        - skills/audit/tasks/plan-fidelity-arbiter.md
        - skills/audit/tasks/plan-fidelity-evaluator.md
        - skills/audit/tasks/plan-fidelity-validator.md
        - skills/audit/tasks/plan-fidelity-investigator.md
        - skills/audit/tasks/spec-audit-investigator.md
        - skills/audit/tasks/spec-audit-validator.md
        - skills/audit/tasks/verification-audit-investigator.md
        - skills/audit/tasks/verification-audit-validator.md
        - skills/audit/tasks/test-quality-audit-arbiter.md

    - sc_id: SC-3
      finding: F3
      phase: 2
      summary: "Fix broken Read [..](reference/...) paths in writing-plans/tasks/create.md lines 40,42,62,63 to .opencode/reference/..."
      evidence_type: string
      verification: "grep create.md for 'Read [.*](reference/' returns only .opencode/reference/ targets that resolve to existing files"
      files: [skills/writing-plans/tasks/create.md]

    - sc_id: SC-4
      finding: F4
      phase: 1
      summary: "Fix broken Read [..](reference/...) paths in audit role files (plan-fidelity-investigator, plan-fidelity-evaluator, spec-audit-investigator, spec-audit-evaluator) to .opencode/reference/..."
      evidence_type: string
      verification: "grep audit/tasks/{plan-fidelity,spec-audit}-{investigator,evaluator}.md for 'Read [.*](reference/' returns only .opencode/reference/ targets that resolve to existing files"
      files:
        - skills/audit/tasks/plan-fidelity-investigator.md
        - skills/audit/tasks/plan-fidelity-evaluator.md
        - skills/audit/tasks/spec-audit-investigator.md
        - skills/audit/tasks/spec-audit-evaluator.md

    - sc_id: SC-5
      finding: F5
      phase: 1
      summary: "Soften audit/SKILL.md Mandatory Task Discipline item 5 hard artifact requirements to conditional 'if provided, collect evidence' form (matching coherence-maintenance-investigator pattern)"
      evidence_type: string
      verification: "Read audit/SKILL.md item 5; assert no hard 'requires X artifact' mandate remains, uses conditional evidence-collection language"
      files: [skills/audit/SKILL.md]

    - sc_id: SC-6
      finding: F6
      phase: 2
      summary: "Fix writing-plans/tasks/research.md step 12 plan invocation from --contract-path/--output to --problem + stdout redirect"
      evidence_type: string
      verification: "Read research.md step 12; assert it matches canonical form './.opencode/tools/plan plan --problem <path> > plan-output.yaml'"
      files: [skills/writing-plans/tasks/research.md]

    - sc_id: SC-7
      finding: F7
      phase: 2
      summary: "Change writing-plans/SKILL.md line 13 '7 task files' to '9 task files'"
      evidence_type: string
      verification: "Read writing-plans/SKILL.md line 13; assert '9 task files' and File Structure lists 9 task files"
      files: [skills/writing-plans/SKILL.md]

    - sc_id: SC-8
      finding: F8
      phase: 2
      summary: "Add contracts for handoff, research, verify-plan-pipeline; remove orphan self-review and structure contracts (keep solve-output.yaml)"
      evidence_type: string
      verification: "glob writing-plans/contracts/; assert handoff-*, research-*, verify-plan-pipeline-* present; self-review-*, structure-* absent; solve-output.yaml present"
      files:
        - skills/writing-plans/contracts/handoff-input.yaml
        - skills/writing-plans/contracts/handoff-output.yaml
        - skills/writing-plans/contracts/research-input.yaml
        - skills/writing-plans/contracts/research-output.yaml
        - skills/writing-plans/contracts/verify-plan-pipeline-input.yaml
        - skills/writing-plans/contracts/verify-plan-pipeline-output.yaml
        - skills/writing-plans/contracts/self-review-input.yaml
        - skills/writing-plans/contracts/self-review-output.yaml
        - skills/writing-plans/contracts/structure-input.yaml
        - skills/writing-plans/contracts/structure-output.yaml

    - sc_id: SC-9
      finding: F9
      phase: 1
      summary: "Fix reference/holistic-dimensions.yaml lines 98-114 to point to role files (spec-audit-investigator.md, plan-fidelity-investigator.md) and remove 'Step 0 pre-flight gate' section refs"
      evidence_type: string
      verification: "Read holistic-dimensions.yaml lines 98-114; assert no ref to deleted monolithic files and no 'Step 0 pre-flight gate' refs; role-file paths resolve to existing files"
      files: [reference/holistic-dimensions.yaml]

    - sc_id: SC-10
      finding: F10
      phase: 1
      summary: "Align plan-fidelity-investigator.md line 98 example naming from plan-phase-1.md to plan-01-{slug}.md"
      evidence_type: string
      verification: "grep plan-fidelity-investigator.md for 'plan-phase-'; assert no match; assert 'plan-01-' used"
      files: [skills/audit/tasks/plan-fidelity-investigator.md]

    - sc_id: SC-11
      finding: F11
      phase: 2
      summary: "Align writing-plans/tasks/completion.md Purpose (line 5) and Exit Criteria (line 42) from 'issue body' to 'plan file at plan.md'"
      evidence_type: string
      verification: "Read completion.md lines 5, 42; assert both reference 'plan file at plan.md' not 'issue body'"
      files: [skills/writing-plans/tasks/completion.md]

    - sc_id: SC-12
      finding: F12
      phase: 1
      summary: "Change audit/SKILL.md TDT line 71 plan-fidelity context from plan_local_dir to spec_local_dir"
      evidence_type: string
      verification: "grep audit/SKILL.md for 'plan_local_dir'; assert zero matches; assert plan-fidelity TDT uses spec_local_dir"
      files: [skills/audit/SKILL.md]

    - sc_id: SC-13
      finding: F13
      phase: 1
      summary: "Rewrite plan-fidelity-evaluator.md dual-plan 'clean-room vs existing' model (PF-1, PLAN_INCOMPLETE/PLAN_OVERSCOPED/PLAN_DRIFT, 'Add phase from clean-room') to single-plan (plan-vs-spec) model"
      evidence_type: behavioral
      verification: "grep plan-fidelity-evaluator.md for clean-room/PLAN_INCOMPLETE/PLAN_OVERSCOPED/PLAN_DRIFT; assert zero matches; behavior test runs plan-fidelity audit on single plan and produces correct verdict"
      files: [skills/audit/tasks/plan-fidelity-evaluator.md]

    - sc_id: SC-14
      finding: F14
      phase: 3
      summary: "DELETE duplicated clause in skills/plan/SKILL.md line 3 description"
      evidence_type: string
      verification: "Read plan/SKILL.md line 3; assert single 'writing-plans' clause, no duplication"
      files: [skills/plan/SKILL.md]

    - sc_id: SC-15
      finding: F15
      phase: 3
      summary: "DELETE skills/plan/SKILL.md line 120 reference to nonexistent executing-plans skill"
      evidence_type: string
      verification: "grep plan/SKILL.md for 'executing-plans'; assert zero matches"
      files: [skills/plan/SKILL.md]

    - sc_id: SC-16
      finding: F16
      phase: 2
      summary: "Deprecate writing-plans/reference/plan-artifact-format.md: remove from SKILL.md file listing (line 88), reduce file to pointer or delete; reference/plan-structure-standards.md (plan_schema_version: int 1) remains single source"
      evidence_type: string
      verification: "Read writing-plans/SKILL.md File Structure; assert plan-artifact-format.md absent; assert plan-artifact-format.md is deleted or reduced to a pointer to reference/plan-structure-standards.md"
      files:
        - skills/writing-plans/SKILL.md
        - skills/writing-plans/reference/plan-artifact-format.md

    - sc_id: SC-17
      finding: F17
      phase: 2
      summary: "Update writing-plans/tasks/verify-plan-pipeline.md line 25 audit output naming from 'audit-fidelity and audit-concern' to 'plan-fidelity and concern-separation'"
      evidence_type: string
      verification: "grep verify-plan-pipeline.md for 'audit-fidelity' and 'audit-concern'; assert zero matches; assert 'plan-fidelity' and 'concern-separation' used"
      files: [skills/writing-plans/tasks/verify-plan-pipeline.md]

    - sc_id: SC-18
      finding: F18
      phase: 3
      summary: "ADD skills/plan/tasks/discover.md task documenting the discover subcommand; reference it in plan/SKILL.md"
      evidence_type: string
      verification: "file-exists skills/plan/tasks/discover.md; read it and assert it documents the discover subcommand; plan/SKILL.md File Structure lists discover.md"
      files:
        - skills/plan/tasks/discover.md
        - skills/plan/SKILL.md

    - sc_id: SC-19
      finding: F19
      phase: 1
      summary: "Rewrite git-workflow-cleanup/tasks/cleanup/branch-cleanup.md audit block to dispatch closure-verification DiMo chain (Investigator->Validator->Evaluator->Arbiter) with standard 2-field contract {spec_local_dir, artifact_evidence_dir}; remove resolve-models, audit_phase: post_merge, and separate cross-validate dispatch"
      evidence_type: behavioral
      verification: "grep branch-cleanup.md for 'resolve-models', 'audit_phase', 'cross-validate'; assert zero matches; assert closure-verification DiMo chain with 2-field contract; behavior test verifies post-merge closure audit dispatches correct chain"
      files: [skills/git-workflow-cleanup/tasks/cleanup/branch-cleanup.md]

  atomicity_check:
    - "SC-1 -> SC-19 each maps to exactly one RED/GREEN/COMMIT cycle (one finding each)"
    - "No SC spans multiple findings; no finding spans multiple SCs"

  dependency_graph:
    edges:
      - from: SC-3
        to: SC-4
        reason: "Both fix reference paths; SC-4 (audit) depends on canonical reference/plan-structure-standards.md path correctness established by SC-3 (create.md) adoption"
      - from: SC-9
        to: SC-4
        reason: "holistic-dimensions.yaml and audit role files both reference plan-fidelity/spec-audit role files"
      - from: SC-16
        to: SC-3
        reason: "Canonical schema single-source decision (SC-16) underpins the reference paths SC-3/SC-4 rely on"
      - from: SC-18
        to: SC-14
        reason: "plan/SKILL.md description cleanup and discover task addition both modify plan/SKILL.md"
    acyclic: true

  single_concern_check:
    - "SC-1, SC-5, SC-12 (audit/SKILL.md) are separate SCs but each is a distinct concern (cross-validate removal vs artifact-mandate softening vs TDT field rename) — not batched"
    - "Each SC targets one file category (skill card, task file, reference doc, contract) and one verification domain"
