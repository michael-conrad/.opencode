# Pre-spec inspection — skill card set internal-consistency audit (issue 2250)

## Scope of inspection

Repo: .opencode submodule. Inspected skill card sets spec-creation, writing-plans, audit
plus consolidated .opencode/reference/ standards and approval-gate task deck.

## Affected files (skill cards and task cards)

| Path | Current state |
|------|---------------|
| skills/spec-creation/SKILL.md | Flat, Workflows-style. Pipeline: analyze -> create -> validate -> (revise->validate)* |
| skills/spec-creation/tasks/analyze.md | Writes to tmp/{N}/artifacts/ and tmp/{N}/contracts/ (mixed paths) |
| skills/spec-creation/tasks/create.md | references reference/spec-structure-standards.md, reference/cost-model-standards.md; writes sc-summary.yaml |
| skills/spec-creation/tasks/validate.md | references reference/spec-structure-standards.md; validates 11 dimensions |
| skills/spec-creation/tasks/revise.md | deletes .issues/{N}/artifacts/ |
| skills/spec-creation/reference/sc-table-columns.md | orphaned — no file references it |
| skills/writing-plans/SKILL.md | Flat, Workflows-style. 7 task files + contracts/ + reference/ |
| skills/writing-plans/tasks/handoff.md | references approval-gate --task verify-authorization (nonexistent task) |
| skills/writing-plans/tasks/create.md | references reference/plan-structure-standards.md, reference/cost-model-standards.md |
