## Confirmed defects

1. Broken relative reference/ paths (see code-path-inventory)
2. contracts/ vs artifacts/ path mismatch in spec-creation analyze.md (Steps 3-4 vs 5)
3. Orphaned sc-table-columns.md (no consumer)
4. Stale plan-artifact-format.md (only SKILL.md file-structure lists it; no task reads it)
5. Legacy audit SKILL.md not migrated to Workflows
6. Contract enum lacks FAIL; sub-agent contracts use summary: not finding_summary:
7. Stale task refs: approval-gate verify-authorization; sc-summary.yaml (divergent from analysis-summary.yaml)
8. Divergent plan/spec structure (spec Items/SC-table vs plan phase files; sc-summary vs analysis-summary)
