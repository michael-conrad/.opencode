    - "Do NOT alter plan_schema_version semantics in canonical reference/plan-structure-standards.md"
    - "Arbiter DiMo role is the authoritative consensus/judgment mechanism — no cross-validate task should be re-created"
    - "Deletions (cross-validate refs, stale Main task file refs, orphan contracts, plan-artifact-format.md) require spec + authorization per critical-rules-052"
    - "Each finding maps to at least one SC; no SC lobotomy permitted"

  non_requirements:
