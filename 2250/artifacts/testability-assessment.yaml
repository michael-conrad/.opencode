## Behavioral-test consideration

The skill-card-structure remediation changes agent-facing routing text. Per
critical-rules-BEH-EV, structural changes to routing text are structural in nature BUT where the
change alters agent dispatch behavior, behavioral evidence (opencode run against stderr) may be
required. Default SCs declared structural/string; any SC that changes a dispatch string that alters
runtime routing MUST be uplifted to behavioral per the classification gate.

## Feasibility

All items verifiable via grep/file-existence/structural cross-checks against the in-repo
skill deck and consolidated reference docs. No external test infra required. No synthetic data.
