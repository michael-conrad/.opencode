# Concern Map — Issue 2254: Remediate spec-creation and audit skill cards + reference standards
spec: .opencode/.issues/2254/spec.md
concern_groups:
  - id: concern-spec-creation-skill
    name: spec-creation SKILL.md format remediation
    phase: 1, 2
    scs: [SC-1, SC-2]
    description: Convert spec-creation/SKILL.md to canonical dispatch prompt format (no deprecated execute X from Y), remove Task Files table.
  - id: concern-spec-creation-tasks
    name: spec-creation task card behavior remediation
    phase: 3, 4, 5, 6
    scs: [SC-17, SC-18, SC-19, SC-20, SC-21]
    description: analyze BLOCKs on unbound issue number; validate loads 11 dimensions dynamically; create routes exec-summary body + forward-reference blockquote; post-push reconciliation sequencing.
  - id: concern-url-root-cause
    name: issues-data URL root-cause fix
    phase: 7
    scs: [SC-37]
    description: Correct the erroneous .issues/ path prefix in the issues-data blockquote URL template in issue-operations-core/tasks/creation.md Step 5; {{SPEC_PATH}} = N/.
  - id: concern-audit-skill
    name: audit SKILL.md structure remediation
    phase: 8, 9, 10
    scs: [SC-3, SC-4, SC-5, SC-6, SC-7]
    description: Single Workflows section with 4 DiMo steps; remove TDT/Invocation/Tasks sections; canonical dispatch format; no deprecated DiMo strings; canonical agent-intent description.
  - id: concern-audit-role-cards
    name: audit role-card repair
    phase: 11, 12, 13, 14
    scs: [SC-8, SC-9, SC-10, SC-12, SC-14]
    description: Repair role-card frontmatter names and Task headings; flatten subdirectory tasks; remove redundant evaluator; repoint cross-references including holistic-dimensions.yaml.
  - id: concern-reference-standards
    name: reference standards updates
    phase: 15, 16, 17
    scs: [SC-11, SC-15, SC-16]
    description: Update stale reference-doc task names; consolidate evidence-type taxonomy citations to single canonical reference; missing evidence-type is hard FAIL.
  - id: concern-completion-revise
    name: completion routing and revise exec-summary
    phase: 18, 19
    scs: [SC-13, SC-22]
    description: Correct completion task routing; revise regenerates exec-summary remote issue body.
  - id: concern-format
    name: numbered-checkbox format + clean-room unit + dispatch-contract
    phase: 20, 21, 22, 23
    scs: [SC-23, SC-24, SC-25, SC-26, SC-27, SC-35, SC-36]
    description: Convert Workflows and task-card Procedures to numbered-checkbox lists with execution-mode sub-bullets; split fat task cards for clean-room unit; verify dispatch-contract completeness; update the two reference docs that define the format.
  - id: concern-linter
    name: skildeck linter enforcement
    phase: 24
    scs: [SC-28]
    description: Extend skildeck linter to enforce numbered-checkbox workflow format, execution-mode sub-bullet, task-card clean-room unit, dispatch-contract completeness, markdown link correctness.
  - id: concern-links
    name: markdown link correctness
    phase: 25
    scs: [SC-29a, SC-29b, SC-29c]
    description: All markdown links in the two skills, reference docs, and issue-operations-core/tasks/creation.md resolve to real targets, use correct relative paths, and follow the Read [Text](path) pattern.
  - id: concern-workflow-clarity
    name: workflow clarity
    phase: 26
    scs: [SC-31]
    description: Workflows clearly indicate orchestrator step-by-step execution with explicit execution-mode sub-bullets.
  - id: concern-functional
    name: functional end-to-end behavioral tests
    phase: 27, 28, 29
    scs: [SC-32, SC-33, SC-34]
    description: Run remediated spec-creation pipeline and audit DiMo 4-role chain end-to-end against a fixture in a shared test home with test gitbucket instance.
