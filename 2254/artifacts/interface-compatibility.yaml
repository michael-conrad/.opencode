# Interface Compatibility — Issue 2254: Remediate spec-creation and audit skill cards + reference standards
spec: .opencode/.issues/2254/spec.md
interface_boundaries:
  - boundary: spec-creation-SKILL-md-to-task-cards
    file: .opencode/skills/spec-creation/SKILL.md ↔ .opencode/skills/spec-creation/tasks/
    status: COMPATIBLE
    notes: SKILL.md Workflows dispatch each task card via canonical prompt format. SC-27 requires the workflow Context sub-bullet to supply every parameter in each task card's Dispatch Contract and Entry Criteria. SC-1/SC-23/SC-25/SC-26 require consistent dispatch format and numbered-checkbox format across both.
  - boundary: audit-SKILL-md-to-role-cards
    file: .opencode/skills/audit/SKILL.md ↔ .opencode/skills/audit/tasks/
    status: COMPATIBLE
    notes: audit SKILL.md single Workflows section with 4 DiMo steps dispatches each role-split task card. SC-8/SC-9 require frontmatter name and Task heading match filename; SC-10 requires cross-references point to role-split files; SC-27 requires dispatch-contract completeness.
  - boundary: skill-cards-to-reference-standards
    file: .opencode/skills/{spec-creation,audit}/SKILL.md ↔ .opencode/reference/
    status: CONSTRAINED
    notes: SC-35 and SC-36 require reference/skill-card-description-standards.md §7 and task-card-structure-standards.md to define the numbered-checkbox format BEFORE the skill cards (SC-23/24/25) and linter (SC-28) conform — a dependency prerequisite. SC-15 requires taxonomy citations point at the single canonical reference doc.
  - boundary: validate-to-holistic-dimensions
    file: .opencode/skills/spec-creation/tasks/validate.md ↔ .opencode/reference/holistic-dimensions.yaml
    status: CONSTRAINED
    notes: SC-18 requires validate.md load the 11 holistic dimensions dynamically from reference/holistic-dimensions.yaml rather than a hardcoded divergent list. SC-10 also requires holistic-dimensions.yaml cross-references be repointed to role-split files.
  - boundary: create-to-issue-operations-core
    file: .opencode/skills/spec-creation/tasks/create.md ↔ .opencode/skills/issue-operations-core/tasks/creation.md
    status: CONSTRAINED
    notes: SC-19 requires create.md route the remote issue body to the canonical exec-summary format defined in issue-operations-core/tasks/creation.md Step 5. SC-37 corrects the issues-data URL template in the same file. SC-20/SC-21 require the forward-reference blockquote and post-push reconciliation sequencing.
  - boundary: linter-to-format-rules
    file: .opencode/tools/impl/skildeck/ ↔ .opencode/reference/ + .opencode/skills/{spec-creation,audit}/
    status: CONSTRAINED
    notes: SC-28 requires the skildeck linter enforce the numbered-checkbox workflow format, execution-mode sub-bullet, task-card clean-room unit, dispatch-contract completeness, and markdown link correctness — all defined in the reference docs and skill cards.
  - boundary: behavioral-tests-to-shared-test-home
    file: behavioral test suite ↔ with-test-home infrastructure + test gitbucket instance
    status: CONSTRAINED
    notes: SC-32/SC-33/SC-34 require the functional end-to-end tests to run in a shared test home with a test project and test gitbucket instance, sequenced incrementally so later tests reuse earlier state.
compatibility_conclusions:
  - All affected files are agent-facing markdown in .opencode/ plus the skildeck linter; no application src/ runtime code changes.
  - The primary compatibility constraints are: (1) reference docs must define the numbered-checkbox format before skill cards and linter conform (SC-35/SC-36 dependency prerequisite); (2) create.md's exec-summary routing depends on the issue-operations-core creation.md Step 5 URL template that SC-37 corrects; (3) validate.md must load dimensions dynamically from holistic-dimensions.yaml.
  - The functional end-to-end tests (SC-32/33/34) depend on the shared with-test-home + gitbucket infrastructure.

