body: '> **Full spec and artifacts: [`.opencode/.issues/2254/`](https://github.com/michael-conrad/.opencode/tree/issues-data/.issues/2254/)**
  — this issue is a condensed exec summary; the authoritative spec lives in the `issues-data`
  branch.

  >

  > **Local artifacts:** `.opencode/.issues/2254/` — implementation plan, card catalogue,
  dependency contracts, research, designs, audit findings


  ## 1. Intent and Executive Summary


  ### Problem Statement


  A history-grounded read-only audit of the spec-writer and spec-audit skill card
  sets (`spec-creation`, `audit`) and the consolidated reference standards (`.opencode/reference/`)
  identified internal-consistency drifts between what each card declares (dispatch
  format, structural sections, role naming, task references, evidence-type taxonomy
  source, validation criteria) and the actual on-disk reality. These drifts cause
  agents to dispatch tasks using a deprecated prompt format the reference docs forbid,
  resolve cross-references to non-existent task files, read the evidence-type taxonomy
  from a redirect source instead of the canonical one, evaluate a spec against a different
  11-dimension set than the auditor uses, and route to tasks whose cards do not exist.


  ### Root Cause / Motivation


  Both skill sets retain content from before several migrations: the flat-architecture
  refactor, the DiMo 4-role audit dispatch, the Workflows-section format, and the
  consolidated `.opencode/reference/` location. Because agent-facing text is consumed
  as routing instructions, each drift is a defect vector — an agent that follows a
  deprecated dispatch string, a dangling cross-reference, or a divergent dimension
  list produces defective work that must be re-done. The drifts must be resolved now
  because they compound: every spec created or audited through the drifted cards inherits
  the defect.


  ### Approach Chosen


  Apply exactly ONE prescriptive resolution per finding, each mapped one-to-one to
  a success criterion. Consolidate the evidence-type taxonomy into one canonical reference
  document and make both the spec-creation validate task and the audit skill load
  it dynamically. Convert the audit SKILL.md from Trigger Dispatch Table + Invocation
  + Tasks table to a Workflows section with 4 DiMo steps. Remove the redundant Task
  Files table from spec-creation. Repair role-card frontmatter name fields to match
  filenames. Repoint broken cross-references to role-split files. Update stale reference-doc
  task names. Flatten three subdirectory audit tasks to flat role files and remove
  stub index files. Correct completion task routing and repoint the dangling approval-gate
  reference. Rewrite the audit description to canonical agent-intent format. Remove
  the redundant behavioral-sc-evaluator.md. Point taxonomy citations at the canonical
  reference. Make a missing evidence-type declaration a hard FAIL.


  ### Alternatives Considered & Why Discarded


  - **Leave the drifts in place and rely on agent judgment to route correctly.** Discarded:
  agent-facing text is consumed as routing instructions, not advisory prose. An agent
  cannot reliably compensate for a deprecated dispatch string or a dangling cross-reference;
  the drift is a guaranteed defect vector, not a cosmetic inconsistency.

  - **Introduce backwards-compatible dual paths (accept both old and new formats).**
  Discarded: the anti-bifurcation mandate forbids dual-format agent-facing instructions.
  A backwards-compat path leaves the deprecated format live, so agents continue to
  follow it and the defect persists.


  ### Key Design Decisions


  - **Single canonical evidence-type taxonomy** in one reference document, loaded
  dynamically by both spec-creation validate and audit. Tradeoff: a single source
  of truth requires all consumers to be updated in scope, but eliminates the redirect-source
  and divergent-list defects.

  - **Workflows-only structure** for audit SKILL.md. Tradeoff: converting TDT/Invocation/Tasks
  to a Workflows section changes the routing surface, but aligns with the canonical
  skill-card format and removes the deprecated dispatch strings.

  - **Missing evidence-type declaration is a hard FAIL** routed to the remediation
  workflow. Tradeoff: stricter validation may surface more spec defects, but eliminates
  the default-to-string escape hatch that masks missing declarations.


  ### User Intent / Original Prompt


  A history-grounded read-only audit of the spec-writer and spec-audit skill card
  sets and the consolidated reference standards, identifying internal-consistency
  drifts and prescribing one resolution per finding.


  ## 2. Not Included


  - **`src/` code changes** — All affected files are agent-facing markdown in `.opencode/`;
  no runtime code changes.

  - **Non-agent-facing documentation** — Changes confined to skill cards, task cards,
  and reference standards consumed by agents.

  - **Behavioral test suite changes beyond what the SCs require** — The single behavioral
  SC (issue anchoring) requires its own behavioral test; no other test-suite changes
  are in scope.


  ## 3. Success Criteria


  | ID | Criterion | Evidence Type | Verification Method |

  |----|-----------|---------------|---------------------|

  | SC-1 | spec-creation/SKILL.md SHALL use the canonical dispatch prompt format `Follow
  the instructions in [<skill>/tasks/<task>.md](...)` for all task() dispatches, with
  zero occurrences of the deprecated `execute X from Y` coded strings. | string |
  grep spec-creation/SKILL.md for absence of `execute .* from` and presence of canonical
  format |

  | SC-2 | spec-creation/SKILL.md SHALL NOT contain a `## Task Files` table. | string
  | grep spec-creation/SKILL.md for absence of `## Task Files` |

