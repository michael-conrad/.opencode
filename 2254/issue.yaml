  ## 9. Enforcement Gate


  > **Enforcement gate:** All success criteria MUST pass before this spec is considered
  complete. Partial implementation is not permitted.


  ## 10. Cost Frame


  Cost is measured in defect-discovery-latency, not tool calls. Correctness is the
  only metric.


  - SC-1: Verifying the dispatch format costs one grep search. Skipping means agents
  keep dispatching with a deprecated format the reference docs forbid, and every downstream
  task inherits the routing defect.

  - SC-2: Verifying the Task Files table removal costs one grep search. Skipping means
  the redundant table persists and duplicates the Workflows task references.

  - SC-3: Verifying the Workflows structure costs one grep search. Skipping means
  audit dispatches keep routing through the deprecated TDT/Invocation/Tasks surface.

  - SC-4: Verifying the audit dispatch format costs one grep search. Skipping means
  agents keep using deprecated DiMo dispatch strings.

  - SC-5: Verifying the description format costs one read. Skipping means the audit
  card keeps a deprecated description that misroutes skill selection.

  - SC-6: Verifying role-card names costs a per-file frontmatter check. Skipping means
  40 name-vs-filename mismatches persist (28 flat + 12 subdirectory) and break skill-card
  validation.

  - SC-7: Verifying cross-reference repoints costs one grep search. Skipping means
  agents resolve to non-existent monolithic task files.

  - SC-8: Verifying reference task names costs one grep search. Skipping means reference
  docs keep pointing at non-existent inspect/decompose/write/check/file tasks.

  - SC-9: Verifying the flattening costs a file-structure check. Skipping means subdirectory
  tasks and stub index files persist.

  - SC-10: Verifying completion routing costs one grep search. Skipping means completion
  routes to a dangling verify-authorization reference.

  - SC-11: Verifying the evaluator removal costs a file-absence check. Skipping means
  a redundant file with zero consumers persists.

  - SC-12: Verifying taxonomy citations costs one grep search. Skipping means validate
  and audit read the taxonomy from a redirect source instead of the canonical one.

  - SC-13: Verifying the missing-type rule costs one read. Skipping means a missing
  evidence-type declaration silently defaults to string and masks a defect.

  - SC-14: Running the behavioral test costs minutes of execution time. Skipping means
  the analyze task accepts an unbound issue number and produces a spec anchored to
  a placeholder — a defect that ships to the issues-data branch and costs 1000× more
  to fix.

  - SC-15: Verifying dynamic dimension loading costs one grep search. Skipping means
  validate evaluates a spec against a divergent 11-dimension set than the auditor
  uses.


  ## 11. Edge Cases


  - **Condition: A role-card filename does not match any of the four role names (Investigator/Validator/Evaluator/Arbiter).**
  Expected behavior: the name field is repaired to match the filename per SC-6. Resolution:
  the role-split file set is fixed; no new role names are introduced.

  - **Condition: A cross-reference target file is genuinely absent (not just renamed).**
  Expected behavior: the reference is repointed to the actual role-split file per
  SC-7. Resolution: each repoint is verified against actual on-disk task files during
  implementation.

  - **Condition: The canonical evidence-type taxonomy location changes after consolidation.**
  Expected behavior: both validate and audit load it dynamically per SC-12, so no
  hardcoded path breaks. Resolution: dynamic loading keeps consumers in sync.

  - **Condition: An analyze dispatch receives an unbound/placeholder issue number.**
  Expected behavior: the analyze task BLOCKs per SC-14. Resolution: the orchestrator
  must provide a bound issue number or create a remote stub first.

  - **Condition: A spec omits an evidence-type declaration.** Expected behavior: validation
  is a hard FAIL routed to the remediation workflow per SC-13. Resolution: the spec
  is revised to declare an evidence type; no default-to-string escape hatch.

  - **Condition: A downstream skill hardcodes the deprecated dispatch string.** Expected
  behavior: the deprecated format is removed outright per SC-1/SC-4 (anti-bifurcation).
  Resolution: downstream consumers are updated in scope; no backwards-compat path
  is retained.

  - **Condition: The behavioral SC-14 test cannot execute (model unavailable).** Expected
  behavior: the SC is reported FAIL per the functional/behavioral test substitution
  prohibition. Resolution: remediation-first protocol applies before any escalation.


