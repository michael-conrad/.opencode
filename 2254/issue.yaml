  format (no `Load via skill() when`, `Also load when`, `User phrases:` meta-instructions).
  | string | read audit/SKILL.md frontmatter and verify format |

  | SC-6 | Every audit role-card frontmatter `name:` field and `# Task:` heading SHALL
  match its filename (Investigator/Validator/Evaluator/Arbiter), with zero `-generator`/`-knowledge-supporter`/`-path-provider`
