body: '> **Full spec and artifacts: [`.opencode/.issues/2254/`](https://github.com/michael-conrad/.opencode/tree/issues-data/2254)**
  — this issue is a condensed exec summary; the authoritative spec lives in the `issues-data`
  branch.

  >

  > **Local artifacts:** `.opencode/.issues/2254/` — implementation plan, card catalogue,
  dependency contracts, research, designs, audit findings


  ## Problem


  A history-grounded read-only audit of the spec-writer (`spec-creation`) and spec-auditor
  (`audit`) skill card sets and the consolidated reference standards (`.opencode/reference/`)
  identified internal-consistency drifts between what each card declares (dispatch
  format, structural sections, role naming, task references, evidence-type taxonomy
  source, validation criteria) and the actual on-disk reality. A subsequent brainstorming
  session expanded the scope to a total remediation of both skills plus the reference
  standards, adding six new requirement areas: numbered-checkbox Workflows format
  with execution-mode sub-bullets, numbered-checkbox task-card Procedure format with
  fat-task-card splitting, dispatch-contract completeness, skildeck linter enforcement,
  markdown link verification, and workflow clarity. These drifts and format gaps cause
  agents to dispatch tasks with deprecated formats, resolve cross-references to non-existent
  files, read the taxonomy from a redirect source, evaluate against a divergent dimension
  set, and route to tasks whose cards do not exist — every spec created or audited
  through the drifted cards inherits the defect.


  A further revision adds mandatory functional end-to-end verification. The drift-repair
  and format SCs prove the remediated cards are well-formed on disk, but they do not
  prove the remediated skills actually work when dispatched. The goal is a working
  set of spec skills. New behavioral SCs run the remediated spec-creation pipeline
  and the audit DiMo 4-role chain end-to-end against a fixture in a shared test home
  with a test gitbucket instance, asserting correct output — no mis-routing, no missing
  task cards, no broken cross-references, no deprecated dispatch strings.


  A further revision adds the dependency prerequisite: the two reference docs that
  define these formats — skill-card-description-standards.md §7 (Workflows) and task-card-structure-standards.md
  (Procedure) — still define the OLD plain numbered-list format, so they must be updated
  to the new numbered-checkbox format (with the execution-mode indicator, the clean-room
  unit mandate, and the dispatch-contract completeness requirement) BEFORE the skill
  cards can conform and BEFORE the linter can enforce it.


  ## Scope


  **In scope:**


  - Repair all internal-consistency drifts in `spec-creation` and `audit` skill cards
  and the consolidated `.opencode/reference/` standards


  - Convert both main skill card Workflows sections to numbered checkbox lists with
  sub-bullets for prompt string, parameters/context, and execution-mode indicator


  - Convert task card Procedure sections to numbered checkbox lists; split fat task
  cards whose procedures would require internal sub-agent dispatch


  - Update the two reference docs that define these formats — skill-card-description-standards.md
  §7 (Workflows) and task-card-structure-standards.md (Procedure) — to the numbered-checkbox
  format with the execution-mode indicator, the clean-room unit mandate, and the dispatch-contract
  completeness requirement


  - Verify dispatch-contract completeness so every workflow Context sub-bullet supplies
  every parameter a task card needs


  - Extend the skildeck linter (`.opencode/tools/impl/skildeck/`) to enforce the new
  format rules


  - Verify all markdown links in the two skills and reference docs resolve to real
  targets with correct relative paths and `Read [Text](path)` wording


  - Make workflows explicitly orchestrator step-by-step with explicit inline-vs-dispatch
  decisions


  - Add functional behavioral SCs that run the remediated spec-creation pipeline and
  audit DiMo 4-role chain end-to-end against a fixture in a shared test home with
  a test gitbucket instance, proving the skills work


  **Out of scope:**


  - Application `src/` code changes (excluded; only agent-facing markdown and the
  skildeck linter are in scope)


  - Non-agent-facing documentation


  - Behavioral test suite changes beyond what the SCs require


  - Reformatting other skills'' Workflows/task-card formats


  ## Approach


  Apply exactly ONE prescriptive resolution per finding, each mapped one-to-one to
  a success criterion. Consolidate the evidence-type taxonomy into one canonical reference
  document loaded dynamically by both validate and audit. Convert the audit SKILL.md
  to a Workflows section with 4 DiMo steps. Remove the redundant Task Files table
  from spec-creation. Repair role-card frontmatter names and Task headings. Repoint
  broken cross-references. Update stale reference-doc task names. Flatten three subdirectory
  audit tasks. Correct completion routing. Rewrite the audit description. Remove the
  redundant behavioral-sc-evaluator.md. Make a missing evidence-type declaration a
  hard FAIL. For the expanded scope: convert both Workflows sections to numbered-checkbox
  format with execution-mode sub-bullets, convert task card Procedures to numbered-checkbox
  format and split fat task cards, update the two reference docs (skill-card-description-standards.md
  §7, task-card-structure-standards.md) to the new numbered-checkbox format with the
  execution-mode indicator, the clean-room unit mandate, and the dispatch-contract
  completeness requirement, verify dispatch-contract completeness, extend the skildeck
  linter to enforce the new format rules, verify markdown links, and make workflows
  explicitly orchestrator step-by-step. For the functional end-to-end scope: add behavioral
  SCs that run the remediated spec-creation pipeline (analyze → create → validate)
  and the audit DiMo 4-role chain (investigator → validator → evaluator → arbiter)
  end-to-end against a fixture in a shared test home with a test gitbucket instance,
  asserting correct output. Evidence types: linter changes and the functional end-to-end
  tests are behavioral; format checks (including the reference-doc updates SC-35,
  SC-36) are string; task-card clean-room and dispatch-contract completeness are semantic.


  ## Impact


  **Top risks:**


  - **Linter extension changes runtime behavior** — mitigated by behavioral evidence
  (opencode run against a violating fixture)


  - **Fat task cards remain unexecutable by sub-agents** — mitigated by the clean-room
  split (SC-26) and dispatch-contract completeness (SC-27)


  - **Format rules documented but not enforced** — mitigated by skildeck linter enforcement
  (SC-28)


  - **Reference docs keep defining the old format** — mitigated by SC-35/SC-36 updating
  skill-card-description-standards.md §7 and task-card-structure-standards.md to the
  new numbered-checkbox format before the skill cards and linter conform


  - **Remediated skills well-formed but not proven to work** — mitigated by functional
  end-to-end behavioral tests (SC-32, SC-33) running the spec-creation pipeline and
  audit DiMo chain against a fixture in a shared test home with a test gitbucket instance


  **Key dependencies:** `.opencode/reference/` consolidated standards (now remediation
  targets in scope for the format update), DiMo 4-role audit dispatch, skill-card-description-standards.md
  §7, task-card-structure-standards.md, the skildeck linter, and the `with-test-home`
  + GitBucket test infrastructure.


  **Call to action:** Review and approve the expanded spec for total remediation of
  the spec-writer and spec-auditor skills plus the consolidated reference standards,
  including the reference-doc format updates and functional end-to-end verification
  of the remediated skills.


