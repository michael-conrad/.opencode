  for absence of stale names and presence of actual names |

  | SC-9 | The three subdirectory audit tasks (closure-verification/, coherence-extraction/,
  spec-summary/) SHALL be flattened to flat role files and their stub index files
  (closure-verification.md, coherence-extraction.md, spec-summary.md) SHALL be removed.
  | string | verify the three subdirectories are flat files and stub files are absent
  |

  | SC-10 | audit/tasks/completion.md SHALL route to the actual 3-step verify-authorization
  workflow and SHALL NOT reference the dangling `approval-gate --task verify-authorization`.
  | string | grep audit/tasks/completion.md for correct routing and absence of dangling
  reference |

  | SC-11 | The redundant audit/tasks/behavioral-sc-evaluator.md SHALL be removed.
  | string | verify audit/tasks/behavioral-sc-evaluator.md is absent |

  | SC-12 | Evidence-type taxonomy citations in spec-creation validate and audit role
  cards SHALL point at the single canonical reference document, loaded dynamically.
  | string | grep spec-creation/tasks/validate.md and audit role cards for canonical
  reference citation |

  | SC-13 | A missing evidence-type declaration in reference/spec-structure-standards.md
  SHALL be a hard FAIL routed to the remediation workflow, not a default-to-string/warn/backwards-compat
  tier. | string | read reference/spec-structure-standards.md and verify missing-type
  rule is hard FAIL |

  | SC-14 | spec-creation/tasks/analyze.md SHALL BLOCK on an unbound/placeholder issue
  number and SHALL use remote-stub-first when a remote API is available. | behavioral
  | opencode run (with-test-home): dispatch analyze with unbound/placeholder issue_number
  and assert BLOCK |

  | SC-15 | spec-creation/tasks/validate.md SHALL load the 11 holistic dimensions
  dynamically from reference/holistic-dimensions.yaml rather than a hardcoded divergent
  list. | string | grep spec-creation/tasks/validate.md for dynamic load of reference/holistic-dimensions.yaml
  |


  ## 4. Requirements


  - R-1. The spec-creation and audit SKILL.md files SHALL use the canonical dispatch
  prompt format `Follow the instructions in [<skill>/tasks/<task>.md](...)` for all
  task() dispatches.

  - R-2. The audit SKILL.md SHALL convert the Trigger Dispatch Table, Invocation,
  and Tasks sections into a single Workflows section with 4 DiMo steps (Investigator,
  Validator, Evaluator, Arbiter).

  - R-3. The spec-creation SKILL.md SHALL remove the redundant Task Files table.

  - R-4. Audit role-card frontmatter `name:` fields SHALL match their filenames (Investigator/Validator/Evaluator/Arbiter).

  - R-5. Broken cross-references to non-existent monolithic role-task files SHALL
  be repointed to the actual role-split files.

  - R-6. Stale reference-doc task names (inspect/decompose/write/check/file) SHALL
  be updated to actual task names (analyze/create/validate/revise).

  - R-7. The three subdirectory audit tasks (closure-verification, coherence-extraction,
  spec-summary) SHALL be flattened to flat role files and their stub index files removed.

  - R-8. Completion task routing SHALL be corrected and the dangling approval-gate
  `--task verify-authorization` reference repointed to the actual 3-step verify-authorization
  workflow.

  - R-9. The audit SKILL.md description SHALL be rewritten to canonical agent-intent
  format.

  - R-10. The redundant behavioral-sc-evaluator.md SHALL be removed.

  - R-11. Evidence-type taxonomy citations SHALL point at the single canonical reference
  document, loaded dynamically by both validate and audit.

  - R-12. A missing evidence-type declaration SHALL be a hard FAIL routed to the remediation
  workflow, not a warn/default/backwards-compat tier.

  - R-13. The spec-creation analyze task SHALL BLOCK on an unbound/placeholder issue
  number and use remote-stub-first when a remote API is available.

  - R-14. The validate task SHALL load the 11 holistic dimensions dynamically from
  reference/holistic-dimensions.yaml rather than hardcoding a divergent list.

  - R-15. No `src/` code changes; all changes SHALL be confined to agent-facing skill/reference
  markdown files.

  - R-16. Behavioral SCs SHALL apply only where the change affects runtime dispatch
  behavior; string/structural elsewhere.

  - R-17. No bifurcated/backwards-compat paths SHALL be introduced in agent-facing
  instructions (anti-bifurcation mandate).


