body: '> **Full spec and artifacts: [`2254/`](https://github.com/michael-conrad/.opencode/tree/issues-data/2254)**
  — this issue is a condensed exec summary; the authoritative spec lives in the `issues-data`
  branch.

  >

  > **Local artifacts:** `.opencode/.issues/2254/` — implementation plan, card catalogue,
  dependency contracts, research, designs, audit findings


  ## Problem


  This spec was originally scoped as a total remediation of the spec-writer (`spec-creation`)
  and spec-auditor (`audit`) skill card sets plus the consolidated `.opencode/reference/`
  standards, addressing internal-consistency drifts, format gaps, linter enforcement,
  markdown-link correctness, and functional end-to-end verification. A spec-audit
  FAIL (5 of 11 holistic dimensions: Implementability, Internal Consistency, Testability,
  Provenance, Correctness) found that the spec''s stated current on-disk state contradicts
  the actual state. Re-verification during this revision confirms and extends the
  finding: **the drift-repair and format remediation described by the original SC
  set (SC-1..SC-18, SC-23..SC-31, SC-35..SC-37) is already complete on disk.** The
  defects those SCs claimed to fix do not exist — `audit/tasks/` has no subdirectories
  and all role-card `name:` fields already match filenames, there are no monolithic
  cross-references, the subdirectory tasks are already flat files, `behavioral-sc-evaluator.md`
  does not exist, the skill cards and reference docs already use the numbered-checkbox
  format with execution-mode sub-bullets, the skildeck linter already enforces the
  format rules, and the issues-data URL template is already corrected.


  The actual remaining remediation, re-grounded in the current on-disk state, is:
  (1) a residual format-conformance gap in `spec-creation/tasks/create.md`, whose
  Procedure sub-steps still use plain numbered lists instead of the canonical numbered-checkbox
  format; and (2) functional end-to-end verification proving the remediated skills
  actually work when dispatched — the drift-repair and format SCs prove the cards
  are well-formed on disk, but not that they work when run.


  ## Scope


  **In scope:**


  - Fix the residual format-conformance gap in `spec-creation/tasks/create.md` — convert
  the plain numbered lists in its Procedure sub-steps (Step 3, Step 3.1, Step 3.2,
  Step 6, Step 7) to the canonical numbered-checkbox format (SC-25)

  - Run the functional end-to-end spec-creation pipeline (analyze → create → validate)
  against a fixture in the shared test home with a test gitbucket instance, asserting
  correct output with no mis-routing, no missing task cards, no broken cross-references,
  and no deprecated dispatch strings (SC-32)

  - Run the functional end-to-end audit DiMo 4-role chain (investigator → validator
  → evaluator → arbiter) against a fixture spec in the shared test home, asserting
  a valid verdict with each role dispatching to the correct split task card with a
  complete dispatch contract (SC-33)

  - Ensure the spec-creation and audit behavioral tests share a common test home with
  a test project and test gitbucket instance, sequenced so later tests build upon
  the state created by earlier tests (SC-34)


  **Out of scope:**


  - The already-complete drift-repair and format remediation (SC-1..SC-18, SC-23,
  SC-24, SC-26..SC-31, SC-35..SC-37) — removed from the active SC set and recorded
  in the change-control history

  - Application `src/` code changes (excluded; only agent-facing markdown and the
  skildeck linter are in scope)

  - Non-agent-facing documentation

  - Behavioral test suite changes beyond what the SCs require


  ## Approach


  Re-ground the spec''s problem statement and success criteria in the verified on-disk
  state. Remove the already-satisfied drift-repair and format SCs (SC-1..SC-18, SC-23,
  SC-24, SC-26..SC-31, SC-35..SC-37) from the active SC set. Retain only the actual
  remaining remediation: SC-25 (residual `create.md` Procedure format gap, string
  evidence), SC-32..SC-33 (functional end-to-end verification, behavioral evidence),
  and SC-34 (shared test home with gitbucket instance, string evidence). Fix the traceability
  table''s phase numbering to match the 29-phase implementation plan and analytical
  artifacts (Phase 21 for SC-25, Phase 27/28/29 for SC-32/33/34). Apply exactly one
  prescriptive resolution per retained SC, each mapped one-to-one to a success criterion.


  ## Impact


  The spec now accurately reflects the actual on-disk state. The remaining work is
  precisely scoped to the residual `create.md` format gap and the functional proof
  that the remediated spec-creation and audit skills work when dispatched end-to-end
  — the difference between a working set of spec skills and a well-formed set of spec
  cards.

  '
