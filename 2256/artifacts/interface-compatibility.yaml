# Interface Compatibility — Issue 2256
# Checks interface boundaries between affected modules.
# R-20: tools/solve and tools/plan CLI interfaces MUST remain unchanged.

interface_boundaries:
  - boundary: "writing-plans/tasks/research.md -> tools/solve (model)"
    scs: [SC-4]
    status: "broken at backfill time"
    issue: "solve model invocation passes the literal `sat` instead of a valid Z3 boolean expression (--query True)."
    resolution: "Fix the --query argument to a valid Z3 boolean expression evaluating to a z3.BoolRef. Tool CLI unchanged (R-20)."
  - boundary: "writing-plans/tasks/research.md -> tools/solve (check)"
    scs: [SC-5]
    status: "broken at backfill time"
    issue: "solve check invocation passes the state-analysis.yaml analytical artifact instead of a real solve state file."
    resolution: "Bind --state-path to {issues_prefix}/{N}/artifacts/state.yaml. Tool CLI unchanged (R-20)."
  - boundary: "writing-plans/tasks/research.md -> tools/plan (plan)"
    scs: [SC-6]
    status: "broken at backfill time"
    issue: "plan plan invocation uses --contract-path/--output instead of the --problem flag."
    resolution: "Use --problem bound to {issues_prefix}/{N}/artifacts/plan-problem.yaml. Tool CLI unchanged (R-20)."
  - boundary: "writing-plans/tasks/research.md -> analytical artifacts"
    scs: [SC-7, SC-17]
    status: "inconsistent at backfill time"
    issue: "No BLOCK-on-incomplete-spec gate before Z3/planner invocation; sc-summary.yaml path does not match the post-#2254 spec-creation write path."
    resolution: "Add BLOCK gate (INCOMPLETE_SPEC) with diagnose-to-remediate-to-escalate; fix sc-summary.yaml path."
  - boundary: "plan/SKILL.md <-> solve/SKILL.md"
    scs: [SC-8, SC-9]
    status: "collision at backfill time"
    issue: "Descriptions share identical scope language, misrouting agent-intent dispatch; state/fallback ownership ambiguous."
    resolution: "Make descriptions mutually exclusive; state owned by plan, fallback owned by solve."
  - boundary: "audit/tasks/plan-fidelity-*.md -> plan artifact"
    scs: [SC-10a, SC-10b]
    status: "phantom basis at backfill time"
    issue: "Plan-fidelity evaluates against a phantom clean-room plan that is never generated; references non-existent plan-fidelity.md."
    resolution: "Adopt single-plan (plan-vs-spec) model; remove plan-fidelity.md reference."
  - boundary: "writing-plans/contracts/*-output.yaml <-> task result contracts"
    scs: [SC-14]
    status: "asymmetric at backfill time"
    issue: "Output contract templates lack blocker_reason, asymmetric with task result contracts."
    resolution: "Add blocker_reason to all 9 output contract templates."
  - boundary: "writing-plans/tasks/completion.md -> completion-core lifecycle manifest"
    scs: [SC-16a, SC-16b, SC-16c, SC-16d]
    status: "misdirected at backfill time"
    issue: "Lifecycle event written to issue body/plan file instead of the completion-core manifest; no chat exec summary."
    resolution: "Append to {project_root}/tmp/{issue-N}/lifecycle.yaml (metadata, append-only); report exec summary in chat; no plan.md/spec.md appends; no issue comments."
  - boundary: "writing-plans/tasks/handoff.md -> approval-gate tasks"
    scs: [SC-18]
    status: "dangling at backfill time"
    issue: "References non-existent verify-authorization approval-gate task."
    resolution: "Repoint to an existing approval-gate task (apply-label, resolve-scope, or route)."

interface_invariants:
  - "tools/solve and tools/plan CLI interfaces MUST remain unchanged (R-20)."
  - "No src/ code changes (R-19)."
  - "No new runtime features (R-21)."

dependency_contract:
  variables:
    phase_P0:
      type: bool
      description: "Analytical artifacts generation — SC-19"
    phase_P1:
      type: bool
      description: "Plan-structure authority consolidation — SC-1a, SC-1b, SC-1c, SC-2, SC-3"
    phase_P3:
      type: bool
      description: "Plan/solve scope and ownership — SC-8, SC-9"
    phase_P4:
      type: bool
      description: "Tool invocation remediation — SC-4, SC-5, SC-6, SC-7"
    phase_P5:
      type: bool
      description: "Plan-fidelity audit model — SC-10a, SC-10b"
    phase_P6:
      type: bool
      description: "Writing-plans internal consistency — SC-11, SC-12, SC-13, SC-14, SC-15, SC-16a, SC-16b, SC-16c, SC-16d, SC-17, SC-18"
  preconditions:
    - "z3.Implies(phase_P1, phase_P0)"
    - "z3.Implies(phase_P3, phase_P0)"
    - "z3.Implies(phase_P4, phase_P0)"
    - "z3.Implies(phase_P5, phase_P0)"
    - "z3.Implies(phase_P6, phase_P0)"
    - "z3.Implies(phase_P5, phase_P1)"
    - "z3.Implies(phase_P6, phase_P4)"
  invariants: []
  postconditions: []
  phases:
    phase_P0:
      files:
        - ".opencode/.issues/2256/artifacts/*"
      scs:
        - SC-19
    phase_P1:
      files:
        - ".opencode/reference/plan-structure-standards.md"
        - ".opencode/skills/writing-plans/reference/plan-artifact-format.md"
        - ".opencode/skills/writing-plans/SKILL.md"
        - ".opencode/skills/writing-plans/tasks/create.md"
      scs:
        - SC-1a
        - SC-1b
        - SC-1c
        - SC-2
        - SC-3
    phase_P3:
      files:
        - ".opencode/skills/plan/SKILL.md"
        - ".opencode/skills/solve/SKILL.md"
      scs:
        - SC-8
        - SC-9
    phase_P4:
      files:
        - ".opencode/skills/writing-plans/tasks/research.md"
      scs:
        - SC-4
        - SC-5
        - SC-6
        - SC-7
    phase_P5:
      files:
        - ".opencode/skills/audit/tasks/plan-fidelity-evaluator.md"
        - ".opencode/skills/audit/tasks/plan-fidelity-arbiter.md"
        - ".opencode/skills/audit/tasks/plan-fidelity-investigator.md"
        - ".opencode/skills/audit/tasks/plan-fidelity-validator.md"
      scs:
        - SC-10a
        - SC-10b
    phase_P6:
      files:
        - ".opencode/skills/writing-plans/SKILL.md"
        - ".opencode/skills/writing-plans/tasks/create.md"
        - ".opencode/skills/writing-plans/tasks/completion.md"
        - ".opencode/skills/writing-plans/tasks/handoff.md"
        - ".opencode/skills/writing-plans/tasks/research.md"
        - ".opencode/skills/writing-plans/contracts/*-output.yaml"
      scs:
        - SC-11
        - SC-12
        - SC-13
        - SC-14
        - SC-15
        - SC-16a
        - SC-16b
        - SC-16c
        - SC-16d
        - SC-17
        - SC-18
  edges:
    - from: phase_P0
      to: phase_P1
      rationale: "P0 (SC-19) generates the seven analytical artifacts retroactively so the artifact cross-reference check can run; P1's plan-structure authority consolidation is verified against that analytical baseline."
    - from: phase_P0
      to: phase_P3
      rationale: "P0 (SC-19) generates the analytical artifacts (including interface-compatibility) that document the plan/solve scope collision; P3's scope resolution is verified against that baseline."
    - from: phase_P0
      to: phase_P4
      rationale: "P0 (SC-19) generates the analytical artifacts (including interface-compatibility) that document the broken tool invocations; P4's remediation is verified against that baseline."
    - from: phase_P0
      to: phase_P5
      rationale: "P0 (SC-19) generates the analytical artifacts (including interface-compatibility) that document the phantom clean-room basis; P5's single-plan model is verified against that baseline."
    - from: phase_P0
      to: phase_P6
      rationale: "P0 (SC-19) generates the analytical artifacts (including interface-compatibility) that document the writing-plans internal inconsistencies; P6's fixes are verified against that baseline."
    - from: phase_P1
      to: phase_P5
      rationale: "P1 (SC-1b) establishes plan-structure-standards.md as the single canonical plan-structure authority; P5's plan-fidelity tasks (SC-10a/10b) read plan-structure-standards.md, so the single authority MUST be established before plan-fidelity evaluates against it."
    - from: phase_P4
      to: phase_P6
      rationale: "P4 (SC-4/5/6/7) and P6 (SC-17) both edit the cross-cutting file writing-plans/tasks/research.md; P6 SC-17 depends on P4's corrected tool invocations and BLOCK gate being in place before the sc-summary path fix is verified."
  notes:
    - "P4 and P6 both edit writing-plans/tasks/research.md (cross-cutting file). P4 fixes the tool invocations (SC-4/5/6) and adds the BLOCK gate (SC-7); P6 fixes the sc-summary.yaml path (SC-17). P6 MUST run after P4 to avoid conflicting edits to the same file and because SC-17's verification depends on the corrected invocations."
    - "P1 MUST complete before P5 because plan-fidelity (SC-10a/10b) reads plan-structure-standards.md as the single canonical authority; the split authority must be resolved first."
    - "P0 (SC-19) is foundational: all seven analytical artifacts must exist before the artifact cross-reference check can run, and every other phase's verification depends on that baseline."
