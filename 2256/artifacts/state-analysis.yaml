# State Analysis — Issue #2256 Plan Skill Card Remediation
# State machine transitions per phase.

phases:
  - phase: 1
    name: "P1 — Plan-Structure Authority Resolution"
    states:
      - from: "split_authority"
        to: "single_authority"
        trigger: "Reconcile plan-artifact-format.md into plan-structure-standards.md"
      - from: "single_authority_with_dispatch"
        to: "single_authority_no_dispatch"
        trigger: "Remove dispatch field from plan frontmatter"
      - from: "integer_schema_version"
        to: "string_schema_version"
        trigger: "String plan_schema_version"
  - phase: 2
    name: "P4 — Runtime-Broken Z3/Planner Invocations"
    states:
      - from: "broken_solve_model"
        to: "valid_solve_model"
        trigger: "Fix solve model --query invocation"
      - from: "broken_solve_check"
        to: "valid_solve_check"
        trigger: "Fix solve check --state-path invocation"
      - from: "broken_plan_plan"
        to: "valid_plan_plan"
        trigger: "Fix plan plan --problem invocation"
      - from: "no_block_gate"
        to: "block_gate_present"
        trigger: "Add BLOCK-on-incomplete-spec gate with diagnose→remediate→escalate"
  - phase: 3
    name: "P3 — Plan/Solve Scope Collision"
    states:
      - from: "colliding_scope"
        to: "distinct_scope"
        trigger: "Resolve plan/solve description scope collision"
      - from: "ambiguous_ownership"
        to: "clear_ownership"
        trigger: "Clarify state/fallback ownership between plan and solve"
  - phase: 4
    name: "P5 — Phantom Clean-Room Basis Removal"
    states:
      - from: "phantom_clean_room"
        to: "single_plan"
        trigger: "Remove phantom clean-room basis from plan-fidelity"
  - phase: 5
    name: "P6 — Writing-Plans Internal Inconsistencies"
    states:
      - from: "wrong_task_count"
        to: "correct_task_count"
        trigger: "Fix task count claim (7 → 9)"
      - from: "inconsistent_terminology"
        to: "consistent_terminology"
        trigger: "Fix per-item/per-task cycle terminology"
      - from: "yaml_in_body"
        to: "no_yaml_in_body"
        trigger: "Remove YAML code block from create.md body"
      - from: "asymmetric_contracts"
        to: "symmetric_contracts"
        trigger: "Add blocker_reason to output contract templates"
      - from: "unwired_verify_pipeline"
        to: "wired_verify_pipeline"
        trigger: "Wire verify-plan-pipeline into workflow"
      - from: "inconsistent_lifecycle_target"
        to: "consistent_lifecycle_target"
        trigger: "Fix completion lifecycle target"
      - from: "wrong_sc_summary_path"
        to: "correct_sc_summary_path"
        trigger: "Fix sc-summary.yaml path resolution"
      - from: "invalid_auth_gate"
        to: "valid_auth_gate"
        trigger: "Fix approval-gate verify-authorization reference"

state_invariants:
  - "plan-structure-standards.md remains the single authority after P1"
  - "research.md tool invocations match actual CLI after P4"
  - "plan and solve descriptions are mutually exclusive after P3"
  - "plan-fidelity uses single-plan model after P5"
  - "writing-plans files are internally consistent after P6"
