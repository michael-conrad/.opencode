title: '[SPEC] Plan skill card remediation: split canon, tool invocations, plan/solve
  scope, plan-fidelity basis, writing-plans consistency'
status: open
labels:
- approved-for-pr
body: '> **Full spec and artifacts: [`.opencode/.issues/2256/`](https://github.com/michael-conrad/.opencode/tree/issues-data/.issues/2256/)**
  — this issue is a condensed exec summary; the authoritative spec lives in the `issues-data`
  branch.

  >

  > **Local artifacts:** `.opencode/.issues/2256/` — implementation plan, card catalogue,
  dependency contracts, research, designs, audit findings


  ## 1. Intent and Executive Summary


  ### Problem Statement


  The plan skill card set (`plan`, `solve`, `writing-plans`, `audit` plan-fidelity
  roles) and the plan-structure reference documents carry six distinct defects that
  cause plan creation and plan-fidelity auditing to route, invoke, and evaluate incorrectly.
  The plan-structure authority is split between two reference documents that declare
  conflicting frontmatter. The `writing-plans` research step invokes the `solve` and
  `plan` tools with broken CLI arguments. The `plan` and `solve` skill descriptions
  share identical scope language that misroutes agent-intent dispatch. The plan-fidelity
  audit chain references a phantom clean-room plan that is never generated. And the
  `writing-plans` skill files contain internal inconsistencies (task count, cycle
  terminology, YAML blocks, contract symmetry, unwired task, lifecycle target, path
  resolution, auth gating) that compound across every plan produced.


  ### Root Cause / Motivation


  These defects are the residual of multiple migrations (flat-architecture refactor,
  skill/task split, reference consolidation, contract-template standardization) applied
  to the plan skill deck without a corresponding reconciliation pass. Because agent-facing
  text is consumed as routing instructions, each defect is a guaranteed defect vector:
  a split authority means consumers read a competing plan-artifact spec; a broken
  tool invocation fails at runtime during every plan-creation research step; a scope
  collision means agents misroute between `plan` and `solve`; a phantom clean-room
  basis makes plan-fidelity evaluate against a plan that does not exist; and writing-plans
  internal inconsistencies produce asymmetric contracts, dangling references, and
  an unwired task.


  ### Approach Chosen


  Apply exactly ONE prescriptive resolution per finding, each mapped one-to-one to
  a success criterion. P1 resolves the split plan-structure authority to `plan-structure-standards.md`
  as the single canonical authority, removes the `dispatch` field, and strings `plan_schema_version`.
  P4 fixes the three runtime-broken `solve`/`plan` tool invocations in the research
  step and adds a BLOCK-on-incomplete-spec gate with diagnose→remediate→escalate.
  P3 resolves the plan/solve description scope collision and clarifies state/fallback
  ownership. P5 removes the phantom clean-room basis and adopts a single-plan model
  in the plan-fidelity chain. P6 fixes the writing-plans internal inconsistencies
  (task count, cycle terminology, YAML blocks, contract symmetry, verify-plan-pipeline
  wiring, completion lifecycle, sc-summary path, auth gating).


  ### Alternatives Considered & Why Discarded


  - **Leave the defects in place and rely on agent judgment to route correctly.**
  Discarded: agent-facing text is consumed as routing instructions, not advisory prose.
  An agent cannot reliably compensate for a broken tool invocation, a competing authority,
  or a phantom comparison basis.

  - **Introduce backwards-compatible dual paths.** Discarded: the anti-bifurcation
  mandate forbids dual-format agent-facing instructions; a backwards-compat path leaves
  the defective path live.


  ### Key Design Decisions


  - **Single canonical plan-structure authority** in `plan-structure-standards.md`.
  Tradeoff: single source of truth requires updating all consumers in scope.

  - **`plan_schema_version` is a string type.** Tradeoff: aligns to the plan-artifact
  spec''s string form at the cost of a one-time type change.

  - **Plan and solve skill descriptions are mutually exclusive.** Tradeoff: removes
  misrouting at the cost of requiring precise dispatch.

  - **Plan-fidelity uses a single-plan model.** Tradeoff: aligns audit criteria with
  the actual plan at the cost of the never-functional clean-room cross-check.

  - **Output contract templates include `blocker_reason`.** Tradeoff: symmetry with
  task result contracts at the cost of updating every template.


  ### User Intent / Original Prompt


  The spec is the plan skill card remediation covering P1-P6 scope: resolve the split
  plan-structure canon, fix runtime-broken Z3/planner tool invocations, resolve the
  plan/solve scope collision, remove the phantom clean-room plan-fidelity basis, and
  fix writing-plans internal inconsistencies.


  ## 2. Not Included


  - **`src/` code changes** — All affected files are agent-facing markdown in `.opencode/`.

  - **`tools/solve` or `tools/plan` CLI changes** — Scope is task-file invocations,
  not tool interfaces.

  - **`unified-planning` or Z3 solver implementation changes** — No tool internals.

  - **`spec-creation` skill changes** — The sc-summary.yaml path issue is a writing-plans
  research.md issue.

  - **New runtime features** — This is a documentation/skill-card remediation spec.


  ## 3. Success Criteria


  > **Evidence-type taxonomy alignment (post-#2254):** #2256''s evidence-type usage
  (structural/behavioral) SHALL cite the same canonical evidence-type taxonomy reference
  that #2254 establishes (SC-15/16). Both specs use one taxonomy source — #2256 does
  not introduce a competing evidence-type vocabulary.

  >

  > **Behavioral uplift (post-audit):** SC-8/9/10a/10b/15/16a-16d/17/18 change agent-facing
  instructions that affect runtime agent behavior (dispatch routing, tool invocation,
  workflow execution). Per critical-rules-BEH-EV these are uplifted to behavioral
  evidence type with `opencode run` verification instead of file inspection.


  | ID | Criterion | Evidence Type | Verification Method |

  |----|-----------|---------------|---------------------|

  | SC-1a | `plan-artifact-format.md` SHALL be deleted (file absent from the codebase).
  | structural | file inspection |

  | SC-1b | `reference/plan-structure-standards.md` SHALL be the single canonical
  plan-structure authority, referenced by `writing-plans/tasks/create.md` and the
  plan-fidelity tasks. | structural | file inspection |

  | SC-1c | `writing-plans/SKILL.md` File Structure SHALL no longer list `plan-artifact-format.md`.
  | structural | file inspection |

  | SC-2 | The `dispatch: [<skill-names>]` field SHALL be removed from the plan frontmatter
  in `plan-structure-standards.md`. | structural | file inspection |

  | SC-3 | `plan_schema_version` SHALL be a string type in `plan-structure-standards.md`.
  | structural | file inspection |

  | SC-4 | The `solve model` invocation in `writing-plans/tasks/research.md` SHALL
  use a valid Z3 query expression, not `sat`. | behavioral | opencode run |

  | SC-5 | The `solve check` invocation in `writing-plans/tasks/research.md` SHALL
  use a real solve state file, not the `state-analysis.yaml` analytical artifact.
  | behavioral | opencode run |

  | SC-6 | The `plan plan` invocation in `writing-plans/tasks/research.md` SHALL use
  the `--problem` flag, not `--contract-path`/`--output`. | behavioral | opencode
  run |

  | SC-7 | `writing-plans/tasks/research.md` SHALL include a BLOCK-on-incomplete-spec
  gate with diagnose→remediate→escalate before Z3/planner invocation. | behavioral
  | opencode run |

  | SC-8 | `plan/SKILL.md` and `solve/SKILL.md` descriptions SHALL no longer share
  the scope language `validating workflow constraints, verifying state against contracts,
  proving theorems, or checking dependency ordering`. | behavioral | opencode run
  |

  | SC-9 | Each state/fallback task SHALL have a single owning skill between `plan`
  and `solve`. | behavioral | opencode run |

  | SC-10a | The plan-fidelity tasks (evaluator, arbiter, investigator, validator)
  SHALL use a single-plan evaluation model (plan-vs-spec), removing the phantom clean-room
  basis. **Note (post-#2254):** SC-10a/10b build on the post-#2254 role-card state
  (naming already repaired, cross-references already repointed by #2254 SC-8/9/10).
  #2256 does NOT duplicate #2254''s role-card work. | behavioral | opencode run |

  | SC-10b | The plan-fidelity tasks SHALL NOT reference the non-existent `plan-fidelity.md`
  main task file. **Note (post-#2254):** cross-references are already repointed by
  #2254 SC-8/9/10; #2256 only removes the residual `plan-fidelity.md` reference without
  redoing #2254''s role-card naming work. | behavioral | opencode run |

  | SC-11 | `writing-plans/SKILL.md` SHALL declare the correct task count (9, not
  7) matching the actual task files. | structural | file inspection |

  | SC-12 | `writing-plans` cycle terminology SHALL be consistent with `plan-structure-standards.md`
  and `091-incremental-build.md` (per-item TDD cycle). | structural | file inspection
  |

  | SC-13 | `writing-plans/tasks/create.md` body SHALL contain no JSON/YAML code blocks.
  | structural | file inspection |

  | SC-14 | `writing-plans/contracts/*-output.yaml` SHALL include the `blocker_reason`
  field, symmetric with task result contracts. | structural | file inspection |

  | SC-15 | `verify-plan-pipeline` SHALL be wired into the writing-plans workflow
  sequence. | behavioral | opencode run |

  | SC-16a | `writing-plans/tasks/completion.md` SHALL route the lifecycle event to
  the `completion-core` lifecycle manifest at `{project_root}/tmp/{issue-N}/lifecycle.yaml`
  (metadata, append-only). | behavioral | opencode run |

  | SC-16b | `writing-plans/tasks/completion.md` SHALL report the executive summary
  in chat in the completion-core format (`**Summary:**` 1-2 sentences on impact/stakeholder
  value, `**Outcome:**` on what changed for stakeholders, URL ALWAYS LAST). | behavioral
  | opencode run |

  | SC-16c | `writing-plans/tasks/completion.md` SHALL NOT append lifecycle events
  to `plan.md` or `spec.md`. | behavioral | opencode run |

  | SC-16d | `writing-plans/tasks/completion.md` SHALL NOT post lifecycle events as
  human-facing issue comments (non-substantive per the substantive-comment gate).
  | behavioral | opencode run |

  | SC-17 | `writing-plans/tasks/research.md` sc-summary.yaml path SHALL match the
  spec-creation write path. **Note (post-#2254):** the spec-creation write path is
  the POST-#2254 path (after #2254 SC-17/18 changes to the spec-creation analyze/validate
  write paths). Verification MUST confirm against the post-#2254 spec-creation behavior.
  | behavioral | opencode run |

  | SC-18 | `writing-plans/tasks/handoff.md` SHALL reference an existing approval-gate
  task, not the non-existent `verify-authorization`. | behavioral | opencode run |

  | SC-19 | The analytical artifacts (blast-radius, concern-map, code-path-inventory,
  cross-cutting-matrix, interface-compatibility, state-analysis, testability-assessment)
  SHALL be generated and stored at `.opencode/.issues/2256/artifacts/`, so the artifact
  cross-reference check can be performed. | structural | file inspection |


  ## 4. Requirements


  - R-1a. `plan-artifact-format.md` SHALL be deleted (file absent from the codebase).

  - R-1b. `reference/plan-structure-standards.md` SHALL be the single canonical plan-structure
  authority.

  - R-1c. `writing-plans/SKILL.md` File Structure SHALL no longer list `plan-artifact-format.md`.

  - R-2. The `dispatch` field SHALL be removed from the plan frontmatter in `plan-structure-standards.md`.

  - R-3. `plan_schema_version` SHALL be a string type in `plan-structure-standards.md`.

  - R-4. The `solve model` invocation in `research.md` SHALL use a valid Z3 query
  expression.

  - R-5. The `solve check` invocation in `research.md` SHALL use a real solve state
  file.

  - R-6. The `plan plan` invocation in `research.md` SHALL use the `--problem` flag.

  - R-7. `research.md` SHALL include a BLOCK-on-incomplete-spec gate with diagnose→remediate→escalate
  before Z3/planner invocation.

  - R-8. `plan/SKILL.md` and `solve/SKILL.md` descriptions SHALL be mutually exclusive
  in scope.

  - R-9. Each state/fallback task SHALL have a single owning skill between `plan`
  and `solve`.

  - R-10a. Plan-fidelity tasks SHALL use a single-plan evaluation model (plan-vs-spec),
  removing the phantom clean-room basis.

  - R-10b. Plan-fidelity tasks SHALL NOT reference the non-existent `plan-fidelity.md`
  main task file.

  - R-11. `writing-plans/SKILL.md` SHALL declare the correct task count (9).

  - R-12. `writing-plans` cycle terminology SHALL be consistent with `plan-structure-standards.md`
  and `091-incremental-build.md`.

  - R-13. `writing-plans/tasks/create.md` SHALL contain no JSON/YAML code blocks in
  its body.

  - R-14. `writing-plans/contracts/*-output.yaml` SHALL include the `blocker_reason`
  field.

  - R-15. `verify-plan-pipeline` SHALL be wired into the writing-plans workflow sequence.

  - R-16a. `writing-plans/tasks/completion.md` SHALL route the lifecycle event to
  the `completion-core` lifecycle manifest at `{project_root}/tmp/{issue-N}/lifecycle.yaml`
  (metadata, append-only).

  - R-16b. `writing-plans/tasks/completion.md` SHALL report the executive summary
  in chat.

  - R-16c. `writing-plans/tasks/completion.md` SHALL NOT append lifecycle events to
  `plan.md` or `spec.md`.

  - R-16d. `writing-plans/tasks/completion.md` SHALL NOT post lifecycle events as
  human-facing issue comments (non-substantive per the substantive-comment gate).

  - R-17. `writing-plans/tasks/research.md` sc-summary.yaml path SHALL match the spec-creation
  write path.

  - R-18. `writing-plans/tasks/handoff.md` SHALL reference an existing approval-gate
  task.

  - R-19. No `src/` code changes; all changes SHALL be confined to agent-facing skill/task/reference/contract
  files under `.opencode/`.

  - R-20. No changes SHALL be made to `tools/solve` or `tools/plan` CLI interfaces.

  - R-21. No new runtime features SHALL be introduced; this is a documentation/skill-card
  remediation.

  - R-22. The seven analytical artifacts SHALL be generated retroactively and stored
  at `.opencode/.issues/2256/artifacts/`.


  ## 5. Items


  Each SC maps to exactly one item (25 items), each with its own RED→GREEN→verify→commit
  cycle per the per-item TDD mandate. See the full local spec at [`.opencode/.issues/2256/spec.md`](https://github.com/michael-conrad/.opencode/tree/issues-data/.issues/2256/)
  for the complete item-level RED/GREEN/verify/commit breakdown.


  ## 6. Dependencies


  - **Dependency: issue #2254 (spec-writer/spec-audit skill card remediation)** —
  Relationship: #2256 builds on #2254''s post-implementation state. #2254 consolidates
  the evidence-type taxonomy into a single canonical reference document (SC-15/16),
  repairs plan-fidelity role-card naming and repoints cross-references (SC-8/9/10),
  and changes the spec-creation analyze/validate write paths (SC-17/18). #2256''s
  SCs that touch these areas MUST be consistent with the post-#2254 state. Issue #2254
  MUST be implemented before #2256''s dependent SCs (SC-8/9/10a/10b/15/16/17) are
  verified.

  - **`reference/plan-structure-standards.md`** — SHALL be established as the single
  authority in SC-1a/1b/1c/2/3 (with `plan-artifact-format.md` deleted); it MUST be
  the single authority before SC-10a/10b reads it.

  - **`091-incremental-build.md`** — defines per-item TDD cycle; SC-12 MUST conform
  to it.

  - **`skills/solve/SKILL.md`, `skills/plan/SKILL.md`** — SC-4/5/6 fix invocations
  against actual CLIs; SC-8/9 clarify descriptions. The `solve` and `plan` CLI interfaces
  MUST remain unchanged (R-20).

  - **`skills/writing-plans/tasks/research.md`** — edited by P4 (SC-4/5/6/7) and P6
  (SC-17); its tool invocations MUST use the corrected CLI arguments and the BLOCK
  gate before any Z3/planner invocation.

  - **`skills/audit/tasks/plan-fidelity-*.md`** — SC-10a/10b remove the phantom clean-room
  basis and `plan-fidelity.md` reference; the chain MUST use a single-plan (plan-vs-spec)
  evaluation model.

  - **`skills/writing-plans/SKILL.md`** — edited by SC-11/12/15 (task count, terminology,
  verify-plan-pipeline wiring); the Workflows sequence MUST wire `verify-plan-pipeline`
  between `validate` PASS and `completion`.

  - **Analytical artifacts (`.opencode/.issues/2256/artifacts/`)** — SC-19 requires
  all seven analytical artifacts to exist at this path so the artifact cross-reference
  check can run; the artifacts SHALL be generated retroactively per the developer-directive
  remediation requirement (SC-19, R-22).


