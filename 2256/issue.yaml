  ## 9. Enforcement Gate


  > **Enforcement gate:** All success criteria MUST pass before this spec is considered
  complete. Partial implementation is not permitted.


  ## 10. Cost Frame


  Cost is measured in defect-discovery-latency, not tool calls. Correctness is the
  only metric. Per-SC cost frames are detailed in the full local spec at [`.opencode/.issues/2256/spec.md`](https://github.com/michael-conrad/.opencode/tree/issues-data/.issues/2256/).


  ## 11. Edge Cases


  - **Input boundaries (SC-4/5/6):** Corrected invocations SHALL BLOCK on missing
  contract/state files via the SC-7 gate rather than passing placeholder arguments.

  - **State transitions (SC-1a/1b/1c):** `plan-artifact-format.md` SHALL be deleted
  outright, and `writing-plans/SKILL.md` File Structure SHALL be updated to no longer
  list it, leaving `plan-structure-standards.md` as the single canonical authority.

  - **Failure modes (SC-10a/10b):** Residual phantom clean-room or `plan-fidelity.md`
  references SHALL FAIL the SC and be removed.

  - **Concurrency (SC-11/12/15):** Multiple items edit `writing-plans/SKILL.md`; items
  execute sequentially in the dependency DAG.

  - **Recovery (SC-7):** The BLOCK gate SHALL follow diagnose→remediate→escalate.

  - **Analytical artifact generation (SC-19):** The seven analytical artifacts SHALL
  be generated and stored at `.opencode/.issues/2256/artifacts/`; SC-19 generates
  all seven retroactively from the current plan skill deck and stores them at the
  expected path so the cross-reference check can run.


