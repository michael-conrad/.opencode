## Contradiction prompting this spec (from dispatch context)

- Despite the documented-BROKEN record, a `gb api` REST call with {"labels":[...]} reportedly WORKED reliably.
- OpenAPI v4.42.1 reference (openapi-v4.42.1.json) documents ONLY repo-level label endpoints
  (/repos/{owner}/{repo}/labels GET/POST) — NO issue-level /issues/{number}/labels sub-resource paths exist in the bundled spec (total 23 paths, zero issue sub-resource paths).
- Therefore the actual label-ops workflow (issue-level vs repo-level; POST/PUT/DELETE behavior) is UNCONFIRMED and requires a live local GitBucket instance test.

