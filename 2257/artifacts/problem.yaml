# Planning problem — issue #2257 (fixed grounding)
# Each phase explicitly grounded; sequential ordering enforced by preconditions
domain: label-ops-plan
objects:
  - name: p1
    type: phase
  - name: p2
    type: phase
fluents:
  - name: done
    params:
      - name: p
        type: phase
actions:
  - name: run_p1
    params: []
    preconditions:
      - not done(p1)
    effects:
      - done(p1)
  - name: run_p2
    params: []
    preconditions:
      - done(p1)
      - not done(p2)
    effects:
      - done(p2)
init: []
goals:
  - done(p1)
  - done(p2)
