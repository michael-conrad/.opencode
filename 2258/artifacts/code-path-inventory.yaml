- id: P1
  sc: SC-1
  path: .opencode/hooks/pre-commit
  description: Gate 2 stale submodule pointer check fallback path (line 49) — `git submodule status "$sp" | awk '{print substr($1,2)}'` extracts the SHA from the status line.
  behavior: For a clean submodule the status line is space-prefixed (` faaaedcce...`), so awk `$1`=`faaaedcce...` and `substr($1,2)` strips the first hex char → 39-char false-positive. For a dirty submodule (`+faaaedcce...`) `$1`=`+faaaedcce...` and `substr($1,2)` is correct.
  fix_target: Replace line 49 extraction with a locale-independent full-40-char-SHA form (grep -oE '[0-9a-f]{40}' | awk with explicit first-char test | awk+sed with dash-last literal set).
