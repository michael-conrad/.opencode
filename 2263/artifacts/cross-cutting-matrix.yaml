## Legend
- PRIMARY: the concern is the main deliverable of this SC.
- REQUIRED: the concern must be satisfied for this SC to pass.
- GUARD: the concern must NOT be violated by this SC (negative constraint).
- CHECK: the concern is verified as part of this SC.

## Analysis
- **Context-economy rationale** is the single cross-cutting thread across all SCs — it is the unifying principle of the fix.
- **Delegation mechanism preservation** is a guard on every file-modifying SC — the re-scope must not change which tasks are delegated vs inline.
- **Cost-blind vs context-cost distinction** is required in SC-1 and SC-3 (020-go-prohibitions.md) because line 217 "Cost-blind universal" could otherwise be read as contradicting the context-economy model.
- **No false "not a file" claim** is primary in SC-2 (carve-out deletion) and required in SC-4 (000-critical-rules.md must not reintroduce it).
- **No-preloaded-context substance** is guarded in SC-3 and SC-5 — only the justification changes, not the requirement.
- **Tier 1 file discipline** applies to SC-1 through SC-4 (020 and 000 are Tier 1 files).
- **Cross-file consistency** is required in SC-4 and SC-5 (must align with the re-scoped 020) and primary in SC-6 (contradiction elimination).
- **Enforcement of actual inline work** is guarded in SC-1 and SC-7 — the re-scope must not be read as loosening the prohibition on orchestrator doing large/disposable work inline.
