### Compatibility Classification
- **Unchanged:** task(), skill(), clean-room sub-agents, task cards, pipeline behavior.
- **Modified (backward compatible):** 020-go-prohibitions.md (rule + carve-out + §1.1), 000-critical-rules.md (critical-rules-XXX), 36 skill cards (DISPATCH_GATE).
- **New:** None.
- **Removed:** The false carve-out (line 207) — replaced, not removed from the framework's capability.

### Breaking Change Analysis
- No breaking changes. The fix is a documentation/instruction-model change. The delegation mechanism, which-tasks-are-delegated, and the no-preloaded-context substance are all preserved.
- The only "removal" is the false carve-out prose, which is replaced by a truthful justification — the underlying behavior (orchestrator reads SKILL.md routing metadata) is unchanged.

### Internal-Only Interfaces
- All affected interfaces are internal to the .opencode framework (agent-facing instruction-model). No external/public API is affected.
- The behavioral enforcement tests (tests-v2/behaviors/) that assert the "never inline" absolute are internal test interfaces — they must be updated to assert the context-economy model (SC-6).

