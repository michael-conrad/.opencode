## Key Findings

### Finding 1: The contradiction is real and structural
The "orchestrator NEVER performs inline work" absolute (020 line 205) directly contradicts:
- Skill cards' `Execution mode: inline` designations (spec-creation lines 69/84, brainstorming lines 32/36)
- The DISPATCH_GATE "Orchestrator Entry Criteria" that requires the orchestrator to read SKILL.md routing sections in its own context (all 36 DISPATCH_GATE skills)
- critical-rules-XXX in 000-critical-rules.md (lines 197, 185) requiring orchestrator to read SKILL.md inline

### Finding 2: The carve-out is a category error
Line 207 asserts reading a SKILL.md is "NOT 'inline work' or 'reading a file.'" A SKILL.md IS a file. This is a false distinction that teaches rationalization — the exact behavior critical-rules-006 flags as a bypass signature.

### Finding 3: The context-economy framing already exists
§1.1 (lines 84-137) already frames the orchestrator/sub-agent split in context terms: "Orchestrator context: Holds routing metadata only" (line 94), "Sub-agent context: Disposable" (line 96). The fix re-scopes the "never inline" absolute to this existing context-economy rationale rather than introducing a new concept.

### Finding 4: The skill() mechanism is the authoritative justification
Per research card spec-writing-ai-agents-opencode-skill-architecture.md (confidence 0.90): skill() auto-loads SKILL.md into the calling agent's context; task() does NOT auto-load task cards. The orchestrator reading a loaded SKILL.md's routing section is not "reading a file" in the sub-agent-delegation sense — it is consuming routing metadata that skill() already injected. The truthful justification is context economy: the routing metadata is small, necessary, and already in the orchestrator's context; delegating it to a sub-agent would be wasteful and impossible (sub-agents lack skill()).

### Finding 5: Overlapping/dependent specs
- #1406: Orchestrator bypass enforcement — relies on the "never inline" rule for enforcement. The fix must not weaken enforcement of actual inline work (file edits, analysis).
- #1204: Convert self-policing "agent MUST" rules to dispatch-table SCs — the re-scoped rule becomes a candidate for semantic verification.
- #1010: Checklist Dispatch Architecture — orchestrator as blind dispatcher. The context-economy model must align with the blind-dispatch principle.
- These are dependencies, not conflicts — the fix preserves the delegation mechanism exactly.

### Finding 6: "Cost-blind" vs "context-cost" tension
020 line 217 "Cost-blind universal" says sub-agent task() and tool calls are near-zero cost. The context-economy model allocates by context cost. These are different dimensions: "cost-blind" refers to verification/execution cost (never skip a tool call to save resources); "context-cost" refers to the orchestrator's persistent context resource. The fix must explicitly distinguish these to avoid a perceived contradiction.

