## Conclusion
The research cards provide strong support for the context-economy re-scoping:
1. The orchestrator MUST read SKILL.md routing metadata inline because sub-agents cannot load skills (mechanism necessity).
2. Industry research frames inline-vs-dispatch as a context/cost allocation decision, not a role-purity absolute.
3. The contradiction class is recurring and systemic, warranting a principled fix rather than per-card patches.
