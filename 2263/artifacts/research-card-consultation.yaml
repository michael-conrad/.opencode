## Research Cards Consulted

### 1. .issues/research-cards/spec-writing-ai-agents-opencode-skill-architecture.md
- confidence: 0.90, status: active
- **Relevant findings:**
  - Finding 7/8: skill() auto-loads SKILL.md into the calling agent's context; task() does NOT auto-load task cards. The orchestrator reading a loaded SKILL.md's routing section is consuming metadata skill() already injected — not a sub-agent-delegable file read.
  - Finding 10: Skill Card (SKILL.md) → Orchestrator; Task Card (tasks/<name>.md) → Sub-agent. Two distinct consumers.
  - Finding 16: task() has no skill/task_card parameter; sub-agent must discover task card via its own tools.
  - Finding 17-19: The Invocation section is the dispatch contract; the orchestrator reads it to determine the canonical dispatch string.
  - "Why Dispatching SKILL.md to a Sub-Agent Is a Category Error": sub-agents lack skill() and task() tools (task: deny). The orchestrator MUST read SKILL.md routing metadata itself because sub-agents cannot.
- **Applicability:** Directly supports the context-economy justification. The orchestrator reading SKILL.md routing metadata is not "inline work" in the delegation sense — it is the only mechanism by which the orchestrator can learn the dispatch contract, because sub-agents cannot load skills. The carve-out's error is not that it allows the read; it is that it falsely claims "a SKILL.md is not a file." The truthful justification is context economy + mechanism necessity.

