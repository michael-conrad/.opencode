## State Machine Analysis

### State Model: Orchestrator Instruction-Model State

The affected files define the orchestrator's instruction-model state — the set of rules the orchestrator follows when deciding whether to perform work inline or dispatch to a sub-agent.

### States

| State | Description | Current (pre-fix) | Target (post-fix) |
|-------|-------------|-------------------|-------------------|
| S0: Role-purity | Orchestrator NEVER performs inline work (absolute) | ACTIVE (020 line 205) | REMOVED |
| S1: Carve-out | Reading SKILL.md routing metadata is "NOT inline work / NOT reading a file" | ACTIVE (020 line 207) | REMOVED (replaced) |
| S2: Context-economy | Work allocated by context cost (large/disposable → sub-agent; small/necessary → orchestrator) | PARTIAL (§1.1 lines 84-137) | ACTIVE (unified principle) |
| S3: Contradiction | Orchestrator must reconcile three contradictory signals on every skill load | ACTIVE (no compliant path) | REMOVED (compliant path exists) |

