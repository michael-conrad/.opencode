### Invariants (must hold in all states)

- INV-1: The delegation mechanism (task(), skill(), clean-room sub-agents) is unchanged.
- INV-2: Which tasks are delegated vs inline is unchanged.
- INV-3: The no-preloaded-context requirement's substance is unchanged.
- INV-4: Large/disposable work (file analysis, verification, composition) is still delegated to sub-agents.
- INV-5: The category-error prohibition (dispatching SKILL.md to sub-agents) is preserved.
- INV-6: "Cost-blind" (verification cost) is distinct from "context-cost" (orchestrator context resource).

