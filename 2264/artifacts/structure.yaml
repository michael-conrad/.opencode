dependency_dag:
  edges:
    - from: phase_1
      to: phase_2
      rationale: "The fallback assignment operates on the SUBMODULE_TRUNK variable introduced by SC-1 (same-file edit coherence)"
    - from: phase_1
      to: phase_3
      rationale: "The different-trunk behavioral test verifies the per-submodule lookup from SC-1"
    - from: phase_1
      to: phase_4
      rationale: "The shared-trunk regression test verifies the per-submodule lookup from SC-1"
    - from: phase_1
      to: phase_5
      rationale: "The documentation describes the per-submodule lookup introduced by SC-1"
    - from: phase_3
      to: phase_6
      rationale: "The two-submodule verification test builds on the different-trunk test (SC-3)"
    - from: phase_4
      to: phase_6
      rationale: "The two-submodule verification test builds on the shared-trunk regression test (SC-4)"
    - from: phase_1
      to: phase_7
      rationale: "Override hygiene is assessed only after the per-submodule lookup fix exists"

triplet_colocation:
  status: VERIFIED
  notes: "All SC-1..7 have RED/GREEN/COMMIT steps assigned to a single phase (one phase per SC, aligned to spec Items 1-7). No split triplets."

cross_phase_dependency:
  status: VERIFIED
  notes: "No RED test in a later phase depends on output committed in a later phase. Phase 6 depends on phase 3 and phase 4 (both earlier). All dependency edges point forward (lower to higher phase number). No forward RED dependency."

