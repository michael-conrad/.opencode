# Planning problem — issue #2268
# Add vision-agent and visual-design-agent cards; 4 phases, DAG ordering enforced by preconditions
domain: vision-visual-agents
objects:
  - name: p1
    type: phase
  - name: p2
    type: phase
  - name: p3
    type: phase
  - name: p4
    type: phase
fluents:
  - name: done
    params:
      - name: p
        type: phase
actions:
  - name: run_p1
    params: []
    preconditions:
      - not done(p1)
    effects:
      - done(p1)
  - name: run_p2
    params: []
    preconditions:
      - not done(p2)
    effects:
      - done(p2)
  - name: run_p3
    params: []
    preconditions:
      - done(p1)
      - done(p2)
      - not done(p3)
    effects:
      - done(p3)
  - name: run_p4
    params: []
    preconditions:
      - done(p1)
      - done(p2)
      - not done(p4)
    effects:
      - done(p4)
init: []
goals:
  - done(p1)
  - done(p2)
  - done(p3)
  - done(p4)
