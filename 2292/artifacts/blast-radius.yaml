# Blast Radius
issue: 2292
topic: Test framework must never use project root as a git-mutating target

## Per-Item Affected Components and Ripple Effects

### Item 1 — Live-root fallback elimination
- Components: helpers.sh `__ensure_gitbucket()` (line 267)
- Ripple: all 18 BEHAVIOR_NEEDS_REMOTE=1 tests no longer mutate live repo origin/main
- Risk: if removal is not paired with a guard, remote wiring could silently skip → GitBucket
  remote tests lose origin wiring → behavioral failures in 2241/2242/2257 suites

### Item 2 — Live-root mutation guard
- Components: helpers.sh (new guard function or inline guard), with-test-home
- Ripple: any future git-mutating op in harness is protected; defensive layer
- Risk: guard false-positive could block legitimate isolated-target ops (mitigate: only BLOCK when
  target == live repo)

### Item 3 — Remote-wiring ordering dependency
- Components: helpers.sh behavior_run() (line 488 → 620 ordering), with-test-home TEST_PROJECT
  establishment
- Ripple: remote-wiring relocates or gains an ordering guard; GitBucket origin wiring on
  attempt_workdir (line 615) must remain intact
- Risk: if ordering fix removes the attempt_workdir wiring, remote tests lose origin

### Item 4 — Structural regression enforcement test
- Components: tests-v2 enforcement test file (new), AGENTS.md documentation
- Ripple: CI/content-verification gate now enforces live-root-mutation prohibition
- Risk: low — additive enforcement

## Phase Mapping
Phase 1 = Items 1-3 (harness fix), Phase 2 = Item 4 (enforcement test).
Phase 1 must land before Phase 2's enforcement test can pass (the test asserts the fix).
