# Concern Map
issue: 2292
topic: Test framework must never use project root as a git-mutating target

## Concern Boundaries and Separation Per Phase

### Phase 1 — Harness Fix (Items 1-3)
Concerns:
- Isolation safety: no git-mutating op may target the live repo
- Remote-wiring correctness: GitBucket provisioning must still wire origin on an isolated repo
- Ordering integrity: remote wiring runs only after an isolated target exists

Boundaries:
- helpers.sh owns the fallback elimination, guard, and ordering logic
- with-test-home owns isolated-target establishment (TEST_PROJECT)
- No cross-file concern leakage: helpers.sh reads TEST_PROJECT, with-test-home sets it

### Phase 2 — Enforcement (Item 4)
Concerns:
- Regression prevention: content-verification test asserts live-root-mutation prohibition
- Documentation: AGENTS.md test isolation section reflects the prohibition

Boundaries:
- test-enforcement.sh / standalone test owns the assertion
- AGENTS.md owns the documented rule

## Separation
- Phase 1 changes harness runtime behavior (helpers.sh, with-test-home)
- Phase 2 changes enforcement/docs only
- No overlap: Phase 1 modifies source, Phase 2 adds a test that asserts Phase 1's result.
