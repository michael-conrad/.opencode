# Interface Compatibility
issue: 2292
topic: Test framework must never use project root as a git-mutating target

## Interface Compatibility Analysis Per Phase

### Phase 1 — Harness Fix (Items 1-3)

| Interface | Status | Backward Compatible | Notes |
|-----------|--------|---------------------|-------|
| `__ensure_gitbucket()` signature | Unchanged (modified body) | Yes | Internal harness function; signature preserved |
| `behavior_run()` signature | Unchanged | Yes | 5-positional-arg signature preserved |
| `BEHAVIOR_NEEDS_REMOTE` env flag | Unchanged | Yes | Still triggers GitBucket provisioning |
| `TEST_PROJECT` variable | Modified (no longer falls back to project_root) | Yes | Semantics tightened: only isolated target valid |
| `with-test-home` CLI interface | Unchanged | Yes | --setup/--clean/--clean-all/--keep unchanged |
| New guard function | New | N/A | Added internal helper in helpers.sh |

### Phase 2 — Enforcement (Item 4)

| Interface | Status | Backward Compatible | Notes |
|-----------|--------|---------------------|-------|
| test-enforcement.sh | Unchanged | Yes | New scenario/tag added, existing preserved |
| New standalone enforcement test | New | N/A | test-*.sh added |

## Compatibility Summary
- No breaking interface changes. All existing test scripts, flags, and harness entry points remain
  valid. The fix is internal to helpers.sh/with-test-home with additive guard + enforcement test.

