# Pre-Spec Inspection
issue: 2292
topic: Test framework must never use project root as a git-mutating target
project_root: /home/muksihs/git/opencode-config/.opencode

## Affected Files

Primary (test harness code):
- .opencode/tests-v2/behaviors/helpers.sh — `__ensure_gitbucket()` (line 267) falls back to
  `$project_root` (live repo) when `TEST_PROJECT` is unset, then runs git-mutating remote ops
  against it. Also `__ensure_gitbucket()` at line 488 runs BEFORE with-test-home sets TEST_PROJECT.
- .opencode/tests-v2/with-test-home — sets TEST_PROJECT only inside its own subprocess (line 229,
  389-392); never exports it to the parent shell where helpers.sh runs.

