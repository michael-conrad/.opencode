## Defect Root Cause

`.opencode/tests-v2/behaviors/helpers.sh` `__ensure_gitbucket()`:
```
local test_project="${TEST_PROJECT:-$project_root}"
```
`$project_root` = `$PARENT_REPO_DIR` = the LIVE `.opencode` git repo.

The git-mutating operations executed against it (lines 267-273):
1. `git -C "$test_project" remote get-url origin` (read)
2. `git -C "$test_project" remote remove origin` (MUTATE)
3. `git -C "$test_project" remote add origin "http://root:${GB_TOKEN}@localhost:${port}/git/root/test-repo.git"` (MUTATE)
4. `git -C "$test_project" push -u origin main` (MUTATE — pushes live main to test GitBucket)

## Reachability

`__ensure_gitbucket()` runs at helpers.sh line 488 (inside behavior_run) BEFORE with-test-home is
invoked at line 620. At that point TEST_PROJECT is NEVER set in the parent shell — it is only set
inside with-test-home's subprocess. Therefore EVERY test that sets `BEHAVIOR_NEEDS_REMOTE=1`
(18 scripts) triggers the live-root mutation fallback. The remote ops also run a second time against
the correct `$attempt_workdir` (line 615) but the first invocation already mutated the live repo.

## Existing Patterns & Conventions

- The harness isolates test git operations against `$TEST_PROJECT` / `$attempt_workdir` (test-home
  project) — this is the intended isolation boundary.
- `with-test-home` uses `env -i -C "$TEST_PROJECT"` so the model's CWD is isolated.
- No existing guard prevents git-mutating ops when the target repo equals `$PARENT_REPO_DIR` /
  `$PROJECT_DIR` (the live repo).
