testability_assessment:
  issue_number: 2293
  phases:
    - phase: PHASE-1
      sc_ids: [SC-1, SC-2]
      test_strategy: "behavioral"
      description: "opencode run with a prompt asking whether a submodule repo (e.g., SHARED-DAO) may file its own PR for its own changes. Clean-room sub-agent inspects session.yaml for agent behavior confirming the parent-repo scope is applied and submodule repos' own PRs are permitted."
      test_files:
        - "tests-v2/behaviors/<scenario>.sh"
    - phase: PHASE-2
      sc_ids: [SC-3]
      test_strategy: "behavioral"
      description: "opencode run with prompts covering both directions: (a) submodule repo may file its own PR (permitted), (b) parent-repo submodule-pointer-only PR (still blocked). Clean-room sub-agent inspects session.yaml for both behaviors."
      test_files:
        - "tests-v2/behaviors/<scenario>.sh"
  notes:
    - "Behavioral tests are required because the change affects agent routing decisions (runtime behavior), not static content."
    - "Tests must assert both the newly-permitted submodule-repo PR and the preserved parent-repo prohibition to prevent over-correction."
