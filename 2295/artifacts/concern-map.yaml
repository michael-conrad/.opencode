## Concern Map

Concern boundaries and separation per SC.

### Concern: Content-Type Boundary for `.issues/` worktree (cross-cutting)

Spans ITEM-1 (AGENTS.md exclusions), ITEM-2 (red.md), ITEM-3 (implementation-workflow.md), ITEM-4 (create.md), ITEM-5 (review-prep.md), ITEM-6 (behavioral test). The core concern is: **`.issues/` holds issue metadata only, never source/test/fixture/code.**

| Concern | Owning SC(s) | Separation |
|---------|--------------|------------|
| Universal content-type boundary declaration | SC-1 | AGENTS.md exclusions list is the single authoritative statement |
| Test-storage path authorization removal | SC-2 | red.md is the only file that authorizes `.issues/{N}/tests/` |
| Artifact-retention framing correction | SC-3 | implementation-workflow.md Rule 1 framing |
| Artifact-copy target disambiguation | SC-4 | create.md Step 6 copy semantics |
| PR auto-commit behavior | SC-5 | review-prep.md Step 0 auto-commit |
| Behavioral enforcement | SC-6 | tests-v2 behavioral scenario |

### Separation of Concerns

- **Documentation concern** (SC-1, SC-3): agent-facing guides/references — structural edits, no behavior change.
- **Skill-task authorization concern** (SC-2, SC-4): skill task cards that direct agent file placement — changes what agents are authorized/permitted to do.
- **Workflow concern** (SC-5): git-workflow-pr pipeline behavior — the one functional workflow change.
- **Enforcement concern** (SC-6): behavioral test — verifies the aggregate boundary at runtime.

No two SCs share a file. Each SC targets exactly one file/category and one verification domain. Single-concern satisfied.
