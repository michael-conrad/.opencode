## Interface Compatibility Analysis

### Interfaces at the `.opencode/` boundary

There are no programmatic function/method interfaces in this change — all modifications are agent-facing text and test-harness additions. The "interfaces" are agent-routing conventions consumed by skill dispatch and task execution.

| Interface | Type | Status | Compatibility |
|-----------|------|--------|---------------|
| `.opencode/.issues/AGENTS.md` authorization + exclusions text | Agent-facing workspace guide | Modified (additions) | Backward compatible — adds content-type boundary; no existing directive removed |
| `.opencode/skills/test-driven-development/tasks/red.md` test-storage path | Skill task card | Modified (text) | **Behavioral interface change** — removes `.issues/{N}/tests/` authorization; RED-phase agents must now resolve owning repo. Backward compatible via owning-repo replacement path (Risk 2 mitigation) |
| `.opencode/skills/writing-plans/reference/implementation-workflow.md` Rule 1 | Skill reference doc | Modified (clarification) | Backward compatible — reframes "permanent/never delete" to "issue metadata only"; no removal of legit artifact-retention for metadata |
| `.opencode/skills/spec-creation/tasks/create.md` Step 6 | Skill task card | Modified (disambiguation) | Backward compatible — analysis-artifact copy behavior preserved; only ambiguity about scope removed |
| `.opencode/skills/git-workflow-pr/tasks/review-prep.md` Step 0 | Skill task card | Modified (behavior) | **Behavior change** — stops unconditional `git add .issues/` auto-commit. Removes a convenience that caused misrouting. Internal-only change to pipeline |
| `.opencode/tests-v2/behaviors/<scenario>.sh` | Behavioral test | New | Adds new scenario to test suite; no existing test interface changed |

### Compatibility Class Summary

- **Unchanged:** none removed entirely; AGENTS.md additions
- **Modified (internal only):** red.md, implementation-workflow.md, create.md, review-prep.md — all internal to `.opencode/`, no external API consumers
- **New:** behavioral test scenario
- **Breaking:** none. No interface that external consumers rely on is broken. The owning-repo principle is a superset replacement for the removed `.issues/{N}/tests/` path.

## Backward Compatibility Assessment

- The `.issues/{N}/tests/` removal is a deliberate breaking of an *incorrect* authorization — the owning-repo principle provides the replacement. Mitigated per spec Risk 2.
- Auto-commit removal in review-prep is a behavioral change with no external dependency.
- All other changes are additions/clarifications — backward compatible.
