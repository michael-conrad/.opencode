## Testability Assessment

Test strategy per SC.

### SC-1 — AGENTS.md exclusions list
- **Type:** structural
- **RED test:** grep AGENTS.md for the exclusions-list marker (e.g., "never source/test/fixture/code") — assert ABSENT (fails before change)
- **GREEN:** assert PRESENT
- **Tool:** content-verification test or direct grep in RED/GREEN

### SC-2 — red.md removes `.issues/{N}/tests/`
- **Type:** structural (text) + behavioral (via SC-6)
- **RED:** grep red.md for `.issues/{N}/tests/` — assert PRESENT before change; owning-repo reference absent
- **GREEN:** assert `.issues/{N}/tests/` ABSENT and owning-repo principle reference PRESENT
- **Tool:** structural grep; ultimate behavioral gate delegated to SC-6

### SC-3 — implementation-workflow.md artifact retention
- **Type:** structural
- **RED:** grep Rule 1 for "metadata only" clarification — assert ABSENT before change
- **GREEN:** assert metadata-only language PRESENT
- **Tool:** structural grep

### SC-4 — create.md artifact copy disambiguation
- **Type:** structural
- **RED:** grep Step 6 for unambiguous copy-target scope — assert ABSENT before change
- **GREEN:** assert disambiguated language PRESENT
- **Tool:** structural grep

### SC-5 — review-prep.md auto-commit
- **Type:** structural
- **RED:** grep Step 0 for unconditional `git add .issues/` auto-commit — assert PRESENT before change
- **GREEN:** assert removal/scoping PRESENT
- **Tool:** structural grep

### SC-6 — behavioral enforcement test
- **Type:** behavioral (PRIMARY)
- **Approach:** artifact-only generator at `.opencode/tests-v2/behaviors/<scenario>.sh` per canonical framework (See .opencode/tests-v2/AGENTS.md §9 Prompt Construction Mandate). Real-domain prompt (e.g., "Implement test for SC-X of spec #N" or a TDD task that would naturally place a test) run via `bash .opencode/tests-v2/with-test-home opencode run '<message>'`. Assertions use stderr-based helpers (`assert_stderr_pattern_present`/`assert_stderr_pattern_absent_all_models`) checking agent did NOT perform `.issues/` write actions (no `.issues/{N}/tests/` file writes, no `write`/`edit` on `.issues/` test paths).
- **RED:** behavioral test FAILS — agent writes `.issues/` test file (before text fixes, or scenario is unguarded)
- **GREEN:** behavioral test PASSES — agent does NOT write `.issues/` test file
- **Constraint:** Bash tool timeout >= 600s; no `timeout` command in script; run via `with-test-home`, never direct `opencode run`
- **Fixture requirement:** if prompt references an issue (e.g., `.issues/N/spec.md`), create fixture at `fixtures/issues/N/` BEFORE running (per AGENTS.md §3 Step 0)

## Test Strategy Summary

| SC | Type | Test Tool | Bash Timeout |
|----|------|-----------|--------------|
| SC-1 | structural | grep / content-verification | n/a |
| SC-2 | structural (+ behavioral via SC-6) | grep | n/a (SC-6: >=600s) |
| SC-3 | structural | grep | n/a |
| SC-4 | structural | grep | n/a |
| SC-5 | structural | grep | n/a |
| SC-6 | behavioral | with-test-home + opencode run | >= 600s |

## Testability Risks

- **SC-6 flakiness (spec Risk 3):** mitigated by canonical framework, stderr-based assertions, fixture creation before run.
- **Cross-SC coupling:** SC-2's behavioral gate is SC-6. If SC-6 is the only behavioral test, a pass proves the aggregate boundary. Recommend the behavioral test reference a spec context whose RED would previously have been misrouted to `.issues/`, to maximize signal.
