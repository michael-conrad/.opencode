  ## 9. Enforcement Gate


  > **Enforcement gate:** All success criteria MUST pass before this spec is considered
  complete. Partial implementation is not permitted.


  ## 10. Cost Frame


  Cost is measured in defect-discovery-latency, not tool calls. Correctness is the
  only metric.


  - **SC-1:** Verifying the exclusions list exists in AGENTS.md costs one grep call.
  Skipping means the content-type boundary is never authoritatively declared, and
  agents continue to misroute source/tests/fixtures into `.issues/` — a defect discovered
  only when the lost work surfaces in production, costing 1000× more to fix.

  - **SC-2:** Verifying `.issues/{N}/tests/` is removed from red.md costs one grep
  call. Skipping means the explicit authorization to misroute test files remains,
  and RED-phase agents keep writing tests to a non-deployable path — a defect discovered
  only when the tests never reach the build, costing 1000× more to fix.

  - **SC-3:** Verifying Rule 1 clarifies metadata-only retention costs one grep call.
  Skipping means the "permanent / never delete" framing continues to invite arbitrary
  artifact persistence in `.issues/` — a defect discovered only when the build misses
  source artifacts, costing 1000× more to fix.

  - **SC-4:** Verifying Step 6 disambiguates the copy target costs one grep call.
  Skipping means the ambiguous "analytical artifacts" term continues to permit copying
  source/test/fixture content into `.issues/{N}/artifacts/` — a defect discovered
  only when non-deployable content ships, costing 1000× more to fix.

  - **SC-5:** Verifying Step 0 no longer auto-commits `.issues/` files costs one grep
  call. Skipping means feature PRs continue to auto-include arbitrary dirty `.issues/`
  files — a defect discovered only when a PR carries unintended content, costing 1000×
  more to fix.

  - **SC-6:** Running the behavioral enforcement test costs minutes of execution time.
  Skipping means the aggregate `.issues/` content-type boundary is never verified
  against real agent behavior, and the misrouting defect ships to production — costing
  1000× more to fix than the bounded behavioral test.


  ## 11. Edge Cases


  - **Input boundaries:** The exclusions list in AGENTS.md MUST be explicit and unambiguous
  — an empty or vague list provides no boundary. The owning-repo principle MUST resolve
  to a concrete repo (root vs submodule) for every code-under-test; if the owning
  repo cannot be resolved, the agent MUST NOT default to `.issues/`.

  - **State transitions:** The change transitions `.issues/` from "accepts anything"
  to "accepts issue metadata only." This is a monotonic restriction — no pre-existing
  valid behavior is removed, no state is lost. The misrouted test files on the issues-data
  branch remain untouched.

  - **Failure modes:** If the behavioral enforcement test (SC-6) is flaky, it may
  produce false negatives in the enforcement suite. Mitigation: follow the canonical
  framework, use stderr-based assertions, and create fixtures before running. If a
  text fix is incomplete, the corresponding structural grep fails.

  - **Concurrency:** No runtime concurrency concerns — all changes are agent-facing
  text and a test harness addition. The behavioral test runs in isolation via `with-test-home`.

  - **Recovery:** All changes are idempotent text/behavior edits; recovery is a revert
  of the diff. No data migration or rollback path beyond the text-change itself is
  required.


