body: '> **Full spec and artifacts: [`.opencode/.issues/2295/`](https://github.com/michael-conrad/.opencode/tree/issues-data/2295)**
  — this issue is a condensed exec summary; the authoritative spec lives in the `issues-data`
  branch.

  >

  > **Local artifacts:** `.opencode/.issues/2295/` — implementation plan, card catalogue,
  dependency contracts, research, designs, audit findings


  # Spec: Prevent agents from storing source/tests/fixtures in `.issues/` worktree


  ## 1. Intent and Executive Summary


  | # | Field | Content |

  |---|-------|---------|

  | 1 | **Problem Statement** | The AI agent has begun storing tests, test fixtures,
  and other source/project items in the `.issues/` worktree folders. `.issues/` is
  a git worktree on the `issues-data` branch — a separate git repository gitignored
  in the parent repo. Any file written there never reaches the deployable repo and
  is lost. Confirmed misrouted test files exist on the issues-data branch: `.issues/1297/tests/`,
  `.issues/2127/tests/`, `.issues/1346/tests/`. |

  | 2 | **Root Cause / Motivation** | Primary defect: `.opencode/skills/test-driven-development/tasks/red.md`
  states "Test files go to permanent storage (`.opencode/tests-v2/` or `.issues/{N}/tests/`)."
  This explicitly authorizes placing test files in `.issues/{N}/tests/`, a path that
  does not exist in the canonical `.issues/` layout and is invisible to the parent
  repo''s build system. Contributing defects: (a) `.opencode/skills/writing-plans/reference/implementation-workflow.md`
  labels `.issues/{N}/` "permanent" artifacts that "Never delete or clean" — inviting
  agents to persist anything there; (b) `.opencode/skills/spec-creation/tasks/create.md`
  copies "analytical artifacts" into `.issues/{N}/artifacts/` with an ambiguous term;
  (c) `.opencode/.issues/AGENTS.md` declares "Reading and writing `.issues/` is authorization-free"
  — reinforcing `.issues/` as a default landing zone with no content-type boundary;
  (d) `.opencode/skills/git-workflow-pr/tasks/review-prep.md` auto-commits dirty `.issues/<N>/`
  files into feature PRs. |

  | 3 | **Approach Chosen** | Establish a universal principle: tests and source artifacts
  are tracked in the git repository that owns the code under test, never in `.issues/`.
  The `.issues/` worktree is a gitignored, non-deployable git repository — any source/test/fixture
  written there is lost. The fix removes the explicit authorization in `red.md`, corrects
  the misleading "permanent" framing in `implementation-workflow.md`, disambiguates
  the artifact copy in `create.md`, and stops auto-committing `.issues/` files into
  feature PRs. An explicit exclusions list in `.opencode/.issues/AGENTS.md` establishes
  the content-type boundary. A behavioral enforcement test verifies agents do not
  write test files under `.issues/`. |

  | 4 | **Alternatives Considered & Why Discarded** | **Alternative: migrate/delete
  the already-misrouted test files** (`.issues/1297/tests/`, `.issues/2127/tests/`,
  `.issues/1346/tests/`). Discarded: migration/deletion of existing misrouted files
  is out of scope — it risks data loss on the issues-data branch and does not address
  the root cause (the authorization that caused the misrouting). The fix targets the
  authorization and enforcement, not the symptom. |

  | 5 | **Key Design Decisions** | (1) **Owning-repo principle over fixed path** —
  tests are placed per the repo that owns the code under test, not a hardcoded path.
  Tradeoff: requires agents to resolve owning repo at runtime rather than follow a
  fixed rule, but prevents future misrouting. (2) **Universal prohibition** — `.issues/`
  holds issue metadata only, never source/test/fixture/code, in both root and submodule
  repos. Tradeoff: stricter than the prior "authorization-free" framing, but necessary
  because `.issues/` is a gitignored orphan-branch worktree. (3) **Behavioral enforcement**
  — a behavioral test asserts agents do not write `.issues/` test files, complementing
  the text fixes. Tradeoff: behavioral tests are slower and may be flaky, but they
  are the only evidence type that verifies actual agent behavior. |

  | 6 | **User Intent / Original Prompt** | Prevent the AI agent from storing source/tests/fixtures
  in the `.issues/` worktree (non-deployable repos, lost work). |


  ## 2. Not Included


  - **Migration or deletion of already-misrouted test files** (`.issues/1297/tests/`,
  `.issues/2127/tests/`, `.issues/1346/tests/`) — out of scope to avoid data loss
  on the issues-data branch; the fix targets the authorization, not the symptom.

  - **Changes to the root repo (`opencode-config`)** — this is a `.opencode` submodule
  change only.

  - **Changes to the `.issues/` worktree mechanism itself** — it remains a gitignored
  orphan-branch worktree.

  - **Removal of valid analysis-artifact persistence** in `.issues/{N}/artifacts/`
  (spec, plan, cards, contracts remain metadata artifacts) — only the ambiguity of
  what counts as an "analytical artifact" vs source/test/fixture is disambiguated.


  ## 3. Success Criteria


  | ID | Criterion | Evidence Type | Verification Method |

  |----|-----------|---------------|---------------------|

  | SC-1 | `.opencode/.issues/AGENTS.md` contains an explicit exclusions list stating
  `.issues/` holds issue metadata only, never source/test/fixture/code. | structural
  | grep AGENTS.md for the exclusions-list marker / content-type boundary statement
  |

  | SC-2 | `.opencode/skills/test-driven-development/tasks/red.md` no longer lists
  `.issues/{N}/tests/` as a valid test storage path; replaced with the owning-repo
  principle. | structural | grep red.md for absence of `.issues/{N}/tests/` and presence
  of owning-repo reference |

  | SC-3 | `.opencode/skills/writing-plans/reference/implementation-workflow.md` Rule
  1 clarifies `.issues/{N}/` holds issue metadata only, not arbitrary source/test/fixture
  artifacts. | structural | grep Rule 1 for metadata-only language |

  | SC-4 | `.opencode/skills/spec-creation/tasks/create.md` Step 6 disambiguates the
  "analytical artifacts" copy target so only analysis artifacts (not source/test/fixture)
  are copied to `.issues/{N}/artifacts/`. | structural | grep Step 6 for unambiguous
  copy-target description |

  | SC-5 | `.opencode/skills/git-workflow-pr/tasks/review-prep.md` Step 0 no longer
  auto-commits arbitrary dirty `.issues/<N>/` files into feature PRs (stopped entirely,
  or scoped to metadata-only). | structural | grep Step 0 for removal of unconditional
  `git add .issues/` auto-commit |

  | SC-6 | A new behavioral enforcement test at `.opencode/tests-v2/behaviors/` asserts
  an agent does NOT write test files under `.issues/`. Artifact-only generator per
  canonical framework. | behavioral | Behavioral test execution via `with-test-home
  opencode run`; stderr-based assertions for absence of `.issues/` write actions;
  Bash tool timeout >= 600s |


  ## 4. Requirements


  - R-1. The `.opencode/.issues/AGENTS.md` workspace guide SHALL include an explicit
  exclusions list stating that `.issues/` holds issue metadata only and never source,
  test, fixture, or code content.

  - R-2. The `.opencode/skills/test-driven-development/tasks/red.md` task card SHALL
  NOT list `.issues/{N}/tests/` as a valid test storage path.

  - R-3. The `.opencode/skills/test-driven-development/tasks/red.md` task card SHALL
  direct test placement by the owning-repo principle (resolve the repo owning the
  code under test, then place per that repo''s conventions).

  - R-4. The `.opencode/skills/writing-plans/reference/implementation-workflow.md`
  Artifact Retention Rule 1 SHALL clarify that `.issues/{N}/` holds issue metadata
  only, not arbitrary source/test/fixture artifacts.

  - R-5. The `.opencode/skills/spec-creation/tasks/create.md` Step 6 SHALL disambiguate
  the "analytical artifacts" copy target so only analysis artifacts (not source/test/fixture)
  are copied to `.issues/{N}/artifacts/`.

  - R-6. The `.opencode/skills/git-workflow-pr/tasks/review-prep.md` Step 0 SHALL
  NOT auto-commit arbitrary dirty `.issues/<N>/` files into feature PRs.

  - R-7. A behavioral enforcement test SHALL exist at `.opencode/tests-v2/behaviors/`
  asserting an agent does NOT write test files under `.issues/`.

  - R-8. All text fixes SHALL use stable anchors (section names), not line numbers,
  given confirmed line-number drift.

  - R-9. All changes SHALL be confined to the `.opencode` submodule; no root repo
  (`opencode-config`) changes.

  - R-10. The behavioral enforcement test SHALL be an artifact-only generator (exit
  0, no self-evaluation) per the canonical framework in `.opencode/tests-v2/AGENTS.md`.


  ## 5. Items


  ### Item 1 (SC-1): Add exclusions list to `.opencode/.issues/AGENTS.md`


  - RED: grep AGENTS.md for the exclusions-list marker (e.g., "never source/test/fixture/code")
  — assert ABSENT (fails before change)

  - GREEN: add the exclusions list stating `.issues/` holds issue metadata only, never
  source/test/fixture/code

  - verify: grep AGENTS.md for the exclusions-list marker — assert PRESENT

  - commit: the AGENTS.md exclusions-list addition


  ### Item 2 (SC-2): Remove `.issues/{N}/tests/` from `red.md`, replace with owning-repo
  principle


  - RED: grep red.md for `.issues/{N}/tests/` — assert PRESENT before change; owning-repo
  reference absent

  - GREEN: remove `.issues/{N}/tests/` as a valid test storage path; add owning-repo
  principle directive

  - verify: grep red.md — assert `.issues/{N}/tests/` ABSENT and owning-repo reference
  PRESENT

  - commit: the red.md test-storage-path correction


  ### Item 3 (SC-3): Clarify artifact retention in `implementation-workflow.md`


  - RED: grep Rule 1 for "metadata only" clarification — assert ABSENT before change

  - GREEN: reframe Rule 1 to state `.issues/{N}/` holds issue metadata only, not arbitrary
  source/test/fixture artifacts

  - verify: grep Rule 1 for metadata-only language — assert PRESENT

  - commit: the implementation-workflow.md Rule 1 clarification


  ### Item 4 (SC-4): Disambiguate artifact copy target in `create.md`


  - RED: grep Step 6 for unambiguous copy-target scope — assert ABSENT before change

  - GREEN: disambiguate Step 6 so only analysis artifacts (not source/test/fixture)
  are copied to `.issues/{N}/artifacts/`

  - verify: grep Step 6 for disambiguated copy-target description — assert PRESENT

  - commit: the create.md Step 6 disambiguation


  ### Item 5 (SC-5): Stop/scope auto-commit of `.issues/` files in `review-prep.md`


  - RED: grep Step 0 for unconditional `git add .issues/` auto-commit — assert PRESENT
  before change

  - GREEN: remove or scope the unconditional auto-commit of dirty `.issues/<N>/` files

  - verify: grep Step 0 for removal/scoping of the unconditional `git add .issues/`
  auto-commit — assert PRESENT

  - commit: the review-prep.md Step 0 auto-commit correction


  ### Item 6 (SC-6): Add behavioral enforcement test for `.issues/` test-write prohibition


  - RED: behavioral test FAILS — agent writes `.issues/` test file (before text fixes,
  or scenario is unguarded)

  - GREEN: add the behavioral enforcement test at `.opencode/tests-v2/behaviors/<scenario>.sh`;
  agent does NOT write `.issues/` test file

  - verify: behavioral test PASSES via `with-test-home opencode run`; stderr-based
  assertions for absence of `.issues/` write actions; Bash tool timeout >= 600s

  - commit: the behavioral enforcement test


  ## 6. Dependencies


  - **Reference:** `.opencode/tests-v2/AGENTS.md` — **Relationship:** the behavioral
  enforcement test (SC-6) MUST follow the canonical artifact-only generator paradigm
  and prompt construction mandate defined here. **Status:** satisfied (canonical framework
  exists).

  - **Reference:** `.opencode/.issues/AGENTS.md` — **Relationship:** SC-1 modifies
  this file; the exclusions list is the authoritative content-type boundary all other
  fixes reference. **Status:** satisfied (file exists).

  - **Reference:** `.opencode/skills/test-driven-development/tasks/red.md` — **Relationship:**
  SC-2 modifies this file. **Status:** satisfied (file exists).

  - **Reference:** `.opencode/skills/writing-plans/reference/implementation-workflow.md`
  — **Relationship:** SC-3 modifies this file. **Status:** satisfied (file exists).

  - **Reference:** `.opencode/skills/spec-creation/tasks/create.md` — **Relationship:**
  SC-4 modifies this file. **Status:** satisfied (file exists).

  - **Reference:** `.opencode/skills/git-workflow-pr/tasks/review-prep.md` — **Relationship:**
  SC-5 modifies this file. **Status:** satisfied (file exists).


