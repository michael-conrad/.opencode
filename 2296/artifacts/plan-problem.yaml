domain: phase-execution
fluents:
  - name: phase_done
    params:
      - name: p
        type: phase
objects:
  - name: phase_2_per_file
    type: phase
  - name: phase_3_post
    type: phase
actions:
  - name: execute_phase
    params:
      - name: p
        type: phase
    preconditions:
      - not phase_done(p)
    effects:
      - phase_done(p)
  - name: execute_phase_3
    params:
      - name: p
        type: phase
    preconditions:
      - not phase_done(p)
      - phase_done(phase_2_per_file)
    effects:
      - phase_done(p)
init: []
goals:
  - phase_done(phase_2_per_file)
  - phase_done(phase_3_post)
