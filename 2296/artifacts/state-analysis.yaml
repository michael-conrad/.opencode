state_analysis:
  issue_number: 2296
  description: "State machine transitions per phase"
  state_machine_phases:
    phase_2_per_file:
      - item: ITEM-1 (SC-1)
        state_transitions:
          - from: "dispatch link [text] = path-restatement"
            to: "dispatch link [text] = purpose condensation"
            trigger: "SC-1 rewrite pass"
            invariant: "URL/path unchanged; link always resolves; condensation faithful to purpose"
          - from: "condensation rewrite flags non-condensable purpose"
            to: "purpose routed to ITEM-2 correction"
            trigger: "audit finding during rewrite"
            invariant: "No silent skip — flagged purposes must be corrected"
      - item: ITEM-2 (SC-2)
        state_transitions:
          - from: "purpose fails audit criteria"
            to: "purpose corrected (condensable, outcome-as-subject, distinctive)"
            trigger: "SC-2 correction pass"
            invariant: "Semantics preserved; re-checkable via condensation audit"
      - item: ITEM-3 (SC-3)
        state_transitions:
          - from: "playwright-cli/completion-core legacy table format"
            to: "canonical checklist sub-bullets format"
            trigger: "SC-3 conversion"
            invariant: "Dispatch contracts preserved (same tasks, context)"
      - item: ITEM-4 (SC-4)
        state_transitions:
          - from: "audit placeholder link [text] = path template"
            to: "[text] = semantic template"
            trigger: "SC-4 rewrite"
            invariant: "URL path template unchanged; DiMo roles distinguishable"
    phase_3_post:
      - item: ITEM-5 (SC-5)
        state_transitions:
          - from: "no condensation validation gate"
            to: "condensation-format gate active on card create/edit"
            trigger: "SC-5 add gate"
            invariant: "Gate is structural, not behavioral; PASS on compliant, FAIL on path-restatement"
      - item: ITEM-6 (SC-6)
        state_transitions:
          - from: "§4 no purpose-source spec"
            to: "§4 purpose = dispatch-anchor source (condensable, outcome-subject, distinctive)"
            trigger: "SC-6 doc update"
            invariant: "Consistent with ITEM-7 template"
      - item: ITEM-7 (SC-7)
        state_transitions:
          - from: "no locked dispatch template"
            to: "locked template: 'You are a sub-agent. Follow the instructions in [<condensation>](<path>). <context-fields>'"
            trigger: "SC-7 doc update"
            invariant: "Consistent with ITEM-6 purpose-source spec"
