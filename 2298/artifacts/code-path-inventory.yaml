spec_path: .opencode/.issues/2298/spec.md
code_paths:
  - id: red-abort-terminal
    scs: [SC-1]
    path: skills/test-driven-development/tasks/red.md
    description: "red.md defines a second valid terminal state: classified ABORT returned as status: BLOCKED with a blocker_reason classification."
  - id: green-abort-terminal
    scs: [SC-2]
    path: skills/test-driven-development/tasks/green.md
    description: "green.md defines a second valid terminal state: classified ABORT returned as status: BLOCKED with a blocker_reason classification."
  - id: red-classifications
    scs: [SC-3]
    path: skills/test-driven-development/tasks/red.md
    description: "RED abort protocol enumerates ALREADY_GREEN, FALSE_PREMISE, NOT_RELEVANT, CONFLICT as blocker_reason values."
  - id: green-classifications
    scs: [SC-4]
    path: skills/test-driven-development/tasks/green.md
    description: "GREEN abort protocol enumerates NO_PURPOSE, IMPOSSIBLE, CONFLICT, SCOPE_CREEP, BAD_TEST_NEEDS_REVISION as blocker_reason values."
  - id: abort-is-completion
    scs: [SC-5]
    path: skills/test-driven-development/tasks/red.md, skills/test-driven-development/tasks/green.md
    description: "Both cards state returning a classified abort IS task completion; prohibit forcing outcome, modifying a test to make it fail, and looping."
  - id: post-abort-routing
    scs: [SC-6]
    path: skills/test-driven-development/tasks/red.md, skills/test-driven-development/tasks/green.md
    description: "Both cards contain post-abort routing: cold-reading re-evaluation sub-agent -> spec-creation --task revise / writing-plans --task revise."
  - id: substantive-classification
    scs: [SC-7]
    path: skills/test-driven-development/tasks/red.md, skills/test-driven-development/tasks/green.md
    description: "Both cards contain guidance that the re-evaluation sub-agent autonomously classifies the adjustment as substantive (re-auth) or non-substantive (auto-revise)."
  - id: retrigger-ladder
    scs: [SC-8]
    path: skills/test-driven-development/tasks/red.md, skills/test-driven-development/tasks/green.md
    description: "Both cards contain retrigger ladder: after 2 same-classification aborts, dispatch re-decomposition/rework evaluation; spec-audit only if re-decomposition is NOT the fix."
  - id: self-containment
    scs: [SC-9]
    path: skills/test-driven-development/tasks/red.md, skills/test-driven-development/tasks/green.md, skills/test-driven-development/tasks/operating-protocol.md
    description: "Abort protocol present in red.md and green.md; negative check that operating-protocol.md does NOT contain it."
  - id: behavioral-scenario
    scs: [SC-10]
    path: tests-v2/behaviors/<scenario>.sh
    description: "Behavioral enforcement test (ALREADY_GREEN case) asserting the sub-agent returns a classified abort instead of looping."
  - id: bad-test-shuffle
    scs: [SC-11]
    path: skills/test-driven-development/tasks/green.md
    description: "GREEN abort protocol defines BAD_TEST_NEEDS_REVISION classification with shuffle-to-RED routing: abort via status: BLOCKED, blocker_reason: BAD_TEST_NEEDS_REVISION."
