spec_path: .opencode/.issues/2298/spec.md
concerns:
  - id: red-abort-protocol
    name: "RED classified-abort terminal state"
    scs: [SC-1, SC-3, SC-5, SC-9]
    phase_boundary: "Phase 1 (red.md)"
    target_file: skills/test-driven-development/tasks/red.md
    notes: "red.md defines a classified ABORT terminal state (status: BLOCKED + blocker_reason), enumerates ALREADY_GREEN/FALSE_PREMISE/NOT_RELEVANT/CONFLICT, states abort-is-completion, and keeps the protocol self-contained (not in operating-protocol.md)."
  - id: green-abort-protocol
    name: "GREEN classified-abort terminal state"
    scs: [SC-2, SC-4, SC-5, SC-9, SC-11]
    phase_boundary: "Phase 2 (green.md)"
    target_file: skills/test-driven-development/tasks/green.md
    notes: "green.md defines a classified ABORT terminal state, enumerates NO_PURPOSE/IMPOSSIBLE/CONFLICT/SCOPE_CREEP/BAD_TEST_NEEDS_REVISION, states abort-is-completion, defines shuffle-to-RED routing for BAD_TEST_NEEDS_REVISION, and keeps the protocol self-contained."
  - id: orchestrator-routing
    name: "Orchestrator post-abort routing and re-evaluation"
    scs: [SC-6, SC-7, SC-8]
    phase_boundary: "Phase 3 (orchestrator routing)"
    target_file: skills/test-driven-development/tasks/red.md, skills/test-driven-development/tasks/green.md
    notes: "On abort, orchestrator dispatches a cold-reading re-evaluation sub-agent that routes to spec-creation --task revise / writing-plans --task revise; classifies adjustment as substantive (re-auth) or non-substantive (auto-revise); retrigger ladder after 2 same-classification aborts."
  - id: behavioral-enforcement
    name: "Behavioral enforcement test"
    scs: [SC-10]
    phase_boundary: "Phase 4 (behavioral test)"
    target_file: tests-v2/behaviors/<scenario>.sh
    notes: "New behavioral scenario (ALREADY_GREEN case) asserting the sub-agent returns a classified abort instead of looping."
phase_map:
  - phase: "Phase 1"
    concerns: [red-abort-protocol]
    scs: [SC-1, SC-3, SC-5, SC-9]
  - phase: "Phase 2"
    concerns: [green-abort-protocol]
    scs: [SC-2, SC-4, SC-5, SC-9, SC-11]
  - phase: "Phase 3"
    concerns: [orchestrator-routing]
    scs: [SC-6, SC-7, SC-8]
  - phase: "Phase 4"
    concerns: [behavioral-enforcement]
    scs: [SC-10]
