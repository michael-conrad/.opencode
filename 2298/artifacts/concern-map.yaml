spec_path: .opencode/.issues/2298/spec.md
concerns:
  - id: red-abort-protocol
    name: "RED classified-abort terminal state"
    scs: [SC-1, SC-3]
    phase_boundary: "Phase 1 (red.md)"
    target_file: skills/test-driven-development/tasks/red.md
    notes: "red.md defines a classified ABORT terminal state (status: BLOCKED + blocker_reason) and enumerates ALREADY_GREEN/FALSE_PREMISE/NOT_RELEVANT/CONFLICT."
  - id: green-abort-protocol
    name: "GREEN classified-abort terminal state"
    scs: [SC-2, SC-4, SC-11]
    phase_boundary: "Phase 2 (green.md)"
    target_file: skills/test-driven-development/tasks/green.md
    notes: "green.md defines a classified ABORT terminal state, enumerates NO_PURPOSE/IMPOSSIBLE/CONFLICT/SCOPE_CREEP/BAD_TEST_NEEDS_REVISION, and defines shuffle-to-RED routing for BAD_TEST_NEEDS_REVISION."
  - id: abort-is-completion
    name: "Abort-is-completion normative language"
    scs: [SC-5]
    phase_boundary: "Phase 3 (red.md + green.md)"
    target_file: skills/test-driven-development/tasks/red.md, skills/test-driven-development/tasks/green.md
    notes: "Both cards state abort is task completion, not failure, and forbid forcing, test-modification-to-fail, and looping."
  - id: self-containment
    name: "Self-contained abort protocol per card"
    scs: [SC-9]
    phase_boundary: "Phase 4 (red.md + green.md)"
    target_file: skills/test-driven-development/tasks/red.md, skills/test-driven-development/tasks/green.md
    notes: "Full abort protocol is self-contained in red.md and green.md and absent from operating-protocol.md (negative grep)."
  - id: orchestrator-routing
    name: "Orchestrator post-abort routing and re-evaluation"
    scs: [SC-6, SC-7, SC-8]
    phase_boundary: "Phase 5 (orchestrator routing)"
    target_file: skills/test-driven-development/tasks/red.md, skills/test-driven-development/tasks/green.md
    notes: "On abort, orchestrator dispatches a cold-reading re-evaluation sub-agent that routes to spec-creation --task revise / writing-plans --task revise; classifies adjustment as substantive (re-auth) or non-substantive (auto-revise); retrigger ladder after 2 same-classification aborts."
  - id: behavioral-enforcement
    name: "Behavioral enforcement test"
    scs: [SC-10]
    phase_boundary: "Phase 6 (behavioral test)"
    target_file: tests-v2/behaviors/<scenario>.sh
    notes: "New behavioral scenario (ALREADY_GREEN case) asserting the sub-agent returns a classified abort instead of looping."
phase_map:
  - phase: "Phase 1"
    concerns: [red-abort-protocol]
    scs: [SC-1, SC-3]
  - phase: "Phase 2"
    concerns: [green-abort-protocol]
    scs: [SC-2, SC-4, SC-11]
  - phase: "Phase 3"
    concerns: [abort-is-completion]
    scs: [SC-5]
  - phase: "Phase 4"
    concerns: [self-containment]
    scs: [SC-9]
  - phase: "Phase 5"
    concerns: [orchestrator-routing]
    scs: [SC-6, SC-7, SC-8]
  - phase: "Phase 6"
    concerns: [behavioral-enforcement]
    scs: [SC-10]
