# Concern map — issue #2298
# Decomposes the 12 success criteria into concern groups and maps each concern to a phase boundary.

spec_path: .opencode/.issues/2298/spec.md
plan_path: .opencode/.issues/2298/plan.md

concerns:
  - id: concern_red_abort
    name: "RED abort protocol"
    description: "red.md gains a classified-abort terminal state and its RED classification set."
    scs: [SC-1, SC-3]
    phase: 1
    boundary: "red.md self-contained abort terminal state + 4 RED classifications (ALREADY_GREEN, FALSE_PREMISE, NOT_RELEVANT, CONFLICT)."
  - id: concern_green_abort
    name: "GREEN abort contract"
    description: "green.md gains a classified-abort terminal state, its GREEN classification set, and the BAD_TEST_NEEDS_REVISION shuffle-to-RED routing."
    scs: [SC-2, SC-4, SC-11]
    phase: 2
    boundary: "green.md self-contained abort terminal state + 5 GREEN classifications (NO_PURPOSE, IMPOSSIBLE, CONFLICT, SCOPE_CREEP, BAD_TEST_NEEDS_REVISION) + shuffle-to-RED routing."
  - id: concern_abort_is_completion
    name: "Abort-is-completion normative language"
    description: "Both cards state that returning a classified abort IS task completion and forbid forcing/modifying-to-fail/looping."
    scs: [SC-5]
    phase: 3
    boundary: "Both cards gain abort-is-completion normative language and forbidden behaviors."
  - id: concern_self_containment
    name: "Per-card self-containment"
    description: "Abort protocol remains self-contained per card and absent from operating-protocol.md."
    scs: [SC-9]
    phase: 4
    boundary: "Positive grep red.md/green.md; negative grep operating-protocol.md."
  - id: concern_orchestrator_routing
    name: "Orchestrator post-abort routing and re-evaluation"
    description: "Post-abort routing to a cold-reading re-evaluation sub-agent, substantive vs non-substantive classification, retrigger ladder. Orchestrator-side only."
    scs: [SC-6, SC-7, SC-8]
    phase: 5
    boundary: "Both cards gain post-abort routing, substantive/non-substantive classification, and retrigger-ladder guidance."
  - id: concern_behavioral_test
    name: "Behavioral enforcement test (ALREADY_GREEN)"
    description: "New behavioral scenario verifying a classified abort is returned instead of looping."
    scs: [SC-10]
    phase: 6
    boundary: "New scenario + fixture under tests-v2/behaviors/; harness-wired; clean-room session.yaml assertion."
  - id: concern_immediate_abort
    name: "Immediate classified abort + orchestrator-only remediation"
    description: "Both cards state that a sub-agent detecting a BLOCK returns a classified abort with zero further analysis and that remediation is exclusively the orchestrator's responsibility."
    scs: [SC-12]
    phase: 7
    boundary: "Both cards gain immediate-abort-with-zero-further-analysis language and orchestrator-only-remediation statement."

phase_to_concern_map:
  "1": concern_red_abort
  "2": concern_green_abort
  "3": concern_abort_is_completion
  "4": concern_self_containment
  "5": concern_orchestrator_routing
  "6": concern_behavioral_test
  "7": concern_immediate_abort

notes:
  - "Each concern maps to exactly one phase, giving a 1:1 SC-group-to-phase mapping (per-SC decomposition preserved at item level)."
  - "Concerns 1 and 2 are independent (red.md vs green.md). Concerns 3, 4, 5, 7 all touch both cards and are strictly sequenced to avoid same-file edit conflicts."
