# Structure artifact — issue #2298
# Phase decomposition, dependency DAG, and skill+task selection.
# Derived from analysis-summary.yaml, sc-summary.yaml, interface-compatibility.yaml, and implementation-workflow reference card.

phase_count: 7
sc_count: 12

phases:
  phase_1:
    name: "RED abort protocol"
    scs: [SC-1, SC-3]
    skill: test-driven-development
    task: red
    target: "skills/test-driven-development/tasks/red.md"
    files:
      - skills/test-driven-development/tasks/red.md
  phase_2:
    name: "GREEN abort contract"
    scs: [SC-2, SC-4, SC-11]
    skill: test-driven-development
    task: green
    target: "skills/test-driven-development/tasks/green.md"
    files:
      - skills/test-driven-development/tasks/green.md
  phase_3:
    name: "Abort-is-completion"
    scs: [SC-5]
    skill: test-driven-development
    task: green
    target: "skills/test-driven-development/tasks/red.md, skills/test-driven-development/tasks/green.md"
    files:
      - skills/test-driven-development/tasks/red.md
      - skills/test-driven-development/tasks/green.md
  phase_4:
    name: "Self-containment"
    scs: [SC-9]
    skill: test-driven-development
    task: red
    target: "skills/test-driven-development/tasks/red.md, skills/test-driven-development/tasks/green.md"
    files:
      - skills/test-driven-development/tasks/red.md
      - skills/test-driven-development/tasks/green.md
  phase_5:
    name: "Orchestrator post-abort routing"
    scs: [SC-6, SC-7, SC-8]
    skill: test-driven-development
    task: green
    target: "skills/test-driven-development/tasks/red.md, skills/test-driven-development/tasks/green.md"
    files:
      - skills/test-driven-development/tasks/red.md
      - skills/test-driven-development/tasks/green.md
  phase_6:
    name: "Behavioral enforcement test"
    scs: [SC-10]
    skill: test-driven-development
    task: red
    target: ".opencode/tests-v2/behaviors/"
    files:
      - tests-v2/behaviors/<scenario>.sh
  phase_7:
    name: "Immediate classified abort / orchestrator-only remediation"
    scs: [SC-12]
    skill: test-driven-development
    task: green
    target: "skills/test-driven-development/tasks/red.md, skills/test-driven-development/tasks/green.md"
    files:
      - skills/test-driven-development/tasks/red.md
      - skills/test-driven-development/tasks/green.md

edges:
  - {from: phase_1, to: phase_3}
  - {from: phase_2, to: phase_3}
  - {from: phase_3, to: phase_4}
  - {from: phase_4, to: phase_5}
  - {from: phase_1, to: phase_6}
  - {from: phase_3, to: phase_7}
  - {from: phase_5, to: phase_7}

triplet_co_location:
  status: verified
  detail: "Each SC maps to exactly one phase (per sc-summary.yaml phase_sc_mapping); the RED, GREEN, and COMMIT steps of each SC item are all assigned to that single phase. No SC has steps split across phases."

cross_phase_dependency:
  status: verified
  detail: "No RED test in an earlier phase depends on SC output from a later phase. Phase-6's behavioral test (SC-10) exercises the red.md abort terminal state from Phase-1 (SC-1) — Phase-6 depends on Phase-1, an ordering consistent with the forward dependency edge phase_1 -> phase_6. All dependency edges point forward (lower-index phase -> higher-index phase)."

skill_task_selection:
  reference: "skills/writing-plans/reference/implementation-workflow.md"
  per_sc_cycle: "RED -> GREEN -> COMMIT"
  post_phase_gates:
    - "verify (verification-before-completion) after each phase GREEN"
    - "z3-check (orchestrator runs tools/solve check) after each phase"
