    description: |
      Tighten the `requires-python` constraint in the PEP 723 header of
      .opencode/tools/plan from `~=3.12` to `>=3.12,<3.14` (excluding CPython 3.14),
      and add a usage note documenting `UV_PYTHON=3.12` as an optional workaround.
    items:
      - item: 1
        sc_id: SC-1
        cycle:
          - red: 'task(..., prompt: "execute red task from test-driven-development")'
          - green: 'task(..., prompt: "execute green task from test-driven-development")'
          - commit: "orchestrator: git add .opencode/tools/plan && git commit"
    skill_tasks:
      red: test-driven-development
      green: test-driven-development
      verify: verification-before-completion
      audit: audit
      structural-checks: finishing-a-development-branch

  phase_2:
    scs: [SC-2]
    description: |
      Verify .opencode/tools/plan resolves and executes under CPython 3.12 via
      `uv run --script`, asserting exit code 0 and no pytamer resolution error.
    items:
      - item: 2
        sc_id: SC-2
        cycle:
          - red: 'task(..., prompt: "execute red task from test-driven-development")'
          - green: 'task(..., prompt: "execute green task from test-driven-development")'
