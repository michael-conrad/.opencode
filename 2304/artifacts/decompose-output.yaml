decompose:
  issue_number: 2304
  issue_repo: .opencode
  topic: "Standardize remote branch-tip terminology across skilldeck and guidelines"

  decomposition_note: "Documentation-only sweep. Each SC maps to exactly one implementation item with its own RED/GREEN/verify/commit cycle. SC-IDs follow the spec's success-criteria table (SC-1 through SC-4 as referenced in the issue's Risk Mitigation section)."

  items:
    - item: 1
      sc_id: SC-1
      description: "Structural scan enforcing zero unqualified branch-tip references remain across .opencode/skills/, .opencode/guidelines/, .opencode/commands/, and AGENTS.md"
      concern: "Terminology coverage completeness"
      input: "All branch-tip prose across the four directories"
      output: "Zero unqualified 'trunk tip', 'dev tip', 'feature-branch tip', hardcoded 'dev'/'master' branch-tip references"
      invariant: "Every branch-tip reference carries the remote qualifier or uses $DEFAULT_BRANCH / origin/$DEFAULT_BRANCH"
      failure_mode: "Sweep misses a site → structural scan fails; re-scan and fix missed sites"
      red_green: "RED: scan shows unqualified sites present; GREEN: scan shows zero remaining"
      evidence_type: "structural"
    - item: 2
      sc_id: SC-2
      description: "Standardize all 'trunk tip' prose sites to 'remote trunk tip' / 'remote $DEFAULT_BRANCH tip'"
      concern: "Trunk-tip terminology"
      input: "~21 unqualified 'trunk tip' lines across pre-work.md, trunk-tip-verification.md, submodule-sync.md, git-workflow/SKILL.md, git-workflow-branch/SKILL.md, submodule-tag-prework.md, 000-critical-rules.md"
      output: "All trunk-tip prose uses remote qualifier"
      invariant: "Agent reads that origin/$DEFAULT_BRANCH tip is authoritative"
      failure_mode: "Missed unqualified trunk tip site"
      red_green: "RED: rg 'trunk tip' (non-remote) finds sites; GREEN: all trunk-tip prose remote-prefixed"
      evidence_type: "structural"
    - item: 3
      sc_id: SC-3
      description: "Verify trunk-tip-verification.md Steps 3/6 fetch+compare against origin remain UNCHANGED"
      concern: "Verification enforcement integrity"
      input: "trunk-tip-verification.md Steps 3/6"
      output: "Steps 3/6 byte-identical to pre-change state"
      invariant: "Documentation-only change; no enforcement logic altered"
      failure_mode: "Prose edit accidentally alters a git command in Steps 3/6"
      red_green: "RED: assertion would detect altered steps; GREEN: steps unchanged"
      evidence_type: "structural"
    - item: 4
      sc_id: SC-4
      description: "Behavioral tests-v2 scenario asserts the agent consults origin/$DEFAULT_BRANCH rather than a stale local tip"
      concern: "Behavioral regression guard"
      input: "tests-v2 behavioral scenario prompt (real-domain) + agent run"
      output: "Agent stderr shows origin/$DEFAULT_BRANCH consultation, not stale local tip"
      invariant: "Behavioral evidence (agent actions visible in stderr), not prose recall"
      failure_mode: "Agent falls back to stale local tip → scenario FAIL"
      red_green: "RED: agent follows old wording and uses local tip; GREEN: agent consults origin/$DEFAULT_BRANCH"
      evidence_type: "behavioral"

  dependency_ordering:
    - "SC-1 (structural scan gate) depends on SC-2 (terminology applied) — scan proves the sweep"
    - "SC-3 (steps unchanged) is independent of the prose sweep — a guard on the same files"
    - "SC-4 (behavioral) depends on SC-2 (wording change in place) so the agent sees new prose"
    dag_acyclic: true
