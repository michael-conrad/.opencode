      text: "Standardize 'trunk tip' prose to 'remote trunk tip' / 'remote $DEFAULT_BRANCH tip' at unqualified prose sites"
      verified_in_codebase: true
      evidence: "F1/F2 — 27 'trunk tip' lines, 6 already remote-prefixed, ~21 unqualified sites in pre-work.md, trunk-tip-verification.md, submodule-sync.md, git-workflow/SKILL.md, git-workflow-branch/SKILL.md, submodule-tag-prework.md, 000-critical-rules.md"
