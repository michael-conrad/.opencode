      verified_in_codebase: true
      evidence: "F3/F5 — dev tip in pre-work.md:187,204, cleanup.md:166,180,329; dev/master hardcoded in rebase-pending.md:283, tag-gate.md:124, verify_merge.sh:57,63, pre-work.md:67,71"
      non_negotiable: true
    - id: REQ-3
