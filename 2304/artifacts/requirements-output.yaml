      non_negotiable: true
    - id: REQ-6
      text: "Full scan of .opencode/skills/, .opencode/guidelines/, .opencode/commands/, and AGENTS.md for all unqualified branch-tip references"
      verified_in_codebase: true
      evidence: "F1-F9 scan completed across all four directories; AGENTS.md verified clean (F7)"
      non_negotiable: true
    - id: REQ-7
      text: "Align all sites with the existing model pattern in create-pr.md ('remote trunk tip SHA') and enforcement-gate.md ('remote trunk HEAD SHAs')"
      verified_in_codebase: true
      evidence: "F6 — create-pr.md:234,237,238 and enforcement-gate.md:32 use the remote-prefixed model"
