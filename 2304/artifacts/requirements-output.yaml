      verified_in_codebase: true
      evidence: "F4 — submodule-tag-feat.md:3, operating-protocol.md:30"
      non_negotiable: true
    - id: REQ-4
      text: "Use $DEFAULT_BRANCH / origin/$DEFAULT_BRANCH vocabulary, not hardcoded branch names"
      verified_in_codebase: true
      evidence: "F5 — the DEFAULT_BRANCH=$(git remote show origin ...) idiom is pervasive; hardcoded 'dev'/'master' must be replaced"
      non_negotiable: true
    - id: REQ-5
      text: "Retire stale 'dev tip' and 'dev'/'master' branch-name terminology"
      verified_in_codebase: true
