# Blast Radius

## Affected Components

| Component | Impact | Ripple Effect |
|-----------|--------|---------------|
| `.opencode/skills/git-workflow-branch/tasks/submodule-sync.md` | DIRECT — the task card text is modified | Sub-agents executing the sync task receive bounded, non-recursive instructions |
| `git-workflow-branch/SKILL.md` | NONE (not modified) | Its dispatch of submodule-sync via `task()` is unchanged; the task card it points to is updated in place |
| `git-workflow/SKILL.md` | NONE (not modified) | Parent skill routing unchanged |
| `reference/submodule-divergence.md` | NONE (not modified) | Shared reference remains; task card still references divergence handling |
| `060-tool-usage.md` | NONE (not modified) | Authoritative source; unchanged |
| `trunk-tip-verification.md` | NONE (not modified) | Its read-only `foreach` verification is out of scope |

## Ripple Effects Per Phase

| Phase | Ripple |
|-------|--------|
| Phase 1 (task card text) | Only the task card file changes; no downstream code/config impact |
| Phase 2 (verification) | Behavioral/text verification of the task card; no runtime impact |

## Scope Boundary

The blast radius is confined to a single markdown task card. No code, config, git behavior, or other skill files are affected. The change is documentation-only.
