# Concern Map

## Concern Boundaries

| Concern | Boundary | Separation |
|---------|----------|------------|
| Scope bounding | Task card must operate only on direct submodule pointers | Kept in the task card's Step 2 preamble; does not leak into divergence handling |
| Recursion prohibition | Task card must forbid nested-submodule recursion and `foreach` | Stated as an explicit constraint in the task card; mirrors the guideline |
| Guideline mirroring | Task card must reflect `060-tool-usage.md` §4 | The guideline is the authoritative source; the task card references/echoes it |
| Explicit per-submodule ops | Task card must direct `git -C <path>` operations | Kept as the operative instruction in Step 2 |
| Divergence handling | `--ff-only` failure resolution | Preserved as a separate, unchanged block in Step 2 |
| False-pointer-flag avoidance | Sync must not report parent pointer changes | Documented as a note in the task card |

## Separation Per Phase

| Phase | Concern Focus |
|-------|---------------|
| Phase 1 | Scope bounding + recursion prohibition + guideline mirroring + explicit per-submodule ops (text edits) |
| Phase 2 | Divergence preservation + false-flag avoidance (verification) |

## Single Concern

Each SC targets one concern and one file category (task card markdown). No concern spans multiple files or domains.
