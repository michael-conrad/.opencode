# Problem Decomposition

## Proposed Success Criteria (derived from requirements)

| SC-ID | Proposed SC | Source Requirements |
|-------|-------------|---------------------|
| SC-1 | The `submodule-sync.md` task card explicitly bounds scope to the parent repo's direct submodule pointers. | REQ-1, REQ-7, CON-3 |
| SC-2 | The task card explicitly forbids recursion into nested submodules and forbids `git submodule foreach` for the sync operation. | REQ-2, REQ-8, CON-2 |
| SC-3 | The task card mirrors the standing no-`--recursive` guideline from `060-tool-usage.md` §4. | REQ-3, CON-1 |
| SC-4 | The task card directs explicit per-submodule operations (not recursive/foreach iteration). | REQ-4, CON-4 |
| SC-5 | The task card's sync procedure does not produce a false "changed submodule" (`+`) flag in the parent repo. | REQ-5 |
| SC-6 | The existing `--ff-only` divergence handling and autonomous resolution logic is preserved unchanged. | REQ-6, NREQ-5 |

