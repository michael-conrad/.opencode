## Existing Patterns and Conventions

### 1. The no-`--recursive` guideline (authoritative source to mirror)

`.opencode/guidelines/060-tool-usage.md` §4 (line 60):

> **NEVER use `--recursive` with any git submodule command** (e.g., `git submodule update --init --recursive`, `git clone --recursive`). The `--recursive` flag can pull in unintended nested submodules, cause unexpected network traffic, break reproducibility by implicitly resolving submodule chains, and conflict with explicit submodule management. Always use `git submodule update --init` (without `--recursive`) or explicit per-submodule operations.

This is the canonical statement of the constraint. The fix to `submodule-sync.md` must mirror this language and intent.

### 2. The task card's current iteration pattern (the defect)

`submodule-sync.md` Step 2:

> - [ ] 2. For each submodule path:
>       - Resolve trunk branch: `DEFAULT_BRANCH=$(git remote show origin ...)`
>       - `git checkout "$DEFAULT_BRANCH" && git pull origin "$DEFAULT_BRANCH" --ff-only`

The step iterates "submodule paths" but does NOT:
- Bound scope to the parent repo's DIRECT submodule pointers
- Prohibit recursion into nested submodules
- Prohibit `git submodule foreach` (which recurses by default into nested submodules)
- Specify explicit per-submodule operations

A literal reading invites `git submodule foreach` recursion, which is the regression.

### 3. The shared divergence reference

`reference/submodule-divergence.md` documents the same `--ff-only` failure handling. It is shared with `pre-work.md` Step 3. The issue scope is the task card only; the reference is noted as a related file but not a modification target.

### 4. Related task cards in the same skill

- `trunk-tip-verification.md` — uses `git submodule foreach` in Steps 4-6 for verification (read-only checks). This is a separate concern (verification, not sync) and is NOT in scope for this issue.
- `pre-commit-pointer-check.md` — verifies submodule pointers staged before commit.

