The `submodule_paths` context variable is passed from the orchestrator. The task card must operate on exactly those direct paths — not recurse.

## Key Findings

1. The defect is a **documentation/instruction defect** in the task card: it fails to bound scope to direct submodule pointers and fails to forbid recursion.
2. The fix is a **task-card text change** — no code, no config, no runtime behavior change to git itself.
3. The authoritative constraint already exists in `060-tool-usage.md`; the fix mirrors it into the task card.
4. The `submodule_paths` context variable already scopes the operation to direct paths; the task card must make that explicit and forbid `foreach`/recursion.
