# Requirements Extraction

## Explicit Requirements

| ID | Requirement | Verified Against |
|----|-------------|------------------|
| REQ-1 | The task card MUST explicitly bound scope to the parent repo's direct submodule pointers. | `submodule-sync.md` Step 2 iterates "submodule paths" without bounding to direct pointers; `submodule_paths` context var already carries direct paths. |
| REQ-2 | The task card MUST forbid recursion into nested submodules. | `submodule-sync.md` has no recursion prohibition; `060-tool-usage.md` §4 forbids `--recursive`. |
| REQ-3 | The task card MUST mirror the standing no-`--recursive` guideline in `060-tool-usage.md` §4. | `060-tool-usage.md` line 60 verified live. |
| REQ-4 | The task card MUST direct the agent to use explicit per-submodule operations rather than recursive/`foreach` iteration. | `060-tool-usage.md` §4: "Always use `git submodule update --init` (without `--recursive`) or explicit per-submodule operations." |

## Implicit Requirements

| ID | Requirement | Rationale |
|----|-------------|-----------|
| REQ-5 | The task card MUST NOT produce a false "changed submodule" (`+`) flag in the parent repo. | Issue point 3: recursion causes the parent to see each submodule pointer diverge from the committed SHA, showing all as `M`/`+`. |
| REQ-6 | The task card MUST preserve the existing `--ff-only` divergence handling and autonomous resolution logic. | The divergence handling is a separate, correct feature; the fix must not regress it. |
| REQ-7 | The task card MUST operate only on the `submodule_paths` passed in dispatch context. | The orchestrator already scopes the operation; the card must honor that scope. |
| REQ-8 | The task card MUST NOT use `git submodule foreach` for the sync operation. | `foreach` recurses into nested submodules by default, which is the regression vector. |

## Constraint Requirements

| ID | Constraint | Source |
|----|-----------|--------|
| CON-1 | No `--recursive` flag on any git submodule command. | `060-tool-usage.md` §4 |
| CON-2 | No `git submodule foreach` recursion for sync. | Issue point 2; `060-tool-usage.md` §4 intent |
| CON-3 | Scope bounded to parent repo's direct submodule pointers. | Issue "Expected behavior" |
| CON-4 | Explicit per-submodule operations only. | `060-tool-usage.md` §4 |

## Non-Requirements

| ID | Non-Requirement | Rationale |
|----|-----------------|-----------|
| NREQ-1 | No change to `trunk-tip-verification.md`'s use of `git submodule foreach` for read-only verification. | Issue scope is the sync task card; verification is a separate concern. |
| NREQ-2 | No change to `reference/submodule-divergence.md`. | Issue names only the task card as affected file. |
| NREQ-3 | No change to `060-tool-usage.md` itself. | The guideline is already correct; it is the authoritative source to mirror. |
| NREQ-4 | No change to git behavior, config, or runtime. | This is a documentation/instruction fix. |
| NREQ-5 | No change to the `--ff-only` divergence resolution logic. | Preserve existing correct behavior. |
