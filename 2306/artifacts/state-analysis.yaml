# State Analysis

## State Machine Transitions Per Phase

| Phase | From State | Transition | To State |
|-------|-----------|------------|----------|
| Phase 1 | Task card invites recursion (unbounded scope, no prohibition) | Add scope bound + recursion prohibition + explicit per-submodule ops | Task card bounds scope to direct pointers, forbids recursion |
| Phase 2 | Task card text updated | Verify divergence block preserved + false-flag avoidance documented | Task card correct and verified |

## Submodule Pointer State (the domain the fix protects)

| State | Description | After Fix |
|-------|-------------|-----------|
| Clean pointer | Submodule pointer matches committed SHA (no `+` prefix) | Preserved — sync operates on direct pointers only |
| Dirty pointer (`+`) | Submodule pointer diverges from committed SHA | Only produced by legitimate direct-pointer sync, not by recursion |
| False dirty (`+`) | Parent sees all submodules as changed due to recursion | ELIMINATED — recursion forbidden |

## Invariants

- The parent repo's submodule pointers are only ever changed by explicit, direct, intended sync operations.
- Recursion never produces a pointer change.
- The `--ff-only` divergence state machine (ahead/behind/rebase/escalate) is preserved unchanged.
