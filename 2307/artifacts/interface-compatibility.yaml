        (R-9).
      direction: source -> target (read)
    - name: DEFAULT_BRANCH resolution pattern
      type: pattern-conformance
      source: ..opencode/skills/git-workflow-branch/tasks/pre-work.md
      target: .opencode/skills/git-workflow/enforcement/url_validation.sh
      constraint: >
        construct_compare_url() MUST reuse the established DEFAULT_BRANCH resolution
        pattern verbatim: `git remote show origin 2>/dev/null | sed -n "s/.*HEAD
        branch: //p"` with a 'main' fallback, to maintain consistency across the
        skill deck (R-2, R-).
      direction: reference (pattern source)
    - name: URL format constraint
      type: format-constraint
      source: .opencode/skills/git-workflow/enforcement/url_validation.sh
      target: compare URL output
      constraint: >
        The compare URL format SHALL NOT change beyond base branch resolution
        (R-9). Only the base default value changes; the template and owner/repo
        character-match verification remain intact (R-7).
      direction: source -> target (emit)
  type_constraints:
    - base: string (branch name, e.g. "master" or "main")
    - DEFAULT_BRANCH: string (branch name, empty when remote HEAD unresolvable)
    - owner: string (must match URL character pattern)
    - repo: string (must match URL character pattern)
