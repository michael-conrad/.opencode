dependency_contract:
  issue_number: 2307
  repo: .opencode
  source: .opencode/skills/git-workflow/enforcement/url_validation.sh
  dependencies:
    - name: base resolution order
      type: variable-resolution
      source: .opencode/skills/git-workflow/enforcement/url_validation.sh (construct_compare_url)
      target: .opencode/skills/git-workflow/enforcement/url_validation.sh (base defaulting logic)
      constraint: >
        The base SHALL resolve in order: explicit --base override (R-4) -> dynamic
        remote HEAD branch (R-2) -> 'main' fallback (R-). The resolution is confined
        to the base defaulting logic in construct_compare_url(); the URL template
