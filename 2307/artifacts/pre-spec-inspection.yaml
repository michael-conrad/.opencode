  compare_url_base_convention:
    - "PR compare URL base is $DEFAULT_BRANCH (the trunk), not 'dev'."
    - "Reference: .opencode/skills/git-workflow-pr/tasks/pr-creation.md line 119."
    - "Reference: .opencode/skills/git-workflow-pr/tasks/review-prep/report-url.md (compare/$DEFAULT_BRANCH...<branch>)."
