z3_solve_expectation:
  tool: .opencode/tools/solve
  consumes: "contract YAML with keys: variables (map name->{type}), preconditions, postconditions, invariants (lists of z3 expr strings)"
  dependency_contract_schema_compatible: true
  evidence:
    - "solve model --contract-path .opencode/.issues/2311/dependency-contract.yaml --query phase_2 -> SAT (phase_1=True, phase_2=True), exit=0"
    - "solve check --contract-path .opencode/.issues/2311/dependency-contract.yaml --state-path .opencode/.issues/2311/artifacts/state-analysis.yaml -> SAT, exit=0"
  extra_keys_ignored: "spec, phases, edges, notes are ignored by solve (it reads only variables/preconditions/postconditions/invariants)"
  reconciliation: "NONE REQUIRED — the dependency_contract schema matches the Z3 solve tool expectation."

planner_expectation:
  tool: .opencode/tools/plan
  consumes: "PDDL-style problem schema via --problem: domain, types, objects, fluents, actions, init, goals"
  accepts_contract_path: false
  accepts_output_flag: false
  dependency_contract_schema_compatible: false
  evidence:
    - "plan plan --help -> usage: plan plan [-h] --problem PROBLEM [--engine ENGINE]"
    - "plan plan --contract-path ... -> error: the following arguments are required: --problem/-p"
  finding: "The plan tool does NOT consume a dependency_contract schema. research.md step 12 literal 'plan plan --contract-path ... --output ...' does not match the actual 'plan plan --problem <file>' interface. This is a research.md<->plan-tool interface mismatch — the same producer/consumer contract-mismatch class the issue targets, but NOT the backfill<->research dependency_contract mismatch (SC-1/SC-2 scope). Already documented as a non-blocking tool-interface observation in structure.yaml notes."
  reconciliation: "OUT OF SCOPE for SC-1/SC-2 — the planner consumes a PDDL problem schema built from the dependency contract, not the dependency_contract schema itself. Does not affect the dependency_contract schema alignment (SC-1/SC-2)."

verdict:
  sc_1: "dependency_contract schema is compatible with the Z3 solve tool (verified SAT). No reconciliation needed."
  sc_2: "producer (backfill.md) and consumer (research.md) agree on the dependency_contract schema; the schema matches the Z3 solve tool. No reconciliation needed."
  risk_1_mitigation: "PASS — the dependency_contract schema cross-checks against the actual Z3 solve tool expectation. The plan-referenced templates are nonexistent (documentation drift); cross-check was performed against the tools themselves."
