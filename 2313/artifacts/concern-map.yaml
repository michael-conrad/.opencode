spec_path: .opencode/.issues/2313/spec.md
concerns:
  - id: pre-work-gate
    name: Pre-work trunk-tip merged-commit verification
    scs: [SC-1]
    phase_boundary: pre-work (before feature branch creation)
    description: Extend trunk-tip-verification with an 8th check verifying each submodule's committed pointer SHA is an ancestor of origin/$DEFAULT_BRANCH, reporting BLOCKED with SUBMODULE_UNMERGED_COMMIT on local-only commits.
  - id: pre-commit-gate
    name: Pre-commit staged-pointer merged-commit verification
    scs: [SC-2]
    phase_boundary: implementation (before commit)
    description: Extend the pre-commit submodule pointer check in implementation.md to verify each newly-staged submodule pointer SHA is reachable from origin/$DEFAULT_BRANCH, blocking commit with a clear error on local-only pointers.
  - id: pr-creation-gate
    name: PR-creation enforcement-gate merged-commit verification
    scs: [SC-3]
    phase_boundary: PR creation (enforcement-gate Step 0)
    description: Extend enforcement-gate Step 0 to verify every committed submodule gitlink SHA exists on origin/$DEFAULT_BRANCH, blocking PR creation with SUBMODULE_PR_MISSING on unmerged commits.
  - id: behavioral-tests
    name: Behavioral enforcement tests
    scs: [SC-1, SC-2, SC-3]
    phase_boundary: verification (test suite)
    description: One behavioral test per SC, sending a real-domain prompt through opencode run and asserting stderr evidence of the verification action or block.
phase_boundaries:
  - pre-work
  - implementation
  - pr-creation
  - verification
