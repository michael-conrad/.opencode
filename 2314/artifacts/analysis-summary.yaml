  scope_summary: |
    Spec #2314 closes the spec-creation → implementation dispatch bypass. A plan-existence
    gate checking the canonical {issues_prefix}/{N}/plan.md path blocks implementation
    dispatch with PLAN_MISSING (Tier 1, non-overridable by authorization) on five deck
    surfaces: spec-creation SKILL.md (SC-1), executing-plans SKILL.md (SC-2), the
    000-critical-rules.md CRITICAL VIOLATION entry (SC-3), the dispatch-vocabulary table
    (SC-4), plus the bypass-path surfaces git-workflow-branch/tasks/pre-work.md (SC-14)
    and test-driven-development/tasks/red.md (SC-15). Behavioral legs (SC-5..SC-8, SC-16,
    SC-17) prove block and permit outcomes via real opencode run stderr evidence.
    Supervision SCs (SC-9..SC-13) require every 2314 behavioral leg to run under the
    tests-v2 §14 semantic continuous monitoring protocol (explicit env flag, §14
    Read-link in run text, monitor evidence artifacts, ≤300s poll cadence with semantic
    checks, hard-abort handling). Revision #5 adds SC-18 (absolute §14-monitor
    termination bound terminating even progressing runs with a
    terminate-with-root-cause record) and SC-19 (fixture issue-store sandbox
    confining the run agent to the injected fixture data).
