# Plan problem — Issue #2314 (.opencode) PLAN_MISSING dispatch gate
# 2-phase DAG from artifacts/structure.yaml: phase-1 (dispatch-gate-logic:
# SC-1 structural gate text + SC-2/SC-3 behavioral gate legs) -> phase-2
# (behavioral-enforcement: SC-4 end-to-end scenario registration + run).
# Actions are the two phase-completion steps.
# Generated 2026-10-01 by writing-plans/tasks/research executor.
domain: plan-missing-dispatch-gate

types:
  - name: phase

objects:
  - name: phase1
    type: phase
  - name: phase2
    type: phase

fluents:
  - name: phase-done
    params:
      - name: p
        type: phase

actions:
  - name: implement-dispatch-gate
    preconditions:
      - not phase-done(phase1)
    effects:
      - phase-done(phase1)

  - name: run-behavioral-enforcement
    preconditions:
      - phase-done(phase1)
      - not phase-done(phase2)
    effects:
      - phase-done(phase2)

# Closed-world init: all fluents default False (per #2434 lesson — no explicit
# `not` init entries; empty init = all phase-done false, the true pre-implementation state).

goals:
  - phase-done(phase1)
  - phase-done(phase2)
