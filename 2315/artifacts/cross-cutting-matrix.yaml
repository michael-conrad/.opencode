    description: "SC-9's evidence is produced by an isolated opencode run whose validity depends on SC-8's purge being COMMITted and PUSHed to a remote ref (incremental-build behavioral ordering) — it spans the text-state concern and the behavioral-evidence concern"
    coupling_risk: "Running the behavioral verification against unpushed deck state produces verdicts about code the branch does not contain; the sweep alone would be EVIDENCE_TYPE_MISMATCH for the behavior claim (spec §4 evidence-type statement)"
