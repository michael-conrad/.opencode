# Phase 2: Documentation and deck srclight purge (SC-6, SC-8, SC-9)
domain: ragsync-adoption-plan
objects:
  - name: p1
    type: phase
  - name: p2
    type: phase
fluents:
  - name: done
    params:
      - name: p
        type: phase
actions:
  - name: run_p1
    params: []
    preconditions:
      - not done(p1)
    effects:
      - done(p1)
  - name: run_p2
    params: []
    preconditions:
      - done(p1)
      - not done(p2)
