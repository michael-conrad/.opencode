# Solve output — issue #2315
# Z3 + planner verification results from research task

solve_model:
  command: "tools/solve model --contract-path .opencode/.issues/2315/dependency-contract.yaml --query z3.And(phase_1, phase_2)"
  status: SAT
  assignment:
    phase_1: true
    phase_2: true
  interpretation: "Goal state (both phases complete) is satisfiable under the dependency precondition phase_2 -> phase_1."

solve_check:
  command: "tools/solve check --contract-path .opencode/.issues/2315/dependency-contract.yaml --state-path .opencode/.issues/2315/artifacts/state-analysis.yaml"
  status: SAT
  assignment:
    phase_1: false
    phase_2: false
  interpretation: "Initial state analysis (all phases false, closed-world) is consistent with the contract. SAT (+ postconditions + invariants)."

planner:
  command: "tools/plan plan --problem .opencode/.issues/2315/artifacts/problem.yaml"
  status: SOLVED_SATISFICING
  engine: tamer
  plan_length: 2
  plan:
    - run_p1()
    - run_p2()
  interpretation: "Planner produced a valid 2-step sequential plan enforcing the phase_1 -> phase_2 dependency. run_p1 precedes run_p2."

solve_status: SAT
plan_status: SOLVED_SATISFICING
notes:
  - "Task-card CLI forms in writing-plans/tasks/research.md steps 10-12 do not match current solve/plan tool signatures. Resolved using actual tool interfaces per prior-issue convention (see #2301, #2133, #2245, #2249)."
  - "solve model: --contract-path + --query <z3 expr> (not --query sat). solve check: --state-path + --contract-path. plan plan: --problem <problem.yaml> (no --contract-path/--output; emits to stdout)."
