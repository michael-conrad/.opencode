# State Analysis — Issue 2315
# Identifies state transitions required by each success criterion.
# Mode: retroactive backfill

spec_path: .opencode/.issues/2315/spec.md
issue_number: 2315

state_transitions:
  - sc: SC-1
    from: ragsync-not-registered
    to: ragsync-registered
    description: >
      The `ragsync` service entry is added to the `.opencode/opencode.jsonc` mcp
      block with `type: local`, `stdio` transport, and `enabled: true`.
    trigger: >
      Config edit adding the `ragsync` entry; verified by JSONC parse and
      enabled-service listing.

  - sc: SC-2
    from: embedding-unconfigured
    to: embedding-configured
    description: >
      RAGSync config references `fastembed` with a pinned default local embedding
      model and no external embedding API dependency.
    trigger: >
      Config edit declaring the fastembed embedding settings and pinned model.

  - sc: SC-3
    from: isolation-undeclared
    to: isolation-declared
    description: >
      One RAGSync config section per reference source corpus with isolated index
      namespaces.
    trigger: >
      Config edit declaring per-source sections with isolated index namespaces.

  - sc: SC-4
    from: checklist-absent
    to: checklist-present
    description: >
      A review checklist exists in the `.opencode` tree enforcing per-source
      isolation.
    trigger: >
      Documentation file added covering per-source isolation enforcement.

  - sc: SC-5
    from: auto-sync-disabled
    to: auto-sync-enabled
    description: >
      Auto-sync enabled for each declared source so the index updates on source
      file changes without manual re-indexing.
    trigger: >
      Config edit enabling auto-sync per source.

  - sc: SC-6
    from: documentation-absent
    to: documentation-present
    description: >
      Documentation exists in the `.opencode` skill/guideline tree covering
      service configuration, per-source layout, usage, offline/cache path, and
      validation step.
    trigger: >
      Documentation file added covering the required topics.

edge_case_transitions:
  - name: empty-source-directory
    description: >
      If a declared source directory is empty, RAGSync SHALL produce an empty
      index for that source without failing other sources. Resolution: document
      per-source empty-handling in the review checklist.
    scs: [SC-3, SC-4]

  - name: embedding-download-failure
    description: >
      If fastembed cannot download the default model on first run, RAGSync SHALL
      fall back to the documented offline/cache path. Resolution: pin a default
      local model and document the offline/cache path (CON-7).
    scs: [SC-2, SC-6]

  - name: malformed-mcp-registration
    description: >
      If the `ragsync` entry is malformed, opencode SHALL reject the config
      rather than silently loading a broken service. Resolution: verify JSONC
      validity in the SC-1 verification step.
    scs: [SC-1]

  - name: cross-source-isolation-misconfigured
    description: >
      If per-source isolation is misconfigured, retrieval SHALL NOT leak material
      between corpora. Resolution: enforce one config section per source and a
      review checklist (CON-6).
    scs: [SC-3, SC-4]

  - name: config-drift
    description: >
      If the RAGSync config and the opencode registration diverge, the agent may
      load a service pointing at stale configuration. Resolution: co-locate and
      validate both, and document the validation step (CON-5).
    scs: [SC-1, SC-6]

  - name: auto-sync-during-active-retrieval
    description: >
      If a source file changes while retrieval is in flight, RAGSync SHALL update
      the index without corrupting in-flight queries. Resolution: rely on
      RAGSync's auto-sync behavior; document that re-sync is non-destructive.
    scs: [SC-5, SC-6]
