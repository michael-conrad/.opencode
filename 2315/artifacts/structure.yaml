# Structure artifact — issue #2315
# Phase decomposition, dependency DAG, skill+task selection
# Generated by writing-plans/tasks/research (2026-09-24)
#
# SC sourcing note: artifacts/sc-summary.yaml is absent from the retroactive
# backfill run. SC definitions, evidence types, and per-SC RED/GREEN/verify/commit
# steps were extracted from the authoritative spec instead:
#   - spec.md §4 Success Criteria (SC-1..SC-9 with evidence types)
#   - spec.md §6 Items (Items 1-9, per-SC RED/GREEN/verify/commit)
#   - analysis-summary.yaml scope_summary + spec §8 Traceability (phase grouping)
# This substitution is recorded here for audit traceability.

phases:
  - id: phase_1
    name: "RAGSync configuration and registration"
    concern: "Register RAGSync as a default local stdio MCP service in .opencode/opencode.jsonc, configure fastembed local embeddings, per-source isolation over the §3.1-designated corpora, the isolation review checklist, auto-sync, and the CON-8-bounded corpus scope"
    scs:
      - SC-1
      - SC-2
      - SC-3
      - SC-4
      - SC-5
      - SC-7
    items:
      - "SC-1: item-01 (register ragsync service entry in .opencode/opencode.jsonc mcp block — type: local, stdio transport, enabled: true; spec Item 1)"
      - "SC-2: item-02 (configure fastembed local embeddings with pinned default local model, no external API dependency; spec Item 2)"
      - "SC-3: item-03 (declare one config section per §3.1-designated corpus — opencode-agent-config, .opencode-deck — with isolated index namespaces; spec Item 3)"
      - "SC-4: item-04 (document the per-source isolation review checklist in the .opencode tree; spec Item 4)"
      - "SC-5: item-05 (enable auto-sync for each declared source; spec Item 5)"
      - "SC-7: item-07 (configure the CON-8-bounded corpus scope — main repo + registered submodules per .gitmodules, non-registered sub-repos excluded; spec Item 7)"
    item_sequence: [item-01, item-02, item-03, item-04, item-05, item-07]
    skill_task:
      skill: test-driven-development
      task: "execute red task from test-driven-development"
    skill_task_green:
      skill: test-driven-development
      task: "execute green task from test-driven-development"
    skill_task_verify:
      skill: verification-before-completion
      task: "execute verify task from verification-before-completion"

  - id: phase_2
    name: "Documentation and deck srclight purge"
    concern: "Document the RAGSync service configuration, per-source layout, usage, offline/cache path, and validation step in the .opencode tree; purge srclight references from the deck tree per the §3.2 disposition rule; verify srclight-free tool-selection behavior"
    scs:
      - SC-6
      - SC-8
      - SC-9
    items:
      - "SC-6: item-06 (document service configuration, per-source layout per §3.1, usage, offline/cache path, and validation step in the .opencode skill/guideline tree; spec Item 6)"
      - "SC-8: item-08 (apply the §3.2 disposition rule across all 46 enumerated deck files — GENERICIZE capability-bearing references, REMOVE product-specific ones; preserve fallback rows; spec Item 8)"
      - "SC-9: item-09 (behavioral srclight-free tool-selection verification via isolated opencode run; spec Item 9 — behavioral variant)"
    item_sequence: [item-06, item-08, item-09]
    skill_task:
      skill: test-driven-development
      task: "execute red task from test-driven-development"
    skill_task_green:
      skill: test-driven-development
      task: "execute green task from test-driven-development"
    skill_task_verify:
      skill: verification-before-completion
      task: "execute verify task from verification-before-completion"

dependency_dag:
  edges:
    - from: phase_1
      to: phase_2
      rationale: "SC-6 documentation covers the service configuration, per-source layout, corpus scope, usage, offline/cache path, and validation step produced in phase 1 — documentation work depends on the configuration being in place (CON-5 config-drift mitigation). SC-8/SC-9 deck-purge work is sequenced in phase 2 per the spec traceability (R-13/R-14 → Phase 2); its text is capability-class worded and carries no product-name coupling to the phase-1 RAGSync registration (CON-10, R-14). Contract edge: z3.Implies(phase_2, phase_1)."
  intra_phase_ordering:
    - within: phase_1
      ordering: "Items execute in spec order (item-01, item-02, item-03, item-04, item-05, item-07); cumulative edits to the shared .opencode/ragsync-config.yaml file. Each SC's RED asserts absence of its own concern, so no SC's RED depends on another SC's GREEN — sequential per-SC TDD cycles on a shared config file."
    - within: phase_2
      ordering: "SC-9's RED behavioral run executes against the pre-purge deck state (before Item 8's GREEN lands in the working tree), and SC-9's verify behavioral run executes only after Item 8's COMMIT and PUSH with a fresh `git fetch` verifying the effective commit is contained in a remote ref (incremental-build behavioral ordering, per spec Item 9). SC-8 must be committed+pushed before SC-9's verify run."

triplet_colocation:
  status: VERIFIED
  notes: "SC-1..SC-5 and SC-7 have RED/GREEN/COMMIT all in phase_1. SC-6 and SC-8 have RED/GREEN/COMMIT all in phase_2. SC-9 is the behavioral variant: RED (pre-purge behavioral run) in phase_2, GREEN delivered by Item 8's genericized deck text in phase_2, COMMIT = Item 8's purge commit in phase_2 (spec Item 9: 'commit: None beyond Item 8's purge commit'). No SC has triplet steps split across phases."

cross_phase_dependency:
  status: VERIFIED
  notes: "No phase_1 RED test depends on phase_2 output (all edges point forward). Phase_2 REDs: SC-6 RED (documentation file absent) and SC-8 RED (sweep returns matches) depend on no phase output; SC-9 RED depends on the deck being in its PRE-purge state — an ordering constraint satisfied by running item-09's RED before item-08's GREEN within phase_2, not a dependency on later-phase output. All dependency edges point from lower to higher phase number. No forward RED dependency."

skill_task_selection:
  - phase: phase_1
    per_sc_cycle: "RED -> GREEN -> COMMIT per SC (SC-1, SC-2, SC-3, SC-4, SC-5, SC-7), one item per SC — no batching"
    pre_regression: "execute phase-0 task from test-driven-development"
    red: "execute red task from test-driven-development"
    green: "execute green task from test-driven-development"
    post_regression: "execute phase-4 task from test-driven-development"
    commit_inline: "orchestrator git add + commit (no sub-agent dispatch)"
    verify: "execute verify task from verification-before-completion"
  - phase: phase_2
    per_sc_cycle: "RED -> GREEN -> COMMIT per SC (SC-6, SC-8), plus SC-9 behavioral variant: RED -> GREEN (delivered by item-08) -> COMMIT (item-08's commit) -> PUSH -> behavioral verify run"
    pre_regression: "execute phase-0 task from test-driven-development"
    red: "execute red task from test-driven-development"
    green: "execute green task from test-driven-development"
    post_regression: "execute phase-4 task from test-driven-development"
    commit_inline: "orchestrator git add + commit (no sub-agent dispatch)"
    push: "behavioral items only (SC-9): push commit to remote branch, fresh git fetch, verify effective commit contained in a remote ref — required BEFORE the behavioral verify run"
    verify: "execute verify task from verification-before-completion"

sc_evidence_types:
  SC-1: behavioral
  SC-2: behavioral
  SC-3: behavioral
  SC-4: structural
  SC-5: behavioral
  SC-6: structural
  SC-7: behavioral
  SC-8: structural
  SC-9: behavioral
  note: "Verbatim from spec §4, including the deliberate evidence-type statement: SC-8 is text-state verified structurally (zero-match sweep); SC-9 is runtime-behavioral and uplifted to behavioral evidence (isolated opencode run) per the evidence-type uplift rule."
