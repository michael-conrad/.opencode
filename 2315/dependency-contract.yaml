    to: phase_2
    rationale: "SC-6 documentation covers the service configuration, per-source layout, usage, local model-cache behavior (caching is NOT pinning — runtime cache kept, offline/cache-path contingency machinery dropped, 2026-09-30 developer correction), and validation step produced in phase 1. Documentation work depends on the configuration being in place. SC-8/SC-9 deck-purge work is sequenced in phase 2 per the spec traceability (R-13/R-14 → Phase 2); its text is capability-class worded and carries no product-name coupling to the phase-1 RAGSync registration (CON-10, R-14)."
notes:
  - "SC-6 (documentation) is sequenced after phase 1 because it documents the configuration artifacts created in phase 1 (CON-5 config-drift mitigation); the phase-1 corpus-scope declaration itself is CON-8-verified at SC-7, not a SC-6 topic criterion."
  - "Spec revision 2026-09-30 (caching-≠-pinning developer correction): SC-2 wording revised (name-only pin + kept local runtime cache + hard-fail semantics; cache-warm refetch observation added to the verify method) — SC set unchanged (SC-1..SC-9), phase SC sets and file targets above remain consistent; no structural change required."
  - "Corpus designation authority is the RAGSync config sources list per spec §3.1: two designated corpora (opencode-agent-config over the main repo working tree; .opencode-deck over the .opencode submodule) with per-corpus include/exclude globs. Source sections outside the CON-8 surface are config defects caught by SC-7 verification."
  - "SC-9 is the behavioral variant item: its RED behavioral run executes against the pre-purge deck state (before Item 8's GREEN lands in the working tree), and its verify behavioral run executes only after Item 8's COMMIT and PUSH with a fresh `git fetch` verifying the effective commit is contained in a remote ref (incremental-build behavioral ordering, per spec Item 9)."
  - "Deck purge scope boundary is the §3.2 sweep exclusion list (.opencode/.git/**, .opencode/.issues/**, node_modules/**, tmp/**, .pytest_cache/**, .ruff_cache/**); the .opencode/.issues/ issue store MUST NOT be rewritten — historical srclight_* references in evidence artifacts are records of past work, not agent-facing instructions (CON-10)."
  - "Revision review 2026-09-30 (validate-findings F-1/F-2/F-3 remediation, validation_pass 3): variables, preconditions, edges, phase SC sets, and file targets re-verified consistent with the revised plan index — no structural change required; the plan.md dispatch-summary drift was index-local and does not touch contract state. Phase-per-step dispatch-mode truth remains normative in the phase files (plan-01/plan-02 per-step indicators) per plan-artifact-format §4.2."
