artifact_name: cross-cutting-matrix
generated_at: 2026-08-25
source: "Spec #2318 (retroactive backfill for pre-existing spec)"
content:
  description: "Cross-cutting concerns spanning multiple SCs"
  cross_cutting_concerns:
    - concern: "Single insertion point for all rule text"
      scs:
        - SC-1
        - SC-2
        - SC-3
        - SC-4
        - SC-5
        - SC-6
        - SC-7
        - SC-8
        - SC-9
      description: "Every SC's deliverable is text inside the same '## Boundaries (Critical)' section of .opencode/AGENTS.md. Co-located edits risk overlapping text regions and contradictory phrasing — apply sequentially with distinct anchors, then inspect the assembled rule as a whole."
      shared_files:
        - ".opencode/AGENTS.md"
    - concern: "Behavioral evidence depends on stderr observability through one harness"
      scs:
        - SC-1
        - SC-2
        - SC-3
        - SC-4
        - SC-5
      description: "All five behavioral SCs assert on opencode run stderr via with-test-home at >=600s timeout. If the harness or model is unavailable, ALL five fail together — per critical-rules-060, structural substitution is forbidden and FAIL is the only valid outcome."
      shared_files:
        - ".opencode/tests-v2/behaviors/"
    - concern: "Generality constraint cuts across mandate and prohibition clauses"
      scs:
        - SC-1
        - SC-2
        - SC-3
        - SC-6
        - SC-7
      description: "Framework-agnostic phrasing (SC-6) and no-hardcoded-commands (SC-7) constrain how SC-1/SC-2 mandates and the SC-3 prohibition may be worded. A clause that names a specific repo's build command satisfies its own SC while violating generality."
      shared_files:
        - ".opencode/AGENTS.md"
    - concern: "Tier classification consistency between rule framing and tier model"
      scs:
        - SC-4
        - SC-5
      description: "HALT-by-default framing (SC-4) and developer carve-out (SC-5) must jointly match critical-rules-018's Tier 2 model: HALT without CRITICAL VIOLATION header, yielding only to explicit developer authorization. Framing them inconsistently breaks both SCs simultaneously."
      shared_files:
        - ".opencode/AGENTS.md"
        - ".opencode/guidelines/000-critical-rules.md"
