## State machine transitions per phase

This spec is a documentation/config change, not a stateful service. The relevant 'state'
is the agent's tool-selection decision state in a multi-module checkout.

## Agent tool-selection state machine (target)
States:
- ROOT_TOOLING: Agent uses root repo build tool or root project-local tools (ALLOWED).
- SUBMODULE_INVENT: Agent creates/alts submodule toolchain without authorization
  (FORBIDDEN → HALT).
- SUBMODULE_AUTHORIZED: Developer explicitly authorizes submodule tooling
  (ALLOWED via carve-out).

Transitions:
- (any) → ROOT_TOOL: default path when build/test needed in multi-module checkout.
- (any) → NO_SUBMODULE_INVENTORY: agent attempts to invent/alter submodule toolchain
  WITHOUT developer authorization → HALT (default).
- NO_SUBMODULE_INVENTORY → SUBMODULE_AUTHORIZED: developer gives explicit authorization
  for intentional submodule tooling setup → proceed.

## Invariants
- A submodule toolchain invention/alteration NEVER proceeds without explicit developer
  authorization (invariant under Phase 1 rule).
- The rule remains framework-agnostic (git submodules AND toolchain-native multi-module)
  (invariant).

## Failure modes
- Rule too vague → HALT not triggered. Mitigation: concrete Tier 2 gate + explicit
  carve-out (per spec Impact mitigation).
- Over-reach → blocks intentional submodule tooling. Mitigation: explicit dev-auth
  carve-out.
- Repo-specific wording → not general. Mitigation: framework-agnostic phrasing SC-3.
