## Behavioral evidence requirement
Per EVIDENCE_TYPE_MISMATCH gate (critical-rules-BEH-EV), SC-1 and SC-2 are
runtime-behavioral (they change WHAT the agent does at runtime: tool selection and
HALT/carve-out dispatch). Evidence MUST be behavioral (opencode run stderr assertions),
NOT structural/grep. If the behavioral test cannot execute, the SC is FAIL — no
structural substitution (critical-rules-060).

## Test harness
- Mandatory wrapper: bash .opencode/tests-v2/with-test-home opencode run '<message>'
  (never direct opencode run).
- Timeout >= 600s for 35B model inference (per tests-v2/AGENTS.md §10.2).
- Behavioral evidence read from stderr (skill dispatches, file reads, tool invocations),
  not stdout prose recall.
