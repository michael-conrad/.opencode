title: '[SPEC] Root-repo-only tooling in multi-module checkouts'
status: open
labels:
- needs-approval
- spec-draft
body: '> Full spec and plan artifacts: https://github.com/michael-conrad/.opencode/tree/issues-data/N/


  ## Problem


  In a multi-module checkout (git submodules or a toolchain''s native multi-module
  arrangement), the AI agent invents and alters submodules to add dedicated tooling
  (package.json/build.gradle/Node/gradle/etc.) that immediately conflicts with the
  root repo''s existing toolkit and project-local tools. This produces competing toolchains,
  wasted work, and build/test breakage.


  ## Scope


  - Add a process-integrity rule requiring agents to use ONLY the root repo''s build
  tool (e.g. gradlew/build.gradle) or the root repo''s project-local tools (per guideline
  `085-project-local-tools.md`) for build and test in a multi-module checkout.

  - Prohibit creating or modifying submodules to add competing toolchains.

  - Classify as Tier 2 (process-integrity): HALT by default when a submodule toolchain
  is invented or altered; a developer may explicitly authorize setting up submodule
  tooling.

  - Keep guidance framework-agnostic (git submodules OR toolchain-native multi-module)
  and general (applies to any repo using this config) — no hardcoded repo-specific
  build commands.

  - Update `.opencode/AGENTS.md` (canonical agent rules) and/or any referenced guideline/skill
  as the sub-agent determines appropriate.


  **Out of scope:**

  - Any change to a specific repo''s build configuration or toolchain.

  - Hardcoding repo-specific build commands or tool names.

  - Automatic remediation of existing conflicting submodule toolchains.


  ## Approach


  Author the new process-integrity rule in the canonical agent rules so it is carried
  into every repo that consumes this config. The rule states that in a multi-module
  checkout, build and test must use only the root repo''s build tool or its project-local
  tools, and that submodules may not be created or modified to add competing toolchains.
  Enforce at Tier 2 (process-integrity): default HALT on invention/alteration of a
  submodule toolchain, with an explicit developer-authorized carve-out for setting
  up submodule tooling. Keep the phrasing general and framework-agnostic so it applies
  uniformly across git submodules and toolchain-native multi-module arrangements.


  ## Impact


  - Risk: Rule is too vague to enforce. Mitigation: phrase as a concrete Tier 2 gate
  with explicit HALT plus developer-authorization carve-out.

  - Risk: Conflicts with legitimate submodule-local tooling that is intentional. Mitigation:
  the developer-authorization path explicitly covers intentional submodule tooling
  setup.

  - Risk: Repo-specific wording limits generality. Mitigation: keep guidance framework-agnostic
  and free of repo-specific build commands.


  **Dependencies:** canonical `.opencode/AGENTS.md`; guideline `085-project-local-tools.md`
  referenced for project-local tools.


  🤖 OpenCode (deepseek-v4-flash) created

  '
