blast_radius:
  issue: 2319
  repo: .opencode
  phases:
    - phase: 1
      sc: SC-1
      description: "Define composite token form {owner}/{repo}#NNN"
      affected_components:
        - ".opencode/guidelines/*.md (token grammar definition)"
        - ".opencode/reference/skill-card-description-standards.md (documentation)"
      ripple_effects:
        - "Establishes the grammar all downstream consumers parse."
      risk: low
    - phase: 2
      sc: SC-2
      description: "Replace three-field context contracts with single issue_ref"
      affected_components:
        - ".opencode/skills/*/SKILL.md (23 files matching issue_number.*github.owner.*github.repo)"
        - ".opencode/skills/audit/SKILL.md"
        - ".opencode/skills/issue-operations/SKILL.md"
        - ".opencode/skills/spec-creation/SKILL.md"
        - ".opencode/skills/writing-plans/SKILL.md"
      ripple:
        - "Workflows dispatch-contract lint (R4) expects Context to supply Entry Criteria params; issue_ref must be supplied where issue_number was required."
    - phase: 3
      sc: SC-3
      description: "Remove direct platform API calls with bare issue numbers from non-MCP task cards"
      affected_components:
        - ".opencode/skills/audit/tasks/plan-fidelity-investigator.md"
        - ".opencode/skills/audit/tasks/plan-fidelity-validator.md"
        - ".opencode/skills/audit/tasks/drift-detection-investigator.md"
        - ".opencode/skills/audit/tasks/guideline-audit-investigator.md"
        - ".opencode/skills/audit/tasks/guideline-audit-validator.md"
        - ".opencode/skills/audit/tasks/read-issue.md (if present)"
      ripple:
        - "These task cards must delegate to issue-operations dispatcher instead of direct github_issue_read."
        - "github-mcp/tasks/spec-mirror.md and local/tasks/pull-body.md (platform sets) are exempt and consume qualified composite."
    - phase: 4
      sc: SC-4
      description: "Add guideline rule for composite parse convention"
      affected_components:
        - ".opencode/guidelines/*.md (rule addition)"
      ripple:
        - "Guideline references spec_issue_number carve-out for artifact paths."
    - phase: 5
      sc: SC-5
      description: "Add skildeck semantic lint rule"
      affected_components:
        - ".opencode/tools/impl/skildeck/skildeck-lint"
        - ".opencode/tools/skildeck (dispatcher)"
      ripple:
        - "Lint output feeds skill enforcement tests; new rule must not false-positive on issue_ref or spec_issue_number."
    - phase: 6
      sc: SC-6
      description: "Update task cards to consume composite issue_ref"
      affected_components:
        - ".opencode/skills/audit/tasks/*.md (89 matches)"
        - ".opencode/skills/issue-operations*/**/tasks/*.md"
        - ".opencode/skills/spec-creation/**/tasks/*.md (42 matches)"
        - ".opencode/skills/writing-plans/**/tasks/*.md (39 matches)"
      ripple:
        - "Entry Criteria / Dispatch Contract param names change from issue_number to issue_ref; workflow SKILL.md Context must match."
