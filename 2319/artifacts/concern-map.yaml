concern_map:
  issue: 2319
  repo: .opencode
  concerns:
    - concern: "Issue identity token form"
      description: "The composite {owner}/{repo}#NNN grammar and its derivation semantics."
      phases:
        - SC-1 (define)
        - SC-4 (guideline rule)
      separation: "Token definition is a separate concern from consumption. Defining in SC-1/SC-4 keeps the grammar stable while SC-2/SC-3/SC-6 consume it."
    - concern: "Context contract shape"
      description: "The shape of data passed in SKILL.md Workflows 'context passed' contracts."
      phases:
        - SC-2 (replace three-field with issue_ref)
      separation: "Contract-shape change is distinct from token grammar and from lint tooling."
    - concern: "Platform API call placement"
      description: "Where direct github_issue_read(issue_number=N) calls are permitted (only in MCP/platform task-card sets)."
      phases:
        - SC-3 (remove from non-MCP cards)
      separation: "Separate from contract shape; governs call location/routing."
    - concern: "Lint enforcement"
      description: "skildeck semantic rule flagging concrete bare issue references."
      phases:
        - SC-5 (add lint rule)
      separation: "Lint rule is enforcement tooling, distinct from the token definition and contract changes."
    - concern: "Task-card consumption"
      description: "Updating task-card procedures to parse owner/repo/issue_number from issue_ref."
      phases:
        - SC-6 (update task cards)
      separation: "Consumption updates are separate from contract-shape changes and lint tooling; they are the behavioral surface."
  boundaries:
    - "Token grammar/parse-rule (SC-1, SC-4) vs consumption (SC-2, SC-6)."
    - "Contract shape (SC-2) vs API-call placement (SC-3)."
    - "Lint tooling (SC-5) vs task-card content (SC-6)."
