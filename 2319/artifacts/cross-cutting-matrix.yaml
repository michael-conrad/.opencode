cross_cutting_matrix:
  issue: 2319
  repo: .opencode
  cross_cutting_concerns:
    - concern: "Contract-shape consistency"
      description: "issue_ref replaces three-field { issue_number, github.owner, github.repo } everywhere the composite is required."
      affected_phases:
        - SC-2
        - SC-6
      interaction: "SC-2 changes SKILL.md contracts; SC-6 changes task cards. Both must agree on the issue_ref name and grammar from SC-1."
    - concern: "Derived-variable carve-out (spec_issue_number)"
      description: "Permitted for artifact path construction across audit and task cards."
      affected by: SC-4
      interaction: "SC-4 defines the carve-out; SC-6 applies it; SC-5 lint must not flag spec_issue_number."
    - concern: "Platform API routing"
      description: "Direct github_* calls only in MCP/platform task-card sets; non-MCP cards delegate to issue-operations."
      affected by: SC-3
      interaction: "SC-3 removes bare calls from non-MCP cards; platform cards (github-mcp/spec-mirror, local/pull-body) consume qualified composite."
    - concern: "Lint enforcement"
      description: "skildeck lint flags concrete bare issue refs while permitting derived vars and composite."
      affected by: SC-5
      interaction: "SC-5 lint rule is the mechanical gate; must align with SC-4 carve-out and SC-3 call-placement rule."
    - concern: "Token grammar stability"
      description: "{owner}/{repo}#NNN grammar, no platform."
      affected by: SC-1, SC-4
      interaction: "All consumers (SC-2, SC-3, SC-5, SC-6) depend on the grammar defined in SC-1 and the parse convention in SC-4."
