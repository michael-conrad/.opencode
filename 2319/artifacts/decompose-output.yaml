decomposition:
  issue: 2319
  repo: .opencode
  note: "Each SC maps to exactly one implementation item with its own RED/GREEN/verify/commit cycle."
  items:
    - id: item-1
      sc_id: SC-1
      description: "Define composite issue reference form {owner}/{repo}#NNN as the single self-describing issue identity token used internally across the deck."
      deliverable: "Canonical token form definition documented (guideline + skill reference)."
      evidence_type: structural
      interfaces:
        input: "None — a definition/convention artifact."
        output: "Token grammar {owner}/{repo}#NNN."
      invariants:
        - "Token is self-describing (carries owner and repo)."
        - "Token carries NO platform."
      failure_modes:
        - "Token form ambiguous or not documented → consumers cannot parse owner/repo/issue_number."
      verify: "Guideline/skill text defines the grammar; skildeck parse rule can derive owner/repo/issue_number from a sample token."
    - id: item-2
      sc_id: SC-2
      description: "Replace all skill-card 'context passed' contracts passing { issue_number, github.owner, github.repo } as three fields with a single composite issue_ref field."
      deliverable: "Updated SKILL.md Workflows context-passed contracts across affected skills."
      evidence: behavioral
      interfaces:
        inputs: "Existing { issue_number, github.owner, github.repo } context contracts."
        outputs: "issue_ref: '{owner}/{repo}#NNN' single field in each affected contract."
      invariants:
        - "No SKILL.md 'context passed' passes the three separate fields."
      failure_modes:
        - "Some skill card still splits owner/repo/issue into three fields."
      verify_target: "Behavioral: dispatch a sub-agent with the new context and confirm it consumes issue_ref, not split fields."
    - id: item-3
      sc_id: SC-3
      description: "Remove direct platform API calls carrying bare issue numbers from non-MCP task cards; such calls belong only in MCP/issue-operations platform task-card sets."
      deliverable: "Updated non-MCP task cards (audit, spec-creation, writing-plans) that no longer carry github_issue_read(issue_number=N) or prose #N for real issues."
      evidence: behavioral
      interfaces:
        inputs: "Bare github_issue_read(issue_number=N) calls in audit/spec-creation/writing-plans task cards."
        outputs: "No bare issue-number platform calls in non-MCP task cards."
      invariants:
        - "github_issue_read(issue_number=N) appears only under issue-operations/platforms/."
      failure_modes:
        - "A non-MCP task card still calls github_issue_read with a bare number."
      verify via: "grep for github_issue_read(issue_number in non-platform task cards returns zero; behavioral dispatch confirms no direct platform calls."
    - id: item-4
      sc_id: SC-4
      description: "Add a guideline rule defining the composite parse convention and the derived-variable carve-out (spec_issue_number) vs forbidden concrete bare issue references."
      deliverable: "Guideline rule added to a guideline file under .opencode/guidelines/."
      evidence: structural
      interfaces:
        inputs: "None — a rule/convention document."
        outputs: "Guideline text permitting spec_issue_number-derived paths; forbidding concrete bare issue refs without qualification."
      invariants:
        - "Derived local variables (spec_issue_number) for artifact path construction remain permitted."
        - "Concrete bare issue numbers referencing a real issue without repo qualification are forbidden."
      failure_modes:
        - "Rule missing or conflicting; carve-out unclear."
      verify: "skildeck lint flags concrete bare refs but does NOT flag spec_issue_number-derived usage."
    - id: item-5
      sc_id: SC-5
      description: "Add a skildeck semantic lint rule flagging concrete bare issue references (#N, github_issue_read(issue_number=N), unconsumed issue tokens) in skill/task cards, permitting the derived-variable carve-out."
      deliverable: "New lint rule function + registration in skildeck-lint script."
      evidence: structural
      interfaces:
        inputs: "skildeck-lint in .opencode/tools/impl/skildeck/."
        outputs: "LintFinding for concrete bare issue refs; no finding for spec_issue_number / issue_ref-compliant refs."
      invariants:
        - "Lint flags concrete bare #N and github_issue_read(issue_number=N) in non-platform cards."
        - "Lint does not flag derived-variable usage (spec_issue_number) or composite issue_ref usage."
      failure_modes:
        - "Rule false-positives on derived variables; or misses concrete bare refs."
      verify: "Run skildeck lint against a fixture; expect PASS on composite/derived, error on concrete bare."
    - id: item-6
      sc_id: SC-6
      description: "Update task files across audit, issue-operations, spec-creation, and writing-plans to consume the composite issue_ref."
      deliverable: "Updated task cards in audit, issue-operations, spec-creation, writing-plans to parse owner/repo/issue from issue_ref and use spec_issue_number-derived local."
      evidence: behavioral
      interfaces:
        inputs: "Bare issue_number in task-card procedures."
        outputs: "Task cards that parse owner/repo/issue_number from issue_ref; use derived local spec_issue_number for artifact paths."
      invariants:
        - "Task cards derive owner/repo/issue_number from issue_ref."
        - "Artifact path construction uses derived local (spec_issue_number)."
      failure_modes:
        - "A task card still consumes a bare issue_number field instead of parsing the composite."
      verify: "Behavioral dispatch of a task card confirms it resolves owner/repo/issue from issue_ref and targets the correct issues path."
  dependency_graph:
    - SC-1 defines the token form consumed by SC-2..SC-6. SC-2 (context contracts) depends on SC-1. SC-4 (guideline rule) and SC-5 (lint rule) depend on SC-1 token definition. SC-6 depends on SC-1 (composite form) and is informed by SC-4 carve-out. SC-3 depends on SC-1. The DAG is acyclic: SC-1 → {SC-2, SC-3, SC-4, SC-5}, SC-6 after SC-1/SC-4.
