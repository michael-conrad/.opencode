pre_spec_inspection:
  issue: 2319
  repo: .opencode
  topic: "Qualify issue references as owner/repo#NNN across the agent deck"
  scope:
    - "Replace three-field issue identity (issue_number, github.owner, github.repo) with a single composite issue_ref: '{owner}/{repo}#NNN'"
    - "Remove direct platform API calls carrying bare issue numbers from non-MCP task cards"
    - "Add skildeck lint rule flagging concrete bare issue references"
    - "Add guideline defining composite parse convention"
  affected_areas:
    - path: ".opencode/skills/audit/tasks/*.md"
      pattern: "issue_number, spec_issue_number, github_issue_read, #N"
      finding: "89 matches. Audit 4-role chain (investigator/validator/evaluator/arbiter) task cards carry spec_issue_number for artifact path construction and github_issue_read(issue_number=N) for cross-reference verification. spec_issue_number is a derived local variable for artifact paths (permitted carve-out). Direct github_issue_read calls in plan-fidelity-*, drift-detection-*, guideline-audit task cards violate SC-3."
    - path: ".opencode/skills/issue-operations/SKILL.md"
      description: "TDT dispatch contracts pass {issue_number} alone to sub-tasks"
      affected: "Trigger Dispatch Table rows pass bare {issue_number} in Context passed. Sub-Agent Routing passes { issue_number, github.owner, github.repo } as three fields."
    - path: ".opencode/skills/issue-operations*/**/SKILL.md and tasks/*.md"
      description: "Platform dispatchers"
      finding: "github-mcp and gitbucket-api SKILL.md carry github.owner/github.repo context. local platform uses local-issues CLI with <repo>#<N> qualified form already."
    - path: ".opencode/skills/spec-creation/**/tasks/*.md"
      description: "spec-creation task cards (analyze, create, validate, revise, reconcile-push)"
      finding: "All dispatch {issue_number} bare. create.md builds paths from {issue_number} and derives owner/repo from session-init Repo Information. Platform routing note says do NOT add platform to token."
    - path: ".opencode/skills/writing-plans/**/tasks/*.md"
      description: "writing-plans task cards (analyze, create, validate, revise, research, backfill, completion, handoff)"
      finding: "All dispatch {issue_number, project_root, issues_prefix}. Uses {issues_prefix}/{N} path resolution, local-issues qualified names <repo>#<N>."
    - path: ".opencode/guidelines/*.md"
      description: "Guideline files carrying issue references"
      finding: "116-pair-mode.md, 020-go-prohibitions.md, 140-planning-spec-creation.md carry issue refs."
    - path: ".opencode/tools/skildeck"
      description: "Skill deck lint tool"
      finding: "skildeck-lint dispatch scripts in .opencode/tools/impl/skildeck/. New semantic lint rule needed to flag bare issue refs (#N, github_issue_read(issue_number=N), unconsumed issue tokens) with derived-variable carve-out."
  existing_patterns:
    - "local-issues CLI already accepts qualified names <repo>#<N> (e.g., .opencode#N, opencode-config#N)."
    - "session-init ## Repo Information resolves issue repo to {path}/.issues/{N}/."
    - "create.md Step 5 resolves owner/repo from session-init Repo Information for the correct issues path."
  dependencies:
    - "skildeck lint semantic rules are added in skildeck-lint script (lint_all) — new rule function or regex pattern."
    - "issue-operations platform dispatcher resolves platform from repo, not from the token (SRM)."
