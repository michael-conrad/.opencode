requirements:
  issue: 2319
  repo: .opencode
  topic: "Qualify issue references as owner/repo#NNN across the agent deck"
  explicit:
    - id: REQ-1
      text: "A composite issue reference form {owner}/{repo}#NNN is defined as the single self-describing issue identity token used internally across the deck (SC-1)."
      verified: true
      evidence: "spec.md SC-1 states the composite form. No existing token in deck uses this composite; current contracts pass three separate fields."
    - id: REQ-2
      text: "All skill-card 'context passed' contracts passing { issue_number, github.owner, github.repo } as three separate fields are replaced with a single composite field issue_ref: '{owner}/{repo}#NNN' (SC-2)."
      verified: true
      evidence: "issue-operations/SKILL.md Sub-Agent Routing passes three fields; 23 SKILL.md files match 'issue_number.*github.owner.*github.repo'. audit/SKILL.md passes spec_issue_number + github.owner."
    - id: REQ-3
      text: "Direct platform API calls in task files carrying a bare issue number (github_issue_read(issue_number=N) or prose #N) are removed from non-MCP task cards; such calls belong only in MCP / issue-operations platform task-card sets, consuming the qualified composite (SC-3)."
      verified: true
      evidence: "audit task cards (plan-fidelity-investigator, drift-detection-investigator, plan-fidelity-validator, guideline-audit-investigator, read-issue.md) carry github_issue_read(issue_number=N) outside issue-operations/platforms/. github-mcp/tasks/spec-mirror.md and local/tasks/pull-body.md (platform set) are exempt."
    - id: REQ-4
      text: "A guideline rule is added defining the composite parse convention: sub-agents derive owner, repo, issue_number from {owner}/{repo}#NNN. Permitted: local derived variables (spec_issue_number) for artifact path construction. Forbidden: any concrete bare issue number referencing a real issue without repo qualification (SC-4)."
      verified: true
      evidence: "spec_issue_number appears in 18 audit task cards as a derived local for artifact paths. No guideline currently defines this convention."
    - id: REQ-5
      text: "The skildeck semantic lint gains a rule flagging concrete bare issue references (#N, github_issue_read(issue_number=N), unconsumed issue tokens) in skill cards and task cards, permitting the derived-variable carve-out (SC-5)."
      verified: true
      evidence: "skildeck-lint script in .opencode/tools/impl/skildeck/ has lint_* functions but no bare-issue-reference rule. New rule function needed and registered in main()."
    - id: REQ-6
      text: "The task files across audit, issue-operations, spec-creation, and writing-plans that currently consume bare issue numbers are updated to consume the composite (SC-6)."
      verified: true
      evidence: "89 matches in audit/tasks, 38 in issue-operations, 42 in spec-creation/tasks, 39 in writing-plans."
  implicit:
    - name: REQ-7
      text: "Platform is NOT part of the token; the platform-aware issue-operations dispatcher resolves platform from the repo. Do not add platform to the composite token."
      verified: true
      evidence: "spec.md Platform / Routing Note."
    - name: REQ-8
      text: "Derived local variables for artifact path construction (spec_issue_number) remain permitted after composite derivation."
      verified: true
      evidence: "SC-4 carve-out; audit task cards use spec_issue_number for {project_root}/tmp/{N}/... path building."
    - name: REQ-9
      text: "The local-issues CLI qualified name (<repo>#<N>) aligns with the composite form and must not be regressed."
      verified: true
      evidence: "local-issues update/read/delete/promote in local platform task cards use <repo>#<N>."
  constraints:
    - name: REQ-10
      text: "Behavioral where the change affects how agents route issue operations; structural for the lint rule and contract-shape changes."
      verified: true
      evidence: "spec.md Success Criteria Evidence Types."
    - name: REQ-11
      text: "Changes live in the .opencode repo (issue 2319 filed against .opencode). Files under .opencode/."
      verified: true
      evidence: "session-init Repo Information: .opencode → michael-conrad/.opencode."
  non_requirements:
    - name: NON-REQ-1
      text: "Platform is not added to the composite token — platform stays resolved by the dispatcher."
      verified: true
      evidence: "spec.md Platform Routing Note explicitly forbids adding platform to the token."
    - name: NON-REQ-2
      text: "The composite token does not replace the local-issues CLI qualified-name scheme; it is consistent with it."
      verified: true
      evidence: "local-issues already uses <repo>#<N> qualified names."
    - name: NON-REQ-3
      text: "The spec does not require changing the issue-operations platform sub-skill routing logic itself (github-mcp/gitbucket-api/local), only the contract shape of context passed."
      verified: true
      evidence: "SC-3 limits changes to non-MCP task cards; platform cards consume the qualified composite."
