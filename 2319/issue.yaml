title: '[SPEC] Qualify issue references as `owner/repo#NNN` across the agent deck'
status: open
labels:
- needs-approval
- spec-draft
body: '> Full spec and plan artifacts: https://github.com/michael-conrad/.opencode/tree/issues-data/2319/


  ## Problem


  Sub-agents receive issue numbers in unqualified bare form (`#N`, `issue_number`,
  `spec_issue_number`), resolve the repository from ambient context, and read or implement
  specs from the wrong repository. This failure is on record: lessons-learned session-2026-06-20
  lesson 4 (systemic cross-repo contamination; the `.opencode/.issues/1308-spec-clean-up-session-enforcement-ts/plan.md`
  incident) and the standing "Wrong repo for spec creation" entry in `.opencode/AGENTS.md`.


  ## Scope


  **In scope:**

  - Define `{owner}/{repo}#NNN` as the single self-describing internal issue identity
  token for every internal handoff whose repository resolves to an owner/repo pair
  (Edge Case 5 governs identity form under `identity_source: local`).

  - Replace all enumerated split-identity Context-passed contracts with the composite
  `issue_ref` field.

  - Remove direct platform API calls carrying bare issue numbers from non-platform
  task cards; such calls concentrate in the platform task-card set consuming the composite.

  - Add guideline `.opencode/guidelines/118-issue-reference-qualification.md` defining
  the parse convention (derived-variable carve-out; bare-reference prohibition), including
  its registration (INDEX.md slot-118 row plus opencode.jsonc instructions-array tier
  decision) so it loads into agent sessions.

  - Extend the skildeck semantic lint (`.opencode/tools/impl/skildeck/skildeck-lint`)
  to flag concrete bare issue references.

  - Update consuming task files in audit, issue-operations, spec-creation, and writing-plans.


  **Out of scope:**

  - Changing the platform dispatch mechanism or adding platform into the token.

  - Changes to the platform sub-skill routing logic itself.


  ## Approach


  Introduce a single self-describing issue identity token (`{owner}/{repo}#NNN`) that
  binds repo identity to the issue number at the point of handoff. Sub-agents consume
  this composite and derive `owner`, `repo`, and `issue_number` locally for artifact-path
  construction under a documented derived-variable carve-out, instead of guessing
  repo identity from an unqualified number. The `skildeck` semantic lint enforces
  the convention mechanically with that carve-out. Platform resolution remains the
  responsibility of the platform-aware issue-operations dispatcher — the token deliberately
  does not carry platform.


  ## Impact


  - **Risk:** Broader contract-shape change across ten enumerated card sites and 21
  non-platform task files — mitigation: the composite is a drop-in replacement consumed
  at the same Context-passed boundary.

  - **Risk:** Lint false positives on legitimate references — mitigation: derived-variable
  carve-out plus fail-fast recovery that rewrites the reference rather than weakening
  the rule.

  - **Risk:** Verification scope spans behavioral evidence for routing changes — mitigation:
  per-SC verification methods are declared in the spec''s Success Criteria table;
  behavioral runs go through `.opencode/tests-v2/with-test-home` and report FAIL (no
  static substitution) when no model is available.

  - **Key dependency:** session-init Repo Information supplies authoritative owner/repo
  values; under `identity_source: local` no composite is fabricated (edge case documented
  in the spec). Guideline registration (INDEX.md slot-118 + opencode.jsonc instructions-array
  decision) is a required GREEN-phase step.


  🤖 OpenCode (opencode/x-preview-f-free) revised exec summary 2026-08-26 — spec-audit
  cycle-2 remediation

  '
