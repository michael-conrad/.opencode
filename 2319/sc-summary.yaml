  - id: "SC-4"
    description: "Guideline rule at .opencode/guidelines/118-issue-reference-qualification.md defines the composite parse convention: sub-agents derive owner, repo, and issue_number from {owner}/{repo}#NNN. Permitted: derived-variable carve-out for artifact-path construction. Forbidden: concrete bare issue references to real issues without repo qualification."
    evidence_type: "behavioral"
