reasoning_evidence:
  root_causes:
    - text: "The enforcement-gate's 'No parent PR needed' wording conflates the submodule-merge event with the root pointer update, so an agent may conclude the pointer is resolved and never commit it. This produces a stale root pointer that breaks downstream builds."
      location: "Section 1 (Root Cause / Motivation)"
  fix_approaches:
    - text: "Revise the agent-facing guidance text (root AGENTS.md §Submodule Pointer Updates, enforcement-gate.md Step 0.5, pre-commit-pointer-check.md, pr-creation.md Pre-Push verification, branch-cleanup.md Step 1.7) so every location states the same unambiguous rule: the pointer rides ALONGSIDE the next real root-repo change and is never dropped and never pushed in a standalone pointer-only commit."
      location: "3. Approach Chosen"
  sc_to_root_cause:
    - sc_id: "SC-1"
      references_root_cause: true
      root_cause_text: "ambiguous root guidance permits pointer-drop"
