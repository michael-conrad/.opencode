# Solve Output — Issue 2320
# Z3 constraint solving + planner evidence for Phase 1.

spec_path: ".opencode/.issues/2320/spec.md"

solve_model:
  command: ".opencode/tools/solve model --contract-path .opencode/.issues/2320/dependency-contract.yaml --query 'z3.BoolVal(True)'"
  status: "SAT"
  note: "Contract declares no variables; query uses trivially-true Z3 expression. Contract preconditions+invariants are satisfiable."

solve_check:
  command: ".opencode/tools/solve check --contract-path .opencode/.issues/2320/dependency-contract.yaml --state-path .opencode/.issues/2320/artifacts/state-analysis.yaml"
  status: "SAT"
  detail: "SAT (+ postconditions + invariants)"
  note: "State transitions satisfy all dependency contract preconditions, postconditions, and invariants."

solve_status: "SAT"
plan_status: "BLOCKED"

plan_result:
  command: ".opencode/tools/plan plan --contract-path .opencode/.issues/2320/dependency-contract.yaml --output .opencode/.issues/2320/artifacts/plan-output.yaml"
  outcome: "CLI_MISMATCH"
  detail: "plan plan requires --problem (domain/problem/plan YAML). It does not accept --contract-path or --output. dependency-contract.yaml is not in the plan tool's expected problem format (domain/types/objects/fluents/actions/init/goals). No plan produced."
  exit: 2

blocker_reason: "PLAN_TOOL_CLI_MISMATCH: research task step 12 specifies 'tools/plan plan --contract-path ... --output ...' but the plan tool CLI requires --problem (a domain/problem YAML) and has no contract-path/output flags. The dependency-contract.yaml is not consumable by plan plan without fabricating a problem file, which is prohibited."
