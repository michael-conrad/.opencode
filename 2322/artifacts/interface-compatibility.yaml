# Interface Compatibility — Issue 2322: [SPEC-FIX] writing-plans research.md step 12 uses invalid plan tool flags
spec: .opencode/.issues/2322/spec.md
interface_boundaries:
  - boundary: plan-tool-invocation-contract
    file: .opencode/tools/plan (plan plan subcommand)
    status: CONSTRAINED
    notes: Live verification — `./.opencode/tools/plan plan --help` accepts ONLY --problem (path to YAML problem file) and --engine (default tamer). NO --contract-path or --output flags exist. The fixed step 12 MUST conform to this contract; argparse failure is the current defect.
  - boundary: solve-tool-contract
    file: .opencode/tools/solve
    status: NOT-MODIFIED
    notes: solve subcommands (check/model/prove/state) keep their --contract-path model. Spec explicitly excludes changes here; the card's conflation of this contract with plan plan is the root cause.
  - boundary: upstream-research-steps-9-11
    file: .opencode/skills/writing-plans/tasks/research.md steps 9-11
    status: COMPATIBLE
    notes: Step 9 extracts dependency_contract into dependency-contract.yaml; step 10 runs solve model; step 11 runs solve check. All unchanged — step 12 consumes their outputs (dependency-contract.yaml phase DAG) as input.
  - boundary: artifact-naming-convention
    file: "{issues_prefix}/{N}/artifacts/{phase-problem.yaml,plan-output.yaml}"
    status: COMPATIBLE
    notes: Names match the resolved-issue evidence pattern (.opencode/.issues/2134/artifacts/ contains phase-problem.yaml and plan-output.yaml; 2166 contains plan-problem.yaml/solve-output.yaml). No downstream consumer breaks.
compatibility_conclusions:
  - Single-file task-card fix; no code interface changes.
  - The corrected invocation must source its problem YAML from the dependency-contract phase DAG (upstream contract preserved) and emit plan output via stdout capture (tool contract preserved).

dependency_contract:
  variables:
    phase_1:
      type: bool
      description: "Rewrite research.md step 12 to the verified problem-driven invocation — SC-1, SC-2"
    phase_2:
      type: bool
      description: "Align Exit Criteria planner-success bullet with corrected invocation semantics — SC-3"
    phase_3:
      type: bool
      description: "Verify all SCs via grep + live flag cross-check — SC-1, SC-2, SC-3"
  preconditions:
    - "z3.Implies(phase_2, phase_1)"
    - "z3.Implies(phase_3, phase_1)"
    - "z3.Implies(phase_3, phase_2)"
  invariants:
    - "plan plan never receives --contract-path or --output"
    - "solve --contract-path model unchanged"
  postconditions:
    - "step 12 reads: build {issues_prefix}/{N}/artifacts/phase-problem.yaml from dependency-contract phase DAG; run ./.opencode/tools/plan plan --problem {issues_prefix}/{N}/artifacts/phase-problem.yaml; capture stdout to {issues_prefix}/{N}/artifacts/plan-output.yaml"
  phases:
    phase_1:
      files:
        - .opencode/skills/writing-plans/tasks/research.md
      scs:
        - SC-1
        - SC-2
    phase_2:
      files:
        - .opencode/skills/writing-plans/tasks/research.md
      scs:
        - SC-3
    phase_3:
      files:
        - .opencode/skills/writing-plans/tasks/research.md
      scs:
        - SC-1
        - SC-2
        - SC-3
  edges:
    - from: phase_1
      to: phase_2
      rationale: "Exit criterion alignment requires the final invocation form from phase 1"
    - from: phase_1
      to: phase_3
      rationale: "Phase 3 verifies SC-1 and SC-2 produced in phase 1"
    - from: phase_2
      to: phase_3
      rationale: "Phase 3 verifies SC-3 produced in phase 2"
  notes:
    - "Phases are sequential (1 -> 2 -> 3). Phase 3 is a verification-only integration gate over all 3 SCs."
