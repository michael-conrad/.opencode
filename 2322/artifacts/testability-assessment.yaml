# Testability Assessment — Issue 2322: Fix research.md step 12 plan-plan invocation
# Backfilled retroactively from spec body by writing-plans/tasks/backfill.md
issue: .opencode#2322
spec_path: .opencode/.issues/2322/spec.md
assessments:
  - sc: SC-1
    evidence_type: string
    rationale: static correctness of an instruction line in a task card
    verification_method: >-
      grep -n 'contract-path\|--output' .opencode/skills/writing-plans/tasks/research.md
      shows no match within step-12's plan plan invocation;
      grep -n 'plan plan --problem' matches inside step 12
    red_condition: defective --contract-path/--output line still present (expected FAIL pre-change)
    green_condition: both greps inverted to PASS post-change
  - sc: SC-2
    evidence_type: string
    rationale: presence of documented construction handoff text
    verification_method: >-
      grep -n 'phase-problem.yaml' inside step 12 together with a dependency-contract
      reference establishing build order before the plan plan invocation
    red_condition: handoff undocumented (expected FAIL pre-change)
    green_condition: grep PASS post-change
  - sc: SC-3
    evidence_type: behavioral
    rationale: documented pattern must execute against the live planner, not merely exist as text
    verification_method: >-
      Write a minimal two-phase phase-problem.yaml per the Definitions mapping under ./tmp/,
      run ./.opencode/tools/plan plan --problem ./tmp/<file>,
      assert exit code 0 and stdout YAML contains status SOLVED_SATISFICING or SOLVED_OPTIMALLY
    red_condition: pattern does not exist or does not solve (exit != 0) pre-change
    green_condition: invocation succeeds with accepted status post-change
    cleanup: remove throwaway problem file from ./tmp/ after PASS (behavioral-evidence retention rules excepted)
enforcement_gate:
  rule: all three SCs MUST pass; single FAIL blocks the spec; partial implementation not permitted
  source: spec "SC Enforcement Gate" section
