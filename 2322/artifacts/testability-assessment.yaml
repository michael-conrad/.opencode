# Testability Assessment — Issue 2322: [SPEC-FIX] writing-plans research.md step 12 uses invalid plan tool flags
spec: .opencode/.issues/2322/spec.md
evidence_types:
  - sc: SC-1
    evidence_type: string
    verification_method: "grep -n 'contract-path\\|--output' .opencode/skills/writing-plans/tasks/research.md shows no match within step 12's `plan plan` invocation; grep -n 'plan plan --problem' matches inside step 12"
    cost_frame: two grep calls
  - sc: SC-2
    evidence_type: string
    verification_method: "grep -n 'phase-problem.yaml' .opencode/skills/writing-plans/tasks/research.md matches inside step 12 together with a `dependency-contract` reference establishing the build order"
    cost_frame: one grep call
  - sc: SC-3
    evidence_type: behavioral
    verification_method: "During verification: write the two-phase problem file under ./tmp/, run `./.opencode/tools/plan plan --problem ./tmp/<file>`, assert exit code 0 and stdout YAML contains `status: SOLVED_SATISFICING` or `status: SOLVED_OPTIMALLY`; remove the throwaway file afterward (behavioral-evidence retention rules excepted)"
    cost_frame: one live tool invocation on a throwaway file
notes:
  - "String SCs (SC-1, SC-2) cost one-to-two grep calls each."
  - "SC-3 is behavioral by the spec's Evidence Type column — it requires real execution of the live tool, not structural inspection of the task-card text."
  - "SC-3 independently confirms the status names asserted at line 60 are the ones the tool emits, closing the loop between the corrected pattern and the unchanged exit criterion."
