# Testability Assessment — Issue 2322: [SPEC-FIX] writing-plans research.md step 12 uses invalid plan tool flags
spec: .opencode/.issues/2322/spec.md
evidence_types:
  - sc: SC-1
    evidence_type: string
    verification_method: "grep research.md step 12 — '--problem' present; '--contract-path' and '--output' absent from the plan plan line"
    cost_frame: one grep call
  - sc: SC-2
    evidence_type: semantic
    verification_method: clean-room checklist — card text contains all three corrected-chain elements (build-from-DAG instruction, exact './.opencode/tools/plan plan --problem {issues_prefix}/{N}/artifacts/phase-problem.yaml' command, stdout-capture redirect to plan-output.yaml); every flag cross-checked against live 'plan plan --help'
    cost_frame: minutes of execution time
  - sc: SC-3
    evidence_type: semantic
    verification_method: consistency check of Exit Criteria bullet against corrected invocation semantics; verifies either already-consistent (no-op valid) or correctly updated
    cost_frame: minutes of execution time
behavioral_uplift_note: >
  Substrate classification — this fix alters task-card text consumed by future agents at pipeline runtime,
  so a supplemental behavioral check is available and recommended: execute the documented shape against a
  real phase-problem.yaml ('./.opencode/tools/plan plan --problem <file>') and observe SOLVED_* stdout.
  The declared string/semantic evidence types cover the spec's content-level SCs; the executable check
  strengthens SC-1/SC-2 verification at negligible cost and MUST NOT be skipped when the implementation
  sub-agent runs verification.
notes:
  - All three SCs are documentation-content checks on a single task card; no unit-test harness exists for task cards.
  - Evidence pattern follows resolved issue 2134 (documentation-content fix classified string/semantic).
