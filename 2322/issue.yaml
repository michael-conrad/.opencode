title: '[SPEC-FIX] writing-plans research.md step 12 uses invalid plan tool flags'
status: open
labels:
- needs-approval
- spec-passed-review
body: '> **Full spec and plan artifacts:** https://github.com/michael-conrad/.opencode/tree/issues-data/2322/

  >

  > **Local artifacts:** `.opencode/.issues/2322/`


  ## Problem


  `.opencode/skills/writing-plans/tasks/research.md` step 12 passes solve-style flags
  (`--contract-path`, `--output`) to the `plan plan` subcommand, which accepts only
  a required `--problem <YAML>` and an optional `--engine` (default `tamer`) — verified
  live against `./.opencode/tools/plan plan --help`. The argument-parsing failure
  hard-blocks the writing-plans research step for ALL plans (step 12 sits unconditionally
  in the task card''s mandatory sequential procedure). Root cause: tool-model conflation
  — contract-driven `solve` semantics misapplied to the problem-driven `plan plan`
  interface.


  ## Scope


  - **In scope:** Fix step 12 in `.opencode/skills/writing-plans/tasks/research.md`
  to use the correct invocation pattern for the `plan plan` subcommand

  - **In scope:** Build `phase-problem.yaml` from the dependency-contract''s phase
  DAG per the mapping in the full spec (§Definitions), then run `./.opencode/tools/plan
  plan --problem {issues_prefix}/{N}/artifacts/phase-problem.yaml > {issues_prefix}/{N}/artifacts/plan-output.yaml`

  - **In scope:** Exit-criterion determination recorded: the step-12 exit criterion
  requires NO change — it already names exactly the success statuses the tool emits
  (`SOLVED_SATISFICING` / `SOLVED_OPTIMALLY`)


  **Out of scope:**


  - **Changes to the `solve` tool or its `--contract-path` model** — the defect is
  the task card''s misuse of solve-style flags, not the `solve` tool itself

  - **Changes to `plan state update` semantics** — unrelated working surface; expanding
  blast radius has no bearing on the defect


  ## Approach


  The corrected pattern — evidenced by resolved issue `.opencode#2134` (`dependency-contract.yaml`
  → `artifacts/phase-problem.yaml` → `artifacts/plan-output.yaml`) — builds a phase-problem
  from the dependency-contract''s phase DAG (fluent per phase variable, action per
  phase ordered by contract preconditions/edges, empty init, all phases as goals)
  and captures stdout. Alternatives rejected: adapting the `plan` tool to accept contract-style
  flags (accommodates the misuse instead of fixing it); citing `.opencode#2166` as
  precedent (its artifact uses a different filename, `plan-problem.yaml` — linkage
  not identical-pattern).


  ## Impact


  - **Risk: research step remains blocked** — Mitigated by fixing the invocation to
  the live-verified working pattern

  - **Risk: wrong pattern copy-pasted elsewhere** — Mitigated by documenting the correct
  `plan plan --problem` pattern and the contract→problem mapping in the task card

  - **Risk: plan-output.yaml capture semantics ambiguous** — Mitigated by explicitly
  defining capture (stdout redirect) and content (full stdout: summary, separator,
  YAML result document; the cited precedent artifact records the YAML result document
  alone)

  - **Dependencies:** `dependency-contract.yaml` and `interface-compatibility.yaml`
  — upstream products of research.md steps 9–11.

  - **Call to action:** Review the fix spec, approve for implementation.


