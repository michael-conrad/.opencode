# Cross-Cutting Matrix — Issue 2324
# Identifies SCs that span multiple concerns and the shared invariants they enforce.

spec_path: ".opencode/.issues/2324/spec.md"
cross_cutting_scs:
  - sc: "SC-1"
    concerns: ["concern-runtime-registry-diagnosis"]
    spans_multiple: false
    note: "Single concern, but its Branch B outcome (R-4 report URL recorded on #2324, BLOCKED state) gates whether Phase 2 can ever execute — a cross-PHASE dependency, not a cross-concern one."
  - sc: "SC-2"
    concerns: ["concern-skill-load-restoration"]
    spans_multiple: false
    note: "Consumes SC-1's probe artifact set; isolated to load-layer verification."
  - sc: "SC-3"
    concerns: ["concern-forpr-gate-execution"]
    spans_multiple: false
    note: "Depends on both SC-1 AND SC-2 being green (spec Items: 'With SC-1 and SC-2 restored'); single concern."

shared_invariants:
  - invariant: "escalation-before-workaround"
    description: "If Branch B holds (fresh runtime also omits the card while all documented preconditions pass), the ONLY permitted action is the R-4 upstream defect report plus BLOCKED on #2324 — never a gate bypass, never closure, never partial pass (Enforcement Gate)."
    scs: ["SC-1", "SC-3"]
    requirements: ["R-4"]
  - invariant: "diagnose-before-modify"
    description: "Exhaustive elimination of every documented discovery precondition precedes any remediation; editing valid SKILL.md frontmatter/content or fabricating a registration-manifest entry is the wrong-locus edit the audit flagged as the primary risk."
    scs: ["SC-1", "SC-2"]
    requirements: []
  - invariant: "gate-no-bypass / plan-executes-before-PR"
    description: "Under for_pr scope, plans execute via executing-plans before PR creation; direct PR creation without plan execution is a CRITICAL VIOLATION per the approval-gate Mandatory Routing Rule."
    scs: ["SC-3"]
    requirements: ["R-3"]

cross_concern_risk:
  - risk: "Branch B halts the entire downstream pipeline"
    mitigation: "R-4 requires the upstream defect report (disk state, frontmatter validation results, permission-config absence, competing-definition absence, registry observation, runtime version) filed and recorded on #2324 before any workaround; resolution resumes the chain when the upstream fix lands."
  - risk: "Partial restoration misdiagnosis (registry lists card but skill() still fails)"
    mitigation: "Item 2 isolates the load-layer failure; both probe artifact sets are captured and attached to the R-4 report to localize the defect for upstream."
  - risk: "Stale host-process snapshot contaminating diagnosis"
    mitigation: "The fresh-runtime reproduction runs through with-test-home isolation so repository state is separated from long-running host-process state; mid-probe deck mutations cannot contaminate observations (harness pins submodule HEAD)."
