# State Analysis — Issue 2324
# Identifies state transitions required by each SC. The relevant state machine is the
# runtime registry/lifecycle state of the executing-plans card and the executability
# of the approval-gate for_pr routing rule that depends on it.

spec_path: ".opencode/.issues/2324/spec.md"
state_machine:
  name: "executing-plans-runtime-lifecycle"
  states:
    - id: "REGISTRY_OMITTED_UNDIAGNOSED"
      description: "Current state: live sessions omit the card from <available_skills> while every documented repo-side discovery precondition verifies clean on disk; defect locus unknown."
    - id: "REGISTRY_OMITTED_HOST_STALE"
      description: "Branch A condition: fresh isolated runtime LISTS the card, so the long-running host process holds a stale process-level snapshot."
    - id: "REGISTRY_OMITTED_RUNTIME_DEFECT"
      description: "Branch B condition: fresh isolated runtime ALSO omits the card with all preconditions holding — a runtime scanner/registry defect."
    - id: "REGISTRY_LISTED"
      description: "A fresh runtime session presents executing-plans among available-skills entries (SC-1 green)."
    - id: "SKILL_LOAD_OK"
      description: "skill({name: \"executing-plans\"}) returns the full card body without a missing-skill error (SC-2 green)."
    - id: "GATE_EXECUTABLE"
      description: "Under for_pr scope with an approved plan, the agent dispatches executing-plans before any PR creation (SC-3 green)."

transitions:
  - sc: "SC-1"
    from: "REGISTRY_OMITTED_UNDIAGNOSED"
    to: "REGISTRY_LISTED"
    trigger: "Fresh-runtime reproduction via bash .opencode/tests-v2/with-test-home opencode run '<probe>' classifies the omission into Branch A or Branch B."
    guard: "Branch A: perform only the operational registry-refresh remediation (restart host runtime process), record it, re-run probe until entry appears. Branch B: execute R-4 — file evidence-backed upstream defect report, record URL on #2324, remain BLOCKED pending upstream; NO workaround permitted."
  - sc: "SC-2"
    from: "REGISTRY_LISTED"
    to: "SKILL_LOAD_OK"
    trigger: "Identical probe invocation of skill({name: \"executing-plans\"}) after Item 1 remediation."
    guard: "Tool result part MUST contain card body (Overview heading) not an error; persistent load failure despite REGISTRY_LISTED captures BOTH artifact sets for R-4 localization (partial restoration edge case)."
  - sc: "SC-3"
    from: "SKILL_LOAD_OK"
    to: "GATE_EXECUTABLE"
    trigger: "Existing behavioral scenario 1364-sc1-for-pr-existing-plan-executing-plans.sh runs clean (bash timeout >= 600s)."
    guard: "Clean-room sub-agent independently evaluates session.yaml dispatch sequence per the two-SC pattern; orchestrator records the verdict; evidence retained under tmp/behavioral-evidence-*."

defect_states_prevented:
  - state: "WRONG_LOCUS_EDIT"
    prevented_by: ["SC-1", "SC-2"]
    description: "Editing valid SKILL.md frontmatter/content or fabricating a registration-manifest entry — impossible anyway (no manifest exists) and excluded by Not Included; diagnose-before-modify forces precondition elimination first."
  - state: "PR_FIRST_BYPASS"
    prevented_by: ["SC-3"]
    description: "for_pr-scoped work reaching PR creation without dispatching executing-plans — classified CRITICAL VIOLATION by the Mandatory Routing Rule; undetectable while the dispatch target cannot resolve."
  - state: "SILENT_PARTIAL_PASS"
    prevented_by: ["SC-1"]
    description: "Closing or partially passing the spec under Branch B — Enforcement Gate forbids closure/workaround/partial pass while BLOCKED pending upstream."

terminal_conditions:
  - condition: "Branch B reached"
    terminal_state: "REGISTRY_OMITTED_RUNTIME_DEFECT (BLOCKED)"
    resume_trigger: "Upstream runtime fix lands -> re-run SC-1 probe and resume the chain."
