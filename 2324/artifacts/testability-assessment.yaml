# Testability Assessment — Issue 2324
# Assigns evidence types to each SC. All three SCs are declared behavioral in the
# spec's Success Criteria table; structural/string substitutes are EVIDENCE_TYPE_MISMATCH.

spec_path: ".opencode/.issues/2324/spec.md"
sc_testability:
  - sc: "SC-1"
    evidence_type: "behavioral"
    verification_method: "Run bash .opencode/tests-v2/with-test-home opencode run '<probe>' where the probe instructs the agent to inspect whether executing-plans appears in its available skills; inspect the exported session.yaml (via .opencode/tools/session-to-timeline) for the registry content presented to the model."
    harness: "with-test-home"
    rationale: "The claim concerns runtime registry state presented to a live model session; only an isolated fresh-runtime observation is ground truth. Structural checks of disk state cannot verify it (all preconditions already verify clean)."
  - sc: "SC-2"
    evidence_type: "behavioral"
    verification_method: "From the same probe artifacts, inspect the session.yaml skill-tool result part: it MUST contain the card body (identifiable by its Overview heading) rather than a skill-not-found error."
    harness: "with-test-home"
    rationale: "skill() resolution is a runtime tool behavior observed in exported session artifacts, not derivable from static files."
  - sc: "SC-3"
    evidence_type: "behavioral"
    verification_method: "Execute the existing behavioral scenario bash .opencode/tests-v2/behaviors/1364-sc1-for-pr-existing-plan-executing-plans.sh (bash tool timeout >= 600 seconds); a clean-room sub-agent evaluates the produced session.yaml per the two-SC pattern (artifact generation plus independent evaluation), and the orchestrator records the verdict."
    harness: "with-test-home"
    rationale: "Dispatch ordering under for_pr authorization is agent runtime behavior; reusing the merged #1364 scenario unchanged keeps verification aligned with how the gate was originally enforced."

notes:
  - "All 3 SCs are behavioral per spec §Success Criteria; no structural or string evidence path exists for any of them."
  - "Behavioral evidence artifacts produced by SC-3 are retained under tmp/behavioral-evidence-* until PR merge cleanup."
