      it MUST contain the card body (identifiable by its Overview heading) rather than a
      skill-not-found error.
    substrate_classification: runtime-behavioral (tool-result content produced by live invocation)
    substitution_prohibited: true

  - sc: SC-3
    evidence_type: behavioral
    verification_method: >-
      Execute existing behavioral scenario bash
      .opencode/tests-v2/behaviors/1364-sc1-for-pr-existing-plan-executing-plans.sh
      (bash tool timeout >= 600 seconds); a clean-room sub-agent evaluates the produced
      session.yaml per the two-SC pattern (artifact generation plus independent evaluation).
    substrate_classification: runtime-behavioral (agent dispatch ordering under for_pr scope)
    substitution_prohibited: true

testability_notes:
  - all_scs_behavioral: >-
      The spec's Success Criteria table declares behavioral evidence for every SC; no structural
      or string evidence type is declared or permitted. Runtime-behavioral changes demand
      behavioral evidence regardless of declaration.
  - harness_requirements: >-
      with-test-home isolation mandatory for SC-1/SC-2 probes; >=600s bash
      tool timeout for SC-3 scenario; stale lock cleanup (rm -f tmp/.behavior-run.lock) before re-runs.
  - evidence_retention: tmp/behavioral-evidence-* artifacts MUST NOT be deleted before PR merge cleanup.
  - failure_handling: >-
      if Branch B holds, SC-1 cannot pass until upstream fix; verdict is FAIL/BLOCKED,
      never a substituted PASS.

cost_frame_reference:
  source: spec Cost Frame section
  principle: Cost is measured in defect-discovery-latency, not tool calls; correctness is the only metric.
