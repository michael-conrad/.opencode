- body: '**Summary:**


    Correction to this issue''s core premise: all four reference documents exist at
    canonical locations — the defect is citation-path drift in `validate.md`, not
    file loss.


    **Outcome:** Diagnosis changes from "missing files anywhere" to "wrong relative
    paths"; remediation Option 3 (repoint citations) is strengthened, and new behavioral
    evidence shows the current state causes nondeterministic halt-vs-pass outcomes.


    ---


    The claim that the four mandatory reference documents "do not exist anywhere"
    is factually wrong. Direct filesystem inspection this session confirms all four
    exist, just not at the paths the citations assume:


    - `.opencode/reference/spec-structure-standards.md`

    - `.opencode/reference/holistic-dimensions.yaml`

    - `.opencode/reference/cost-model-standards.md`

    - `.opencode/audit/reference/decomposition-criteria.md`


    Each is a substantive authority, not a stub: `holistic-dimensions.yaml` carries
    the `spec_dimensions` list validate.md Step 2 expects, `cost-model-standards.md`
    contains the exact "Tiered Cost Table by Evidence Type" section Step 3.5 loads
    its taxonomy from, and `spec-structure-standards.md` is a complete standards document.
    What is genuinely missing is only what the citations resolve to: lines 24, 28,
    30, 34, 40, and 72 of `validate.md` cite `reference/...` relative to the skill
    directory, but `skills/spec-creation/reference/` contains only `sc-table-columns.md`,
    and line 97''s `audit/reference/decomposition-criteria.md` has no counterpart
    under `skills/audit/`. The real files sit one level up, at repo-level `.opencode/reference/`
    and `.opencode/audit/reference/`.


    New behavioral evidence from this session raises the severity beyond dangling
    links. During spec validation of NewSRX-Tech-LLC/xBaseJ#62, identical canonical
    `validate` dispatches produced divergent clean-room outcomes: one validator silently
    resolved the references from the canonical location and returned an aggregate
    PASS, while a later validator searched only the cited skill-relative paths, found
    nothing, and returned BLOCKED with a critical-rules-074 fatal investigation report
    demanding developer restoration of files that exist elsewhere. Nondeterministic
    halt-versus-pass across identical dispatches means validation results depend on
    which path-resolution strategy an individual clean-room validator happens to choose
    — arguably worse than deterministic failure, since a PASS can silently mask dimensions
    that were never evaluated against their declared source of truth.


    This evidence strengthens remediation Option 3 over the others: repointing the
    five citations at the existing authoritative files eliminates both the dangling
    references and the nondeterminism without duplicating content or contradicting
    the single-source-of-truth design that Options 1 and 2 would disturb. Sibling
    task cards citing these same canonical documents should be audited for the identical
    citation-path pattern.


    🤖 Co-authored with AI: OpenCode (opencode/x-preview-f-free)

    '
