- body: 'Dedup result from today''s independent triage (spec-audit/revise session
    on NewSRX-Tech-LLC/xBaseJ#64): this issue **covers** the defect found — commenting
    here rather than filing a duplicate.


    ## Updated evidence (2026-08-26, local checkout mirrors upstream)


    The premise has shifted since this issue was filed: the three reference documents
    now exist, but at the repo root, not in the skill directory — so the live failure
    mode is **path resolution**, not missing files.


    Verified locally just now:


    ```text

    $ ls .opencode/reference/

    cost-model-standards.md

    holistic-dimensions.yaml

    plan-structure-standards.md

    skill-card-description-standards.md

    skill-card-schema.md

    spec-structure-standards.md

    task-card-structure-standards.md


    $ ls .opencode/skills/spec-creation/reference/

    sc-table-columns.md        # still the only file — none of the three cited docs
    present

    ```


    ## Unresolvable citations confirmed


    `validate.md` cites skill-relative `reference/` paths (resolving against `.opencode/skills/spec-creation/`)
    that do not resolve there:


    | Citation | Location |

    |---|---|

    | `reference/spec-structure-standards.md` | `skills/spec-creation/tasks/validate.md`
    Step 1.2 |

    | `reference/holistic-dimensions.yaml` | `skills/spec-creation/tasks/validate.md`
    Steps 2.1, 2.2 |

    | `reference/cost-model-standards.md` | `skills/spec-creation/tasks/validate.md`
    Step 3.5 |

    | `audit/reference/decomposition-criteria.md` | `skills/spec-creation/tasks/validate.md`
    Step 3.7 |


    Canonical copies of the first three live at `.opencode/reference/`.


    ## Additional scope found today: create.md is affected too


    `skills/spec-creation/tasks/create.md` carries the same unresolvable pattern:


    ```text

    create.md:43  Read [spec-structure-standards.md](reference/spec-structure-standards.md)

    create.md:45  Read [cost-model-standards.md](reference/cost-model-standards.md)

    ```


    ## Suggested fix (unchanged in substance)


    Repoint the citations to `.opencode/reference/` (repo-root-relative), or vendor
    canonical copies into each consuming skill''s own `reference/` directory — applied
    to both `validate.md` and `create.md`.


    🤖 Co-authored with AI: OpenCode (opencode/x-preview-f-free)

    '
