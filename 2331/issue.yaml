body: '# GitBucket label/body REST deviations completed; post-create reconciliation
  routes in place


  ## Problem


  Two documentation gaps leave agents unguided on GitBucket-backed stores. The live
  gb-cli card carries the label-route deviation set incompletely and the issue-body
  edit route not at all: it documents the plain-issue `PATCH .../issues/{n}` → 404
  state-mutation gap and the working object-form PUT label route (rule 4, evidenced
  2026-11-18), but an agent following GitHub-standard patterns still has no documentation
  for the label forms that silently destroy all existing labels (raw-array body) or
  are rejected with HTTP 500 (object-form POST), no read-back-after-write guidance,
  and no pointer from the body-route gap to the working `gb issue edit` fallback.
  And the issues/spec flow names no correction route for the filed remote body whose
  number-dependent artifacts pointer can be unresolvable when GitBucket skips consumed
  numbers (observed 2026-11-20: predicted 17, assigned 20) — the observed agent then
  mis-routed its pointer correction and spec-content reconciliation into tracker comments.


  ## Root cause


  The pre-rip deck carried the working routes (attic `issue-operations-core/tasks/body-edit.md:170`);
  the `.opencode#2490` deck rewrite dropped that guidance from the live gb-cli card,
  and the `.opencode#2331` moot closure (2026-10-05) judged the filed defect gone
  with the defective old-format cards without noting the guidance itself was gone.
  The 2026-11-20 failure ran with gb-cli rule 7 (attempt-first) already live: attempt-first
  stops fabricated conclusions but cannot make an agent attempt a command the card
  never names.


  ## Scope


  - Complete the label deviation documentation in `.opencode/skills/gb-cli/SKILL.md`
  (R-1, with the R-3 prohibition)

  - Document the issue-body route in `.opencode/skills/gb-cli/SKILL.md` (R-2)

  - Name the in-place post-create reconciliation route in `.opencode/skills/issues/SKILL.md`
  (R-4)


  **Out of scope:** gb CLI source changes; GitBucket server-side changes; revisiting
  `.opencode#2257`''s local-instance findings; gh-cli card content changes; anything
  beyond deck documentation.


  ## Requirements


  - **R-1** — Labels: the gb-cli card SHALL complete its label-route deviation set
  for the outcomes its rule 4 does not yet carry: object-form POST (`{"labels": [...]}`)
  → HTTP 500, raw-array body (`["label-a", ...]`) silently wiping all existing labels,
  and read-back-after-write guidance for every GitBucket label mutation — with the
  already-documented object-form PUT route (via the `gb api` passthrough) carried
  as the sanctioned form these deviations complete.

  - **R-2** — Bodies: the gb-cli card SHALL extend its documented `PATCH .../issues/{n}`
  → 404 gap to the body case and name the working route: `gb issue edit <N> -t/--title`
  / `-b/--body` is the sanctioned body-edit route whose web fallback ("REST issue
  edit is unavailable on this GitBucket instance; using web fallback") is an agent-runnable,
  non-interactive success path under stored token credentials.

  - **R-3** — The gb-cli card SHALL NOT present `gb issue edit`''s label/assignee
  flags as a working label-mutation path (evidenced failing 2026-10-05; attempt-first
  subject per gb-cli rule 7 on instances without evidence).

  - **R-4** — The issues card SHALL route post-create remote-body reconciliation —
  both an unresolvable artifacts-pointer correction and post-filing spec-body reconciliation
  — through the platform''s native in-place issue-body edit (`gh issue edit` / `gb
  issue edit --body`), never through comments; the route stated once at the flow''s
  owner section and referenced at the pointer-mandate site and the mirror-repair site.


  ## Success criteria


  | ID | Criterion | Class | Instrument |

  |---|---|---|---|

  | SC-1 | Label deviation docs present in the live gb-cli card: object-POST → 500,
  raw-array wipe hazard, read-back-after-write | structural | `grep -n` the card for
  each element; every element hits |

  | SC-2 | Body-route docs present in the live gb-cli card: `gb issue edit`, the body-case
  PATCH-404 wording, web-fallback wording as the agent-runnable success path | structural
  | `grep -n` the card for the three elements |

  | SC-3 | No label-flag capability claim for `gb issue edit` anywhere in the card
  | structural | `grep -n` label-flag capability wording; hits only within the deviation
  statement or absent |

  | SC-4 | Issues card routes post-create reconciliation in place and states corrections
  never route through comments; present at the owner section and referenced at the
  pointer-mandate and mirror-repair sites | structural | `grep -n` the issues card
  at the named sites |

  | SC-5 | A pointer-miss correction flows through exactly one in-place issue-body
  edit with zero comment writes | behavioral | `opencode run` harness scenario on
  a provisioned GitBucket container |


  ## Approach


  Documentation-only, scoped to the live deck cards. The full spec — intent preamble,
  edge cases, dependencies, traceability, documentation sources, and cost frame —
  is local-authoritative at `.opencode/.issues/2331/spec.md`.


  ## Impact


  Silent destruction of issue authorization labels (`needs-approval` / `approved-for-*`)
  destroys the remote authorization record; unexplained 404 dead ends stall mid-flight
  flows; undocumented pointer misses have already produced spec content split across
  a body and comments (2026-11-20 incident, `.opencode#2761`). Consumers: every agent
  operating a GitBucket-backed store through the deck''s cards.


  > Full spec and plan artifacts: https://github.com/michael-conrad/.opencode/tree/issues-data/2331/

  > Artifacts for agent ingest: `.opencode/.issues/2331/`


  🤖 Co-authored with AI: OpenCode (huggingface/zai-org/GLM-5.3-Flash)

  '
