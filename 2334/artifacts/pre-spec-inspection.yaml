      path: project_root
      result: "No files found"
      verdict: "gitignored dirs skipped during traversal (tmp/ gitignored line 66)"
    - pattern: "**/*"
      path: ".opencode/.issues/2325 (nested hidden)"
      result: "3 yaml files returned"
      verdict: "path param bypasses BOTH hidden-skip and gitignore-skip"
  confirmed_limitations:
    - id: LIM-1
      name: hidden-directory traversal skip
      detail: >
        Traversal never enters dot-prefixed directories (.opencode, .issues, .github)
        when scanning via pattern-from-CWD. Any pattern requiring descent into a
        dot-dir returns empty. The ENTIRE agent deck lives under .opencode/.
    - id: LIM-2
      name: gitignore filtering during traversal
      detail: >
        Gitignored dirs (tmp/, .issues/) are excluded from traversal. tmp/ is where
        ALL pipeline artifacts live ({project_root}/tmp/{issue}/...).
    - id: LIM-3
      name: silent-empty conflation
      detail: >
        "No files found" is returned identically for no-match, wrong-pattern,
        hidden-dir-skip, gitignore-skip, and absolute-pattern-rejection. No
        error, no reason, no distinction.
    - id: LIM-4
      name: files-only matching
      detail: >
        Directory entries are never returned. Patterns ending in "/" (e.g.
        **/runbooks/) structurally cannot match anything.
    - id: LIM-5
      name: absolute-pattern rejection
      detail: >
        Absolute paths embedded in the pattern parameter silently return empty.
        Only relative-to-CWD patterns or the path-parameter form work.
    - id: LIM-6
      name: opaque nonexistent-path error
      detail: >
        A nonexistent path parameter yields "ripgrep execution failed" without
        naming the missing path or cause. Not silent, but cryptic.
  reliable_invocation_idiom:
    form: "glob(pattern=<relative-to-path>, path=<target_dir_abs_or_rel>)"
    evidence: >
      Verified working for hidden dirs (.issues/research-cards, .opencode/.issues/2325),
      gitignored dirs would-be cases, and normal tracked dirs. path accepts both
      absolute and relative values.

