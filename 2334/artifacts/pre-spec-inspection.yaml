meta:
  issue: ".opencode#2334"
  title: "[SPEC-FIX] Built-in glob silent failures - document limitations and remediate broken invocations across agent deck"
  inspection_method: >
    Live empirical testing of the built-in glob tool (10 probe invocations against
    this repository) plus full-deck grep for glob invocations. srclight was NOT used:
    srclight indexes Python symbols only (.py); this spec's entire affected surface is
    markdown agent-deck files (.md), which srclight does not index. Tier-1 built-in
    grep/glob/read were used instead per mcp-tool-usage hierarchy.

