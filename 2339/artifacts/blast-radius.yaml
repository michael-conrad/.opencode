# Blast Radius — Issue 2339
# Skill card pre-flight guard for sub-agent dispatch

artifact_date: 2026-08-26
issue_number: 2339
repo: .opencode

## Affected Components and Ripple Effects per Phase

### Phase 1: Canonical guard definition (Item 3)
- Components: `.opencode/reference/skill-card-schema.md`,
  `.opencode/reference/skill-card-description-standards.md`,
  `.opencode/skills/skill-creator/reference/skill-card-spec.md`,
  `.opencode/skills/skill-creator/reference/routing-only-template.md`
- Ripple: Defines the guard wording/behavior that all other phases consume. No
  downstream code impact — documentation only.

### Phase 2: Apply guard to all skill cards (Item 1)
- Components: All 51 SKILL.md files in `.opencode/skills/` (including
  `.opencode/skills/*/platforms/*/SKILL.md`)
- Ripple: Every skill card gains a pre-flight guard section. This is a content
  addition — no change to the opencode binary or skill()/task() tool semantics.
  The guard is inert in orchestrator context (context detection distinguishes
  orchestrator from sub-agent).

### Phase 3: Linting enforcement (Item 2)
- Components: `.opencode/tools/impl/skildeck/skildeck-lint`,
  `.opencode/skills/skill-creator/scripts/validate_skill_cards.py`
- Ripple: New lint/validation rules flag a missing guard. Existing lint/validation
  runs will now report findings for any card that lacks the guard. This is the
  enforcement backstop.

### Phase 4: Template generator (Item 4)
- Components: `.opencode/skills/skill-creator/scripts/init_skill.py`
- Ripple: Newly generated skill cards include the guard. No impact on existing cards.

### Phase 5: Critical rule reference (Item 5)
- Components: `.opencode/guidelines/000-critical-rules.md` critical-rules-XXX section
- Ripple: The critical rule references the guard as the defensive backstop. No
  behavioral change — documentation only.

