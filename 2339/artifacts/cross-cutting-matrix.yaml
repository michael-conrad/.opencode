## Cross-Cutting Concern: Canonical Guard Definition

The canonical guard definition (wording + behavior + `ORCHESTRATOR_ONLY_SKILL_CARD`
reason) is the single cross-cutting concern. It is defined once in Phase 1 and consumed
by Phases 2, 3, 4, and 5. Consistency of this definition across all phases is the
primary cross-cutting risk.

## Cross-Cutting Concern: Context Detection

The guard's context detection (distinguishing orchestrator from sub-agent) is specified
in Phase 1 and implemented in Phase 2. It must not fire in legitimate orchestrator
context (false-positive mitigation per the spec's Impact section).

## Cross-Cutting Concern: Enforcement

Linting/validation enforcement (Phase 3) is the mechanical backstop that ensures the
guard is present. It is the only phase that enforces rather than defines/uses the guard.
