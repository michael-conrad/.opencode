# Solve output — issue #2339
# Z3 + planner verification results from research task

solve_model:
  command: "tools/solve model --contract-path .opencode/.issues/2339/dependency-contract.yaml --query z3.And(phase_1, phase_2, phase_3, phase_4, phase_5, phase_6, phase_7)"
  status: SAT
  assignment:
    phase_1: true
    phase_2: true
    phase_3: true
    phase_4: true
    phase_5: true
    phase_6: true
    phase_7: true
  interpretation: "Goal state (all 7 phases complete) is satisfiable under the dependency preconditions phase_2->phase_1, phase_3->phase_2, phase_4->phase_3, phase_5->phase_3, phase_6->phase_2, phase_7->phase_2."

solve_check:
  command: "tools/solve check --contract-path .opencode/.issues/2339/dependency-contract.yaml --state-path .opencode/.issues/2339/artifacts/state.yaml"
  status: SAT
  assignment:
    phase_1: false
    phase_2: false
    phase_3: false
    phase_4: false
    phase_5: false
    phase_6: false
    phase_7: false
  interpretation: "Initial state (all phases false, closed-world) is consistent with the contract. SAT (+ postconditions + invariants)."

planner:
  command: "tools/plan plan --problem .opencode/.issues/2339/artifacts/problem.yaml"
  status: SOLVED_SATISFICING
  engine: tamer
  plan_length: 7
  plan:
    - run_p1()
    - run_p2()
    - run_p3()
    - run_p4()
    - run_p5()
    - run_p7()
    - run_p6()
  interpretation: "Planner produced a valid 7-step plan enforcing the dependency chain: phase_1 -> phase_2 -> phase_3 -> phase_4 and phase_3 -> phase_5, with phase_6 and phase_7 gated on phase_2. Ordering satisfies all preconditions (p4 needs p3; p5 needs p3; p6/p7 need p2)."

solve_status: SAT
plan_status: SOLVED_SATISFICING
notes:
  - "Task-card CLI forms in writing-plans/tasks/research.md steps 10-12 do not match current solve/plan tool signatures. Resolved using actual tool interfaces per prior-issue convention (see #2301, #2334)."
  - "solve model: --contract-path + --query <z3 expr> (not --query sat). solve check: --state-path + --contract-path (state must be machine-readable; state-analysis.yaml carries a non-machine-readable narrative form, so a machine-readable state.yaml was generated reflecting the same initial closed-world state). plan plan: --problem <problem.yaml> (no --contract-path/--output; emits to stdout)."
  - "Phase ordering was adjusted from the nominal concern-map numbering (SC-1 as phase 1) to satisfy the cross-cutting dependency constraints: the canonical guard definition (SC-4 mandate then SC-5 definition) must land before the per-card guard edit (SC-1), and the lint/validation/template/critical-rule (SC-2/3/6/7) reference that canonical marker."
