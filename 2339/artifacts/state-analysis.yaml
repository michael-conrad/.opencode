# State Analysis — Issue 2339
# Skill card pre-flight guard for sub-agent dispatch

artifact_date: 2026-08-26
issue_number: 2339
repo: .opencode

## State Machine Transitions per Phase

### Phase 2: Apply guard to all skill cards (Item 1)

The guard introduces a state machine for a skill card when it is received by an agent:

```
[card received]
      |
      v
[context detection] --orchestrator--> [consume routing metadata (Workflows)]
      |
      +--sub-agent--> [BLOCKED + ORCHESTRATOR_ONLY_SKILL_CARD]
```

States:
- `card_received` — the agent has received the skill card content.
- `context_detection` — the guard determines whether the agent is an orchestrator or a
  sub-agent.
- `consume_routing_metadata` — orchestrator proceeds to read the Workflows/routing
  sections (normal operation).
- `blocked` — sub-agent halts with `BLOCKED` + `ORCHESTRATOR_ONLY_SKILL_CARD`.

Transitions:
- `card_received` → `context_detection` (always)
- `context_detection` → `consume_routing_metadata` (orchestrator context)
- `context_detection` → `blocked` (sub-agent context)

Invariant: The guard fires before any routing metadata is consumed. In orchestrator
context, the guard is inert (no false positive).

### Phase 3: Linting enforcement (Item 2)

The lint/validation tools transition a card between `guard_present` and `guard_missing`:

```
[card scanned]
      |
      v
[guard marker present?] --yes--> [PASS (no finding)]
      |
      +--no--> [FAIL (lint/validation finding)]
```

States:
- `guard_present` — the card contains the pre-flight guard marker.
- `guard_missing` — the card lacks the pre-flight guard marker.

Transitions:
- `card_scanned` → `guard_present` (marker found) → PASS
- `card_scanned` → `guard_missing` (marker absent) → FAIL

### Phase 4: Template generator (Item 4)

`init_skill.py` generates a card that is born in the `guard_present` state (the
SKILL_TEMPLATE includes the guard).

### Phase 5: Critical rule reference (Item 5)

No state machine — documentation only.

