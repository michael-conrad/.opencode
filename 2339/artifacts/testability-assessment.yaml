## Behavioral Testability Note

The spec explicitly scopes out behavioral enforcement test authoring (CON-2). The
guard's runtime behavior (sub-agent halts with BLOCKED) is a behavioral concern, but
authoring a behavioral test for it is out of scope for this spec. The lint/validation
enforcement (Phase 3) provides the mechanical backstop. If a behavioral test is later
desired, it would follow the two-SC pattern (artifact generation + clean-room
evaluation) per `.opencode/tests-v2/AGENTS.md` §6a.
