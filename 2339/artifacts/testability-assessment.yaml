## Test Strategy per Phase

### Phase 1: Canonical guard definition (Item 3)
- Test type: string (content verification)
- Strategy: Read the reference docs and confirm the guard mandate and canonical
  definition are present and consistent.
- Testable: Yes — grep/read the docs for the guard mandate and canonical definition.

### Phase 2: Apply guard to all skill cards (Item 1)
- Test type: string/lint (content verification)
- Strategy: grep all SKILL.md files for the guard marker; run the lint/validation
  tools to confirm no card is flagged for a missing guard.
- Testable: Yes — grep + lint/validation run.

### Phase 3: Linting enforcement (Item 2)
- Test type: unit
- Strategy: Unit-test the new lint function (`lint_skill_preflight_guard`) and the new
  REQ rule (`validate_req7`) against a card with and without the guard. Assert the
  finding is produced when the guard is missing and absent when present.
- Testable: Yes — unit tests on the lint/validation functions.

### Phase 4: Template generator (Item 4)
- Test type: unit
- Strategy: Unit-test `init_skill.py` SKILL_TEMPLATE to confirm the guard is present in
  the generated card.
- Testable: Yes — unit test on the template string.

### Phase 5: Critical rule reference (Item 5)
- Test type: string (content verification)
- Strategy: Read the critical-rules-XXX section and confirm it references the guard.
- Testable: Yes — grep/read the guideline.

