body: '---

  title: ''[SPEC] Shallow temp-copy build/test gate for release verification''

  status: open

  labels:

  - needs-approval

  remote_issue: 2340

  remote_url: https://github.com/michael-conrad/.opencode/issues/2340

  promoted_at: ''2026-08-26T18:31:19+00:00''

  ---


  > Full spec and plan artifacts: https://github.com/michael-conrad/.opencode/tree/issues-data/.issues/2340/


  **Problem** — The release process currently tags and promotes without verifying
  that the release tree actually builds and deploys. A broken build discovered after
  tagging requires a re-release. The release must be verified against a clean, pinned-SHA
  checkout before promotion.


  **Scope** — In scope: a shallow temp-copy checkout of the root repo at the release
  commit; submodule resolution to the gitlink-pinned SHAs (not latest); execution
  of the repository''s declared canonical build and test commands; a drift assertion
  that resolved submodule SHAs equal pinned SHAs; a PASS/FAIL gate that blocks release
  promotion on failure. Out of scope: changes to the feature-merge CI pipeline; changes
  to how feature PRs pin submodule SHAs; any modification to the release-promoter
  tag/creation logic beyond adding the verification gate.


  **Approach** — Add a verification step that performs a shallow clone of the root
  repo at the release commit, initializes submodules at their gitlink-pinned SHAs
  (shallow per submodule), asserts resolved SHA == pinned SHA with a hard fail on
  drift, then discovers and executes the repository''s declared canonical build and
  test commands from the repo''s AGENTS.md (or equivalent build manifest), asserting
  zero failures (non-zero exit = FAIL, blocks promotion). The gate runs once per release
  and blocks promotion on any failure. The checkout must use `git submodule update
  --init --depth 1` (honoring pinned SHAs), never `--remote` or `--recursive`. The
  build step is build-system-agnostic: it reads the repo''s own declared build/test
  commands rather than hardcoding a specific tool.


  **Impact** — Top risks: (1) submodule drift producing a green build of the wrong
  tree — mitigated by the SHA==pinned assertion; (2) shallow checkout missing submodule
  content — mitigated by explicit submodule init; (3) gate placement redundancy —
  mitigated by running once per release at the pinned-SHA configuration. Key dependency:
  the repo''s declared canonical build/test command set. Call to action: approve the
  spec to proceed to planning.


  🤖 OpenCode (ollama-cloud/deepseek-v4-flash) created

  '
