spec_path: .opencode/.issues/2347/spec.md
state_machine:
  name: condense_020_procedural_sections
  states:
    - name: procedural_content_preloaded
      description: "020 contains §1.1/§1.6/§2/§4 procedural content and the GO core"
      entry_action: "none (initial state)"
      applied_by: []
    - name: context_discipline_relocated
      description: "§1.1 content removed from 020, present in orchestrator-context-discipline.md, Read-link in 020; context-discipline blocks relocated"
      entry_action: "remove §1.1 from 020, add Read-link, relocate blocks (SC-1a/SC-1b/SC-1c/SC-7)"
      applied_by:
        - Item 1 (SC-1a)
        - Item 2 (SC-1b)
        - Item 3 (SC-1c)
        - Item 15 (SC-7)
    - name: consuming_cards_linked
      description: "approval-gate, mcp-tool-usage, skill-creator, brainstorming carry the orchestrator-context-discipline.md Read-link"
      entry_action: "add Read-links to the four consuming cards (SC-9a/SC-9b/SC-9c/SC-9d)"
      applied_by:
        - Item 17 (SC-9a)
        - Item 18 (SC-9b)
        - Item 19 (SC-9c)
        - Item 20 (SC-9d)
    - name: discussion_mode_relocated
      description: "§1.6 content removed from 020, present in discussion-mode-mandates.md, Read-link in brainstorming"
      entry_action: "remove §1.6 from 020, add Read-link to brainstorming (SC-2a/SC-2b/SC-2c)"
      applied_by:
        - Item 4 (SC-2a)
        - Item 5 (SC-2b)
        - Item 6 (SC-2c)
    - name: plan_revision_relocated
      description: "§2 prose removed from 020, present in plan-revision.md, Read-link in 020"
      entry_action: "remove §2 from 020, add Read-link (SC-3a/SC-3b/SC-3c)"
      applied_by:
        - Item 7 (SC-3a)
        - Item 8 (SC-3b)
        - Item 9 (SC-3c)
    - name: tools_condensed
      description: "§4 content removed from 020, Read-link to 085, 085 back-reference de-circularized"
      entry_action: "remove §4 from 020, add Read-link, de-circularize 085 (SC-4a-1/SC-4a-2/SC-4b)"
      applied_by:
        - Item 10 (SC-4a-1)
        - Item 11 (SC-4a-2)
        - Item 12 (SC-4b)
    - name: core_verified
      description: "GO core and anti-self-auth blocks retained verbatim; token burden reduced"
      entry_action: "verify retention and measure burden (SC-5/SC-6/SC-8)"
      applied_by:
        - Item 13 (SC-5)
        - Item 14 (SC-6)
        - Item 16 (SC-8)
  transitions:
    - from: procedural_content_preloaded
      to: context_discipline_relocated
      trigger: Phase 1 GREEN
      action: "relocate §1.1 and context-discipline blocks, add 020 Read-link"
    - from: context_discipline_relocated
      to: consuming_cards_linked
      trigger: Phase 1 GREEN
      action: "add Read-links to the four consuming cards"
    - from: consuming_cards_linked
      to: discussion_mode_relocated
      trigger: Phase 2 GREEN
      action: "relocate §1.6, add brainstorming Read-link"
    - from: discussion_mode_relocated
      to: plan_revision_relocated
      trigger: Phase 3 GREEN
      action: "relocate §2, add 020 Read-link"
    - from: plan_revision_relocated
      to: tools_condensed
      trigger: Phase 3 GREEN
      action: "condense §4, add 085 Read-link, de-circularize 085"
    - from: tools_condensed
      to: core_verified
      trigger: Phase 4 verify
      action: "verify core retention and measure burden"
  forbidden_states:
    - description: "No procedural content remains preloaded in 020 beyond the GO core (SC-1a/SC-2a/SC-3a/SC-4a-1)"
    - description: "No context-discipline critical-rules block silently deleted (SC-7)"
    - description: "No consuming card omits the mandatory Read-link (SC-9a/SC-9b/SC-9c/SC-9d)"
    - description: "No broken Read-link to a shared reference (SC-1c/SC-2c/SC-3c/SC-4a-2)"
