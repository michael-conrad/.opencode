body: '> Full spec and plan artifacts: https://github.com/michael-conrad/.opencode/tree/issues-data/2347/


  ## Problem


  Preloaded `.opencode/guidelines/020-go-prohibitions.md` costs ~19.8k tokens — the
  single largest preloaded guideline (~30% of burden). ~60% is procedural (orchestrator
  context discipline §1.1, discussion-mode mandates §1.6, iterative-feedback prose,
  project-local tool install rules, dark-prose patterns).


  ## Scope


  - **In:** Relocate §1.1 context discipline, §1.6 discussion mandates, iterative-feedback
  prose, project-local tool rules to shared references/skill cards; retain the GO-prohibition
  core (no GO token, no solicitation, no offer-to-edit, no self-authorization, no
  question-as-authorization, no why-question modification).


  - **Out:** Removing any anti-self-authorization core.


  ## Approach


  Move procedural sections to shared canonical references loaded via mandatory Read-links
  from approval-gate/mcp-tool-usage/skill-creator; retain the safety-critical prohibition
  core preloaded.


  ## Impact


  Biggest single win (~11.9k token savings; SC-8 hard threshold: post-condensation
  byte count < 26,734 bytes, < 50% of the original 53,468 bytes). Risk: losing no-self-auth
  rules. Mitigation: retain prohibition core verbatim. Depends on shared references
  + config. Action: approve.

  '
