body: '## Problem

  Preloaded `.opencode/guidelines/010-approval-gate.md` costs ~5.7k tokens before
  first prompt. ~45% is procedural (authorization scope model, verb-prefix parsing
  table, decision tables, edge-case tables, action classification) that the approval-gate
  skill card already contains verbatim.


  ## Scope

  - **In:** Relocate scope-model/verb-prefix/decision/edge-case/action-classification
  tables out of the preloaded guideline; retain the spec-before-code, plan-before-implementation,
  explicit-authorization, human-only-merge, bug-discovery-does-not-authorize cores.

  - **Out:** Removing any safety-critical authorization core.


  ## Approach

  Move the already-duplicated procedural content to the approval-gate skill card (single
  source of truth), retain the Tier-1 authorization cores in the preloaded guideline.


  ## Impact

  Risks: scope-parsing regression. Mitigation: approval-gate skill card is authoritative;
  verb-prefix table already there. Depends on shared-reference + config update. Action:
  approve.'
