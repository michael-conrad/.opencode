issue: 2349

state_transitions:
  - phase: 1
    element: guideline content
    transition: AS-IS -> CONDENSED (retain core/gate/session-scoped; remove evidence tables, Evidence Requirement bullets, No Exceptions, FORBIDDEN/REQUIRED lists)
    states: [as-is, condensed]
    trigger: guideline condensation edits (SC-1..SC-5c)
    risk: condensed state must still satisfy enforcement static checks (SC-001..SC-005) and Session-Scoped Verification requirement (SC-004, conflict C7)
  - phase: 2
    element: skill + links
    transition: CONDENSED -> SKILLS-UPDATED (relocated detail in verification skill + Read-links)
    states: [condensed, skills-updated]
    trigger: skill card edit (SC-6) + guideline Read-link edit (SC-7)
    risk: detail unreachable if Read-links missing (SC-7 FAIL) or detail in wrong skill (SC-6 FAIL)
  - phase: 3
    element: verification
    transition: SKILLS-UPDATED -> VERIFIED (enforcement test passes + behavioral honesty compliance + token savings)
    states: [skills-updated, verified]
    trigger: enforcement test run (SC-8), token measurement (SC-9), behavioral scenario (SC-10)
    risk: FAIL if test breaks (SC-8), token reduction below 0.7k (SC-9), behavioral honesty regression (SC-10)

summary: |
  Three-state documentation condensation pipeline: AS-IS -> CONDENSED -> SKILLS-UPDATED -> VERIFIED.
  Each transition is gated by the atomic SCs. The critical failure states are: condensation that drops a
  retained element or a removal target (SC-1..SC-5c), relocated detail that is unreachable or mis-homed
  (SC-6/SC-7), and post-condensation enforcement or behavioral regression (SC-8/SC-9/SC-10).
