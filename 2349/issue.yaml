body: '## Problem


  Preloaded `.opencode/guidelines/065-verification-honesty.md` costs ~1.9k tokens.
  ~35% procedural (evidence-requirement examples, session-scoped verification detail,
  pre-response gate procedure) that overlaps verification / verification-before-completion
  skills.


  ## Scope


  - **In:** Relocate evidence examples + session-scoped detail to verification skills;
  retain the zero-tolerance never-rely-on-memory core + pre-response factual-claim
  gate.


  - **Out:** Removing the verification-honesty zero-tolerance core.


  ## Approach


  Move the duplicated procedural detail to the verification skill cards via mandatory
  Read-links; keep the honesty core preloaded.


  ## Impact


  Reduced preload footprint. Risk: low. Depends on verification skill update + config.
  Action: approve.

  '
