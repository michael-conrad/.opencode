number: 2350
title: '[SPEC] Condense 060-tool-usage.md — move five-tier hierarchy & glob semantics'
status: open
labels: []
body: '## Problem

  Preloaded `.opencode/guidelines/060-tool-usage.md` costs ~4.1k tokens. ~70% is procedural
  (five-tier hierarchy, glob LIM-1..6 semantics, temp-file rules, command restrictions,
  identity-source semantics) that the mcp-tool-usage skill card already contains.


  ## Scope

  - **In:** Relocate five-tier hierarchy + glob semantics to mcp-tool-usage skill
  (single source of truth); retain zero-tolerance .ipynb mandate, API-client-mandatory
  rule, project_root/tmp-only rule.

  - **Out:** Removing any data-loss-prevention rule.


  ## Approach

  Move the already-duplicated tool-hierarchy content to mcp-tool-usage; keep the zero-tolerance
  tooling cores preloaded.


  ## Impact

  ~2.9k token savings. Risk: tool-hierarchy misrouting. Mitigation: mcp-tool-usage
  already carries the full hierarchy verbatim. Depends on config update. Action: approve.'
