body: '## Problem

  Preloaded `.opencode/guidelines/067-context-completeness.md` costs ~1.9k tokens.
  ~40% procedural (staleness-rule detail, de-minimis bound, single-exchange window,
  examples) that overlaps issue-review / issue-operations.


  ## Scope

  - **In:** Relocate staleness/deminimis/examples to issue-review skill; retain the
  zero-tolerance read-all-comments-before-acting core.

  - **Out:** Removing the read-all-comments core.


  ## Approach

  Move the duplicated procedural detail to issue-review; keep the context-completeness
  core preloaded.


  ## Impact

  ~0.7k savings. Risk: low. Depends on issue-review update + config. Action: approve.'
