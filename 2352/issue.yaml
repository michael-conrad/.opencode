number: 2352
title: '[SPEC] Condense 080-code-standards.md — move DI/provenance/attribution to
  skill cards'
status: open
labels:
- needs-approval
- spec-draft
body: '> Full spec and plan artifacts: https://github.com/michael-conrad/.opencode/tree/issues-data/2352/


  ## Problem


  Preloaded `.opencode/guidelines/080-code-standards.md` costs ~14.2k tokens (~21%
  of the agent''s preload burden, the 2nd largest single file). The ~14.2k token baseline
  is measured with the **chars/2.7 prose-dense proxy**: the file is 663 lines / 38,456
  chars, and 38,456 / 2.7 ≈ 14,243 tokens. Roughly 65% is procedural prose (typing,
  design rules, DI mandate, print rules, tool-selection-by-file-type, numbering, attribution/byline,
  provenance headers, cross-reference standards, YAML standard, triple co-application)
  that agents only need on-demand — preloading it taxes every session''s system context.


  ## Scope


  - **In:** Relocate the procedural sections to shared references (code-standards-shared,
  attribution-provenance) loaded via mandatory Read-links.


  - **In:** Align design/DI authority to the `programming-principles` skill (master
  source) and wire the retained enforcement cores to the `test-driven-development`
  skill (canonical source).


  - **In:** Retain the enforcement-test mandate, the behavioral-test-substitution
  prohibition, and the critical-rules-XXX blocks (derivation provenance, evidence-type
  classification gate) verbatim in 080.


  - **In:** Keep 080 in the Tier 1 `instructions[]` array — condensation only, not
  removal from preload.


  **Out of scope:**


  - Removing any enforcement core.


  - Altering the preload mechanism or removing 080 from the `instructions[]` array.


  - Changing enforcement semantics — this is a structural (token-burden) change, not
  a semantic one.


  ## Approach


  Relocate the procedural sections of 080 into shared references loaded via mandatory
  Read-links, so the on-demand content no longer sits in the always-loaded preload.
  080 remains preloaded but holds only the condensed enforcement core plus Read-links
  to the relocated procedural content. Design/DI authority stays with the `programming-principles`
  skill (already the master source), and the retained enforcement cores wire to the
  canonical `test-driven-development` skill definitions. This preserves enforcement
  behavior while cutting the preloaded token burden. The condensation savings are an
  emergent property of correctly implementing the content-based success criteria — no
  hard numerical reduction threshold is imposed; no enforcement core may be lost.


  ## Impact


  - **Risk:** Losing the enforcement-test mandate during condensation. **Mitigation:**
  Retain enforcement cores verbatim; verify behaviorally (SC-10) that the behavioral-test-substitution
  prohibition is still enforced.


  - **Risk:** Broken stable anchors referenced by other files (critical-rules-023,
  critical-rules-060, programming-principles line 68). **Mitigation:** Preserve or
  re-point stable anchors to the shared references.


  - **Risk:** Reversed skill authority (080 as master source). **Mitigation:** Keep
  programming-principles / test-driven-development as the master/canonical sources;
  080 links to them, never the reverse.

  '
