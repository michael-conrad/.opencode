    guideline); Phases 4-5 (verify) follow Phase 3.

three_tier_structure:
  status: PASS
  detail: >-
    Multi-phase spec has pre/per-file/post structure:
    - pre: SC-1, SC-2 (relocation to target skills)
    - per_file: SC-3 (condense the guideline)
    - post: SC-4, SC-5 (cross-reference and savings verification)

gate_result: PASS

