# Existing patterns / conventions
conventions:
  - name: cross-reference-form
    detail: >-
      Research card cross-reference-form-comparison.md (confidence 0.95) establishes that
      inline link form `See [file](path)` is the ONLY viable cross-reference form (100% Tier 1
      access rate). Resolution tables achieve only 42-58%. Relocated content that references the
      retained core MUST use inline `Read [Text](path)` form.
  - name: read-link-cross-reference-rule
    detail: >-
      AGENTS.md mandates the `Read [Text](path)` pattern for agent-facing cross-references.
      "See `file` §section" is FORBIDDEN. Relocated content must use the Read-link form.
  - name: tier-1-preload
    detail: >-
      opencode.jsonc WARNING comment: all 12 Tier 1 guidelines MUST be loaded. Removing
      075-docs-verification.md from instructions caused a safety regression precedent (#497).
      The core must remain preloaded.
  - name: shared-reference-consumption
    detail: >-
      engineering-approach operating-protocol already consumes shared references
      (data-integrity-shared, code-standards-shared) via Read-links. The relocated source-priority
      list fits this pattern.

