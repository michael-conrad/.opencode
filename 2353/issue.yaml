title: '[SPEC] Condense 075-docs-verification.md — move source-priority list to engineering-approach'
status: open
labels: []
body: '## Problem

  Preloaded `.opencode/guidelines/075-docs-verification.md` costs ~1.9k tokens. ~55%
  procedural (verification-source priority list, code-review checklist, examples)
  that overlaps engineering-approach / verification-enforcement.


  ## Scope

  - **In:** Relocate source-priority list + checklist + examples; retain the zero-tolerance
  verify-against-live-docs-before-implementing core.

  - **Out:** Removing the live-docs-verification core.


  ## Approach

  Move the duplicated procedural detail to engineering-approach / verification-enforcement;
  keep the live-docs core preloaded.


  ## Impact

  ~1.1k savings. Risk: low. Depends on engineering-approach update + config. Action:
  approve.'
