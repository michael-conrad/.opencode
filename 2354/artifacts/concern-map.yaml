concern_map:
  issue: 2354
  concern_boundaries:
    - concern: Preloaded hard-halt enforcement
      phase: all
      location: 117-session-trigger-behavior.md (retained core)
      separation: nested_opencode_fatal hard-halt + no-echo mandate stay in the preloaded guideline
    - concern: Self-simulation prohibition detail
      phase: relocate
      location: session-enforcement plugin / companion
      separation: moved out of preloaded guideline into plugin-owned artifact
    - concern: Trigger behavior routing
      phase: relocate
      location: git-workflow skill (pair-mode-resume task / dispatcher)
      separation: pair_mode_resume + nested_opencode_fatal behavior map moves to git-workflow
    - concern: Suppression rule
      phase: relocate
      location: session-enforcement plugin / companion
      separation: suppression logic moves to plugin-owned artifact
    - concern: Trigger data emission
      phase: none
      location: scripts/session_context_triggers.py
      separation: unchanged - data source stays separate from behavioral guidance
    - concern: Existing enforcement test integrity
      phase: test-reconcile
      location: .opencode/tests-v2/test-2134-sc*.sh (10 scripts)
      separation: |
        The 2134 content-verification tests assert the content being removed.
        They must be reconciled (updated to assert relocated destinations, or
        retired) so the enforcement signal is preserved without false FAILs.
  separation_rationale: |
    The condensation separates the always-required enforcement core (hard-halt,
    no-echo) from the context-heavy procedural guidance (self-simulation prose,
    trigger map, suppression rule). The core stays preloaded for zero-risk
    enforcement; the procedural detail is relocated to the components that own the
    relevant behavior (plugin for self-simulation/suppression, git-workflow for
    trigger routing) so it is preserved but not always loaded.
