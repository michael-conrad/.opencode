state_analysis:
  issue: 2354
  overview: |
    This is a documentation/guideline condensation - there is no runtime state
    machine in the application code. The relevant "state" is the preloaded
    guideline content state and the trigger-handling behavior states.
  states:
    - state: preloaded guideline content
      transitions:
        - from: "full 79-line guideline (self-simulation prose + trigger map + suppression + core)"
          to: "condensed guideline (core only: no-echo + nested_opencode_fatal hard-halt)"
          phase: condense
          trigger: spec implementation
          invariant: hard-halt core + no-echo mandate retained verbatim
    - state: procedural content location
      transitions:
        - from: preloaded in 117 (always loaded)
          to: relocated to session-enforcement plugin / git-workflow (loaded on demand)
          phase: relocate
          trigger: spec implementation
          invariant: content preserved, not deleted
    - state: trigger behavior map location
      transitions:
        - from: preloaded in 117
          to: git-workflow (pair-mode-resume task / dispatcher)
          phase: relocate
          trigger: spec implementation
          invariant: pair_mode_resume + nested_opencode_fatal behaviors preserved
    - state: cross-reference validity
      transitions:
        - from: 116-pair-mode.md line 76 -> 117 trigger map
          to: 116-pair-mode.md line 76 -> relocated home
          phase: reference-update
          trigger: spec implementation
          invariant: no dangling references
    - state: agent trigger-handling behavior
      transitions:
        - from: agent reads full preloaded guideline
          to: agent reads condensed core preloaded + loads procedural detail on demand
          phase: condense + relocate
          trigger: spec implementation
          invariant: nested_opencode_fatal still produces HALT; no-echo still enforced
    - state: enforcement test validity
      transitions:
        - from: 10 test-2134-sc*.sh scripts assert removed content (would FAIL)
          to: scripts updated to assert relocated destinations or retired (PASS)
          phase: test-reconcile
          trigger: spec implementation
          invariant: enforcement signal for relocated content preserved; no false FAIL
  state_invariants:
    - nested_opencode_fatal hard-halt must always produce HALT (never weakened)
    - no-echo mandate must always be enforced
    - procedural content must never be deleted - only relocated
    - the 2134 enforcement tests must not be left asserting removed content (false FAIL)
  acyclic: true
