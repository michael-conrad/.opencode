body: '## Problem

  Preloaded `.opencode/guidelines/117-session-trigger-behavior.md` costs ~1.9k tokens.
  ~30% procedural (self-simulation prohibition prose, trigger behavior map, suppression
  rule).


  ## Scope

  - **In:** Relocate self-simulation prose + trigger map + suppression detail; retain
  the nested_opencode_fatal hard-halt core and the no-echo mandate.

  - **Out:** Removing the nested-opencode-fatal hard halt.


  ## Approach

  Move the procedural detail to the session-enforcement plugin / git-workflow; keep
  the hard-halt core preloaded.


  ## Impact

  Reduced per-session token load. Risk: losing the nested_opencode_fatal halt.
  Mitigation: retain that core verbatim. Depends on config. Action: approve.'
