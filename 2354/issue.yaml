  the nested_opencode_fatal hard-halt core and the no-echo mandate.

  - **Out:** Removing the nested-opencode-fatal hard halt.


  ## Approach

  Move the procedural detail to the session-enforcement plugin / git-workflow; keep
  the hard-halt core preloaded.


  ## Impact

  Reduced per-session token load. Risk: losing the nested_opencode_fatal halt. Mitigation:
  retain that core verbatim. Depends on config. Action: approve.'
