body: '## Problem

  Preloaded `.opencode/guidelines/091-incremental-build.md` costs ~1.0k tokens. ~60%
  procedural (per-item TDD cycle detail, scope classification table, anti-patterns)
  that overlaps test-driven-development.


  ## Scope

  - **In:** Relocate per-item TDD detail + scope table + anti-patterns to test-driven-development;
  retain the mandate that all implementation follows top-down decomposition → bottom-up
  design → per-item TDD cycle.

  - **Out:** Removing the incremental-build mandate.


  ## Approach

  Move the already-duplicated TDD detail to test-driven-development; keep the decomposition
  mandate preloaded.


  ## Impact

  ~0.6k savings. Risk: low. Depends on tdd skill update + config. Action: approve.'
