## Behavioral vs Structural

This change does NOT alter any runtime branching, tool selection, or decision
logic. It alters the CONTENT that flows through existing preloading and skill
dispatch paths. Verification evidence is therefore semantic/structural (prose
read + file/content comparison), NOT behavioral. Per 080-code-standards.md, a
prose-only change uses semantic intent verification by AI read — not grep.
