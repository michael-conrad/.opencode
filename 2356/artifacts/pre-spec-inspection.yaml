## Key Observation: Duplication with Audit Drift-Detection

The audit skill already has a dedicated drift-detection role chain
(drift-detection-investigator/evaluator/validator/arbiter). The documentation
drift protocol in 130-authority-source.md overlaps with this existing
drift-detection machinery. Relocating the drift protocol prose to
engineering-approach (rather than audit) aligns with the issue's stated scope
("engineering-approach / verification") and keeps audit's dedicated chain
intact. No cross-reference to audit drift-detection tasks needs to change.

## Existing Patterns / Conventions

- Preloaded Tier 1 guidelines live in opencode.jsonc instructions array with a
