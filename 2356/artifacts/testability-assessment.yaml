## Testability Note

- **Behavioral tests NOT applicable:** This change does not modify runtime
  behavior (no dispatch decisions, tool selection, or branching logic changes).
  Per critical-rules-BEH-EV, the substrate classification is NO (prose-only), so
  evidence type remains semantic, not behavioral.
- **Grep is FORBIDDEN as sole evidence** for prose SCs (per verify.md exception
  section: semantic intent verification by AI read, not grep).
- **Structural evidence** (file presence, INDEX row, opencode.jsonc retention) is
  acceptable for the config-consistency SC (Item 3) since those are non-semantic
  existence checks.

