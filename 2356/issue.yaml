body: '## Problem

  Preloaded `.opencode/guidelines/130-authority-source.md` costs ~1.1k tokens. ~40%
  procedural (documentation-drift protocol, dual-authority prose).


  ## Scope

  - **In:** Relocate drift-protocol prose to engineering-approach / verification;
  retain the spec-for-intent/code-for-state core and suppression-of-reactive-remediation
  rule.

  - **Out:** Removing the authority-source core.


  ## Approach

  Move the drift protocol to engineering-approach; keep the dual-authority core preloaded.


  ## Impact

  ~0.4k savings. Risk: low. Depends on engineering-approach update + config. Action:
  approve.'
