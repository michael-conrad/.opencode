name: code-path-inventory
phases:
  - phase: 1
    code_paths:
      - path: .opencode/reference/discussion-mode-mandates.md
        action: create
        description: Write the extracted §1.6 content as a canonical reference document.
  - phase: 2
    code_paths:
      - path: .opencode/skills/brainstorming/SKILL.md
        action: edit
        description: Add a `Read [Text](.opencode/reference/discussion-mode-mandates.md)` link in the Cross-References (or a dedicated Discussion Mode section).
      - path: .opencode/skills/approval-gate/SKILL.md
        action: edit
        description: Add a `Read [Text](.opencode/reference/discussion-mode-mandates.md)` link in the Cross-References (or a dedicated Discussion Mode section).
  - phase: 3
    code_paths:
      - path: .opencode/reference/discussion-mode-mandates.md
        action: verify
        description: Confirm content presence and that it is the single source.
      - path: .opencode/skills/brainstorming/SKILL.md
        action: verify
        description: Confirm the Read-link is present, uses the imperative form, and resolves.
      - path: .opencode/skills/approval-gate/SKILL.md
        action: verify
        description: Confirm the Read-link is present, uses the imperative form, and resolves.
consumers_of_read_links:
  - Orchestrator loads brainstorming SKILL.md via skill() and follows the Read-link to load discussion-mode-mandates.md.
  - Orchestrator loads approval-gate SKILL.md via skill() and follows the Read-link to load discussion-mode-mandates.md.
