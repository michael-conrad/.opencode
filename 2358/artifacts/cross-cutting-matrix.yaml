name: cross-cutting-matrix
cross_cutting_concerns:
  - concern: Cross-reference form consistency (Read-link mandate)
    applies_to_phases: [2, 3]
    files: [brainstorming/SKILL.md, approval-gate/SKILL.md]
    handling: Both consumers MUST use the `Read [Text](path)` imperative form per AGENTS.md Read-Link Cross-Reference Rule. The same reference path appears in both cards.
  - concern: Skill-card structural validation (skildeck-lint / validate_skill_cards)
    applies_to_phases: [2, 3]
    files: [brainstorming/SKILL.md, approval-gate/SKILL.md]
    handling: Adding a Read-link section must not break the skill card structure (frontmatter, Trigger Dispatch Table, Invocation, Cross-References). The link is added to the Cross-References section, which already exists.
  - concern: Provenance / code-standards attribution
    applies_to_phases: [1]
    files: [discussion-mode-mandates.md]
    handling: New reference markdown file should carry provenance header per 080-code-standards.md (SPDX + Provenance + AI byline) consistent with other reference files.
  - concern: Content-preservation (no semantic loss)
    applies_to_phases: [1, 3]
    files: [discussion-mode-mandates.md, 020-go-prohibitions.md]
    handling: Extraction must be content-preserving; verify no §1.6 mandates are dropped or altered.
