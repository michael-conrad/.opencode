decomposition:
  items:
    - id: ITEM-1
      sc_reference: SC-1
      unit: Create the canonical shared reference file
      interface:
        input: Content of §1.6 Discussion Mode Mandates (020-go-prohibitions.md lines 252-278)
        output: .opencode/reference/discussion-mode-mandates.md
      invariants:
        - Content is a faithful, content-preserving extraction of the §1.6 NEVER DO / ALWAYS DO bullets and the skill-routing table.
        - File follows .opencode/reference/ format (title + prose).
      failure_modes:
        - File missing from the expected path.
        - Content materially altered from source (loss of mandates).
      verification: File exists and content matches source §1.6.
    - id: ITEM-2
      sc_reference: SC-2
      unit: Add mandatory Read-link in brainstorming SKILL.md
      interface:
        input: brainstorming/SKILL.md (Cross-References or a Discussion Mode section)
        output: brainstorming/SKILL.md containing a `Read [Text](.opencode/reference/discussion-mode-mandates.md)` link
      invariants:
        - Uses the Read [Text](path) imperative form (not "see").
        - Link target resolves to the created file.
      failure_modes:
        - Link missing, uses wrong form, or points to a nonexistent path.
      verification: grep for the Read-link form in brainstorming/SKILL.md; target file exists.
    - id: ITEM-3
      sc_reference: SC-3
      unit: Add mandatory Read-link in approval-gate SKILL.md
      interface:
        input: approval-gate/SKILL.md (Cross-References or a Discussion Mode section)
        output: approval-gate/SKILL.md containing a `Read [Text](.opencode/reference/discussion-mode-mandates.md)` link
      invariants:
        - Uses the Read [Text](path) imperative form (not "see").
        - Link target resolves to the created file.
      failure_modes:
        - Link missing, uses wrong form, or points to a nonexistent path.
      verification: grep for the Read-link form in approval-gate/SKILL.md; target file exists.
    - id: ITEM-4
      sc_reference: SC-4
      unit: Verify no re-inlining and reference integrity
      interface:
        input: The three modified/created files
        output: Structural verification that content is not duplicated and links resolve
      invariants:
        - The §1.6 content appears once (in the reference file), not inlined into either skill card.
        - All Read-links resolve to the created file.
      failure_modes:
        - Content duplicated into a skill card body.
        - Broken link.
      verification: grep confirms single source; link check resolves all paths.
  dependency_order:
    - ITEM-1 must precede ITEM-2 and ITEM-3 (reference must exist before links target it).
    - ITEM-4 depends on ITEM-1, ITEM-2, ITEM-3.
  notes:
    - Each item maps to exactly one SC-ID and carries its own RED/GREEN/verify/commit cycle (per-SC decomposition).
    - The spec-creation create task formalizes SC-1..SC-4 wording and evidence types.
