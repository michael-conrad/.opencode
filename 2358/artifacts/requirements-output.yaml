requirements:
  - id: REQ-1
    text: "Create .opencode/reference/discussion-mode-mandates.md containing the canonical content of §1.6 Discussion Mode Mandates."
    type: explicit
    verification: File exists at .opencode/reference/discussion-mode-mandates.md; content matches the §1.6 source (lines 252-278 of 020-go-prohibitions.md).
    consumer: writing-plans (create.md) and spec-audit — structural SC.
  - id: REQ-2
    text: "Add a mandatory Read-link to the shared reference in the brainstorming SKILL.md."
    type: explicit
    verification: brainstorming/SKILL.md contains a `Read [Text](.opencode/reference/discussion-mode-mandates.md)` link; link path resolves to the created file.
    consumer: brainstorming skill card (orchestrator load).
  - id: REQ-3
    text: "Add a mandatory Read-link to the shared reference in the approval-gate SKILL.md."
    type: explicit
    verification: approval-gate/SKILL.md contains a `Read [Text](.opencode/reference/discussion-mode-mandates.md)` link; link path resolves to the created file.
    consumer: approval-gate skill card (orchestrator load).
  - id: REQ-4
    text: "The shared reference is the canonical source; do NOT re-inline the content into each skill card."
    type: constraint (non-requirement enforcement)
    verification: Content appears once in .opencode/reference/discussion-mode-mandates.md, not duplicated into brainstorming/approval-gate SKILL.md bodies.
    consumer: skill-creator validation; spec-audit.
  - id: REQ-5
    text: "The extraction enables 020 condensation (reduction of preloaded guideline token burden)."
    type: implicit (context)
    verification: 020-go-prohibitions.md no longer inlines §1.6 procedural content (replaced by a reference note / condensed), reducing its preloaded size. Depends on 020 condensation scope (declared dependency).
    consumer: 020 condensation issue.
implicit_requirements:
  - The reference file must follow the .opencode/reference/ format conventions (title + prose, provenance per code-standards where applicable).
  - The mandatory Read-links MUST use the `Read [Text](path)` imperative form per AGENTS.md Read-Link Cross-Reference Rule — not "see"/symbol-only refs.
non_requirements:
  - Re-inlining content into each skill card (explicit Out-of-scope).
  - Changing the substantive rules of §1.6 (extraction is content-preserving).
  - Removing §1.6's safety-relevant content from the preloaded 020 file (020 condensation is a separate, dependent concern).
constraint_requirements:
  - Issue and all affected files live under the .opencode repo path prefix (.opencode/).
  - No source/test code changes — this is a markdown/reference-content refactor.
