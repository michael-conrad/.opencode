name: state-analysis
state_machines:
  - target: .opencode/reference/discussion-mode-mandates.md
    states:
      - absent (initial)
      - present (after phase 1)
    transitions:
      - absent -> present: write the reference file (phase 1)
    invariants:
      - The file must exist before any Read-link targets it (phase 2).
      - The file is inert until consumed via Read-link.
  - target: brainstorming/SKILL.md and approval-gate/SKILL.md
    states:
      - no discussion-mode Read-link (initial)
      - discussion-mode Read-link present (after phase 2)
    transitions:
      - no-link -> link-present: add mandatory Read-link (phase 2)
    invariants:
      - Link target (.opencode/reference/discussion-mode-mandates.md) must exist at the time links are added.
phase_state_dependencies:
  - Phase 2 depends on phase 1 (target file must exist before links are added).
  - Phase 3 depends on phases 1-2 (verification runs after all files exist).
no_persistent_state_change:
  - true
  - Note: No runtime/system state machines are affected; these are document-creation state transitions in the .opencode repo.
