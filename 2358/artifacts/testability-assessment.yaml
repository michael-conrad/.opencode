  - id: SC-1b
    evidence_type: string
    verification_method: "diff the reference file against the §1.6 source block to confirm no mandate was dropped or altered"
    testable: true
    test_type: diff
  - id: SC-2a
    evidence_type: string
    verification_method: "grep brainstorming/SKILL.md for the imperative Read-link form"
    testable: true
    test_type: grep
  - id: SC-2b
    evidence_type: structural
    verification_method: "resolve the target path from the brainstorming/SKILL.md Read-link and assert it exists"
    testable: true
    test_type: path_resolution
  - id: SC-3a
    evidence_type: string
    verification_method: "grep approval-gate/SKILL.md for the imperative Read-link form"
    testable: true
    test_type: grep
  - id: SC-3b
    evidence_type: structural
    verification_method: "resolve the target path from the approval-gate/SKILL.md Read-link and assert it exists"
    testable: true
    test_type: path_resolution
  - id: SC-4a
    evidence_type: string
    verification_method: "grep the codebase to confirm the §1.6 content is not duplicated into brainstorming/SKILL.md or approval-gate/SKILL.md"
    testable: true
    test_type: grep
