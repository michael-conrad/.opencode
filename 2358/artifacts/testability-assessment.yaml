name: testability-assessment
phases:
  - phase: 1
    test_strategy: structural
    evidence_type: structural
    test:
      - "File existence: assert .opencode/reference/discussion-mode-mandates.md exists and is non-empty."
      - "Content match: diff the reference file against the §1.6 source block (020-go-prohibitions.md lines 252-278) to confirm content preservation."
    rationale: Content-file creation; existence and content-fidelity are structural/string checks.
  - phase: 2
    test_strategy: structural + link-integrity
    evidence_type: structural
    test:
      - "grep brainstorming/SKILL.md and approval-gate/SKILL.md for the `Read [Text](.opencode/reference/discussion-mode-mandates.md)` link."
      - "Assert the link uses the imperative Read [Text](path) form (not 'see'/symbol-only)."
      - "Resolve the link target path and assert it exists."
    rationale: Adding links to agent-facing cards; presence, form, and resolvability are structural checks.
  - phase: 3
    test_strategy: structural (single-source verification)
    evidence_type: structural
    test:
      - "grep the codebase to confirm §1.6 content appears only in the reference file, not duplicated into skill-card bodies."
      - "Run skildeck validation on the two modified skill cards (if available) to ensure structural integrity."
    rationale: Re-inlining prohibition and link integrity are structural checks.
notes:
  - No behavioral testing required for this content-extraction refactor. The change is markdown/reference restructure with no runtime-behavioral alteration. Per critical-rules-BEH-EV, substrate is structural (file content/layout), not runtime dispatch behavior.
  - If the spec-creation pipeline classifies the SCs' evidence types, structural is appropriate for all four items.
