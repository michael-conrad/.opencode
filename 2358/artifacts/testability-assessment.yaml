  - "SC-1b, SC-2a, SC-3a, SC-4a, SC-4b are string-grade (diff/grep/scan) — declared as string per the evidence type taxonomy."
  - "No behavioral tests required — this spec is a content-extraction and link-insertion change with no runtime behavior modification."
