body: '## Problem

  `.opencode/guidelines/020-go-prohibitions.md` §1.6 Discussion Mode Mandates is procedural
  content consumed by brainstorming and approval-gate skill cards, currently preloaded.


  ## Scope

  - **In:** Create `.opencode/reference/discussion-mode-mandates.md`; add mandatory
  Read-links to brainstorming + approval-gate.

  - **Out:** Re-inlining into each card.


  ## Approach

  Extract §1.6 to a shared canonical reference loaded via mandatory Read-links.


  ## Impact

  Enables 020 condensation. Risk: low. Depends on 020 condensation. Action: approve.'
