research_card_consultation:
  issue: ".opencode#2359"
  topic: "Create shared reference: orchestrator-context-discipline.md"
  consulted_cards:
    - card: ".opencode/.issues/research-cards/cross-reference-form-comparison.md"
      confidence: 0.95
      relevance: "HIGH — directly validates the Read [Text](path) inline-link convention this spec depends on"
      findings_applied:
        - "Inline link form (Form A) achieves 100% Tier 1 access rate — the only viable cross-reference pattern"
        - "Resolution table + admonition pattern achieves only 42-58% — NOT a viable replacement"
        - "The verb 'Read' alone was a false positive (listed directory, never read content); the Read [Text](path) imperative form is required"
      implication: "Consuming skill cards MUST use the Read [Text](path) inline-link form, not a resolution table or bare §Name reference"
    - card: ".issues/research-cards/cross-reference-lobotomization.md"
      confidence: 0.85
      relevance: "HIGH — documents why prose 'See FILENAME §SECTION' citations fail as load directives"
      findings_applied:
        - "~136 cross-references of the form 'See `FILENAME.md` §SECTION' are treated as decorative citations, not load directives"
        - "The imperative 'Read' verb is the trigger the agent interprets as a tool-use instruction"
      implication: "The new reference MUST be consumed via imperative Read [Text](path) links, never 'See' citations"
    - card: ".opencode/.issues/research-cards/spec-writing-ai-agents-opencode-skill-architecture.md"
      confidence: 0.90
      relevance: "MEDIUM — canonical opencode skill architecture (skill card vs task card, reference file consumption)"
      findings_applied:
        - "Reference files are consumed by skill cards via Read-links; the reference is routing/standards metadata, not a task card"
      implication: "orchestrator-context-discipline.md is a reference document (standards), not a task card — it is read by orchestrators, not dispatched to sub-agents"
  no_matching_card:
    - "No research card specifically covers 'orchestrator context discipline' as a standalone reference extraction topic"
    - "The three cards above provide sufficient coverage of the cross-reference and reference-file conventions this spec depends on"
