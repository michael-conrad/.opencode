body: '## Problem

  `.opencode/guidelines/080-code-standards.md` attribution/byline + provenance-header
  sections are consumed by skill-creator, spec-creation, issue-operations-comments,
  currently preloaded.


  ## Scope

  - **In:** Create `.opencode/reference/attribution-provenance.md`; add mandatory
  Read-links to the consuming skill cards.

  - **Out:** Re-inlining into each card.


  ## Approach

  Extract the attribution/provenance sections of 080-code-standards into a shared
  canonical reference.


  ## Impact

  Enables 080 condensation. Risk: losing co-author attribution requirement. Mitigation:
  consuming cards Read-link the shared ref. Depends on 080 condensation. Action: approve.'
