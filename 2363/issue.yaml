body: '## Problem

  `.opencode/guidelines/090-data-integrity.md` procedural sections (batch operations,
  long-running tasks, serialization integrity, data classification, migration integrity,
  audit trail, retention) are consumed by engineering-approach, programming-principles,
  currently preloaded.


  ## Scope

  - **In:** Create `.opencode/reference/data-integrity-shared.md`; add mandatory Read-links
  to the consuming skill cards.

  - **Out:** Re-inlining into each card.


  ## Approach

  Extract the procedural sections of 090-data-integrity into a shared canonical reference.


  ## Impact

  Enables 090 condensation (~2.7k savings). Risk: content loss if cards don''t Read-link.
  Mitigation: mandatory Read-link convention. Depends on 090 condensation. Action:
  approve.'
