body: '## Problem

  The five-tier tool hierarchy and glob LIM-1..6 semantics currently live in the preloaded
  060-tool-usage.md guideline and will be removed from preload. mcp-tool-usage must
  become the single canonical home.


  ## Scope

  - **In:** Make mcp-tool-usage the authoritative source for the five-tier hierarchy
  + glob semantics; add mandatory Read [Text](path) links for any consuming cards.

  - **Out:** Duplicating the content elsewhere.


  ## Approach

  Consolidate tool-hierarchy + glob semantics into the mcp-tool-usage skill card as
  the single source of truth.


  ## Impact

  Enables 060 condensation (~2.9k savings). Risk: tool-misrouting if hierarchy lost.
  Mitigation: mcp-tool-usage is authoritative. Depends on 060 condensation. Action:
  approve.'
