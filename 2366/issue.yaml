body: '## Problem

  The authorization scope model + verb-prefix parsing table live in the preloaded
  010-approval-gate.md and 020-go-prohibitions.md, and will be removed from preload.
  The approval-gate skill card must become the authoritative home and Read-link the
  shared context-discipline/discussion references.


  ## Scope

  - **In:** Make approval-gate skill the single source of truth for the scope model
  + verb-prefix table; add mandatory Read [Text](path) links to orchestrator-context-discipline.md
  and discussion-mode-mandates.md.

  - **Out:** Losing the scope-parsing table.


  ## Approach

  Consolidate the scope model + verb-prefix table into the approval-gate skill card;
  Read-link shared references.


  ## Impact

  Enables 010 + 020 condensation. Risk: scope-parsing regression. Mitigation: approval-gate
  is authoritative. Depends on 010/020 condensation. Action: approve.'
