body: '## Problem

  Per-item TDD cycle detail from 091-incremental-build.md will be removed from preload;
  test-driven-development is the canonical home.


  ## Scope

  - **In:** Make test-driven-development the authoritative source for the per-item
  RED/GREEN/REFACTOR/COMMIT cycle; add mandatory Read [Text](path) link to code-standards-shared.md
  (enforcement-test mandate + behavioral-test-substitution prohibition).

  - **Out:** Losing the TDD cycle or enforcement mandate.


  ## Approach

  Consolidate the per-item TDD cycle + enforcement mandate into the test-driven-development
  skill card.


  ## Impact

  Enables 091 + 080 condensation. Risk: losing behavioral-test mandate. Mitigation:
  tdd card is authoritative. Depends on 091/080. Action: approve.'
