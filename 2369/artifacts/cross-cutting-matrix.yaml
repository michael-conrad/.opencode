cross_cutting_matrix:
  issue: 2369
  cross_cutting_concerns:
    - concern: "Read [Text](path) dynamic loading pattern"
      applies_to: "Phase 1 (both Read-links in the programming-principles SKILL.md)"
      resolution: "Both Read-links use the identical Read [Text](reference/<name>-shared.md) pattern per task-card-structure-standards.md §7 Dynamic Loading and the Read-Link Cross-Reference Rule in AGENTS.md."
    - concern: "Canonical link text and path"
      applies_to: "Phase 1 (both Read-links)"
      resolution: "Replicates the engineering-approach ## Cross-References link text and the canonical reference/ paths (reference/code-standards-shared.md, reference/data-integrity-shared.md)."
    - concern: "No forbidden 'See ...' citation form"
      applies_to: "Phase 1 (both Read-links)"
      resolution: "Both links use the Read [Text](path) form; the 'See ...' form is forbidden per the Read-Link Cross-Reference Rule."
    - concern: "No re-inlining / no content duplication"
      applies_to: "Phase 1"
      resolution: "The SKILL.md references the shared references; re-inlining is explicitly out of scope."
    - concern: "Concern boundary (no guideline modification)"
      applies_to: "Phase 1 (verification item)"
      resolution: "080-code-standards.md and 090-data-integrity.md are verified unmodified."
  matrix:
    - concern: "Read-link pattern"
      phase_1: "code-standards-shared.md + data-integrity-shared.md"
    - concern: "Canonical link text/path"
      phase_1: "engineering-approach ## Cross-References pattern"
    - concern: "No 'See ...' form"
      phase_1: "both Read-links"
    - concern: "No re-inlining"
      phase_1: "SKILL.md references, never duplicates"
    - concern: "Guideline boundary"
      phase_1: "080/090 verified unmodified"
