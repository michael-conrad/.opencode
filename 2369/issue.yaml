  data-integrity-shared.md in the programming-principles skill card.

  - **Out:** Losing the design/DI/integrity standards.


  ## Approach

  Anchor the shared references via mandatory Read-links.


  ## Impact

  Enables 080 + 090 condensation. Risk: low. Depends on shared refs + 080/090. Action:
  approve.'
