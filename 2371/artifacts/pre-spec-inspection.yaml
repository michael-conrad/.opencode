## Existing Patterns and Conventions

- **Read-Link Cross-Reference Rule** (AGENTS.md): agent-facing text MUST use the imperative
  `Read [Text](path)` form for cross-references. Bare "see" citations are forbidden.
- **Reference directory**: `.opencode/reference/` is the canonical home for shared reference
  documents consumed via `Read [Text](path)` links (e.g. `cost-model-standards.md`,
  `spec-structure-standards.md`, `skill-card-description-standards.md`).
- **Skill card Cross-References section**: The standard location for skill cards to anchor
  shared references and related guidelines. The brainstorming card's Cross-References section
  is the natural insertion point for the discussion-mode-mandates Read-link.

## Dependencies and Callers of Affected Symbols

- The brainstorming skill card is loaded via `skill({name: "brainstorming"})` by the
  orchestrator. Its task cards (`explore.md`, `top-down-analysis.md`, `enforcement.md`,
