body: '## Problem

  Discussion-mode mandates from 020-go-prohibitions.md §1.6 move to a shared reference;
  brainstorming consumes them.


  ## Scope

  - **In:** Add mandatory Read [Text](path) link to discussion-mode-mandates.md in
  the brainstorming skill card.

  - **Out:** Losing the discussion-mode mandates (no question tool, no pigeon-holing,
  single-topic).


  ## Approach

  Anchor the shared discussion-mode reference via mandatory Read-link.


  ## Impact

  Enables 020 condensation. Risk: low. Depends on discussion-mode-mandates ref + 020.
  Action: approve.'
