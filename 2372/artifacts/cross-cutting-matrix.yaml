      phases_affected:
        - 2
      verification_gate: pre-commit
      remediation: "Convert the citation to the imperative Read-link form"
    - sc_id: SC-5
      name: "The verification skill's Trigger Dispatch Table, Invocation, and routing metadata remain unchanged"
      evidence_type: structural
      verification_method: "diff the Trigger Dispatch Table / Invocation before/after the edits"
      phases_affected:
        - 3
      verification_gate: post-implementation
      remediation: "Revert any routing-metadata change and re-apply additive-only edits"
    - sc_id: SC-6
      name: "The verification-honesty zero-tolerance core is not lost; this spec does not modify 065-verification-honesty.md"
      evidence_type: structural
      verification_method: "confirm the 065 core (never-rely-on-memory + pre-response gate) is intact and 065 is not modified by this spec"
