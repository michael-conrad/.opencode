## Inspection Conclusion

Multi-file, single-concern change within the verification skill: (1) make the verification
skill the authoritative source for the 065 evidence-requirement examples + session-scoped
verification detail (anchored in the verify/verify-single task cards, and/or a shared
reference consumed via Read-link), and (2) add a mandatory `Read [Text](path)` link to the
authority-source shared content. The change is contained to the verification skill surface.
External dependencies: the 065 condensation (2349) and 130-authority-source condensation (2356)
which this spec enables, and the authority-source shared reference file (2356 deliverable) that
the Read-link targets.
