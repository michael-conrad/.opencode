## Existing Patterns and Conventions

- **Read-Link Cross-Reference Rule** (AGENTS.md): agent-facing text MUST use the imperative
  `Read [Text](path)` form for cross-references. Bare "see" citations are forbidden.
- **Reference directory**: `.opencode/reference/` is the canonical home for shared reference
  documents consumed via `Read [Text](path)` links (e.g. `cost-model-standards.md`,
  `spec-structure-standards.md`, `skill-card-description-standards.md`).
- **Related condensation specs** (same change family): `.opencode#2349` (condense 065,
  move evidence examples + session-scoped detail to verification skills), `.opencode#2353`
  (condense 075, move source-priority list to engineering-approach), `.opencode#2356`
  (condense 130-authority-source, move drift protocol to engineering-approach/verification),
  `.opencode#2365` (update engineering-approach skill — Read-link docs-verification &
  data-integrity). Issue 2372 is the verification-skill companion to these.
- **Skill card Cross-References section**: The standard location for skill cards to anchor
  shared references and related guidelines (see engineering-approach 2365 pattern). The
  verification skill card currently lacks this section.

## Dependencies and Callers of Affected Symbols

- The verification skill card is loaded via `skill({name: "verification"})` by the
  orchestrator. Its task cards (`verify.md`, `verify-single.md`, `completion.md`) are
  dispatched to sub-agents via `task()`.
- **Dependency (downstream consumers)**: `verification-before-completion` and
  `verification-enforcement` skills both reference `065-verification-honesty.md` and consume
  verification-honesty content. The verification skill becoming the canonical home for the
  evidence-requirement examples + session-scoped detail must not break these consumers.
- **Dependency (upstream)**: `.opencode#2349` (065 condensation) and `.opencode#2356`
  (130-authority-source condensation) depend on the verification skill being updated first
  (this spec). The authority-source shared content that 2372 Read-links is the deliverable
  of the 130 condensation effort (2356) — a dependency relationship.

