## Cards Consulted

### cross-reference-form-comparison.md
- Path: `.opencode/.issues/research-cards/cross-reference-form-comparison.md`
- Confidence: 0.95
- Relevance: HIGH — directly governs which cross-reference form this spec's mandatory
  authority-source Read-link must use.

### Findings Incorporated

- **Form A (inline link)** achieves 100% Tier 1 access rate — the only viable pattern.
- The resolution-table + admonition pattern achieves only 42-58% — the agent reads the table
  as text but does not follow links. Not a viable replacement.
- Verb sub-test: "Load" triggered file access AND correct application; "See" triggered access
  but the agent treated content as informational; "Read" was a false positive (listed the
  directory, never read content). The imperative `Read [Text](path)` form is the required
  pattern per the deck's Read-Link Cross-Reference Rule.
- **Conclusion for this spec**: The verification skill MUST use the imperative
  `Read [Text](path)` form for the authority-source link — not a bare "see" citation and not
  a resolution table.

