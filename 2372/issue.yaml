body: '> Full spec and plan artifacts: https://github.com/michael-conrad/.opencode/tree/issues-data/2372/

  ## Problem

  Verification-honesty evidence examples (065) and docs-verification detail (075)
  move out of preload; the verification skill is the canonical home.


  ## Scope

  - **In:** Make verification skill the authoritative source for evidence-requirement
  examples + session-scoped verification detail (anchored in the verify/verify-single
  task cards); add mandatory Read [Text](path) link to the authority-source shared
  content; convert the defective "per 065" citation to the imperative Read-link form.

  - **Out:** Losing the verification-honesty core; modifying 065/075/130.


  ## Approach

  Anchor the evidence/detail content into the verification skill task cards and add
  the imperative authority-source Read-link.


  ## Impact

  Enables 065 + 075 condensation. Risk: low. Depends on 065/075. Action: approve.'
