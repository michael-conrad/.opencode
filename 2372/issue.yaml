  examples + session-scoped verification detail; add mandatory Read [Text](path) link
  to the authority-source shared content.

  - **Out:** Losing the verification-honesty core.


  ## Approach

  Consolidate the evidence/detail content into the verification skill card.


  ## Impact

  Enables 065 + 075 condensation. Risk: low. Depends on 065/075. Action: approve.'
