body: '## Problem

  Context-completeness staleness/deminimis/single-exchange-window detail (067) moves
  out of preload; issue-review is the canonical home.


  ## Scope

  - **In:** Make issue-review the authoritative source for the staleness rule, de-minimis
  bound, and single-exchange window; add mandatory Read [Text](path) link to any shared
  content.

  - **Out:** Losing the read-all-comments core.


  ## Approach

  Consolidate the context-completeness detail into the issue-review skill card.


  ## Impact

  Enables 067 condensation. Risk: low. Depends on 067. Action: approve.'
