# Solve output — issue #2376
# Z3 + planner verification results from research task

solve_model:
  command: "tools/solve model --contract-path .opencode/.issues/2376/dependency-contract.yaml --query z3.And(phase_1, phase_2, phase_3)"
  status: SAT
  assignment:
    phase_1: true
    phase_2: true
    phase_3: true
  interpretation: "Goal state (all 3 phases complete) is satisfiable under the dependency preconditions phase_2 -> phase_1, phase_3 -> phase_1, and phase_3 -> phase_2. All three phases are mutually satisfiable."

solve_check:
  command: "tools/solve check --contract-path .opencode/.issues/2376/dependency-contract.yaml --state-path .opencode/.issues/2376/artifacts/state-analysis.yaml"
  status: SAT
  assignment:
    phase_1: false
    phase_2: false
    phase_3: false
  interpretation: "Initial state analysis (all phases false, closed-world) is consistent with the contract. SAT (+ postconditions + invariants)."

planner:
  command: "tools/plan plan --problem .opencode/.issues/2376/artifacts/problem.yaml"
  status: SOLVED_SATISFICING
  engine: tamer
  plan_length: 3
  plan:
    - run_p1()
    - run_p2()
    - run_p3()
  interpretation: "Planner produced a valid 3-step sequential plan enforcing the linear phase_1 -> phase_2 -> phase_3 dependency edges. run_p1 precedes run_p2; both precede run_p3."

solve_status: SAT
plan_status: SOLVED_SATISFICING
notes:
  - "Task-card CLI forms in writing-plans/tasks/research.md steps 10-12 do not match current solve/plan tool signatures. Resolved using actual tool interfaces per prior-issue convention (see #2301, #2318, #2133, #2245, #2249)."
  - "solve model: --contract-path + --query <z3 expr> (not --query sat). solve check: --state-path + --contract-path. plan plan: --problem <problem.yaml> (no --contract-path/--output; emits to stdout)."
  - "dependency-contract.yaml generated from interface-compatibility.yaml dependency_contract section (step 9) — interface-compatibility.yaml present with a dependency_contract section."
  - "sc-summary.yaml lives at the issue root (.opencode/.issues/2376/sc-summary.yaml), not under artifacts/; read from there for SC/item mapping."

