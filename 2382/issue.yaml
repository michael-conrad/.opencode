title: '[BUG] gb pr close returns 404 on deleted-branch PRs — gb-cli card lacks the
  caveat and --web fallback'
status: open
labels:
- needs-approval
body: '## Problem


  On the production GitBucket instance (`tomcat-0002.newsrx.com`), closing a pull
  request whose base/head branches had been deleted returned **HTTP 404** from `gb
  pr close`, and the flow recovered only through `gb pr edit --state closed --web`
  — a recovery the deck does not mention. The deck''s only PR-state guidance, [gb-cli
  §4](https://github.com/michael-conrad/.opencode/blob/main/skills/gb-cli/SKILL.md),
  states "PRs differ (`PATCH .../pulls/{n}` accepts `state`)" with no deleted-branch
  exception, so a deck-following agent has no documented recovery path when the 404
  fires.


  Verified current state:


  - The pre-rewrite deck asserted `Close PR | ✅` unconditionally (preserved at `attic/skills/issue-operations/platforms/gitbucket-api/SKILL.md`
  line 58, with the same command in its command-reference table at line 228); those
  cards are retired under `attic/`.

  - The post-rewrite deck names `gb pr close` nowhere — no deck flow invokes it; the
  exposure is agent-judgment cleanup of superseded or stale PRs whose branches are
  already deleted.

  - The `gb pr edit --state closed --web` fallback text appears in no committed file
  in either repository outside this issue''s own store records (the only other `--web`
  matches are unrelated: `gh release view --web`, gh-cli card content); its CLI surface
  is real (`gb pr edit --help`: `--state <open|closed>`, `--web` = "Allow GitBucket
  web UI fallback when REST PR edit is unavailable"). The card entry is therefore
  authored from the verified CLI surface and a pinned reproduction, not from any prior
  document.

  - The single observed incident does not distinguish deleted-head from deleted-base
  from both, and does not confirm `--web` succeeds in each — the condition must be
  pinned before the wording lands.

  - **Second defect (observed this session):** the issues card''s mirror-repair instruction
  (§7) attributes correcting the remote body''s pointer to `local-issues update --github`,
  but that command is local-only — it writes the `github_url` metadata field into
  the local store and never contacts any remote tracker (verified by reading `cmd_update`
  in `.opencode/tools/local-issues`). Following it produced silent local/remote divergence
  twice in one session: both pushes reported `updated: true` while the remote body
  remained unchanged.


  ## Scope


  Two minimal in-place deck edits, both routed through the deck-governance admission
  gate (skill-creator card), like any edit under `skills/`:


  1. **gb-cli caveat** — `.opencode/skills/gb-cli/SKILL.md` §4 (Platform awareness
  / Known gaps): add the deleted-branch failure caveat for PR state mutation, name
  the `--web` fallback as the sanctioned recovery, and qualify the existing "accepts
  `state`" claim so it no longer reads as unconditional. The caveat''s stated condition
  follows R-1''s pinned reproduction.

  2. **Issues-card routing correction** — `.opencode/skills/issues/SKILL.md` §7 (mirror-repair):
  the sentence attributing the remote-body pointer correction to `update --github`
  is rewritten so the remote correction is routed through the platform CLI per the
  card''s own §1, and the differentiation doctrine is stated explicitly (R-7). The
  [`local-issues-cli.md` reference](https://github.com/michael-conrad/.opencode/blob/main/skills/issues/references/local-issues-cli.md)''s
  `update` row carries the same explicit local-only statement.


  Not included: resurrecting attic''d platform/error-recovery cards; changes to any
  other deck file or to root `AGENTS.md`; new `references/` detail cards; mutation
  of production repositories for reproduction; changes to the `local-issues` tool
  script itself — the tool''s local-only behavior stands; the correction is instructional.


  ## Requirements


  - **R-1** — The deleted-branch failure condition SHALL be pinned by reproduction
  on a non-production GitBucket (harness container or equivalent scratch instance;
  production repositories are never mutated): a PR with a deleted head branch, a PR
  with a deleted base branch, and a PR with both, recording for each whether `gb pr
  close` fails (and with what status) and whether `gb pr edit --state closed --web`
  succeeds. *Instrument: the reproduction transcript stored under `.opencode/.issues/2382/artifacts/`.*

  - **R-2** — The gb-cli card''s §4 known-gaps SHALL carry a caveat for PR state mutation
  stating the failure condition exactly as pinned by R-1. *Instrument: read the edited
  card; the caveat''s stated condition matches the R-1 transcript''s observed condition
  set.*

  - **R-3** — The same card section SHALL name `gb pr edit <N> --state closed --web`
  as the sanctioned fallback for closing a PR under that condition. *Instrument: the
  card contains the fallback command; `gb pr edit --help` confirms the named flags
  exist.*

  - **R-4** — The same edit SHALL place the deleted-branch exception adjacent to §4''s
  existing "(`PATCH .../pulls/{n}` accepts `state`)" claim so a reader of §4 alone
  cannot conclude PR state mutation is unconditional. *Instrument: read the edited
  card; the exception text sits within the same §4 entry as the PATCH claim.*

  - **R-5** — The change SHALL be confined to the files named in this spec — `.opencode/skills/gb-cli/SKILL.md`
  §4 (single-digit-line edit) plus the issues-card correction files named in R-7;
  no attic''d structure is restored and no other file changes. *Instrument: the deck
  change''s diff touches only the files named in R-5 and R-7.*

  - **R-6** — The edited cards SHALL carry provenance citing `.opencode#2382`, per
  the deck-governance admission gate. *Instrument: each changed card''s provenance
  front-matter and SPDX provenance comment cite `.opencode#2382`.*

  - **R-7** — The issues card''s operational instructions SHALL state the local/remote
  boundary explicitly: local-issues commands manage only the local issues-data store
  and never interact with or update any remote issues-system API on any platform;
  remote issue operations SHALL be routed through the platform-appropriate skill card
  (gh-cli / gb-cli) in addition to the local-issues card. §7''s mirror-repair instruction
  SHALL cease attributing the remote-body pointer correction to `update --github`,
  and the `local-issues-cli.md` reference''s `update` row SHALL carry the same explicit
  local-only statement. *Instrument: read the corrected card and reference; both state
  the doctrine explicitly, and no instruction in either file attributes a remote correction
  to a local-only command (exhaustive read — both files are short).*


  ## Success criteria


  | ID | Criterion | Class | Instrument |

  |---|---|---|---|

  | SC-1 | An agent following the corrected deck differentiates the two surfaces without
  prompting: updating a local store record routes via local-issues; editing the remote
  tracker''s issue body routes via the platform-appropriate card (gh-cli / gb-cli);
  local-issues is never used for the remote operation | behavioral | Fresh-context
  comprehension probe — an agent that has loaded only the corrected issues card is
  given two scenarios (update the local store record for repo#N; edit the remote tracker''s
  issue body for repo#N); PASS requires local-issues for the first, the platform card
  for the second, and no local-issues attempt for the remote operation |


  ## Impact


  Consumers, first defect: agents operating GitBucket PRs under the gb-cli card —
  the scenario is agent-judgment cleanup of superseded or stale PRs whose branches
  are already deleted; no scripted deck flow calls `gb pr close`, so there is no automated
  caller to break. Consumers, second defect: every agent flow that spans the local
  store and the remote tracker — filing, mirroring, repair, revision — is exposed
  to the misrouting §7 invites; the divergence is silent, so it surfaces only when
  someone reads the remote half. Blast radius: three card/reference files, single-digit
  lines each, corrective wording only; existing card guidance is otherwise unchanged.
  Risk of the status quo, first defect: an agent hits an unexplained 404 mid-cleanup
  with only generic failure guidance and no recovery path. Risk of the status quo,
  second defect: agents follow §7 as written, believe the remote body was corrected,
  and the store and tracker silently diverge.


