title: '[BUG] gb pr edit --web fallback absent from skill deck'
status: closed
labels:
- needs-approval
body: '## Problem


  On this GitBucket instance, REST PR edit is unavailable. `gb pr edit` without `--web`
  fails with `Error: REST PR edit is unavailable on this GitBucket instance. Re-run
  with --web to allow the GitBucket web UI fallback.` The `--web` flag uses the GitBucket
  web UI as a fallback and works correctly. At filing, this was documented only in
  root `AGENTS.md` — the skill deck had zero occurrences of `--web` or `pr edit --state`
  — so sub-agents following the deck would attempt `gb pr edit` without `--web` and
  hit the documented error.


  Filed 2026-08-27 against the pre-rip deck; the affected-file paths named at filing
  (`gb-cli/SKILL.md`, `issue-operations/platforms/gitbucket-api/SKILL.md`) have since
  been superseded by the deck rewrite.


  ## Scope


  Disposition decision: whether the live deck still needs the `--web` guidance for
  `gb pr edit`, and if so, in which live card(s) it belongs.


  ## Requirements


  - R-1. Wherever the live deck teaches GitBucket PR editing, the working `--web`
  fallback SHALL be documented if `gb pr edit` still requires it.


  ## Impact


  Consumers: agents performing PR edits against a GitBucket instance via the `gb`
  CLI. Risk: low — a documented-elsewhere CLI quirk — but the deck gap sent sub-agents
  into a known failure path at filing.


  > Full spec and plan artifacts: https://github.com/michael-conrad/.opencode/tree/issues-data/2384/


  Local artifacts: `.opencode/.issues/2384/`


  ---

  🤖 Co-authored with AI: OpenCode (deepseek-v4-flash)

  '
