spec_path: .opencode/.issues/2402/spec.md
issue_number: 2402
interface_boundaries:
  - boundary: finishing-checklist -> trailer classification
    source: .opencode/skills/finishing-a-development-branch/tasks/checklist.md
    target: .opencode/skills/finishing-a-development-branch/tasks/prepare.md
    compatibility: compatible
    note: SC-1/SC-2 route trailer absence to auto-fix in checklist.md; prepare.md carries the remediation procedure. Both must agree on the MISSING-ELEMENT classification and the --force-with-lease remediation.
  - boundary: finishing-checklist -> force-push authorization gate
    source: .opencode/skills/finishing-a-development-branch/tasks/checklist.md
    target: .opencode/guidelines/000-critical-rules.md
    compatibility: compatible
    note: The scope guard (SC-4/SC-5) confines the auto-force-push carve-out to the agent's own unmerged, unshared branch; shared/merged/trunk branches defer to the generic force-push authorization gate. No weakening of the generic gate.
  - boundary: finishing-checklist -> co-author attribution authority
    source: .opencode/skills/finishing-a-development-branch/tasks/checklist.md
    target: .opencode/guidelines/080-code-standards.md
    compatibility: compatible
    note: Trailer auto-fix (SC-1/SC-2) and footer byline auto-fix (SC-3) add missing attribution; they never skip or weaken the mandatory co-author attribution checks (R-7).
  - boundary: finishing-checklist -> trailer format authority
    source: .opencode/skills/finishing-a-development-branch/tasks/checklist.md
    target: .opencode/skills/git-workflow-commit/tasks/commit-prep.md
    compatibility: compatible
    note: The remediation procedure reuses the repo-standard Co-authored-by trailer format (AI + human collaborator trailers) from commit-prep.md; no new trailer schema is introduced.
  - boundary: finishing-checklist -> force-push precedent
    source: .opencode/skills/finishing-a-development-branch/tasks/checklist.md
    target: .opencode/skills/git-workflow-pr/tasks/pr-creation/create-pr.md
    compatibility: compatible
    note: The auto-force-push carve-out reuses the existing sanctioned --force-with-lease mechanism and the "Step 7.2.3: Rebase on Stale Base" precedent (force push authorized because PR not merged and branch not shared). No new force-push mechanism.
  - boundary: finishing-checklist -> squash-push trailer application
    source: .opencode/skills/finishing-a-development-branch/tasks/checklist.md
    target: .opencode/skills/git-workflow-pr/tasks/pr-creation/squash-push.md
    compatibility: compatible
    note: Trailer auto-fix at finishing complements, rather than replaces, the PR-time squash that applies repo-standard trailers.
  - boundary: finishing-checklist -> checkpoint commit policy
    source: .opencode/skills/finishing-a-development-branch/tasks/checklist.md
    target: .opencode/skills/git-workflow-commit/tasks/implementation.md
    compatibility: compatible
    note: Trailer-free WIP implementation commits remain permitted; finishing-time remediation is clarified, not a change to checkpoint commit policy.
dependency_contract:
  - id: trailer-format
    source: .opencode/skills/git-workflow-commit/tasks/commit-prep.md
    target: .opencode/skills/finishing-a-development-branch/tasks/checklist.md
    type: format-constraint
    constraint: >
      Co-authored-by trailers MUST use the repo-standard two-trailer format:
      `Co-authored-by: <AgentName> (<ModelId>) <noreply@example.com>` (AI author) and
      `Co-authored-by: <dev.name> <dev.email>` (human collaborator). The auto-fix adds
      these exact trailers; no alternative trailer schema is introduced.
  - id: force-push-mechanism
    source: .opencode/skills/git-workflow-pr/tasks/pr-creation/create-pr.md
    target: .opencode/skills/finishing-a-development-branch/tasks/checklist.md
    type: mechanism-constraint
    constraint: >
      The agent-owned remediation SHALL force-push with `--force-with-lease` only.
      `--force` is forbidden. The carve-out applies only to the agent's own, unmerged,
      unshared feature branch; shared/merged/trunk branches defer to the generic
      force-push authorization gate in 000-critical-rules.md.
  - id: attribution-mandate
    source: .opencode/guidelines/080-code-standards.md
    target: .opencode/skills/finishing-a-development-branch/tasks/checklist.md
    type: invariant
    constraint: >
      Co-author trailer and footer byline requirements remain mandatory and unchanged.
      The auto-fix adds missing trailers/bylines; it never skips or weakens the mandatory
      co-author attribution checks (R-7).
  - id: scope-guard
    source: .opencode/skills/finishing-a-development-branch/tasks/checklist.md
    target: .opencode/guidelines/000-critical-rules.md
    type: scope-constraint
    constraint: >
      The auto-force-push carve-out is confined to the agent's own, unmerged, unshared
      feature branch. On a shared, merged, or trunk branch, the checklist SHALL refuse
      auto-force-push and defer to the generic force-push authorization gate.
