spec_path: .opencode/.issues/2402/spec.md
issue_number: 2402
state_transitions:
  - sc: SC-1
    concern: trailer-classification
    transitions:
      - from: branch_complete_but_trailer_missing
        to: trailer_remediated_by_agent
        trigger: checklist classifies trailer absence on agent-own unmerged branch as auto-fixable MISSING-ELEMENT
      - from: trailer_remediated_by_agent
        to: branch_ready_for_pr
        trigger: agent adds repo-standard trailers via amend/squash and force-pushes with --force-with-lease
  - sc: SC-2
    concern: trailer-remediation
    transitions:
      - from: branch_complete_but_trailer_missing
        to: trailer_remediated_by_agent
        trigger: agent amends/squashes own commits to add Co-authored-by trailers, then force-pushes with --force-with-lease
      - from: trailer_remediated_by_agent
        to: branch_ready_for_pr
        trigger: remediation complete, no developer force-push decision solicited
  - sc: SC-3
    concern: footer-byline-autofix
    transitions:
      - from: new_file_missing_footer_byline
        to: new_file_footer_byline_present
        trigger: producing agent auto-fixes missing "Co-authored with AI:" footer byline, preserving existing bylines
  - sc: SC-4
    concern: scope-guard
    transitions:
      - from: branch_agent_own_unmerged_unshared
        to: auto_force_push_permitted
        trigger: scope guard confirms agent-own, unmerged, unshared branch
  - sc: SC-5
    concern: scope-guard
    transitions:
      - from: branch_shared_or_merged_or_trunk
        to: generic_force_push_gate
        trigger: scope guard refuses auto-force-push and defers to generic force-push authorization gate
guarded_transition:
  - from: branch_shared_or_merged_or_trunk
    to: auto_force_push
    forbidden: true
    note: The scope guard SHALL refuse auto-force-push on a shared, merged, or trunk branch; the guarded branch routes to the generic authorization gate instead.
failure_modes:
  - condition: agent attempts `--force` instead of `--force-with-lease`
    result: remediation SHALL fail
  - condition: branch is shared with another developer, merged, or the trunk
    result: scope guard SHALL refuse auto-force-push and defer to the generic force-push authorization gate
