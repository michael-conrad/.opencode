  conventions_observed:
    - "SKILL.md Workflows steps use sub-bullets: Prompt, Context passed, Returns, Execution mode."
    - "Task cards define authoritative Result Contract and Entry Criteria."
    - "The skill-card vs task-card division of labor (000-critical-rules.md): skill card = routing metadata for orchestrator; task card = execution procedure for sub-agent. Task cards must not re-dispatch."
    - "Result contracts carry only routing-significant data: status, finding_summary, artifact_path, blocker_reason (per 020-go-prohibitions.md §1.1)."
    - "The lint's `task-card-internal-dispatch` regex matches `\b(task\(|skill\(\s*\{)` and skips lines containing a single quote or 'NOT call'/'not call'."
    - "The lint's `dispatch-contract-incomplete` regex treats any backtick-quoted snake_case/dotted token in Entry Criteria as a required context parameter — this over-matches BLOCK reasons (SPEC_NOT_FOUND) and git remote names (origin)."
