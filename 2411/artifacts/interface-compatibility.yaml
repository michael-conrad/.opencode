# Interface compatibility for issue 2411
# Prohibit false numerical reduction targets in condensation specs

interfaces:
  - interface: "Prohibited Content Patterns section of spec-structure-standards.md"
    kind: modified
    compatibility: backward_compatible
    phases: [1]
    detail: "A new bullet entry is added to the section. Existing entries unchanged. Consumers that Read-link the section (create.md, validate.md, spec-audit-investigator.md, spec-audit-evaluator.md) see an additional entry — no breaking change."
  - interface: "spec-audit-evaluator.md Step 5 narrow criteria"
    kind: modified
    compatibility: backward_compatible
    phases: [2]
    detail: "A new narrow criterion (SC-NUMERICAL-TARGET) is added. Existing criteria (SC-TRACKING-LANG, SC-PRESCRIPTIVE-CODE, etc.) unchanged. The evaluator sub-agent's output contract is unchanged — a new check contributes to the same aggregate PASS/FAIL verdict."
  - interface: "tests-v2/behaviors/ scenario surface"
    kind: new
    compatibility: backward_compatible
    phases: [3]
    detail: "A new behavioral scenario script is added. test-enforcement.sh discovery (--changed/--tag) and the harness (with-test-home) are unchanged. The two-SC pattern (generation + clean-room evaluation) follows the established template."
  - interface: "opencode.jsonc preload mechanism"
    kind: unchanged
    compatibility: not_applicable
    phases: []
    detail: "explicitly out of scope — the instructions array is not altered"
  - interface: "Evidence type taxonomy (cost-model-standards.md / spec-structure-standards.md §Evidence Type Taxonomy)"
    kind: unchanged
    compatibility: not_applicable
    phases: []
    detail: "explicitly out of scope — the taxonomy is not altered"

removed_interfaces: []
breaking_changes: []
dependency_contract:
  description: "Concrete dependency data derived from spec #2411 affected files and success criteria — real sources, real targets, real phase ordering, real dependency edges"
  phase_ordering:
    - phase: 1
      scs: [SC-1, SC-2]
      files:
        - .opencode/reference/spec-structure-standards.md
    - phase: 2
      scs: [SC-3]
      files:
        - .opencode/skills/audit/tasks/spec-audit-evaluator.md
    - phase: 3
      scs: [SC-4, SC-5]
      files:
        - .opencode/tests-v2/behaviors/
  entries:
    - source: "spec-structure-standards.md §Prohibited Content Patterns (SC-1, SC-2, Phase 1)"
      target: "spec-creation pipeline producers (create.md, validate.md, spec-audit-investigator.md, spec-audit-evaluator.md)"
      type: "content reference (Read-link)"
      constraint: "the new entry prohibits hard byte-count/token-count/percentage/line-count reduction thresholds as PASS/FAIL criteria and states the emergent-property principle; consumers that Read-link the section observe the added entry — no breaking change"
    - source: "spec-structure-standards.md §Prohibited Content Patterns (SC-1, SC-2, Phase 1)"
      target: "behavioral test scenario script (SC-4, SC-5, Phase 3)"
      type: "cross-phase dependency"
      constraint: "Phase 3 depends on Phase 1 — the behavioral test's agent under test must encounter the reference rule (read §Prohibited Content Patterns) and flag/refuse the false numerical target; the rule must exist before the behavior is observable"
    - source: "spec-audit-evaluator.md Step 5 narrow criteria (SC-3, Phase 2)"
      target: "spec-structure-standards.md §Prohibited Content Patterns (SC-1, SC-2, Phase 1)"
      type: "content reference (Read-link)"
      constraint: "the new narrow criterion SC-NUMERICAL-TARGET Read-links §Prohibited Content Patterns and verifies absence of false numerical reduction targets; the referenced section already exists (line 176) so the Read-link is satisfied without requiring the Phase 1 entry — Phase 2 does not gate on Phase 1"
    - source: "behavioral test scenario script (SC-4, Phase 3)"
      target: "clean-room evaluation of session.yaml (SC-5, Phase 3)"
      type: "same-phase sequential dependency"
      constraint: "SC-5 evaluates the session.yaml artifact produced by the SC-4 scenario run (via with-test-home); SC-5 cannot produce a verdict before the SC-4 artifacts exist — both reside in Phase 3"
  cross_phase_edges:
    - from: 1
      to: 3
      rationale: >-
        Phase 3 (behavioral test SC-4/SC-5) depends on Phase 1 (SC-1/SC-2 reference rule
        entry). The agent under test reads the reference's Prohibited Content Patterns
        section and flags/refuses the false numerical target; that rule must exist before
        the behavior is observable and testable.
