# Solve Output — Issue 2411: Prohibit false numerical reduction targets in condensation specs
# Z3 constraint solving + planner evidence for the 3-phase dependency DAG.

spec_path: ".opencode/.issues/2411/spec.md"

solve_model:
  command: ".opencode/tools/solve model --contract-path .opencode/.issues/2411/dependency-contract.yaml --query 'z3.And(phase_1_done, phase_2_done, phase_3_done)'"
  status: "SAT"
  model:
    phase_1_done: true
    phase_2_done: true
    phase_3_done: true
    sc1_done: true
    sc2_done: true
    sc3_done: true
    sc4_done: true
    sc5_done: true
    reference_entry_exists: true
    audit_criterion_exists: true
    behavioral_artifacts_exist: true
    evaluation_verdict: true
  note: "All 5 SCs across 3 phases are satisfiable under the dependency contract (preconditions + invariants)."

solve_check:
  command: ".opencode/tools/solve check --contract-path .opencode/.issues/2411/dependency-contract.yaml --state-path .opencode/.issues/2411/artifacts/state.yaml"
  status: "SAT"
  detail: "SAT (+ postconditions + invariants)"
  note: "Target post-implementation state satisfies all dependency contract preconditions, postconditions, and invariants."

solve_status: "SAT"
plan_status: "SOLVED_SATISFICING"

plan_result:
  command: ".opencode/tools/plan plan --problem .opencode/.issues/2411/artifacts/phase-problem.yaml"
  problem_file: ".opencode/.issues/2411/artifacts/phase-problem.yaml"
  output_file: ".opencode/.issues/2411/artifacts/plan-output.yaml"
  engine: "tamer"
  plan_length: 5
  outcome: "SOLVED_SATISFICING"
  plan:
    - do-phase-1
    - do-phase-2
    - do-phase-3-sc4
    - do-phase-3-sc5
    - complete-phase-3
  note: >-
    Plan respects the dependency DAG: Phase 1 -> Phase 3 (cross-phase, do-phase-3-sc4
    requires phase_1) and SC-4 -> SC-5 same-phase sequential (do-phase-3-sc5 requires
    sc4_artifacts). Phase 2 does not gate on Phase 1. Problem file built from
    dependency-contract.yaml phase DAG per the established workaround for the defective
    step-12 CLI invocation (documented in .opencode#2320, filed as .opencode#2322).

blocker_reason: ""
