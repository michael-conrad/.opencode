# Interface compatibility for issue 2413
# Ensure interface-compatibility.yaml always emits dependency_contract section

interfaces:
  - interface: "interface-compatibility.yaml artifact schema (spec-creation pipeline output)"
    kind: modified
    compatibility: backward_compatible
    phases: [1]
    detail: "A new dependency_contract section is added to the artifact. Existing keys (interfaces, removed_interfaces, breaking_changes) unchanged. Consumers (research.md step 9, solve/plan tools) now receive structured dependency data that was previously absent."
  - interface: "research.md step 9 dependency_contract extraction"
    kind: modified
    compatibility: backward_compatible
    phases: [2]
    detail: "Step 9 either validates the existing dependency_contract section or auto-backfills it from interfaces/removed_interfaces/breaking_changes keys. The output (dependency-contract.yaml) structure is unchanged — only the source of the data changes. The blocking condition (DEPENDENCY_CONTRACT_NOT_FOUND) is removed or relaxed."
  - interface: "writing-plans contracts schema templates"
    kind: modified
    compatibility: backward_compatible
    phases: [3]
    detail: "Schema templates are verified for producer-consumer agreement. No breaking change — only structural verification is added."

removed_interfaces: []
breaking_changes: []
dependency_contract:
  description: "Concrete dependency data derived from spec #2413 affected files and success criteria — real sources, real targets, real phase ordering, real dependency edges"
  phase_ordering:
    - phase: 1
      scs: [SC-1]
      files:
        - .opencode/skills/spec-creation/tasks/analyze.md
        - .opencode/skills/brainstorming/tasks/top-down-analysis.md
    - phase: 2
      scs: [SC-2]
      files:
        - .opencode/skills/writing-plans/tasks/research.md
    - phase: 3
      scs: [SC-3]
      files:
        - .opencode/skills/writing-plans/contracts/
  entries:
    - source: "analyze.md Step 5.1.5 / top-down-analysis.md Step 3c (SC-1, Phase 1)"
      target: "research.md step 9 (SC-2, Phase 2)"
      type: "artifact schema (interface-compatibility.yaml → dependency_contract section)"
      constraint: "Phase 1 emits dependency_contract as a key in interface-compatibility.yaml; Phase 2 reads and extracts it into dependency-contract.yaml. The section structure must match between producer and consumer."
    - source: "research.md step 9 extracted dependency-contract.yaml (SC-2, Phase 2)"
      target: "solve/plan tools (.opencode/tools/solve, .opencode/tools/plan)"
      type: "input data (dependency-contract.yaml)"
      constraint: "The extracted contract at {issues_prefix}/{N}/dependency-contract.yaml must match the schema solve/plan tools expect. Auto-backfill (if chosen) must produce contracts indistinguishable from natively generated ones."
    - source: "spec-creation pipeline interface-compatibility.yaml (SC-1, Phase 1)"
      target: "writing-plans contracts schema templates (SC-3, Phase 3)"
      type: "schema agreement verification"
      constraint: "Phase 3 verifies that the dependency_contract section structure emitted by Phase 1 matches the contract schema templates. Both must agree on keys, nesting, and required fields."
  cross_phase_edges:
    - from: 1
      to: 2
      rationale: "Phase 2 (research.md step 9) depends on Phase 1 (interface-compatibility.yaml with dependency_contract). Without the section, step 9 cannot extract dependency-contract.yaml, blocking the plan pipeline."
    - from: 1
      to: 3
      rationale: "Phase 3 verifies the schema produced by Phase 1 against contract templates. The verification can only run after the Phase 1 artifact is generated."
