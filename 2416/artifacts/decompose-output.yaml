## Success Criteria (derived from requirements)

| SC-ID | Description | Evidence Type | Verification Method |
|-------|-------------|---------------|-------------------|
| SC-1 | Build-verification gate for releases runs the test suite WITHOUT `-xtest` | behavioral | `git diff --Butter/AGENTS.md` shows build commands for release contexts exclude `-xtest` |
| SC-2 | Build-verification gate asserts test-report XML has `tests > 0`, `skipped == 0`, `failures == 0` | behavioral | Add CI step or build script that parses test report XML; verify it blocks on empty/failed test run |
| SC-3 | `-xtest`-is-the-norm convention removed or gated for release contexts | structural | `Butter/AGENTS.md` updated to distinguish dev-build vs release-build command sets |
| SC-4 | `ConvertInnodbRowFormatDynamicValidationTest` passes without `-xtest` | behavioral | `./gradlew build :DaoCore2:test` passes |
| SC-5 | Existing development workflow (`-xtest` for local builds) remains unaffected | structural | Local dev build commands in AGENTS.md still use `-xtest` |

