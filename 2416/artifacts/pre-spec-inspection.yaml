# Pre-Spec Inspection Findings
# Issue: #2415 - [BUG] Release/build verification gate satisfiable with -xtest
# Date: 2026-08-29

## Codebase Access

The affected codebase (Butter project at `Butter/AGENTS.md`) is NOT available in the current checkout.
The issue is filed in the `.opencode` repo (michael-conrad/.opencode) but targets the Butter project's
build system.

## Findings

1. **Affected file (external):** `Butter/AGENTS.md:79` — Documents `-xtest` as the norm for build commands
2. **Affected file (external):** `Butter/AGENTS.md:92` — Mandates "BUILD SUCCESSFUL with 0 test failures"
3. **Affected file (external):** `Butter/AGENTS.md:96-97` — "Skipped tests are failed tests" / "Verify test execution"
4. **Root cause:** Build-verification rule checks exit code of a command (`./gradlew build -xtest`) that does NOT run tests. The "0 test failures" gate is trivially satisfied when no tests were executed.
5. **Specific test failure:** `ConvertInnodbRowFormatDynamicValidationTest` fails on MariaDB SQL syntax error — `DELIMITER`-laden stored-procedure script executed as single JDBC `Statement`.
6. **Existing related issue:** #2340 (shallow temp-copy release verification) — assumes canonical build command runs tests; this bug is orthogonal.

## Project-Local Tooling

The `.opencode` repo itself has its own build/test toolchain (uv, pytest, ruff, pyright). 
This issue affects a different project (Butter) that uses Gradle (`./gradlew build`).

## Relevant Patterns in .opencode Repo

- **skills/release-promoter/**: GitHub Release and tag creation — focuses on post-merge tag/release ops, not pre-release build verification
- **AGENTS.md**: Contains "Build / Lint / Test Commands" section with `uv run pytest`, `uvx ruff check`, etc. — no `-xtest` equivalent
- **tests-v2/**: Test harness and behavioral test infrastructure — includes `with-test-home` for isolated testing
- **guidelines/080-code-standards.md**: Enforcement Test Mandate — behavioral tests required for rule changes
- **guidelines/091-incremental-build.md**: Incremental build discipline — per-item TDD cycles

## Key Distinction

This issue is filed in the .opencode repo but concerns the Butter project's build verification.
The fix would need to be applied to the Butter project's AGENTS.md and/or build pipeline.
