   remain valid for development/iteration builds where speed matters.
   - Source: Issue body "for release/build verification contexts"
   - Verification: Reasonable constraint from context

7. **Must not break development workflow.** Developers using `-xtest` locally for rapid
   iteration should not be affected by the new gate.
   - Source: Implicit from constraint #6
   - Verification: Reasonable constraint from context

## Non-requirements (explicitly excluded)

