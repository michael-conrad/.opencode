# Requirements Extraction
# Issue: #2415 - [BUG] Release/build verification gate satisfiable with -xtest
# Date: 2026-08-29

## Explicit Requirements (stated directly)

1. **Build-verification gate MUST run actual tests.** The canonical build command for
   release/build verification contexts must execute the test suite (no `-xtest`).
   - Source: Issue body "Make the release/build verification gate run the actual test suite (no -xtest)"
   - Verification: Cannot verify against Butter AGENTS.md (unavailable in this checkout)

2. **Build-verification gate MUST assert test execution metrics.** The gate must check
   test-report XML for `tests > 0`, `skipped == 0`, `failures == 0` — not just a non-zero
   build exit code.
   - Source: Issue body "assert the test-report XML shows tests > 0, skipped == 0, failures == 0"
   - Verification: Cannot verify against Butter build pipeline (unavailable)

3. **Remove or gate the `-xtest`-is-the-norm convention.** For release/build verification
   contexts, remove the convention or add an explicit "tests actually executed" assertion.
   - Source: Issue body "Remove or gate the -xtest-is-the-norm convention"
   - Verification: Cannot verify against Butter AGENTS.md (unavailable)

## Implicit Requirements (inferred from context)

4. **Fix `ConvertInnodbRowFormatDynamicValidationTest`.** The specific test failure
   (MariaDB SQL syntax error — DELIMITER-laden script as JDBC Statement) must be fixed
