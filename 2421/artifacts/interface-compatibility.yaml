## Dependency Contract

- id: DC-1
  source: IF-1 (070-environment.md directive)
  target: IF-2 (075-docs-verification.md Read-link)
  type: artifact schema
  constraint: >
    The Read-link in 075 MUST reference the directive section in 070 using the
    Read [Text](path) pattern. The directive text lives in exactly one place
    (070) — 075 carries only the link, never duplicated text.

- id: DC-2
  source: IF-3 (behavioral test script)
  target: behavior_run() in helpers.sh
  type: artifact schema
  constraint: >
    The script MUST follow the artifact-only generator contract: source
    helpers.sh, set SCENARIO_NAME/SCENARIO_PROMPT, call behavior_run, exit 0.
    No assertion helpers, no evaluation, no helpers.sh modification.

- id: DC-3
  source: IF-3 (behavioral test artifacts)
  target: SC-4 clean-room evaluation
  type: artifact schema
  constraint: >
    The evaluation MUST read session.yaml (PRIMARY evidence source) from the
    artifact directory produced by behavior_run. stdout.log/stderr.log are
    secondary and MUST NOT be the evaluation source.

- id: DC-4
  source: IF-4 (per-scenario fixture)
  target: harness fixture injection
  type: artifact schema
  constraint: >
    The fixture script MUST accept the workdir as $1 and MUST be named exactly
    fixtures/setup/<scenario-name>.sh matching SCENARIO_NAME.
