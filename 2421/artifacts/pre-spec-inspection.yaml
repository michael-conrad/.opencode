connectivity_verification:
  - purpose: Verify live package registries are reachable before the spec
    claims the behavioral test can query them (Connectivity Verification Gate)
  - evidence:
    - command: curl -s -o /dev/null -w "pypi.org HTTP %{http_code}" https://pypi.org/pypi/pyyaml/json
      result: "HTTP 200 in 0.063s"
    - command: curl -s -o /dev/null -w "registry.npmjs.org HTTP %{http_code}" https://registry.npmjs.org/lodash
      result: "HTTP 200 in 0.072s"
    - command: curl -s --max-time 10 -H "User-Agent: opencode-config-spec-analysis" https://crates.io/api/v1/crates/serde
      result: "HTTP 200 (crates.io requires a User-Agent header; bare curl returns 403)"
  - conclusion: >
    PyPI and npm registries are reachable without special headers. crates.io
    requires a User-Agent header (403 without, 200 with) — the directive and
    behavioral test must account for this (e.g., curl -H "User-Agent: ..." or
    the registry client's default UA).

key_findings:
  - The gap is real: no guideline currently directs agents on WHERE dependency
    version numbers come from. 070-environment.md governs HOW (edit
    pyproject.toml + uv sync, `~=` pins), 065/075 prohibit memory-based claims
    generally, but no text mandates live-registry verification before pinning.
  - Existing `~=` pinning mandates in 070-environment.md (PEP 723 section)
    are the natural anchor for the new directive.
  - The behavioral test must be a real-domain task (e.g., "add dependency X to
    pyproject.toml") — NOT a prose-recall prompt (AGENTS.md §11 hard-fail).
  - The two-SC pattern (artifact generation + clean-room evaluation) is the
    established structure for behavioral SCs (AGENTS.md §6a).
  - crates.io requires a User-Agent header — the directive should mention
    registry API access patterns or keep the directive registry-agnostic.
  - Recent precedent (2411, 2419): standalone content-verification tests are
    NOT registered in test-enforcement.sh; behavioral tests run directly from
    behaviors/. No runner registration needed.
