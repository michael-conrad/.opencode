affected_files:
  - path: .opencode/guidelines/070-environment.md
    role: primary_edit_target
    reason: >
      Governs HOW a dependency is added (edit pyproject.toml + uv sync, `~=`
      pinning, PEP 723 version pinning mandates). The new directive (WHERE the
      version number comes from) is a natural extension of the existing
      "Version Pinning (MANDATORY)" section. Tier 2 guideline, load_when:
      sub-agent.
    existing_patterns:
      - "Version Pinning (MANDATORY)" section mandates `~=` compatible-release
        pins for PEP 723 scripts (requires-python `~=X.Y.0`, dependencies `~=`)
