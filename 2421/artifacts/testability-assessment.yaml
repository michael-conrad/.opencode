## Testability Risks

- risk: Live registry calls in behavioral test depend on network availability
  mitigation: Registries verified reachable (pypi.org 200, npmjs 200, crates.io
    200 with UA). The justified-older-pin exception path covers documented
    offline cases in the directive itself.
- risk: crates.io 403 without User-Agent header
  mitigation: Test prompt and directive must not assume header-less access;
    the agent's registry query should use a UA (curl -H or client default).
- risk: Behavioral test runtime (~5+ min per run)
  mitigation: Scope-limited execution (single scenario) per 020-go-prohibitions
    §1 scope-limited behavioral testing default.
- risk: Model may not have network tools enabled in the test environment
  mitigation: The test prompt is a real-domain task; the harness provisions a
    full opencode environment. If the model cannot reach the registry, the
    evaluation FAILS (correct outcome — the directive is not followed).
