# Testability assessment — .opencode#2421
# Mandatory live-registry verification of dependency versions before pinning

issue_number: 2421
artifact: testability-assessment

## Phase 1: Directive in 070-environment.md

test_strategy: mixed (structural content + behavioral)
tests:
  - id: T1-1
    type: content (structural)
    name: test-2421-sc1-directive-present.sh (Phase 4, optional)
    description: >
      Standalone content-verification test asserting the directive text
      (live-registry verification mandate, justified-older-pin exception,
      training-data recall prohibition) exists in 070-environment.md.
    red_condition: directive absent -> test FAILS
    green_condition: directive present -> test PASSES
    precedent: test-2411-sc1-false-numerical-target-entry.sh,
      test-2419-sc1-echo-printf-removed.sh
  - id: T1-2
    type: behavioral
    name: 2421-sc1-live-registry-verification.sh (Phase 3)
    description: >
      Real-domain task: agent must add a dependency to the test project's
      pyproject.toml. Behavioral evidence (session.yaml) shows whether the
      agent queried the live registry before pinning.
    red_condition: agent pins a recalled version without registry query
    green_condition: agent queries the live registry before pinning

