## Phase 3b: Clean-room evaluation (SC-4)

test_strategy: behavioral (clean-room sub-agent evaluation)
tests:
  - id: T3-2
    type: behavioral
    description: >
      Spec SC dispatching a clean-room sub-agent to read session.yaml and
      evaluate whether the agent queried the live registry before pinning.
    verification:
      - session-to-timeline tool (.opencode/tools/session-to-timeline) for
