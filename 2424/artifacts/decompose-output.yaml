decomposition:
  issue: 2424
  method: "One item per success criterion; each item = single red/green/verify/commit cycle."
  items:

    - item_number: 1
      sc_id: SC1
      title: "Add `You are a sub-agent.` prefix to read-plan dispatch prompt"
      inputs: "executing-plans/SKILL.md Workflows -> Read the plan -> Prompt string"
      outputs: "read-plan dispatch Prompt line contains `You are a sub-agent.` prefix"
      invariant: "Prefix remains inside the quoted prompt string, immediately before `Follow the instructions in`."
      failure_modes:
        - "Prefix inserted at wrong position (outside quote / after Follow)"
        - "Read-plan prompt not updated (only dispatch-phase)"
      verify: "grep for 'You are a sub-agent' in read-plan prompt; visual diff vs conforming spec-creation pattern"

    - item_number: 2
      sc_id: SC1
      title: "Add `You are a sub-agent.` prefix to dispatch-phase dispatch prompt"
      inputs: "executing-plans/SKILL.md Workflows -> Dispatch phases in sequence -> Prompt string"
      outputs: "dispatch-phase dispatch Prompt line contains `You are a sub-agent.` prefix"
      invariant: "Prefix inside quoted prompt; format mirrors conforming deck pattern."
      failure_modes:
        - "Prefix omitted from dispatch-phase prompt"
      verify: "grep 'You are a sub-agent' in dispatch-phase prompt"

    - item_number: 3
      sc_id: SC2
      title: "Resolve REQ-2 — replace hardcoded agent name in byline"
      inputs: "executing-plans/SKILL.md line 62 byline"
      outputs: "Byline uses `Co-authored with AI: <AgentName> (<ModelId>)` placeholder form"
      invariant: "Must match validator ATTRIBUTION_EXEMPT regex (`Co-authored with AI:.*<AgentName>.*<ModelId>`)."
      failure_modes:
        - "Hardcoded OpenCode/model id remains"
        - "Byline rewording breaks attestation format"
      verify: "run validate_skill_cards.py --json; assert zero executing-plans placeholder violations"

    - item_number: 4
      sc_id: SC2
      title: "Resolve REQ-3 — add missing `## Worktree Mode` section"
      inputs: "executing-plans/SKILL.md body (before Mandatory Task Discipline / after Overview)"
      outputs: "`## Worktree Mode` section with canonical direct-branch wording"
      invariant: "Heading exactly `## Worktree Mode` (matches WORKTREE_MODE_HEADING_RE)."
      failure_modes:
        - "Heading typo / lowercase causes REQ-3 to persist"
      verify: "validator worktree-mode violation cleared"

    - item_number: 5
      sc_id: SC2
      title: "Resolve REQ-6 — convert Workflows steps to numbered format"
      inputs: "executing-plans/SKILL.md Workflows section"
      outputs: "Workflow steps `N. **` without `- [ ] ` prefix; sub-bullets preserved"
      invariant: "WORKFLOW_STEP_RE `^\d+\.\s+\*\*` matches on line starts; sub-bullets (Prompt/Context/Returns) preserved."
      failure_modes:
        - "Only one step converted (workflows-steps persists)"
        - "Sub-bullet indentation broken, losing workflows-sub-bullets"
      verify: "validator executing-plans workflows-steps violation cleared"

    - item_number: 6
      sc_id: SC3
      title: "Resolve CONDENSATION-001 — rewrite read-plan dispatch link text to purpose condensation"
      inputs: "executing-plans/SKILL.md Read the plan -> Prompt link"
      outputs: "Link text = purpose condensation ('inventory plan phases') not path stem"
      invariant: "Link text must differ from path stem and not contain `tasks/` or end in `.md`."
      failure_modes:
        - "Link text still path stem -> CONDENSATION-001 persists"
      verify: "validator CONDENSATION-001 for read-plan cleared"

    - item_number: 7
      sc_id: SC3
      title: "Resolve CONDENSATION-001 — rewrite dispatch-phase dispatch link text to purpose condensation"
      inputs: "executing-plans/SKILL.md Dispatch phases in sequence -> Prompt link"
      outputs: "Link text = purpose condensation ('dispatch one plan phase') not path stem"
      invariant: "Link text must differ from path stem and not contain `tasks/` or end in `.md`."
      failure_modes:
        - "Link text still path stem -> CONDENSATION-001 persists"
      verify: "validator CONDENSATION-001 for dispatch-phase cleared"

    - item_number: 8
      sc_id: SC2
      title: "Full validator conformance gate — executing-plans card passes all checks"
      inputs: "remediated executing-plans/SKILL.md, unchanged validator"
      outputs: "`uv run .opencode/skills/skill-creator/scripts/validate_skill_cards.py --json` reports zero violations for skill executing-plans"
      invariant: "Validator unmodified (REQ-J); all other cards' violations are out of scope and must not be touched."
      failure_modes:
        - "executing-plans still has REQ-2/3/6 or CONDENSATION-001 violations"
        - "Remediation inadvertently changed other cards"
      verify: "run validator; grep executing-plans violations list == empty"
      dependency: "depends on items 1-7"

  sc_map:
    - sc_id: SC1
      summary: "Sub-agent role-identification prefix present on both dispatch entries"
      items: [1, 2]
    - sc_id: SC2
      summary: "Validator conformance defects remediated (REQ-2, REQ-3, REQ-6) and card passes full validator suite"
      items: [3, 4, 5, 8]
    - sc_id: SC3
      summary: "Dispatch link text rewritten from path restatement to purpose condensation"
      items: [6, 7]

  notes: >
    spec.md body does not enumerate an explicit numeric SC table; SC IDs (SC1-SC3) are derived
    from the scope bullets (dispatch prefix, validator defects, condensation). Item 8 is the
    final validator gate (SC2's "full validator suite to pass" acceptance).
