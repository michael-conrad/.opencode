testability_assessment:
  issue: 2424
  phases:

    phase_1:
      type: "behavioral + string"
      strategy: >
        String check: grep the read-plan and dispatch-phase Prompt sub-bullets for the
        `You are a sub-agent.` prefix. Optionally a behavioral opencode run dispatching
        executing-plans to assert a sub-agent is routed with the role-identification prefix
        (runtime evidence that dispatch routing carries the prefix). Given the change is
        dispatch-routing text, evidence type for SC1 is string/structural (prefix present in text).
      sc: SC1
      verification_domain: "dispatch-routing text + validator rule REQ-6 (workflows-steps/sub-bullets)"

    phase_2:
      type: "structural"
      strategy: >
        Run the validator; assert zero executing-plans violations (placeholder, worktree-mode,
        workflows-steps). REQ-2/3/6 are structural prose/format conventions verified by the
        read-only validator.
      sc: SC2
      verification_domain: "validator conformance"

    phase_3:
      type: "string"
      strategy: >
        Assert both dispatch link labels equal purpose condensations and differ from the path stem;
        confirmed by the validator clearing CONDENSATION-001 for executing-plans.
      sc: SC3
      verification_domain: "link-text condensation"

    gate:
      type: "integration/structural"
      strategy: >
        Full `uv run .opencode/skills/skill-creator/scripts/validate_skill_cards.py --json` run,
        asserting the `executing-plans` skill_name has an empty violations list. This is the SC2
        'full validator suite passes' acceptance.
      sc: SC2
      verification_domain: "full-suite validator gate"

  behavioral_testing_note: >
    Because the change edits dispatch-routing prompt text in a static skill card (not executable
    runtime code), primary evidence is structural/string (validator + grep). A behavioral
    opencode-run dispatch test is an optional confirmation that the card still routes correctly
    with the prefix; it is not the primary verification since the change is textual conformance,
    not runtime code behavior.
