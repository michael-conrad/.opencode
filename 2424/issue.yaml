  | SC-9 | The card SHALL pass the full validator suite with zero violations for skill
  `executing-plans`. | behavioral | Run `uv run .opencode/skills/skill-creator/scripts/validate_skill_cards.py
  --json`; assert the `executing-plans` skill_name has an empty violations list |


  ## 4. Requirements


  - R-1. The `read-plan` entry''s dispatch prompt text SHALL begin with the `You are
  a sub-agent.` prefix inside the quoted prompt string.

  - R-2. The `execute-phase` entry''s dispatch prompt text SHALL begin with the `You
  are a sub-agent.` prefix inside the quoted prompt string.

  - R-3. The byline SHALL use the placeholder form `Co-authored with AI: <AgentName>
  (<ModelId>)` instead of the hardcoded `OpenCode (deepseek-v4-flash)`.

  - R-4. The card SHALL include a `## Worktree Mode` section with exactly the canonical
  direct-branch wording quoted verbatim in Appendix A of this spec.

  - R-5. The Workflows section SHALL use the numbered `N. **` format without the `-
  [ ] ` checkbox prefix.

  - R-6. The `read-plan` dispatch link text SHALL be a purpose condensation (`inventory
  plan phases`) that differs from the path stem.

  - R-7. The `execute-phase` dispatch link text SHALL be a purpose condensation (`dispatch
  one plan phase`) that differs from the path stem.

  - R-8. The card SHALL include a `## Mandatory Task Discipline` section with the
  deck''s canonical checklist content.

  - R-9. The card SHALL pass the full validator suite with zero violations for skill
  `executing-plans`.

  - R-10. The `executing-plans` task files (`read-plan.md`, `execute-phase.md`) SHALL
  NOT be modified.

  - R-11. No other skill card in the deck SHALL be modified.

  - R-12. The validator (`validate_skill_cards.py`) SHALL NOT be modified.


