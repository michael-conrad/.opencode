  # Spec: Remediate executing-plans SKILL.md — missing sub-agent dispatch text and
  validator conformance defects


  ## 1. Intent and Executive Summary


  | # | Field | Description |

  |---|-------|-------------|

  | 1 | **Problem Statement** | The skill card at `.opencode/skills/executing-plans/SKILL.md`
  is the only non-conforming skill card in the deck. Its two workflow entries (`Read
  the plan` → `tasks/read-plan.md`, `Execute phases in sequence` → `tasks/execute-phase.md`)
  lack the deck''s canonical sub-agent dispatch prompt text, and the validator (`validate_skill_cards.py`)
  flags the card on REQ-2, REQ-3, REQ-5, and REQ-6 (live run 2026-09-19). |

  | 2 | **Root Cause / Motivation** | The card''s dispatch prompt strings (the `task()`
  task-card dispatch strings its entries direct the orchestrator to compose) lack
  the `You are a sub-agent.` role-identification prefix. Because `task()` does not
  auto-load task cards, the sub-agent must receive the role-identification prefix
  so it reads the task card independently. The card also carries a hardcoded agent
  name in its byline (REQ-2), lacks the `## Worktree Mode` section (REQ-3), lacks
  the `## Mandatory Task Discipline` section (REQ-5), and uses checkbox-format workflow
  steps (REQ-6). Additionally, its dispatch link texts are path-adjacent rather than
  the deck''s purpose-condensation form — a standards-alignment gap (the live validator
  reports no CONDENSATION-001 for this card because its relative `tasks/` links fall
  outside the validator''s dispatch-link pattern). This breaks the DISPATCH_GATE conformance
  baseline. |

  | 3 | **Approach Chosen** | Edit `.opencode/skills/executing-plans/SKILL.md` to
  align with the deck''s conforming pattern: ensure both entries'' dispatch prompt
  strings begin with `You are a sub-agent.`, convert the Workflows section to numbered
  format (REQ-6), add the `## Worktree Mode` section (REQ-3), add the `## Mandatory
  Task Discipline` section (REQ-5), replace the hardcoded agent name with the placeholder
  convention (REQ-2), and rewrite the dispatch link texts to purpose condensations
  (standards alignment with the condensation rule). Re-validate against `validate_skill_cards.py`
  until the card passes all checks with zero violations. |

  | 4 | **Alternatives Considered & Why Discarded** | **Leave the card non-conforming**
  — discarded because the card would continue to break the DISPATCH_GATE conformance
  baseline and route sub-agents without the role-identification prefix, producing
  defective dispatch behavior. **Modify the validator to exempt the card** — discarded
  because the validator is explicitly out of scope (REQ-J) and the card should conform
  to the standard, not the standard to the card. |

  | 5 | **Key Design Decisions** | **Dispatch prompt prefix is inside the quoted prompt
  string** — the `You are a sub-agent.` prefix must be inside the quoted prompt passed
  to the sub-agent, forming the canonical template `concat("You are a sub-agent. Follow
  the instructions in [<condensation>](<path>). <context...>")`. **Link text is a
  purpose condensation, not a path restatement** — the href/path stays the same so
  sub-agent discovery still resolves; only the label text changes. **Task cards and
  validator are untouched** — behavior of `read-plan.md`/`execute-phase.md` and the
  validator are explicitly out of scope. |

  | 6 | **User Intent / Original Prompt** | The spec was created to remediate the
  executing-plans SKILL.md card so it conforms to the current skill-card standards
  and passes the validator. |


  ## 2. Not Included


  - **Changes to the `executing-plans` task files (`read-plan.md`, `execute-phase.md`)
  behavior** — task behavior is explicitly out of scope (REQ-H); the task purpose
  statements serve only as condensation sources.

  - **Any change to other skill cards in the deck** — other cards'' violations (including
  SC-LINT-001 description-pattern warnings) are out of scope (REQ-I).

  - **Any change to the validator (`validate_skill_cards.py`) itself** — the validator
  is a read-only reference for the gate (REQ-J).

  - **Change to the executing-plans description field** — it already conforms (no
  SC-LINT-001 on description); not listed for change (REQ-K).


  ## 3. Success Criteria


  | ID | Criterion | Evidence Type | Verification Method |

  |----|-----------|---------------|---------------------|

