  ## 9. Enforcement Gate


  > **Enforcement gate:** All success criteria MUST pass before this spec is considered
  complete. Partial implementation is not permitted.


  ## 10. Cost Frame


  Cost is measured in defect-discovery-latency, not tool calls. Correctness is the
  only metric.


  - **SC-1:** Verifying the read-plan dispatch prompt carries the `You are a sub-agent.`
  prefix costs one grep search. Skipping means the read-plan dispatch-routing defect
  ships — the sub-agent is dispatched without the role-identification prefix and fails
  to read the task card independently, surfacing as a behavioral failure at the first
  read-plan dispatch.

  - **SC-2:** Verifying the execute-phase dispatch prompt carries the `You are a sub-agent.`
  prefix costs one grep search. Skipping means the execute-phase dispatch-routing
  defect ships — the sub-agent is dispatched without the role-identification prefix
  and fails to read the task card independently, surfacing as a behavioral failure
  at the first step-marked dispatch.

  - **SC-3:** Verifying the byline uses the placeholder form costs one grep search.
  Skipping means the hardcoded agent name persists, and the REQ-2 violation is only
  caught at the next validator run — a death-spiral start where a string PASS masks
  a conformance defect.

  - **SC-4:** Verifying the `## Worktree Mode` section exists costs one grep search.
  Skipping means the missing-section defect ships, and the REQ-3 violation is only
  caught at the next validator run.

  - **SC-5:** Verifying the Workflows section uses numbered format costs one grep
  search. Skipping means the checkbox-format defect ships, and the REQ-6 violation
  is only caught at the next validator run.

  - **SC-6:** Verifying the read-plan dispatch link text is a purpose condensation
  costs one grep search. Skipping means the path-adjacent link text persists, diverging
  from the deck''s purpose-condensation rule.

  - **SC-7:** Verifying the execute-phase dispatch link text is a purpose condensation
  costs one grep search. Skipping means the path-adjacent link text persists, diverging
  from the deck''s purpose-condensation rule.

  - **SC-8:** Verifying the `## Mandatory Task Discipline` section exists costs one
  grep search. Skipping means the missing-section defect ships, and the REQ-5 violation
  is only caught at the next validator run.

  - **SC-9:** Running the full validator suite costs minutes of execution time. Skipping
  means the conformance defects (REQ-2/3/5/6) ship unchanged and the card remains
  the deck''s only non-conforming card, breaking the DISPATCH_GATE baseline and failing
  the next skill-creator audit.


  ## 11. Edge Cases


  - **Input boundaries:** The `You are a sub-agent.` prefix must be inserted inside
  the quoted prompt string, immediately before `Follow the instructions in`. Inserting
  it outside the quote or after `Follow` produces a malformed dispatch prompt. **Expected
  behavior:** the prefix SHALL be inside the quote, immediately before `Follow the
  instructions in`. **Resolution:** verify by grep + visual diff against the conforming
  spec-creation dispatch pattern.

  - **State transitions:** The card transitions from `non_conformant` → `partial`
  (after phase 1, 2, or 3) → `conformant` (all fixes applied) → `validated` (gate
  passes). A regression (edit reverts a fix) returns the card to `non_conformant`.
  **Expected behavior:** each phase''s edits are confined to disjoint regions of SKILL.md
  so diffs are revert-isolated. **Resolution:** if the validator reports a new violation
  class (e.g., workflows-sub-bullets broken by REQ-6 renumbering), return to the failing
  rule, fix, and re-validate.

  - **Failure modes:** If the validator still reports an executing-plans violation
  after remediation, the card is in `gate_failed` state. **Expected behavior:** diagnose
  the specific rule id and re-apply the fix. **Resolution:** return to `conformant`
  and re-run the gate.

  - **Concurrency:** All phases edit the same single file (executing-plans/SKILL.md).
  Non-overlap must be preserved to keep each phase''s diff isolated. **Expected behavior:**
  edits touch disjoint regions (dispatch prompt text, byline/section/headers, link
  labels). **Resolution:** keep edits confined to disjoint regions per phase.

  - **Recovery:** If a phase''s edit is reverted or malformed, the card returns to
  `non_conformant`. **Expected behavior:** re-apply the fix and re-validate. **Resolution:**
  the validator gate catches any regression before completion.


