  (<ModelId>)` instead of the hardcoded `OpenCode (deepseek-v4-flash)`. | string |
  grep the byline for `<AgentName> (<ModelId>)`; assert the hardcoded `OpenCode (deepseek-v4-flash)`
  is absent |

  | SC-4 | The card SHALL include a `## Worktree Mode` section with exactly the canonical
