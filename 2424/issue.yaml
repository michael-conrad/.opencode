  ## Appendix A — Canonical `## Worktree Mode` Section (Verbatim)


  The following is the canonical `## Worktree Mode` section text used verbatim by
  the deck''s conforming cards (identity across `brainstorming/SKILL.md`, `research/SKILL.md`,
  and `completion-core/SKILL.md` live-verified by grep on 2026-09-19 — exactly one
  exact match per card; see the verification record in Section 8). SC-4 requires the
  executing-plans card to contain a `## Worktree Mode` section with exactly this body
  text:


