decompose_output:
  issue_number: 2425
  note: "Decomposition derives candidate SC-IDs from requirements; the create task will finalize the formal SC table. Each item maps to exactly one SC and one RED/GREEN/verify/commit cycle."
  items:
    - item: 1
      sc_id: SC-1
      concern: "default-model.sh DEFAULT_TEST_MODEL fallback value"
      source_requirement: R1
      interface:
        input: "grep '^DEFAULT_TEST_MODEL=\"\${DEFAULT_TEST_MODEL:-ollama/qwen3.8:27b-256k-gguf4}\"' default-model.sh"
        output: "fallback matches new value"
      invariant: "Only the literal value changes; variable name and overridability preserved"
      failure_mode: "fallback literal diverges from gguf4 value"
      test: "test-2376-sc1-red.sh"
      tdd_cycle: "RED (assert gguf4, currently stale) -> GREEN (replace literal) -> verify -> commit"
    - item: 2
      sc_id: SC-2
      concern: "with-test-home fallback model strings"
      source_requirement: R2
      interface:
        input: "grep for old literal in with-test-home (lines 135, 264)"
        output: "both fallbacks equal gguf4 value"
      invariant: "seed_model_config and warmup fallback use DEFAULT_TEST_MODEL env var with gguf4 fallback"
      failure_mode: "any fallback string still points to qwen3.8:27b-256k"
      test: "test-2376-sc2-red.sh"
      tdd_cycle: "RED -> GREEN -> verify -> commit"
    - item: 3
      sc_id: SC-3
      concern: "Documentation references across 5 files"
      source_requirement: R3, R4, R5, R6, R7
      interface:
        input: "grep for old literal in .opencode/tests-v2/AGENTS.md, docs/model-dependency.md, README.md, .opencode/AGENTS.md, parent AGENTS.md"
        output: "zero occurrences of old literal across all 5 files"
      invariant: "documentation mirrors source of truth value"
      failure_mode: "any doc reference still contains pre-gguf4 value"
      test: "test-2376-sc3-red.sh"
      tdd_cycle: "RED -> GREEN -> verify -> commit"
  dependency_graph:
    - "SC-1 is prerequisite for SC-2 (with-test-home sources default-model.sh)"
    - "SC-1 is prerequisite for SC-3 (documentation mirrors source of truth)"
  acyclic: true
  single_concern_check:
    - "SC-1: one file (default-model.sh), one verification domain (content-verification grep)"
    - "SC-2: one file (with-test-home), one verification domain"
    - "SC-3: documentation files only, one verification domain"
  notes:
    - "sc3 test currently checks OLD literal 'qwen3.6:35b-256k' (pre-2376). For SC-3 in issue #2425, the OLD_LITERAL must be updated to 'qwen3.8:27b-256k' (the pre-2425 default) so GREEN drives full removal of the current default across the 5 doc files."
