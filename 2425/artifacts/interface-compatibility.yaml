spec_path: .opencode/.issues/2425/spec.md
module_interfaces:
  - source_module: .opencode/tests-v2/with-test-home
    target_module: .opencode/tests-v2/default-model.sh
    interface: DEFAULT_TEST_MODEL environment variable sourcing
    detail: with-test-home consumes the DEFAULT_TEST_MODEL env var that default-model.sh defines. SC-1 sets the fallback in default-model.sh; SC-2/SC-3 update the mirror fallbacks in with-test-home.
    compatibility: Preserve the DEFAULT_TEST_MODEL variable name and env-var overridability so the sourcing contract is unchanged. Only the literal fallback values change.
  - source_module: .opencode/tests-v2/with-test-home
    target_module: opencode.jsonc (seeded)
    interface: default model seed value via seed_model_config()
    detail: seed_model_config() writes the default_model value into the generated opencode.jsonc used by the test harness run.
    compatibility: The seeded value must match the new gguf4 literal so harness runs use the updated model. No schema or key change.

dependency_contract:
  dependencies:
    - source: with-test-home (seed_model_config, line 135)
      target: DEFAULT_TEST_MODEL env var from default-model.sh
      type: literal_fallback
      constraint: fallback must equal ollama/qwen3.8:27b-256k-gguf4 with var name and env override preserved
      sc: [SC-2]
    - source: with-test-home (warmup smoke test, line 264)
      target: DEFAULT_TEST_MODEL env var from default-model.sh
      type: literal_fallback_unenvwrapped
      constraint: fallback must equal ollama/qwen3.8:27b-256k-gguf4, updated independently
      sc: [SC-3]
    - source: test-2376-scN-red.sh assertions
      target: target file literals
      type: content_verification
      constraint: assertion literal must match gguf4 value; target literal must match assertion to avoid test failure
      sc: [SC-1, SC-2, SC-3, SC-4, SC-5, SC-6, SC-7, SC-8]
    - source: Local Ollama instance
      target: ollama/qwen3.8:27b-256k-gguf4
      type: external_availability
      constraint: model tag ba02985ca4b1 (17 GB) present and runtime-available
      sc: [SC-1, SC-2, SC-3]

interface_compatibility_summary: |
  The change is a coordinated literal-value swap. No function signatures, schemas,
  or runtime contracts change. The only interfaces are: (1) the DEFAULT_TEST_MODEL env
  sourcing contract between default-model.sh and with-test-home, preserved; and
  (2) the seeded model value written to opencode.jsonc, updated to the gguf4 literal.
  The dependency_contract above records the concrete fallback sources, real targets,
  and type constraints (content-verification string equality, env override preservation,
  external Ollama availability).
