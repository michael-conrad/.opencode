## Harness Constraints (tests-v2/AGENTS.md lessons)

- All behavioral tests via `bash .opencode/tests-v2/with-test-home opencode run '<message>'` — never bare opencode run.
- Bash tool timeout >=600s; `rm -f tmp/.behavior-run.lock` before re-runs.
- Scope-limited execution by default (--scenario/--tag/--changed).
- No numerical reduction thresholds as PASS/FAIL (#2411) — injection-size stat is informational only.
- Behavioral evidence = agent actions in session.yaml stderr (skill dispatches, tool calls); prose recall in stdout is NOT behavioral evidence.
- Artifact-only generator pattern for new scenarios (2411/2425-era precedent).

## Verdict

Partial coverage today: existing suite guards Tier-1 core behaviors (regression value) but NO test covers carve-out, anti-recitation, or Tier-2 routing reachability. Testability adequate for a spec with a named test-sweep phase (SC-8) + new behavioral scenarios (items 1-2) + routing spot-checks (items 3-5).