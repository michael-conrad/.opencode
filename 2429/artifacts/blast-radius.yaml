## Ripple Effects

1. Every demoted section requires: destination file + INDEX row + Read-link pointer in source core + re-pointed consumer links + updated test prompts. Missing any one → unreachable rule or broken consumer.
2. §A/§B additions alter 000 runtime content → new behavioral tests required (substrate-determined behavioral change per critical-rules-BEH-EV).
3. Dedup changes which file "owns" a rule → downstream greps by rule semantics must resolve to the canonical file.
4. Scope G (evidence-only): the monitoring mandate's GREEN change is already committed (4989ffb5) — no further harness edits authorized under this plan; the phase-8 cycle records RED baseline + monitored-run evidence (poll log + semantic diagnosis) under tmp/behavioral-evidence-2427-sc10-*/ and tmp/2427/artifacts/. A defect found in the committed harness is a spec-revision trigger, not an inline fix.
5. Scope H: renumbering create.md Step 3 changes the number source for every future spec issue creation — the `.issues/N/` directory name, issue.yaml `remote_issue` field, and all blockquote/URL/cross-reference derivations now bind to the remote-assigned N BY CONSTRUCTION; the verified 2427↔2429 divergence class is eliminated. The create task's result contract gains a BLOCKED outcome — downstream orchestrators consuming the result contract must treat `API_FAILURE_MID_FLOW` as a halt-with-retry state (re-run binds to the remote-owned N), never a local-counter fallback.

