## Path 6 — Spec-Creation Create-Task Numbering Flow (scope H, 2026-09-03)

```
spec-creation create task (create.md)
  Step 3 (remote API available — RESTRUCTURED to remote-number-first):
    1. create remote issue stub FIRST (before any local record)
    2. extract remote-assigned number N from the API create response's `number` field
    3. create local issue record at exactly N (.issues/N/, issue.yaml with remote_issue: N)
    4. write binding fields (remote_issue, remote_url, github_url) all referencing N
       → local == remote BY CONSTRUCTION
  Step 3 alternative (local-only mode — no remote API):
    → local-counter numbering (the ONLY mode where the counter picks the number)
  On API failure mid-flow (stub created, local write fails):
    → task returns BLOCKED (blocker reason API_FAILURE_MID_FLOW) — no silent reassignment, no half-bound state
  If the remote-assigned N's local directory already exists:
    → renumber/migrate repair pattern (migrate existing local directory to N, then create)
```

Change impact: the incumbent stub-first flow creates the remote stub but picks the local number independently (local counter / autonumber) — two independent number sources that drift (verified defect: local 2427 assigned while remote counter was at 2429; remote #2427 a MERGED PR). Remote-number-first makes the remote API response the single number source when a remote exists. Downstream consumers of the number (blockquote URLs, artifact paths, cross-references) inherit the construction-time binding with no divergence possibility. The `.counter` and `remote_issue` interfaces keep their shapes; the counter is demoted to local-only-mode use only.

