## Concern Boundary Violations Fixed

1. 020 mixes authorization law with context mechanics and discussion etiquette — three concerns, one Tier-1 file.
2. 080 mixes universal standards with Python-only standards — language-specific concern in a universal Tier-1 file.
3. AGENTS.md mixes session-critical workflow with install instructions and tool tables.
4. Duplicate canonical-homes: 020 §4 ↔ 085; AGENTS.md Pair Mode ↔ 116.
5. (scope H) spec-creation create task used two independent number sources (local counter vs remote namespace) — the local number was picked independently of the remote-assigned number, silently binding mismatched pairs (verified defect: local 2427 assigned while remote counter was at 2429; remote #2427 a MERGED PR). Remote-number-first makes the remote API the single number source when a remote exists.

## Separation Rules

- Authorization semantics: one home (020 core). Halt rules: one home. Context mechanics: one home (Tier-2). Python standards: one home (Tier-2). Attribution: one home (080 core).
- §A carve-out and §B anti-recitation: canonical in 000 only; no restatement in 020 (020 core may Read-link 000 for the clause).
- Research-cards catalogue rule: demoted copy keeps Read-link to the canonical `.issues/research-cards` procedure (per 020 §1.6 current text).
- (scope H) Issue-number sourcing: one source per mode — remote API create response `number` field when a remote API is available; local counter ONLY in local-only mode. No dual-source mode exists; the create task MUST NOT use the local counter to pick the number when a remote API is available.

