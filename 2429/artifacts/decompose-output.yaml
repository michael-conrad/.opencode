## Problem Statement

The injected Tier-1 corpus duplicates semantic rules across multiple injected files and injects scenario-governed content into always-loaded context. Same-semantics content in multiple injected files wastes context and risks divergence; scenario-governed content at Tier 1 wastes context for every session that never enters the scenario. Remedy: dedup to single canonical homes and demote scenario-governed content to Tier-2 routing, preserving semantics exactly and keeping every rule reachable, while #497 core stays in main context.

