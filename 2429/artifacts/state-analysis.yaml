## Idempotency & Rollback

All changes are file edits in a git-tracked submodule — fully reversible via git reset to checkpoint tag. No data migrations, external systems, or databases. tmp/ artifacts are disposable and rebuildable. Scope-H mid-flow failure state is recoverable by design: the remote stub at N persists and a re-run binds to it (BLOCKED is a halt-with-retry state, not data loss).
