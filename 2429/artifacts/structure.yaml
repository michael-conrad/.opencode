# Triplet co-location: each SC's RED, GREEN, and COMMIT steps are assigned to exactly one phase
# (SC-1/SC-2 -> phase 1; SC-3 -> phase 2; SC-4 -> phase 3; SC-5 -> phase 4; SC-6/SC-7 -> phase 5;
# SC-8 -> phase 6; SC-9 -> phase 7; SC-10 -> phase 8; SC-11 -> phase 9). No SC has steps split
# across phases.
# SC-10's GREEN is pre-committed as 4989ffb5 — Item 10's cycle is the RED baseline +
# monitored-run evidence recording against the committed GREEN; all three steps
# (RED baseline, monitored evidence, verify) remain in phase 8.
# SC-11's evidence is structural per the spec's developer-directed declaration (behavioral runs
# impractical for a deterministic number-sourcing flow): create.md read-back + fixture scenario
# script; all three steps (RED, GREEN, verify) plus the commit remain in phase 9.
#
# Cross-phase dependency: RED tests in each phase depend only on the pre-change repository state
# or on SC output committed in the SAME or an EARLIER phase. Phase 5's RED (duplicate occurrences
# present) reads the pre-change state and the already-committed phase 2-4 edits; phase 6's RED
# (dangling anchors post-move) reads committed phase 2-4 output; phase 7's RED is the pre-change
# guard check; phase 8's RED baseline is the unmonitored-run comparison against the already-
# committed GREEN (4989ffb5) — independent of phases 2-7 outcomes; phase 9's RED reads the
# incumbent create.md stub-first flow — independent of phases 2-8 outcomes. No RED depends on
# output from a LATER phase.
#
# Parallelism note: phases 2, 3, and 4 are mutually independent (disjoint files/concerns) once
# phase 1 completes; the DAG edges into phases 5-9 encode the sequencing constraints only.
# Phase 8 (GREEN pre-committed) and Phase 9 (disjoint content) are chained sequentially after
# Phase 7 for daisy-chaining; their content work has no production dependency on the other
# phases' outcomes.