# Blast radius for issue 2431
# Stacked-PR ordering gate: parent PR must wait for submodule PR merges

phases:
  - phase: 1
    items: [item-1, item-2, item-3, item-4, item-5, item-6, item-7, item-10, item-11]
    affected_components:
      - .opencode/skills/git-workflow-pr/tasks/pr-creation/enforcement-gate.md (authoritative site — new ordering gate: in-scope enumeration, live-API merge-state verification with bounded retry, pointers-ride-alongside rule, no-`+`-prefix and pointer-ancestry assertions, per-submodule blocking-reason reporting, waiting behavior)
      - .opencode/skills/git-workflow-pr/tasks/pr-creation.md (SC-5/SC-11 documentation anchor — Pre-Push Submodule Pointer Verification and waiting-behavior cross-reference)
