    ripple_effects:
      - "Stacked-PR pipeline halts before parent PR creation while any in-scope submodule PR is unmerged — multi-submodule releases (Butter-style) now wait for submodule merges"
      - "The #2313 Step 0 reachability gates remain unchanged and coexist with the new ordering gate in the same card (fail-open reachability vs fail-closed merge state)"
      - "Parent branches idle during the wait: no commits, pushes, or PR mutations until all in-scope submodule PRs land"
      - "Behavioral suite grows by three scenarios requiring merge-state fixture provisioning (multi-submodules + platform API merge state)"
