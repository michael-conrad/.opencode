# Interface compatibility for issue 2431
# Stacked-PR ordering gate: parent PR must wait for submodule PR merges

interfaces:
  - interface: "pr-creation/enforcement-gate Step 0 result contract (submodule_checks)"
    kind: modified
    compatibility: backward_compatible
    phases: [1]
    detail: "The ordering gate extends the existing Step 0 result contract. Existing keys (status, submodule_checks entries with path/committed_sha/remote_dev_sha/merged/result/detail, summary) remain unchanged. New per-submodule blocking-reason categories (unmerged PR, inconclusive state, stale pointer, +-prefixed working tree) are added as new status values/report fields without altering existing PASS/FAIL/SKIP semantics. The #2313 reachability check keeps its SUBMODULE_PR_MISSING failure code; the ordering gate adds merge-state and inconclusive codes."
  - interface: "pr-creation task routing (enforcement gate ordering)"
    kind: modified
    compatibility: backward_compatible
    phases: [1]
    detail: "pr-creation.md Step 0-1 routes to pr-creation/enforcement-gate; the ordering gate evaluates immediately before parent stacked PR creation within that routing. No routing changes — the gate's blocking authority is exercised inside the existing enforcement-gate call. The waiting behavior (parent branch idles) means the gate may return BLOCKED with a wait reason instead of proceeding to Step 1; the orchestrator re-attempts PR creation after submodule merges land."
  - interface: "pr-creation.md Pre-Push Submodule Pointer Verification language"
    kind: modified
    compatibility: backward_compatible
    phases: [1]
    detail: "The pointers-ride-alongside rule already documented in pr-creation.md gains explicit timing alignment with the ordering gate (pointer bumps committed on the parent feature branch after merges land). No removal of existing staging-verification steps — additive cross-reference only."
  - interface: "pre-commit-pointer-check task role"
    kind: modified
    compatibility: backward_compatible
    phases: [2]
    detail: "The task card gains an advisory/consistency annotation for the ordering gate. Its existing staging-hygiene behavior (dirty pointers staged alongside non-submodule changes, SKIP_STALE_POINTER_CHECK escape hatch) is unchanged."
  - interface: "post-implementation task role"
    kind: modified
    compatibility: backward_compatible
    phases: [2]
    detail: "The task card gains an advisory/consistency annotation for the ordering gate. Its push-without-PR behavior and HALT-for-developer-review flow are unchanged."
  - interface: "tests-v2 behavioral suite surface"
    kind: modified
    compatibility: backward_compatible
    phases: [1, 2]
    detail: "New artifact-only generator scripts for SC-1/SC-6/SC-7 following the two-SC pattern, using existing harness flags (BEHAVIOR_NEEDS_MULTI_SUBMODULES=1, fixtures/issues/2431/, fixtures/setup/). No changes to helpers.sh scenario-specific logic (per-scenario state belongs in fixtures/setup/). The suite's role as behavioral-evidence instrument is annotated as advisory (no runtime blocking authority)."

removed_interfaces: []
breaking_changes: []
dependency_contract:
  description: "Concrete dependency data derived from spec #2431 affected files and success criteria — real sources, real targets, real type constraints, real phase ordering"
  phase_ordering:
    - phase: 1
      scs: [SC-1, SC-2, SC-3, SC-4, SC-5, SC-6, SC-7, SC-10, SC-11]
      files:
        - .opencode/skills/git-workflow-pr/tasks/pr-creation/enforcement-gate.md
        - .opencode/skills/git-workflow-pr/tasks/pr-creation.md
        - .opencode/tests-v2/behaviors/
    - phase: 2
      scs: [SC-8, SC-9]
      files:
        - .opencode/skills/git-workflow-pr/tasks/pr-creation/enforcement-gate.md
        - .opencode/skills/git-workflow-branch/tasks/pre-commit-pointer-check.md
        - .opencode/skills/git-workflow-pr/tasks/post-implementation.md
        - .opencode/tests-v2/behaviors/
  entries:
    - source: "tests-v2 behavioral suite (SC-1, SC-6, SC-7 artifact generation — Phase 1)"
      target: "pr-creation/enforcement-gate.md ordering gate (SC-1, SC-6, SC-7 GREEN implementation — Phase 1)"
      type: "behavioral evidence instrument → enforcement card content"
      constraint: "The behavioral scripts are artifact-only generators (exit 0, no evaluation); the clean-room evaluation sub-agent reads session.yaml per the two-SC pattern. Phase 1 implements the gate conditions and the tests together as one working slice per item. Harness dependency: BEHAVIOR_NEEDS_MULTI_SUBMODULES=1 provisioning and fixtures/issues/2431/ must exist before the scripts run."
    - source: "#2313 merged convention (origin/$DEFAULT_BRANCH terminology, Step 0 reachability gate, fail-open semantics)"
      target: "ordering gate in pr-creation/enforcement-gate.md (SC-3, SC-7 — Phase 1)"
      type: "convention dependency (terminology + coexisting gate semantics)"
      constraint: "Ancestry is asserted against origin/$DEFAULT_BRANCH dynamically resolved per submodule (never hardcoded master). The ordering gate is fail-closed on inconclusive merge state while Step 0 reachability remains fail-open on network error — the card must keep the two policies explicitly separated."
    - source: "GitHub REST API Pull requests endpoints (Get a PR; Check if a pull request has been merged)"
      target: "ordering gate merge-state verification (SC-1, SC-3, SC-4 — Phase 1)"
      type: "external API dependency"
      constraint: "Merge state is read from the API's merge-state fields (merged, merged_at); mergeable is null while GitHub computes mergeability in a background job, which is the inconclusive state driving the bounded retry (3 probes, 60-second intervals, then block naming the submodule PR)."
    - source: "pr-creation/enforcement-gate.md ordering gate (Phase 1)"
      target: "Phase 2 designation and advisory annotations (SC-8, SC-9)"
      type: "sequencing dependency"
      constraint: "The designation of the sole authoritative blocking check and the advisory annotations at the three non-selected sites are judged by clean-room sub-agents against gate content that exists after Phase 1; the Phase 2 items cannot reach GREEN before the Phase 1 gate language is in place."
    - source: "pr-creation.md Pre-Push Submodule Pointer Verification + pre-commit-pointer-check.md (pointers-ride-alongside convention)"
      target: "ordering gate timing rule (SC-5 — Phase 1)"
      type: "convention dependency (timing rule coherence)"
      constraint: "The card text must align the timing rule with the established pointers-ride-alongside convention: pointer bumps committed on the parent feature branch after merges land, never dropped, never standalone — consistent with the Submodule-Bump-Only PR Gate in the same card."
  cross_phase_edges:
    - from: 1
      to: 2
      rationale: "Phase 2 (SC-8/SC-9 designation and advisory annotations) is judged against the four enforcement sites as modified by Phase 1; the designation statement lives in the authoritative card Phase 1 creates. Clean-room judgments require the Phase 1 gate language to exist first."