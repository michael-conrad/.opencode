title: '[SPEC-FIX] Stacked-PR ordering gate: parent PR must wait for submodule PR
  merges (stale pointers on parent PR tree)'
status: open
labels:
- approved-for-pr
body: '> **Full spec and artifacts: [`.opencode/.issues/2431/`](https://github.com/michael-conrad/.opencode/tree/issues-data/2431/)**
  — this issue is a condensed exec summary; the authoritative spec lives in the `issues-data`
  branch.

  >

  > **Local artifacts:** `.opencode/.issues/2431/` — implementation plan, card catalogue,
  dependency contracts, research, designs, audit findings


  ## Problem


  The stacked-PR workflow has no ordering gate requiring a parent-repo stacked PR
  to wait for its in-scope submodule PRs to merge first. The pipeline therefore creates
  parent PRs whose only commit predates the submodule merges and carries stale submodule
  pointers — producing an open, structurally incomplete PR whose tree resolves pre-fix
  submodule SHAs and is unmergeable as-is. This fired for real during Butter #304.


  ## Scope


  - Add a mandatory ordering gate: parent stacked PR is created only after every in-scope
  submodule PR is verified merged via live platform API

  - Require submodule pointer bumps committed on the parent feature branch after merges
  land (pointers-ride-alongside rule)

  - Add a pre-PR gate asserting clean `git submodule status` (no `+` prefix) and pointer
  SHA ancestry to the submodule''s remote master

  - Evaluate enforcement placement across pr-creation entry criteria, git-workflow-branch
  pre-commit-pointer-check, executing-plans post-implementation steps, and a tests-v2
  behavioral test


  **Out of scope:** automatic submodule PR creation/cleanup; SKIP_STALE_POINTER_CHECK
  commit-time semantics; human merge behavior; non-stacked PR flows.


  ## Approach


  Introduce a three-condition ordering gate evaluated immediately before parent stacked
  PR creation: (1) every in-scope submodule PR verified merged via live platform API,
  (2) pointer bumps committed on the parent feature branch per pointers-ride-alongside,
  (3) pre-PR assertion that `git submodule status` is clean and each pointer SHA is
  an ancestor of the submodule''s remote master. Gate placement is evaluated across
  four candidate enforcement sites with exactly one authoritative blocking check.
  While waiting, the existing parent branch sits idle — the gate blocks PR creation
  until the submodule PRs land.


  ## Impact


  - **Risk:** Live-API merge verification can false-block when platform checks lag
  — *mitigation:* bounded retry/report path; inconclusive state blocks with a clear
  reason rather than guessing.

  - **Risk:** Ordering gate adds latency to multi-submodule releases — *mitigation:*
  latency is the cost of a mergeable parent PR; the gate reports which submodule PR
  is pending.

  - **Risk:** Four candidate gate sites could produce redundant/conflicting checks
  — *mitigation:* spec assigns exactly one authoritative blocking check, others advisory.

  - **Dependencies:** None external. Touches task cards in git-workflow-pr, git-workflow-branch,
  executing-plans, and the tests-v2 behavioral suite.

  - **Call to action:** Review and approve this spec to add the submodule-merge ordering
  gate to the stacked-PR workflow.


  ---


  🤖 OpenCode (ollama-cloud/glm-5.3-flash) created

  '
