name: concern-map
status: complete
source_issue: ".opencode#2432"
extends: ".opencode/.issues/2432/artifacts/concern-map.yaml (preliminary)"

concern_boundaries:
  - id: C1
    name: qualifier-enforcement
    sc_ids: [SC-01]
    file_category: "tool CLI resolution layer"
    verification_domain: "unit (argparse Namespace + SystemExit assertions)"
    separation: "pure routing concern — no file I/O changes"
  - id: C2
    name: project-dir-anchoring
    sc_ids: [SC-02]
    file_category: "tool identity/discovery layer"
    verification_domain: "unit (multi-CWD invariant tests)"
    separation: "identity only; qualifier enforcement (C1) consumes but does not implement anchoring"
  - id: C3
    name: worktree-bootstrap
    sc_ids: [SC-03]
    file_category: "tool git-integration layer"
    verification_domain: "unit (temp git fixtures: origin/issues-data present, local absent)"
    separation: "bootstrap policy only; no resolution-layer changes"
  - id: C4
    name: counter-hygiene
    sc_ids: [SC-04]
    file_category: "tool create-path"
    verification_domain: "unit (counter file assertions per repo)"
    separation: "depends on C1+C2 resolution output; owns no discovery logic"
  - id: C5
    name: yaml-hardening
    sc_ids: [SC-05]
    file_category: "tool parse layer"
    verification_domain: "unit (malformed fixture, no-crash + warning assertions)"
    separation: "single choke point (yaml_load) — consumers unchanged"
  - id: C6
    name: validate-yaml
    sc_ids: [SC-06]
    file_category: "tool new subcommand"
    verification_domain: "unit (fixture tree, exit-code gate)"
    separation: "consumes C5 error classification; owns no repair logic"
  - id: C7
    name: yaml-repair
    sc_ids: [SC-07]
    file_category: "issues-data worktree content"
    verification_domain: "integration (validate-yaml gate over real repos)"
    separation: "data migration only — zero tool-code edits; flagged-not-fixed for semantic breakage (CON-03)"
  - id: C8
    name: doctor
    sc_ids: [SC-08]
    file_category: "tool new subcommand (read-only)"
    verification_domain: "unit (fixture repo states)"
    separation: "diagnostics only — never mutates; complements C3/C4 residuals"
  - id: C9
    name: pipeline-gate
    sc_ids: [SC-09]
    file_category: "skill/task card markdown"
    verification_domain: "behavioral (with-test-home opencode run) + structural"
    separation: "agent-facing text only; gate depends on C6 subcommand existing"

single_concern_check: "Every SC targets exactly one file category and one verification domain; SC-01/02/04 all touch cmd_create but land as separate commits in DAG order — each commit remains single-concern by SC-ID"

cross_concern_seams:
  - "cmd_create: C1 (qualifier) + C2 (anchoring) + C4 (counter) — sequenced 1→2→4 to keep commits atomic"
  - "yaml_load: C5 produces error classes consumed by C6 — classification schema defined in SC-05 commit"
  - "validate-yaml: C6 gate semantics consumed by C7 (repair) and C9 (pipeline) — exit-code contract fixed before both"
