name: interface-compatibility
status: complete
source_issue: ".opencode#2432"
extends: ".opencode/.issues/2432/artifacts/interface-compatibility.yaml (preliminary)"
compatibility_surface: "CLI flags, stdout YAML shape, exit codes, stderr error strings (no Python importers — uv run --script boundary)"

interfaces:
  - name: "read / read-comments / read-labels / read-sub-issues --number"
    current: "{N | repo#N} (bare N fans out across all repos)"
    planned: "repo#N only — bare N exits 1 with qualifier listing"
    compat: BREAKING
    consumers: "issue-review/gather.md, issue-operations-core tasks, audit tasks, verification-before-completion operating-protocol.md, AGENTS.md examples, behavioral fixtures"
  - name: "create --number"
    current: "optional; auto-number into PROJECT_DIR with CWD-derived qualifier when omitted"
    planned: "REQUIRED and qualified (repo#N) — auto-qualify path removed (interpretation_a per preliminary artifact)"
    compat: BREAKING
    consumers: "issue-operations/platforms/local/tasks/creation.md, issue-operations-core/creation.md, spec-creation/tasks/create.md, fixtures 1364-for-pr-common.sh"
  - name: "update / comment / close / delete / link / renumber / promote --number"
    compat: NO-CHANGE (already _require_qualified enforced)
  - name: "validate-yaml [--repo QUALIFIER]"
    compat: NEW
    contract: "stdout: '<path>: <error-class>' lines; exit 0 clean, exit 1 malformed found"
  - name: "doctor"
    compat: NEW
    contract: "stdout: per-repo sections (qualifier, path, issues-data branch present, merge-base delta vs origin/issues-data, .counter state, worktree present); read-only, exit 0 unless internal error"
  - name: "yaml_load(content) -> Any"
    planned: "returns {} + stderr warn on malformed (never raises); raises nothing to callers"
    compat: MODIFIED (internal — 15 call sites inherit hardening)
  - name: "_resolve_repo_name() -> str"
    planned: "PROJECT_DIR.name (was CWD basename)"
    compat: MODIFIED (internal)
  - name: "_discover_all_repos() -> list[Path]"
    planned: "root = PROJECT_DIR (was CWD); .gitmodules-only discovery preserved"
    compat: MODIFIED (internal)
  - name: "_next_number(repo_path)"
    compat: MODIFIED (internal — callers must pass qualifier-resolved repo_path; counter state itself unchanged, corrupt counter stays FATAL)
  - name: "_issues_branch_exists(repo_path) / bootstrap step"
    planned: "checks refs/remotes/origin/issues-data; fetch+track when remote exists and local missing; orphan only when neither exists"
    compat: MODIFIED (internal)

removed_interfaces:
  - "create autonumber mode (--number omitted)"
  - "_resolve_qualified bare-N multi-repo fan-out"

breaking_changes:
  - "bare-number rejection across read-family and create"
  - "create requires explicit qualified --number (callers must reserve a number first — counter still exists for that purpose)"

dependency_contract:
  - source: "local-issues CLI (validate-yaml exit-code gate)"
    target: ".opencode/skills/spec-creation + writing-plans task cards (SC-09)"
    type: "artifact schema"
    constraint: "gate task cards BLOCK on exit 1; subcommand must exist and be stable before SC-09 lands (DAG: 6→9)"
  - source: "yaml_load error classification (SC-05)"
    target: "validate-yaml report classes (SC-06)"
    type: "artifact schema"
    constraint: "single shared error-class taxonomy (e.g., ScannerError, ParserError, DuplicateKey, ANSI-escape, truncation) — defined in SC-05, consumed by SC-06/SC-07"
  - source: "repaired issue.yaml/comments.yaml schemas (SC-07)"
    target: "yaml_load consumers (read/list/search/promote)"
    type: "artifact schema"
    constraint: "post-repair files must conform to state-analysis schema ({title, status, labels: [str], body, ...} / {comments: [{type, body, timestamp}]}) — no consumer changes required"
  - source: "counter semantics (SC-04)"
    target: "create callers reserving numbers (SC-01)"
    type: "artifact schema"
    constraint: "number reservation flow: caller runs _next_number(resolved_repo) or future explicit reserve path, then create --number repo#N"
  - source: "doctor health markers (SC-08)"
    target: "developer + pipeline diagnostics"
    type: "artifact schema"
    constraint: "marker vocabulary stable across runs; covers residual counter drift (B4) and divergent worktrees (B3)"

backward_compat_summary: "BREAKING (CLI bare-number rejection, create autonumber removal) — no shims per 087-no-backward-compat; all in-repo consumers updated in-phase"
