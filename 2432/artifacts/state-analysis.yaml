name: state-analysis
status: complete
source_issue: ".opencode#2432"
extends: ".opencode/.issues/2432/artifacts/state-analysis.yaml (preliminary — persistent state inventory and repair mappings retained)"

state_transitions_by_phase:

  - phase: SC-01 qualifier enforcement
    transitions:
      - from: "command invoked with bare N"
        to: "exit 1 + stderr qualifier listing (was: multi-repo fan-out read / CWD-auto-qualify create)"
      - from: "command invoked with repo#N"
        to: "unchanged single-repo resolution"

  - phase: SC-02 PROJECT_DIR anchoring
    transitions:
      - from: "identity = f(CWD); qualifier/location disagree across CWDs"
        to: "identity = f(PROJECT_DIR); invariant: same qualifier -> same .issues/ path from any CWD"

  - phase: SC-03 worktree bootstrap
    transitions:
      - state: "no local issues-data, origin/issues-data EXISTS"
        from: "orphan branch created (unrelated histories)"
        to: "git fetch origin issues-data + local branch tracking remote"
      - state: "no local issues-data, no remote"
        from: "orphan branch created"
        to: "unchanged (orphan path preserved)"

  - phase: SC-04 counter hygiene
    transitions:
      - from: "create with .opencode qualifier increments ROOT .counter"
        to: "increments .opencode/.issues/.counter; root counter untouched"
      - invariants: "corrupt counter -> FATAL exit (preserved); missing counter -> created at 1 (preserved); existing root drift value (52) NOT rewritten (NON-04)"

  - phase: SC-05 yaml hardening
    transitions:
      - from: "malformed content file -> uncaught exception -> command crash"
        to: "malformed content file -> stderr warn (path + error class) -> record skipped, command completes"

  - phase: SC-06 validate-yaml
    transitions:
      - from: "(no state)"
        to: "scan -> exit 0 (all parse) | exit 1 (>=1 malformed, file+class reported); no file mutation"

  - phase: SC-07 repair
    transitions:
      - from: "10 core tracking files malformed; ANSI-escape/truncated artifacts malformed"
        to: "core files parse cleanly (legacy GitHub-export -> canonical schema; markdown-comment -> structured); unrecoverable/semantic cases flagged in report, left as-is"
      - persistence: "repairs committed on issues-data branches via tool auto-commit"

  - phase: SC-08 doctor
    transitions:
      - from: "(no state)"
        to: "read-only per-repo report; surfaces residuals (root counter drift, divergent worktrees) without mutation"

  - phase: SC-09 pipeline gate
    transitions:
      - from: "artifact generation completes without YAML verification"
        to: "task procedure: validate-yaml runs post-generation; exit 1 -> BLOCKED result contract"

persistent_state_unchanged: ".counter format, issue.yaml canonical schema, comments.yaml schema, links.yaml schema — all preserved; only defect states transition"
