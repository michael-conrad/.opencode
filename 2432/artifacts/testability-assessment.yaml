name: testability-assessment
status: complete
source_issue: ".opencode#2432"
extends: ".opencode/.issues/2432/artifacts/testability-assessment.yaml (preliminary)"
existing_unit_coverage: "NONE for local-issues (.opencode/tests/ has only test_session_init/, test_skill_creator/) — all coverage new"
behavioral_fixture_risk: "13 tests-v2 scenario/fixture files reference the tool with bare numbers — audit before re-run post-change"

test_strategy_by_phase:

  - phase: SC-01 qualifier enforcement
    strategy: unit
    tests: "argparse.Namespace fixtures -> cmd_read/cmd_read_comments/cmd_read_labels/cmd_read_sub_issues/cmd_create; bare N asserts SystemExit(1) + stderr contains qualifier listing; qualified N asserts single-repo resolution; mutation commands assert unchanged _require_qualified behavior"
    framework: "uv run pytest .opencode/tests/test_local_issues.py"

  - phase: SC-02 PROJECT_DIR anchoring
    strategy: unit
    tests: "tmp_path repo fixture with .gitmodules; run resolution from two CWDs (repo root, nested subdir); assert identical _resolve_repo_name/_discover_all_repos/_resolve_qualified results; regression scenario mirrors live defect (read --number 2432 from .opencode/ subdir)"
    framework: unit

  - phase: SC-03 worktree bootstrap
    strategy: unit
    tests: "temp git fixture: bare origin with issues-data branch, clone without local branch; invoke bootstrap; assert local branch tracks origin, no orphan created, merge-base equality; second fixture without remote asserts orphan path still fires"
    framework: unit

  - phase: SC-04 counter hygiene
    strategy: unit
    tests: "two-repo fixture; create with .opencode qualifier; assert .opencode/.issues/.counter incremented and root .counter byte-identical; corrupt-counter fixture asserts FATAL exit preserved"
    framework: unit

  - phase: SC-05 yaml hardening
    strategy: unit
    tests: "malformed-content fixture (each error class); list/search/read complete without exception; stderr contains path + class; valid files in same tree still parsed"
    framework: unit

  - phase: SC-06 validate-yaml
    strategy: unit
    tests: "fixture tree with known-bad + known-good; assert exit 1 + '<path>: <class>' lines; clean tree asserts exit 0"
    framework: unit

  - phase: SC-07 repair
    strategy: integration
    tests: "RED: validate-yaml over the two real repos reports the 10 confirmed files; GREEN: post-repair validate-yaml exit 0 for core files; flag-report asserts semantic cases listed not rewritten; before/after evidence retained"
    framework: "integration via validate-yaml gate (live repos, tool auto-commit on issues-data branches)"

  - phase: SC-08 doctor
    strategy: unit
    tests: "fixture states: healthy repo (clean markers), missing local branch + remote present (unhealthy marker, no crash), corrupt counter (marker); read-only invariant — repo state hash unchanged after run"
    framework: unit

  - phase: SC-09 pipeline gate
    strategy: behavioral
    tests: "bash .opencode/tests-v2/with-test-home opencode run '<artifact-generation scenario>' — stderr-pattern assertions: agent invokes validate-yaml after artifact generation (GREEN), absent before change (RED); per 091 behavioral variant"
    framework: behavioral (with-test-home, >=600s timeout)

evidence_type_note: "SC-09 is runtime-behavioral (skill procedure change) — structural/string evidence is EVIDENCE_TYPE_MISMATCH; behavioral evidence mandatory. SC-01..SC-08 are tool-code changes verified by executable unit/integration tests."

coverage_command: "uv run pytest .opencode/tests/ --cov=.opencode/tools/ --cov-report=term-missing (new test_local_issues.py module)"
