# Dependency contract for issue 2432 (research task) — Z3 formalism
# Phase DAG: P1(identity) -> P2(infra); P3(parse-gate) -> P4(repair); P3 -> P5(integration); P3 -> P6(test-framework); P6-SC10 -> P6-SC11 -> P6-SC12 -> P6-SC13
source_issue: ".opencode#2432"
source_artifact: ".opencode/.issues/2432/artifacts/interface-compatibility.yaml"

variables:
  p1_identity_completed:
    type: bool
    nullable: false
  p2_infra_completed:
    type: bool
    nullable: false
  p3_parse_gate_completed:
    type: bool
    nullable: false
  p4_repair_completed:
    type: bool
    nullable: false
  p5_integration_completed:
    type: bool
    nullable: false
  p6_resumption_completed:
    type: bool
    nullable: false

preconditions:
  - "z3.Not(z3.And(p1_identity_completed, p2_infra_completed, p3_parse_gate_completed, p4_repair_completed, p5_integration_completed, p6_resumption_completed))"

invariants:
  - "z3.Implies(p2_infra_completed, p1_identity_completed)"
  - "z3.Implies(p4_repair_completed, p3_parse_gate_completed)"
  - "z3.Implies(p5_integration_completed, p3_parse_gate_completed)"
  - "z3.Implies(p6_resumption_completed, p3_parse_gate_completed)"

postconditions:
  - "z3.And(p1_identity_completed, p2_infra_completed, p3_parse_gate_completed, p4_repair_completed, p5_integration_completed, p6_resumption_completed)"

theorem:
  - "z3.Implies(z3.And(p4_repair_completed, p5_integration_completed), p3_parse_gate_completed)"
  - "z3.Implies(p2_infra_completed, p1_identity_completed)"

# Informal dependency_contract extracted as-is from interface-compatibility.yaml
dependency_contract:
  - source: "local-issues CLI (validate-yaml exit-code gate)"
    target: ".opencode/skills/spec-creation + writing-plans task cards (SC-09)"
    type: "artifact schema"
    constraint: "gate task cards BLOCK on exit 1; subcommand must exist and be stable before SC-09 lands (DAG: 6→9)"
  - source: "yaml_load error classification (SC-05)"
    target: "validate-yaml report classes (SC-06)"
    type: "artifact schema"
    constraint: "single shared error-class taxonomy (e.g., ScannerError, ParserError, DuplicateKey, ANSI-escape, truncation) — defined in SC-05, consumed by SC-06/SC-07"
  - source: "repaired issue.yaml/comments.yaml schemas (SC-07)"
    target: "yaml_load consumers (read/list/search/promote)"
    type: "artifact schema"
    constraint: "post-repair files must conform to state-analysis schema ({title, status, labels: [str], body, ...} / {comments: [{type, body, timestamp}]}) — no consumer changes required"
  - source: "counter semantics (SC-04)"
    target: "create callers reserving numbers (SC-01)"
    type: "artifact schema"
    constraint: "number reservation flow: caller runs _next_number(resolved_repo) or future explicit reserve path, then create --number repo#N"
  - source: "doctor health markers (SC-08)"
    target: "developer + pipeline diagnostics"
    type: "artifact schema"
    constraint: "marker vocabulary stable across runs; covers residual counter drift (B4) and divergent worktrees (B3)"
  - source: "session-resumption behavioral rules (framework-agnostic; §10.7 lines 623, 677 as documentation source)"
    target: "test-driven-development task cards + behavioral scenario scripts (SC-10)"
    type: "artifact schema"
    constraint: "task-card resumption directive carries the behavioral rules (resume when the session store survives = PRIMARY; blind restart after an interrupt = PROHIBITED); implementation-agnostic — no hardcoded flags or paths; rules defined in the instructions, consumed at the timeout-recovery decision point"
  - source: "harness resumption capability contract (SC-11)"
    target: "harness resumption capability (SC-10/SC-11)"
    type: "artifact schema"
    constraint: "capability contract: a test home that survives across invocations and exposes prior session state to the harness; implementation-agnostic — no mandated language, storage engine, or CLI surface; resumption requires a prior invocation's session state reachable; missing-session resume fails fast; fresh-invocation provisioning unchanged when resumption not requested"
  - source: "session deliberation evidence (reasoning events/thinking traces in session evidence, via session-to-timeline where applicable) (SC-12)"
    target: "behavioral test evidence review instructions (test-driven-development post-regression/verify task cards + behavioral scenario scripts) (SC-12)"
    type: "artifact schema"
    constraint: "review MUST inspect whatever reasoning/deliberation evidence the session store provides, defined generically and schema/provider-agnostic, for test-effectiveness findings (excessive deliberation, false starts, off-track reasoning, prompt/fixture-induced derailment); findings feed test-scenario/prompt adjustments and never alter SC pass/fail verdicts; absent deliberation evidence recorded as unavailable, never fabricated; SC-12 depends on SC-11's session-evidence availability"
  - source: "harness default-model single source of truth (DEFAULT_TEST_MODEL in .opencode/tests-v2/default-model.sh, currently ollama/qwen3.8:27b-256k-gguf4; documented in tests-v2 AGENTS.md §9) (SC-13)"
    target: "test-driven-development task cards (model-selection guidance) + tests-v2 docs (AGENTS.md §9/§5 cross-references, with-test-home/default-model docs) (SC-13)"
    type: "artifact schema"
    constraint: "behavioral tests MUST run on the harness default model unless the user explicitly directs otherwise; model-shopping to work around failures is PROHIBITED — remediation targets the R-18 defect classes (instructions, task-card/skill-deck wording, prompt construction, fixture state, harness behavior), never model selection; the mandate binds the default-model definition mechanism, never a hardcoded model string; explicit user direction is the only override path; default-model VALUE changes stay gated by approved spec per tests-v2 §9; SC-13 depends on SC-10/SC-11/SC-12 harness and review-instruction context"
