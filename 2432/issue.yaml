title: '[SPEC] local-issues: qualifier enforcement, PROJECT_DIR anchoring, YAML hardening
  and repair'
status: open
labels:
- needs-approval
- spec-draft
body: '> **Full spec and artifacts: [`.opencode/.issues/2432/`](https://github.com/michael-conrad/.opencode/tree/issues-data/.issues/2432/)**
  — this issue is a condensed exec summary; the authoritative spec lives in the `issues-data`
  branch.

  >

  > **Local artifacts:** `.opencode/.issues/2432/` — analytical artifacts, implementation
  plan, research, audit findings


  ## Problem


  `local-issues` mixes CWD-derived repo identity with `PROJECT_DIR` anchoring and
  enforces the `repo#N` qualifier only on mutation commands, so creates misroute to
  the parent repo, the root counter drifted 50→52, and first-run bootstrap created
  an unrelated-histories orphan branch diverged from `origin/issues-data`. Separately,
  `yaml_load` has zero exception handling, so 10 confirmed malformed tracking files
  crash `search`/`list`/`read` across the whole tree.


  ## Scope


  - Qualifier enforcement: ALL commands require `repo#N`; bare numbers exit non-zero
  with a qualifier listing (BREAKING — no compat shims; in-repo consumers updated
  in-phase).

  - `PROJECT_DIR` anchoring: repo identity and discovery resolve identically from
  any invocation directory.

  - Worktree bootstrap: fetch/track `origin/issues-data` instead of creating an unrelated-histories
  orphan.

  - Counter hygiene: counter writes target the qualifier-resolved repo''s `.issues/.counter`.

  - YAML hardening: warn-and-skip parsing; new `validate-yaml` and `doctor` subcommands;
  mechanical repair of the 10 confirmed malformed files; `validate-yaml` pipeline
  gate in spec-creation and writing-plans task cards.


  **Out of scope:** `owner/repo#NNN` qualifier migration (supersedes #2319); filesystem-glob
  child discovery (supersedes #1224); reconstruction of semantically broken historical
  artifacts (flagged, not guessed); root counter value repair (doctor reports, does
  not mutate); counter format changes.


  ## Approach


  Nine per-SC changes land in DAG order as single-concern TDD items: qualifier enforcement
  (SC-01), `PROJECT_DIR` anchoring (SC-02), worktree bootstrap remediation (SC-03),
  counter targeting (SC-04), `yaml_load` warn-and-skip hardening (SC-05), the `validate-yaml`
  gate subcommand (SC-06), data repair gated by `validate-yaml` (SC-07), read-only
  `doctor` diagnostics (SC-08), and pipeline gate insertion (SC-09). The error-class
  taxonomy and exit-code contract are fixed at SC-05/SC-06 so repair and pipeline
  consumers share one verification gate. All work lives in the `.opencode` repo; repair
  commits land on issues-data worktree branches via tool auto-commit, never as parent-repo
  tracked changes.


  ## Impact


  - **Risk: breaking CLI change** (bare-number rejection, create auto-number removal)
  breaks ~36 skill/task files and behavioral fixtures — **Mitigation:** in-phase consumer
  sweep with SC-01; no shims per the no-backward-compat guideline.

  - **Risk: repair touches live tracking data** — **Mitigation:** mechanical transforms
  only with semantic-meaning preservation, `validate-yaml` before/after evidence,
  commits confined to issues-data branches; semantic cases flagged, not rewritten.

  - **Risk: `cmd_create` concentrates three concerns** (qualifier, anchoring, counter)
  — **Mitigation:** SC-01/02/04 sequenced as separate single-concern commits in DAG
  order.


  **Key dependencies:** `local-issues` tool (all tool SCs); new pytest unit module
  (SC-01..SC-06, SC-08); behavioral enforcement harness (SC-09); issues-data branches
  on both repos (SC-07).


  **Call to action:** Review the full spec on the `issues-data` branch (`.opencode/.issues/2432/spec.md`)
  — all nine success criteria are gated; partial implementation is not permitted.


  ---

  🤖 Co-authored with AI: OpenCode (huggingface/zai-org/GLM-5.3-Flash)

