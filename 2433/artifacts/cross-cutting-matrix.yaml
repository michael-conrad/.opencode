      - CONCERN-1 (Directive Layer)
    detail: >
      TDT vocabulary normalization is deck-wide (51 cards) but must exactly match the
      directive-layer canonical table (SC-8) and the retired "inline" pejorative in 022/AGENTS.md
      (SC-2/SC-8). The blanket-clause rewrite also overlaps SC-3's file set (executing-plans
      wrapped-tail variant — spec §11 edge case).
  - sc: SC-3
    spans:
      - CONCERN-3 (Plan Layer)
      - CONCERN-2 (Skill Deck Layer)
    detail: >
      executing-plans is both a plan-execution card (SC-3 rewrites its routing architecture)
      and a blanket-clause carrier (SC-6 rewrites its Task Discipline clause). Item ordering
      runs SC-3 before SC-6 so the clause rewrite lands on the already-corrected card.
  - sc: SC-4
    spans:
      - CONCERN-2 (Skill Deck Layer)
      - CONCERN-3 (Plan Layer)
    detail: >
      Whole-card forwarding prohibition (deck dispatch strings) shares the vocabulary and
      guard-semantics layer with the plan guard (SC-5): both are pre-flight-guard backstops
      defined in the standards docs, and both are enforced by the same task()-string discipline.

