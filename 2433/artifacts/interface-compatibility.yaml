# Interface Compatibility — Issue 2433: Remediate Orchestrator Dispatch Discipline
# Regenerated from the current 9-SC spec body (SC-1..SC-9) after the spec revise deleted
# the prior analytical set (backfill precedent, mode: retroactive). Includes the
# dependency_contract section for the solve/plan tools (research.md step 9).

issue_number: 2433
source: .opencode/.issues/2433/spec.md

interface_assessment:
  - interface: skill() -> orchestrator contract
    status: compatible (unchanged)
    sc: none
    detail: "skill({name}) loads SKILL.md into orchestrator context — no change proposed. TDT/Invocation remain the orchestrator-side routing surface."

  - interface: task() -> sub-agent dispatch-string contract
    status: redefined (breaking for orchestrator routing habits)
    sc: SC-1, SC-4
    detail: >
      task() accepts ONLY task-card dispatch strings. FORBIDDEN: card content, whole plan
      bodies, preloaded reasoning. A task() string whose target is a SKILL.md path is a
      whole-card forwarding invitation and is prohibited (SC-4). Sub-agent result contract
      envelope {status, finding_summary, artifact_path, blocker_reason} unchanged (spec §2).

  - interface: plan pre-flight guard (NEW)
    status: new
    sc: SC-5
    detail: >
      Leaf sub-agent receiving a whole plan body rejects with BLOCKED reason
      ORCHESTRATOR_ONLY_PLAN and halts — analogous to the card guard. Definition lives in
      reference/task-card-structure-standards.md. Trip condition: plan document body in the
      dispatch prompt; step-scoped prompts and task cards unaffected (spec §11 edge case).
      Card-side guard ORCHESTRATOR_ONLY_SKILL_CARD unchanged (51/51 verified at baseline).

  - interface: plan file format (per-step dispatch mode)
    status: extended (breaking for new plans; old plans remain readable)
    sc: SC-7
    detail: >
      Canonical plan format defines per-step dispatch mode: direct (orchestrator executes in
      own context, default) | task-card (orchestrator dispatches the step's task card).
      writing-plans producer templates emit it. Existing plans without explicit modes remain
      readable (spec §11 edge case: old vocabulary is not erroring for old plans).

  - interface: TDT Dispatch column vocabulary
    status: normalized (closed set)
    sc: SC-6
    detail: >
      Closed set {orchestrator, task-card, task-card blind}. inline -> orchestrator (retired
      ambiguous term); sub-task/task() -> task-card; blind sub-task -> task-card blind.
      TDT rows must agree with their card's Invocation section (contradictions in audit,
      brainstorming, spec-creation resolved). Superseded #1210 gate-table vocabulary
      ("orchestrator routes to general (blind)") is authoritative-superseded (§12), not migrated.

  - interface: directive-layer -> canonical vocabulary table (Read-link)
    status: new reference edge
    sc: SC-8
    detail: >
      Single canonical dispatch-vocabulary table in reference/skill-card-description-standards.md;
      prompts/default.txt, 022, 000-critical-rules, task-card-structure-standards,
      skill-card-description-standards, and AGENTS.md (Universal Skill Dispatch Gate) reference
      it via Read-link instead of restating definitions. System prompt carries no duplicated
      definitions.

  - interface: behavioral test execution surface (targeted-run mandate)
    status: new directive + guard
    sc: SC-9
    detail: >
      Every opencode run targets exactly the scenario(s) the current SC's RED and GREEN
      evidence needs (R-25). tests-v2/AGENTS.md states the mandate and harness guard text
      (R-26): whole-suite runs (glob over behaviors/*.sh), unfiltered model-executing sweeps,
      and loops over all scenarios are PROHIBITED; the per-SC re-run instruction names only
      the current branch's SC scenarios; the prohibition scopes to model-executing
      invocations — content-verification runners (test-enforcement.sh) are exempt
      (spec §11 edge case). One new behavioral scenario script
      (2433-sc9-whole-suite-invocation-blocked.sh, 2429-style artifact-only generator)
      enforces the BLOCKED/prohibited behavior. 197 existing scenario scripts are the
      governed surface. No harness code changes — directive text and one new scenario only.

compatibility_summary:
  external_consumers: none
  detail: "No outside-repo consumers depend on these interfaces — all changes are internal to the agent config deck (.opencode submodule)."
  consumer_impact:
    - consumer: orchestrator agent
      impact: prompt/guideline rewrites — text loaded at session start
      mitigation: canonical table Read-links keep definitions single-sourced
    - consumer: leaf sub-agents
      impact: tighter dispatch prompts; NEW plan guard alongside unchanged card guard
      mitigation: guard semantics documented in standards docs (SC-5); negative behavioral probe
    - consumer: skildeck validators
      impact: potential additive checks (TDT closed set, plan step modes)
      mitigation: additive validator rules; optional phase-2
    - consumer: behavioral tests (tests-v2)
      impact: expectation updates accompany each GREEN; SC-9 governs run scoping
      mitigation: spec §11 Recovery edge case re-runs any SC a later GREEN regresses; targeted-run mandate bounds every run
    - consumer: existing open plans (#1210, #1214)
      impact: third vocabulary predates change
      mitigation: superseded by #2433 (§12); no dual-vocabulary period

dependency_contract:
  version: 1
  description: "Dependency contract for the directive-layer, skill-deck, and tests-v2 surfaces affected by issue 2433."
  source_issue: 2433
  dependencies:
    - id: DEP-1
      source: .opencode/prompts/default.txt
      target: .opencode/reference/skill-card-description-standards.md (canonical dispatch-vocabulary table)
      type: read_link_reference
      status: to_create
      constraint: "System prompt MUST reference the canonical table via Read-link and MUST NOT restate or contradict dispatch definitions (SC-8, R-8). Architecture-B prose required (SC-1, R-1)."
      consumer: orchestrator session prompt (loaded into every session)
    - id: DEP-2
      source: .opencode/guidelines/022-orchestrator-context-discipline.md
      target: .opencode/reference/skill-card-description-standards.md (canonical dispatch-vocabulary table)
      type: read_link_reference
      status: to_create
      constraint: "Halt machinery MUST trigger on whole-card/whole-plan forwarding, never on sanctioned orchestrator direct execution (SC-2, R-2)."
      consumer: orchestrator context discipline enforcement
    - id: DEP-3
      source: .opencode/guidelines/000-critical-rules.md
      target: .opencode/guidelines/022-orchestrator-context-discipline.md
      type: directive_alignment
      status: to_align
      constraint: "Whole-card prohibition (critical-rules-XXX) retained; Infrastructure-Failure Carve-out and routing-bypass classifications MUST reference forwarding-based violations consistent with 022's re-pointed halt machinery (SC-2, R-2)."
      consumer: Tier 1 critical rules
    - id: DEP-4
      source: .opencode/skills/executing-plans/SKILL.md
      target: .opencode/skills/executing-plans/tasks/read-plan.md
      type: tdt_reference
      status: exists_but_rewritten
      constraint: "read-plan card MUST route plan reading to the orchestrator's own context, not a sub-agent (SC-3, R-3)."
      consumer: executing-plans orchestrator
    - id: DEP-5
      source: .opencode/skills/executing-plans/SKILL.md
      target: .opencode/skills/executing-plans/tasks/dispatch-phase.md
      type: tdt_reference
      status: exists_but_rewritten
      constraint: "dispatch-phase MUST dispatch a step's task card via task() ONLY where the plan step marks dispatch; whole-plan/whole-workflow forwarding absent (SC-3, R-3)."
      consumer: executing-plans orchestrator
    - id: DEP-6
      source: .opencode/reference/task-card-structure-standards.md
      target: leaf sub-agent entry pattern (task-card directive text)
      type: guard_definition
      status: to_create
      constraint: "ORCHESTRATOR_ONLY_PLAN guard semantics MUST be defined in the standards doc and stated in the sub-agent entry pattern; trip condition = whole plan body in dispatch prompt (SC-5, R-5)."
      consumer: all leaf sub-agents receiving plan-scoped dispatches
    - id: DEP-7
      source: .opencode/skills/**/SKILL.md (51)
      target: .opencode/reference/skill-card-description-standards.md (closed TDT vocabulary)
      type: vocabulary_conformance
      status: to_migrate
      constraint: "All TDT Dispatch values ∈ {orchestrator, task-card, task-card blind}; TDT rows agree with Invocation; blanket clause rewritten in all 45 carrying cards (SC-6, R-6). Guards ORCHESTRATOR_ONLY_SKILL_CARD retained in 51/51 (SC-4, R-4)."
      consumer: skill-deck orchestrators and skildeck validators
    - id: DEP-8
      source: .opencode/skills/writing-plans/reference/plan-artifact-format.md
      target: .opencode/skills/writing-plans/tasks/create.md (producer template)
      type: format_conformance
      status: to_extend
      constraint: "Per-step dispatch mode (direct | task-card, default direct) defined in canonical format and emitted by producer templates so every produced plan step carries an explicit mode (SC-7, R-7)."
      consumer: writing-plans orchestrator + plan consumers
    - id: DEP-9
      source: .opencode/AGENTS.md (Universal Skill Dispatch Gate section)
      target: .opencode/reference/skill-card-description-standards.md (canonical dispatch-vocabulary table)
      type: read_link_reference
      status: to_create
      constraint: "Dispatch directives use the canonical table via Read-link; retired-vocabulary header prose ('Amateurs inline.') rewritten (SC-8, R-8). Non-dispatch AGENTS.md content out of scope (spec §2)."
      consumer: orchestrator dispatch gate
    - id: DEP-10
      source: .opencode/tests-v2/AGENTS.md
      target: .opencode/tests-v2/behaviors/*.sh (197 model-executing scenario scripts) + .opencode/tests-v2/test-enforcement.sh (content-verification runner)
      type: harness_governance
      status: to_create
      constraint: "Targeted-run mandate stated (R-25/R-26): every opencode run targets exactly the scenario(s) the current SC's RED/GREEN evidence needs; whole-suite runs, directory-enumeration runs, and unfiltered model-executing sweeps PROHIBITED; per-SC re-run instruction names only the current branch's SC scenarios; prohibition scopes to model-executing invocations — content-verification runners exempt (SC-9)."
      consumer: every agent executing behavioral tests (including this plan's own RED/GREEN/post-regression runs and the post-implementation regression-check gate)

dependency_contract_notes:
  - "All dependencies are directive-text/artifact-schema couplings inside the .opencode deck — no code, DB, or wire interfaces."
  - "DEP-1, DEP-2, DEP-7, DEP-9 converge on the canonical vocabulary table: it must exist (Item 8) for all Read-link edges to resolve."
  - "DEP-6 is the only NEW guard interface; card-side guard interface is unchanged and verified 51/51."
  - "DEP-10 (SC-9) is file-disjoint from DEP-1..DEP-9 — no ordering edge on phases 1-7; it converges into the post-implementation gates, which operate under the targeted-run mandate."
