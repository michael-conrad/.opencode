dependency_dag:
  edges:
    - from: 3
      to: 4
      reason: "SC-4 deck-wide dispatch-string sweep covers executing-plans' task() strings; the card must be in corrected Architecture-B form first (spec §11 overlapping-file ordering)"
    - from: 3
      to: 6
      reason: "Spec §11 edge case: SC-6's blanket-clause rewrite must land on the already-corrected executing-plans card (SC-3 before SC-6)"
    - from: 4
      to: 6
      reason: "Dispatch-string fixes (SC-4) precede the TDT vocabulary migration pass (SC-6) over the same 51-file deck surface — sequential bulk edits, no concurrent edit window"
    - from: 1
      to: 8
      reason: "SC-8 Read-link conversion + duplicate-stripping on prompts/default.txt requires SC-1's Architecture-B rewrite in place (directive text finalized before dedup pass)"
    - from: 2
      to: 8
      reason: "SC-8 Read-link conversion on 022/000-critical-rules requires SC-2's re-pointed halt machinery text in place"
    - from: 5
      to: 8
      reason: "SC-8 converts task-card-structure-standards restatements to Read-links; ORCHESTRATOR_ONLY_PLAN guard definition (SC-5) must exist first"
    - from: 7
      to: 8
      reason: "Canonical vocabulary table's plan-step-mode row (direct | task-card) reflects the finalized plan format from SC-7"
  no_edges_for:
    - phase: 9
      reason: >
        SC-9 is file-disjoint from SC-1..SC-8 (tests-v2/AGENTS.md + new scenario script are a
        disjoint surface — no shared edit targets), so no ordering edge connects it to phases
        1-7. Per the revision brief it converges into the post-implementation gates: the
        post-implementation regression-check and every RED/GREEN/post-regression run after
        Item 9 lands operate under the targeted-run mandate. Phase 9 therefore slots after
        phases 1-8 in the plan's executed order (it can run at any topological position;
        plan ordering follows the spec's SC order SC-1..SC-9). The DAG stays acyclic: no
        edge points from 9 to any earlier phase and none from any phase to 9.
  topological_order: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  acyclicity_note: "All 7 edges point strictly from a lower to a higher phase index; phase 9 has no incoming/outgoing edges in the phase DAG (file-disjoint, converging into post-implementation gates). Acyclic by construction; verified by solve model query (SAT)."

