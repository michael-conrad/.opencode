dispatch_mode_note: >
  Per the developer's execution-directive correction (reflected in the revised plan's
  dispatch-mode annotations): skill-card execution steps (RED/GREEN/post-regression from
  test-driven-development; verify from verification-before-completion) are executed
  ORCHESTRATOR-DIRECT — the orchestrator reads the named task card and executes its
  procedure in its own context. task() is used ONLY where the task card itself marks a
  sub-task dispatch (e.g., verification-before-completion's behavioral-test-evaluation
  sub-agent, audit DiMo chain, PR-creation sub-agent routing). commit-inline and z3-check
  remain orchestrator-direct per the implementation-workflow reference card.

