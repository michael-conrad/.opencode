body: '# [SPEC] Remediate Orchestrator Dispatch Discipline


  > **Full spec and artifacts: [`.opencode/.issues/2433/`](https://github.com/michael-conrad/.opencode/tree/issues-data/2433/)**
  — this issue is a condensed exec summary; the authoritative spec lives in the `issues-data`
  branch.

  >

  > **Local artifacts:** `.opencode/.issues/2433/` — implementation plan, card catalogue,
  dependency contracts, analytical artifacts, research, designs, audit findings


  ## Problem


  Two incompatible orchestrator architectures coexist in the `.opencode` directive
  layer (Architecture A "pure router" vs Architecture B "orchestrator executes skill-card
  workflows and plan steps directly, `task()` only at marked points"). A model reading
  both averages them and dispatches MORE — forwarding whole SKILL.md cards and whole
  plans to leaf sub-agents that cannot call `task()`. Related open tickets carry dispatch
  semantics that predate and contradict the target architecture, risking a second
  vocabulary fork.


  ## Scope


  - Rewrite the system prompt routing boundary, `022-orchestrator-context-discipline.md`
  HALT machinery, and `executing-plans` plan-execution flow to Architecture B.


  - Eliminate whole-card/whole-plan forwarding across the deck; add the `ORCHESTRATOR_ONLY_PLAN`
  plan pre-flight guard.


  - Normalize all TDT Dispatch values to the closed set {`orchestrator`, `task-card`,
  `task-card blind`} and single-source the dispatch vocabulary in one canonical reference
  table (including `.opencode/AGENTS.md` dispatch directives).


  - Add a per-step plan dispatch mode (`direct` | `task-card`, default `direct`) to
  the canonical plan format.


  - Scope is directive text only: guidelines, prompts, AGENTS.md, skill cards, task
  cards, reference standards markdown, and plan/spec documents — nothing more. Related
  open tickets (706, 909, 912, 936, 954, 955, 1019, 1198, 1208, 1209, 1210, 1211,
  1213, 1222, 1214) are superseded by #2433 — their conflicting SCs are superseded
  by #2433''s dispatch-correction SCs; see §12 of the authoritative spec.


  - 8 success criteria (SC-1..SC-8), each with its own behavioral probe verification
  (probes run via sub-agents dispatched from the working session; no isolated environment,
  no project writes) plus direct reading of the text artifact where the deliverable
  is a document.


  **Out of scope:** code files of any kind — every deliverable is a text artifact;
  content changes to other issues'' bodies; sub-agent result contract envelope changes;
  non-dispatch content of `.opencode/AGENTS.md`; tickets verified to have no dispatch
  concern (698, 699, 700, 701, 702, 703, 704, 705, 872, 1013, 1189, 1212).


  ## Approach


  Adopt Architecture B as the single architecture and re-point every directive layer
  at it: system prompt, `022`, `000-critical-rules`, and `executing-plans` are rewritten
  so sanctioned direct execution is never halted while whole-card/whole-plan forwarding
  is the halt-triggering violation. The word "inline" is retired from the dispatch
  vocabulary; TDTs migrate to the closed set. The plan format gains a per-step dispatch
  mode (`direct` default), and the vocabulary is single-sourced in one canonical reference
  table referenced via Read-link by every directive-layer file. Where a superseded
  ticket''s design contradicts this target architecture, this spec''s design wins
  and the conflict is recorded as superseded in §12.


  ## Impact


  - **Risk 1 — Deck-wide TDT migration churn:** 45 cards carry the retired blanket
  clause (measured). *Mitigation:* the migration is one pass across all 45 carrying
  cards, verified by direct reading and behavioral probes.


  - **Risk 2 — Behavioral regression across items:** vocabulary edits can break earlier
  probe assertions. *Mitigation:* enforcement gate is all-or-nothing; a regressed
  SC re-runs before the pipeline advances.


  - **Risk 3 — Verification without static checks:** the mandate is enforced by behavioral
  probes and direct reading only, per developer directive (static checks invite agent
  workarounds — dead weight, ceremony, confusion, deliberation loops). *Mitigation:*
  every SC carries a named behavioral probe; unexecutable probes are FAIL, not structural
  substitutes.


  - **Dependencies:** verified local model (qwen3.8:27b-256k-gguf4); skill card pre-flight
  guards retained verbatim (all 51 SKILL.md).


  - **Call to action:** all 8 success criteria must pass before this spec is complete.


  🤖 Co-authored with AI: OpenCode (ollama-cloud/glm-5.3-flash)'
