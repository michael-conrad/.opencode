## Backward Compatibility Verdict

No silent breaks: every breaking change is a deliberate conversion of a silent-failure path into a fail-fast path. All compatible interfaces (env vars, positional args, script contracts) preserved. Internal-only interfaces (shell functions) — no external consumers.