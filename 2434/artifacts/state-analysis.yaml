# State Analysis — Test-Framework Commit/Push/Fetch/Checkout Cycle (issue 2434)

## Persistent State Read by the Gate (per phase)

### Phase A
| State | Location | Read Method | Phase |
|-------|----------|-------------|-------|
| Local submodule HEAD SHA | `.opencode/.git` (parent checkout) | `git -C "$PROJECT_DIR/.opencode" rev-parse HEAD` | A |
| Working tree cleanliness | `.opencode/.git` | `git status --porcelain` | A |
| Remote-tracking state | fetched remote refs | `git fetch` + `git branch -r --contains <sha>` (or ls-remote) | A |
| Pinned commit | `BEHAVIOR_SUBMODULE_COMMIT` env var | read at behavior_run start (line 667, unchanged) | A |
| Lock state | `tmp/.behavior-run.lock` | flock (unchanged; gate precedes it) | A |

## State Transitions Introduced

Test runs now REQUIRE the ordered transition:
```
submodule worktree clean → HEAD committed → pushed to remote → remote ref contains HEAD → model dispatch
```
No new persistent state is written by the gate itself (C4) — gate is a read-and-branch check.

## New Failure States (hard-FAIL conditions)

| # | Failure State | Detection Point | Consequence |
|---|--------------|-----------------|-------------|
| F1 | Uncommitted changes in `.opencode/` | pre-flight gate (behavior_run) | FAIL before model dispatch |
| F2 | Local HEAD not present on remote after fetch | pre-flight gate (behavior_run); with-test-home clone+checkout | FAIL before model dispatch (was: WARNING + stale run at with-test-home sites) |
| F3 | Clone+checkout of local SHA impossible | with-test-home sites 1+2 | FAIL exit 1 (was: WARNING + stale run) |

## Success Path States

| Transition | Condition |
|------------|-----------|
| clean tree + HEAD on remote → run proceeds | normal case; identical to today's good path |
| BEHAVIOR_SUBMODULE_COMMIT set + pinned SHA on remote → run proceeds | override honored (I2) |
| BEHAVIOR_SUBMODULE_COMMIT set + pinned SHA NOT on remote → FAIL | override verified, not bypassed |

## Unaffected State

- Test home SQLite DB, tmp/ artifacts, `.tools/` caches (uv, jdk, gitbucket) — unchanged
- Parent-repo submodule pointer — dirty pointer remains legitimate under rides-alongside policy (C5)
- Shared-home mode (`tmp/test-home-shared`) — reused, but gate still validates its git state
- Monitor state files (`tmp/.gitbucket.pid` etc.) — unrelated

## State Consistency Requirement

Gate predicate reads live git state at run time — no caching of prior-session SHAs (065 verification-honesty: fresh fetch each run, never trust remembered state).