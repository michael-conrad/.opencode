dependency_dag:
  edges:
    - from: A
      to: B
      reason: >-
        Directive text (SC-4a/SC-4b/SC-5/SC-6/SC-7) must encode the IMPLEMENTED gate behavior —
        the machine gates (SC-1/SC-2a/SC-2b/SC-3) define the predicate that §4/§5/091/TDD-skill/lessons
        prose must match exactly (SC-7 requires "text matches the implemented predicate"; SC-4a/SC-4b
        document the gate's FAIL semantics). Encoding prose before the gates exist risks documenting
        a predicate that implementation then contradicts.
    - from: B
      to: C
      reason: >-
        SC-8 re-verifies end-to-end that the landed rule set is followed ("GREEN: n/a (rule changes
        landed in Items 4–7)"); the artifact-generation run and SC-9's clean-room evaluation require
        the full directive surface in place before the agent-under-test can exhibit compliant behavior.
    - from: A
      to: C
      reason: >-
        SC-8's opencode run exercises the hardened harness (with-test-home gates + behavior_run()
        pre-flight gate) — the gates must be in place for the behavioral run to proceed through a
        validated git state and for the cycle evidence to be meaningful.
  internal_phase_ordering:
    - "Phase A: Items 1 → 2a/2b → 3 (site-1 guard function established first; site-2 mirrors it per SC-2b; behavior_run() gate independent but sequenced after the with-test-home work on the shared harness)"
    - "Phase B: Items 4a/4b → 5 → 6 → 7 (§4/§5 rewrite lands the carve-out first; SC-5/SC-6 encode ordering consistent with it; SC-7 lesson references the §4 carve-out and gate behavior)"
    - "Phase C: Item 8 → Item 9 (SC-9 evaluates SC-8's session.yaml — strict producer/consumer dependency)"

triplet_colocation:
  verified: true
  detail: >-
    Every SC's RED/GREEN/COMMIT steps live in exactly one phase: SC-1/SC-2a/SC-2b/SC-3 fully in A
    (SC-2b's commit is Item 2a's commit — same phase); SC-4a/SC-4b/SC-5/SC-6/SC-7 fully in B;
    SC-8/SC-9 fully in C (SC-8 GREEN is n/a re-verification, SC-9 RED is n/a evaluation dispatch —
    both steps still assigned within phase C). No SC has steps split across phases.

cross_phase_dependency_check:
  verified: true
  detail: >-
    No RED test depends on output committed in a later phase. Phase A REDs probe current
    WARNING/no-gate behavior (no phase input needed). Phase B REDs are string checks against
    current doc text (no phase-A artifact consumed by any RED). Phase C RED (Item 8) probes
    agent behavior with the landed rules — depends on phases A+B output, and C follows both
    in the DAG. The only cross-phase references (B prose encoding A's gate predicate; C
    re-verifying A+B's rules) are forward — producer phases precede consumer phases in the DAG.

