    - {step: create-pr, skill: git-workflow-pr, dispatch: 'task(..., prompt: "execute create task from git-workflow-pr")'}
    - {step: exec-summary, skill: completion-core, dispatch: 'task(..., prompt: "execute completion task from completion-core")'}

