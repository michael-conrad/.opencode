      - item: "Item 1 (SC-1): with-test-home site 1 hard-FAIL gate"
        files: [.opencode/tests-v2/with-test-home]
        cycle: "RED probe unpushed-HEAD exit-1+remediation → GREEN replace WARNING fallback with hard FAIL → verify control probe pushed-HEAD passes → commit site-1 gate block"
      - item: "Item 2a (SC-2a): with-test-home site 2 hard-FAIL gate (behavioral parity)"
        files: [.opencode/tests-v2/with-test-home]
        cycle: "RED probe site-2 path exit-1 → GREEN mirror shared guard at site 2 → verify both-site + site-2 control probes → commit site-2 gate block"
      - item: "Item 2b (SC-2b): both-site identical guard logic (string)"
        files: [.opencode/tests-v2/with-test-home]
        cycle: "RED string-compare guard blocks differ → GREEN identical guard after mirror → verify direct text comparison → commit included in Item 2a commit"
      - item: "Item 3 (SC-3): behavior_run() pre-flight cycle gate"
        files: [.opencode/tests-v2/behaviors/helpers.sh]
        cycle: "RED unpushed/uncommitted + pinned-unpushed probes expect FAIL-before-flock → GREEN pre-flight gate block (clean-tree + fresh fetch + SHA-on-remote, honoring pin) before flock with FATAL/HARNESS_FAILURE remediation → verify control + no-bypass + ordering probes → commit helpers.sh gate block"
