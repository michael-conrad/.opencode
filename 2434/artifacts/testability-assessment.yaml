# Testability Assessment — Test-Framework Commit/Push/Fetch/Checkout Cycle (issue 2434)

## Test Strategy Per Phase

### Phase A — Harness hardening (SC-1, SC-2, SC-3)

| SC | Evidence Type | Test Method | Cost Profile |
|----|--------------|-------------|--------------|
| SC-1 (with-test-home site 1 FAIL) | behavioral | Run with-test-home with submodule HEAD intentionally unpushed (fixture: create local commit, do not push) → expect exit 1 + FAIL/remediation message; run with pushed HEAD → expect normal setup completion | CHEAP — gate fires before model dispatch; no DEFAULT_TEST_MODEL run needed |
| SC-2 (site 2 FAIL) | behavioral | Same probe against site-2 invocation path; verify identical logic (grep both sites for identical guard, DRY check I1) | CHEAP |
| SC-3 (pre-flight gate) | behavioral | behavior_run probe with unpushed/uncommitted fixture state → FAIL before flock/model dispatch; with BEHAVIOR_SUBMODULE_COMMIT set to unpushed SHA → FAIL (no bypass, I2); with pushed state → proceeds to lock acquisition | CHEAP |

Key feasibility: all Phase A gate tests fail BEFORE the model runs — no 600s model inference required. Fast, deterministic, cheap.

### Phase B — Documentation/rules (SC-4, SC-5, SC-6, SC-7)

| SC | Evidence Type | Test Method |
|----|--------------|-------------|
| SC-4 (§4/§5 cycle doc) | string | Text presence: ordered cycle (commit → push → fetch/verify → run) in §4; §5 describes hard FAIL with no WARNING-fallback language; add content-verification tag |
| SC-5 (091 ordering) | string | Text presence: commit+push-before-test ordering in per-item cycle |
| SC-6 (TDD PUSH step) | string | Text presence: PUSH step between COMMIT and next RED |
| SC-7 (root lesson) | string | Text presence: cycle lesson entry |

### Phase C — End-to-end behavioral (SC-8, SC-9)

| SC | Evidence Type | Test Method | Depends On |
|----|--------------|-------------|------------|
| SC-8 (agent follows cycle) | behavioral | Artifact-only generator script (§1); two-SC pattern SC-N: opencode run with real-domain test-framework-fix prompt → session.yaml artifacts; bash tool timeout >= 600000 | SC-1–SC-7 |
| SC-9 (clean-room evaluation) | behavioral | Clean-room sub-agent reads SC-8 session.yaml, evaluates agent actions against criterion (§6a SC-N+1); evaluator receives only artifact path + criterion | SC-8 |

## Existing Coverage

- NO existing test covers the checkout WARNING fallback path — new tests required (verified: no grep hits for checkout-fallback assertions in behaviors/)
- Isolation-mandate test patterns (§5 mandates 1–7) reusable as templates for gate probes
- §6a two-SC pattern (artifact generation + clean-room evaluation) directly applies to SC-8/SC-9

## Fixture Requirements

- Unpushed-HEAD state: fixture setup script creating a local commit without push (per §3 Step 0b, `fixtures/setup/<scenario>.sh`)
- Pushed-HEAD control: current repo state (verified clean/on-remote this session) or explicit fixture
- Behavioral scenario (SC-8): real-domain prompt; session.yaml evaluation; no fixture issues needed unless prompt references issue content

## Regression Test Pattern

| Regression Risk | Regression Test |
|-----------------|-----------------|
| Gate false-positive on pushed HEAD (blocks legitimate runs) | Control probe: pushed HEAD → run proceeds (Phase A method) |
| Divergent logic at with-test-home sites 1 vs 2 | String check: identical guard logic at both sites |
| Gate bypass via BEHAVIOR_SUBMODULE_COMMIT | Negative probe: pinned unpushed SHA → FAIL |
| Doc/gate predicate drift | String checks SC-4 + gate grep in Phase A tests |
| WARNING-fallback language resurrection | Content-verification tag: forbidden pattern "using remote default branch" in §5 |