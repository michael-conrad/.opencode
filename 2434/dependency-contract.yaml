# Dependency contract — Issue #2434 (.opencode)
# Extracted from artifacts/interface-compatibility.yaml `dependency_contract` section (present
# in source — extracted as-is per research.md step 9; the semantic `dependencies` entries with
# their consumed_by SC lists are preserved verbatim in dependency_edges below) + phase-DAG
# variables for Z3 solving.
# Generated 2026-09-04 by writing-plans/tasks/research executor.
# Phase DAG: 3 phases (A harness-hardening → B durable-rule-encoding → C end-to-end-verification);
# edges from artifacts/structure.yaml dependency_dag (A→B, A→C, B→C).
version: 1
source_artifact: .opencode/.issues/2434/artifacts/interface-compatibility.yaml
scope: >-
  Harness git-state gate + durable rule encoding: with-test-home hard-FAIL gates (SC-1/SC-2a/SC-2b),
  behavior_run() pre-flight gate (SC-3), directive-text encoding of the ordered commit→push→fetch
  cycle (SC-4a/SC-4b/SC-5/SC-6/SC-7), and §6a two-SC end-to-end verification (SC-8/SC-9).

variables:
  phase_A_done:
    type: bool
  phase_B_done:
    type: bool
  phase_C_done:
    type: bool
  with_test_home_gates_installed:
    type: bool
  behavior_run_preflight_gate_installed:
    type: bool
  directive_text_encoded:
    type: bool
  end_to_end_verified:
    type: bool

preconditions:
  # Initial state: pipeline effects not yet produced (phase variables are state, not
  # preconditions — asserting them false here would make the goal-reachability model
  # query UNSAT; pattern matches the #2433 contract regenerated by this pipeline).
  - "z3.Not(with_test_home_gates_installed)"
  - "z3.Not(behavior_run_preflight_gate_installed)"
  - "z3.Not(directive_text_encoded)"
  - "z3.Not(end_to_end_verified)"

invariants:
  - "z3.Implies(with_test_home_gates_installed, phase_A_done)"
  - "z3.Implies(behavior_run_preflight_gate_installed, phase_A_done)"
  - "z3.Implies(directive_text_encoded, phase_B_done)"
  - "z3.Implies(end_to_end_verified, phase_C_done)"
  - "z3.Implies(phase_B_done, phase_A_done)"
  - "z3.Implies(phase_C_done, z3.And(phase_A_done, phase_B_done))"

postconditions:
  - "phase_A_done"
  - "phase_B_done"
  - "phase_C_done"
  - "with_test_home_gates_installed"
  - "behavior_run_preflight_gate_installed"
  - "directive_text_encoded"
  - "end_to_end_verified"

dependency_edges:
  - name: "git-cli"
    kind: "external-tool"
    source: "with-test-home, helpers.sh behavior_run(), and the new gate logic all shell out to git"
    target: "git binary on PATH"
    type_constraint: "Commands used: clone, checkout, fetch, rev-list, config, status --porcelain, rev-parse (all standard git >= 2.x; flock usage implies Linux/WSL — already a harness precondition)"
    consumed_by: ["SC-1", "SC-2a", "SC-3", "SC-8"]
  - name: "flock"
    kind: "external-tool"
    source: "helpers.sh behavior_run() line 682 (existing)"
    target: "util-linux flock on PATH"
    type_constraint: "Existing precondition; unchanged by this spec — the new gate runs BEFORE flock acquisition, so gate failures never touch the lock"
    consumed_by: ["SC-3"]
  - name: "LOCAL_SUBMODULE_COMMIT"
    kind: "env-var"
    source: "with-test-home resolves the local .opencode submodule HEAD at runtime"
    target: "with-test-home clone+checkout sites 1 and 2"
    type_constraint: "40-hex git SHA string; may be unpushed (triggers new FAIL) — the variable's producer and both consumers are inside the same script"
    consumed_by: ["SC-1", "SC-2a"]
  - name: "BEHAVIOR_SUBMODULE_COMMIT"
    kind: "env-var"
    source: "caller of behavior_run() / behavioral scenario scripts"
    target: "helpers.sh behavior_run() pin resolution (existing) + new pre-flight gate read (R-4)"
    type_constraint: "Optional env var; empty/unset → remote default branch; 40-hex SHA → pin, which the gate now verifies against the remote after fresh fetch"
    consumed_by: ["SC-3"]
  - name: "PARENT_REPO_DIR"
    kind: "harness-env-var"
    source: "helpers.sh environment (existing)"
    target: "behavior_run() lock file path and new gate's git commands against the parent repo / submodule worktree"
    type_constraint: "Absolute path to parent repo checkout; must contain the .opencode submodule worktree for git state reads"
    consumed_by: ["SC-3"]
  - name: "FATAL:/HARNESS_FAILURE: stderr prefixes"
    kind: "message-convention"
    source: "existing harness failure blocks (verified this session)"
    target: "all new gate failure messages (R-3)"
    type_constraint: "Exact literal prefixes; stderr channel; message must name the commit+push+fetch remediation"
    consumed_by: ["SC-1", "SC-2a", "SC-3"]
  - name: "tests-v2/AGENTS.md §4 infrastructure-maintenance carve-out"
    kind: "doc-convention"
    source: ".opencode/tests-v2/AGENTS.md §4 FORBIDDEN block (line 224, verified this session)"
    target: "agent remediation behavior on gate failure; §4 rewrite; root AGENTS.md lesson reference"
    type_constraint: "Prose contract: test-framework fixes authorize autonomous agent commit+push without authorization solicitation; §4 rewrite extends this framing to all runs"
    consumed_by: ["SC-4a", "SC-7", "SC-8"]
  - name: "tests-v2/AGENTS.md §6a two-SC pattern"
    kind: "doc-convention"
    source: ".opencode/tests-v2/AGENTS.md §6a (verified this session per spec Dependencies table)"
    target: "Items 8-9 (SC-8 artifact generation, SC-9 clean-room evaluation)"
    type_constraint: "Prose contract: artifact-only generator produces session.yaml; clean-room evaluator reads ONLY artifact path + criterion; no orchestrator reasoning or expected outcomes passed"
    consumed_by: ["SC-8", "SC-9"]
  - name: "DEFAULT_TEST_MODEL"
    kind: "env-var"
    source: ".opencode/tests-v2/default-model.sh (single source of truth)"
    target: "behavior_run() model parameter default (existing) and Item 8 opencode run"
    type_constraint: "Model id string 'ollama/qwen3.8:27b-256k-gguf4' (§10.4 verified); MUST NOT be substituted by the agent (§10.4 mandate)"
    consumed_by: ["SC-8"]
  - name: "qwen3.8:27b-256k-gguf4 local model"
    kind: "external-service"
    source: "local Ollama server (verified per tests-v2/AGENTS.md §10.4 and spec Dependencies table)"
    target: "Item 8 opencode run execution"
    type_constraint: "Model availability evidenced — no fabricated unavailability claims (§10.4); bash tool timeout >= 600000 for behavioral runs"
    consumed_by: ["SC-8"]

phase_dag:
  edges:
    - {from: A, to: B}
    - {from: A, to: C}
    - {from: B, to: C}
  topological_order: [A, B, C]

dependency_contract_notes:
  - "All dependencies are harness-shell/environment couplings and directive-text/artifact-schema couplings inside the .opencode deck — no DB or wire interfaces."
  - "FATAL:/HARNESS_FAILURE: prefix convention and the git/flock external tools must exist (they do — verified in interface-compatibility.yaml source column) for all gate-work edges to resolve."
  - "The §4 carve-out doc-convention is the producer for the §4 rewrite (SC-4a), the root AGENTS.md lesson reference (SC-7), and the SC-8 remediation path — it exists today in narrow form and is broadened in phase B."
  - "§6a two-SC pattern binds SC-8 → SC-9 as a strict producer/consumer pair inside phase C — the clean-room evaluator consumes only SC-8's session.yaml artifact."
  - "Phase-DAG variables encode the structure.yaml edges: A→B, A→C, B→C (total order A, B, C; no file-disjoint phase — SC-8's opencode run exercises the phase-A gates directly)."