  ## Cost Frame


  Cost is measured in defect-discovery-latency, not tool calls. Correctness is the
  only metric.


  - **SC-1:** Verifying site-1 hard-FAIL costs minutes of harness probe execution
  — the gate fires before model dispatch, catching the stale-code defect at gate 1
  where the fix cost is bounded. Skipping costs weeks of silent stale-code test runs
  — PASS/FAIL verdicts issued against code that was never checked out, discovered
  only when a "passing" branch merges broken behavior.

  - **SC-2:** Verifying site-2 parity costs the same bounded probe plus one grep for
  guard-logic identity — trivial against the death-spiral alternative. Skipping costs
  a divergent second clone path that resurrects the WARNING fallback on every site-2
  invocation — the defect returns through the door site 1 closed, at full rework price.

  - **SC-3:** Verifying the `behavior_run()` pre-flight gate costs minutes of probe
  execution — cheapest possible position because it precedes flock and model dispatch.
  Skipping costs full 600-second model-dispatch cycles spent testing stale code, plus
  contaminated RED/GREEN verdicts that poison every downstream SC decision on the
  branch.

  - **SC-4:** Verifying the §4/§5 cycle documentation costs one direct text read —
  seconds. Skipping costs doc/gate divergence: agents read the documented WARNING
  fallback and deliberately follow it, converting the machine gate into a rule agents
  route around.

  - **SC-5:** Verifying the 091 ordering amendment costs one direct text read — seconds.
  Skipping costs per-item TDD agents committing AFTER their behavioral runs and reproducing
  the orphaned-STALE-GREEN defect on every behavioral item, a full rework cycle per
  item.

  - **SC-6:** Verifying the TDD PUSH step costs one direct text read — seconds. Skipping
  costs a vocabulary fork between 091 and the TDD skill where agents follow whichever
  file they loaded first, guaranteeing contradictory ordering compliance.

  - **SC-7:** Verifying the lessons entry costs one direct text read — seconds. Skipping
  costs session-start blindness: agents re-deliberate push timing from scratch each
  session, and the lesson drifts from gate reality into a stale-code claim that teaches
  the wrong behavior.

  - **SC-8:** Running the behavioral cycle test costs minutes of model execution —
  the bounded break cost. Skipping costs 1000× more downstream: agents ship test-framework
  invocations on unpushed HEAD indefinitely, and every false verdict surfaces in review
  or production rather than at the gate.

  - **SC-9:** Running the clean-room evaluation costs minutes of sub-agent execution
  — bounded. Skipping costs an unevaluated artifact stream where agent non-compliance
  passes silently because nobody read the evidence the test was built to produce.


  ## Edge Cases


  - **Unpushed local HEAD (F2):** Condition: submodule HEAD committed locally but
  absent from the remote after fresh fetch. Expected behavior: hard FAIL at both `with-test-home`
  sites and the `behavior_run()` gate, before any model dispatch; message names commit+push+fetch.
  Resolution: agent commits and pushes per the §4 carve-out, re-fetches, re-runs.

  - **Uncommitted submodule changes (F1):** Condition: `git status --porcelain` non-empty
  in the submodule. Expected behavior: `behavior_run()` pre-flight gate FAILS before
  the flock acquisition completes. Resolution: agent commits (the §4 carve-out authorizes
  autonomous commit+push for test-framework runs), then re-runs.

  - **`BEHAVIOR_SUBMODULE_COMMIT` pinned to an unpushed SHA (F2 variant):** Condition:
  override env var set to a commit not on remote. Expected behavior: gate verifies
  THAT pinned SHA against the remote and FAILS — no bypass (R-4). Resolution: agent
  pushes the pinned commit or re-pins to a pushed SHA.

  - **Pushed HEAD control (false-positive guard):** Condition: normal case — clean
  tree, HEAD on remote. Expected behavior: gate passes, run proceeds identically to
  today''s good path (R-14). Resolution: n/a — SC-1/SC-3 control probes enforce no
  regression here.

  - **Shared-home reuse mode:** Condition: resumed run reuses `tmp/test-home-shared`
  (existing clone, checkout block skipped). Expected behavior: the `behavior_run()`
  pre-flight gate still validates the shared project''s git state — the reuse path
  MUST NOT bypass the gate. Resolution: gate reads live state each run (R-13); the
  §10.7 known limitation remains unchanged.

  - **Local-only / unreachable remote:** Condition: remote unreachable or missing
  at gate time. Expected behavior: hard FAIL — consistent with the fact that the clone
  itself requires the remote (C2). Resolution: agent restores remote connectivity;
  the harness makes no degraded-mode exception.

  - **Concurrent test runs (lock contention):** Condition: gate fires while another
  run holds `tmp/.behavior-run.lock`. Expected behavior: the gate precedes the flock,
  so a stale-code run FAILS before it ever contends for the lock; a legitimate pushed-state
  run proceeds to acquire the lock normally. Resolution: no stale lock left by gate
  failures (gate exits before lock acquisition); stale-lock cleanup per §10.1 unchanged.

  - **Gate failure mid-`with-test-home` (no test home produced):** Condition: site-1/site-2
  checkout FAIL during `--setup` or a subsequent invocation. Expected behavior: exit
  1 with remediation message; no partially-constructed test home from the wrong ref.
  Resolution: agent remediates git state and re-invokes; existing `HARNESS_FAILURE:`
  handling applies.


