  harness present |


  ## Enforcement Gate


  > **Enforcement gate:** All success criteria MUST pass before this spec is considered
  complete. Partial implementation is not permitted.


  ## Cost Frame


  Cost is measured in defect-discovery-latency, not tool calls. Correctness is the
  only metric.


  - SC-1: Running the behavioral enforcement scenario costs minutes of execution time
  — the defect is caught at the pre-commit gate where the fix costs the same bounded
  delay. Skipping costs a death spiral: a structural/string PASS lets the orchestrator
  keep dispatching skill-card content to sub-agents, and the critical-rules category
  error resurfaces on every PR run at 1000× the fix cost.

  - SC-2, SC-5: The grep verification costs seconds — classification drift across
  the two skill cards is caught before the deck ships inconsistent. Skipping costs
  the full contradiction again: an orchestrator loading either card re-introduces
  the exact defect SC-1 removed.

  - SC-3, SC-4: The clean-room semantic read costs minutes of sub-agent execution
  — ambiguous step routing is caught before any orchestrator follows it. Skipping
  costs days-to-weeks of DDL: each ambiguous "Route to" line is a fresh dispatch-decision
  defect discovered only when an orchestrator mis-routes mid-PR.


  ## Edge Cases


  - **Input boundaries (classification ambiguity):** A step that plausibly fits both
  orchestrator-direct and `task-card` — the canonical table maps every step to exactly
  one value; an unclassifiable step is escalated, not guessed.

  - **State transitions:** Reclassification is a one-time text edit; no runtime state
  machine is affected. PR pipeline states (`for_pr`, `approved-for-pr`) are invariants.

  - **Failure modes:** A tests-v2 scenario that greps the old marker (string check)
  is insufficient for SC-1 — behavioral evidence is required per the runtime-behavioral
  classification gate; a structural substitute is EVIDENCE_TYPE_MISMATCH and FAILs.

  - **Concurrency:** No concurrent writers — single-branch edit in the `.opencode`
  submodule.

  - **Recovery:** If behavioral harness infrastructure fails, remediation-first applies
  (diagnose, re-run); the only valid outcomes are PASS or FAIL with remediation —
  never a structural downgrade.


  ## Change Control


  | Date | Change | Reason | Authorized By |

  |------|--------|--------|---------------|

  | 2026-09-19 | Split SC-1 into SC-1 (marker removal, behavioral) and SC-2 (classification
  citation, string); split SC-2 into SC-3 (pr-creation.md per-step classification)
  and SC-4 (nested sub-task routing classified as task-card dispatch); renumbered
  parent-card sync to SC-5. Requirements R-1..R-6 renumbered to R-1..R-7 with the
  R-5 either/or disjunction resolved at spec time (nested sub-task cards classified
  as task-card dispatch points). Removed disjunctive and judgment terms (''or folded'',
  ''unambiguous'', ''aligned'') from all SCs. Items, traceability, and cost frame
  updated to match. | spec-creation validate FAIL: compound-sc-detection, determinism,
  testability findings | spec-creation validate pipeline (revision task dispatch,
  issue michael-conrad/.opencode#2437) |

