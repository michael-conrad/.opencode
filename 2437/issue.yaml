body: '> **Full spec and artifacts: [`.opencode/.issues/2437/`](https://github.com/michael-conrad/.opencode/tree/issues-data/.issues/2437/)**
  — this issue is a condensed exec summary; the authoritative spec lives in the `issues-data`
  branch.


  # [SPEC] pr-creation workflow execution mode conflicts with orchestrator-context
  discipline


  ## Intent and Executive Summary


  1. **Problem Statement:** The `git-workflow-pr` skill card marks the `pr-creation`
  workflow step `Execution mode: sub-agent dispatch` with a `task()` prompt, while
  the same card''s Mandatory Task Discipline clause already defines the Architecture
  B contract (orchestrator executes each workflow step in its own context; `task()`
  only where Dispatch value is `task-card`). An orchestrator following the marker
  dispatches skill-card routing content to a sub-agent — the critical-rules category
  error.

  2. **Root Cause / Motivation:** The Workflows sections and `tasks/pr-creation.md`
  step routing were written under an older "dispatch everything" model and never re-classified
  against the canonical dispatch-vocabulary table. Verified live: `git-workflow-pr/SKILL.md`
  carries the contradictory marker; `git-workflow/SKILL.md` carries the same prompt
  in its "Create a PR" entry; `tasks/pr-creation.md` uses ambiguous "Route to" prose
  with no per-step dispatch classification. The same defect pattern exists on all
  5 git-workflow-pr workflow steps, but this spec scopes to the reported `pr-creation`
  step.

  3. **Approach Chosen:** Re-mark the affected skill-card and task-card routing text
  to the canonical classification per the dispatch-vocabulary table (inline vs `task-card`),
  resolving the internal contradiction by editing the contradictory markers — not
  by adding another overriding clause (precedent: writing-plans-skill-contradiction
  research card, confidence 0.95).

  4. **Alternatives Considered & Why Discarded:** (a) Adding an exception clause overriding
  the execution-mode markers — rejected: stacks another clause onto the contradiction
  instead of removing its cause. (b) Expanding the spec to reclassify all 5 git-workflow-pr
  workflow steps — rejected for this spec: the bug report names `pr-creation`; the
  remaining steps are filed as a follow-up if the deck-wide sweep is desired.

  5. **Key Design Decisions:** (a) Dispatch classification source of truth is the
  canonical dispatch-vocabulary table in the skill-card-description-standards reference
  — no ad-hoc vocabulary in the edited files. (b) The PR pipeline''s mandatory gates
  (squash-per-issue, human-only merge, Step 9 reconciliation) are untouched invariants.
  (c) SC-1 is behavioral-evidence-gated: reclassification alters dispatch decisions,
  a runtime-behavioral effect.

  6. **User Intent / Original Prompt:** [BUG] pr-creation workflow ''execution mode:
  sub-agent dispatch'' conflicts with orchestrator-context discipline (michael-conrad/.opencode#2437).


  ## Not Included


  - **Deck-wide reclassification of the other 4 git-workflow-pr workflow steps (review-prep,
  pair-pr-creation, post-implementation, completion)** — the bug report scopes `pr-creation`;
  a deck-wide sweep is a separate follow-up issue if desired.

  - **Runtime/code changes to enforcement plugins or hooks** — the defect is routing-metadata
  text, not enforcement code.

  - **Changes to PR body format or the authorization scope model** — the PR pipeline''s
  semantics and gates are unchanged invariants.


  ## Success Criteria


  | ID | Criterion | Evidence Type | Verification Method |

  |----|-----------|---------------|---------------------|

  | SC-1 | The `git-workflow-pr` skill card''s `pr-creation` workflow step does not
  contain the text `Execution mode: sub-agent dispatch` | behavioral | tests-v2 enforcement
  scenario via `with-test-home opencode run`: assert the orchestrator does not dispatch
  the skill card''s pr-creation routing content to a sub-agent; content-verification
  assertions on stderr agent actions |

  | SC-2 | The `git-workflow-pr` skill card''s `pr-creation` workflow step states
  the classification `task-card` with a citation of the canonical dispatch-vocabulary
  table in `.opencode/reference/skill-card-description-standards.md`, consistent with
  the Mandatory Task Discipline clause | string | grep: the step body contains `task-card`
  and a reference to the dispatch-vocabulary table; no contradictory marker text remains
  |

  | SC-3 | `tasks/pr-creation.md` states the dispatch classification for each procedure
  step group (Steps 0-1: orchestrator-direct; Steps 2-4: orchestrator-direct; Steps
  5-7: orchestrator-direct) | semantic | Clean-room sub-agent reads the task card
  and confirms each of the three step groups carries exactly one stated classification
  |

  | SC-4 | Each nested `pr-creation/*.md` sub-task card (`enforcement-gate.md`, `squash-push.md`,
  `create-pr.md`) is classified as a `task-card` dispatch point in `tasks/pr-creation.md`
  | semantic | Clean-room sub-agent reads the task card and confirms each of the three
  sub-task files is listed as a `task-card` dispatch point |

  | SC-5 | The `git-workflow` skill card''s "Create a PR" workflow entry contains
  the `task-card` classification vocabulary and does not contain the sub-agent-dispatch
  prompt | string | grep: the entry contains `task-card` and does not match the old
  sub-agent-dispatch prompt text |


  ## Requirements


  R-1. The `pr-creation` workflow step in the `git-workflow-pr` skill card SHALL NOT
  contain the marker `Execution mode: sub-agent dispatch`.


  R-2. The `pr-creation` workflow step in the `git-workflow-pr` skill card SHALL be
  marked with the classification `task-card` per the dispatch-vocabulary table, citing
  the canonical dispatch-vocabulary table in `.opencode/reference/skill-card-description-standards.md`.


  R-3. `tasks/pr-creation.md` SHALL explicitly state the dispatch classification for
  each procedure step group: Steps 0-1 orchestrator-direct, Steps 2-4 orchestrator-direct,
  Steps 5-7 orchestrator-direct, per the canonical dispatch-vocabulary table.


  R-4. `tasks/pr-creation.md` SHALL classify each nested `pr-creation/*.md` sub-task
  card (`enforcement-gate.md`, `squash-push.md`, `create-pr.md`) as a `task-card`
  dispatch point.


  R-5. The `git-workflow` skill card''s "Create a PR" workflow entry SHALL use the
  same classification vocabulary as R-2.


  R-6. The fix SHALL resolve the internal contradiction with the Mandatory Task Discipline
  clause by removing/rewriting the contradictory markers — it SHALL NOT add another
  overriding clause.


  R-7. Edited files SHALL preserve and append existing bylines/provenance per the
  code-standards attribution rules.


  ## Items


  ### Item 1 (SC-1, SC-2): Reclassify the pr-creation workflow step in the git-workflow-pr
  skill card


  - RED: tests-v2 behavioral scenario asserting the orchestrator still dispatches
  the pr-creation skill-card routing content to a sub-agent — fails before the change

  - GREEN: remove the `Execution mode: sub-agent dispatch` marker and `task()` prompt
  on the `pr-creation` step; replace with the `task-card` classification citing the
  dispatch-vocabulary table, consistent with the Mandatory Task Discipline clause

  - verify: behavioral scenario run passes; grep confirms the marker is gone and the
  `task-card` classification with table citation is present

  - commit: `.opencode/skills/git-workflow-pr/SKILL.md`


  ### Item 2 (SC-3): Classify step routing in the pr-creation task card


  - RED: content check for explicit per-step dispatch classification fails (only ambiguous
  "Route to" prose exists)

  - GREEN: add explicit orchestrator-direct classification for Steps 0-1, 2-4, 5-7

  - verify: clean-room sub-agent read confirms each step group carries exactly one
  stated classification

  - commit: `.opencode/skills/git-workflow-pr/tasks/pr-creation.md`


  ### Item 3 (SC-4): Classify nested sub-task routing in the pr-creation task card


  - RED: content check finds no explicit task-card classification for the nested sub-task
  cards

  - GREEN: classify `pr-creation/enforcement-gate.md`, `pr-creation/squash-push.md`,
  and `pr-creation/create-pr.md` as `task-card` dispatch points in `tasks/pr-creation.md`

  - verify: clean-room sub-agent read confirms each of the three sub-task files is
  listed as a `task-card` dispatch point

  - commit: `.opencode/skills/git-workflow-pr/tasks/pr-creation.md`


  ### Item 4 (SC-5): Sync the parent git-workflow skill card


  - RED: grep finds the sub-agent-dispatch prompt still present in the parent card''s
  "Create a PR" entry

  - GREEN: align the entry''s prompt/execution mode with the `task-card` classification
  vocabulary

  - verify: grep confirms the old prompt is gone and the `task-card` classification
  is present

  - commit: `.opencode/skills/git-workflow/SKILL.md`


  ## Dependencies


  | Reference | Relationship | Status |

  |-----------|--------------|--------|

  | Canonical dispatch-vocabulary table (`.opencode/reference/skill-card-description-standards.md`)
  | Must be read before implementation — sole source of truth for classification vocabulary
  | Satisfied |

  | writing-plans-skill-contradiction research card (`.issues/research-cards/`) |
  Precedent for the resolution pattern (confidence 0.95, incorporated) | Satisfied
  |

  | Bug report michael-conrad/.opencode#2437 | Source issue; spec lands in the same
  issue | Satisfied |

  | tests-v2 enforcement framework | Must exist for SC-1 behavioral verification |
  Satisfied |


