  | Read — duplicate "Create a PR" prompt confirmed live |

  | pr-creation task card + sub-tasks | code (agent-facing text) | `.opencode/skills/git-workflow-pr/tasks/pr-creation.md`,
  `pr-creation/*.md` | Read — ambiguous "Route to" prose confirmed live |

  | Skill-card description standards | doc | `.opencode/reference/skill-card-description-standards.md`
