    - {step: green, skill: test-driven-development, dispatch: 'task(..., prompt: "execute green task from test-driven-development")'}
    - {step: post-regression, skill: test-driven-development, dispatch: 'task(..., prompt: "execute phase-4 task from test-driven-development")'}
    - {step: verify, skill: verification-before-completion, dispatch: 'task(..., prompt: "execute verify task from verification-before-completion")'}
