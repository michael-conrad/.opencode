    - {step: pre-pr-gate, skill: verification-before-completion, dispatch: 'task(..., prompt: "execute verify task from verification-before-completion") — reads all SC verdicts, BLOCKs if any FAIL'}
    - {step: regression-check, skill: test-driven-development, dispatch: 'task(..., prompt: "execute phase-4 task from test-driven-development")'}
    - {step: review-prep, skill: git-workflow-pr, dispatch: 'task(..., prompt: "execute review-prep from git-workflow-pr. Read `git-workflow-pr/tasks/review-prep.md` first")'}
    - {step: create-pr, skill: git-workflow-pr, dispatch: 'task(..., prompt: "execute create task from git-workflow-pr")'}
    - {step: exec-summary, skill: completion-core, dispatch: 'task(..., prompt: "execute completion task from completion-core")'}

