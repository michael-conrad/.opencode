sweep_evidence: 'Fixed in the live tool: .opencode/tools/local-issues now has _normalize_labels() that splits tokens on commas, _reject_malformed_labels() that exits 2 instead of silently creating malformed labels, and --labels help text reading ''Comma-separated or space-separated labels; malformed tokens...'' — exactly the bug''s Expected state.'
