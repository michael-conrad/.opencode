title: '[BUG] local-issues update --labels: help text implies comma-separated input
  but nargs=''*'' parses space-separated'
status: open
labels:
- approved-for-pr
- spec-cleared
body: '## Observed


  The help text for `local-issues update --labels` implies comma-separated label input,
  but the argparse definition uses `nargs=''*''` (space-separated). Passing a quoted
  comma-separated string (e.g. `--labels ''spec-passed-review, other''`) silently
  produces a single malformed label containing the comma/space.


  Discovered during spec-audit label updates on `NewsRx/hermes-ingest-pubmed#139`
  (2026-09-14).


  ## Expected


  Help text matches parsing behavior (either document space-separated usage or split
  on commas in code), and malformed labels should be rejected rather than silently
  created.


  ## Steps to reproduce


  `./.opencode/tools/local-issues update --number <repo>#<N> --labels ''a, b''` then
  read the issue labels.


  ## Component


  `.opencode/tools/local-issues` — label update CLI + help text.


  🤖 Co-authored with AI: OpenCode (huggingface/zai-org/GLM-5.3-Flash)

  '
