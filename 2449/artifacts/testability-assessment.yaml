# Testability assessment — .opencode#2449
strategy: mixed (unit-level sandbox pytest; behavioral optional)
phases:
  - phase: "SC-1"
    test_type: unit
    method: >
      pytest sandbox (pattern: .opencode/tests/test_local_issues/test_yaml_load_warn_and_skip.py):
      fixture tree with dir X/spec.md only; run list; assert output does
      NOT match 'X [open]'; assert '[artifact-only]' or absence per spec.
      RED first: assert '[open]' absent fails on current tool.
  - phase: "SC-2"
    test_type: unit
    method: "same sandbox; fixture dir with plain spec.md; run search <term>; assert no '[open]' for that dir; cover frontmatter-spec case"
  - phase: "SC-3"
    test_type: unit
    method: >
      matrix fixtures: (spec.md only), (comments.yaml only), (links.yaml
      only), (empty), (issue.yaml+spec.md control) — assert marker/skip
      policy per spec decision for each combination; control must keep
      real status.
  - phase: "read side-effect"
    test_type: unit
    method: "assert read on yaml-less dir does not report status open (consistency with SC-2)"
behavioral_note: >
  Tool is deterministic CLI; unit-level sandbox pytest is the primary
  evidence type (structural/functional). Behavioral opencode-run tests
  not required for output-format fidelity — evidence taxonomy: behavioral
  for agent dispatch behavior only, which is unaffected here.
