# Interface compatibility for issue 2450
# Scoped validation mode for local-issues validate-yaml (--number repo#N) + R-13 gate scoping + governance mandates
# All tool changes are ADDITIVE-ONLY: the no-flag default stays byte-for-byte identical (R-5); nothing removed.
# dependency_contract section auto-backfilled per research task Step 9 (source artifact carried no dependency_contract key).

interfaces:
  - interface: "validate-yaml CLI surface"
    kind: added_to
    compatibility: backward_compatible
    phases: [1]
    detail: "--number <repo>#N flag ADDED (R-1); no-flag default unchanged byte-for-byte (R-5); bare numbers rejected per qualifier enforcement (R-11); fail-fast on missing directory (R-10)."
  - interface: "report format '<path>: <error-class>' with error classes invalid-yaml / schema-violation / malformed-frontmatter"
    kind: modified
    compatibility: backward_compatible
    phases: [1]
    detail: "UNCHANGED — scoped mode emits through the same shared scan code path; scoped output equals workspace output filtered to the target's paths (R-4); no second report dialect."
  - interface: "R-13 gate sites (analyze.md Step 5.3, create.md Step 6.1)"
    kind: modified
    compatibility: backward_compatible
    phases: [2]
    detail: "Intentional contract change per the spec's problem statement: gates switch to the scoped invocation as the progress-gating check; workspace-wide scan demoted to secondary maintenance check that MUST NOT gate on unrelated records; BLOCKED-on-target-violations semantics preserved."
  - interface: "spec-creation create.md Step 3 / issue-operations-core creation.md Step 2.1 existing mechanics"
    kind: modified
    compatibility: backward_compatible
    phases: [3]
    detail: "Reservation mandate text ADDED alongside; remote-stub-first -> local-at-N mechanics, renumber/migrate repair, API_FAILURE_MID_FLOW path, counter advancement all preserved."
  - interface: ".opencode/.issues/AGENTS.md and .opencode/AGENTS.md governance sections"
    kind: modified
    compatibility: backward_compatible
    phases: [3]
    detail: "ADDITIVE mandate sentences (hygiene mandate SC-6/SC-7, reservation mandate SC-8); existing Authorization/Workflow/worktree-table structure untouched."

removed_interfaces: []
breaking_changes: []
# Z3 contract section consumed by .opencode/tools/solve (check/model/prove)
