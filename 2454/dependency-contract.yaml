    type: bool
  item_2_complete:
    type: bool
  item_3_complete:
    type: bool
  item_4_complete:
    type: bool

preconditions: []
  # Single-phase decomposition (P1); items 1-4 are independent per-SC RED/GREEN/commit
  # cycles on the same concern boundary (executing-plans deck) — no item output is a
  # precondition of another item's RED test. No ordering constraints.

postconditions:
  - "z3.And(item_1_complete, item_2_complete, item_3_complete, item_4_complete)"

invariants:
  - "z3.Or(item_1_complete, z3.Not(item_1_complete))"

