existing_patterns:
  - "__semantic_monitor polls live session DB at intervals, extracts event stream (tool calls, reasoning sizes, text parts), writes monitor-attempt{N}.log"
  - "Current signals are mechanical shell heuristics: identical tool input >=3x, stuck task() >=2 polls, reasoning >N chars with <=1 new tool call, semantically off-track 2+ polls — semantic judgment is currently embedded in shell, NOT in a sub-agent context"
  - "§14 abort recovery: kill + §10.5 export + semantic diagnosis recorded alongside session.yaml"
  - "§10.7 --resume-home: cross-invocation resumption for genuinely progressing runs (e.g., bash tool timeout kill)"
  - "R-18/§17: excessive run time is a primary defect signal; cause analysis mandatory"
  - "R-19/§18: unavailability claims require personal inspection of session deliberation evidence"

live_evidence_from_2454:
  - "SC-2 required 2+ aborted runs; one abort was a false-positive monitor abort (parser over-count of duplicate running events) — motivates monitor false-signal guard"
  - "SC-3 required two §10.7 resumptions — resumption currently ungated by any determination record"
  - "SC-1 RED flagged harness per-run re-provisioning cost (fresh-home clone + 27B smoke tests, ~15+ min) as an unfixed infrastructure defect"

gaps_identified:
  - "No determination record artifact exists; monitor aborts are not folded into a durable non-undetermined determination"
  - "No gate blocks resume/re-run of an aborted/killed dispatch without a recorded determination"
  - "No orchestrator notification path from monitoring; undetermined runs can silently continue"
  - "No ceiling on undetermined cycles"
  - "Semantic classification is shell-heuristic, not sub-agent-context semantic classification"

