dependency_dag:
  edges:
    - from: phase-1
      to: phase-2
      reason: "SC-4/SC-5/SC-6/SC-7 routing depends on SC-2 classification taxonomy + SC-3 record schema"
    - from: phase-1
      to: phase-3
      reason: "SC-8 gate reads SC-3 determination record; SC-9 counts undetermined records"
    - from: phase-3
      to: phase-4
      reason: "SC-11 scenario exercises the SC-8 gate"
    - from: phase-4
      to: phase-5
      reason: "SC-12 documents the implemented SC-8/SC-9/SC-10/SC-11 predicates"

triplet_colocation:
  verified: true
  note: "Every SC's RED, GREEN, and COMMIT steps are assigned to the same phase (per-item TDD cycle, one SC per item)."

cross_phase_dependency_check:
  verified: true
  note: "No RED test in phase X depends on SC output committed only in a later phase Y. All cross-phase reads (record schema SC-3, gate SC-8) are committed in earlier phases."

skill_task_selection:
  red: "test-driven-development -- task(..., prompt: 'execute red task from test-driven-development')"
  green: "test-driven-development -- task(..., prompt: 'execute green task from test-driven-development')"
  verify: "verification-before-completion -- task(..., prompt: 'execute verify task from verification-before-completion')"
  commit: "commit-inline (orchestrator runs git add/commit directly)"
