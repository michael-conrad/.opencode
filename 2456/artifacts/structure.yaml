          green: "test-driven-development -- execute green task"
          verify: "verification-before-completion -- execute verify task"
          commit: "commit-inline (orchestrator)"
      - sc: "SC-7"
        description: "Orchestrator decision recorded as decision field with allowed value-set"
        steps:
