schema: decompose-output
issue: ".opencode#2458"
generated: 2026-09-22
spec_shape: single-task
phase_count: 1
phase_name: "Deprecation Encounter Protocol directive + runtime-constraint docs + enforcement"

sc_definitions:
  - sc_id: SC-1
    text: "Canonical directive fragment registered with skill-creator fragment-management"
    evidence_type: string
    file_category: "skill-creator fragment store"
  - sc_id: SC-2
    text: "Directive inlined in full in each of six SKILL.md cards (research, systematic-debugging, programming-principles, audit, skill-creator, engineering-approach); no Read-link-only / conditional-insert / load-on-encounter form anywhere"
    evidence_type: string
    file_category: "six SKILL.md card bodies"
  - sc_id: SC-3
    text: "Six card copies byte-identical to the canonical fragment"
    evidence_type: string
    file_category: "six SKILL.md card bodies"
  - sc_id: SC-4
    text: "Runtime-constraint documentation present in skill-card-description-standards.md and task-card-structure-standards.md (full detail) plus compact 2-3 sentence statement in .opencode/AGENTS.md"
    evidence_type: string
    file_category: "C2 reference docs (3 files)"
  - sc_id: SC-5
    text: "Agent encountering a deprecated item classifies it as pending breakage/bitrot (never ignores, never builds on it) and dispatches filing for every encounter, dependent or observed"
    evidence_type: behavioral
    file_category: ".opencode/tests-v2 behavioral scenario"
  - sc_id: SC-6
    text: "Filing routes by platform state: remote API when available / chat executive summary + defer-and-retry on transient failure / local .issues/ standard tracking ([BITROT] prefix + bitrot label) on structural absence of remote; search-then-create-or-comment observed"
    evidence_type: behavioral
    file_category: ".opencode/tests-v2 behavioral scenario(s)"
  - sc_id: SC-7
    text: "Dependent encounter (current change touches the deprecated code path) surfaces scope assessment to developer; no resolution SC folded into current spec without dev brainstorm"
    evidence_type: behavioral
    file_category: ".opencode/tests-v2 behavioral scenario"

implementation_items:
  - item: 1
    sc_id: SC-1
    title: "Register canonical deprecation-encounter fragment"
    red: "Fragment store lacks deprecation-encounter fragment (fragment-management registration check fails)"
    green: "Fragment registered with canonical directive text"
    verify: "Fragment store inspection"
    commit: "fragment registration + test artifact"
    cycle: "RED → GREEN → REFACTOR → COMMIT"
    depends_on: []
  - item: 2
    sc_id: SC-2
    title: "Inline directive in six SKILL.md cards"
    red: "Static check finds no full directive text in ≥1 of the six cards (or finds pointer-only form)"
    green: "All six cards carry the full directive inline in their natural per-card sections"
    verify: "Static text check: full directive present ×6; absence of pointer forms"
    commit: "six card edits + test artifact"
    cycle: "RED → GREEN → REFACTOR → COMMIT"
    depends_on: [1]
  - item: 3
    sc_id: SC-3
    title: "Six-copy equality against canonical fragment"
    red: "Equality check across six cards vs canonical fragment fails (missing or divergent copy)"
    green: "All six copies byte-identical to canonical"
    verify: "Equality check"
    commit: "divergence fix + test artifact"
    cycle: "RED → GREEN → REFACTOR → COMMIT"
    depends_on: [2]
  - item: 4
    sc_id: SC-4
    title: "Runtime-constraint documentation in C2 files"
    red: "Static check finds no runtime-constraint text in ≥1 of the three C2 files"
    green: "Full-detail constraint in both reference standards docs; compact 2-3 sentence statement in .opencode/AGENTS.md"
    verify: "Static text check on three files"
    commit: "three doc edits + test artifact"
    cycle: "RED → GREEN → REFACTOR → COMMIT"
    depends_on: []
  - item: 5
    sc_id: SC-5
    title: "Behavioral: encounter → classify → dispatch filing"
    red: "Clean-room opencode run on unmodified deck: agent ignores deprecated item (no classification/dispatch evidence in stderr)"
    green: "Agent classifies deprecated item as pending breakage/bitrot and orchestrator dispatches filing for dependent AND observed encounters"
    verify: "tests-v2 clean-room run; stderr behavioral evidence (commit → push → fetch-verify before run)"
    commit: "scenario + harness wiring"
    cycle: "RED → GREEN → REFACTOR → COMMIT → PUSH (behavioral)"
    depends_on: [2, 3]
  - item: 6
    sc_id: SC-6
    title: "Behavioral: platform-routed filing (search-then-create-or-comment)"
    red: "No routing behavior: no search-before-POST, no [BITROT] prefix/label, no local fallback on structural absence"
    green: "Filing searches existing [BITROT] specs first (comment on found, create on not-found) and routes per platform state"
    verify: "tests-v2 behavioral scenario(s) — table-driven routing branches"
    commit: "scenario + harness wiring"
    cycle: "RED → GREEN → REFACTOR → COMMIT → PUSH (behavioral)"
    depends_on: [5]
  - item: 7
    sc_id: SC-7
    title: "Behavioral: dependent-encounter dev-brainstorm gate"
    red: "Agent folds a resolution SC into the current spec without dev brainstorm (or fails to surface scope assessment)"
    green: "Agent surfaces scope assessment; no inline SC addition without dev brainstorm"
    verify: "tests-v2 behavioral scenario asserting no unauthorized fold-in"
    commit: "scenario + harness wiring"
    cycle: "RED → GREEN → REFACTOR → COMMIT → PUSH (behavioral)"
    depends_on: [5]

dependency_dag:
  acyclic: true
  edges: "1 → 2 → 3 → 5 → 6, 5 → 7; 4 independent (string docs)"

atomicity_check:
  one_sc_per_item: true
  one_red_green_cycle_per_item: true
  note: "SC-5 behavioral variant carries PUSH step per 091 behavioral-item ordering; commit/push precede behavioral run per tests-v2 §4"
