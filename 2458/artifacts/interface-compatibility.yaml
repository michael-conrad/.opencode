# Interface Compatibility — issue 2458 (Deprecation Encounter Protocol)
# Interface boundaries between affected modules. No executable code is touched;
# all boundaries are documentation/harness interfaces. Additive-only (REQ-C1).

interfaces:
  - name: "fragment-management → six cards"
    source: "skills/skill-creator/tasks/fragment-management.md (fragment store)"
    target: "skills/{research,systematic-debugging,programming-principles,audit,skill-creator,engineering-approach}/SKILL.md"
    compatibility: "The fragment-management mechanism registers the canonical fragment (SC-1) and the six cards inline byte-identical copies (SC-2/SC-3). Mechanism MUST remain unmodified (R-13) — the interface is write-once (registration) + read-only (inlined copies)."
  - name: "C2 reference docs → card bodies"
    source: "reference/skill-card-description-standards.md, reference/task-card-structure-standards.md"
    target: "all skill card bodies (six cards herein)"
    compatibility: "Full-detail runtime-constraint documentation (SC-4) governs how decision-point directives are placed (inline, never Read-link-only / load-on-encounter). Cards must conform to these constraints; no mechanism conflict (the directive is placed inline per the docs)."
  - name: "AGENTS.md compact statement"
    source: "AGENTS.md"
    target: "every agent session (always-loaded surface)"
    compatibility: "Compact 2-3 sentence runtime-mechanics statement (SC-5). Only always-loaded addition (R-14); Tier 1 guidelines untouched; directive stays out of C2 (R-17)."
  - name: "tests-v2 harness → behavioral scenarios"
    source: "tests-v2/test-enforcement.sh, tests-v2/with-test-home"
    target: "new scenarios for SC-6..SC-11"
    compatibility: "Scenarios slot into existing --scenario/--tag/--changed filters (spec §6). Harness pre-flight gates (commit → push → fetch-verify; ≥600s timeout; with-test-home mandatory) remain binding (R-15). Harness mechanism MUST remain unmodified (R-13)."
  - name: "deck validators → card bodies"
    source: "skildeck-lint / validate_skill_cards.py"
    target: "six SKILL.md cards"
    compatibility: "Validators reject meta-instruction patterns in frontmatter/description, not body sections — body additions pass; a rejection indicates frontmatter contamination to be corrected (spec §11 Failure modes). Validators remain unmodified (R-13)."

dependency_contract:
  - source: "skills/skill-creator/tasks/fragment-management.md"
    target: "six SKILL.md cards (SC-1, SC-2, SC-3)"
    constraint: "fragment-management registration check must locate the canonical deprecation-encounter fragment (string evidence); six inlined copies byte-identical to the registered fragment (string evidence, SC-3)."
  - source: "reference/skill-card-description-standards.md"
    target: "six SKILL.md cards (SC-4)"
    constraint: "full-detail runtime-constraint text present in the reference doc (string evidence); cards place decision-point directives inline per that documentation."
  - source: "reference/task-card-structure-standards.md"
    target: "six SKILL.md cards (SC-4)"
    constraint: "full-detail runtime-constraint text present in the reference doc (string evidence); no mid-card content insertion mechanism."
  - source: "AGENTS.md"
    target: "all agent sessions (SC-5)"
    constraint: "compact 2-3 sentence runtime-mechanics statement present and within the sentence bound (string evidence); scoped to runtime mechanics only (R-7, R-17)."
  - source: "tests-v2/test-enforcement.sh + tests-v2/with-test-home"
    target: "SC-6..SC-11 behavioral scenarios"
    constraint: "clean-room opencode run via with-test-home; stderr behavioral evidence; commit → push → fresh-fetch-verify before run; ≥600s bash timeout (R-15, tests-v2 §4, §10.2)."
  - source: "skildeck-lint / validate_skill_cards.py"
    target: "six SKILL.md cards (R-13)"
    constraint: "deck validators green after card-body edits; validators themselves unmodified."
  - source: "skill()/task() load semantics (research card, confidence 0.90)"
    target: "SC-2/SC-4 runtime-constraint design"
    constraint: "skill() auto-loads full SKILL.md cards before decision-making; task() does NOT auto-load task cards — grounds the inline-only placement decision."
