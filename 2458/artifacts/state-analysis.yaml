# State Analysis — issue 2458 (Deprecation Encounter Protocol)
# State transitions required by each SC. No executable runtime state exists in this
# spec (additive doc/behavioral-scenario scope); transitions below are the decision
# states the protocol introduces. Routing branch selection carries NO persisted
# state (spec §11 — per-invocation decision; state-analysis: not-applicable).

state_transitions:
  - sc: SC-6
    description: "Encounter state machine: deprecated item encountered → classification (pending breakage/bitrot) vs. ignorable-noise (forbidden). Classified encounter is the precondition for filing dispatch (SC-7)."
  - sc: SC-7
    description: "Dispatch state: classified encounter → orchestrator dispatches filing sub-agent (dependent variant) or propagates via result contract (observed variant). Both variants MUST file (R-4)."
  - sc: SC-8
    description: "Routing state (per-invocation, not persisted): remote API available → remote filing; transient API failure → chat executive summary + defer-and-retry; structurally local → .issues/ standard tracking. No state carried across invocations."
  - sc: SC-9
    description: "Search-then-POST state: search remote tracker → existing [BITROT] spec found → append encounter evidence as comment; not found → create spec with [BITROT] title prefix + bitrot label (label created on first filing if absent)."
  - sc: SC-10
    description: "Dependent-encounter state: dependent classification adds scope-assessment surfacing to the developer; observed-only proceeds to filing without assessment."
  - sc: SC-11
    description: "Fold-in gate state: resolution SC fold-in requires dev brainstorm presenting plan-approval-revocation cost; observed-only encounters never raise the SC question (R-11)."
