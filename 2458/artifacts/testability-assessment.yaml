schema: testability-assessment
issue: ".opencode#2458"
generated: 2026-09-22
status: complete
source: "handoff testability.md (complete, used directly); evidence types per critical-rules-BEH-EV"
evidence_type_rule: "substrate-determined: placement/docs changes are string-verifiable static text; encounter behavior changes are runtime-behavioral and require behavioral evidence — declared type is overridden by substrate classification"
sc_evidence_map:
  - sc_id: SC-1
    type: string
    mechanics: "fragment store inspection — fragment registered with canonical directive text"
  - sc_id: SC-2
    type: string
    mechanics: "static text check: full directive text present in each of six card bodies; absence of Read-link-only / conditional-insert / load-on-encounter pointer forms"
  - sc_id: SC-3
    type: string
    mechanics: "equality check across the six card bodies against canonical fragment"
  - sc_id: SC-4
    type: string
    mechanics: "static text check on three files: both reference standards docs (full detail) + .opencode/AGENTS.md (2-3 sentence compact statement)"
  - sc_id: SC-5
    type: behavioral
    mechanics: "tests-v2 clean-room opencode run — stderr evidence of classification (pending breakage/bitrot, never ignore) + filing dispatch; RED before change (zero current encounter-side coverage), GREEN after; dependent AND observed encounter variants"
  - sc_id: SC-6
    type: behavioral
    mechanics: "behavioral scenario per routing branch (remote available / transient defer / local .issues/ fallback) or table-driven scenario set; search-then-create-or-comment asserted"
  - sc_id: SC-7
    type: behavioral
    mechanics: "behavioral scenario asserting no inline SC addition without dev brainstorm; scope assessment surfaced on dependent encounter"
existing_coverage:
  - ".opencode/tests-v2/test-enforcement.sh exists with --scenario, --tag, --changed filters (per .opencode/AGENTS.md Build/Lint/Test table) — new scenarios slot into existing harness"
  - "no existing test covers deprecation-encounter behavior (deck-wide grep: zero encounter-side text) — RED phase achievable: current agents have no directive to follow"
infrastructure_constraints:
  - "behavioral runs require >=600s bash timeout (default 120s kills inference mid-run) — tests-v2 AGENTS.md §10.2"
  - "with-test-home wrapper mandatory: bash .opencode/tests-v2/with-test-home opencode run '<message>' — never direct opencode run"
  - "stale lock cleanup: rm -f tmp/.behavior-run.lock before re-runs — §10.1"
  - "commit → push → fresh-fetch-verify ordering before behavioral runs (tests-v2 §4) — harness hard-FAILs on uncommitted/unpushed submodule state"
  - "behavioral items carry PUSH step before behavioral run (091 behavioral variant); SC-5/6/7 items include PUSH"
substitution_prohibition:
  rule: "critical-rules-060 — when a behavioral/functional test cannot execute, the ONLY valid outcome is FAIL; no grep/string/metadata substitution"
