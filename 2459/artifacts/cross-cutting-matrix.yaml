cross_cutting_matrix:
  issue: ".opencode#2459"
  matrix:
    - cutting_concern: "evergreen constraint (no volatile references, no STATUS fields)"
      SC-1: "applies — guideline text is evergreen (no session state, no dates-as-facts beyond citation years)"
      SC-2: "applies — scenario scripts use domain prompts, not session-specific fixtures"
    - cutting_concern: "runtime-behavioral evidence (critical-rules-BEH-EV)"
      SC-1: "applies — behavioral load-and-cite evidence required"
      SC-2: "applies — behavioral posture evidence required"
    - cutting_concern: "provenance and attribution (080-code-standards.md)"
      SC-1: "applies — new guideline file carries SPDX/provenance headers + co-authored byline"
      SC-2: "n/a — test scripts follow existing tests-v2 conventions"
    - cutting_concern: "agency-respecting prose (250 dark-prose-006/004)"
      SC-1: "applies — Tier 1 authority frame; no blame-adjacent or tool-control framing"
      SC-2: "n/a"
    - cutting_concern: "single-source-of-truth anti-duplication (INDEX.md canonical-reference rule)"
      SC-1: "applies — boundaries are cross-references; no directive text duplicated into other files; prompts/default.txt excluded"
      SC-2: "n/a"
    - cutting_concern: "JSONC validity / config integrity"
      SC-1: "applies — array edit must preserve JSONC parse"
      SC-2: "n/a"
    - cutting_concern: "non-regression"
      SC-1: "applies — registration must not disturb existing array entries or INDEX rows"
      SC-2: "applies — existing suite must pass unchanged"
    - cutting_concern: "test framework discipline (with-test-home mandate, >=600s timeout, no stale locks)"
      SC-1: "applies — scenario runs via harness"
      SC-2: "applies — same; commit+push+fetch-verify before behavioral run per 091"
