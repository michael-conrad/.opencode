title: '[BUG] gh pr edit fails on gh 2.45.0 (GitHub Projects-classic deprecation)
  — no REST fallback documented in gh-cli skill deck'
status: open
labels:
- needs-approval
- bug
- confirmed
body: '> **Full spec and artifacts: [`.opencode/.issues/2461/`](https://github.com/michael-conrad/.opencode/tree/issues-data/2461)**
  — this issue is a condensed exec summary; the authoritative spec lives in the `issues-data`
  branch.


  >


  > **Local artifacts:** `.opencode/.issues/2461/` — spec


  ## Observed Behavior


  `gh pr edit 204 --repo NewsRx/hermes-ingest-pubmed --body-file <new-body-file>`
  fails with exit status 1:


  ```

  GraphQL: Projects (classic) is being deprecated in favor of the new Projects experience,
  see: https://github.blog/changelog/2024-05-23-sunset-notice-projects-classic/. (repository.pullRequest.projectCards)

  ```


  Environment: gh CLI 2.45.0 (2025-07-18, Ubuntu package `2.45.0-1ubuntu0.3`). The
  deck itself documents `gh issue edit` rather than `gh pr edit`, so agents following
  the deck have no documented `pr edit` path or fallback.


  **Triage scope correction (2026-10-14, verified live):** the failure is `gh pr edit`
  only. `gh issue edit` was tested on the same build and succeeds (exit 0) — the original
  report''s claim that issue-edit "hits the same GraphQL read path and the same failure"
  is wrong and is corrected here in place. The fix spec must not document issue-edit
  as affected.


  ## Expected Behavior


  `gh pr edit <N> --repo <owner/repo> --body-file <file>` amends the PR body and exits
  0. Agents following the gh-cli skill deck should be able to amend PR bodies without
  a silent hard failure from a deprecated GitHub GraphQL field — and, where the failure
  occurs, find the recovery path in the deck.


  ## Steps to Reproduce


  1. On gh 2.45.0, run: `gh pr edit 204 --repo NewsRx/hermes-ingest-pubmed --body-file
  <any-file>`

  2. Command exits 1 with the `projectCards` deprecation error above.


  Reproduced live 2026-10-14 on a disposable PR in `michael-conrad/test-submodule-1`
  (same error, exit 1); the workaround below returned exit 0 in the same session.


  ## Verified Workaround


  REST API PATCH via `gh api` (applied 2026-09-23 to PR #204 of `NewsRx/hermes-ingest-pubmed`
  — body amendment confirmed in the live response; re-verified live 2026-10-14):


  ```bash

  gh api -X PATCH "repos/{owner}/{repo}/pulls/{N}" -F body=@<new-body-file>

  ```


  ## Component Affected


  gh-cli skill (`.opencode/skills/gh-cli/SKILL.md`): the card covers issue/repo flows
  and PR create/view/merge but has no `pr edit` operation and no documented fallback
  for PR-body amendment when `gh pr edit` fails against the deprecated endpoint.


  ## Remediation


  Fix the skill card — upgrade is unavailable as a general remedy (the system is package-current;
  the deck runs on machines outside this project''s package control). Fix spec filed
  at `.opencode/.issues/2461/spec.md`: extend the card''s operations list with `gh
  pr edit` and its failure rule with the verified REST fallback, symptom-mapped to
  the stderr text (version-agnostic), scoped to PR operations only.

  '
