grounding_coverage:
  primary_source: "handoff cross-cutting artifact (complete) + live verification of authorization-model gaps"
  ungrounded_assumptions: []
matrix:
  - concern: "Authorization model"
    touches: ["SC-2 (sync action)", "SC-10 (010-approval-gate)"]
    detail: "pull/rebase on trunk must be authorization-free hygiene or every phase gate stalls; verified absent today (grep: only 'Creating pull requests' in 010)"
  - concern: "Sub-agent discipline (clean-room)"
    touches: ["SC-3..SC-8 (all wired cards)", "SC-1 (canonical card)"]
    detail: "freshness check is mechanical — wired cards dispatch the canonical card via task() (clean-room preserved); the gate must be executable inline by a sub-agent too (it is pure git reads)"
  - concern: "Offline / fail-open"
    touches: ["SC-1 (canonical card)"]
    detail: "network unreachable must not hard-block analysis (precedent: trunk-tip-verification fail-open); sync failures on trunk are reported, not fatal (submodule-sync precedent: 'failed submodules reported but do not block')"
  - concern: "Platform variance (trunk name resolution)"
    touches: ["SC-1", "SC-2"]
    detail: "trunk name resolution via `git remote show origin` (submodule-sync pattern) vs .gitmodules branch field — canonical card must specify one resolution order"
  - concern: "Cleanliness (scratch state survival)"
    touches: ["SC-2 (sync action)", "SC-11 (trigger list)"]
    detail: "observe/* scratch branches and tmp/ writes must survive a mid-session sync; sync must not clean or discard them (rebase only moves history, never deletes branches)"
  - concern: "Scope exclusions"
    touches: ["SC-1, SC-2 (.gitmodules enumeration)"]
    detail: "parent repo + .gitmodules-registered submodules ONLY; .issues/ worktrees (gitignored, own branch) and unregistered nested repos excluded — never directory scans"
  - concern: "Enforcement-test mandate"
    touches: ["SC-1..SC-11 (each cycle)"]
    detail: "every gate/rule change needs a behavioral test via opencode run (000-critical-rules-009); existing coverage is write-side only (trunk-tip-enforcement.sh, submodule-pointer-enforcement.sh verified; pre-work-decomposition.sh handoff claim corrected — does not exist)"
  - concern: "Specs/plans-are-not-tracking-documents"
    touches: ["spec content (create step)"]
    detail: "gate wiring must not introduce STATUS/completion markers into spec text; pipeline state lives in work-state files"
