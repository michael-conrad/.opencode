      text: "NO coded fixes: no session-init changes, no hooks, no plugins, no static/mechanical checks (developer scope directive)"
    - id: C2
      text: "Sync conflicts (rebase failures) halt to developer — never auto-resolve beyond the existing divergence logic in submodule-sync"
    - id: C3
      text: "Sync never commits parent repo submodule pointers"
    - id: C4
      text: "Fail-open on unreachable network per existing trunk-tip-verification precedent"
    - id: C5
      text: "All changed files live in .opencode submodule — spec routes to michael-conrad/.opencode"
  non_requirements:
    - "Session-start freshness via session-init (GAP-1) — excluded by no-coded-fixes scope; covered indirectly by first read-phase skill invocation"
    - "No hooks/plugins/static-check enforcement"
    - "No .issues/ worktree freshness handling (explicitly excluded)"
    - "No write-side gate changes"
    - "Remote-first spec numbering is a standing .issues/AGENTS.md mandate — no new deck change required for it"
