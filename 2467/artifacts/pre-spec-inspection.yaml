## Existing patterns and conventions

- Read [Text](path) cross-reference pattern is the deck convention for scoping
  pointers (per `.opencode/AGENTS.md` §Read-Link Cross-Reference Rule).
- Canonical-anchor convention: one file owns a definition; other sites
  Read-link to it rather than restating (skill-card-description-standards,
  cross-cutting.md handoff note).
- tests-v2/AGENTS.md already owns harness semantics — natural anchor.

