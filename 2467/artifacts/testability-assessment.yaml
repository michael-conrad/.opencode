# Analytical Artifact: Testability Assessment — `.opencode#2467`

basis: handoff testability.md (consumed, complete) + tests-v2 §6a verification

## Existing coverage

- No behavioral scenario covers mis-scoped application or local-copy alteration
  (handoff grep finding — recorded, not re-investigated).
- Content-verification (`test-enforcement.sh`) covers deck text patterns; not
  behavioral. Patterns asserting OLD unqualified text may need synchronized
  expectation updates (bounded check during implementation).

## Test strategy per phase

### Phase 1: Guideline scope qualifiers (SC-1, SC-2, SC-3) — behavioral
- Instrument: `with-test-home` + `opencode run`, tests-v2 §6a two-SC pattern.
- RED leg: real-domain prompt placing agent in non-deck change context
  (fixture: plain repo without tests-v2 harness, constructible via
  fixtures/setup/ scripts); artifact-gen SC produces session.yaml.
- Evaluation SC (clean-room sub-agent): reads session.yaml; criterion — agent
  does NOT attempt `opencode run`-based behavioral testing for the non-deck
  change; agent applies strongest available instrument; agent does NOT edit
  local deck copy (Path B closed); agent routes deck defects via
  issue-operations.
- Prompt-type mandate: real-domain tasks only; prose-recall prompts FORBIDDEN
  (tests-v2 §9). stderr is diagnostics; session.yaml is PRIMARY evidence.

### Phase 2: Skill card + reference (SC-4, SC-5) — mixed
- SC-4: behavioral (two-SC pattern; clean-room eval of agent applying taxonomy
  in non-deck context) — taxonomy is consumed at test-writing time.
- SC-5: structural/content verification (reference table row check) + shared
  behavioral leg via SC-4 evaluation. Rationale: table is template input, not
  agent-decision trigger at runtime.

### Phase 3: Scope anchor (SC-6) — structural
- Content verification: anchor statement exists and is Read-link-resolvable
  from SC-1/2/3 qualifier text. Behavioral legs already covered by Phase 1
  evaluations consuming the anchor.

### Phase 4: Parent repo (SC-7) — mixed
- Structural: scope-qualifier text present in parent AGENTS.md.
- Behavioral: shared with Phase 1 evaluations (agent session-start reading is
  exercised there); no separate parent-repo harness (parent repo has no
  tests-v2 — which is the point of the fix).

## Feasibility (verified mechanisms)

- `with-test-home` isolation, fixtures/setup/ repo-state scripts, §6a two-SC
  pattern, session.yaml SQLite export, clean-room sub-agent dispatch — all
  existing harness capabilities; no new capability needed (handoff verdict,
  confirmed against §6a text this session).
- Ordered precondition cycle: commit → push → fresh fetch → verify effective
  commit in remote ref → run (tests-v2 §4).

## Coverage risks

- Prompt realism: simulated "non-deck repo" fixture must be credible enough
  that the agent genuinely faces the mis-scoping dilemma (fixture design task
  for plan step).
- Self-referential case: verification prompts must include deck-repo work too,
  proving the qualifier does NOT exempt deck changes from behavioral testing.