title: '[SPEC-FIX] Fix: Credential redaction gap — URL-embedded creds bypass vibeguard;
  silent fail-open config; no filtered-read rule'
status: open
labels:
- needs-approval
- spec
- approved-for-review
body: "> Full spec and plan artifacts: https://github.com/michael-conrad/.opencode/tree/issues-data/2474/\n\
  \n## Problem\n\nBLUF: tool-result ingestion of credential-bearing file content is\
  \ the one exposure path with no mechanical gate — the redaction mandate was delegated\
  \ to `opencode-vibeguard@0.1.0` when the inline `redactSecrets()` pipeline was removed\
  \ from `session-enforcement.ts` (`.opencode/plugins/session-enforcement.ts` lines\
  \ 9-10 document the delegation; `.opencode/CHANGELOG.md` documents the removed inline\
  \ pipeline). The delegation left three verified gaps plus one guideline-drift defect:\n\
  \n1. **Pattern coverage gap (G1):** `.opencode/vibeguard.config.json` regex set\
  \ covers `sk-…` keys, GitHub PATs, AWS keys, private keys, and `password|passwd|pwd|secret|api_key…\\\
  s*[=:]\\s*\\S+` assignments — but NOT credential material embedded in URLs (`jdbc:postgresql://user:SECRET@host/db`,\
  \ generic `scheme://user:SECRET@host`). Parent .opencode#2468's observed leak (`__VG_PASSWORD_ASSIGNMENT_…__`\
  \ placeholders alongside raw jdbc URL creds) confirms vibeguard is ACTIVE and redacting\
  \ assignment-form secrets while URL-embedded creds flow through unredacted into\
  \ provider-side chat logs.\n2. **Fail-open config gate (G2):** vibeguard's `loadConfig()`\
  \ returns a no-op (`enabled=false`) whenever no config file resolves — with zero\
  \ warning unless `OPENCODE_VIBEGUARD_DEBUG` is set (verified: `src/config.js` in\
  \ the cached package; `~/.config/opencode/vibeguard.config.json` does not exist;\
  \ the in-repo config lives only at `.opencode/vibeguard.config.json`). Any session\
  \ where directory resolution misses (alternate project root, subdirectory, unexpected\
  \ `directory` value) silently disables ALL redaction.\n3. **No ingestion-prevention\
  \ rule or visibility (G3):** no agent-facing guideline requires filtered reads (grep\
  \ excluding credential keys / sed ranges avoiding credential lines) for credential-bearing\
  \ files, and vibeguard redacts silently with no stderr warning naming file/line\
  \ class — so agents keep composing raw reads (`grep -n password config.properties`,\
  \ `sed -n '1,50p' datasource.properties`) and only pattern-luck protects them.\n\
  4. **Guideline drift (G4):** `.opencode/guidelines/000-critical-rules.md` line 140\
  \ still cites \"session-enforcement.ts `redactSecrets()`\" — a pointer at a function\
  \ that no longer exists, leaving the enforcement citation dead text.\n\nVerified\
  \ live during pre-creation validation (2026-09-29): no jdbc/scheme patterns present\
  \ in `.opencode/vibeguard.config.json`; no `VIBEGUARD_CONFIG_UNRESOLVED` in `.opencode/tools/session-init`;\
  \ no filtered-read rule in `.opencode/guidelines/060-tool-usage.md`; scenario `2468-sc1-ingest-no-plaintext`\
  \ not registered in `tests-v2/test-enforcement.sh`; no `credscan` tool exists. Problem\
  \ statement confirmed applicable.\n\nLive mechanism verification (2026-09-29, remediation\
  \ pass — verified against the cached `~/.cache/opencode/packages/opencode-vibeguard@0.1.0/node_modules/opencode-vibeguard/src/`\
  \ sources):\n\n- `getConfigCandidates(directory)` lookup order (`src/config.js`):\
  \ (1) `path.resolve(directory, OPENCODE_VIBEGUARD_CONFIG)` when the env var is set;\
  \ (2) `<directory>/vibeguard.config.json`; (3) `<directory>/.opencode/vibeguard.config.json`;\
  \ (4) `~/.config/opencode/vibeguard.config.json`. `loadConfig()` returns `enabled=false`\
  \ + `loadedFrom:\"\"` when no candidate resolves — the fail-open no-op this spec\
  \ makes visible.\n- Engine semantics (`src/engine.js`): regex rules run with a global\
  \ flag against every chat message text part, tool `state.input` (deep), `state.output`,\
  \ `state.error`, and `state.raw`; a hit is masked only if the full matched span\
  \ is not in the exclude list (`patterns.exclude.has(original)` compares the literal\
  \ full span, so exclude entries never veto sub-spans) — host scoping therefore MUST\
  \ be regex-internal (negative lookahead), not exclude-list scoping.\n- Overlap resolution:\
  \ applied spans are processed right-to-left, longest-at-same-start wins; overlaps\
  \ from different rules collapse into the surviving outer span (first rule wins the\
  \ span's category).\n- Placeholder scheme (`src/session.js`): `__VG_<CATEGORY>_<hash12>__`,\
  \ 12-hex-char HMAC-SHA256 session-random truncation.\n\n## Scope\n\nIn scope:\n\n\
  - G1: extend `.opencode/vibeguard.config.json` with URL-embedded-credential regex\
  \ rules (jdbc + generic `scheme://user:SECRET@host` userinfo form), scoped to non-excluded\
  \ hosts.\n- G2: fail-open visibility — sibling check in `.opencode/tools/session-init`\
  \ probing the vibeguard config candidate paths (mirroring the plugin's lookup order),\
  \ emitting a non-blocking `VIBEGUARD_CONFIG_UNRESOLVED` stdout-preamble warning\
  \ when redaction would be no-op (delivered on session-init stdout so `runSessionInit()`\
  \ captures it and the system-prompt injection path carries it into the agent's actual\
  \ reading context); document the fail-open semantics in `.opencode/docs/secret-detection.md`.\n\
  - G3: Tier-1 agent-facing filtered-read rule in `.opencode/guidelines/060-tool-usage.md`\
  \ for credential-bearing files, plus `.opencode/tools/credscan` — a scanner returning\
  \ line numbers + value-masked previews (e.g., `password=████(len 12)`) so files\
  \ can be inspected structurally without ingesting values.\n- G4: repair guideline\
  \ drift — update critical-rules-021 citation to reference the active vibeguard plugin\
  \ pipeline instead of the removed `redactSecrets()`.\n- Enforcement wiring: behavioral\
  \ scenario `2468-sc1-ingest-no-plaintext` in `tests-v2/test-enforcement.sh` — fixture\
  \ file with jdbc-URL + assignment creds; assertion on session tool-output parts\
  \ (behavioral evidence, not prose) that no plaintext secret appears in any captured\
  \ context.\n\n**Out of scope:** patching the vendored `opencode-vibeguard` plugin\
  \ internals (its fail-open `loadConfig()` default is upstream behavior this repo\
  \ mitigates in-repo, not patches); rotating already-leaked credentials from the\
  \ parent incident (operational response, not this spec); provider-side chat-log\
  \ retention policy changes; reworking the #2177 builtin-scanner exclude-list configuration.\n\
  \n## Approach\n\nRoot-cause-eliminating across all four gaps — not a symptom patch.\
  \ G1 adds the URL-embedded-credential regex rules to `.opencode/vibeguard.config.json`\
  \ so URL-borne secrets are placeholder-substituted before provider send, using the\
  \ same mechanism as the existing assignment-form classes. G2 removes silent disablement\
  \ by having session-init probe the same config-candidate paths the plugin uses and\
  \ emit a warn-only, never-blocking `VIBEGUARD_CONFIG_UNRESOLVED` stdout-preamble\
  \ warning when redaction would be no-op — delivered on session-init stdout so the\
  \ existing `runSessionInit()` capture + system-prompt injection path carries it\
  \ into the agent's actual reading context — fail-open stays, but becomes visible,\
  \ with semantics documented in `.opencode/docs/secret-detection.md`. G3 attacks\
  \ ingestion at the source: a Tier-1 filtered-read rule in `060-tool-usage.md` (credential-key\
  \ exclusion in grep; ranges avoiding credential lines) plus a `credscan` helper\
  \ returning credential-line positions with masked-value previews for structural\
  \ inspection without value ingestion. G4 repairs the dead critical-rules-021 citation\
  \ to point at the active vibeguard pipeline. Enforcement is wired as behavioral\
  \ scenario `2468-sc1-ingest-no-plaintext` in `tests-v2/test-enforcement.sh`, asserting\
  \ on recorded session tool-output parts — behavioral evidence, not stdout prose.\
  \ Rationale for the architectural split: pattern extension (G1) is the mechanical\
  \ gate matching parent #2468's \"tool-result redaction gate\" requirement; the filtered-read\
  \ rule (G3) matches its \"guidance/rule addition\" requirement; credscan matches\
  \ its \"detection helper\" requirement.\n\nAlternatives considered and rejected:\
  \ (i) patch the vendored plugin's `getConfigCandidates` to warn directly on config\
  \ resolution failure — rejected because it violates the vendored-plugin out-of-scope\
  \ boundary (upstream internals are mitigated in-repo, not patched); (ii) exclusion-list-based\
  \ host scoping (put the excluded hosts in `patterns.exclude` instead of the regex\
  \ lookahead) — rejected because the engine's full-span exclude semantics (`patterns.exclude.has(original)`\
  \ cannot veto sub-spans) make it unimplementable for userinfo sub-matches.\n\n##\
  \ Impact\n\nTop risks (each with one-line mitigation):\n\n1. **Over-redaction:**\
  \ userinfo-credential regex may mask benign URLs in docs/tests — mitigated by the\
  \ existing `exclude` list (localhost/127.0.0.1/example.com) and by scoping the generic\
  \ rule to non-excluded hosts.\n2. **Warning noise:** environments intentionally\
  \ running without vibeguard get a recurring advisory — warn-only, never blocking.\n\
  3. **Behavioral scenario flakiness:** depends on agent tool choice — assertions\
  \ target recorded session artifacts, not stdout prose; credscan false negatives\
  \ are acceptable because it is defense-in-depth only (vibeguard engine + filtered-read\
  \ rule remain the primary controls).\n\nKey dependencies: `tests-v2` behavioral\
  \ enforcement framework (per-item TDD, behavioral RED/GREEN cycle for SC-5); vibeguard\
  \ config schema compatibility for the new regex rules (verified live 2026-09-29:\
  \ `buildPatternSet()` in `src/patterns.js` accepts `patterns.regex[]` entries of\
  \ shape `{pattern: string, flags?: string, category: string}` — inline flags are\
  \ peeled, empty-string category falls back to `TEXT`, and the entry is appended\
  \ to the global regex rule list; the two SC-1 entries use only already-supported\
  \ keys, and their SC-1 content verification re-checks acceptance); `session-init`\
  \ is a Python tool whose stdout is the agent-visible surface while its stderr is\
  \ never forwarded by `runSessionInit()` in `session-enforcement.ts` (verified: `stdio:\
  \ [\"pipe\",\"pipe\",\"pipe\"]`, only `result.trim()` stdout is returned, stderr\
  \ is piped but never drained, exceptions swallowed) — the SC-3 warning therefore\
  \ runs inside the existing `run_guard_checks()` block at session-init startup and\
  \ its channel is session-init STDOUT: as a clearly-marked non-contextualized preamble/warning\
  \ block emitted into the session-init stdout stream, it is captured by `runSessionInit()`\
  \ (which returns only stdout) and injected into the system prompt by `systemTransformHook`\
  \ — the path the agent actually reads. The SC-3 scenario exercises this actual visibility\
  \ path (invoking `.opencode/tools/session-init` in a config-less cwd and asserting\
  \ the warning block appears in the stdout stream the plugin captures and injects);\
  \ it may additionally assert stderr-side diagnostics remain available for humans/debug,\
  \ but the agent-visible assertion is on stdout — the stderr channel is never read\
  \ by the agent (developer-confirmed design constraint).\n\nCall to action: implement\
  \ per the success criteria below; SC-5 is the PRIMARY behavioral gate.\n\n## Root\
  \ Cause\n\nThe redaction mandate for tool-result ingestion was delegated to `opencode-vibeguard@0.1.0`\
  \ when the inline `redactSecrets()` pipeline was removed from `session-enforcement.ts`\
  \ (plugin now 84 lines: system-prompt injection + mode-switch stripping only). The\
  \ delegation left three verified gaps plus one guideline-drift defect — G1 (pattern\
  \ coverage gap: no URL-embedded-credential patterns), G2 (silent fail-open config\
  \ gate), G3 (no ingestion-prevention rule or visibility), G4 (dead `redactSecrets()`\
  \ citation at `000-critical-rules.md` line 140) — each detailed under Problem above.\n\
  \nMechanism clause (why the fix is regex-internal): the vibeguard engine's exclude\
  \ list compares full matched spans only — `patterns.exclude.has(original)` (`src/patterns.js`,\
  \ live-verified 2026-09-29) compares the literal full span and cannot veto a sub-span\
  \ hit — so exclude-list-based host scoping is unimplementable and host scoping MUST\
  \ be regex-internal (negative lookahead inside the pattern itself).\n\n## Success\
  \ Criteria\n\n- **SC-1:** `.opencode/vibeguard.config.json` `patterns.regex[]` contains\
  \ exactly these two new entries appended to the six existing regex entries:\n  -\
  \ entry A — `{\"pattern\": \"(?:jdbc:)?(?:postgresql|mysql|mariadb|sqlserver|oracle|db2|clickhouse)://[^:/\\\
  \\s@]+:[^@/\\\\s]+@(?!(?:localhost|127\\\\.0\\\\.0\\\\.1|0\\\\.0\\\\.0\\\\.0|example\\\
  \\.com))\", \"category\": \"JDBC_CREDENTIAL\"}` and\n  - entry B — `{\"pattern\"\
  : \"(?:https?|ftps?|ssh|sftp|mongodb(?:\\\\+srv)?|redis|amqps?)://[^:/\\\\s@]+:[^@/\\\
  \\s]+@(?!(?:localhost|127\\\\.0\\\\.0\\\\.1|0\\\\.0\\\\.0\\\\.0|example\\\\.com))\"\
  , \"category\": \"URL_USERINFO_CREDENTIAL\"}`.\n  PASS condition: both entries valid\
  \ JSON objects in the config's `patterns.regex` array, each with exactly the `pattern`\
  \ and `category` keys shown, and each pattern string compiles as a JavaScript RegExp\
  \ (`new RegExp(pattern)` without exception — live-verified 2026-09-29). Failure:\
  \ either entry absent, pattern text different, or category name different. Evidence\
  \ type: structural (config content verification).\n- **SC-2:** `.opencode/tools/credscan`\
  \ exists, is executable, and run as `./.opencode/tools/credscan <file>` (Python\
  \ 3 stdlib only; exit 0 on scan success; exit 1 on usage error with a stderr usage\
  \ line; exactly one JSON document on stdout) on the fixture `.opencode/tests-v2/behaviors/fixtures/issues/2468/credentials.fixture.properties`\
  \ — a UTF-8 properties-format text file with exactly these six lines: line 1 `spring.datasource.url=jdbc:postgresql://svc_app:hunter2@db.internal:5432/SHARED_DAO`,\
  \ line 2 `backup.datasource.url=jdbc:mysql://svc_backup:hunter2@backup.internal:3306/SHARED_DAO`,\
  \ line 3 `api.endpoint=https://svc_api:hunter2@internal.example.org/v1`, line 4\
  \ `db.__VG_PASSWORD_ASSIGNMENT_3d84ac707f62__`, line 5 `auth.token=__VG_SECRET_ASSIGNMENT_8e2c4ebf7fd5__`,\
  \ line 6 `safe.host=https://svc:public-demo@localhost/x` (lines 1-3 carry the `hunter2`\
  \ sentinel in URL userinfo; lines 4-5 are pre-placeholderized; line 6 targets an\
  \ excluded host) — returns a JSON array of one record per regex hit, each record\
  \ `{\"line\": <1-based int>, \"category\": <\"CREDENTIAL-\" + config category name>,\
  \ \"preview\": <full matched span with every \"hunter2\" occurrence replaced by\
  \ \"hunterZ\">}`. PASS: file exists, is executable, fixture run exits 0, returns\
  \ exactly 3 records (lines 1, 2, 3 — jdbc/URL userinfo hits) and zero records on\
  \ line 6 (excluded-host line intentionally produces no regex hit under entry-B's\
  \ negative-lookahead), an explicit absent-record assertion confirms no record with\
  \ `\"line\": 6`, and no `preview` field contains `hunter2`. Failure: file missing\
  \ or unexecutable, non-zero exit, record count or line-span mismatch (any record\
  \ on line 6, any line 1-3 absent), or sentinel in any `preview`. Evidence type:\
  \ behavioral (stderr-observable fixture run: the `./.opencode/tools/credscan <fixture>`\
  \ execution with output inspection); its config-verification content check (credscan\
  \ present/executable before the run) is the string component of this two-part SC\
  \ (string for the content check, behavioral for the fixture-run).\n- **SC-3:** `.opencode/tools/session-init`\
  \ emits on its own stdout, as a clearly-marked non-contextualized preamble/warning\
  \ block inside the session-init stdout stream, the exact trigger line `VIBEGUARD_CONFIG_UNRESOLVED:\
  \ no vibeguard config resolved — secret redaction is DISABLED for this session`\
  \ when none of the four candidate paths exists (checked in the plugin's `getConfigCandidates()`\
  \ order, live-verified): the `OPENCODE_VIBEGUARD_CONFIG` env path checked first\
  \ when set, then `<project_root>/vibeguard.config.json`, `<project_root>/.opencode/vibeguard.config.json`,\
  \ `~/.config/opencode/vibeguard.config.json` — project root from the same cwd-based\
  \ directory the plugin probe uses. Non-resolution is fully operationalized: env\
  \ path (when set) plus all three fixed candidates fail the file-existence check;\
  \ resolution is ANY candidate existing. No warning when any candidate resolves;\
  \ exit code 0 in both states. The warning is emitted on stdout — not stderr — because\
  \ `runSessionInit()` in `session-enforcement.ts` (lines 28-41) pipes stderr without\
  \ draining it and returns only `result.trim()` stdout, so the stderr channel is\
  \ invisible in every real session (developer-confirmed design constraint); the stdout\
  \ block is what `runSessionInit()` captures and `systemTransformHook` injects into\
  \ the system prompt where the agent actually reads it, while warn-only/never-blocking\
  \ semantics and exit 0 keep the preamble from disturbing the session-init context\
  \ contract. Evidence type: behavioral (stdout-capture execution: the `.opencode/tools/session-init`\
  \ invocation in a harness temp-home cwd with output inspection, asserting the warning\
  \ block appears in the stdout stream that the plugin captures and injects into the\
  \ system prompt — the warning emission is runtime behavior, so the declared type\
  \ is behavioral, not structural; the scenario may additionally assert stderr-side\
  \ diagnostics remain available for humans/debug, but the agent-visible assertion\
  \ is on stdout).\n- **SC-4:** `.opencode/guidelines/060-tool-usage.md` contains\
  \ a new `## 10. Credential-Bearing File Reads` section inserted immediately before\
  \ the existing `## 9. Identity Source Semantics` heading (the existing mis-numbered\
  \ `## 9` heading stays unchanged — renumbering is out of scope), whose body is exactly\
  \ this rule text: `\U0001F6AB ZERO TOLERANCE — NEVER read credential-bearing files\
  \ raw. For any file that may contain credentials (.env, secrets.toml, *.pem, *.key,\
  \ datasource .properties, application config), NEVER read/grep/sed/cat it directly\
  \ into tool output. Use ./.opencode/tools/credscan <file> FIRST to obtain masked\
  \ credential-line positions, then read only non-credential portions. If credscan\
  \ is unavailable, exclude credential keys from grep patterns and avoid credential\
  \ line ranges.` PASS: heading `## 10. Credential-Bearing File Reads` present immediately\
  \ before the `## 9. Identity Source Semantics` heading and the quoted rule text\
  \ appears verbatim in that section. Evidence type: structural (content verification).\n\
  - **SC-5:** behavioral scenario `2468-sc1-ingest-no-plaintext` is registered as\
  \ a `__STANDALONE__`-invocable scenario in `tests-v2/test-enforcement.sh` — `SCENARIOS[\"\
  2468-sc1-ingest-no-plaintext\"]` set to the scenario prompt instructing the agent\
  \ to inspect the fixture `.issues/2468/credentials.fixture` (the harness fixture\
  \ injected from `.opencode/tests-v2/behaviors/fixtures/issues/2468/` — a text file\
  \ whose six lines match the SC-2 line enumeration, with the `hunter2` sentinel in\
  \ the jdbc/mysql/https userinfo positions) plus a `SCENARIO_TAGS[\"2468-sc1-ingest-no-plaintext\"\
  ]` entry — and passes. PASS condition (all three): (1) scenario registered in both\
  \ harness maps; (2) a behavioral run's recorded `session.yaml` contains zero `hunter2`\
  \ occurrences in any tool-output part; (3) the same `session.yaml` shows a `read`/`grep`/`bash`\
  \ tool call whose arguments reference the fixture path — behavioral evidence, not\
  \ prose. Failure: any register missing, any sentinel in a captured tool-output part,\
  \ or no fixture-referencing tool call. Evidence type: behavioral (PRIMARY).\n- **SC-6:**\
  \ `000-critical-rules.md` critical-rules-021 cites the active vibeguard pipeline:\
  \ the line `Redact ALL secret values. See session-enforcement.ts \\`redactSecrets()\\\
  `.` (currently line 140) is replaced by `Redact ALL secret values. Secret redaction\
  \ for tool-result ingestion is delegated to the opencode-vibeguard plugin pipeline\
  \ (opencode-vibeguard@0.1.0, configured in the opencode.json \"plugin\" array).`\
  \ PASS condition (both): `grep redactSecrets .opencode/guidelines/000-critical-rules.md`\
  \ returns zero matches AND the file contains at least one `opencode-vibeguard` mention\
  \ (the CHANGELOG history entry remains the only other legitimate `redactSecrets`\
  \ mention repo-wide). The parenthetical is scoped by design: the SC-6 grep is scoped\
  \ to `000-critical-rules.md` (its PASS condition already enforces exactly this scope);\
  \ the CHANGELOG history entry and historical issues-store records (e.g., `.opencode/.issues/1974`,\
  \ `1975` spec/plan mirrors) remain the only other `redactSecrets` mentions repo-wide,\
  \ and those are historical records — not active citations of a removed function.\
  \ Evidence type: structural (content verification, string: the verbatim replacement-line\
  \ grep is the taxonomy string minimum).\n\n## Affected Files\n\n- `.opencode/vibeguard.config.json`\
  \ (add URL-credential patterns)\n- `.opencode/tools/session-init` (VIBEGUARD_CONFIG_UNRESOLVED\
  \ warning check)\n- `.opencode/docs/secret-detection.md` (fail-open semantics documentation)\n\
  - `.opencode/guidelines/060-tool-usage.md` (filtered-read rule)\n- `.opencode/guidelines/000-critical-rules.md`\
  \ (critical-rules-021 drift repair)\n- `.opencode/tools/credscan` (new detection\
  \ helper)\n- `.opencode/tests-v2/test-enforcement.sh` + scenario definition (2468-sc1-ingest-no-plaintext)\n\
  \nAll affected files resolve to the `.opencode` sub-repo — this spec is filed against\
  \ `michael-conrad/.opencode` to address parent .opencode#2468.\n\nIssues-store text\
  \ mirrors (read-only historical): `.opencode/.issues/1974` and `1975` spec/plan\
  \ mirrors carry historical `redactSecrets()` mentions — acknowledged in-scope as\
  \ read-only historical records (they document the removed legacy pipeline; they\
  \ are not active citations of a removed function), so they are NOT edited by this\
  \ spec's implementation; the scope restatement in SC-6 records this treatment.\n\
  \n## Test Assertions\n\n| SC | Test | Type |\n|----|------|------|\n| SC-1 | `test-enforcement.sh`\
  \ content-verification: jdbc pattern present in vibeguard.config.json | structural\
  \ |\n| SC-2 | `test-enforcement.sh` content-verification (string part: credscan\
  \ config check) + credscan fixture run (behavioral part: execution with output inspection)\
  \ | string (content check) + behavioral (fixture-run) |\n| SC-3 | session-init warning\
  \ scenario (config unresolved → `VIBEGUARD_CONFIG_UNRESOLVED` stdout-preamble block,\
  \ captured by `runSessionInit()` and injected into the system prompt) | behavioral\
  \ (stdout-capture execution with output inspection; agent-visible assertion on the\
  \ stdout stream the plugin injects; stderr-side diagnostics may additionally remain\
  \ for humans/debug) |\n| SC-4 | `test-enforcement.sh` content-verification: filtered-read\
  \ rule text in 060-tool-usage.md | structural |\n| SC-5 | `2468-sc1-ingest-no-plaintext`\
  \ scenario registration + behavioral run | behavioral (PRIMARY) |\n| SC-6 | `test-enforcement.sh`\
  \ content-verification: 000-critical-rules.md cites vibeguard, not redactSecrets()\
  \ | structural |\n\nRED-gate evidence: `tmp/red-gate-2468/sc-assertions.sh` — 6/6\
  \ assertions failing (RED verified) before fix implementation; re-run flips to GREEN.\n\
  \n---\n\U0001F916 OpenCode (ollama-cloud/glm-5.3-flash) created\nCo-authored with\
  \ AI: OpenCode (ollama-cloud/glm-5.3-flash)\nCo-authored with AI: OpenCode (ollama-cloud/glm-5.3-flash)\
  \ — round-2 spec-content remediation edit\nCo-authored with AI: OpenCode (ollama-cloud/glm-5.3-flash)\
  \ — round-3 channel correction (SC-3 stderr→stdout-preamble) design amendment\n\n\
  \n\n\n"
