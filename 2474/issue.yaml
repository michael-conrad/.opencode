title: '[SPEC-FIX] Fix: Credential redaction gap — URL-embedded creds bypass vibeguard;
  silent fail-open config; no filtered-read rule'
status: open
labels:
- needs-approval
- spec
body: '> Full spec and plan artifacts: https://github.com/michael-conrad/.opencode/tree/issues-data/2474/


  ## Problem


  BLUF: tool-result ingestion of credential-bearing file content is the one exposure
  path with no mechanical gate — the redaction mandate was delegated to `opencode-vibeguard@0.1.0`
  when the inline `redactSecrets()` pipeline was removed from `session-enforcement.ts`
  (`.opencode/plugins/session-enforcement.ts` lines 9-10 document the delegation;
  `.opencode/CHANGELOG.md` documents the removed inline pipeline). The delegation
  left three verified gaps plus one guideline-drift defect:


  1. **Pattern coverage gap (G1):** `.opencode/vibeguard.config.json` regex set covers
  `sk-…` keys, GitHub PATs, AWS keys, private keys, and `password|passwd|pwd|secret|api_key…\s*[=:]\s*\S+`
  assignments — but NOT credential material embedded in URLs (`jdbc:postgresql://user:SECRET@host/db`,
  generic `scheme://user:SECRET@host`). Parent .opencode#2468''s observed leak (`__VG_PASSWORD_ASSIGNMENT_…__`
  placeholders alongside raw jdbc URL creds) confirms vibeguard is ACTIVE and redacting
  assignment-form secrets while URL-embedded creds flow through unredacted into provider-side
  chat logs.

  2. **Fail-open config gate (G2):** vibeguard''s `loadConfig()` returns a no-op (`enabled=false`)
  whenever no config file resolves — with zero warning unless `OPENCODE_VIBEGUARD_DEBUG`
  is set (verified: `src/config.js` in the cached package; `~/.config/opencode/vibeguard.config.json`
  does not exist; the in-repo config lives only at `.opencode/vibeguard.config.json`).
  Any session where directory resolution misses (alternate project root, subdirectory,
  unexpected `directory` value) silently disables ALL redaction.

  3. **No ingestion-prevention rule or visibility (G3):** no agent-facing guideline
  requires filtered reads (grep excluding credential keys / sed ranges avoiding credential
  lines) for credential-bearing files, and vibeguard redacts silently with no stderr
  warning naming file/line class — so agents keep composing raw reads (`grep -n password
  config.properties`, `sed -n ''1,50p'' datasource.properties`) and only pattern-luck
  protects them.

  4. **Guideline drift (G4):** `.opencode/guidelines/000-critical-rules.md` line 140
  still cites "session-enforcement.ts `redactSecrets()`" — a pointer at a function
  that no longer exists, leaving the enforcement citation dead text.


  Verified live during pre-creation validation (2026-09-29): no jdbc/scheme patterns
  present in `.opencode/vibeguard.config.json`; no `VIBEGUARD_CONFIG_UNRESOLVED` in
  `.opencode/tools/session-init`; no filtered-read rule in `.opencode/guidelines/060-tool-usage.md`;
  scenario `2468-sc1-ingest-no-plaintext` not registered in `tests-v2/test-enforcement.sh`;
  no `credscan` tool exists. Problem statement confirmed applicable.


  ## Scope


  In scope:


  - G1: extend `.opencode/vibeguard.config.json` with URL-embedded-credential regex
  rules (jdbc + generic `scheme://user:SECRET@host` userinfo form), scoped to non-excluded
  hosts.

  - G2: fail-open visibility — sibling check in `.opencode/tools/session-init` probing
  the vibeguard config candidate paths (mirroring the plugin''s lookup order), emitting
  a non-blocking `VIBEGUARD_CONFIG_UNRESOLVED` stderr warning when redaction would
  be no-op; document the fail-open semantics in `.opencode/docs/secret-detection.md`.

  - G3: Tier-1 agent-facing filtered-read rule in `.opencode/guidelines/060-tool-usage.md`
  for credential-bearing files, plus `.opencode/tools/credscan` — a scanner returning
  line numbers + value-masked previews (e.g., `password=████(len 12)`) so files can
  be inspected structurally without ingesting values.

  - G4: repair guideline drift — update critical-rules-021 citation to reference the
  active vibeguard plugin pipeline instead of the removed `redactSecrets()`.

  - Enforcement wiring: behavioral scenario `2468-sc1-ingest-no-plaintext` in `tests-v2/test-enforcement.sh`
  — fixture file with jdbc-URL + assignment creds; assertion on session tool-output
  parts (behavioral evidence, not prose) that no plaintext secret appears in any captured
  context.


  **Out of scope:** patching the vendored `opencode-vibeguard` plugin internals (its
  fail-open `loadConfig()` default is upstream behavior this repo mitigates in-repo,
  not patches); rotating already-leaked credentials from the parent incident (operational
  response, not this spec); provider-side chat-log retention policy changes; reworking
  the #2177 builtin-scanner exclude-list configuration.


  ## Approach


  Root-cause-eliminating across all four gaps — not a symptom patch. G1 adds the URL-embedded-credential
  regex rules to `.opencode/vibeguard.config.json` so URL-borne secrets are placeholder-substituted
  before provider send, using the same mechanism as the existing assignment-form classes.
  G2 removes silent disablement by having session-init probe the same config-candidate
  paths the plugin uses and emit a warn-only, never-blocking `VIBEGUARD_CONFIG_UNRESOLVED`
  stderr warning when redaction would be no-op — fail-open stays, but becomes visible,
  with semantics documented in `.opencode/docs/secret-detection.md`. G3 attacks ingestion
  at the source: a Tier-1 filtered-read rule in `060-tool-usage.md` (credential-key
  exclusion in grep; ranges avoiding credential lines) plus a `credscan` helper returning
  credential-line positions with masked-value previews for structural inspection without
  value ingestion. G4 repairs the dead critical-rules-021 citation to point at the
  active vibeguard pipeline. Enforcement is wired as behavioral scenario `2468-sc1-ingest-no-plaintext`
  in `tests-v2/test-enforcement.sh`, asserting on recorded session tool-output parts
  — behavioral evidence, not stdout prose. Rationale for the architectural split:
  pattern extension (G1) is the mechanical gate matching parent #2468''s "tool-result
  redaction gate" requirement; the filtered-read rule (G3) matches its "guidance/rule
  addition" requirement; credscan matches its "detection helper" requirement.


  ## Impact


  Top risks (each with one-line mitigation):


  1. **Over-redaction:** userinfo-credential regex may mask benign URLs in docs/tests
  — mitigated by the existing `exclude` list (localhost/127.0.0.1/example.com) and
  by scoping the generic rule to non-excluded hosts.

  2. **Warning noise:** environments intentionally running without vibeguard get a
  recurring advisory — warn-only, never blocking.

  3. **Behavioral scenario flakiness:** depends on agent tool choice — assertions
  target recorded session artifacts, not stdout prose; credscan false negatives are
  acceptable because it is defense-in-depth only (vibeguard engine + filtered-read
  rule remain the primary controls).


  Key dependencies: `tests-v2` behavioral enforcement framework (per-item TDD, behavioral
  RED/GREEN cycle for SC-5); vibeguard config schema compatibility for the new regex
  rules.


  Call to action: implement per the success criteria below; SC-5 is the PRIMARY behavioral
  gate.


  ## Root Cause


  The redaction mandate for tool-result ingestion was delegated to `opencode-vibeguard@0.1.0`
  when the inline `redactSecrets()` pipeline was removed from `session-enforcement.ts`
  (plugin now 84 lines: system-prompt injection + mode-switch stripping only). The
  delegation left three verified gaps plus one guideline-drift defect — G1 (pattern
  coverage gap: no URL-embedded-credential patterns), G2 (silent fail-open config
  gate), G3 (no ingestion-prevention rule or visibility), G4 (dead `redactSecrets()`
  citation at `000-critical-rules.md` line 140) — each detailed under Problem above.


  ## Success Criteria


  - **SC-1:** `.opencode/vibeguard.config.json` contains jdbc/URL-embedded-credential
  regex patterns (in addition to existing assignment-form classes). Evidence type:
  structural (config content verification).

  - **SC-2:** `.opencode/tools/credscan` exists, is executable, and returns a redacted
  preview (masked values, line numbers) on a fixture containing credential lines.
  Evidence type: structural + functional.

  - **SC-3:** session-init emits a `VIBEGUARD_CONFIG_UNRESOLVED` stderr warning when
  the vibeguard config does not resolve (fail-open state made visible). Evidence type:
  structural (stderr capture).

  - **SC-4:** an agent-facing filtered-read rule for credential-bearing files exists
  in `.opencode/guidelines/060-tool-usage.md`. Evidence type: structural (content
  verification).

  - **SC-5:** behavioral scenario `2468-sc1-ingest-no-plaintext` is registered in
  `tests-v2/test-enforcement.sh` and passes: agent instructed to inspect a credential
  fixture produces no plaintext secret in any session tool-output/context capture.
  Evidence type: behavioral (PRIMARY).

  - **SC-6:** `000-critical-rules.md` critical-rules-021 cites the active vibeguard
  pipeline (no stale `redactSecrets()` reference). Evidence type: structural (content
  verification).


  ## Affected Files


  - `.opencode/vibeguard.config.json` (add URL-credential patterns)

  - `.opencode/tools/session-init` (VIBEGUARD_CONFIG_UNRESOLVED warning check)

  - `.opencode/docs/secret-detection.md` (fail-open semantics documentation)

  - `.opencode/guidelines/060-tool-usage.md` (filtered-read rule)

  - `.opencode/guidelines/000-critical-rules.md` (critical-rules-021 drift repair)

  - `.opencode/tools/credscan` (new detection helper)

  - `.opencode/tests-v2/test-enforcement.sh` + scenario definition (2468-sc1-ingest-no-plaintext)


  All affected files resolve to the `.opencode` sub-repo — this spec is filed against
  `michael-conrad/.opencode` to address parent .opencode#2468.


  ## Test Assertions


  | SC | Test | Type |

  |----|------|------|

  | SC-1 | `test-enforcement.sh` content-verification: jdbc pattern present in vibeguard.config.json
  | structural |

  | SC-2 | `test-enforcement.sh` content-verification + credscan fixture run | structural+functional
  |

  | SC-3 | session-init warning scenario (config unresolved → VIBEGUARD_CONFIG_UNRESOLVED
  on stderr) | structural |

  | SC-4 | `test-enforcement.sh` content-verification: filtered-read rule text in
  060-tool-usage.md | structural |

  | SC-5 | `2468-sc1-ingest-no-plaintext` scenario registration + behavioral run |
  behavioral (PRIMARY) |

  | SC-6 | `test-enforcement.sh` content-verification: 000-critical-rules.md cites
  vibeguard, not redactSecrets() | structural |


  RED-gate evidence: `tmp/red-gate-2468/sc-assertions.sh` — 6/6 assertions failing
  (RED verified) before fix implementation; re-run flips to GREEN.


  ---

  🤖 OpenCode (ollama-cloud/glm-5.3-flash) created


