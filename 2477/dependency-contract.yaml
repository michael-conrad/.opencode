    type: bool
    nullable: false
  counter_validation_documented:
    type: bool
    nullable: false
  legacy_references_removed:
    type: bool
    nullable: false
  completeness_gate_enumerates_actual_schema:
    type: bool
    nullable: false
preconditions:
