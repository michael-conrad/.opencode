# Dependency contract for issue 2477 (extracted from interface-compatibility.yaml)
contract_id: 2477-tool-schema-ground-truth
real_sources:
  - path: .opencode/tools/local-issues
    role: schema constants and counter semantics authority
    real_type: bash script constants (YAML_FILES tuple, MARKDOWN_FILES tuple, _next_number function)
real_targets:
  - path: .opencode/skills/issue-operations-sync/tasks/import-remote.md
    role: documented contract re-synced to source constants
    real_type: markdown task card (prose enumerations)
real_type_constraints:
