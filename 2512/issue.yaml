title: '[BUG] Store-path pre-commit gate misfires inside issue-store worktrees — all
  store commits with internal .issues/<N> references are uncommittable'
status: closed
labels:
- needs-approval
body: '## Problem

  The #2506 store-path gate (b416447f) blocks any staged file whose content matches
  `.issues/<digit>`. Its exclusion list covers paths under `.issues/`, but from INSIDE
  an issue-store worktree (e.g. .opencode/.issues/, gitdir .git/modules/.opencode/worktrees/-issues),
  git paths are bare (`1003/issue.yaml`) — the `*/.issues/*` exclusion can never match.


  ## Evidence (2026-10-05)

  - Store reconciliation commit was rejected: ''staged file 1003/issue.yaml references
  an issue-store path''. The file''s body legitimately contains ''Research card catalogue
  at .issues/1003/cards/''.

  - 71 of 1029 staged sweep files trip the gate; all references are internal store
  cross-references — exactly the content the gate''s own exclusion deems legitimate.

  - Every store commit since the gate landed required --no-verify.


  ## Fix shape

  Skip the store-path gate when the commit runs inside an issue-store worktree (detect
  via branch name issues-data or worktree gitdir), or key the exclusion on the worktree''s
  store root. The gate''s stated intent — ''tracked files OUTSIDE the issue store''
  — must be preserved for parent-repo files.'
