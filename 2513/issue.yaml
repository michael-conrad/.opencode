title: '[SPEC] Legacy-sweep process: age gate + semantic-over-nominal evaluation +
  spec.md body extraction'
status: open
labels:
- needs-approval
body: '## Problem

  The 2026-10-05 legacy mootness sweep exposed three process defects:


  1. **No age gate.** Tickets filed after the current architecture went live (#2502,
  #2500 — both 2026-10-05 post-rip regression reports) were swept as legacy and wrongly
  closed; both reopened. Rule: a sweep enumerates its denominator from a fixed cutoff
  (the architecture go-live commit), never from a live ''all open'' query.

  2. **Nominal matching instead of semantic evaluation.** First pass asked ''does
  an artifact with this name exist'' and kept 94 tickets whose proposed mechanisms
  are bound to retired architecture; the semantic second pass (concern vs mechanism)
  closed 33 of them. Rule: evaluation extracts the ticket''s underlying concern and
  proposed mechanism, and verdicts reason about the live architecture''s design, not
  name collisions.

  3. **Body-extraction blind spot.** Legacy records store content in a local spec.md,
  not the issue.yaml body. Sweep tooling reading only the body evaluated ~26 old-format
  tickets on title alone and mislabeled #2100 an ''empty husk''. Rule: extraction
  reads spec.md/remote.md siblings; an empty body is never evidence of an empty ticket.


  ## Evidence

  - #2502, #2500 reopened with correction comments; #2501 re-closed completed; #2089/#1195
  reopened after full-spec re-verification; #2100/#1190 re-closed with corrected evidence.

  - Board: 251 open -> 67 open, all closures carrying per-ticket evidence comments.'
