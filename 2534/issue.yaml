title: Deck-debt ledger — cross-deployment evidence base
status: open
labels:
- needs-approval
- governance
body: "Standing ledger per the skill-creator governance card: usage observations,\
  \ governance decisions, and retirement candidates are recorded here — the cross-deployment\
  \ evidence base for admission and retirement verdicts.\n\n## Entries\n\n### 2026-10-06\
  \ — Admission: `email-management` card set (.opencode#2532)\n\n- **What:** new governed\
  \ card set `.opencode/skills/email-management/` (SKILL.md + 3 references cards)\
  \ + one routing.md row.\n- **Gate evidence:** observed capability gap (developer\
  \ request, 2026-10-06; ecosystem research found zero email cards in `anthropics/skills`\
  \ and major awesome lists); consumers = agent sessions needing mail search/read/draft;\
  \ mechanism/trigger = routing row + platform description match; predicate classification\
  \ = install verification fact-decidable, send/move intent-decidable (no scripts);\
  \ domain match = tool live-validated read-only on the reference machine same day;\
  \ root-agnostic; displaces nothing (net-new).\n- **PR:** to be linked on PR creation\
  \ for #2532.\n\n\U0001F916 Co-authored with AI: OpenCode (huggingface/zai-org/GLM-5.3-Flash)\n\
  \n### 2026-10-07 — Admission: dispatch-scope containment floor section (.opencode#1011)\n\
  \n- **What:** new always-loaded floor section `Dispatched sub-agent scope` — ONE\
  \ consolidated rule (scope-bounded authorization extended to the dispatch boundary)\
  \ carrying the four predicates: prompt-bounded execution with referenced-artifact\
  \ import exclusion (enumeration governs); conflict-over-expansion (report + open-ended\
  \ direction request per the standing formula, never completion over unrequested\
  \ work); destructive-action gate (feature-branch deletion local/remote, issue closure,\
  \ force/history-changing git operations, comparable irreversible changes — only\
  \ on explicit dispatch-prompt naming). Plus `git-workflow-cleanup` amendment (deletion\
  \ and closure steps gate-bound, description updated).\n- **Gate evidence:** observed\
  \ failure (June 2026 viewport-editor incident, recorded in #1011); consumers = dispatched\
  \ sub-agents (receiving side); mechanism/trigger = always-injected floor text visible\
  \ before any card dispatch + cleanup-card gate; predicate classification = rules\
  \ bind the output of judgment (what may execute), not judgment itself — deck text\
  \ and executed session behavior are the fact-decidable verification surfaces; domain\
  \ match = n/a; root-agnostic (no repo names, no absolute paths in deck text); displaces\
  \ `git-workflow-cleanup`'s unconditional branch-deletion step and generalizes `implement`\
  \ §3's plan-item-anchored scope rule to the dispatch boundary.\n- **Floor-placement\
  \ justification:** a dispatched sub-agent's only guaranteed instruction surface\
  \ is the always-injected floor, and the proceed-or-halt decision (execute vs conflict-report)\
  \ depends on the rule being visible before any card dispatch — satisfies the always-loaded\
  \ surface criterion. Load accounting (developer-directed revision, 2026-10-07):\
  \ measured in always-on tokens and decision-surface complexity, not lines — one\
  \ consolidated rule (~220 tokens delta vs pre-change floor), class enumeration kept\
  \ as the canonical anchor in the floor with per-instance gates in the owning cards\
  \ (no class-list duplication); `implement` §3 generalization (collapsing scope governance\
  \ to two sites) recorded as follow-up ledger material. Old-deck caveat: the June\
  \ 2026 incident evidences the failure class's mechanism; the current-deck admission\
  \ rests on the spec's clean-room derivation (four requirement parts unmet, re-verified\
  \ by inspection) and the behavioral SCs' regression-guard role.\n- **Spec/plan:**\
  \ `.opencode/.issues/1011/spec.md` (admission-gate record), `.opencode/.issues/1011/plan.md`.\n\
  - **PR:** https://github.com/michael-conrad/.opencode/pull/2545\n\n\n### 2026-10-10\
  \ — Admission: submodule discipline rule set (.opencode#2563)\n\n- **What:** re-admission\
  \ of the pre-rip submodule-discipline rule set scoped into existing cards (no new\
  \ card, no floor/routing changes): trunk-tip freshness + real-work sequence + deinit\
  \ remediation in `git-workflow-branch`; PR-surface clauses + submodule-PR ordering\
  \ gate in `git-workflow-pr`; branch-level/review-surface amendment in `git-workflow-commit`\
  \ #5; non-recursive checkout mandate + agent-execution-boundary pointer in `ci-boundary`;\
  \ execution boundary in the implementation-workflow reference; ticket-state hygiene\
  \ in `issues`. Adapted RULE-D behavioral enforcement test restored under tests-v2,\
  \ adapted to the new placement.\n- **Evidence base:** #2431, #2555, #2467, #2306,\
  \ #2318, #2496, #2469, opencode-config#255, opencode-config#372, .opencode#2440/#2489;\
  \ deinit/restore incantation experiments (git 2.43.0 scaffolds, 2026-10-09/10).\n\
  - **Placement decisions:** card-scoped re-admission (fails no admission gate — affected\
  \ cards already routed at the failure moments); mid-work freshness gate NOT restored\
  \ (recorded unsatisfiable, #2440/#2489); no mechanical enforcement scripts (rules\
  \ are intent-decidable in operation); only execution-behavior RULE-D tests re-admitted\
  \ (HALT-framing tests verify the retired Tier model).\n- **Spec/plan:** `.opencode/.issues/2563/spec.md`,\
  \ `.opencode/.issues/2563/plan.md`.\n- **PR:** to be linked on PR creation for #2563.\n\
  \n\U0001F916 Co-authored with AI: OpenCode (huggingface/zai-org/GLM-5.3-Flash)\n\
  \n\n### 2026-10-11 — Retirement: vision-specialist agent card (.opencode#2567)\n\
  \n\n- **What:** retired the vision-specialist agent card; its analysis rubric relocated\n\
  \  to `skills/multimodal-dispatch/references/vision-critique.md` (caller-agnostic,\n\
  \  admission-gated same issue) with a native-first rule added to the\n  `multimodal-dispatch`\
  \ card. Resurrection path: git history.\n\n\n- **Gate evidence:** retirement per\
  \ the skill-creator card — developer usage\n  statement (\"never used more than\
  \ once or twice\") + structural obsolescence:\n  pinned `ollama-cloud/qwen3.5:397b-cloud`\
  \ absent from opencode's provider\n  catalog (backing model retired from the ollama\
  \ registry as of 2026-09-25),\n  and redundant against the session primary's native\
  \ vision capability.\n  Admission of the replacement reference recorded same issue.\n\
  \n\n- **Spec/plan:** `.opencode/.issues/2567/spec.md`, `.opencode/.issues/2567/plan.md`.\n\
  \n\n- **PR:** to be linked on PR creation for #2567.\n\n\n### 2026-10-11 — Correction:\
  \ no pattern-based process kills (.opencode#2567 session)\n\n\n- **What:** behavioral-testing\
  \ card rule 9 gains the no-pattern-kill rule — run\n  cleanup and aborts address\
  \ only PIDs the agent itself launched (recorded at\n  launch, re-verified by PID),\
  \ never a name-pattern match; observed failure:\n  an agent cleanup pass pattern-matched\
  \ `opencode` and killed the developer's\n  main opencode session mid-work (session\
  \ 2026-10-11, issue #2567 behavioral\n  verification).\n\n\n- **Gate evidence:**\
  \ observed failure is the incident itself; consumer = any\n  agent supervising/aborting\
  \ behavioral runs; mechanism = card rule in the\n  supervision section (intent-decidable\
  \ in operation — no script); displaces\n  nothing (tightens the existing abort mechanics).\n\
  \n\n- **PR:** to be linked on PR creation for #2567.\n\n### 2026-10-14 — Admission:\
  \ connector-card reload semantics (.opencode#2547)\n\n- **What:** the `gb-cli` and\
  \ `gh-cli` card descriptions gain an agent-addressed reload directive (\"one load\
  \ does not carry across operation classes — before the first contact in a new class\
  \ (issues ↔ PRs ↔ API passthrough), load this card again, even though it is already\
  \ in context\"), and both card bodies' \"Construct carefully\" rules gain a three-line\
  \ class-check checklist (last class contacted / class of the command about to run\
  \ / different class → reload first). No floor/routing change; card-scoped only.\n\
  - **Gate evidence:** observed failure — the 2026-10-07 deploy-session incident (recorded\
  \ in .opencode#2547): one card load treated as session-satisfying, then ungoverned\
  \ gb contacts across operation classes, blind GitHub-shaped API probes, and a label\
  \ wipe. Behavioral evidence (tests-v2, SC-4): the revision-1 description wording\
  \ alone did NOT change behavior (first GREEN run clean-room-evaluated VIOLATED —\
  \ one load spanning PR↔issue transitions); the revised wording + body class-check\
  \ DID (second GREEN run clean-room-evaluated SATISFIED — reload observed between\
  \ the PR-class contacts and the first issue-class contact). Reload mechanics verified\
  \ at the binary level: the skill tool re-injects the full card body on every load\
  \ (no dedupe, no marker).\n- **Predicate classification:** the class-transition\
  \ trigger is intent-decidable (agent judgment at dispatch time); the SCs are structural\
  \ (text facts) plus one behavioral SC.\n- **Spec/plan:** `.opencode/.issues/2547/spec.md`,\
  \ `.opencode/.issues/2547/plan.md`.\n- **PR:** to be linked on PR creation for #2547.\n\
  \n\U0001F916 Co-authored with AI: OpenCode (huggingface/zai-org/GLM-5.3-Flash)\n"
