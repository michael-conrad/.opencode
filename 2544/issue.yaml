title: '[SPEC] session-init: exclude wiki checkouts (origin *.wiki.git) from hook
  installation + inventory, with self-healing removal'
status: open
labels:
- needs-approval
body: '> **Full spec and artifacts: [`.opencode/.issues/2544/`](https://github.com/michael-conrad/.opencode/tree/issues-data/2544)**
  — this issue is a condensed exec summary; the authoritative spec lives in the `issues-data`
  branch.


  >


  > **Local artifacts:** `.opencode/.issues/2544/` — spec



  ## Why



  **Ruling (Michael Conrad, 2026-10-07):** *"session-init should only be doing registered
  submodules, not ignored sub-repos, it should be strictly on git submodule for listing
  the submodules correctly."* And the same session: *"git hooks are to never be applied
  to wiki repos."*



  session-init''s filesystem-scan discovery (`collect_repo_info()`: any immediate
  subdir with a `.git` entry + origin remote) found the ignored in-tree wiki checkout
  `hermes-admin/hermes-admin.wiki/` and `install_hooks()` installed trunk-protection
  `pre-commit`/`pre-push` into it — blocking every wiki publish. This is structurally
  unsatisfiable: GitHub/GitBucket wikis render only from the default branch and have
  no branch/PR mechanism; the wiki-operations card defines pre-push diff review +
  rule-based checks as the review substitute, by design. Evidence trail: hook files
  hash-identical to `.opencode/hooks/` sources, mtimes inherited from source (copy2),
  session-init inventory output policing the wiki, reflog clone→blocked-commit sequence.



  **Root cause (two defects):** (1) a path-shape heuristic where git''s registered-submodule
  mechanism (`.gitmodules` + `git submodule status`) is the authoritative answer to
  which child repos the workspace orchestrates — filesystem shape ≠ orchestration
  intent; ignored sub-repos (wikis, independent repos, worktrees) all match the heuristic.
  (2) Registration alone does not exclude wikis: the wiki-operations card''s provisioning
  reference documents inherited submodule wikis (existing `.gitmodules` entries wiring
  a wiki, operated in place), so a wiki-origin registered submodule would still be
  hooked and inventoried — reproducing this failure. The wiki rule is origin-based,
  not wiring-based: a final path segment ending in `.wiki` or `.wiki.git` = wiki repo,
  however it is wired.



  ## Final what



  1. **Strict discovery (coverage set)**: `collect_repo_info()` enumerates child repos
  exclusively via git''s registered-submodule mechanism — `.gitmodules` verified with
  `git submodule status`, applied over the registered tree (root''s registered submodules
  transitively). Covered only when today''s membership conditions also hold: checkout
  present (uninitialized skipped — today they produce no inventory line) and the checkout''s
  `remote.origin.url` exists and parses to owner/repo (absent or unparseable origins
  skipped, as today — no `.gitmodules` fallback exists). The `os.listdir` `.git`-entry
  scan is deleted from discovery. Stated intended extension: registered-tree submodules
  deeper than the old two-level scan reach become covered — the mechanism decides
  reach, not filesystem shape.


  2. **Wiki exclusion (origin-based, every level)**: hooks + inventory cover the root
  repo and every registered submodule with a checkout, excluding every child repo
  whose origin URL''s final path segment ends in `.wiki` or `.wiki.git` — at every
  level. Wiki repos are never hooked and never inventoried, whether wired as ignored
  sub-repos or registered submodules. Ignored sub-repos receive nothing, appear nowhere.


  3. **Cleanup enumeration (cleanup only)**: locating pollution uses a bounded filesystem
  enumeration mirroring the old scan''s traversal exactly: every immediate child dir
  with a `.git` entry — pollution-tested when it has a parseable origin remote (the
  only ones the old installer reached) and descended into regardless of origin — and
  every depth-2 dir with a `.git` entry and a parseable origin remote inside them
  (the old nested recursion required no origin on the container). Cleanup-only: installs
  nothing, inventories nothing. The old installer never reached anything else, so
  this bound is complete for cleanup.


  4. **Self-healing**: in the hooks dirs of enumerated repos outside the coverage
  set, pollution — a file whose name matches any hook name `.opencode/hooks/` has
  ever carried (the source set also included `post-commit`, `pre-merge-commit`, and
  `prepare-commit-msg` until 2026-10-04; the scan-era installer copied every file
  present) and whose content matches any blob hash ever recorded in the deck''s git
  history at that hook name''s source path (prior installs pin the source content
  at install time; both the name set and the content drift) — is removed and reported
  as a removal event in session-init''s output (the affected repos themselves still
  appear nowhere in inventory, per item 2). Classification is by the resolved hooks
  dir (`git rev-parse --git-path hooks`): cleanup never acts on a hooks dir resolving
  to a coverage-set repo''s — linked worktrees (`.issues/`, `.opencode/.issues/`)
  alias the root/submodule common hooks dir and dedupe out of cleanup scope exactly
  as they dedupe out of double-install today. Samples and files matching no historical
  source name-plus-version — foreign hooks — are untouched.


  5. **Regression invariant**: within the old scan''s reach (depth ≤ 2), the root
  repo, every non-wiki registered-tree submodule with a checkout and parseable origin
  URL, and the `.issues/` carve-outs behave exactly as today — same coverage, same
  inventory lines, same hooks. Behavior changes are confined to the stated classes:
  ignored/independent sub-repos and wiki-origin repos drop out of coverage and are
  self-healed; registered-tree submodules deeper than the old reach are newly covered
  (stated extension, item 1); registered submodules declared inside non-registered
  containers are no longer reached by coverage (the workspace orchestrates only its
  registered tree) and are handled by cleanup.



  🤖 OpenCode (ollama-cloud/glm-5.3-flash) — filed from hermes-admin session per developer
  directive

  '
