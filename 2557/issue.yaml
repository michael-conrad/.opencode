title: '[SPEC] Restore build/run verification practice and language/build-framework
  skill-card family'
status: open
labels:
- needs-approval
body: '> **Full spec and artifacts: [`.opencode/.issues/2557/`](https://github.com/michael-conrad/.opencode/tree/issues-data/.issues/2557)**
  — this issue is a condensed exec summary; the authoritative spec lives in the `issues-data`
  branch.


  **Why — a live regression with three facets, one root cause, plus measured telemetry.**
  The `#2490` deck re-rip retired the pre-rip corpus to `attic/` and cut the behavioral
  test suite. Three pieces of agent behavior retired with it, reported as live regressions:


  1. **Build-verification practice lost.** The agent no longer verifies build-affecting
  changes by shallow temp-copy checkout + canonical build run + final-outputs assertion
  (e.g. `./gradlew shadowJar`, `./gradlew build`) — impacting all build frameworks
  and languages. Provenance: spec `.opencode#365` → implementation `.opencode#2439`
  (release-promoter verification gate, behavioral SCs 1–6); the gate now exists only
  under `attic/`, and the live `implement` workflow demands only "an executed check."

  2. **shadowJar/SPI packaging knowledge absent** — INCLUDE semantics and `META-INF/services`
  preservation; never in the live deck, and the retired prompt''s canonical-command
  habit (ask + record in the project''s AGENTS.md) died with the re-rip.

  3. **Dependency-injection mandate missing** — the generic multi-language mandate
  and curated recommended-packages tier table (`#2243` → `#2249`) did not survive
  the re-rip; the live deck has zero DI content.


  **Telemetry.** A read-only analysis of the opencode session store (784 skill loads)
  measured the routing law: pipeline cards fire constantly, `programming-principles`
  has zero loads ever, and no domain-knowledge card ever dispatched in the three largest
  product repos — while the demand is real (a 1,087-session Python product, active
  Godot projects whose dominant verbs are run/export/scenes, `uv run` in hundreds
  of real requests).


  **Final what — the deck change.** A skill-card family under progressive disclosure,
  implemented as skill cards and skill detail cards only:


  - **New top-level cards:** `python` (umbrella for the Python-project ecosystem,
  absorbing `uv` and `pyproject` as detail cards), `java`, `gradle` (top-level — its
  intent space is not contained by Java work), `godot`.

  - **Extended card:** `programming-principles` — widened from design principles to
  the general engineering space, gaining two detail cards: the shared `dependency-injection`
  detail card (generic mandate + canonical recommended-packages tier table restored
  from `#2249` through a live currency pass; mandatory read via its body, covering
  cardless languages too) and `practices` (industry-standard expectations incl. semver
  discipline; expectation-not-operation, seamed against `version-manager`/`changelog-generator`).

  - **Detail cards:** `python/references/{uv,pyproject,conventions}.md`, `java/references/dependency-injection.md`
  (Spring/Dagger/Guice practice), `gradle/references/packaging-spi.md` (shadowJar
  INCLUDE, SPI preservation, fat-jar outputs verification), the two shared cards above.

  - **Dispatch edges (the measured fix):** `spec`, `plan`, and `implement` main bodies
  gain explicit call outs to load the language/tool cards for the languages in scope
  — language standards shape spec requirements and plan item structure, not just implementation
  — and `programming-principles` for the engineering layer.

  - **Updates:** `implement` workflow reference gains the build-verification row (shallow
  checkout, manifest-sourced canonical build, final-outputs assertion, triggered on
  build-affecting changes); `verify` evidence bar extended; `release-promoter` regains
  the verification gate and its restored detail card.


  Descriptions match agent intent semantically — activities and decision moments in
  the served intents'' vocabulary, never keyword/glob matching — with wide territories,
  crisp seams, and one claimant per intent territory. All admissions pass the skill-creator
  gate; behavioral SCs run through the `tests-v2` harness, with the session-store
  dispatch query as a second instrument (before/after load counts).


  🤖 Co-authored with AI: OpenCode (huggingface/zai-org/GLM-5.3-Flash)

  '
