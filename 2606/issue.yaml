title: '[SPEC] unify the review-audit loop: repeat-until-zero with semantic spin detection
  and diagnosis-driven escalation; retire the fixed one-re-review bound'
status: closed
labels:
- needs-approval
- spec
body: '> **Full spec and artifacts: [`.opencode/.issues/2606/`](https://github.com/michael-conrad/.opencode/tree/issues-data/2606)**
  — this issue is a condensed exec summary; the authoritative spec lives in the `issues-data`
  branch.

  >

  > **Local artifacts:** `.opencode/.issues/2606/` — spec


  ## Why


  The deck carries conflicting loop-termination rules for review/audit cycles, discovered
  2026-10-14 during the on-demand spec audit of `.opencode#2544` (the audit''s dispatch
  path loads both surfaces):


  - **`verify` card §4 + frontmatter description + routing.md''s verify entry:** *"Remediate
  → one re-review. Still failing → halt to the developer"* — description: *"no re-audit
  loops"*; routing: *"bounded loop"*.

  - **`validation-standards.md` Loop section (the #2575 item 2 restoration) + `spec`
  card §6:** *"The revise → re-validate cycle repeats until a verdict with zero findings"*
  — escalation fires *"only when the audit cannot reach a zero-finding verdict by
  revision."*


  Same artifact type (a spec under audit), two termination bars, neither text subordinates
  the other. The verify card is internally torn as well: §4 and the description deny
  a loop while §8''s criteria-invariance machinery speaks of *"every audit and re-audit"*
  feeding *"the loop''s revision step."* The plan-validation path carries the same
  unreconciled semantics one level down: the `plan` card §7 defers to `plan-validation-standards.md`''s
  Loop section, whose escalation fires on a persistent finding with no spin judgment
  — the unification must cover both validation-criteria references or the conflict
  re-creates itself between spec-side and plan-side loops.


  **Root cause:** the rules entered the deck at different moments and were never reconciled
  — the one-re-review bound was authored by the #2490 re-rip itself (commit 28b0c238,
  2026-10-04, the commit that created the verify card; the pre-rip attic deck carries
  no re-review bound); the spec-side repeat-until-zero Loop was authored by the #2575
  item 2 restoration (commit 65673de1, 2026-10-10, replacing the standards'' former
  "Bounded loop" section) — the conflict''s birth: the cap came out of the standards
  while the verify bound remained; the plan side''s `plan-validation-standards.md`
  (a #2601 authorship, 2026-10-13) carries the same repeat-until-zero escalation shape.
  #2597 explicitly deferred the dispatch-topology question, leaving the conflict standing.


  **Developer direction (2026-10-14):** the revise/re-audit loop needs to exist; it
  needs semantic checking to determine if it is "spinning" in place; on spin the agent
  should try higher-level fixing of the cause based on the enumerated potential causes
  (spec conflict, composite SC needing breakup, spec too fat needing splitting into
  multiple specs, atomic work unit violations, needed re-evaluation — and so forth);
  AI agent intelligence is to be used.


  ## Final what


  One loop rule governs every review/audit cycle: FAIL → genuine remediation of every
  named finding → fresh re-review → repeat until a zero-finding verdict. The fixed
  one-re-review bound is retired, subsumed by a **semantic spin condition**: each
  cycle, the agent running the loop judges — never a script — whether the loop is
  spinning (findings recurring or reshuffling without genuine resolution relative
  to the remediation performed). On spin, the revision step moves up a level: the
  agent diagnoses the cause and attempts **higher-level fixing of the diagnosed cause**
  — artifact-level structural revision such as breaking up a composite SC, splitting
  an over-fat spec, resolving a spec conflict, restructuring into atomic work units,
  or re-evaluating the approach — using AI agent intelligence, never a scripted procedure;
  the loop continues on the revised artifact. Escalation fires when spin persists
  after genuine higher-level fixing attempts, carrying the specific findings, the
  suspected cause class(es), the root cause, what was tried, and what is needed. The
  enumerated cause classes are recorded in both validation-criteria Loop sections
  as judgment examples — exemplary and open, never a closed checklist.


  Surfaces: `verify` card §4 (FAIL path restated) + frontmatter description (re-worded),
  `routing.md` verify entry ("bounded loop" → spin-bounded shape), `validation-standards.md`
  Loop section (spin semantic + example classes + attempt-before-escalate escalation,
  spec voice), `plan-validation-standards.md` Loop section (the same spin semantic,
  plan voice), deck-debt ledger #2534 (governance-decision entry). The `spec` card
  §6 and the `plan` card §7 already defer to their references'' loop sections and
  inherit the amendment unchanged.


  Deck edits go through the skill-creator admission gate; this item is developer-directed
  (carve-out applies; content standards bind).


  🤖 OpenCode (huggingface/zai-org/GLM-5.3-Flash)

  '
