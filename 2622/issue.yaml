title: 'Deck: restore remote-body format, blockquoted artifacts link, and {N}/ record-set
  mandates (remediation of #2620)'
status: open
labels:
- needs-approval
body: '## Problem


  The active deck''s `spec` and `issues` cards do not mandate (a) the remote-API issue-body
  format, (b) the blockquoted artifacts link, or (c) the local `{N}/` record set.
  An agent dispatch following the routed cards verbatim files a thin "## Why / ##
  What" remote body; two such filings were judged "not a proper remote spec" by the
  owner in a single session (NewsRxUI#64, ProcessFinishedNotify#36 — 2026-10-15).
  Root cause, diagnosed in #2620: the deck rip dropped `issue-operations-core`''s
  remote-body/blockquote/folder mandates without translating them into the replacement
  cards, which instead carry weak "detailed exec summary" rules. A third doctrine
  emission lives outside deck text: `.opencode/tools/session-init` injects "the remote
  issue body is a condensed exec summary only" into every session. A fourth, related
  defect — the one in-deck mechanic for the required link (`local-issues url --artifacts`)
  fails on ssh:// origins — is carved out to the companion spec (#2623).


  ## Developer doctrine (this session, 2026-10-15)


  - The remote body is a **fuller but still exec-summary-style spec** — self-sufficient
  so the developer can understand and judge the spec without hunting down the local
  full spec — while the full agent-ingest detail (exhaustive traceability, edge cases,
  evidence) stays local-authoritative in the issues-data store. The remote body is
  not a two-line pointer, and it is not a mirror of the full spec.

  - Operational format requirements belong in the **deck**, not in workspace documentation:
  the blockquote-URL convention currently stranded in `.opencode/.issues/AGENTS.md`
  is misplaced deck verbiage and is relocated by this change. Workspace guides are
  reduced to layout/tooling description.

  - The mandate''s trigger is **any remote issue that has a matching issues-data branch
  folder** (`{N}/`) — fact-decidable, no issue-type taxonomy. Issues filed first gain
  the mandate at reconciliation, when their folder comes to exist.

  - Spec structure was delegated ("You are the one analyzing the requirements") →
  two-spec split adopted; "proceed" finalized the design.


  ## Requirements


  - **R-1** The deck SHALL contain exactly one shared reference (`skills/spec/references/remote-body-format.md`)
  defining a two-tier body mandate for folder-backed issues: a universal minimum (Problem;
  Scope — what the change requires; Requirements as R-x SHALL statements; Impact)
  and a spec-filing extension (success criteria classified behavioral/structural each
  carrying a verification instrument; success-criteria table; Out of scope; Approach;
  plan-shaped sections — Items RED/GREEN, Dependencies, Traceability, Documentation
  Sources, Enforcement Gate, Cost Frame, Edge Cases, Not Included — once a plan exists).

  - **R-2** The shared reference SHALL state the trigger rule: the body mandate binds
  to every remote issue with a matching issues-data `{N}/` folder, and to no remote
  issue without one.

  - **R-3** The shared reference SHALL require the blockquote convention — the closing
  blockquoted artifacts link (`> Full spec and plan artifacts: <url>`, built via `local-issues
  url --number repo#N --artifacts`, with manual platform-URL derivation as fallback),
  present at filing and reconciled on every remote-body edit; the AI-facing relative-path
  artifacts pointer line adjacent; and the no-hardcoded-file-lists rule (agents glob
  `{issues_prefix}{N}/`).

  - **R-4** The shared reference SHALL state the sizing doctrine (a developer reading
  only the remote body can understand and judge the spec; full agent-ingest detail
  stays local-authoritative) and the `{N}/` record set — `spec.md` plus `issue.yaml`,
  `comments.yaml`, `links.yaml`, artifact subdirectories.

  - **R-5** `spec/SKILL.md` and `issues/SKILL.md` SHALL replace their weak body-format
  sentences with pointers to the shared reference, preserving the local-authoritative
  doctrine at each site.

  - **R-6** `.opencode/tools/session-init`''s injected store-first note SHALL no longer
  state "condensed exec summary only"; it SHALL state the new sizing doctrine.

  - **R-7** `.opencode/.issues/AGENTS.md` SHALL lose its operational "GitHub URL Convention"
  section and exec-summary doctrine phrasing (normative form relocated into the reference),
  keeping layout/tooling description plus a pointer; `.issues/AGENTS.md`''s pointer
  description SHALL cite the deck reference for format rules.

  - **R-8** The change SHALL satisfy the skill-creator admission gate, carrying the
  #2620 defect record, the NewsRxUI#64 / ProcessFinishedNotify#36 verdicts, and the
  stranded-guide-verbiage finding as admission evidence; the attic stays preserved-but-unloaded
  (translation, not resurrection).


  ## Scope


  | ID | Class | Criterion | Instrument |

  |----|-------|-----------|------------|

  | SC-1 | structural | The reference defines the two-tier body mandate (universal
  minimum + spec extension, every listed section per tier, classification/instrument
  requirement, R-x SHALL style). | Read the file. |

  | SC-2 | structural | The reference states the folder-trigger rule. | Read the file.
  |

  | SC-3 | structural | The reference states the relocated blockquote convention (closing
  link, reconcile-on-edit, build mechanics, AI-facing pointer, no-hardcoded-file-lists
  rule). | Read the file. |

  | SC-4 | structural | The reference states the sizing doctrine and the `{N}/` record
  set (cross-checked against `local-issues-cli.md`). | Read the file. |

  | SC-5 | structural | Both cards carry no independent body-format rule; each cites
  the reference. | `grep -rn "exec summary" .opencode/skills/` matches only the reference;
  both cards contain the pointer. |

  | SC-6 | structural | `.opencode/.issues/AGENTS.md` carries no operational format
  requirements; `.issues/AGENTS.md`''s pointer description cites the deck reference.
  | Read both guides in full. |

  | SC-7 | structural | session-init''s injected note states the new sizing doctrine;
  "condensed exec summary" no longer appears in the tool. | Source read + grep. |

  | SC-8 | structural | Admission evidence travels with the change per the skill-creator
  gate. | Read the gated change record. |

  | SC-9 | behavioral | A fresh-session agent routing `spec`/`issues` by description,
  filing a folder-backed issue, composes a remote body with the universal-minimum
  sections, the spec extension, and the closing blockquote. | Behavioral session test
  (tests-v2 harness); inspect the produced remote body. |


  ## Out of scope


  - The `local-issues` URL-builder fix (companion spec #2623).

  - Store-primaryity changes — `.issues/{N}/spec.md` stays the authoritative full
  spec.

  - Attic changes; validation/plan-validation-standards changes; retroactive remediation
  of the two judged filings; card description rewrites; session-init beyond the one
  doctrine string.


  ## Approach


  Author the shared reference translating the mandates; replace the two card rules
  with pointers; update the session-init doctrine string; strip and re-point the workspace
  guides; run the edit through skill-creator deck governance.


  ## Impact


  - Consumers: every future filing on any family root using this deck; the `spec`/`issues`
  cards; both workspace guides; every session''s init context (session-init doctrine
  string — one string, machinery untouched).

  - One runtime-code line changes (the session-init string). The behavioral SC-9 does
  not block on #2623: the reference carries the manual platform-URL derivation as
  fallback build mechanic.


  > Full spec and plan artifacts: https://github.com/michael-conrad/.opencode/tree/issues-data/2622/


  🤖 OpenCode session evidence: filed from a real opencode session (model id: huggingface/zai-org/GLM-5.3-Flash),
  2026-10-15.

  '
