title: '[SPEC] Harden the ragsync retrieval service launch path — client-death reaping,
  resource ceilings, host-memory admission, same-host serialization'
status: closed
labels:
- spec
- needs-approval
body: '## Problem


  The deck''s default retrieval service (`ragsync` MCP, `jsbroks/ragsync-mcp`, adopted
  in `#2315`) launches with no lifecycle or resource governance. On 2026-10-15 two
  clientless ragsync instances survived their MCP clients'' death for ~3 h on the
  shared 62 GiB family build host, ballooned to **39.4 GB + 21.7 GB RSS** (≈ **117
  GB** combined demand), drove **63 Gi swap** (`kswapd0` pinned in `D` state, load
  47–53, 151/154 threads) and read **≈2.7 TiB** while orphaned and unbounded; diagnosis
  and developer-ordered `SIGTERM` recovery took manual effort. No data was lost (sub-GB
  writes; Chroma stores regenerable).


  Three interacting gaps: (1) stdio MCP servers have no parent-death detection — a
  busy clientless server never hits EPIPE and nothing reaps it; (2) the chroma backend
  loads full collections into RAM (no memory cap, no thread cap, no host-aware admission);
  (3) per-repo configs give no cross-repo concurrency guard on one host. The launch
  path is **unchanged** since the incident (verified 2026-11-25 — the registration
  is still the raw `uvx --with "mcp<2" ragsync --config .opencode/ragsync-config.yaml`
  shape), and an unhardened instance of exactly this shape is in live use on the same
  host at authoring time.


  ## Approach


  Fix the ragsync setup in place, entirely in the deck-owned layer — no fork, no vendored
  server, no service replacement (`#2315` CON-1 stands; discard was weighed and rejected,
  see Spec §1 Alternatives). Four concrete setup changes, in implementation order:


  - **Registered launch command → watchdog wrapper** — `opencode.jsonc`''s `mcp.ragsync.command`
  swaps the raw `uvx …` line for a wrapper that starts it as a supervised child: parent-death
  signal (PR_SET_PDEATHSIG-class) on the server process **plus** a PPID-poll loop
  carrying the reap deadline — belt-and-suspenders, since PDEATHSIG alone misses the
  parent-dies-before-prctl window and PPID poll alone can lag — so the full tree is
  reaped on client death with no stdout/EPIPE dependence.

  - **Co-located resource ceilings** — configured peak-memory-demand ceiling and thread-pool
  cap applied to the supervised child: upstream knobs where plan-time live verification
  confirms them, wrapper-level limit application otherwise and by default.

  - **Host-memory admission gate in the wrapper** — below a configured free-memory
  threshold, heavyweight reindex/HNSW work is not admitted (observably-distinguishable
  state).

  - **Same-host serialization** — a runtime lock in a user-owned runtime directory;
  exactly one heavyweight reindex slot per host user, plus an optional clientless
  idle/heartbeat self-reaper in the same wrapper.


  Default-on registration and the retrieval function itself are preserved — the fix
  governs the setup''s workload, it does not retire the service.


  ## Scope


  Files touched live under the `.opencode` repo only: `opencode.jsonc` (`mcp.ragsync`
  registration), co-located `ragsync-config.yaml` + wrapper, `docs/ragsync-service.md`.
  Corpus designation and include/exclude policy (`#2315` §3.1/CON-8), model pinning
  (CON-7), and all other registered MCP services are out of scope. Xvfb/`awaitConsoleIdle`
  downstream defects stay in the doaj/NewsRxUI trackers (incident cross-ref only).


  ## Requirements


  - **R-1 (SHALL)** — registered launch command routes startup through a wrapper that
  detects client death and terminates the entire server tree (wrapper + server) without
  stdout/EPIPE dependence, within the wrapper''s bounded reap deadline (documented
  parameter).

  - **R-2 (SHALL)** — the service setup (co-located config + wrapper) bounds the supervised
  instance''s peak memory demand to a configured ceiling (default recorded with rationale
  at implementation time, sized above the embedding-model resident baseline); upstream
  knob where plan-time verification confirms, wrapper-level limits otherwise — the
  deck-owned path is the default and does not depend on upstream.

  - **R-3 (SHALL)** — the service setup caps the supervised instance''s thread/worker
  count at a configured maximum (same knob-or-wrapper contract as R-2).

  - **R-4 (SHALL)** — the launch wrapper applies host-memory admission: below a configured
  free-memory threshold, heavyweight work (the reindex/HNSW index-construction class)
  is not admitted, in an observably-distinguishable state.

  - **R-5 (SHALL)** — the launch wrapper serializes heavyweight reindex work across
  same-host instances (one heavyweight slot per host user; runtime lock in a user-owned
  runtime directory, held only while the work runs).

  - **R-6 (SHOULD)** — the launch wrapper provides a clientless idle/heartbeat reaper:
  a clientless, workless stdio server self-terminates after a configured idle duration.

  - **R-7 (SHALL)** — retrieval function preserved post-fix (service starts and answers
  queries inside the documented startup envelope); `#2315` CON-7 honest best-effort
  unavailability semantics stand.

  - **R-8 (SHALL)** — standing co-location contract preserved (`#2315` CON-5): registered
  command keeps naming `--config .opencode/ragsync-config.yaml`.


  ## Impact


  Consumers: every deck deployment''s `ragsync` registration and config (edited in
  place); the family build host''s co-tenants (protected by gates/ceilings); retrieval
  users (function preserved per R-7); the upstream service (complementary fixes not
  gated); deck docs naming the service (updated to the hardened path). Risk if unaddressed:
  the incident shape repeats on any client death during heavy work — an unbounded,
  multi-hour, host-thrashing workload on a shared machine.


  ## Success criteria


  | ID | Criterion (compressed) | Class | Instrument |

  |----|--------------------------|-------|------------|

  | SC-1 | SIGKILLed client → tree exits within the reap deadline, stdout-quiet/busy
  case included | behavioral | lifecycle fixture (stub client, kill mid-run, poll
  tree exit) |

  | SC-2 | Reindex peak RSS ≤ configured ceiling on the fixture corpus | behavioral
  | uncapped baseline vs capped rerun, RSS sampling |

  | SC-3 | Thread count ≤ configured cap during the capped run | behavioral | thread
  sampling during SC-2 run |

  | SC-4 | Threshold above free memory → no heavyweight work admitted, observable
  state | behavioral | inflated-threshold launch fixture, log/exit assertions |

  | SC-5 | Zero overlap of heavy-work windows across two same-host instances | behavioral
  | two-instance fixture with workload-window sampling |

  | SC-6 | Clientless idle instance self-terminates after the configured idle duration
  | behavioral | idle fixture past timeout (+ margin), assert self-exit |

  | SC-7 | Client-connected instance survives the same window (no false reaping) |
  behavioral | companion fixture, client alive past SC-6 window, query answered |

  | SC-8 | Hardened service starts; `list_sources` returns exactly the fixture sources;
  seeded `search` returns ≥1 hit | behavioral | MCP stdio client invocation inside
  the connect envelope |

  | SC-9 | Registered command names the co-located config; hardening defaults live
  in it | structural | parse `opencode.jsonc` `mcp.ragsync` + grep the co-located
  config |


  ## Out of scope


  Retiring/replacing ragsync; re-registering `srclight` (banned per `#2315` CON-9);
  Xvfb/`awaitConsoleIdle` defects (doaj/NewsRxUI trackers); other MCP services'' lifecycle
  hardening; ragsync source modification/forking/vendoring; corpus designation changes;
  new model pinning; upstream-issue gating; per-deployment disable policy.


  > Full spec and plan artifacts: https://github.com/michael-conrad/.opencode/tree/issues-data/2624/

  >

  > AI-facing local artifacts: `.opencode/.issues/2624/`

  '
