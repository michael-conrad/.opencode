    `c69fd194` (#9902). The ride decision was the run agent''s own, reasoned from
    `git-workflow-pr`''s scope-boundary provision before any recovery pass touched
    the session; no second branch and no second PR exist (full tool-call sweep + live
    API state).


    **Clean-room verdict: PASS** — exact event-row citations; live container state
