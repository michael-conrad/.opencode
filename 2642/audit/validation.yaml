          893-923, 985-1014.)
        remediation: >-
          R-3 states the establishment-completing semantics — the opt-in
          verifies the push outcome against the live remote ref, exits
          non-zero when the ref is absent after the attempt, and a re-run
          performs the establishment push on a child whose worktree exists
          but whose origin ref is absent (no short-circuit on the worktree's
          existence); approach step 3 rewritten to match.
