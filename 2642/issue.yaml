title: '[SPEC] local-issues gates child store hosts on issue-host evidence — no child
  auto-bootstrap, no push to ref-less remotes'
status: open
labels:
- spec-fix
- local-issues
- '[SPEC]'
- needs-approval
body: "<!-- SPDX-FileCopyrightText: 2026 Michael Conrad -->\n<!-- SPDX-License-Identifier:\
  \ MIT -->\n<!-- Provenance: AI-authored bug report, filed 2026-10-19 by michael-newsrx\n\
  \     (michael-conrad/.opencode#2642, labels spec-fix + local-issues). Triaged\n\
  \     2026-11-04 under the developer dispatch \"triage .opencode#2642\" and\n  \
  \   converted in place into this governing spec under the work-entry\n     conversion\
  \ (issues card §5, .opencode#2707 mechanics), per the worked\n     precedents .opencode#2681\
  \ and .opencode#2704. Triage evidence:\n     research/triage-2026-11-04.md. Adjacent\
  \ records: .opencode#2667 (the\n     discovery mechanism this spec refines — registered-submodule\
  \ membership\n     was R-1's eligibility rule; the pull-only carve-out it established\
  \ stays),\n     .opencode#2544 (session-init's wiki-origin exclusion), .opencode#2446\n\
  \     (related pointer — different facet, closed). -->\n\n# [SPEC] local-issues\
  \ gates child store hosts on issue-host evidence — no child auto-bootstrap, no push\
  \ to ref-less remotes\n\n## Problem\n\n`tools/local-issues` treats every registered\
  \ `.gitmodules` child repository as\nan issue host and auto-bootstraps an issue\
  \ store for it. The filing report's\nlive observation (2026-10-19, `hermes-ingest-pubmed`):\
  \ the only registered\nchild there is the GitHub wiki checkout (`git@github.com:NewsRx/hermes-ingest-pubmed.wiki.git`)\n\
  — a content repository with no issue role — and the tool created a store in it\n\
  anyway. The observed failures, with the code grounds verified 2026-11-04\n(triage\
  \ evidence: `research/triage-2026-11-04.md`):\n\n- **O-1 — discovery has no issue-host\
  \ evidence requirement.**\n  `_discover_all_repos()` returns the tool's project\
  \ root plus every\n  registered initialized submodule; no check asks whether the\
  \ child actually\n  hosts issues.\n- **O-2 — the bootstrap sweep provisions stores\
  \ on every discovered child.**\n  `_ensure_all_worktrees()` creates the `.issues/`\
  \ worktree in each\n  non-pull-only discovered repository — in the wiki checkout,\
  \ a gitignored\n  directory the operator never asked for.\n- **O-3 — the minted\
  \ store branch carried wiki trunk content** (`Home.md`, a\n  wiki content page,\
  \ at the branch head). Recorded from the filing session's\n  live observation; not\
  \ re-derived from this workspace's code.\n- **O-4 — the bootstrap path pushed the\
  \ store branch to the child's remote.**\n  `_push_orphan_if_needed()` pushes `issues-data\
  \ -u origin` whenever a remote\n  exists (skipping only https-without-credentials).\
  \ The wiki remote now\n  carries a stray `refs/heads/issues-data` (b1f5156) — pollution\
  \ of a\n  special-purpose remote.\n- **O-5 — every `init`/`sync` reported permanent\
  \ conflict noise** while the\n  remote ref did not yet exist: `_sync_repo()`'s pull-rebase\
  \ against a\n  ref-less remote fails, and the wiki entry reported\n  `status: conflict`\
  \ / `\"fatal: couldn't find remote ref issues-data\"` until\n  the auto-push landed.\n\
  - **O-6 — `doctor` called the phantom store `HEALTHY`.**\n  `_doctor_repo_report()`\
  \ marks `branch_state=HEALTHY` whenever the local\n  branch exists; no signal distinguishes\
  \ a spurious store from a real one.\n- **O-7 — the defect is self-healing-defeating.**\
  \ Removing the local worktree\n  does not fix it: the next `init` recreates the\
  \ store and re-syncs (observed\n  live in the filing session; `cmd_init()` runs\
  \ the bootstrap sweep on every\n  invocation).\n\nRoot cause covered: discovery's\
  \ store-host rule keys on submodule\nregistration alone — `.opencode#2667` R-1 made\
  \ registered-submodule\nmembership the eligibility rule without an issue-host evidence\
  \ gate — and the\nbootstrap/sync/push paths propagate whatever discovery hands them,\
  \ including\nminting and pushing a store branch toward a remote that never carried\
  \ one.\n\n## Scope\n\nThe tool's store-host membership and the paths that provision\
  \ or propagate\nchild stores, plus the surfaces that describe or observe them:\n\
  \n- `.opencode/tools/local-issues` — discovery (`_discover_all_repos`,\n  `_registered_store_host_paths`),\
  \ the bootstrap sweep (`_ensure_all_worktrees`,\n  `_ensure_worktree`, `_create_issues_worktree`,\
  \ `_push_orphan_if_needed`),\n  the sync path (`_sync_repo`, `_push_issues_branch_safe`),\
  \ the\n  `sync-file` path (`_sync_file_in_worktree`, `cmd_sync_file`), the\n  mutation\
  \ auto-push (`_auto_commit`, `_push_issues_changes`), `doctor`\n  (`_doctor_repo_report`,\
  \ `cmd_doctor`), the mutation path's store-host\n  resolution and refusal diagnostic,\
  \ and the explicit opt-in surface.\n- `.opencode/tools/session-init` — the child\
  \ store claims only: the\n  Repo Information block's `issues:` field for child entries\
  \ and the\n  Local Issue Folders section's bootstrap hint for children.\n- `skills/issues/SKILL.md`\
  \ — the operating-contract sentence defining which\n  repositories hold stores.\n\
  - `skills/issues/references/local-issues-cli.md` — the `init` row and the\n  store-semantics\
  \ section.\n- `skills/issues/references/sync-mirroring.md` — the store-shape and\n\
  \  initialization text describing `init`'s repository set.\n- `tests/test_local_issues/`\
  \ and `tests/test_session_init/` — the unit tests\n  pinning the child-discovery\
  \ mechanism carry their expectations onto the\n  gated mechanism.\n\nOut of scope:\n\
  \n- **The stray `refs/heads/issues-data` (b1f5156, containing `Home.md`) on\n  `NewsRx/hermes-ingest-pubmed.wiki`.**\
  \ Deletion is maintainer-side:\n  remote-branch deletion is a destructive action\
  \ the agent performs only on\n  explicit developer instruction. This spec records\
  \ the cleanup item; it\n  orders no deletion.\n- **The workspace root's store behavior.**\
  \ The root — the repository the\n  `.opencode/` deck directory carrying the tool\
  \ belongs to — remains an\n  unconditional store host; its establishment push is\
  \ preserved and pinned.\n- **Pull-only children (`.opencode#2667`).** The classification,\
  \ the refusal,\n  the no-store steady state, and the doctor marker are unchanged.\n\
  - **Session-init's wiki-origin exclusion (`.opencode#2544`).** Session-init\n  keeps\
  \ excluding wiki-origin repos from enumeration; this spec changes only\n  its store\
  \ claims for children it does enumerate.\n- **Nested submodules at depth two or\
  \ deeper.** The store scope stays the\n  workspace root plus its direct children.\n\
  - **Un-pollution logic.** No code path deletes or repairs a polluted child\n  remote.\
  \ The gate prevents new pollution; existing pollution is cleaned by\n  the operator\
  \ (remote-branch deletion maintainer-side, local worktree\n  removal operator-side).\n\
  - **Deck rule text beyond the three surfaces named above.** No work-card,\n  plan-card,\
  \ or verify-card changes.\n\n## Requirements\n\n- **R-1 — Evidence-gated child store\
  \ hosts.** The tool SHALL classify a child\n  repository (any discovered repository\
  \ other than the tool's project root)\n  as a store host only when the issue store\
  \ already exists on it: the\n  child's origin carries the `issues-data` ref, verified\
  \ at discovery time,\n  or a local `.issues/` store worktree exists in the child.\
  \ A child with\n  neither evidence — including one whose remote ref cannot be verified\
  \ —\n  SHALL NOT be a store host: `init` creates no worktree, no branch, and no\n\
  \  store artifact in it; `sync` performs no fetch, no rebase, and no push\n  against\
  \ it and reports it as an informational non-host steady state (the\n  pull-only\
  \ entry's shape); a mutation naming it SHALL be refused with a\n  diagnostic that\
  \ names the child's non-host classification and the opt-in\n  path. The tool's project\
  \ root SHALL remain an unconditional store host.\n- **R-2 — No child-origin store-branch\
  \ creation from the passive paths.**\n  Before any passive path — the sync path\
  \ (`_sync_repo`), the `sync-file`\n  path (`cmd_sync_file`), the bootstrap sweep,\
  \ or a mutation command's\n  auto-push — operates against a child repository's origin,\
  \ the tool SHALL\n  verify that the origin carries the `issues-data` ref (a live\
  \ verification\n  against a reachable origin). When the origin is reachable and\
  \ the ref is\n  verified absent, the passive path SHALL perform none of its operations\n\
  \  against that origin — reporting an informational steady state, not a\n  failure.\
  \ When the child's origin cannot be verified — unreachable — a host\n  child's sync\
  \ and mutation paths SHALL keep the existing failure semantics\n  (the failure statuses\
  \ and the non-zero sync exit the `.opencode#2548` C2\n  contract pins): a transient\
  \ outage is never reported as an intentional\n  steady state. A non-host child (R-1's\
  \ classification) is skipped entirely\n  on either remote state. The opt-in adoption\
  \ path (R-3) and the workspace\n  root's establishment push are the only origins\
  \ of a child's remote store\n  ref.\n- **R-3 — Explicit opt-in provisioning.** The\
  \ tool SHALL provide an explicit\n  opt-in on `init` that provisions a store on\
  \ one named child: the store\n  worktree, the store branch, and the establishment\
  \ push to that child's\n  origin. No other path SHALL provision a child store. The\
  \ opt-in SHALL\n  refuse a pull-only child (the `.opencode#2667` R-3 refusal) and\
  \ a path\n  that is not a registered child of the workspace root, and each refusal\n\
  \  diagnostic SHALL name its ground — the pull-only classification, or the\n  not-a-registered-child\
  \ ground. The opt-in SHALL leave the named child's\n  origin carrying the `issues-data`\
  \ ref and SHALL exit non-zero when the\n  establishment push does not take effect;\
  \ a re-run of the opt-in on a child\n  whose store worktree exists but whose origin\
  \ ref is absent SHALL perform\n  the establishment push — the opt-in completes the\
  \ establishment and does\n  not short-circuit on the worktree's existence.\n- **R-4\
  \ — `doctor` reflects the gate.** `doctor` SHALL apply the same\n  host-evidence\
  \ rule: a child with neither evidence carries the non-host\n  classification in\
  \ its marker line instead of a branch-state health verdict,\n  and no `UNHEALTHY`\
  \ marker fires for a child whose absent store is\n  intentional — the marker pattern\
  \ `.opencode#2667` R-4 established for\n  pull-only repositories.\n- **R-5 — Session-init's\
  \ child store claims agree with the gate.** For a\n  child repository that is not\
  \ a store host under R-1, session-init SHALL\n  emit no `issues:` store path in\
  \ the Repo Information block and no\n  `run local-issues init` bootstrap hint in\
  \ the Local Issue Folders section.\n  The root's claims and the pull-only exclusions\
  \ are unchanged.\n- **R-6 — The deck text states the gate.** The `issues` card's\n\
  \  operating-contract store-host sentence and the two operating references\n  (`local-issues-cli.md`,\
  \ `sync-mirroring.md`) SHALL describe the child\n  store-host rule as evidence-gated\
  \ with the opt-in path named, and SHALL NOT\n  describe registered-submodule membership\
  \ alone as the child eligibility\n  rule. The root's unconditional-host description\
  \ is unchanged.\n- **R-7 — Surface bound and suite.** The change SHALL touch only\
  \ the surfaces\n  named in Scope and SHALL add no tool command beyond the opt-in\
  \ on `init`.\n  The deck's unit-test suite SHALL pass after the change, with the\
  \ tests that\n  pin the child-discovery mechanism carrying their expectations onto\
  \ the\n  gated mechanism and keeping the properties they were written for.\n\n##\
  \ Success criteria\n\n| ID | Criterion | Class | Instrument |\n|----|-----------|-------|-----------|\n\
  | SC-1 | A registered child with no store evidence — reachable pushable origin,\
  \ no `issues-data` ref, no local `.issues/` — receives no store, and the reports\
  \ say so: `local-issues init` exits successfully, the child has no `.issues` directory\
  \ and no `issues-data` branch, the child's origin carries no `issues-data` ref afterward,\
  \ and the init report carries the child's informational non-host steady-state entry\
  \ (the pull-only entry's shape — classification, no operation result). | behavioral\
  \ (runtime effect) | Construct the workspace per the `.opencode#2667` SC-6 fixture\
  \ family: workspace root whose origin is a reachable local bare repository, the\
  \ deck's `tools/` at `<workspace>/.opencode/tools/`, and a registered submodule\
  \ at `sub/deck` whose origin is a reachable bare repository carrying no `issues-data`\
  \ branch. Run `<workspace>/.opencode/tools/local-issues init`; read its exit status\
  \ and per-repo report (the entry naming `sub/deck`), then `ls -a sub/deck`, `git\
  \ -C sub/deck branch`, `git -C sub/deck worktree list`, and `git -C sub/deck ls-remote\
  \ origin`. |\n| SC-2 | A mutation naming a non-host child is refused with a diagnostic\
  \ naming the child's non-host classification and the opt-in path, and the refusal\
  \ creates no store artifact in the child. | behavioral (runtime effect) | In the\
  \ SC-1 workspace (before any adoption), run `create --number 'deck#9999' --title\
  \ probe` (the child's qualifier) and read the exit status, the diagnostic text (it\
  \ names the non-host classification and the opt-in path), `ls -a sub/deck`, and\
  \ `git -C sub/deck branch`. An unknown-repository refusal alone, a diagnostic missing\
  \ either element, or a refusal that created the store, fails. |\n| SC-3 | The passive\
  \ paths never touch a child's ref-less remote: a child holding a local store worktree\
  \ whose origin lacks the `issues-data` ref is synced with no fetch, no rebase, and\
  \ no push — its report entry is an informational steady state (not a failure status),\
  \ `sync` exits successfully, `sync-file` naming that child's store file likewise\
  \ performs no push and reports an informational steady state while exiting successfully,\
  \ a mutation naming that child commits locally and performs no push, and the ref\
  \ stays absent through all three. | behavioral (runtime effect) | In a workspace\
  \ as in SC-1, adopt the child, create one record in it (the record's auto-push lands\
  \ while the ref exists), then delete the remote ref from the child's bare origin\
  \ (`git -C <bare> branch -D issues-data`). Run `local-issues sync`; run `local-issues\
  \ sync-file --file 'deck#0001/issue.yaml'` (the child's qualifier); run `local-issues\
  \ update --number 'deck#0001' --title probe2` (a mutation whose auto-push is gated).\
  \ Read all three entries and exit statuses, and `git -C sub/deck ls-remote origin`\
  \ — the ref stays absent and each entry reports no push against the child's remote.\
  \ |\n| SC-4 | The opt-in provisions a store on a named child: `init` with the opt-in\
  \ naming the registered child leaves the child with an `.issues` worktree, a local\
  \ `issues-data` branch, and an `issues-data` ref on its origin. | behavioral (runtime\
  \ effect) | In the SC-1 workspace, run `local-issues init` with the opt-in naming\
  \ `sub/deck` and read `ls -a sub/deck`, `git -C sub/deck branch`, and `git -C sub/deck\
  \ ls-remote origin`. |\n| SC-5 | A real host child on a fresh clone still bootstraps\
  \ from its remote: a registered child whose origin carries `issues-data` and which\
  \ has no local store receives the store worktree from the remote, and `init` exits\
  \ successfully. | behavioral (runtime effect) | Construct the SC-1 workspace with\
  \ the child's bare origin carrying an `issues-data` branch (seeded with one issue\
  \ record); run `local-issues init` and read the exit status, the child's worktree\
  \ registration, and the seeded record's presence in `sub/deck/.issues/`. |\n| SC-6\
  \ | `doctor` reports a non-host child with the non-host classification and no `UNHEALTHY`\
  \ marker. | behavioral (runtime effect) | In the SC-1 workspace, run `local-issues\
  \ doctor` and read the marker line naming `sub/deck`: it carries the non-host classification\
  \ and does not carry `UNHEALTHY`. |\n| SC-7 | Session-init's child store claims\
  \ agree with the gate: a non-host child carries no `issues:` store path in the Repo\
  \ Information block and no bootstrap hint in the Local Issue Folders section; the\
  \ root's claims are unchanged. | behavioral (runtime effect) | In the SC-1 workspace,\
  \ run `./.opencode/tools/session-init` and read the Repo Information block entry\
  \ naming the child and the Local Issue Folders section: no `issues:` line and no\
  \ `run ./.opencode/tools/local-issues init` hint names the child; the root's `issues:\
  \ .issues/` line is present. |\n| SC-8 | A wiki-origin child — the report's exact\
  \ repro shape — receives no store: no `.issues` directory, no branch, and no push\
  \ toward the wiki remote. | behavioral (runtime effect) | Construct the SC-1 workspace\
  \ with the child's origin URL ending in `.wiki.git` (a local bare repository so\
  \ the transport is reachable); run `local-issues init` and read the exit status,\
  \ `ls -a`, the branch list, and `ls-remote origin` for the child. |\n| SC-9 | The\
  \ deck's unit-test suite passes with the gated mechanism, and the tests that pinned\
  \ child discovery keep the properties they were written for: discovery is CWD-independent;\
  \ a registered child with host evidence is discovered; the doctor's per-repository\
  \ attribution covers a child; the pull-only expectations stand; and the gated classification's\
  \ evidence branches — local-only, remote-only, neither, and unverifiable-remote\
  \ — carry unit coverage. | behavioral (runtime effect) + structural | Run `uv run\
  \ --group dev pytest` in the deck and read the summary (no failures). Then read\
  \ the updated tests: the CWD-independence assertion, the child-discovery assertion\
  \ (now with host evidence in the fixture), the doctor attribution assertion, the\
  \ pull-only assertions, and the four evidence-branch coverage tests are each present.\
  \ |\n| SC-10 | The three deck-text surfaces state the gate: the `issues` card's\
  \ operating-contract store-host sentence, the `local-issues-cli.md` `init` row,\
  \ and the `sync-mirroring.md` store-shape/initialization text each describe child\
  \ store-host membership as evidence-gated with the opt-in path named, and none describes\
  \ registered-submodule membership alone as the child eligibility rule. | structural\
  \ | Read each surface: the evidence rule and the opt-in are stated for children;\
  \ the root's unconditional-host statement survives in each; no surface states registration-alone\
  \ eligibility. |\n| SC-11 | The change touches only the surfaces named in Scope\
  \ and adds no tool command beyond the opt-in on `init`. | structural | The changed-file\
  \ list against the base tip, plus `local-issues --help` compared with the base revision's\
  \ command list (the opt-in is a flag on the existing `init` command, not a new command).\
  \ |\n| SC-12 | The opt-in's refusals name their grounds: on a registered child whose\
  \ origin is an `https` URL resolving to nothing, the opt-in is refused with a diagnostic\
  \ naming the pull-only classification; on a path that is not a registered child\
  \ of the workspace root, the opt-in is refused with a diagnostic naming the not-a-registered-child\
  \ ground; neither refusal creates a store in any target. | behavioral (runtime effect)\
  \ | In a workspace whose child's origin is an `https` URL resolving to nothing (the\
  \ `.opencode#2667` SC-1 rewrite — the child is pull-only there regardless of host\
  \ evidence), run the opt-in naming the child and read the diagnostic: it names the\
  \ pull-only classification. In the SC-1 workspace, run the opt-in naming a plain\
  \ directory that is not a registered child (a `scratch/` directory created for the\
  \ run) and read the diagnostic: it names the not-a-registered-child ground. After\
  \ both runs, read `ls -a` and the branch lists of both targets: no store artifact\
  \ exists. |\n| SC-13 | The opt-in's establishment failure is visible and completable:\
  \ on a named child whose origin rejects pushes, the opt-in exits non-zero with a\
  \ diagnostic naming the failed establishment while the store worktree exists locally;\
  \ a re-run of the opt-in on that child once its origin accepts pushes performs the\
  \ establishment push — exits successfully with the origin carrying the `issues-data`\
  \ ref. | behavioral (runtime effect) | Construct the SC-1 workspace with the child's\
  \ origin served by the `.opencode#2667` SC-6 SSH-shim family with `git-receive-pack`\
  \ made to fail (`git-upload-pack` working), so fetch succeeds and push fails. Run\
  \ the opt-in naming `sub/deck`: read the non-zero exit, the diagnostic (it names\
  \ the failed establishment), `ls -a sub/deck` (the worktree exists), and `git -C\
  \ sub/deck ls-remote origin` (the ref is absent). Restore `git-receive-pack` in\
  \ the shim, re-run the opt-in naming `sub/deck`: read the zero exit, `ls -a sub/deck`,\
  \ and `git -C sub/deck ls-remote origin` (the ref is present). |\n| SC-14 | A child\
  \ whose origin is unreachable degrades to the informational skip, not a fatal abort:\
  \ with the child's origin an ssh URL to an unreachable endpoint and no local store,\
  \ `init` exits successfully, creates no store artifact in the child, and the child's\
  \ report entry is the informational non-host steady state. | behavioral (runtime\
  \ effect) | Construct the SC-1 workspace with the child's origin the ssh URL `git@127.0.0.1:<closed-port>/local/deck.git`\
  \ (a port with nothing listening, so `git ls-remote` fails immediately) and no `issues-data`\
  \ branch seeded. Run `<workspace>/.opencode/tools/local-issues init`; read its exit\
  \ status (zero), the per-repo report (the child's entry is the informational steady\
  \ state), `ls -a sub/deck`, and `git -C sub/deck branch` (no `issues-data` branch).\
  \ |\n| SC-15 | A host child whose origin is unreachable keeps the existing failure\
  \ semantics: with the child holding a local store worktree and its origin unreachable,\
  \ `sync` attempts the store operations and exits non-zero with a failure status\
  \ — the transient outage is not reported as an intentional steady state. | behavioral\
  \ (runtime effect) | In the SC-1 workspace, adopt the child (its store worktree\
  \ exists), then make the child's origin unreachable (stop the endpoint serving it,\
  \ or rewrite the child's origin to a closed port's ssh URL). Run `local-issues sync`:\
  \ read the non-zero exit and the child's entry — a failure status (`conflict`, `push_failed`,\
  \ or `timeout`), not a steady-state skip. Restore the origin, re-run `sync`: zero\
  \ exit, `ok`. |\n\n## Approach\n\n1. **Host classification over enumeration, not\
  \ discovery exclusion\n   (R-1, R-2, R-4).** Discovery keeps enumerating the registered\
  \ child set —\n   `_discover_all_repos()`'s membership is unchanged, because the\
  \ reporting\n   and resolution layers read that set: the init/sync report\n   (`_collect_repos()`),\
  \ `doctor`'s per-repo rows (`cmd_doctor()`), and the\n   mutation path's name resolution\
  \ (`_resolve_worktree_from_path()` and its\n   resolver helpers) each need the child\
  \ present to report or refuse it. The\n   host-evidence rule becomes a classification\
  \ layer over the enumerated\n   set: a child is a store host when its origin carries\
  \ a live-verified\n   `issues-data` ref (`git ls-remote` — a stale remote-tracking\
  \ ref is not\n   verification) or a local `.issues/` worktree marker (the tool's\
  \ own\n   `(issues_dir / \".git\").is_file()` detection); otherwise it is a non-host.\n\
  \   The consuming points apply the classification: the bootstrap sweep\n   provisions\
  \ only hosts; the sync path reports a non-host child as the\n   informational steady\
  \ state (the pull-only entry's shape) and gates a host\n   child's fetch, rebase,\
  \ and push on the verified remote ref (R-2);\n   `doctor` emits the non-host classification\
  \ row (R-4); the mutation path\n   resolves registered children and refuses non-hosts\
  \ (R-1). Network absence\n   degrades safely — a real host child on a fresh clone\
  \ simply does not\n   bootstrap that session and bootstraps when the remote is reachable\
  \ again.\n2. **Passive-path gates (R-2).** For a child repository, the sync path's\n\
  \   fetch, rebase, and push, the `sync-file` path's push, and the\n   bootstrap-sweep\
  \ and mutation pushes each verify the origin's\n   `issues-data` ref (`git ls-remote`,\
  \ live) before operating. A reachable\n   origin with the ref verified absent yields\
  \ an informational skip entry —\n   no operation runs against that origin. An origin\
  \ whose ref cannot be\n   verified is not a skip: a host child's operations attempt\
  \ and fail\n   through the existing failure statuses and the non-zero sync exit\
  \ (the\n   `.opencode#2548` C2 contract), so a transient outage is never disguised\n\
  \   as an intentional steady state. The root's establishment push keeps its\n  \
  \ current behavior.\n3. **Opt-in (R-3).** `init` gains a per-invocation adoption\
  \ flag naming one\n   registered child. The adoption path is establishment-completing,\
  \ not a\n   bootstrap wrap: it checks the named child's worktree and remote ref\n\
  \   independently, provisions what is missing (worktree via the existing\n   bootstrap,\
  \ branch via the orphan path, remote ref via the establishment\n   push), verifies\
  \ the push outcome against the live remote ref, and exits\n   non-zero when the\
  \ ref is absent after the attempt — so a failed\n   establishment push is visible\
  \ at adoption time and a re-run completes it.\n   The refusal diagnostics for pull-only\
  \ and unregistered paths follow the\n   `_reject_pull_only()` pattern; the mutation\
  \ path's non-host refusal\n   reuses it. The store's existence is the persistent\
  \ record — the flag is\n   the establishment instrument, idempotent over the establishment\
  \ state.\n4. **Doctor (R-4).** `_doctor_repo_report()` gains the non-host\n   classification\
  \ row — `classification=non-host`, no branch-state health\n   verdict — beside the\
  \ existing pull-only row.\n5. **Session-init (R-5).** The child store claims consult\
  \ the same evidence:\n   a non-host child emits neither the `issues:` field line\
