  \ stops at not creating new pollution.\n- **A persistent config file listing host\
  \ children:** rejected — the store's\n  own existence is the persistent state; a\
  \ one-shot adoption flag establishes\n  it without adding a second declaration surface\
  \ to maintain.\n\n## Impact\n\n- **Consumers:** every workspace whose root registers\
  \ child repositories —\n  the tool's discovery, sync, doctor, and mutation paths;\
  \ session-init's\n  per-session repo table and Local Issue Folders section; the\
  \ agents reading\n  them.\n- **Benefit:** content children (wikis, vendored checkouts)\
