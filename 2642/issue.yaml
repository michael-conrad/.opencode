  \ pins the evidence rule's\n   branches (local-only, remote-only, neither, unverifiable-remote)\
  \ and the\n   push gates; the construct-workspace behavioral SCs above execute the\n\
  \   runtime effects.\n\nDiscarded alternatives:\n\n- **Transport-based gating**\
