findings:
  - id: F1
    class: surface coverage (undeclared blast radius) — plan validation standard 14
    ground: >
      The branch diff 2ac8441cb..496a696b4 modifies skills/behavioral-testing/SKILL.md
      and tests-v2/poll-run.sh across five commits (eb045464b, dcd8eeafc,
      1596766c7, 09a69da93, 7577c54cb — poll-report delivery, the per-poll
      standalone-turn rule, the 60-second poll cadence anchoring, and the
      next-cycle banner). Neither file is in the spec's declared blast radius
      (spec.md Impact: "floor.md; the work, plan, implement, skill-creator,
      verify, git-workflow-pr, git-workflow-branch, and git-workflow-cleanup
      cards; tests-v2/behaviors/") and the spec's Dependency states the change
      "reaches no harness file"; the plan's surfaces-touched table and its
      "No harness file is in this change" paragraph contradict the diff. The
      changes carry developer-directive attribution in their commit messages
      and respond to harness-record defects logged in evidence.md, but they are
      recorded in no spec amendment and no plan mid-cycle revision entry — the
      record that conformance duty (implement card's mid-cycle revision duty;
      plan.md's own opening) requires. The skill-creator sourcing clause
      (496a696b4) and the implement card's mid-cycle-spec/plan-revision-duty
      clause (28ea8e2d3) are likewise deck changes on surfaces whose plan items
      (item 4, item 5) enumerate exact clause sets and no plan record admits the
      additions.
    outcome: remediation required — amend plan.md's surfaces-touched table and a
      mid-cycle revision entry (and, where the spec's blast-radius/Dependency
      statements are read strictly, the spec's Impact/Dependency wording) to
      account for the poll-run.sh, behavioral-testing-card, sourcing-clause, and
      mid-cycle-duty additions; or re-home the harness-record fixes in a record
      the spec accounts for.
  - id: F2
    class: internal inconsistency (stale plan statement) — plan validation standard 5
    ground: >
      plan.md's Rollback section states "this change is one commit on top of the
      harness branch" (plus eleven new test files and one deletion). The branch's
      diff is twelve commits (faa527ee3 … 496a696b4), the fixtures now total six
      including the later 2584-sc4 fixture re-scope and the mid-cycle commits, and
      the plan's own mid-cycle revision list records cycles that produced those
      commits — the rollback sentence and the branch it describes tell different
      stories. A factual defect in the plan's rollback procedure (the stated
      reset target no longer describes the branch shape it rolls back).
    outcome: remediation required — conform the Rollback section to the branch's
      actual commit set (or scope the sentence to the base commit faa527ee3 and
      name the mid-cycle commits the reset-to-base would discard).

