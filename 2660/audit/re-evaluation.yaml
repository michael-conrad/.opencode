  loop_state: 'Converging, not spinning: the deliverable''s rules have not changed since the recomposition,
    and the findings are single-finding evidence-section flickers, one of them groundless. In-place revision
    of the rules is over; the audit record is the loop''s history.'
  revisions: 11-16
  counted_at: before revisions 17-19; extended by the ledger below
  falsified: 'In part: its loop_state said the rules were stable since the recomposition, but R-6 gained
    the verify section 3 PASS-bar sentence in revision 11 and R-7 gained its clause home in revision 17
    — the rules were not stable. The ledger and run 4 carry the corrected account.'
  extended_ledger:
