  outcome: recompose
  grounds:
  - Shape, not content, is the defect. Each operative fact of this artifact is stated more than once -
    the scope table, the requirements, the criteria, the evidence, and the traceability line each describe
    the loop's surfaces, bar, record, and trigger in their own words - and nine validation rounds in a
    row found one description out of step with the others. Round 7 found the verify card's bar committed
    in the scope table and carried by no requirement; round 8 found three such elements; round 9 found
    the same class again. Each round's fix moved one description; the shape stayed.
  - The artifact reproduces its own defect class under careful editing. In revision 8, the R-6 extension
    to the verify card's verdict contract was applied and then lost when the edit pass died between two
    steps; the follow-up edit moved the criteria and SC-5's instrument without re-checking the requirement,
    and the next round found precisely that drift - a requirement and its criterion saying different things
    about the same rule. A shape that produces the shape-defect while being edited by a careful agent
    is the recomposition case the rule exists for.
  - 'What it is NOT: the intent is worded clearly and is reachable; the repo boundaries are clean (one
    repository, one concern - the validation loops'' mechanics); the requirements are individually atomic;
    and the count trigger the developer''s restatement asked for is carried correctly and decides nothing,
    exactly as restated.'
  recommendation: 'The recomposition direction is structural, not a split into sibling specs: re-compose
    the artifact so each operative fact is stated once in the section that owns it - surfaces in the scope
    table, rules in the requirements, verification instruments in the criteria, measured history in the
    evidence - and every other mention points at its owner. The artifact''s intent (one loop family''s
    stop trigger, bar, and record) is one concern; splitting it into interdependent sibling specs would
    move the four-descriptions defect into the issue graph, where renumbering and linking make drift harder
    to see. The alternative, should the developer prefer it: the count trigger (the rule this session
    restated four times) moves to its own spec with the loop mechanics as umbrella.'
  authorization: No implementation or PR authorization exists - the artifact is at the spec stage, so
    the recomposition voids nothing to void. The recomposition protocol (the sibling .opencode#2661) is
    specified but unimplemented, so per this spec's own R-3 precondition the Recompose outcome records
    its grounds and escalates to the developer; this record is that escalation.
  loop_state: 'In-place revision is stopped. The round-9 finding (the requirement and the criteria disagreeing
    about which verdict contracts carry the bar) is evidence for the grounds, left unfixed in place on
    purpose: the recompose outcome supersedes further piecemeal revision.'
