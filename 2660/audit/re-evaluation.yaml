runs:
- run: 1
  date: '2026-10-23'
  trigger: 'the spec''s own count trigger (R-1 as amended): more than four revisions to address defects
    — six revisions then taken.'
  rounds_at_run: 4
  findings_at_run: 20
  outcome: sound
  finding: Sound on intent, boundaries, decomposition, and fatness - no recomposition; the scope-alignment
