title: '[SPEC] Validation loop — non-convergence judgment, the factual-defect bar,
  and the validation record'
status: closed
labels:
- needs-approval
- spec
body: '## Problem


  The deck''s validation loops — the spec card''s and plan card''s validation cycles
  and the `verify` card''s review loop — stop on one trigger only: recurrence, the
  spin judgment, *"findings recurring or reshuffling without genuine resolution."*
  A loop whose findings are genuinely new each round never triggers it, however many
  rounds run. Three further defects leave the loop''s other failure shapes unbound:


  - The finding/preference boundary''s determinant is unstated, so each round adjudicated
  "affecting correctness" by effect size: `.opencode#2582`''s round 1 called the same
  stale-line-number-citation class a finding, round 5 disclosed it as a non-finding
  inside a clean PASS — against a bar whose disclosure path had been abolished three
  days earlier (`.opencode` commit `b7ace773`, 2026-10-10). The developer''s ruling:
  *"minor defects compound into serious flaws"* — no noted-but-unfixed bucket.

  - No record makes rounds comparable after the fact: `.opencode#2658` and `#2657`
  hold no audit verdict records — the rounds survive only as commit subjects.

  - `#2606`''s retirement of the one-review bound left one surface unamended: `implementation-workflow.md`''s
  verify-pass row still carries *"one bounded review."*


  The developer''s restated trigger, 2026-10-23 (stated four times this session):
  *"if a spec or plan needs more than 4 revisions to address defects, it needs to
  be re-evaluated for proper decomposition and recomposition taking into account things
  like repo boundaries, separation of concerns, atomic work unit decomposition and
  recomposition needing re-evaluation, or the spec being too fat and needing to split
  up into multiple inter-dependent specs among other possible issues… it may also
  be an indicator that the spec''s intent is poorly worded or not reachable."*


  ## Scope


  Four surfaces in the `.opencode` submodule — the rules'' content lives with their
  R-numbers, never in this table:


  - `skills/spec/references/validation-standards.md` §Verdict contract, §Loop — R-1,
  R-2, R-3, R-4, R-5, R-6: the canonical statement.

  - `skills/plan/references/plan-validation-standards.md` §Verdict contract, §Loop
  — the plan instance, carrying or pointing at the canonical factor set.

  - `skills/verify/SKILL.md` §2, §3, §4 — the review instance: the record pointer,
  the §3 verdict contract (the bar, the zero-finding PASS bar, the recording rule
  reconciled with the record), the churn rule''s prong definition, the canonical factor
  set.

  - `skills/implement/references/implementation-workflow.md` verify-pass row — R-8.


  Untouched: the criteria sets'' defect classes and analysis families; the `verify`
  card''s frontmatter description; the recomposition protocol''s mechanics (the sibling
  `.opencode#2661`); the `skill-creator` admission gate and every other deck-governance
  rule; the `#2658`/`#2659` instances; retrospective record construction; `floor.md`
  (the skill-creator card''s always-loaded-surface discipline governs it).


  ## Approach


  Four rules enter the surfaces the Scope section maps them to, plus one stale gloss
  retired:


  1. **The stop trigger (R-1):** a non-convergence judgment beside the spin judgment,
  and a fact-decidable count trigger — more than four revisions to address findings
  — both opening the same structural re-evaluation; the count mandates the examination
  and never decides its outcome.

  2. **The factor set and outcomes (R-2, R-3):** the named minimum factors, exemplary
  and open; three recorded outcomes — Sound, Recompose, Intent-unreachable — each
  resuming or redirecting the loop.

  3. **The finding bar (R-6):** class-determined in all three verdict contracts —
  a defect the criteria source enumerates is a finding; a preference never is; no
  third category; the determinant stable across rounds and checkable from the record.

  4. **The validation record (R-4, R-5):** one appended file per issue at `.issues/{N}/audit/validation.yaml`,
  carrying the round''s findings, the adjudicated classes with their classifications,
  and a re-evaluation''s outcome and grounds — never a second copy of the verdict.

  5. **The artifacts'' single-sourcing discipline (R-9):** the spec card''s self-containment
  clause and the plan card''s artifact-discipline rule carry it — each operative fact
  stated once in its owning section, every other mention pointing at its owner; the
  loop-engine cure both loops measured.

  6. The stale gloss (R-8): the implementation-workflow verify-pass row stops stating
  a bound of one review.


  Judgment stays judgment throughout — no script. The count is a mandate to examine,
  never a verdict — the discipline that discarded counters as verdicts in `#2606`,
  with the developer''s restatement carried alongside the judgment.


  ## Requirements


  - **R-1 — The stop trigger.** Each of the three loop locations SHALL carry, alongside
  the spin judgment, a **non-convergence judgment**: when the loop''s rounds are incrementally
  progressing — each cycle remediating its findings yet producing genuinely new ones,
  with no obvious convergence — the agent running the loop SHALL stop in-place revision
  and run a structural re-evaluation of the artifact before any further in-place revision.
  The trigger is a judgment stated as such, never scripted. Alongside it, a **count
  trigger**: when the artifact has needed more than four revisions to address findings,
  the loop SHALL run the structural re-evaluation before any further in-place revision.
  The count mandates the examination and never decides its outcome — the re-evaluation''s
  verdict is the judgment, and a re-evaluation may conclude that the artifact stands.

  - **R-2 — The factor set.** The structural re-evaluation SHALL examine, at minimum:
  **repo boundaries**; **separation of concerns**; **atomic work-unit decomposition**;
  **fatness**; and **intent wording/reachability**. The factors are the minimum the
  examination covers — exemplary and open, never a closed checklist — and the examination
  and its verdict are judgment. The plan card''s validation standards and the verify
  card''s review loop SHALL each carry or point to that canonical factor set, so the
  minimum is reachable from every loop the rule governs.

  - **R-3 — The outcomes.** The re-evaluation SHALL resolve to one of three outcomes,
  each recorded, from which the loop resumes or redirects: (a) **Sound** — the findings
  are recorded and the loop resumes on the unchanged artifact; (b) **Recompose** —
  the artifact''s shape is the defect: the split is performed per the recomposition
  protocol the issues card carries, and in-place revision of the pre-split artifact
  is superseded; (c) **Intent-unreachable** — the intent statement is rewritten, and
  the loop continues. A re-evaluation is one of the higher-level fixing attempts the
  existing escalation rule counts; escalation still fires when convergence remains
  unreachable after it. The recomposition protocol is specified in the sibling `.opencode#2661`:
  while it is unimplemented, the Recompose outcome records its grounds and escalates
  to the developer for the split.

  - **R-4 — Where the outcome goes.** The re-evaluation''s outcome and its grounds
  SHALL be recorded in the owning issue''s validation record — never in the artifact''s
  body.

  - **R-5 — The validation record.** The verify card''s §3 recording rule and the
  per-issue validation record are reconciled by this change: the deliverable''s verdict
  is recorded once, in chat or the PR description, and the validation record is the
  loop''s history. Every completed validation cycle SHALL append one entry to the
  owning issue''s validation record (YAML) at `.issues/{N}/audit/validation.yaml`:
  one record file per issue, one top-level section per artifact under validation (spec,
  plan, implementation); each entry carrying the round''s findings, every defect class
  the round adjudicated **with its classification** (a finding or a preference) and,
  for a finding, its remediation performed or the outcome reached, including the terminal
  cycle; and, when a cycle ran the structural re-evaluation, the re-evaluation''s
  outcome and its grounds. The recorded class is the criteria source''s enumerated
  defect class or analysis family wherever one applies, and the recorded factual kinds
  are the entry''s detail, exemplars of the class rather than a closed list; an adjudicated
  preference records the class or family it was adjudicated under with its classification;
  the same defect carries the same label in every round, so that two rounds'' entries
  for one defect compare. A round whose entry lists no finding is a zero-finding round.
  The record lives beside the artifact and never inside the spec or plan body. A cycle
  whose artifact belongs to no issue in a store records per the verify card''s own
  recording rule and appends no store record. A cycle''s judgment cites the record.

  - **R-6 — The finding bar.** Both criteria sources'' verdict contracts, and the
  verify card''s §3 verdict contract, SHALL state the finding/preference boundary
  as class-determined: a **defect the criteria source enumerates** — any of its enumerated
  defect classes or analysis families, whether or not it misstates fact — is a finding,
  and within that bucket a **factual defect** (a statement that misstates fact) is
  a finding regardless of how small its effect is; a **preference** — style, phrasing
  taste, a hypothetical improvement — is never a finding; and no third category exists:
  a substantive observation is reported as a finding, and nothing is recorded as an
  observation without being a finding. The same defect class SHALL be classified the
  same way in every round, and the validation record''s per-round classification of
  each adjudicated class is what makes that checkable. The churn rule''s verbatim
  form is unchanged: where the audited artifact is a spec or a plan, its "correctness"
  prong means the artifact''s factual accuracy and the completeness of its impact
  enumeration; where it is a code deliverable, the prong keeps its existing meaning
  — the deliverable''s behavior, and the defects that affect correctness or the stated
  requirements — the redefinition does not narrow it.

  - **R-7 — The bars stand.** The findings-are-fixed requirement — findings are never
  negotiated away — and criteria invariance SHALL stand unchanged, and SHALL never
  be satisfied by a round count.

  - **R-9 — The artifacts'' single-sourcing discipline.** The spec card''s §5 self-containment
  clause SHALL carry the discipline this artifact''s own loop measured: an artifact
  states each operative fact once, in the section that owns it — surfaces in the scope
  table, rules in the requirements, checks as mappings whose element lists the mapped
  requirement owns, measured history in the evidence — with the artifact''s own loop
  history deferred to the issue''s record — and every other mention points at its
  owner. The plan card''s artifact-discipline rule (its §5) SHALL carry the parallel
  statement in plan voice. The discipline is the measured cure for the loop engine:
  the round ledger of this artifact and of `.opencode#2662` shows the findings concentrating
  wherever a fact was stated more than once.

  - **R-8 — The stale gloss.** The implementation-workflow reference''s verify-pass
  row SHALL describe its step consistently with the verify card''s review loop — the
  step reaches a zero-finding verdict under the FAIL path — and SHALL no longer state
  a bound of one review.


  ## Success criteria


  | ID | Criterion | Class | Instrument |

  |----|-----------|-------|------------|

  | SC-1 | R-1''s two triggers and its citation rule are carried complete in all three
  loop locations, and the code-deliverable reading of the churn rule is untouched
  wherever it appears | structural | Read the three loop locations; assert every element
  R-1 names in each, and assert the churn rule''s code-deliverable reading untouched
  wherever the churn rule appears |

  | SC-2 | R-2''s factor set is stated canonically, the exemplary-and-open clause
  is present, and the plan and verify loop locations carry or point to it | structural
  | Read `validation-standards.md` §Loop; assert R-2''s elements; read `plan-validation-standards.md`
  §Loop and `verify/SKILL.md` §4 and assert each carries or points to the canonical
  factor set |

  | SC-3 | R-3''s three outcomes and behaviors are stated in all three loops, the
  re-evaluation counts as a higher-level fixing attempt, and the Recompose outcome
  carries its precondition for the unimplemented protocol | structural | Read the
  three loop locations; assert R-3''s elements in each |

  | SC-4 | R-4 and R-5''s record convention is stated canonically exactly once and
  the other two locations bind to it — the path, the per-round entries, the section-per-artifact
  shape, the no-verdict-copy clause, the grounds slot | structural | Read the three
  loop locations; assert the canonical statement carries R-4/R-5''s elements and the
  other two reference it; assert no rule records rounds inside a spec or plan body
  |

  | SC-5 | R-6''s finding bar is stated in all three verdict contracts with exactly
  two categories, the no-third-category clause, and the stability clause | structural
  | Read `validation-standards.md`, `plan-validation-standards.md`, and `verify/SKILL.md`
  §3 verdict contracts; assert R-6''s elements in each, and the verify §3 zero-finding
  PASS bar |

  | SC-6 | R-7''s requirements stand unchanged, and the churn rule''s wording is unchanged
  in all three loop locations against the pre-change file bodies | structural | Read
  the three loop locations and their findings-are-fixed and criteria-invariance passages
  against the deck repository''s pre-change file bodies from its git history; assert
  the churn rule''s wording unchanged |

  | SC-7 | R-8''s verify-pass row binds its step to the FAIL path and states no one-review
  bound | structural | Read the row; assert R-8''s elements |

  | SC-8 | R-5''s record entry shape is decidable for later judgment: same-class entries
  reveal classification consistency, and each entry alone shows the round''s findings,
  the adjudicated classes with their classifications, the remediation or outcome reached,
  and a re-evaluation''s outcome and grounds | structural | Read the canonical record
  mechanics; assert R-5''s entry-shape elements |

  | SC-10 | R-6''s prong definition holds in both directions: the spec/plan prong
  defined, the code-deliverable reading untouched, the churn rule''s wording unchanged
  | structural | Read the three loop locations against the pre-change file bodies;
  assert the spec/plan prong definition, the code-deliverable reading untouched, and
  the churn rule''s wording unchanged |

  | SC-9 | The loop behaves: the judgment fires on genuinely new shallow findings,
  the count fires independently of the judgment, and the behavioral test writes nothing
  into the production record | behavioral | Tier-1 clean-room behavioral dispatch
  per the `behavioral-testing` card: dispatch a sub-agent with no prior context to
  run the revised loop rule against two engineered artifacts — one whose rounds yield
  genuinely new shallow findings with no obvious convergence, one whose rounds do
  not — each through at least five revisions; from the recorded dispatch evidence
  (prompt and observed output persisted in the owning issue''s artifact area) assert
  the re-evaluation fired in the first run by the judgment, that in the second run
  it fired after the fifth revision on the count alone, and that the dispatch evidence
  record carries the outcome and its grounds; the behavioral test writes no entry
  in the production validation record — R-5''s carve-out applies; modeled on `.opencode/.issues/2582/audit/tier1-dispatch-SC15-20261013.yaml`
  |


  ## Out of scope


  - The criteria sets'' defect classes and analysis families.

  - The `verify` card''s frontmatter description.

  - The recomposition protocol''s own mechanics — the sibling `.opencode#2661`.

  - The `skill-creator` admission gate and every other deck-governance rule.

  - The `#2658` recomposition and `#2659` store repairs — instances, tracked in their
  own issues.

  - Retrospective validation-record construction for existing issues.

  - `floor.md`.


  ## Impact


  Consumers: every validation loop in the family — spec, plan, and deliverable review
  — gains the stop trigger that fires on the measured shape, a cross-round-stable
  finding bar, and an evidence base. Risks: the trigger firing too readily — bounded
  by the recorded outcome and the record, which make the judgment auditable; the record''s
  entry shape drifting toward a second verdict surface — bounded by R-5''s no-verdict-copy
  clause and the verify card''s "record it once" reconciled alongside it. Blast radius:
  the four surfaces above; no tool, harness, hook, or script surface changes.


  > Full spec and plan artifacts: https://github.com/michael-conrad/.opencode/tree/issues-data/2660/


