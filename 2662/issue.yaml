  instructs the agent to post a tracker comment | structural | Read `guidelines/deprecation-encounter-protocol.md`
  R-4; assert the route present; grep the live deck''s `skills/`, `guidelines/`, and
  `floor.md` and confirm no other instruction to post a tracker comment remains outside
  the amended channel rule |

  | SC-16 | Each non-canonical cross-reference in an amended card reads in the canonical
  `Read [Text](path)` form, and no amended card retains a markdown link to another
  deck file that lacks the canonical form | structural | Read each of the six amended
  cards; assert each of the six cross-references named in R-16 carries the canonical
  form, and that no further non-canonical link to a deck file remains in them (the
  `reference-integrity` tool inspects canonical links only, so this check is by reading)
