title: '[SPEC] Stakeholder-channel rule — the tracker-comment gate, the internal default,
  and the channel map'
status: open
labels:
- needs-approval
- spec
body: '## Problem


  The live deck has no rule that keeps the agent''s own working content off the remote
  issue tracker, and no card that names the route for an escalation, a clarification
  request, or a state update. The deck''s only instruction on *when* to post a comment
  is `skills/issues/SKILL.md` §3: a remote comment is posted "only for a major substantive
  change that needs special attention — findings or decisions a stakeholder must see,"
  with three exclusions (progress narration, internal reasoning, routine status) that
  "stay in chat or the local store." One further live instruction appends content
  to a tracker — `guidelines/deprecation-encounter-protocol.md` R-4: "Found → append
  the encounter evidence as a comment."


  The developer''s observed failures are the agent''s escalation reports, clarification
  requests, reasoning, chat and session-transcript excerpts, and pipeline-state updates.
  The gate''s **predicate has no falsifier**: "needs special attention" and "must
  see" are satisfied by anything the agent finds interesting, so an escalation report
  and a clarification request each read as "a finding a stakeholder must see" and
  pass the gate. The exclusions reach one of the five classes (internal reasoning)
  and miss the other four; and none of the five has a stated route, so where the exclusion
  is not recognized the agent has nowhere else to put the content. The channel vacuum
  compounds it: the implementation-workflow reference says to "report the state, the
  blocker, and what is needed," the `verify` card says escalation "fires" to the developer,
  the `git-workflow-pr` card says "Notify and stop," the floor''s standing formula
  says to halt with an open-ended clarification request — none names where the report
  goes, and the tracker is the surface that persists, is developer-visible, and already
  carries pipeline state.


  The deck already holds the governing principle — `skills/correspondence/SKILL.md`
  §1: "Internal findings, audit output, and raw progress go to chat — never to stakeholder
  channels," with a description that already claims the decision ("when deciding whether
  content belongs in a stakeholder channel at all") — but no card ever names an issue
  comment as a stakeholder channel.


  ## Scope


  Ten files in the `.opencode` submodule — six cards, three card-owned reference files,
  one guideline. The spec''s §2.1 and §2.2 hold the single inventory; rows marked
  **producer** are the escalation or clarification producers the route clause binds.


  - `skills/correspondence/SKILL.md` — description and body: the channel set, the
  stakeholder-notice class, the internal class naming the observed failure classes,
  the default under uncertainty, the route per class, the no-read-back rule, PR-comment
  parity, and the statement that the tracker''s labels and closure state are the `issues`
  card''s surfaces. The card''s existing format rules (§2 executive-summary format,
  §5 identity byline) are unchanged and continue to govern a tracker comment; the
  retired card''s per-comment-type templates are not restored.

  - `skills/issues/SKILL.md` §3 and description — §3 defers to the channel rule and
  states the caller-side discipline (gate evaluated before committing to post; posting
  is not the default); the description''s summary of the gate is corrected, so the
  router no longer reads as banning progress narration only.

  - **Producers amended** (each names its route and its recipient — the developer,
  in chat): `skills/verify/SKILL.md` §4; `skills/spec/references/validation-standards.md`
  escalation paragraph; `skills/plan/references/plan-validation-standards.md` escalation
  paragraph; `skills/implement/references/implementation-workflow.md` escalation rule;
  `skills/implement/SKILL.md` §8; `skills/work/SKILL.md` closing paragraph; `skills/git-workflow-pr/SKILL.md`
  §6; `guidelines/deprecation-encounter-protocol.md` R-3.

  - `skills/work/SKILL.md` §4 — the work record''s contents never become a tracker
  comment; durable state lives in the local issue store and the artifacts.

  - `guidelines/deprecation-encounter-protocol.md` R-4 — the encounter-evidence append
  is routed to the ticket''s store record, not to a tracker comment.


  **Producers covered without amendment**, with the reason: `skills/spec/SKILL.md`
  §9 and `skills/implement/SKILL.md` §13 (deprecation escalation — defers to the amended
  protocol); `skills/skill-creator/SKILL.md` and `skills/explore/SKILL.md` (their
  questions are asked in the session — chat by construction); `floor.md`''s standing
  formula (untouched; the rule carries the route).


  Untouched: `floor.md` (a substantive write triggers the ainglish whole-card-on-touch
  conversion of the whole floor); the `spec`, `plan`, `research`, `skill-creator`,
  `explore`, `behavioral-testing`, `gh-cli`, and `gb-cli` cards; the `git-workflow-pr`
  PR-body rule; the `issues` card''s label clause (§2) and ticket-state hygiene (§6)
  — the channel rule''s carve-out keeps the two surfaces consistent; the criteria
  sets'' defect classes, verdict contracts, analysis families, and loop mechanics;
  the `local-issues` tool; `tests-v2/`; the `skill-creator` admission gate.


  **Extent:** the edit to each card is larger than the deltas above. Under the ainglish
  discipline''s whole-card-on-touch rule, each amended card''s entire normative prose
  is returned under the discipline, and the six non-canonical cross-references in
  the amended cards convert to the canonical form (R-14, R-16).


  ## Approach


  One rule, one home, no mechanism. The `correspondence` card is widened to own the
  **channel decision** — which surface a piece of agent-generated content belongs
  on, and in what form — and its description is widened to name every surface on which
  the agent publishes generated content, so the card is loaded at the moment the agent
  chooses between a working surface and a stakeholder surface. The card''s body gains
  the channel set (stakeholder surfaces against working surfaces), a **falsifiable**
  remote class (a stakeholder notice: content whose reader must take a specific action
  before the work can continue), the **named** internal class (the five observed failure
  classes, plus progress narration and audit and verification verdicts), the **default
  under uncertainty** (the working surface, with the asymmetry that decides the tie:
  a notice can be added later, published narration cannot be withdrawn), the **route**
  for each class (chat for the live exchange; the local issue store for the record;
  the artifacts for the durable trace; the artifact edited in place for a correction),
  and the no-read-back rule (a tracker comment is never an answer, an authorization,
  or a record the agent reads back). `skills/issues/SKILL.md` §3 keeps a pointer and
  the caller-side discipline the retired card carried. Every escalation and clarification
  producer in the live deck states its route and its recipient, so the vacuum is closed
  at each producer and not only at the gate. The rule is stated centrally *and* at
  each producer: the escalation rule appears in three places — the two criteria-set
  files carry the same paragraph, and the `verify` card''s copy differs slightly —
  and a route stated in one and not the others leaves the deck stating one rule two
  ways.


  The change adds **no script, no wrapper, no tool command, no classifier, and no
  threshold** — the rule is judgment. The pre-rip deck''s scripted instruction surfaces
  are preserved in `attic/` after the #2490 rewrite, and the developer''s ruling in
  this session is explicit: scripting produces decks that have to be trashed and replaced.
  The agent in the reported situation is already rogue and would work around any interlock,
  so the deliverable is a rule that is true, findable, and correct on its default
  path.


  ## Requirements


  - **R-1** — The `correspondence` card SHALL name the channel set: the stakeholder
  channels (an issue comment, a pull-request body, a pull-request comment, a wiki
  page, a release note, correspondence) and the working surfaces (chat, the local
  issue store, the artifacts under an issue''s folder); SHALL state that the card
  owns the channel decision while the card owning a surface owns that surface''s mechanics;
  and SHALL state that the issue tracker''s labels and closure state are the `issues`
  card''s surfaces, outside this rule''s scope.

  - **R-2** — The `correspondence` skill description SHALL name each of the six stakeholder
  channels enumerated in R-1 and chat, and SHALL state the decision the card owns;
  so that the card is loaded at the moment the agent chooses between a working surface
  and a stakeholder surface.

  - **R-3** — The rule SHALL state the positive remote class with a falsifier: a remote
  issue comment is a stakeholder notice — content whose reader must take a specific
  action before the work can continue; and SHALL name the qualifying kinds (a decision,
  a scope change, a finding, a status the reader must act on) — those kinds being
  the ones outside the internal class named in R-4, so that no content is qualified
  by R-3 and forbidden by R-4.

  - **R-4** — The rule SHALL name the content that never reaches a remote issue comment
  or a pull-request comment, and the named set SHALL include every observed failure
  class: escalation reports, clarification requests, the agent''s reasoning, chat
  and session-transcript excerpts, and pipeline state — together with progress narration
  and audit and verification verdicts.

  - **R-5** — The rule SHALL state that the default under uncertainty is the working
  surface, and SHALL state the asymmetry that decides the tie: a stakeholder notice
  can be added later, and published narration cannot be withdrawn.

  - **R-6** — The rule SHALL name the route for each class: chat for a live exchange
  (an escalation, a clarification request), the local issue store for the record —
  naming both the `local-issues comment --number repo#N --type internal` command and
  the `local-issues update --number repo#N --status`/`--phase` state fields — the
  artifacts for the durable trace, and the artifact edited in place for a correction.

  - **R-7** — The rule SHALL state that a tracker comment is never an answer, an authorization,
  or a record the agent reads back.

  - **R-8** — Each producer listed in §2.1 as carrying a route SHALL state its route
  and its recipient — the developer, in chat. The producers are the `verify` card''s
  escalation rule, the spec card''s validation standards'' escalation rule, the plan
  card''s validation standards'' escalation rule, the implementation-workflow reference''s
  escalation rule, the `implement` card''s narration-to-deliverable halt, the `work`
  card''s closing halt clause, the `git-workflow-pr` card''s terminal instruction,
  and the deprecation protocol''s R-3 escalation. Each producer listed in §2.2 as
  covered already states its route — in the session, or by deferring to a surface
  this change amends.

  - **R-9** — The `work` card''s work-record rule SHALL state that the work record''s
  contents never become a tracker comment, and SHALL name the local issue store and
  the artifacts as the durable destinations for the state it holds.

  - **R-10** — The `issues` card''s comment gate SHALL defer to the channel rule through
  the deck''s canonical link form, SHALL state that the gate is evaluated before the
  agent commits to posting and that posting is not the default outcome, and the card''s
  description SHALL no longer summarize the gate as a bar on progress narration only.

  - **R-11** — The rule SHALL state that a pull-request comment follows the same gate
  as an issue comment; the `git-workflow-pr` card''s PR-body rule continues to stand.

  - **R-12** — The change SHALL add no script, no wrapper, no tool command, no classifier,
  and no size or count threshold.

  - **R-13** — The change SHALL touch no file outside the surfaces listed in §2.1.

  - **R-14** — Each amended card''s full normative prose SHALL be returned under the
  ainglish writing discipline, per that discipline''s whole-card-on-touch rule — the
  card''s entire normative prose written so the reader cannot misbind it, with the
  misbindings the conversion surfaces resolved — and each amended reference file''s
  and the guideline''s normative prose SHALL be returned under the discipline on touch.
  The conversion SHALL preserve the prose''s substance, changing nothing beyond this
  spec''s rules.

  - **R-15** — The deprecation protocol''s encounter-evidence append SHALL be routed
  to the ticket''s store record rather than to a tracker comment, so that the protocol''s
  evidence log does not create a second channel for working content.

  - **R-16** — Each non-canonical cross-reference in an amended card SHALL convert
  to the canonical `Read [Text](path)` form, per the skill-creator card''s forwards-only
  rule ("existing content converts when touched"): the `issues` card''s remote-body-format
  reference, the `verify` card''s two validation-standards references, the `implement`
  card''s change-gate and deprecation-protocol references, and the `work` card''s
  deprecation-protocol reference.


  ## Success criteria


  | ID | Criterion | Class | Instrument |

  |----|-----------|-------|------------|

  | SC-1 | The `correspondence` card names the six stakeholder channels and the three
  working surfaces, states that the card owns the channel decision while the card
  owning a surface owns that surface''s mechanics, and states that the tracker''s
  labels and closure state are the `issues` card''s surfaces outside the rule''s scope
  | structural | Read `skills/correspondence/SKILL.md`; assert each channel and working
  surface named, the jurisdiction clause present, and the labels-and-closure carve-out
  present |

  | SC-2 | The `correspondence` skill description names each of the six stakeholder
  channels enumerated in R-1 and chat, and states the decision the card owns | structural
  | Read the frontmatter description; assert each of the seven surfaces named and
  the decision stated |

  | SC-3 | The rule states the positive remote class with a falsifier — a remote issue
  comment is a stakeholder notice, content whose reader must take a specific action
  before the work can continue — names the qualifying kinds, and states that those
  kinds are the ones outside R-4''s internal class | structural | Read the rule text;
  assert the predicate, each named kind, and the precedence clause present |

  | SC-4 | The rule names as content that never reaches a remote issue comment or
  a pull-request comment: escalation reports, clarification requests, the agent''s
  reasoning, chat and session-transcript excerpts, pipeline state, progress narration,
  and audit and verification verdicts | structural | Read the rule text; assert each
  of the seven named, and that the prohibition is scoped to comments rather than to
  the tracker as a whole |

  | SC-5 | The rule states that the default under uncertainty is the working surface
  and states the asymmetry that decides the tie | structural | Read the rule text;
  assert the default clause and the asymmetry clause present |

  | SC-6 | The rule names the route for each class — chat for the live exchange, the
  local issue store for the record (naming the `local-issues comment --type internal`
  command and the `local-issues update --status`/`--phase` state fields), the artifacts
  for the durable trace, the artifact edited in place for a correction | structural
  | Read the rule text; assert each route present, the comment command named, and
  both state fields named |

  | SC-7 | The rule states that a tracker comment is never an answer, an authorization,
  or a record the agent reads back | structural | Read the rule text; assert all three
  exclusions present |

  | SC-8 | Each of the eight producers named in R-8 states its route and its recipient
  — the developer, in chat | structural | Read §2.1''s producer surfaces; assert the
  route clause and the recipient present in each of the eight |

  | SC-9 | The `work` card''s work-record rule states that the work record''s contents
  never become a tracker comment and names the local issue store and the artifacts
  as the durable destinations | structural | Read `skills/work/SKILL.md` §4; assert
  the prohibition and both destinations present |

  | SC-10 | The `issues` card''s comment gate defers to the channel rule through the
  deck''s canonical link form, states that the gate is evaluated before the agent
  commits to posting and that posting is not the default outcome, and the card''s
  description no longer summarizes the gate as a bar on progress narration only |
