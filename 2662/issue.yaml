title: '[SPEC] Stakeholder-channel rule — the tracker-comment gate, the internal default,
  and the channel map'
status: open
labels:
- needs-approval
- spec
body: '## Problem


  The live deck has no rule that keeps the agent''s own working content off the remote
  issue tracker, and no card that names the route for an escalation, a clarification
  request, a report to the developer, or a state update. The deck''s only instruction
  on *when* to post a comment is `skills/issues/SKILL.md` §3: a remote comment is
  posted "only for a major substantive change that needs special attention — findings
  or decisions a stakeholder must see," with three exclusions (progress narration,
  internal reasoning, routine status) that "stay in chat or the local store." One
  further live instruction appends content to a tracker — `guidelines/deprecation-encounter-protocol.md`
  R-4: "Found → append the encounter evidence as a comment."


  The developer''s observed failures are the agent''s escalation reports, clarification
  requests, reasoning, chat and session-transcript excerpts, and pipeline-state updates.
  The gate''s **predicate has no falsifier**: "needs special attention" and "must
  see" are satisfied by anything the agent finds interesting, so an escalation report
  and a clarification request each read as "a finding a stakeholder must see" and
  pass the gate. The exclusions reach one of the five classes (internal reasoning)
  and miss the other four; and none of the five has a stated route, so where the exclusion
  is not recognized the agent has nowhere else to put the content. The channel vacuum
  compounds it: the implementation-workflow reference says to "report the state, the
  blocker, and what is needed," the `verify` card says escalation "fires" to the developer,
  the `git-workflow-pr` card says "Any failure → halt and report the gap," the floor''s
  standing formula says to halt with an open-ended clarification request — none names
  where the report goes, and the tracker is the surface that persists, is developer-visible,
  and already carries pipeline state.


  The deck already holds the governing principle — `skills/correspondence/SKILL.md`
  §1: "Internal findings, audit output, and raw progress go to chat — never to stakeholder
  channels," with a description that already claims the decision ("when deciding whether
  content belongs in a stakeholder channel at all") — but no card ever names an issue
  comment as a stakeholder channel.


  ## Scope


  Three files in the `.opencode` submodule — two cards and one guideline:


  - `skills/correspondence/SKILL.md` — description and body: the channel set, the
  stakeholder-notice class with its falsifier, the internal class naming the observed
  failure classes, the default under uncertainty, the route per class, the class-coverage
  statement for developer-directed content, the no-read-back rule, the pull-request
  surfaces, and the statement that the tracker''s labels and closure state are the
  `issues` card''s surfaces. The card''s §1 audience-separation sentence is superseded
  by the rule, which states the same principle with the channel set and the classes
  made explicit; the card''s §2 (executive-summary format) and §5 (identity byline)
  are unchanged and continue to govern a stakeholder notice; the retired card''s per-comment-type
  templates are not restored.

  - `skills/issues/SKILL.md` §3 and description — §3 defers to the channel rule and
  states the caller-side discipline (gate evaluated before committing to post; posting
  is not the default); the description''s summary of the gate is corrected, so the
  router no longer reads as banning progress narration only; the card''s one non-canonical
  cross-reference converts to the canonical form.

  - `guidelines/deprecation-encounter-protocol.md` R-4 — both encounter-evidence append
  sites are routed to the ticket''s store record, so the deck carries no live instruction
  to publish working content on the tracker.


  Untouched: `floor.md` (the skill-creator card''s always-loaded-surface discipline
  and its cost rule — "each slip fattens every session, and the slips add up," admission-gate
  item 8); the deck''s escalation, clarification, report, and consultation producers
  — each produces developer-directed content, which the rule routes to chat by class;
  the per-producer route clauses are a recorded follow-on; the `spec`, `plan`, `research`,
  `behavioral-testing`, `gh-cli`, and `gb-cli` cards; the `git-workflow-pr` card;
  the `issues` card''s label clause (§2) and ticket-state hygiene (§6) — the deck''s
  live position on labels is that clause, this change leaves it in place deliberately,
  and the rule''s carve-out keeps the two surfaces consistent; the criteria sets''
  defect classes, verdict contracts, analysis families, and loop mechanics; the `local-issues`
  tool; `tests-v2/`; the `skill-creator` admission gate.


  **Extent:** the edit to each card is larger than the deltas above. Under the ainglish
  discipline''s whole-card-on-touch rule, each amended card''s entire normative prose
  is returned under the discipline (R-14).


  ## Approach


  One rule, one home, no mechanism. The `correspondence` card is widened to own the
  **channel decision** — which surface a piece of agent-generated content belongs
  on, and in what form — and its description is widened to name every surface on which
  the agent publishes generated content, so the card is loaded at the moment the agent
  chooses between a working surface and a stakeholder surface. The card''s body gains
  the channel set (stakeholder surfaces against working surfaces), a **falsifiable**
  remote class (a stakeholder notice: content whose reader must take a specific action
  before the work can continue), the **named** internal class (the five observed failure
  classes, plus progress narration and audit and verification verdicts), the **default
  under uncertainty** (the working surface, with the asymmetry that decides the tie:
  a notice can be added later, published narration cannot be withdrawn), the **route**
  for each class (chat for the live exchange; the local issue store for the record;
  the artifacts for the durable trace; the artifact edited in place for a correction),
  the **class-coverage statement** (developer-directed content — an escalation, a
  clarification request, a report, a consultation — reaches the developer in chat,
  whichever card produces it), and the no-read-back rule (a tracker comment is never
  an answer, an authorization, or a record the agent reads back). The card''s existing
  §1 audience-separation sentence is superseded by the rule, so the card states the
  principle once — with the terms bound — and the live deck''s separation is extended
  to every stakeholder surface rather than narrowed to comments. `skills/issues/SKILL.md`
  §3 keeps a pointer and the caller-side discipline the retired card carried. The
  deprecation protocol''s two encounter-evidence appends are rerouted to the ticket''s
  store record, because they are live instructions to publish working content on the
  tracker — the one surface the rule would otherwise contradict.


  The change adds **no script, no wrapper, no tool command, no classifier, and no
  threshold** — the rule is judgment. The pre-rip deck''s scripted instruction surfaces
  are preserved in `attic/` after the #2490 rewrite, and the developer''s ruling in
  this session is explicit: scripting produces decks that have to be trashed and replaced.
  The agent in the reported situation is already rogue and would work around any interlock,
  so the deliverable is a rule that is true, findable, and correct on its default
  path.


  ## Requirements


  - **R-1** — The `correspondence` card SHALL name the channel set: the stakeholder
  channels (an issue comment, a pull-request comment, a wiki page, a release note,
  correspondence, and a pull-request body, whose form the `git-workflow-pr` card owns)
  and the working surfaces (chat, the local issue store, the artifacts under an issue''s
  folder); SHALL state that the card owns the channel decision while the card owning
  a surface owns that surface''s form; and SHALL state that the issue tracker''s labels
  and closure state are the `issues` card''s surfaces, outside this rule''s scope.

  - **R-2** — The `correspondence` skill description SHALL name each of the six stakeholder
  channels enumerated in R-1 and chat, and SHALL state the decision the card owns;
  so that the card is loaded at the moment the agent chooses between a working surface
  and a stakeholder surface.

  - **R-3** — The rule SHALL state the positive remote class with a falsifier: a stakeholder
  notice is content whose reader must take a specific action before the work can continue
  — a decision, a scope change, a finding (a specific, evidenced result the reader
  must act on), or a status the reader must act on — and SHALL state that those kinds
  are the ones outside the internal class named in R-4, so that no content is qualified
  by R-3 and forbidden by R-4.

  - **R-4** — The rule SHALL name the content that never reaches a stakeholder surface,
  and the named set SHALL include every observed failure class: escalation reports,
  clarification requests, the agent''s reasoning and analysis output, chat and session-transcript
  excerpts, and pipeline state — together with progress narration and audit and verification
  verdicts.

  - **R-5** — The rule SHALL state that the default under uncertainty is the working
  surface, and SHALL state the asymmetry that decides the tie: a stakeholder notice
  can be added later, and published narration cannot be withdrawn.

  - **R-6** — The rule SHALL name the route for each class: chat for a live exchange
  (an escalation, a clarification request, a report to the developer), the local issue
  store for the record — naming both the `local-issues comment --number repo#N --type
  internal` command and the `local-issues update --number repo#N --status`/`--phase`
  state fields — the artifacts for the durable trace, and the artifact edited in place
  for a correction.

  - **R-7** — The rule SHALL state that a tracker comment is never an answer, an authorization,
  or a record the agent reads back.

  - **R-8** — The rule SHALL state the class coverage: developer-directed content
  — an escalation, a clarification request, a report to the developer, a consultation
  — reaches the developer in chat, whichever card produces it; and a card''s own escalation
  or halt rule names no channel of its own and takes this one.

  - **R-9** — The `issues` card''s comment gate SHALL defer to the channel rule through
  the deck''s canonical link form, SHALL state that the gate is evaluated before the
  agent commits to posting and that posting is not the default outcome, and the card''s
  description SHALL no longer summarize the gate as a bar on progress narration only.

  - **R-10** — The deprecation protocol''s two encounter-evidence append sites — the
  "Found → append the encounter evidence as a comment" clause and the duplicates bullet''s
  "appending its encounter evidence to the first ticket" — SHALL be routed to the
  ticket''s store record rather than to a tracker comment, so that the deck carries
  no live instruction to publish working content on the tracker.

  - **R-11** — The rule SHALL state that a pull-request comment follows the same gate
  as an issue comment, and that a pull-request body is a merge artifact whose form
  the `git-workflow-pr` card owns and which carries a notice by construction.

  - **R-12** — The `correspondence` card''s §1 audience-separation sentence SHALL
  be superseded by the rule, so that the card states the audience-separation principle
  once — with the channel set, the classes, and the terms bound — and the live deck''s
  separation is extended to every stakeholder surface rather than narrowed to comments.

  - **R-13** — The `issues` card''s one non-canonical cross-reference SHALL convert
  to the canonical `Read [Text](path)` form, per the skill-creator card''s forwards-only
  rule ("existing content converts when touched").

  - **R-14** — Each amended card''s full normative prose SHALL be returned under the
  ainglish writing discipline, per that discipline''s whole-card-on-touch rule, whose
  trigger names a card — the card''s entire normative prose written so the reader
  cannot misbind it, with the misbindings the conversion surfaces resolved — and the
  guideline''s amended passage SHALL be written under the discipline, which governs
  the normative prose the agent authors. The conversion SHALL preserve the prose''s
  substance, changing nothing beyond this spec''s rules.


  ## Success criteria


  | ID | Criterion | Class | Instrument |

  |----|-----------|-------|------------|

  | SC-1 | The `correspondence` card names the six stakeholder channels and the three
  working surfaces, states that the card owns the channel decision while the card
  owning a surface owns that surface''s form, and states that the tracker''s labels
  and closure state are the `issues` card''s surfaces outside the rule''s scope |
  structural | Read `skills/correspondence/SKILL.md`; assert each channel and working
  surface named, the jurisdiction clause present, and the labels-and-closure carve-out
  present |

  | SC-2 | The `correspondence` skill description names each of the six stakeholder
  channels enumerated in R-1 and chat, and states the decision the card owns | structural
  | Read the frontmatter description; assert each of the seven surfaces named and
  the decision stated |

  | SC-3 | The rule states the positive remote class with a falsifier — a stakeholder
  notice is content whose reader must take a specific action before the work can continue
  — names the qualifying kinds including the finding as a specific, evidenced result,
  and states that those kinds are the ones outside R-4''s internal class | structural
  | Read the rule text; assert the predicate, each named kind with the finding qualified,
  and the precedence clause present |

  | SC-4 | The rule names as content that never reaches a stakeholder surface: escalation
  reports, clarification requests, the agent''s reasoning and analysis output, chat
  and session-transcript excerpts, pipeline state, progress narration, and audit and
  verification verdicts | structural | Read the rule text; assert each of the seven
  named, and that the prohibition is scoped to stakeholder surfaces — with the tracker''s
  labels and closure state carved out by R-1''s clause — rather than to the tracker
  as a whole |

  | SC-5 | The rule states that the default under uncertainty is the working surface
  and states the asymmetry that decides the tie | structural | Read the rule text;
  assert the default clause and the asymmetry clause present |

  | SC-6 | The rule names the route for each class — chat for the live exchange, the
  local issue store for the record (naming the `local-issues comment --type internal`
  command and the `local-issues update --status`/`--phase` state fields), the artifacts
  for the durable trace, the artifact edited in place for a correction | structural
  | Read the rule text; assert each route present, the comment command named, and
  both state fields named |

  | SC-7 | The rule states that a tracker comment is never an answer, an authorization,
  or a record the agent reads back | structural | Read the rule text; assert all three
  exclusions present |

  | SC-8 | The rule states the class coverage — developer-directed content reaches
  the developer in chat whichever card produces it, and a card''s own escalation or
  halt rule names no channel of its own and takes this one | structural | Read the
  rule text; assert the class-coverage clause and the inheritance clause present |

  | SC-9 | The `issues` card''s comment gate defers to the channel rule through the
  deck''s canonical link form, states that the gate is evaluated before the agent
  commits to posting and that posting is not the default outcome, and the card''s
  description no longer summarizes the gate as a bar on progress narration only |
  structural | Read `skills/issues/SKILL.md` §3 and its description; assert the link
  form and both clauses, and that the description''s summary is not the progress-narration
  bar; run `.opencode/tools/reference-integrity` and confirm the link resolves |

  | SC-10 | Both of the deprecation protocol''s encounter-evidence append sites are
  routed to the ticket''s store record rather than to a tracker comment, and no live
  card instructs the agent to publish agent-generated working content as a tracker
  comment | structural | Read `guidelines/deprecation-encounter-protocol.md` R-4;
  assert the route present in both clauses; grep the live deck''s `skills/`, `guidelines/`,
  and `floor.md` and confirm no instruction remains to publish agent-generated working
  content as a tracker comment, excluding the `gb-cli` card''s state-mutation comment
  route and command patterns |

  | SC-11 | The rule states that a pull-request comment follows the same gate as an
  issue comment, and that a pull-request body is a merge artifact whose form the `git-workflow-pr`
  card owns and which carries a notice by construction | structural | Read the rule
  text and `skills/git-workflow-pr/SKILL.md` §4; assert both clauses and that §4''s
  rule is unchanged |

  | SC-12 | The `correspondence` card states the audience-separation principle once:
  its §1 sentence is superseded by the rule, and no second statement of the principle
  with an unbound "internal findings" term remains | structural | Read `skills/correspondence/SKILL.md`;
  assert §1''s sentence is gone, the rule''s statement present, and that the terms
  "internal" and "finding" are bound within the rule |

  | SC-13 | The `issues` card''s one non-canonical cross-reference reads in the canonical
  `Read [Text](path)` form, and the card retains no markdown link to another deck
  file that lacks the canonical form | structural | Read `skills/issues/SKILL.md`;
  assert the canonical form on the cross-reference, and that no further non-canonical
  link to a deck file remains (the `reference-integrity` tool inspects canonical links
  only, so this check is by reading) |

  | SC-14 | Each amended card''s full normative prose, and the guideline''s amended
  passage, conforms to the ainglish writing discipline''s five ambiguity families
  | semantic | A fresh-context reviewer reads each of the two amended cards and the
  guideline against the discipline''s five families and the whole-card-on-touch rule,
  and returns a zero-finding verdict on ambiguity; a content defect the reviewer notes
  is recorded in `.opencode/.issues/2662/audit/ainglish-conversion.md` and does not
  bear on the verdict |

  | SC-15 | No clause in the amended deck leaves a stakeholder notice satisfiable
  by an escalation report, a clarification request, a reasoning trace, a chat excerpt,
  or a state update — the five observed failure classes | semantic | A fresh-context
  reviewer, given the amended cards, the amended guideline, and the recorded observed-failure
  classes, judges the amended text against that question and returns a zero-finding
  verdict, applying the spec card''s validation standards |

  | SC-16 | Each pre-existing normative rule of the two amended cards — the `issues`
  card''s eight items and its operating-contract clauses, and the `correspondence`
  card''s five items — survives the conversion with its meaning intact, other than
  the rules this spec states as changed | semantic | A fresh-context reviewer compares
  each amended card against its pre-change version in the deck''s history and asserts
  that every pre-existing rule survives, that none is dropped, weakened, or substantively
  altered, and that the only differences are the ones this spec''s rules state; the
  reviewer reports any difference as a finding |


  ## Out of scope


  - `floor.md` — the skill-creator card''s always-loaded-surface discipline, and the
  floor''s own cost discipline.

  - The `spec` card''s artifact-discipline rules; the CLI cards'' command patterns
  and the platform system comment the `gb-cli` card mandates for GitBucket issue state
  mutation; the `behavioral-testing` card.

  - The `issues` card''s label clause (§2) and its ticket-state hygiene (§6) — the
  deck''s live position on labels is that clause; it is left in place deliberately,
  and the rule''s carve-out keeps the two surfaces consistent; the label model itself
  is a separate question this change does not re-litigate.

  - The criteria sets'' defect classes, verdict contracts, analysis families, and
  loop mechanics.

  - The per-producer route clauses at the deck''s escalation, clarification, report,
  and consultation sites — a follow-on, recorded in the spec and in the re-evaluation
  record; the rule''s class coverage and the widened router carry the route meanwhile.

  - The retired pre-rip card''s per-comment-type templates — not restored; the `correspondence`
  card''s existing format rules govern.

  - Any new tool command, wrapper, hook, or scenario script; any size or count threshold.

  - The `local-issues` tool''s implementation — its existing `comment` and `update`
  commands are named by the rule, not changed.

  - The `skill-creator` admission gate and every other deck-governance rule.

  - Content defects that the ainglish conversion surfaces — recorded in `.opencode/.issues/2662/audit/ainglish-conversion.md`,
  not fixed, except where the fix is one of this spec''s rules.

  - `.opencode#2661`''s R-5 recomposition notice — permitted by the new rule, and
  not edited here.

  - A sweep of the existing trackers for comments the new rule would classify as internal
  — a developer-side cleanup, not a deck change, and not a deletion this change performs.


  ## Impact


  Consumers: every agent session that touches a tracked issue — the deck''s own issue
  pipeline, the repos whose issues it works, and the developers reading those trackers.
  The change replaces the deck''s only instruction on remote comments with a falsifiable
  predicate, a named internal class, a default, and routes. Risk: over-suppression
  — a legitimate stakeholder notice withheld; bounded by the positive class (R-3)
  and by the developer''s own review of the tracker, which is where the notice would
  otherwise have been noise. Second risk: no enforcement — a determined agent that
  disregards every card remains outside the deck''s reach, by the developer''s explicit
  direction; the change''s effect rests on the rule being encountered — the widened
  router is what puts the agent in front of it — and on the default being the working
  surface. Third risk: a wider diff than the targeted deltas — the ainglish whole-card-on-touch
  rule brings each amended card''s entire normative prose into scope (the `issues`
  card''s eight items and operating contract, and the `correspondence` card''s five);
  the conversion resolves ambiguity without changing substance, and content defects
  it surfaces are recorded rather than fixed. Blast radius: two cards'' full normative
  prose and one guideline''s amended passage; the `local-issues` tool, the harness,
  and every script surface are untouched.


