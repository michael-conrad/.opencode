  issue comment, and the `git-workflow-pr` card''s PR-body rule stands | structural
  | Read the rule text and `skills/git-workflow-pr/SKILL.md` §4; assert both clauses
  and that §4''s rule is unchanged |

  | SC-12 | The change adds no script, no wrapper, no tool command, no classifier,
  and no size or count threshold | structural | The change''s file list against its
  base tip contains no added or modified file under `tools/`, `tests-v2/`, `hooks/`,
  or `plugins/`; the amended text contains no numeric threshold on content size or
  count, and no mechanical classifier — no rule whose outcome is fixed by a procedure
  rather than by judgment |

  | SC-13 | The change touches no file outside the surfaces listed in §2.1 | structural
  | The change''s file list against its base tip contains exactly the §2.1 files |

  | SC-14 | Each amended card''s full normative prose, and each amended reference
  file''s and the guideline''s normative prose, conforms to the ainglish writing discipline''s
  five ambiguity families | semantic | A fresh-context reviewer reads each of the
  six amended cards, the three reference files, and the guideline against the discipline''s
  five families and the whole-card-on-touch rule, and returns a zero-finding verdict
