title: '[SPEC] Issues-data hygiene — store defects are repaired in place, not ticketed'
status: open
labels:
- needs-approval
- spec-fix
body: "<!-- SPDX-FileCopyrightText: 2026 Michael Conrad -->\n<!-- SPDX-License-Identifier:\
  \ MIT -->\n<!-- Provenance: AI-authored. Revised from the 2026-10-28 DEFECT filing\
  \ (#2681)\n     into this specification under the developer's directives of 2026-10-28:\n\
  \     (D-1) \"regression: .opencode#2681 - the agent is supposed to auto-remediate\n\
  \     yaml files in .issues/\" and (D-2) \"revise this issue to spec to fix the\n\
  \     underlying issue\". Triage evidence: research/triage-2026-10-28.md. -->\n\n\
  # [SPEC] Issues-data hygiene — store defects are repaired in place, not ticketed\n\
  \n## Problem\n\nDuring the #2664 PR pre-create checklist on 2026-10-28, the structural\
  \ gate\n`local-issues validate-yaml` exited 1. The producing agent dispositioned\
  \ the\nred output by filing a fix issue (#2681) instead of repairing the issue store,\n\
  although issue-store repairs are agent-owned, authorization-free hygiene under\n\
  the store's own workspace guide (`.opencode/.issues/AGENTS.md`, 2026-09-17\ndeveloper\
  \ directive): \"It is the agent's responsibility to repair, remediate,\nand revise\
  \ as needed ALL issue-ticket data files in the issues-data branches…\nAn agent that\
  \ encounters drift or defects in issues-data records and leaves\nthem unrepaired\
  \ (or halts awaiting authorization or a spec) has failed its\nhygiene duty.\" The\
  \ #2682 PR merged over the dispositioned finding; the store\nstayed red. The developer\
  \ corrected on 2026-10-28 (D-1) and directed this\nrevision (D-2).\n\nObserved failures\
  \ (triage record: `research/triage-2026-10-28.md`, verified\n2026-10-28 against\
  \ live surfaces):\n\n- **O-1 — the defect population is 273 files, not 2.** Unscoped\n\
  \  `./tools/local-issues validate-yaml`, run with cwd = the `.opencode`\n  repository,\
  \ exits 1 with 273 `invalid-yaml` report lines across the\n  `.opencode/.issues`\
  \ store — including both files the #2681 filing named\n  (`980/spec-artifacts/phase-state.yaml`,\n\
  \  `_legacy/1156-remove-slug-padding/spec-artifacts/vbc-artifact.yaml`). The\n \
  \ filing's \"two malformed YAML data files\" output basis is not reproducible\n\
  \  against the filing-time store (sampling at the pre-filing commit `eeb982fd7`\n\
  \  shows the wider population already present); the validator's own code is\n  byte-identical\
  \ between the filing-time tip `32566bc9d` and current `HEAD`.\n- **O-2 — the agent\
  \ dispositioned instead of repaired.** The #2682 PR body\n  records the route: \"\
  Pre-existing failure dispositioned: `validate-yaml` exit\n  1 on 2 invalid-YAML\
  \ files predating this change → filed\n  michael-conrad/.opencode#2681 (fix issue),\
  \ not a pass-through.\" Both named\n  files still fail YAML parsing today; the repair\
  \ never happened and never\n  waited on anything — it is authorization-free.\n-\
  \ **O-3 — the deck offers disposition where repair is in scope.** Two live\n  surfaces\
  \ carry the clause family \"remediated or dispositioned via a filed\n  fix issue\"\
  \ with no issues-data carve-out: the `git-workflow-pr` card's\n  pre-create checklist\
  \ (\"red output blocks PR creation until every failure is\n  remediated or dispositioned\
  \ via a filed fix issue; 'the failures\n  pre-existed' is a defect to file, never\
  \ a pass-through (#2553)\") and the\n  `implement` card's implementation-workflow\
  \ suite-green gate (\"every failure\n  is remediated or dispositioned via a filed\
  \ fix — never passed through as\n  'pre-existing' (#2553)\"). For a failure whose\
  \ remedy is issue-store hygiene,\n  both surfaces read as licensing the filed-ticket\
  \ branch over the free,\n  in-scope repair.\n- **O-4 — the floor's scope doctrine\
  \ gives the store guides no standing.** The\n  floor defaults an untokened session\
  \ to \"reading, searching, and reporting\n  only — no branch creation, no file modification,\
  \ no PR creation, no issue\n  closure\" and bounds a dispatched sub-agent to \"\
  no action beyond those the\n  dispatch prompt requests\". The store guides' authorization-free\
  \ `.issues/`\n  writes and hygiene duty collide with both clauses as written, so\
  \ an agent\n  honoring the floor's always-injected surface halts on — or tickets\
  \ — the\n  repair the guides mandate.\n- **O-5 — the record itself is damaged.**\
  \ #2681's title and body assert the\n  2-file fact base; its `needs-approval` label\
  \ contradicts the repair's\n  authorization-free class — and that contradiction\
  \ is live on both surfaces,\n  local and remote, which carry the identical label\
  \ set\n  (`needs-approval`, `spec-fix`).\n\nRoot causes covered:\n\n- **RC-1 (→\
  \ O-1)** — the store's hygiene state: 273 issue-store YAML data\n  files predate\
  \ and outlive the filing, unrepaired.\n- **RC-2 (→ O-2, O-3)** — the deck's failure-handling\
  \ rules route\n  hygiene-reparable failures into filed tickets; the rule text never\
  \ names the\n  issues-data class, so its \"the failures pre-existed\" filing clause\
  \ reads as\n  the whole action.\n- **RC-3 (→ O-2, O-4)** — the floor's default read-only\
  \ scope and dispatch\n  scope-bounding have no exception for store-guided operations,\
  \ so the\n  always-injected surface contradicts the store guides on the exact action\
  \ the\n  guides mandate.\n- **RC-4 (→ O-5)** — the filed record froze the misroute:\
  \ the ticket carries\n  the 2-of-273 fact base and a `needs-approval` label on an\
  \ authorization-free\n  repair class, live identically on both surfaces — damage\
  \ that rides the\n  same filing the ticket documents and that outlives the work.\n\
  \n## Scope\n\nDeck surfaces of the `.opencode` repository, plus issue-store data:\n\
  \n- The `.opencode` repo's issue store (`.opencode/.issues`, its `issues-data`\n\
  \  branch) — all 273 invalid-YAML files repaired to parse-valid YAML\n  (`_legacy/`\
  \ subtrees included; archived content is repaired for validity,\n  never restructured\
  \ or re-interpreted).\n- `skills/git-workflow-pr/SKILL.md` — the pre-create checklist's\n\
  \  failure-handling rule gains the issues-data remediation-first clause and its\n\
  \  boundary.\n- `skills/implement/references/implementation-workflow.md` — the suite-green\n\
  \  gate row reconciled to the same rule.\n- `floor.md` — the scope doctrine gains\
  \ the issues-data exception, so the\n  always-injected surface stops contradicting\
  \ the store guides.\n- `tests-v2/` — one behavioral scenario reproducing the observed\
  \ failure and\n  one companion proving no over-reach.\n- The `.opencode#2681` record\
  \ — title, body, and labels reconciled to the\n  corrected fact base on both surfaces\
  \ (record maintenance inside this\n  revision's flow; SC-7 decides the end state).\n\
  \nDeck text edits ride deck governance: the `skill-creator` admission gate\napplies\
  \ at implementation. A substantive write to `floor.md` triggers the\nwhole-card-on-touch\
  \ conversion rule — the floor is already\nwriting-discipline-converted (#2664/#2665),\
  \ so the edit retains that\nconformance across the whole floor's normative prose\
  \ rather than re-converts.\n\n## Requirements\n\n- **R-1 — store repair (O-1).**\
  \ The `.opencode` repo's issue store SHALL be\n  parse-clean: unscoped `local-issues\
  \ validate-yaml`, run with cwd = the\n  `.opencode` repository, exits 0 printing\
  \ zero `invalid-yaml` lines. Repairs\n  touch YAML validity only — a repair preserves\
  \ each file's semantic content,\n  changing nothing beyond what validity requires.\
  \ Where validity admits more\n  than one reading, the repair names the chosen reading\
  \ and its ground in\n  `.opencode/.issues/2681/research/repair-log.md` (file, chosen\
  \ reading,\n  ground) before the store sync — a multi-reading repair with no matching\
  \ log\n  entry violates this requirement. Repairs ride the store's\n  `issues-data`\
  \ branch via the store's own tooling (`local-issues`; plain\n  file edits plus the\
  \ tool's sync), never a feature branch.\n- **R-2 — remediation-first routing in\
  \ the deck (O-2, O-3).** The deck's\n  failure-handling rules — the `git-workflow-pr`\
  \ pre-create checklist clause\n  and the `implement` implementation-workflow suite-green\
  \ gate row — SHALL\n  classify a failure whose remedy is issue-store hygiene (workspace-local\n\
  \  repair of issue-store data on the store's `issues-data` branch: YAML\n  validity,\
  \ record fields, store metadata — a repair the store's workspace\n  guide already\
  \ authorizes as agent-owned and authorization-free) as\n  remediate-in-place: the\
  \ producing agent repairs the store in the same\n  working session, and the blocked\
  \ gate proceeds on that repair. Each failure\n  routes independently by its own\
  \ remedy class; the filed-fix-issue\n  disposition branch remains the route for\
  \ failures whose remedy requires\n  implementation authorization — any change outside\
  \ the issue stores (source\n  code, tests, deck content, build configuration). Filing\
  \ a fix issue never\n  substitutes for an available, in-scope hygiene repair; the\
  \ \"pre-existing\n  failures are a defect to file, never a pass-through\" clause\
  \ keeps applying\n  to implementation-remedy failures untouched.\n- **R-3 — the\
  \ floor's issues-data exception (O-2, O-4).** The floor's scope\n  doctrine SHALL\
  \ name the exception: operations an issue store's own workspace\n  guide authorizes\
  \ — reading, writing, and repairing workspace-local\n  issue-store data on the store's\
  \ `issues-data` branch via the store's own\n  tooling, including hygiene repairs\
  \ and the session-start `init`/`sync`\n  sequence — are agent-owned workspace maintenance:\
  \ they sit outside the\n  default read-only scope's file-modification blocklist\
  \ and outside a\n  dispatched session's scope-bounding, and they require no scope-bearing\n\
  \  token. The exception covers issue-store data only; source code, deck\n  content,\
  \ feature branches, and PRs stay inside the existing gates.\n- **R-4 — record truth\
  \ (O-5).** The `.opencode#2681` record SHALL read\n  consistently across its surfaces:\
  \ the GitHub tracker and the local store\n  folder agree on title and labels; the\
  \ remote body carries the corrected\n  fact base as a structured summary closing\
  \ with a resolvable artifacts\n  pointer; `.opencode/.issues/2681/spec.md` is the\
  \ single authoritative spec.\n- **R-5 — behavioral restoration and boundary (O-2\
  \ regression-proofing).**\n  The behavioral harness (`tests-v2/`) SHALL carry (a)\
  \ a scenario reproducing\n  the observed failure — in a PR-prep session whose `validate-yaml`\
  \ gate exits\n  1 on issue-store data, the agent repairs the store in place via\
  \ the store's\n  tooling and files no disposition ticket — and (b) a companion scenario\n\
  \  proving the boundary — a failure whose remedy requires implementation\n  authorization\
  \ still routes to the filed-fix-issue disposition and blocks the\n  gate until dispositioned.\n\
  - **R-6 — no mechanism (standing ruling, #2664 spec Approach).** The change\n  adds\
  \ no tool command, no wrapper, no enforcement hook, and no script\n  outside the\
  \ `tests-v2/` harness scenarios this spec orders — deck rule\n  text, store data\
  \ repair, and harness scenarios only.\n\n## Success criteria\n\n- **SC-1 (structural)\
  \ (→ R-1).** Unscoped `local-issues validate-yaml`, cwd = the\n  `.opencode` repository,\
  \ exits 0 with zero `invalid-yaml` lines.\n  *Instrument:* executed command; captured\
  \ output.\n- **SC-2 (structural) (→ R-1).** Repair minimality and disclosure: the\n\
  \  store-branch diff alters no file outside the issue store, and no YAML file\n\
  \  beyond what validity requires — and every changed file the review\n  classifies\
  \ as admitting more than one valid reading carries a matching\n  choice entry (file,\
  \ chosen reading, ground) in\n  `.opencode/.issues/2681/research/repair-log.md`.\
  \ *Instrument:* recorded\n  fresh-context diff review of the hygiene commits cross-checking\
  \ the diff\n  against that repair log — zero findings, or findings remediated before\n\
  \  re-review; the verdict and findings live in the record.\n- **SC-3 (structural)\
  \ (→ R-2).** Both rule surfaces carry the clause. *Instrument:*\n  grep in `skills/git-workflow-pr/SKILL.md`\
  \ and\n  `skills/implement/references/implementation-workflow.md` for the issues-data\n\
  \  remediation-first clause; read-back confirms the actor named (the producing\n\
  \  agent), the class named (issue-store hygiene), and the boundary stated\n  (implementation-remedy\
  \ failures keep the filed-fix-issue route).\n- **SC-4 (structural) (→ R-3).** The\
  \ floor carries the exception. *Instrument:* grep\n  in `floor.md` for the issues-data\
  \ exception (issue store, issues-data,\n  no scope-bearing token); read-back confirms\
  \ the bounds (issue-store data\n  only; source, deck content, branches, PRs excluded).\n\
  - **SC-5 (behavioral) (→ R-5a).** Scenario (a) passes — the reproduced-failure\n\
  \  scenario. *Instrument:* a scenario script under `tests-v2/behaviors/`\n  executed\
  \ through the harness (`bash tests-v2/with-test-home opencode run`,\n  per the `behavioral-testing`\
  \ card — no grep or static-analysis substitute);\n  clean-room evaluation asserts:\
  \ the store was repaired, no disposition\n  ticket was filed.\n- **SC-6 (behavioral)\
  \ (→ R-5b).** Scenario (b) passes — the companion boundary\n  scenario, same instrument\
  \ family; asserts the implementation-remedy failure\n  still blocks the gate and\
  \ routes to a filed disposition.\n- **SC-7 (structural) (→ R-4).** Record consistency.\
  \ *Instrument:* read-back of\n  GitHub #2681 and `.opencode/.issues/2681/` — titles\
  \ equal, labels equal,\n  the remote body carries the corrected fact base (the 273-file\
  \ store\n  population, and the filing's 2-file counting named as non-reproducible\n\
  \  damage rather than as output) verified by reading the fetched body, the\n  body's\
  \ artifacts pointer resolves to `.opencode/.issues/2681/`, the local\n  store body\
  \ mirrors the remote body, and `spec.md` is present and\n  store-authoritative.\n\
  - **SC-8 (structural) (→ R-6).** No mechanism added. *Instrument:* the change's\
  \ file\n  list against its base tip adds or modifies nothing under `tools/`, `hooks/`,\n\
  \  or `plugins/`, and adds no script outside the `tests-v2/` scenario set.\n- **SC-9\
  \ (structural) (→ dependent-behavior preservation).** Test-contract\n  currency:\
  \ the structural suites that assert the amended surfaces still\n  pass when the\
  \ rule text changes under them. *Instrument:* executed\n  `tests-v2/test-cleanroom-eval-contract.sh`,\
  \ `tests-v2/test-skill-deck-completeness.sh`,\n  and `tests-v2/test-trunk-hook.sh`,\
  \ captured output.\n\n## Out of scope\n\n- `local-issues validate-yaml` behavior\
  \ — including the cwd-scoped walk that\n  leaves a parent-root run blind to the\
  \ `.opencode` store (`cmd_validate_yaml`\n  resolves the store relative to the process\
  \ cwd). A tool change needs its own\n  spec'd issue; the original filing's validator\
  \ boundary carries over.\n- The parent repository's own issue store (the root `.issues`):\
  \ scans clean as\n  of 2026-10-28 (exit 0). The restored rules apply to it deck-wide;\
  \ it needs\n  no repair work.\n- Deck governance mechanics — the `skill-creator`\
  \ admission gate is exercised\n  at implementation, never changed by this work.\n\
  - Re-classification of earlier issues' specs or comments under the restored\n  rules\
  \ (developer-side cleanup, per the #2664 precedent).\n- A hygiene restatement in\
  \ the `issues` skill card — the store guides carry\n  the duty and inject on store\
  \ contact; the restored surfaces cover the\n  observed failure route without widening\
  \ deck surface.\n- Any hook, wrapper, script, or threshold (R-6).\n- Closure logistics\
  \ for #2681 itself — the ticket closes after the work\n  merges, per the issues\
  \ card's post-merge cleanup; the closure workflow is\n  not a spec deliverable counted\
  \ here.\n\n## Approach\n\n1. **Store repair first (R-1).** Bulk parse repair of\
  \ the 273 files on the\n   `issues-data` branch via the store's tooling; repairs\
  \ stay minimal, and any\n   multi-reading choice is logged per SC-2. Doing this\
  \ before the deck text\n   lands also makes this change's own PR checklist run the\
  \ `validate-yaml`\n   gate genuinely green rather than dispositioned.\n2. **Record\
  \ reconciliation (R-4, O-5).** The #2681 record — title, labels,\n   and body —\
  \ is reconciled on both surfaces (the local store folder and the\n   GitHub tracker)\
  \ as part of this revision flow, before implementation work\n   starts; SC-7 decides\
  \ the reconciled end state.\n3. **Deck text (R-2, R-3).** Amend the two rule surfaces\
  \ and the floor's\n   scope doctrine; the floor edit keeps whole-card writing-discipline\n\
  \   conformance. The rule text follows the store guides' own vocabulary\n   (agent-owned,\
  \ authorization-free, issues-data branch) so the\n   always-injected surface and\
  \ the conditional guides state one doctrine.\n4. **Behavioral scenarios (R-5).**\
  \ RED/GREEN per the `behavioral-testing`\n   card's harness path: scenario (a) fails\
  \ against the un-amended surfaces\n   because the agent tickets instead of repairs;\
  \ scenario (b) fails if the\n   carve-out is written broad enough to swallow implementation-remedy\n\
  \   failures.\n5. **Verify and ship.** Fresh-context `verify` dispatch against these\
  \ SCs,\n   then the PR per `git-workflow-pr` (one PR for the issue; the store repairs\n\
  \   ride `issues-data`, not the PR branch). After merge, #2681 closes as\n   verified-resolved\
  \ per the issues card.\n\nDiscarded alternative — an enforcement hook or wrapper\
  \ that blocks filing a\ndisposition ticket when a hygiene repair is available: the\
  \ deck surfaces that\nget scripted get trashed and replaced (the developer's standing\
  \ ruling in the\n#2664 spec's Approach), and the failing agent in O-2 quoted the\
  \ correct rule\ntext — the defect is a rule conflict, not a missing interlock.\n\
  \n## Impact\n\n- **Consumers:** every agent session the deck serves — the failure-handling\n\
  \  route changes at two rule surfaces and the floor's scope doctrine; agents\n \
  \ working the `.opencode` repo's issue store gain a parse-clean store.\n- **Risk\
  \ — over-reach:** the hygiene class read broadly enough to swallow\n  implementation-remedy\
  \ failures into in-place repair. Bounded by R-2's\n  boundary (\"outside the issue\
  \ stores\") and by SC-6's companion scenario.\n- **Risk — over-repair:** a store\
  \ repair that rewrites content it should only\n  re-validate. Bounded by R-1's preservation\
  \ clause and SC-2's minimality\n  review.\n- **Blast radius:** `skills/git-workflow-pr/SKILL.md`,\n\
  \  `skills/implement/references/implementation-workflow.md`, `floor.md`, the\n \
  \ `tests-v2/` scenario set, 273 store data files, the #2681 record. No tool,\n \
  \ hook, script, or other card changes.\n- **Dependent tests:** structural suites\
  \ asserting the amended surfaces\n  (SC-9); behavioral fixtures asserting checklist\
  \ behavior re-scope per the\n  same SOP #2664/#2665 used, if their scripts assert\
  \ the old disposition\n  route.\n- **Recovery:** deck edits are text; store repairs\
  \ ride `issues-data`\n  commits — every element reverses through branch history.\n\
  \n> Full spec and plan artifacts: https://github.com/michael-conrad/.opencode/tree/issues-data/2681/\n\
  \nArtifacts for agents: `.opencode/.issues/2681/`."
