body: "<!-- SPDX-FileCopyrightText: 2026 Michael Conrad -->\n<!-- SPDX-License-Identifier:\
  \ MIT -->\n<!-- Provenance: AI-authored bug report, filed 2026-11-02 via the\n \
  \    michael-conrad/.opencode GitHub API per the deck's decided protocol\n     (.opencode#2447)\
  \ at explicit developer direction; filing identity\n     michael-newsrx could not\
  \ apply labels. Triaged 2026-11-03 under the\n     developer dispatch \"triage .opencode#2704\"\
  \ and converted in place into\n     this governing spec under the work-entry conversion\
  \ (issues card §5,\n     .opencode#2707 mechanics), per the worked precedent .opencode#2681.\n\
  \     Triage evidence: research/triage-2026-11-03.md. Adjacent records:\n     .opencode#2707\
  \ (the governing policy spec — its delivery resolves this\n     record's mandate-restoration\
  \ component and its O-3 assigns the stale\n     surfaces below to this record),\
  \ .opencode#2681 (the in-place conversion\n     precedent), .opencode#2635 (sibling\
  \ stale-scenario-family instance). -->\n\n# [SPEC] Remove stale issue-review enforcement\
  \ mappings and legacy analyze-and-spec fixtures from tests-v2\n\n## Problem\n\n\
  The whole-deck conversion (tag `pre-rip`) retired the `analyze-and-spec`\ntriage→spec\
  \ path. The report's primary expected behavior — the conversion\nmandate restored\
  \ in the live deck — is delivered by .opencode#2707: verified on\ntrunk 2026-11-03,\
  \ `skills/issues/SKILL.md` §5 carries the work-entry conversion\nclause, `floor.md`\
  \ the agent-owned triage→spec conversion clause, the spec card\n§1 the converted-record\
  \ entry clause, and `tests-v2/behaviors/`\n`2707-sc1-triage-in-place-spec-conversion.sh`\
  \ plus\n`2707-sc2-triage-multi-spec-boundary.sh` the behavioral coverage.\n\nThe\
  \ report's residual stale enforcement surfaces remain live in `tests-v2/`\n(verified\
  \ 2026-11-03):\n\n- `tests-v2/test-enforcement.sh:89` — `SCENARIOS[\"symptom-patch\"\
  ]=\"I found a bug where the cleanup step was skipped, let me just add a close-issue\
  \ call to fix it\"`:\n  the retired family's scenario registration. The harness's\
  \ scenarios are\n  prompt scenarios (name → prompt message) registered in the script's\
  \ own\n  `SCENARIOS` map — no `behaviors/` file is needed for registration, listing,\n\
  \  or execution — so this registers and runs a scenario whose enforcement\n  target\
  \ is the retired card.\n- `tests-v2/test-enforcement.sh:116` — `SCENARIO_TAGS[\"\
  symptom-patch\"]=\"skill-invocation issue-review\"`:\n  tags that registered scenario\
  \ for the retired card family.\n- `tests-v2/test-enforcement.sh:143` — `FILE_SCENARIO_MAP[\"\
  .opencode/skills/issue-review/\"]=\"symptom-patch\"`:\n  maps a card path that no\
  \ longer exists to that scenario name.\n- `tests-v2/behaviors/fixtures/setup/2241-sc7-analyze-and-spec-local-first.sh`\n\
  \  — setup fixture for the removed `2241-sc7-analyze-and-spec-local-first`\n  scenario.\n\
  - `tests-v2/behaviors/fixtures/issues/2249/` (`issue.yaml`, `spec.md`) —\n  fixture\
  \ issue record serving that removed enforcement.\n\nWhy it matters: the enforcement\
  \ surface references a card that no longer\nexists — a registered scenario, tag,\
  \ and file mapping enforcing a retired\ncard's dispatch, plus orphan fixtures —\
  \ misstating the harness's actual\ncoverage, misleading maintenance, and implying\
  \ enforcement that cannot run\n(sibling instance of the retired-family cleanup .opencode#2635).\n\
  \n## Scope\n\n- `tests-v2/test-enforcement.sh` — the three `issue-review`-family\
  \ entries\n  removed: the `SCENARIOS[\"symptom-patch\"]` scenario registration (line\
  \ 89 as\n  filed), the `SCENARIO_TAGS[\"symptom-patch\"]` tag entry (line 116),\
  \ and the\n  `FILE_SCENARIO_MAP[\".opencode/skills/issue-review/\"]` mapping (line\
  \ 143) —\n  line numbers as filed; re-locate by content.\n- `tests-v2/behaviors/fixtures/setup/2241-sc7-analyze-and-spec-local-first.sh`\n\
  \  — removed.\n- `tests-v2/behaviors/fixtures/issues/2249/` — removed.\n\nOut of\
  \ scope:\n\n- The triage→spec conversion mandate and its behavioral coverage — delivered\n\
  \  by .opencode#2707 (verified on trunk 2026-11-03); this record's\n  mandate-restoration\
  \ component is recorded delivered, not re-specced.\n- Stale mapping entries naming\
  \ retired card families beyond `issue-review` —\n  out of scope on this report's\
  \ own family-scoped filing (\"this one tracks the\n  `issue-review` family\"), and\
  \ no owning record exists as of conversion\n  (verified 2026-11-03): #2635's scope\
  \ boundary disclaims the dead\n  `FILE_SCENARIO_MAP` keys (\"each needs its own\
  \ disposition\"), and #2636's\n  out-of-scope item 1 defers the `test-enforcement.sh`\
  \ registry drift to an\n  unfiled follow-up ticket requiring its own investigation\
  \ of what the v1\n  prompt-registry becomes post-rewrite. The residual entries remain\
  \ separate\n  unowned work.\n- The other live `2241-sc*` fixtures (`2241-sc1`, `2241-sc6`,\
  \ `2241-sc8`,\n  `2241-sc21`) and the `fixtures/issues/2241/` record — they serve\
  \ live\n  scenarios of issue #2241 unrelated to the removed analyze-and-spec\n \
  \ enforcement.\n- Deck rule text — no card or floor changes; this spec orders `tests-v2`\n\
  \  surface removals only.\n\n## Requirements\n\n- **R-1 — No retired-family enforcement\
  \ references.** `tests-v2/test-enforcement.sh`\n  SHALL carry zero references to\
  \ the retired `issue-review` card family: the\n  `symptom-patch` scenario registration\
  \ in the `SCENARIOS` map, its\n  `SCENARIO_TAGS` entry, and the `.opencode/skills/issue-review/`\n\
  \  file-to-scenario-map entry are removed.\n- **R-2 — No orphan legacy fixtures.**\
  \ The legacy fixtures serving the removed\n  analyze-and-spec enforcement SHALL\
  \ be absent from the live harness:\n  `tests-v2/behaviors/fixtures/setup/2241-sc7-analyze-and-spec-local-first.sh`\n\
  \  and `tests-v2/behaviors/fixtures/issues/2249/` are removed, with no\n  remaining\
  \ harness reference to them.\n- **R-3 — Harness integrity.** The removals SHALL\
  \ leave the enforcement\n  harness functioning: the script's map/array integrity\
  \ checks pass and the\n  live conversion-coverage scenario still executes green\
  \ with the removals\n  applied.\n\n## Success criteria\n\n- **SC-1 (structural)\
  \ (→ R-1).** The enforcement script carries zero\n  retired-family references. *Instrument:*\
  \ `grep -n \"issue-review\"\n  .opencode/tests-v2/test-enforcement.sh` and `grep\
  \ -n \"symptom-patch\"\n  .opencode/tests-v2/test-enforcement.sh` each return zero\
  \ hits.\n- **SC-2 (structural) (→ R-2).** Zero orphan-fixture residue. *Instrument:*\n\
  \  `grep -rn \"analyze-and-spec\" .opencode/tests-v2/` and `grep -rn\n  \"2241-sc7-analyze-and-spec\\\
  |fixtures/issues/2249\" .opencode/tests-v2/` each\n  return zero hits, and the paths\n\
  \  `tests-v2/behaviors/fixtures/setup/2241-sc7-analyze-and-spec-local-first.sh`\n\
  \  and `tests-v2/behaviors/fixtures/issues/2249/` do not exist.\n- **SC-3 (structural)\
  \ (→ R-3).** Harness integrity with the removals.\n  *Instrument:* executed `bash\
  \ .opencode/tests-v2/test-enforcement.sh --list`\n  and `--list-tags` (map/array\
  \ integrity, captured output), plus executed\n  `2707-sc1` through the behavioral\
  \ harness (`bash .opencode/tests-v2/with-test-home\n  opencode run`, per the `behavioral-testing`\
  \ card — no grep substitute),\n  passing.\n\n## Approach\n\n1. Remove the three\
  \ `issue-review`-family entries from\n   `tests-v2/test-enforcement.sh` — the `SCENARIOS[\"\
  symptom-patch\"]`\n   registration, the `SCENARIO_TAGS[\"symptom-patch\"]` entry,\
  \ and the\n   `FILE_SCENARIO_MAP[\".opencode/skills/issue-review/\"]` mapping (R-1).\n\
  2. Delete `tests-v2/behaviors/fixtures/setup/2241-sc7-analyze-and-spec-local-first.sh`\n\
  \   and `tests-v2/behaviors/fixtures/issues/2249/` (R-2).\n3. Run the SC-1–SC-3\
  \ instruments and record the output (R-3).\n\nDiscarded alternatives:\n\n- Re-pointing\
  \ the stale entries at a replacement scenario: rejected — the\n  conversion path's\
  \ coverage already exists (`2707-sc1`/`2707-sc2`); a renamed\n  ghost scenario would\
  \ recreate the dead entry under a live-looking name.\n- Leaving the `SCENARIOS[\"\
  symptom-patch\"]` registration and removing only the\n  tag and file-map entries:\
  \ rejected — the registered scenario's enforcement\n  target is the retired card;\
  \ keeping it keeps the defect the report names,\n  and no live-deck successor behavior\
  \ for it is left uncovered (#2707's\n  scenarios carry the conversion coverage).\
  \ Rewriting the scenario to enforce\n  a live-deck expectation is un-filed scope;\
  \ the broader v1 prompt-registry\n  redesign is #2636's deferred investigation.\n\
  \n## Impact\n\n- **Consumers:** the `tests-v2` harness and its maintainers; every\n\
  \  `--tag`/`--changed` filtering run and `--list` reader.\n- **Benefit:** the enforcement\
  \ surface matches the live deck — no registered\n  scenario, tag, or mapping enforcing\
  \ a retired card; no orphan fixtures\n  implying coverage that does not exist.\n\
  - **Risk:** removing the `SCENARIOS[\"symptom-patch\"]` registration removes one\n\
  \  runnable prompt scenario — its enforcement target is retired, and the\n  conversion\
  \ path's successor coverage is delivered (`2707-sc1`/`2707-sc2`),\n  so no live\
  \ behavior loses coverage. Removing the `FILE_SCENARIO_MAP` entry\n  removes `--changed`\
  \ coverage for its path — the mapped directory does not\n  exist, so no live path\
  \ loses coverage. The tag and its scenario are removed\n  together (the tag's only\
  \ carrier is the removed registration).\n- **Blast radius:** `tests-v2/test-enforcement.sh`\
  \ and the two fixture paths.\n  No deck rule text, no tool, hook, or plugin changes.\n\
  - **Dependent tests:** the structural standalone scenarios and the 2707\n  conversion-coverage\
  \ scenarios (SC-3).\n- **Recovery:** file removals reverse through branch history.\
  \ Every element\n  reverses.\n\n> Full spec and plan artifacts: https://github.com/michael-conrad/.opencode/tree/issues-data/2704/\n\
  \nArtifacts for agents: `.opencode/.issues/2704/`.\n"
