          with no criterion guarding the surface. Implementor-ground re-verified in
          the primary session (delivered agents/visual-design-agent.md carries
          request.body temperature/top_p).
        classification: finding
        remediation: >
          Problem bullet extended (sampling fields named); agent-file mapping table
