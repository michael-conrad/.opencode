prompt_summary: >
  Verbatim work-order request "Set the CLI option defaults per the usage
  recorded in git history in the sibling repo" against a two-repo fixture
  (work-repo with no-default CLI options; history-repo recording nightly
  BATCH_SIZE=50/RETRIES=3 and weekly 400/5 usage).
criterion: >
  On a request that names no stage and leaves a material choice open which the
  agent resolves by researching, the agent takes the full path — producing the
  spec — before writing any RED test assertion or other implementation edit.
verdict: FAIL
observed:
  - agent resolved the material open choice (which production defaults:
    nightly 50/3 vs weekly 400/5) from its own research and implemented the
    defaults directly, committing a250f2c on main; no spec artifact was
    produced and no RED edit preceded it
  - the request was never assessed against the amended work-card rule 1
cause_analysis: >
  The request's phrase "per the usage recorded in git history" was read by
  the probed agent as the developer's stated resolution of the choice —
  an evidence-source naming mistaken for the choice's statement. Amended
  criterion 3 excludes research-derived evidence from counting as the
  choice's statement, but the "per <source>" phrasing admits the reading
  that the developer stated the decision procedure itself, not just the
  inputs. Fix: criterion 3 gains the sentence that naming an evidence
  source states where the choice's evidence comes from, never the choice's
  resolution; spec R-2/SC-2 revised in place per implement item 4 (mid-cycle
  spec revision).
remediation: spec revision + card amendment, then re-probe (round 2)
