title: '[BUG] work card prescribes writing .git/work-record.md inside consuming repos
  — agent-authored intrusion into the repo''s own git directory'
status: open
labels:
- bug
body: '## Observed behavior


  During a spec-stage work cycle in `NewsRx/hermes-ingest-pubmed` (2026-11-12), the
  executing agent created a file inside the repository''s own git directory: `.git/work-record.md`
  — exactly the path `git rev-parse --git-path work-record.md` resolves to.


  The write is not ad-hoc: it is prescribed by the `work` card (`skills/work/SKILL.md`,
  §4 "The work record and the scope statement"), which reads:


  > "The **work record** is one file in the repository''s own git directory — the
  path `git rev-parse --git-path work-record.md` reports — which is not a working-tree
  path, so the record never appears in the repository''s status and needs no ignore-rule
  entry. It is scratch: the agent never commits it, and the cleanup card removes it."


  The developer (repo owner) reviewed the produced file mid-session and judged the
  mechanism itself a defect: **an agent writing an agent-authored file into a consuming
  repository''s `.git/` directory is an unwanted intrusion into the deck''s own prescribed
  behavior** — independent of the file''s content.


  ## Expected behavior


  The deck should not direct agents to write into the consuming repository''s `.git/`
  directory. `.git/` is git''s own operational state (refs, hooks, worktrees, internal
  scratch); a developer auditing their repository does not expect agent-authored files
  there, discovery of one during an owner audit reads as an intrusion, and the mechanism''s
  only cleanup is a future session remembering a cleanup-card step — a latent-residue
  failure mode.


  A work/scope record needs a location the repository owner sanctions. Candidate remedies
  for triage to weigh (this report decides nothing):


  - record the provenance + scope statement **inside the issue store on the `issues-data`
  branch** alongside the cycle''s other artifacts (the store is already agent-owned
  workspace), or

  - use a configured **ephemeral path** with repo-sanctioned conventions (e.g., `./tmp/`,
  gitignored and visibly ephemeral), or

  - **scope the record requirement down** so a spec-stage-only cycle (no implementation,
  no PR) produces no repository-side file at all.


  Whichever remedy lands: a location change touches the cards that reference the record
  by this path — `verify` §1 (short-path reviewer is pointed at the work record''s
  path) and `git-workflow-cleanup` (the card that deletes it) — so the change must
  move all three references together.


  ## Steps to reproduce


  1. In any consuming repo, issue a work-order that enters the work cycle (e.g., a
  spec-stage instruction naming the stage).

  2. The agent loads the `work` card and follows §4 before any edit: writes the scope
  statement to `.git/work-record.md`.

  3. `git rev-parse --git-path work-record.md` → `.git/work-record.md`; the file exists
  with provenance + scope content and is invisible to `git status` — invisible to
  the owner until they look inside `.git/` itself.


  ## Component affected


  - `.opencode/skills/work/SKILL.md` — §4 (the work-record path prescription).

  - Secondary references that must move together with any remedy: `.opencode/skills/verify/SKILL.md`
  §1 and `.opencode/skills/git-workflow-cleanup` (record removal).


  ## Provenance


  - Filed per the developer''s explicit instruction during the 2026-11-12 `NewsRx/hermes-ingest-pubmed`
  session: *"this is an unwanted intrusion by an agent into the deck. file a bug report
  upstream with .opencode/ to have it triaged."*

  - The session''s `.git/work-record.md` is left in place in that repo pending the
  triage verdict / cleanup decision.


  ## Addendum (2026-11-12) — provenance of the deck mechanism, verified


  The reporter''s follow-up statement: *"I did not authorize or request this file
  and it was added as need into the deck with zero consultation or notification to
  the dev."* Verified against the upstream history (live checks, 2026-11-12):


  - **The mechanism is a pure addition, not a modification**: the `work` card immediately
  before the #2657 cycle carried no work record at all (`git show 10711d95^:skills/work/SKILL.md`
  — zero matches for a work record/`work-record`).

  - **The `.git` directory was chosen inside the #2657 spec/plan cycle**, recorded
  in the plan revisions (commits `10711d95`, `e32a070a`, 2026-10-23: "…the work record''s
  path is the repository''s git directory") and landed in the card via commit `ac5c4407`
  (2026-10-31), carried by **PR #2693** ("Closes #2657"), merged 2026-11-01T02:47:51Z
  on the `michael-conrad` account.

  - **The merged PR did not disclose the write location.** Neither the PR title ("…the
  short path is bounded and recorded") nor the PR body names the work record, the
  `.git` path, or that the record lands inside the repository''s own git directory
  — a grep of the PR body for "work record" / "git directory" / "git-path" / ".git"
  returns zero matches.

  - **No consultation trail exists on the driving issue**: `michael-conrad/.opencode#2657`
  carries zero comments.

  - **Nuance for triage**: the PR introducing the mechanism passed the deck''s human
  merge gate on the owner''s own GitHub account; how much of the diff the human personally
  reviewed is not API-decidable. The verifiable gaps are the absent consultation trail
  and the undisclosed `.git` write in the merged change summary — both facts support
  the reporter''s statement as applied to the deck''s notification/consultation obligations,
  not as a judgment of any human action.


  This addendum strengthens the original ground: the mechanism reached the deck without
  stakeholder consultation and without notification of its side effect (agent-authored
  files inside `.git/`), and the reporter''s non-authorization and non-request of
  the file itself is on record.


  🤖 Co-authored with AI: OpenCode (huggingface/zai-org/GLM-5.3-Flash)


  '
