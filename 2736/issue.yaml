title: '[SPEC] release-promoter: resolve canonical build/test commands from sanctioned
  documented sources — manifest absence is not a release-blocking failure'
status: closed
labels:
- needs-approval
body: "<!-- SPDX-FileCopyrightText: 2026 Michael Conrad -->\n<!-- SPDX-License-Identifier:\
  \ MIT -->\n<!-- Provenance: AI-authored bug report, filed 2026-11-12 on the remote\n\
  \     tracker; triaged 2026-11-12 under the developer dispatch \"triage\n     .opencode#2736\"\
  \ and converted in place into this governing spec under\n     the work-entry conversion\
  \ (issues card §5, .opencode#2707 mechanics).\n     Developer ruling recorded in\
  \ the report: only a real failure — an\n     actual build or test failure, or equivalent\
  \ verified failure — should\n     block a release; manifest absence is not a real\
  \ failure. Triage\n     evidence: claims verified against the live card text\n \
  \    (skills/release-promoter/references/operating-protocol.md steps 7.4,\n    \
  \ 8, 10; skills/release-promoter/SKILL.md step 0) and the\n     pointer-only `.opencode/AGENTS.md`\
  \ constraint, this date. -->\n\n# [SPEC] release-promoter: resolve canonical build/test\
  \ commands from sanctioned documented sources — manifest absence is not a release-blocking\
  \ failure\n\n## Problem\n\nThe release-promoter clean-room gate's canonical build/test\
  \ command\ndiscovery (operating protocol step 7) reads the parent repository's build\n\
  manifest and, when no manifest declares the commands, hard-fails\n`MANIFEST_FAIL`\
  \ with no retry (step 7.4). Step 8 forbids executing any\ncommand not discovered\
  \ from the manifest. A parent repository whose tree\ncarries no declared build manifest\
  \ therefore can never satisfy the gate's\nzero-failure build/test assertion: the\
  \ release PR is permanently blocked on\nmissing paperwork, not on any failing build.\
  \ Observed live (2026-11-12,\nDoiUpdaterCurrent): the release run ended at `MANIFEST_FAIL`\
  \ with every\nrepo verified at its remote trunk tip and the candidate untested.\
  \ The\nconflict is structural — the floor's build-tooling exclusivity sanctions\n\
  the parent's own wrapper (`./gradlew` for Gradle repos), while the gate\npermits\
  \ only manifest-discovered commands; `.opencode/AGENTS.md`, a common\nmanifest location,\
  \ is prohibited from carrying rules or commands.\n\nThe developer's ruling (2026-11-12):\
  \ only a real failure — an actual build\nor test failure, or an equivalent verified\
  \ failure — should block a\nrelease. Manifest absence is not a real failure.\n\n\
  ## Requirements\n\n1. The clean-room gate resolves the canonical build and test\
  \ commands from\n   sanctioned, documented sources in this fixed order: first the\
  \ declared\n   build manifest of the release tree, when one exists; next session-init\n\
  \   per-root facts, where they supply build/test commands; last the\n   repository's\
  \ own documented build framework — the wrapper the floor's\n   build-tooling exclusivity\
  \ rule sanctions for the repository's build\n   system. The gate never hardcodes\
  \ a build system and never substitutes a\n   submodule's own tooling run in isolation\
  \ for the parent's framework.\n2. Manifest absence ceases to be a blocking assertion:\
  \ `MANIFEST_FAIL` as\n   a hard-fail-on-absence class is removed from the gate.\
  \ Only real\n   failures block the release — `DRIFT_FAIL`, an actual `BUILD_FAIL`\n\
  \   (non-zero build or test exit), a tree mismatch, or an equivalent\n   verified\
  \ failure — under the existing no-retry-within-the-release\n   discipline for assertion\
  \ failures.\n3. Terminal no-source case: when no sanctioned source yields build/test\n\
  \   commands — no manifest, no session-init facts, no documented build\n   framework\
  \ — the candidate cannot be proven tested; the gate hard-fails\n   with a distinct\
  \ named failure as a real blocking failure (an equivalent\n   verified failure under\
  \ requirement 2's rule: no PR is filed for an\n   unproven candidate). This terminal\
  \ failure is stated in the card text\n   as its own class, distinct from removed\
  \ `MANIFEST_FAIL`.\n4. The gate text records which source supplied the resolved\
  \ commands in\n   the gate's work record, so the zero-failure assertion's provenance\
  \ is\n   auditable.\n5. Behavioral test surfaces encoding the removed behavior are\
  \ revised in\n   the same change: the manifest-discovery fixture and the release-gate\n\
  \   scenario that treat `MANIFEST_FAIL` as a blocking assertion failure are\n  \
  \ updated to the new resolution order and blocking-failure classes.\n\n## Success\
  \ criteria\n\n| SC | Class | Criterion | Verification |\n|----|-------|-----------|--------------|\n\
  | SC-1 | Behavioral | On a release tree with no declared build manifest but with\
  \ a documented build framework, the clean-room gate resolves build/test commands\
  \ from the sanctioned sources and proceeds to execute the zero-failure build/test\
  \ assertion — it does not stop at manifest absence. | Executed gate run on a manifest-less\
  \ candidate tree (live or scripted scenario) reaching build/test execution and completing\
  \ or failing only on real build/test outcomes. |\n| SC-2 | Content | Command discovery\
  \ in the release-promoter card and operating protocol states the fixed resolution\
  \ order: declared manifest → session-init per-root facts → the repository's documented\
  \ build framework. | Fact-decidable read of the card text. |\n| SC-3 | Content |\
  \ `MANIFEST_FAIL` no longer appears as an assertion-failure or blocking-failure\
  \ class in the gate text, and the blocking-failure list names only real failures\
  \ (drift, actual build/test failure, tree mismatch, equivalent verified failure,\
  \ and the terminal no-source failure). | Fact-decidable read of the card text. |\n\
  | SC-4 | Content | The terminal no-source case is stated: no sanctioned source yielding\
  \ commands is a real blocking failure with its own named class, not a re-runnable\
  \ setup failure and not a silent proceed. | Fact-decidable read of the card text.\
  \ |\n| SC-5 | Content | The gate's work-record requirement states that the resolved\
  \ commands and their supplying source are recorded. | Fact-decidable read of the\
  \ card text. |\n| SC-6 | Behavioral | The behavioral test surfaces for the gate\
  \ no longer encode manifest absence as a blocking assertion and exercise the new\
  \ resolution order. | Executed behavioral tests for the release gate passing against\
  \ the revised card text. |\n\n## Scope\n\n- `skills/release-promoter/SKILL.md` (step\
  \ 0 assertion-failure list)\n- `skills/release-promoter/references/operating-protocol.md`\
  \ (steps 7, 8, 10)\n- `tests-v2/behaviors/fixtures/setup/2439-sc4-gate-manifest-discovery.sh`\n\
  \  (manifest-discovery fixture — its header comment carries the removed\n  `MANIFEST_FAIL`-on-absence\
  \ rule; the fixture's manifest-first setup\n  remains valid under the new resolution\
  \ order)\n- `tests-v2/behaviors/2557-sc6-release-gate.sh` (scenario listing\n  `MANIFEST_FAIL`\
  \ as a blocking assertion failure)\n- `CHANGELOG.md` (deck changelog entry for the\
  \ behavior change)\n\n`attic/` content is unloaded archive pending soak and deletion\
  \ — not in\nscope; the vector index is generated state, not source. A live grep\
  \ for\n`MANIFEST_FAIL` outside `.issues/` surfaces exactly the files above (the\n\
  two card files, the two test scripts, the changelog, and the archive) —\nno unexamined\
  \ source surface remains.\n\nDeck-consumption boundary: the change is authored in\
  \ the deck's own\nrepository (this store) and lands through the deck governance\
  \ flow and a\nhuman-merged PR; consuming checkouts receive it only by pulling upstream.\n"
