title: 'release-promoter: gate hard-fails MANIFEST_FAIL on manifest absence — releases
  should block only on real build/test failures'
status: open
labels:
- needs-approval
body: "## Summary\n\nThe release-promoter clean-room gate (step 7) requires discovering\
  \ canonical\nbuild/test commands from a parent-repo build manifest and hard-fails\n\
  `MANIFEST_FAIL` with no retry when none exists. Since step 8 forbids executing\n\
  any command not discovered from the manifest, a repository whose tree carries\n\
  no declared build manifest can never satisfy the gate's zero-failure\nbuild/test\
  \ requirement — the release PR can never be filed. The developer's\nruling (2026-11-12):\
  \ only a real failure — an actual build or test failure, or\nequivalent verified\
  \ failure — should block a release. Manifest absence is not\na real failure.\n\n\
  ## Environment\n\n- opencode version: 2.2.5\n- OS: Linux 6.8.0-147-generic (linux\
  \ x64)\n- Terminal: TERM=dumb\n- Shell: /bin/bash\n- Install/channel: latest\n-\
  \ Active plugins: ./plugins/vacuum-retention.ts\n- Deck: `.opencode` @ 65397f46\
  \ (post-#2735)\n\n## Reproduction\n\nOn a Gradle parent repository with registered\
  \ submodules but **no root\n`AGENTS.md`** (its `.opencode/AGENTS.md` is deliberately\
  \ pointer-only:\n\n> \"This file exists because the platform auto-loads AGENTS.md\
  \ — it must stay a\n> pointer and carry no rules.\"):\n\n1. Run the trunk-freshness\
  \ pass (all repos reach remote trunk tips; no sync\n   needed).\n2. Begin the release-promoter\
  \ Phase A clean-room gate.\n3. Step 7 (build-manifest discovery): read the root\
  \ build manifest — none\n   exists; tree sweep (`git ls-files`) shows `build.gradle`,\
  \ `gradlew`,\n   `CHANGELOG.md`, `README.md` (one deploy-path line) and no manifest\
  \ with a\n   build/test commands section; no fallback manifest is named.\n4. Session-init\
  \ supplies no build/test commands for the root (verified:\n   `./.opencode/tools/session-init`\
  \ output contains none), despite the\n   floor's \"Per-root facts (owner, repo,\
  \ test commands) come from session-init\".\n\n## Expected Behavior\n\nThe gate should\
  \ block a release only on real failures: `DRIFT_FAIL`, an actual\n`BUILD_FAIL` (non-zero\
  \ build or test exit), `TREE_MISMATCH`, or an equivalent\nverified failure. When\
  \ no manifest declares canonical commands, the gate\nshould resolve the toolchain\
  \ from sanctioned, documented sources — the\nrepository's own build framework (the\
  \ wrapper the floor's build-tooling\nexclusivity explicitly sanctions: \"its `./gradlew`\
  \ wrapper for Gradle repos\")\nand/or session-init per-root facts — and proceed\
  \ to execute the real\nbuild/test zero-failure assertion.\n\n## Actual Behavior\n\
  \nStep 7.4 is unconditional: \"If the commands cannot be discovered from the\nmanifest,\
  \ hard-fail: state `MANIFEST_FAIL`, exit non-zero, and do NOT proceed —\nthe release\
  \ PR is blocked,\" and `MANIFEST_FAIL` is classified an assertion\nfailure (no retry\
  \ within the release run). Result observed live\n(2026-11-12, DoiUpdaterCurrent):\
  \ release run ended at `MANIFEST_FAIL` with\nevery repo verified at its remote trunk\
  \ tip and the candidate untested —\nblocked on missing paperwork, not on a failing\
  \ build.\n\n## Additional Context\n\n- The conflict is structural: the floor sanctions\
  \ the wrapper; the gate\n  permits only manifest-discovered commands; `.opencode/AGENTS.md`\
  \ (a common\n  deck location) is prohibited from carrying commands.\n- Related closed\
  \ specs that produced the current gate text: #2439 (original\n  gate), #2557, #2590\
  \ (pre-PR relocation + no-retry rescope).\n- Possible remediation directions for\
  \ triage (not prescriptive): define a\n  sanctioned discovery order (declared manifest\
  \ → session-init per-root\n  facts → the repo's documented wrapper), demote manifest\
  \ absence from a\n  blocking assertion to a remediable entry-criteria item, or have\n\
  \  session-init emit per-root build/test commands as a declared source.\n\n"
