spec:
  rounds:
    - round: 1
      date: 2026-11-19
      artifact: spec.md
      verdict: FAIL
      findings:
        - class: incapable-instrument (weaker-question shape) with internal inconsistency between requirements and criteria
          ground: >-
            SC-4's byte-exact guard scoped to three preserved passages, while R-3
            enumerates four preserved statement groups — the non-interactive
            issue-state comments route (card item 5) was guarded by no other SC,
            so that prong of R-3 was verifiable only by assertion. The row's
            prose ("three preserved passages") also misdescribed R-3's four-item
            enumeration.
          remediation: >-
            SC-4's criterion and instrument widened to cover all four enumerated
            groups (plain-issue state-mutation gap, PR-state mutation guidance,
            non-interactive issue-state comments route, attempt-first general
            sentences); Traceability §6 note states the guard's coverage.
            Remote body SC-4 row reconciled to the same content.
      classes_adjudicated:
        - class: incapable-instrument (weaker-question shape) with internal inconsistency between requirements and criteria
          classification: finding
      re_evaluation: none
    - round: 2
      date: 2026-11-19
      artifact: spec.md
      verdict: FAIL
      findings:
        - class: fabricated-claims / cross-reference sufficiency
          ground: >-
            R-1, Root Cause 1, and SC-1 asserted POST repos/{owner}/{repo}/issues/{n}/labels
            as a working endpoint with no cited evidence — the evidence chain
            (filed report / session transcript) records only PUT .../issues/78/labels
            succeeding and GET .../labels confirming ["spec"]; no POST attempt,
            result, or source row existed. Verifiable at write time, so a finding
            regardless of POST's actual status; load-bearing because SC-1 as then
            written would bake an unevidenced capability claim into the passage
            whose purpose is ending unevidenced capability claims.
          remediation: >-
            R-1 scoped to the evidenced pair (PUT/GET, observed 2026-11-18); sibling
            label-endpoint methods (e.g. POST) named as attempt-first subjects only;
            Root Cause 1 and SC-1 (local and remote-body rows) reconciled; new
            Key Design Decision records the evidenced-only-authoring correction of
            the source report's R-1.
      classes_adjudicated:
        - class: fabricated-claims / cross-reference sufficiency
          classification: finding
      re_evaluation: none
    - round: 3
      date: 2026-11-19
      artifact: spec.md
      verdict: FAIL
      findings:
        - class: internal contradiction (wrong/stale count)
          ground: >-
            Key Design Decisions bound the required row to "the three content
            elements R-1 names" while R-1 (after the round-2 POST-demotion
            remediation) enumerates four and SC-1 checks four — sections
            disagreed on the same deliverable statement's composition.
          remediation: >-
            The design-decision bullet's count reference removed — it now binds
            the row to the content elements R-1 itself enumerates, restoring
            single-sourcing (the composition lives once, in the requirement).
      classes_adjudicated:
        - class: internal contradiction (wrong/stale count)
          classification: finding
      re_evaluation: none
    - round: 4
      date: 2026-11-19
