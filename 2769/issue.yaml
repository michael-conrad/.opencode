title: 'local-issues: remote-tracker number as record identity anchor (diverged-store
  migration, sweep detection, mirror-repair doctrine)'
status: open
labels:
- spec
body: '### Problem


  For every issue store with a live remote tracker (host-mapped GitBucket via `local-issues-host-maps.conf`,
  or github.com), the tracker-assigned number is the record''s identity anchor in
  doctrine (issues card §2; sync-mirroring "remote-first"), but three surfaces do
  not hold the anchor: no tool surface detects a record whose folder number disagrees
  with its tracker identity, no doctrine text guards the mirror-repair moment against
  following a stored phantom-folder precedent, and no disposition exists for stores
  already diverged when discovery arrives.


  Observed: `NewSRX-Tech-LLC/ClinicaltrialsStagingLoader` minted its ticket record
  at counter-derived `2440/` (2026-09-18, `.counter` bump 1→2442 in store commit `f30a11a`)
  while the tracker had assigned the same ticket `issues/1`; no tool surface flagged
  the divergence for 2+ months — a downstream developer question surfaced it. The
  2026-11-23 mirror-repair session then created the correct local `1/` record, deleted
  it 44 seconds later (store history `c6c2dbd` → `c6fad10`), kept the phantom, wrote
  a spec-audit validation record onto the phantom, and reconciled remote `issues/1`
  to closed against the phantom state.


  Fact-check note (2026-11-24 triage): the derivation mechanism the original report
  names no longer exists in the live tool — `create` requires an explicit `--number`,
  mints nothing, and carries zero `.counter` references; the mechanism was the attic-era
  deck''s, removed with the pre-rip task lists (`.opencode#2774`''s audit-verified
  sweep, re-verified this triage). The residual defect class — divergence detection,
  repair doctrine, reconciliation disposition — is real and undelivered, and is what
  this spec governs.


  ### Scope


  Three deliverables, all in `.opencode` (single-repo scope):


  1. **Tool — `validate-yaml` identity classes (R-2):** on a tracker-host store, the
  read-only sweep flags records that (a) lack a resolvable `remote_url`, (b) carry
  a `remote_url` whose issue number disagrees with the record''s folder number, or
  (c) carry a `remote_url` whose repo slug disagrees with the store''s repo — each
  a named error class in the existing machine-greppable report; locally decidable
  facts only (host maps, origin, record fields), never a remote issues-system API
  contact; scoped `--number` form and exit semantics per `.opencode#2450`; the deck''s
  CLI-mechanics reference (`skills/issues/references/local-issues-cli.md`) — the doc
  the issues card §1 routes tool mechanics through — is carried in the same change,
  its `validate-yaml` behavior row and taxonomy enumeration stating the delivered
  classes. `doctor` may roll up a repo-level marker.

  2. **Card — issues §7 doctrine (R-3, R-4):** the identity-anchor doctrine at the
  mirror-repair moment (the just-created correct record is never deleted in favor
  of a stored phantom folder; a stored pointer naming a different folder is the defect
  to repair, never the precedent to follow) and the diverged-store reconciliation
  disposition (renumber local folders and in-record pointers to the tracker-assigned
  number via the existing `renumber` command; pointer corrections — remote body via
  the platform CLI, local cross-references — in the same workflow; alias-keeping is
  not the disposition; collisions resolved from record identities, never silently
  overwritten).

  3. **Preserved write-side invariant (R-1):** `create` requires explicit `--number
  repo#N`, never mints/derives/defaults a number from store state (`.counter`, folder
  enumeration, anything local), and the #2723 creation-time divergence warning remains
  in force.


  ### Requirements


  - **R-1** (tool) — the remote-tracker-assigned number is the only registration identity
  on tracker-host stores; explicit `--number` required; no store-state derivation;
  #2723 warning preserved.

  - **R-2** (tool) — `validate-yaml` detects record-identity divergence (missing `remote_url`,
  issue-number mismatch, repo-slug mismatch) as named error classes; local facts only;
  no remote API contact; #2450 scan/exit semantics; CLI-mechanics reference carried
  in the same change.

  - **R-3** (card, §7) — diverged-store reconciliation disposition: renumber to the
  tracker-assigned number, same-workflow pointer corrections, no alias disposition,
  identity-decided collision resolution.

  - **R-4** (card, §7) — identity-anchor doctrine: the anchor statement, the anti-phantom-precedent
  prohibition, and the stored-pointer-is-the-defect rule.


  ### Success criteria


  | ID | Criterion (summary) | Class | Instrument |

  |----|---------------------|-------|------------|

  | SC-1 | `create` requires `--number`; no store-state derivation input; #2723 warning
  wording present in the create path | structural | `create -h` read + emission-site
  read + symbol sweep |

  | SC-2 | Sweep flags seeded divergent records; silent on consistent records; runs
  offline | behavioral | seeded scratch-store `validate-yaml` run (offline) |

  | SC-3 | Issues card §7 carries the reconciliation disposition per R-3 | structural
  | read/grep of `skills/issues/SKILL.md` §7 |

  | SC-4 | Issues card §7 carries the anchor doctrine per R-4 | structural | read/grep
  of `skills/issues/SKILL.md` §7 |

  | SC-5 | CLI-mechanics reference''s `validate-yaml` row and taxonomy carry the three
  delivered identity-divergence classes; flag inventory unchanged | structural | read/grep
  of `skills/issues/references/local-issues-cli.md` against the delivered classes
  |


  ### Out of scope


  The #2723 warn→refuse redecision (unimplementable without widening the tool''s remote-API-contact
  boundary); tool-side remote-body pointer correction (same boundary); `renumber`
  behavior changes (existing primitive unchanged); attic cleanup (pending soak/deletion
  under its own plan); root-repo (`opencode-config`) source changes (none — root store
  unaffected); the delivered #2774 card-doctrine acquisition half (composes; re-opened
  by nothing here).


  ### Approach


  Detection + doctrine over the preserved invariant: prevention is delivered (#2774,
  closed 2026-11-25), and this spec adds the three unheld surfaces the triage ground
  names — detection when divergence slips through (R-2), unmissability at the mirror-repair
  moment (R-4), and the reconciling disposition for the diverged-store population,
  decided for renumber over aliases (R-3). Alternatives weighed and discarded: #2723
  refuse redecision, alias disposition, bulk automated migration, extending #2774''s
  delivered change.


  ### Impact


  Consumers: every validating session (sweep exit codes gate record hygiene per `.opencode#2755`),
  §7-governed repair sessions, and stores carrying legacy counter-derived folders.
  Blast radius: `.opencode/tools/local-issues` (sweep classes), `skills/issues/SKILL.md`
  §7 (doctrine), `skills/issues/references/local-issues-cli.md` (`validate-yaml` behavior
  row + taxonomy — carried with R-2''s delivery), and this store''s artifacts — no
  root-repo source, no remote API contract change, counter semantics untouched.


  ### Provenance


  Routed canonical record for `.opencode#2770` (closed duplicate — re-triage and work
  requests land here; that record''s forensic grounds live in its own store folder).
  History: filed report → routed triage 2026-11-24 (fix facets 1–5) → converted in
  place to the governing spec (work-entry conversion, 2026-11-24). Original report
  filed 2026-11-24; sibling card-doctrine fix `.opencode#2774` filed and delivered
  same day.


  > Full spec and plan artifacts: https://github.com/michael-conrad/.opencode/tree/issues-data/2769/


  AI ingest: read `.opencode/.issues/2769/` (local-authoritative).

  '
