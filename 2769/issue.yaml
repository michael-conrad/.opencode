title: 'local-issues: store-local .counter numbers diverge from remote tracker numbers
  (remote API should be authoritative)'
status: open
labels:
- needs-approval
body: '### Summary


  The `local-issues` tool derives local issue-store folder numbers from a store-local
  `.counter`, even when the repository has a live remote tracker that assigns its
  own number via the API. The two number spaces diverge, so a ticket carries two non-matching
  identities (e.g. GitBucket `issues/1` vs local `.issues/2440/`), and operations
  literally targeting the remote number — read, audit dispatch, `create --number repo#N`
  mirror-repair — either miss the existing local record or fabricate a duplicate record
  for the ticket.


  ### Expected behavior


  Per the deck''s own rule (issues card §2 creation; sync-mirroring "Remote-first
  number reservation"), when a host-mapped remote tracker exists the remote API should
  be the authoritative source for the spec/ticket number: the local folder and all
  local identities derive from the tracker''s API-assigned number. `.counter` sequence
  numbering is reserved for remoteless stores.


  ### Actual behavior (observed)


  Repo `NewSRX-Tech-LLC/ClinicaltrialsStagingLoader`, store initialized 2026-09-18
  (`issues-data` commit `f30a11a` "auto: create #ClinicaltrialsStagingLoader#2440"):


  - The creation commit bumped `.counter` from `1` to `2442` and registered the ticket
  as `.issues/2440/` — the remote tracker (GitBucket, host-mapped) had assigned, and
  still carries, the same ticket as **issue #1** (`https://gitbucket.newsrx.com/gitbucket/NewSRX-Tech-LLC/ClinicaltrialsStagingLoader/issues/1`,
  whose body correctly points to the local artifacts at `.issues/2440/`).

  - Consequence observed in a session on 2026-11-23: reading "spec audit #1" resolved
  against the tracker number, found no local record (#1 absent, "recent issue numbers:
  #2440"), and a follow-up `create --number repo#1` produced a **spurious duplicate
  local record** (deleted after reconciliation). The store''s own docs (`sync-mirroring.md`
  remote-first reservation) are contradicted by the tool''s actual number-derivation
  path when a tracker exists.


  ### Impact


  - Cross-identity confusion for any workflow keyed on the tracker number (audits,
  dispatches, mirror repair).

  - Potential duplicate local records / forked number space per the tool''s own local-only-registration
  warning.

  - Affects every store-host with a host-mapped tracker (GitBucket via `local-issues-host-maps.conf`,
  github.com).


  ### Suggested fix (deck-governance)


  1. **Tool:** `.opencode/tools/local-issues` — when a live tracker exists for the
  store host, folder numbers derive from the tracker''s API-assigned number (remote-first,
  remote-authoritative); keep `.counter` only for remoteless stores.

  2. **Cards:** amend issues card §2 and `sync-mirroring.md` to state remote-API number
  authority explicitly.

  3. **Migration:** define the reconciling disposition for already-diverged stores
  — either renumber local folders to tracker numbers, or keep legacy folders and register
  both numbers as cross-linked aliases (one open design choice).


  ### Evidence


  - `git -C .issues show f30a11a -- .counter` — counter bump 1→2442 at creation

  - local store: `.issues/2440/issue.yaml` (closed); remote: `gb api repos/NewSRX-Tech-LLC/ClinicaltrialsStagingLoader/issues/1`
  (same ticket, state closed)

  - session transcript 2026-11-23: audit-target resolution miss + duplicate registration,
  reconciled in-workflow


  ### Routed triage ground (canonicalized from .opencode#2770, 2026-11-24 triage)


  Same incident, same requirement class: the remote-tracker-assigned number is the
  store record''s identity anchor for any live-tracker store — divergence must be
  prevented at derivation (#2774''s delivered card-doctrine half; this report''s tool
  half), detected when it slips through, and unmissable during mirror-repair. `.opencode#2770`''s
  report ground routes here in place (its record closes duplicate; re-triage and work
  requests land here). Triage rendered against post-freshness-sync state: root `opencode-config`
  @ `385a8a70` (= `origin/main`), submodule `.opencode` trunk-tip checkout @ `6c12d378`
  (= its `origin/main`); sanctioned parent-gitlink drift (`7e50437b`) recorded, not
  resolved.


  Evidence addition (2026-11-23 11:22–11:26 EST session, store git history `c6c2dbd`
  → `c6fad10`): the session executed mirror-repair backwards — created the correct
  local `1/` record, deleted it 44 seconds later, kept phantom `2440/`, wrote the
  spec-audit validation record (`issue: 2440`) onto the phantom, and reconciled remote
  `issues/1` to closed against the phantom state. No tool surface (`init`/`sync`,
  audit round) flagged the divergence for 2+ months; a downstream developer question
  surfaced it.


  Fix facets added:


  4. **Mirror-repair identity anchor (card — issues §7):** state what makes "the remote-assigned
  number is the identity anchor" unmissable during mirror-repair and forbid deleting
  a just-created correct record in favor of a stored phantom folder; the stored pointer
  naming a different folder is the defect to repair, never the precedent to follow.

  5. **Divergence detection (tool — `doctor`/`validate-yaml`):** a fact-decidable
  divergence check — local record number vs resolvable remote identity (`remote_url`),
  record-pointer resolvability — surfaced by the read-only health/validation sweep;
  open design inputs for the spec: predicate classification (fact-decidable per the
  floor) against the tool''s remote-API-contact boundary (issues §7: local-issues
  commands never contact a remote issues-system API).


  Co-authored with AI: OpenCode (huggingface/zai-org/GLM-5.3-Flash)


  Sibling card-doctrine fix (filed 2026-11-24): https://github.com/michael-conrad/.opencode/issues/2774
  — number-acquisition recipe and prohibition in card text; this report keeps the
  tool-side fixes (1) and the diverged-store migration (3).


  > Full spec and plan artifacts: https://github.com/michael-conrad/.opencode/tree/issues-data/2769/

  AI ingest: read `.opencode/.issues/2769/` (local-authoritative).


  '
