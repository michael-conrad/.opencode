title: '[SPEC] Agent-facing guidance: never modify an already-applied database schema
  migration; never run schema updates from uncommitted working-tree content'
status: open
labels:
- needs-approval
body: '## Problem


  The deck''s agent-facing guidance carries no prohibition against modifying a database
  schema update after a persistent database has applied it, and none against executing
  schema updates against a persistent database from uncommitted working-tree content.
  Both operations permanently desynchronize a database''s recorded apply-time state
  from every version in history. The reporting incident (NewSRX-Tech-LLC `PM_Xml2Dbf_Feed`
  family, 2026-11-24): migrations V6/V7 ran against the **production** database from
  an **uncommitted working tree** 13 minutes before their first commit; the committed
  final content later applied cleanly to the test database; the production database''s
  recorded checksums match content **no commit ever contained** — its schema/data-level
  effects are identical to the committed content, yet validation fails permanently
  and no version in history can satisfy it.


  ## Scope


  The deck repository (`michael-conrad/.opencode`) only: one new guidance document
  (`guidelines/database-migrations.md`) carrying both prohibitions toolkit-agnostically
  with rationale, persistence boundary, and compliant additive route; two discovery
  pointers (`implement` card conditional pointer when the change touches schema/migrations;
  `programming-principles` card expectations-layer pointer, following its existing
  prose-link reference pattern); behavioral verification through the deck''s tests-v2
  harness. Consuming-repository changes are out of scope.


  ## Requirements


  - **R-1 (SHALL):** An admonishment prohibiting modification of a database schema
  update after a persistent database applied it — covering both editing the applied
  file''s content and re-running the applied file with edited content, in any branch
  or working tree.

  - **R-2 (SHALL):** The corollary admonishment prohibiting execution of a schema
  update against a persistent database from content not recorded in any commit (dirty
  or staged-but-uncommitted working-tree content included).

  - **R-3 (SHALL):** Both prohibitions stated toolkit-agnostically — the rule names
  the class (schema update, applied migration, persistent database); specific tools
  (Flyway, Liquibase, Alembic, Django migrations) appear only as examples.

  - **R-4 (SHALL):** The failure-class rationale as a consequence chain: apply-time
  metadata (e.g. a content checksum) bound to the exact content present at run time;
  recorded metadata matching content no commit ever contained is satisfiable by no
  version in history; editing the applied file''s content cannot reconcile the record
  (it binds to apply-time bytes).

  - **R-5 (SHALL):** Discoverability — the `implement` card carries a conditional
  pointer (fires when the change touches database schema or migrations) and the `programming-principles`
  card''s expectations layer carries a pointer.

  - **R-6 (SHALL):** The persistence boundary — prohibitions apply to persistent databases;
  ephemeral/throwaway/in-memory databases used for disposable verification are outside
  them; uncertainty about persistence or applied-state resolves toward the prohibitions
  holding.

  - **R-7 (SHOULD):** The compliant route is named — schema evolution proceeds as
  new, additive migration content applied from committed state.


  ## Success criteria


  | ID | Criterion | Class | Instrument |

  |----|-----------|-------|------------|

  | SC-1 | Guidance document exists and carries the R-1 prohibition (both covered
  actions) | structural | grep-locate + read the prohibition passage in `guidelines/database-migrations.md`
  |

  | SC-2 | The document carries the R-2 corollary (committed-content bar for execution
  against a persistent database) | structural | grep-locate + read the corollary passage
  |

  | SC-3 | Both prohibition statements name the class, not a tool | structural | read
  both passages; normative sentences take the class as object |

  | SC-4 | The document states the R-4 consequence chain (apply-time binding; no-history-satisfies;
  edits-cannot-reconcile) | structural | read the rationale passage against R-4''s
  elements |

  | SC-5 | Persistence boundary + both uncertainty defaults stated (R-6) | structural
  | read the boundary passage (in-scope class, out-of-scope class, uncertainty default)
  |

  | SC-6 | The compliant additive route is named (R-7) | structural | grep-locate
  + read the additive-route passage |

  | SC-7 | Discovery pointers exist in both target cards | structural | `grep -n "database-migrations"`
  across both card files; resolvable relative link in each |

  | SC-8 | An agent under the deck performs neither prohibited action in the incident''s
  situation (recorded session evidence) | behavioral | tests-v2 behavioral scenario
  executed per the `behavioral-testing` card; clean-room evaluation of recorded session
  evidence |


  ## Impact


  All agents operating under the deck in migration-bearing repositories gain the prohibition
  and its boundary; two deck cards gain one pointer each (blast radius: their readers);
  one new guideline document (no index exists — discovery rides cross-references);
  no floor text changes; the tests-v2 harness gains one scenario, no new machinery.
  The deck-wide reach for DB-touching work is the ask; risk beyond guidance text is
  nil.


  ## Out of scope


  Mechanical (hook/script) enforcement — classifying persistence and applied-state
  is intent-decidable and the floor''s safety rule states intent-decidable rules are
  never scripted; per-tool migration configuration guidance; remediation procedure
  for an already-diverged database (consuming-repo incident response); consuming-repository
  changes.


  ## Approach


  One cross-cutting guidance document under `guidelines/` (the deck''s guideline surface
  carries rules whose applicability is conditional; the floor is reserved for universally-injected
  material). Progressive disclosure makes text-present-but-never-loaded the live failure
  mode, so success includes an executed behavioral scenario, not only content checks.


