body: '# SPEC: Adversarial-Audit Dispatch Boilerplate — Correct Call Format + Next_Step
  Routing


  ## Problem


  Six SKILL.md files contain copy-paste boilerplate routing to `adversarial-audit`
  that uses incorrect CLI-style invocation (`adversarial-audit --task <task> --issue
  <N>`) instead of the correct MCP call (`skill({name: "adversarial-audit"})` with
  dispatch context). None of the six references tell the orchestrator what to do with
  the audit result — they just dispatch.


  The verdict format standardized by #529 includes a `next_step` field that the orchestrator
  reads literally to determine routing. The boilerplate should reference this so the
  orchestrator knows it reads `next_step`, not interprets PASS/FAIL.


  ## Success Criteria


  ### SC-1: All six Operating Protocols updated


  Update the six boilerplate instances to:


  1. Use correct MCP invocation format: `skill({name: "adversarial-audit"})` with
  `audit_phase: <phase>` in dispatch context

  2. Reference that the orchestrator reads `next_step` from the YAML verdict to determine
  routing — it does not interpret PASS/FAIL itself


  #### Affected locations:


  | Skill | Operating Protocol | Current (example) |

  |---|---|---|

  | `skills/issue-operations/SKILL.md` | §6 | `adversarial-audit --task concern-separation
  --issue <N>` |

  | `skills/pr-creation-workflow/SKILL.md` | §5 | `adversarial-audit --task spec-summary
  --pr <N>` |

  | `skills/spec-creation/SKILL.md` | §6 | `adversarial-audit --task spec-audit --issue
  <N>` |

  | `skills/verification-before-completion/SKILL.md` | §2 | `adversarial-audit --task
  drift-detection --issue <N>` |

  | `skills/writing-plans/SKILL.md` | §2 | `adversarial-audit --task plan-fidelity`
  and `concern-separation` |

  | `skills/git-workflow/SKILL.md` | §8 | `adversarial-audit --task closure-verification
  --pr <N>` |


  ### SC-2: Format consistency across all six


  Each update follows the same pattern:


  ```

  **Adversarial-audit call:** after <event>, call `skill({name: "adversarial-audit"})`
  with `audit_phase: <phase>` in dispatch context. The orchestrator reads the `next_step`
  field from the YAML verdict to determine routing — it does not interpret PASS/FAIL
  status values.


  ## Files Affected


  | File | Change |

  |---|---|

  | `skills/issue-operations/SKILL.md` | §6 format + next_step |

  | `skills/pr-creation-workflow/SKILL.md` | §5 format + next_step |

  | `skills/spec-creation/SKILL.md` | §6 format + next_step |

  | `skills/verification-before-completion/SKILL.md` | §2 format + next_step |

  | `skills/writing-plans/SKILL.md` | §2 format + next_step |

  | `skills/git-workflow/SKILL.md` | §8 format + next_step |


  ## Out of Scope


  - Changes to adversarial-audit SKILL.md or task files (verdict format is already
  correct per #529)

  - Changes to the verdict parsing logic or `next_step` vocabulary


  ---

