- body: '**Dependency:** #527 (Authorization Scope Model Overhaul) must be implemented
    first. This issue references `for_review_prep` throughout — if #527 has not landed,
    replace `for_review_prep` with `standard` in the patterns above.


    #527 was re-opened on 2026-05-15 after verification showed it was closed without
    implementation (all files still contain `standard` instead of `for_review_prep`).


    The three defects documented here and in the #527 comment:

    1. **Word-order gap** — scope-parsing table only matches number-first patterns

    2. **Missing intelligence fallback** — no path between "exact match" and "default
    to standard"

    3. **`standard` misnomer** — #527''s SC-1 (renamed to `for_review_prep`)


    🤖 Co-authored with AI: OpenCode (ollama-cloud/glm-5.1)'
