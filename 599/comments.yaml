- body: "## Deeper Defect: Missing Intelligence Fallback Rule\n\nThe table gap is\
    \ only half the problem. The other half is a **philosophical contradiction in\
    \ the skill deck** about what happens when the table has no exact match.\n\n###\
    \ The Contradiction\n\nThree rules say \"resolve this autonomously\":\n\n1. **`critical-rules-006`**:\
    \ \"Pushing Agent Intelligence Decisions to the User\" — structural decisions\
    \ auto-resolved by agent\n2. **`020-go-prohibitions.md` §1.5**: \"Soliciting Authorization\
    \ for Already-Authorized Phrases — CRITICAL VIOLATION\" — never ask for confirmation\
    \ when authorization is present\n3. **`scope-auto-resolve.md` line 11**: \"Under\
    \ NO circumstances does the agent ask the user to classify scope\"\n\nBut the\
    \ fallback instruction in **`scope-auto-resolve.md` line 26** says:\n\n> If no\
    \ qualifier matches, set `authorization_scope = \"standard\"` with `scope_source\
    \ = \"default\"`.\n\nThis gives the agent exactly two options: **exact table match**\
    \ or **default to standard**. There is no third option for \"near match — use\
    \ intelligence to resolve.\"\n\n### What Happened\n\nWhen I received \"approved\
    \ for pr 578\":\n\n1. No table entry matched (word order gap)\n2. The fallback\
    \ says: default to `standard`\n3. I knew `standard` was wrong — \"approved for\
    \ pr\" clearly means `for_pr`\n4. But the rules didn't give me a way to use intelligence\
    \ to bridge the gap\n5. So I asked the user — violating §1.5\n\nThe table made\
    \ me a dumb terminal: match or no-match. No room for the language understanding\
    \ that \"approved for pr\" obviously maps to `for_pr` scope regardless of where\
    \ the number appears.\n\n### The Missing Rule: Intelligence Fallback for Scope\
    \ Parsing\n\nWhat's needed is an explicit rule in `scope-auto-resolve.md` (and\
    \ cross-referenced in `020-go-prohibitions.md`) that says:\n\n> **Intelligence\
    \ Fallback:** When the verb-prefix parsing table has no exact match for an authorization\
    \ phrase, but the phrase unambiguously contains an authorization keyword (\"approved\"\
    , \"go\", etc.) and a scope qualifier (\"pr\", \"implementation\", \"plan\", \"\
    spec\", \"review\", \"code review\"), the agent MUST resolve the scope using language\
    \ understanding — NOT default to `standard` and NOT solicit user confirmation.\n\
    > \n> The qualifier keyword determines scope, not word order. \"Approved for pr\
    \ 578\", \"578 approved to PR\", and \"approved 578 for PR\" all resolve to `for_pr`.\
    \ The number's position in the phrase is irrelevant to scope determination.\n\
    >\n> If the phrase contains an authorization keyword but NO identifiable scope\
    \ qualifier, then default to `standard` scope. If the phrase is genuinely ambiguous\
    \ (multiple conflicting qualifiers), set `scope_source = \"ambiguous\"` and use\
    \ best-match reasoning — still do NOT ask the user.\n\nThis rule makes the parsing\
    \ table a **primary heuristic** with an **intelligence fallback** for near-matches,\
    \ instead of a rigid binary (match/standard) that turns the agent into a dumb\
    \ matcher.\n\n### Impact Without This Fix\n\nEven after adding the missing table\
    \ entries, any future phrase that doesn't exactly match a table pattern will hit\
    \ the same failure mode. The real fix is the intelligence fallback principle —\
    \ the table is a fast-path, not a straitjacket.\n\n\U0001F916 Co-authored with\
    \ AI: OpenCode (ollama-cloud/glm-5.1)"
