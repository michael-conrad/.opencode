- body: '## Additional Defect: `standard` scope name is a misnomer


    The scope value `standard` is a third defect in the same system. Every other scope
    is named after its **halt point**:


    | Scope | HALT After |

    |---|---|

    | `for_spec` | spec_created |

    | `for_plan` | plan_created |

    | `for_implementation` | implementation_complete |

    | `for_code_review` | code_review_ready |

    | `for_pr` | pr_created |

    | `pr_only` | pr_created |

    | `review_only` | code_review_ready |

    | **`standard`** | **review_prep** |


    `standard` is the only scope NOT named after its halt point. It halts at `review_prep`,
    but you''d never know that from the name. The corresponding label is `approved-for-review-prep`
    — which DOES use the halt-point convention.


    This creates three problems:


    1. **Semantically opaque**: "standard" tells you nothing about what the pipeline
    does. Every other scope name is self-documenting (`for_pr`, `for_implementation`).
    `standard` requires you to look up a table to understand what happens.


    2. **Fallback naming encourages dumb-terminal behavior**: `scope-auto-resolve.md`
    line 26 says "If no qualifier matches, set `authorization_scope = "standard"`
    with `scope_source = "default"`." The name `standard` sounds like a safe default
    — a sensible fallback — when actually it''s the review-prep halt point with zero
    gap-fill. The naming subtly validates the "fall through to default" behavior instead
    of flagging it as "the pipeline halts at review-prep with no auto-fill" — which
    is a very specific, very constrained scope.


    3. **Three names, one concept**: The label says `approved-for-review-prep`, the
    halt point says `review_prep`, but the scope key says `standard`. The agent has
    to mentally map three different names for one concept. Every other scope has two
    names that align: `for_pr` ↔ `approved-for-pr`, `for_implementation` ↔ `approved-for-implementation`.


    **Proposed fix**: Rename `standard` → `for_review_prep` everywhere. The scope-parsing
    table becomes:


    ```

    | "approved #N" (no qualifier) | for_review_prep | review_prep | None | individual
    |

    ```


    This aligns with:

    - The halt point: `review_prep`

    - The label: `approved-for-review-prep` (already uses this convention)

    - Every other scope''s naming: `for_<stage>`

    - The intelligence fallback: "no qualifier" doesn''t mean "default" — it means
    "halt at review-prep, no auto-fill"


    **Files requiring update:**

    - `approval-gate/enforcement/scope-parsing.md`

    - `approval-gate/enforcement/auto-dispatch-table.md`

    - `approval-gate/tasks/verify-authorization/scope-auto-resolve.md`

    - `approval-gate/tasks/verify-authorization/gap-fill-cascade.md`

    - `approval-gate/tasks/verify-authorization.md`

    - `010-approval-gate.md` (Authorization Scope Model table)

    - `020-go-prohibitions.md` (scope parsing examples)

    - `000-critical-rules.md` (scope references)

    - `issue-operations/platforms/github-mcp/SKILL.md` (label mapping)

    - `issue-operations/platforms/local/SKILL.md` (label mapping)

    - `issue-operations/platforms/gitbucket-api/SKILL.md` (label mapping)

    - `divide-and-conquer/tasks/orchestrate.md` (default context)


    🤖 Co-authored with AI: OpenCode (ollama-cloud/glm-5.1)'
