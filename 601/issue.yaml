body: '> **Full spec and artifacts: [`.opencode/.issues/601/`](https://github.com/michael-conrad/.opencode/tree/issues-data/601)**
  — this issue is a condensed exec summary; the authoritative spec lives in the `issues-data`
  branch.

  >

  > **Local artifacts:** `.opencode/.issues/601/` — implementation plan, card catalogue,
  dependency contracts, research, designs, audit findings


  *Migrated from [michael-conrad/opencode-config#21](https://github.com/michael-conrad/opencode-config/issues/21)
  — filed against the wrong repo. Spec replaced 2026-10-06 with a clean-room spec
  per the developer''s re-focused requirements.*


  ## Why


  The identity pipeline resolves every repo entry (`## Repo Information`) from the
  clone''s origin URL alone. When that URL is a fork — a forked root repo, or a submodule
  tracking one — the agent sees the fork''s identity and cannot know an upstream exists,
  so issue routing targets the fork silently. Whether that is correct depends on the
  workflow, so the decided fix exposes the fact instead of redirecting: fork status
  and parent become visible context, and routing judgment stays where it is.


  ## Final What


  - session-init gains a best-effort, **fire-and-forget background probe** of fork
  status + parent for each resolved repo (root and mapped submodules), via the authenticated
  platform CLIs only — `gh repo view --json isFork,parent` on GitHub; the authenticated
  `gb` interface on GitBucket. session-init never touches the network synchronously:
  its runtime is identical online or offline.

  - Results are stamped at `<git-common-dir>/opencode/fork.json` — inside `.git/`,
  auto-ignored, per-clone — keyed on origin URL, 30-day TTL, atomic writes, negative
  results cached. Steady state: zero API calls per session; offline sessions still
  render the annotation.

  - When a valid stamp says fork, the repo''s entry gains one factual line — `fork_of:
  <owner>/<repo>`. Absent otherwise. No routing rule, skill, or guideline changes;
  the annotation is context only, never a routing input.

  - Every failure mode is silent: no annotation, no warnings, no retries. The first
  session in a fresh clone may show no annotation until the background probe lands
  — accepted.


  Success criteria SC-1 through SC-8 (behavioral and structural, each with a verification
  instrument) are defined in the local spec.


  🤖 Co-authored with AI: OpenCode (huggingface/zai-org/GLM-5.3-Flash)

