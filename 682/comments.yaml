- body: '## Amendment: Scope Gaps from Superseded Issues


    Per investigation of the five superseded issues (#591, #597, #598, #604, #606)
    and the rollback casualty in `check-pr.md` (Step 3.5 lost in `6db0610d`), the
    following gaps exist in this spec''s current scope:


    ### Gap 1 (Critical): `check-pull-requests` Missing Submodule PR Status Check


    **Source:** Rollback casualty from #232 (commit `315adb06`, lost in `6db0610d`)


    The renamed `check-pull-requests` task contract must include a submodule PR status
    check. Currently, `check-pr.md` Step 3 evaluates only parent-repo branches. Without
    a submodule PR query, merged submodule PRs with uncleaned branches are never detected,
    so submodule cleanup is never triggered. The `post-merge-cleanup` task already
    has submodule handling (Steps 0, 1.9, 4) — the gap is in the trigger, not the
    handler.


    **Required amendment to the spec:**

    - `check-pull-requests` contract must include: query submodule repos (from `.gitmodules`)
    for merged PRs with uncleaned branches; if found, cascade to submodule cleanup
    as part of the post-merge chain


    ### Gap 2 (Moderate): `post-merge-cleanup` Authorization Boundaries for Destructive
    Ops


    **Source:** #604


    The restructured `post-merge-cleanup` task contract should explicitly document
    which operations are auto-authorized on non-protected branches during cleanup:

    - `git push --force` (squash push) on feature/ branches

    - `git push origin --delete` (remote branch deletion) on feature/ branches

    - Protected branches: `main`, `master`, `dev` — these still require authorization
    per critical-rules-026


    Without this, sub-agents dispatched during cleanup halt to ask for permission
    on every force push.


    **Required amendment to the spec:**

    - `post-merge-cleanup` contract must include an "Authorization Boundaries" section
    documenting auto-authorized destructive ops on non-protected branches


    ### Gap 3 (Minor): `sync-branch` Conflict Detection Protocol


    **Source:** #591


    The new `sync-branch` task (mid-feature dev sync) needs an explicit conflict detection
    protocol. Currently, no defined mechanism exists for the orchestrator to detect
    git conflicts — neither in SKILL.md nor in any operating protocol. Conflicts are
    detected via:

    - Failed `git rebase`/`git merge` exit codes (non-zero)

    - `CONFLICT` markers in working tree (`git diff --check`)


    The `sync-branch` contract should document that conflict detection is its precondition
    — if conflicts are found, it routes to `conflict-resolution` before continuing.


    **Required amendment to the spec:**

    - `sync-branch` contract must include conflict detection as a precondition step,
    with routing to `conflict-resolution` on detection


    ### Gap 4 (Moderate): `post-merge-cleanup` No-PR Scenario


    **Source:** #606 (partial)


    When `post-merge-cleanup` runs and there is no PR body (e.g., `for_implementation`
    scope that halted at `implementation_complete`, documentation-only changes, config
    changes), the current issue-closure path cannot discover closure candidates —
    it depends entirely on PR body parsing.


    The restructured `post-merge-cleanup` should include an alternative entry path
    for no-PR scenarios:

    - Build closure candidate list from issue state (open issues with `approved-for-*`
    labels, verified-complete phase markers)

    - Scan for stale issues (100% DONE but still open)

    - Present findings; do NOT close without verification


    **Required amendment to the spec:**

    - `post-merge-cleanup` contract must include a no-PR alternative candidate discovery
    path


    ### Non-Gaps (Naturally Resolved)


    - **#597/#598 (tag references):** These dangling `AGENTS.md` references exist
    in files that will be rewritten by this restructure. No separate amendment needed
    — the rewrite eliminates them by construction.

    - **#606 adversarial re-verification:** Crosses into `approval-gate` skill scope,
    not git-workflow. Out of scope for this spec.


    ---


    🤖 Co-authored with AI: OpenCode (deepseek-v4-flash)'
