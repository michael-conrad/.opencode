- body: "## Decomposition and Chain Analysis\n\nAs part of spec definition, the current\
    \ 28 task files were analyzed for natural decomposition boundaries.\n\n### Current\
    \ Task Architecture\n\n| Layer | Count | Examples |\n|-------|-------|---------|\n\
    | Entry-point (callable from orchestrator) | 9 | pre-work, check-pr, cleanup,\
    \ implementation, review-prep, pr-creation, release-promotion, provenance, completion\
    \ |\n| Internal subtask (called by parent task) | 13 | verify-merge, branch-cleanup,\
    \ issue-closure, pre-merge-verification, push-and-cleanup, report-url, squash-push,\
    \ enforcement-gate, create-pr, platform-detection, dev-push-provenance, promotion-provenance,\
    \ commit-prep |\n| Dual-role (entrypoint AND internal) | 1 | rebase-pending |\n\
    | Standalone | 5 | pair-* tasks |\n| Orphan/stub | 1 | pre-merge-verification\
    \ (67 words, subsumed by verify-merge) |\n\n### Structural Problems Found\n\n\
    1. **pre-work.md exceeds 3,000-word limit** (3,345 words) — violates `091-incremental-build.md`\
    \ atomic task file limit. Needs splitting.\n2. **rebase-pending.md has dual role**\
    \ — called both as an entry-point task and internally by verify-merge Step 2.\
    \ This creates a circular dependency risk.\n3. **cleanup/pre-merge-verification.md\
    \ (67 words) is an orphan** — verify-merge.md has its own full merge verification.\
    \ This file's single API read is subsumed.\n4. **SKILL.md word counts are uniformly\
    \ stale** — pre-work claimed 480w (actual 3,345), cleanup claimed 950w (actual\
    \ 1,805), etc. Every estimate is wrong.\n5. **Pair tasks have zero cross-references**\
    \ — no chain links to autonomous tasks, suggesting they operate in a fully parallel,\
    \ disconnected mode.\n\n### Proposed Decomposition (7 entry-point + chains)\n\n\
    The decomposition follows one rule: a task is an entry-point if and only if the\
    \ orchestrator needs to dispatch it independently. Everything else is an internal\
    \ subtask reachable only through a parent task's chain.\n\n| Entry-Point | Composes\
    \ Into |\n|-------------|---------------|\n| **pre-work** | → sync dev → create\
    \ branch → sync submodules → init .issues/ |\n| **implementation** | → execute\
    \ plan on branch (no subtask chain) |\n| **review-prep** | → push-and-cleanup\
    \ → report-url |\n| **pr-creation** | → enforcement-gate → squash-push → create-pr\
    \ |\n| **check-pr** | → [query PRs] → [decision: cleanup or HALT] |\n| **cleanup**\
    \ | → verify-merge → branch-cleanup → issue-closure → rebase-pending |\n| **release-promotion**\
    \ | → dev→main PR (no subtask chain) |\n\n### Chains (How the SKILL.md Card Shows\
    \ Recomposed Workflows)\n\n```\nStandard feature workflow:\n  pre-work → implementation\
    \ → review-prep → pr-creation\n\nPost-merge:\n  check-pr → cleanup\n\nRelease:\n\
    \  release-promotion\n\nStandalone:\n  rebase-pending   (callable standalone or\
    \ as cleanup tail)\n  completion       (terminal — every skill exit)\n  provenance\
    \       (conditional — submodule tag tracking verification)\n\nPair-mode (parallel\
    \ set, active when branch name starts with pair-):\n  pair-pre-work → pair-commit\
    \ → pair-pr-creation → pair-cleanup → pair-mode-resume\n```\n\n### Removed Tasks\n\
    \n| Task | Reason |\n|------|--------|\n| `pre-merge-verification` | Orphan —\
    \ subsumed by verify-merge |\n| `commit-prep` | Read-only — no dispatchable behavior;\
    \ commit validation belongs inline in implementation/review-prep |\n| `provenance/provenance.md`\
    \ as entrypoint | Provenance is a conditional sub-contract of pre-work/cleanup,\
    \ not a standalone orchestrator dispatch |\n\n### What This Means for the SKILL.md\
    \ Card\n\nThe card's Task section collapses from 15 listed tasks to 7 entry-point\
    \ tasks + 5 pair-mode tasks + 2 standalone tasks. Each entry-point shows its chain\
    \ in a Chain column. Internal subtasks (verify-merge, branch-cleanup, etc.) do\
    \ NOT appear in the card — they are documented only in their parent task's contract.\n\
    \nThe agent routes by chain, not by individual task selection. When the orchestrator\
    \ knows it needs to \"set up for implementation,\" it dispatches `pre-work` —\
    \ pre-work autonomously decides whether to invoke `provenance` internally based\
    \ on submodule state. The orchestrator never needs to know.\n\n\U0001F916 Co-authored\
    \ with AI: OpenCode (deepseek-v4-flash)"
