- body: "## Correction and Revised Decomposition\n\n### `implementation` removed from\
    \ git-workflow\n\n`implementation` is code edits, not git operations. It has been\
    \ removed from the git-workflow task set. The chain now routes cleanly: `setup-feature`\
    \ → `develop` — where `develop` is NOT a git-workflow task, it is dispatched through\
    \ `divide-and-conquer` which is the correct orchestrator for code work.\n\n###\
    \ Revised Entry-Point Tasks\n\n| Task | Former Name | Function |\n|------|-------------|----------|\n\
    | `setup-feature` | pre-work | Create branch, sync submodules, init .issues/ |\n\
    | `develop` | — | **NOT in git-workflow** — dispatched via divide-and-conquer\
    \ |\n| `sync-branch` | **NEW** | Mid-feature dev sync (rebase/merge) |\n| `stage-pr`\
    \ | review-prep | Push, verify readiness, generate URL |\n| `create-pr` | pr-creation\
    \ | Create PR in GitHub |\n| `amend-pr` | **NEW** | Respond to review feedback,\
    \ re-push |\n| `check-pull-requests` | check-pr | Query PR state, trigger cleanup\
    \ |\n| `post-merge-cleanup` | cleanup | Verify merge → clean branches → close\
    \ issues |\n| `release` | release-promotion | Promote dev → main |\n| `investigate`\
    \ | **NEW** | Investigate/ branch lifecycle |\n| `completion` | completion | Terminal\
    \ — every skill exit |\n\n### Revised Standard Chains (git-workflow only)\n\n\
    ```\nFeature setup:\n  setup-feature  →  [divide-and-conquer: develop]  →  stage-pr\
    \  →  create-pr\n\nMid-feature sync:\n  sync-branch  (standalone, dispatch during\
    \ develop when dev diverges)\n\nReview feedback cycle:\n  amend-pr  (standalone\
    \ — make changes, re-push to existing PR branch)\n\nPost-merge:\n  check-pull-requests\
    \  →  post-merge-cleanup\n\nRelease:\n  release\n\nInvestigation:\n  investigate\n\
    ```\n\nThe `completion` task is terminal for skill exit — called by any task when\
    \ the skill workflow finishes.\n\n### Semantic Renames Applied\n\nAll renamed\
    \ tasks use action-verb + object format for better semantic matching between agent\
    \ intent and available dispatch routes.\n\n### Pair Tasks Removed as Duplicates\n\
    \nPair tasks are parameterized into the autonomous tasks via `pair_mode: true/false`\
    \ context parameter. The five pair-specific files are consolidated into parameter\
    \ checks within the six main tasks.\n\n### Word Counts Removed from SKILL.md Card\n\
    \nWord counts have no relevance to dispatching agents. Removed from the card.\
    \ The `091-incremental-build.md` limit applies to file authors, not dispatchers.\n\
    \n\U0001F916 Co-authored with AI: OpenCode (deepseek-v4-flash)"
