- body: '## Correction: Execution Mode Architecture


    ### Direct-branch is the universal default


    Both **standard workflow** (`feature/*`) and **pair mode** (`pair-*`) use direct-branch
    — working in the main repo directory. The only difference is metadata:


    | Aspect | Standard | Pair Mode |

    |--------|----------|-----------|

    | Execution model | Direct-branch (main repo) | Direct-branch (main repo) |

    | Branch prefix | `feature/`, `spec/` | `pair-` |

    | Commit trailers | Standard | `[pair-mode]` co-author |

    | File path behavior | Relative paths | Relative paths |

    | Isolation mechanism | Branch isolation | Branch isolation (same as standard)
    |


    **Worktrees** (`.worktrees/`) are a separate opt-in execution model for special
    circumstances when `WORKTREE_REQUIRED` is set — NOT the pair-mode alternative.


    ### Impact on task decomposition


    The pair task files are **not structural duplicates** — there is no structural
    difference to parameterize. The only difference is:


    1. `pair-pre-work` creates `pair-` prefixed branches instead of `feature/` or
    `spec/`

    2. `pair-commit` adds `[pair-mode]` trailer

    3. `pair-pr-creation` uses pair-mode PR template

    4. `pair-cleanup` also cleans stashes

    5. `pair-mode-resume` detects pair session on startup


    These are thin wrappers that could be absorbed into the autonomous tasks via a
    `pair_mode` flag. For example:

    - `setup-feature` checks `context.pair_mode` → branch prefix changes, rest is
    identical

    - `develop` checks `context.pair_mode` → commit trailer changes, rest is identical

    - `stage-pr`/`create-pr` unaffected (PR body doesn''t change)

    - `post-merge-cleanup` also cleans stashes when pair_mode


    ### Proposed file consolidation


    | Current Pair Files | Absorbed Into |

    |-------------------|---------------|

    | `pair-pre-work` | `setup-feature` — pair_mode flag changes branch prefix |

    | `pair-commit` | `setup-feature` or `develop` — commit trailer via pair_mode
    |

    | `pair-pr-creation` | `create-pr` — not materially different, remove file |

    | `pair-cleanup` | `post-merge-cleanup` — adds stash cleanup when pair_mode |

    | `pair-mode-resume` | Session-init — not a task dispatch at all |


    ### Impact on the SKILL.md card


    No separate pair-mode task section needed. The card shows 10 entry-point tasks.
    The `pair_mode` context parameter is documented in the Sub-Agent Routing section,
    not in the task table.


    ### Worktree mode impact


    Worktrees (when `WORKTREE_REQUIRED`) are handled by `setup-feature` autonomously
    dispatching `using-git-worktrees` if the flag is set. No separate task or chain
    entry needed — this is an implementation detail of `setup-feature`.


    🤖 Co-authored with AI: OpenCode (deepseek-v4-flash)'
