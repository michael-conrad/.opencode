- body: '## SC-4 Was Never Implemented — Reopening


    This issue was closed on 2026-05-21 with the comment "verified implemented in
    the current codebase." However, **SC-4 was never implemented.** The current `branch-cleanup.md`
    Step 5 (lines 434-439) contains:


    ```bash

    git status --porcelain  # Must be empty

    git branch -vv          # Should show minimal branches

    ```


    There is no `git branch --show-current` check. SC-4 required: "Step 5 exit criteria
    includes `git branch --show-current` alongside existing `git status --porcelain`
    and `git branch -vv`."


    **SPEC-FIX #1873** now covers this gap — it adds `git branch --show-current` verification
    to both `cleanup.md` Step 4 and `branch-cleanup.md` Step 5, and explicitly references
    this issue''s SC-4 as the unimplemented criterion.


    🤖 Co-authored with AI: OpenCode (ollama-cloud/deepseek-v4-pro)'
  created_at: '2026-07-11T16:02:43Z'
  user: michael-conrad
