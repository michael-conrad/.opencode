- body: '## Audit Finding: Missing dirty-working-tree handling in Step 0


    **Source:** adversarial-audit, kimi-k2 (spec-audit)


    **Finding:** The spec requires adding an unconditional Step 0 precondition gate
    (`git checkout dev && git pull origin dev --ff-only`), but does not address the
    failure case where `git checkout dev` fails due to uncommitted local changes or
    a dirty working tree. A `git checkout dev` with dirty state will abort with an
    error, and the sub-agent has no instructions for recovery.


    **Risk:** If the sub-agent is on a feature branch with uncommitted work when cleanup
    is dispatched, Step 0 will fail. The sub-agent is then unmoored — no fallback
    instructions, no HALT condition, no stash/revert guidance. This produces either
    a silent continue-on-error or a crash with no structured output.


    **Remediation — add to Implementation Strategy:**


    The Step 0 gate should include a dirty-working-tree handling fork:


    ```

    git checkout dev

    # If checkout fails (dirty working tree):

    #   git stash push -m "cleanup-autostash-<timestamp>"

    #   git checkout dev

    #   (continue with cleanup)

    #   After cleanup: git stash pop || true

    ```


    Or alternatively document the expected behavior as a hard-fail:


    ```

    git checkout dev

    # If checkout fails:

    #   HALT and report: "Cannot switch to dev — uncommitted changes in working tree."

    #   Do NOT attempt stash or continue.

    ```


    Both approaches are valid. Choose one during implementation. The key is that the
    behavior is documented rather than left unspecified.


    **Severity:** Low (conditional) — only triggers when working tree is dirty at
    cleanup time, which is uncommon. But the gap exists and should be closed before
    implementation.


    🤖 OpenCode (deepseek-v4-flash)

    '
  created_at: '2026-05-18T17:22:25Z'
  user: michael-conrad
