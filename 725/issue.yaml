body: '# Spec: Allow Nested Sub-Issues for Better Organization


  STATUS: draft

  CREATED: 2026-05-19

  MIGRATED-FROM: NewsRx/newsrx-genai-python#290


  ## Objective


  Update the `issue-operations` skill to explicitly allow and document nested sub-issues
  (sub-issues with their own sub-issues) when such decomposition improves organization
  and spec implementation tracking.


  ## Problem Statement


  **Current State:** The `issue-operations` skill describes a two-level hierarchy:

  - Parent `[SPEC]` issue

  - Child `[Task]` issues linked via sub-issues (`link-sub-issue` task)


  **Gap:** No guidance exists for deeper hierarchies where a Task itself benefits
  from further decomposition into sub-tasks. This creates ambiguity when:

  1. A Task is complex enough to warrant its own implementation steps

  2. A phase within a spec spans multiple related sub-tasks

  3. An agent needs to track progress on sub-sub-tasks


  **Impact:** Agents may create flat lists of tasks even when a hierarchical structure
  would be clearer, or may avoid needed decomposition due to perceived prohibition.


  ## Live Codebase Audit (2026-05-19)


  | Original Spec File | Current Status | Notes |

  |---------------------|----------------|-------|

  | `.opencode/guidelines/120-github-issue-first.md` | ❌ Does not exist | Issue-first
  workflow consolidated into `issue-operations` skill |

  | `.opencode/guidelines/010-approval-gate.md` | ✅ Exists | Has sub-issue verification
  gate (Step 5) but no nested sub-issue guidance |

  | `.opencode/guidelines/140-planning-spec-creation.md` | ✅ Exists | Has spec creation
  workflow but no sub-task decomposition guidance |

  | `.opencode/skills/issue-operations/SKILL.md` | ✅ Exists | Has `link-sub-issue`
  task but no nested sub-issue documentation |

  | `.opencode/skills/issue-operations/tasks/link-sub-issue.md` | ✅ Exists | Handles
  sub-issue creation and linking, no nesting guidance |


  **Developer direction** (from #290 comments): "Apply this to the skills and not
  the generic guidelines."


  **Related spec:** #724 (dependency-ordered phases) — both modify planning/issue
  structure. Recommended review together. If #724 changes phase design to be dependency-driven,
  nested sub-issue structure may need to account for dependency depth.


  ## Proposed Change


  ### 1. Update `.opencode/skills/issue-operations/SKILL.md`


  Add **"Nested Sub-Issues"** section documenting:

  - When nested sub-issues are appropriate (3+ sub-tasks, independently completable)

  - Maximum depth guidance (3 levels: SPEC → Task → Sub-task)

  - Title format convention for nested issues

  - How `link-sub-issue` task applies at each nesting level

  - When NOT to nest (avoid hierarchy for its own sake)


  ### 2. Update `.opencode/skills/issue-operations/tasks/link-sub-issue.md`


  Add nested sub-issue handling:

  - Recursively link sub-sub-tasks to parent tasks

  - Track hierarchy depth

  - Title format: `[Task: Parent-Name] Sub-task description`


  ### 3. Update `.opencode/guidelines/010-approval-gate.md`


  Add to the "Multi-Task Plan Authorization" section:

  - Clarify that authorization cascades through nested sub-issue links

  - Cross-reference to `issue-operations` skill for nesting guidance


  ### Files NOT being modified (no longer exist):

  - ~~`.opencode/guidelines/120-github-issue-first.md`~~ — consolidated into `issue-operations`
  skill


  ## Success Criteria


  1. ✅ `issue-operations` SKILL.md includes nested sub-issue documentation

  2. ✅ `link-sub-issue` task handles hierarchy depth and nested linking

  3. ✅ `010-approval-gate.md` references authorization cascade through nested links

  4. ✅ Clear criteria for when nesting is appropriate (3+ sub-tasks, independently
  completable)

  5. ✅ Maximum depth guidance (3 levels: SPEC → Task → Sub-task)

  6. ✅ Title format convention for nested issues documented

  7. ✅ Skills load and search correctly after changes


  ## Phases


  ### Phase 1: Implementation

  1. ☐ Update `issue-operations/SKILL.md` with nested sub-issue section

  2. ☐ Update `issue-operations/tasks/link-sub-issue.md` with nested handling

  3. ☐ Update `010-approval-gate.md` with authorization cascade for nested links

  4. ☐ Verify skills load correctly


  ### Phase 2: Testing

  1. ☐ Verify `guidelines search "nested sub-issue"` returns updated content

  2. ☐ Verify `link-sub-issue` task handles depth tracking

  3. ☐ Verify behavioral enforcement: agent creates nested sub-issues appropriately


  ### Phase 3: Review

  1. ☐ Human review of changes

  2. ☐ Approve or request revisions


  ## Downstream Cross-Reference


  - Original issue: https://github.com/NewsRx/newsrx-genai-python/issues/290

  - Related: #724 (dependency-ordered phases) — coordinate implementation


