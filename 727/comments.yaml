- body: '**Re-opened 2026-07-01.** Previous closure was premature — the `validate_skill_cards.py`
    script on `dev` has NOT been updated to match this spec. The script still:


    - Validates `type`/`provenance` as top-level required fields (should be under
    `metadata:`)

    - Has no `metadata:` block support

    - Has no online schema fetch (REQ-5)

    - Has no dark prose validation (REQ-6)

    - Has no invocation redirect validation (REQ-7)

    - Uses JSON output, not YAML

    - Only discovers `*/SKILL.md` and `*/platforms/*/SKILL.md` (not `tasks/` or `reference/`)


    Also supersedes #421 (now closed) which proposed a different approach (reject
    custom fields entirely rather than moving under `metadata:`).


    **Revision needed:** The spec body is still valid. The scope estimate (~150 files)
    and risk analysis remain accurate. No structural changes to the spec are required
    — it needs execution against the current codebase.'
  created_at: '2026-07-01T16:13:02Z'
  user: michael-conrad
