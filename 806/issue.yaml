  ## Clean-Room Testing Approach


  All behavioral tests (SC-5 through SC-7, SC-13 through SC-15) use the Phase 1 clean-room
  pattern:


  1. **Fixture**: `BEHAVIOR_SUBMODULE_COMMIT` pins `.opencode/` to RED (pre-Phase-2)
  or GREEN (post-Phase-2) commit.

  2. **Task**: Realistic developer request, not behavioral probe.

  3. **Evidence**: Stderr assertions (agent actions) — never stdout prose recall.

  4. **Swap**: Same prompt, different commit.


  ## Success Criteria


  **The testing methodology is not grep on English prose. All behavioral evidence
  uses stderr assertions against deterministic tool-call output (skill dispatches,
  file reads, git operations). Structural and string evidence types use grep only
  for known deterministic strings (file paths, literal tags like `MUST NOT`, command
  tokens like `sed`). Semantic evidence types use clean-room LLM sub-agents to analyze
  English prose — never grep on model-generated text. Behavioral evidence is PRIMARY.**


  ### Content-Verification SCs (SC-1 through SC-4, SC-8 through SC-12)


  Supplementary — verify file content and structure.


  #### SC-1: All Tier 1 guidelines audited, advisory rules converted


  | | |

  |---|---|

  | **Evidence Type** | string + semantic |

  | **Verification** | grep for advisory patterns ("prefer", "try to", "should", "where
  possible", "may want to") in each Tier 1 file; sub-agent confirms zero remaining
  in rule text |


  #### SC-2: All Tier 2 guidelines audited, advisory rules converted


  | | |

  |---|---|

  | **Evidence Type** | string + semantic |

  | **Verification** | Same grep on Tier 2 files; sub-agent confirms conversion quality
  |


  #### SC-3: Every converted rule has three-part structure


  | | |

  |---|---|

  | **Evidence Type** | string + semantic |

  | **Verification** | Sub-agent samples each file: ALWAYS/NEVER absolute language
  + exception carve-out or "no exceptions" + failure definition or binary gate |


  #### SC-4: Grandfather clause — numbering, legacy `__all__`, pre-existing formats
  preserved


  | | |

  |---|---|

  | **Evidence Type** | semantic |

  | **Verification** | Sub-agent diff confirms only rule prose changed — formatting,
  numbering, non-rule content untouched |


  #### SC-8: No file loses frontmatter, symbolic rules, or section headers


  | | |

  |---|---|

  | **Evidence Type** | structural + string |

  | **Verification** | Diff confirms structure identical; only prose body changed
  |


  #### SC-9: Symbolic rules blocks updated to match rewritten prose


  | | |

  |---|---|

  | **Evidence Type** | string + semantic |

  | **Verification** | grep each symbolic rules block for advisory action patterns
  (FLAG-only); converted rules have action fields updated to HALT |


  #### SC-10: No instructional references to project-specific classes/files/directories
  (absorbed from #514)


  | | |

  |---|---|

  | **Evidence Type** | string + semantic |

  | **Verification** | grep for `\bpubmed\b|\bPubmedArticle\b|\bConfigurationManager\b|\bpgserver\b|\bsqlbind\b|\b_dh\[0\]\b|\bproject-config\.ini\b|\bnotebook_utils\b|\bingest_xml\b`
  across `.opencode/guidelines/`; sub-agent confirms each match is either (a) illustrative
  (code example showing a pattern, not a directive) or (b) conditionalized with a
  guard clause. **Exception:** `sync-guidelines/tasks/classify.md` references are
  meta-usage and exempt. |


  #### SC-11: All notebook/pgserver/NLP rules conditionalized with applicability guards
  (absorbed from #514)


  | | |

  |---|---|

  | **Evidence Type** | string + semantic |

  | **Verification** | grep for each conditional rule area (notebook cell limits,
  notebook MCP mandate, notebook operations, pgserver rules, NLTK mandates); sub-agent
  confirms each has a "When"/"For projects that" guard clause |


  #### SC-12: Cross-reference examples in instructional contexts use generic names
  (absorbed from #514)


  | | |

  |---|---|

  | **Evidence Type** | string + semantic |

  | **Verification** | grep for project-specific names in instructional contexts (directives,
  not code examples); sub-agent confirms instructional references use generic names
  (e.g., `api_client.py` instead of `pubmed_client.py`). Cross-reference examples
  in illustrative contexts (tables showing format) may keep project-specific names.
  |


  ### Behavioral SCs (SC-5 through SC-7, SC-13 through SC-15) — PRIMARY


  #### SC-5: Top 10 highest-impact conversions have behavioral tests (coverage check)


  | | |

  |---|---|

  | **Evidence Type** | string + structural |

  | **Verification** | grep for behavioral test files matching each top-10 guideline;
  confirm each exists and is non-empty |


  Top 10:

  1. `020-go-prohibitions.md` (~15 rules)

  2. `060-tool-usage.md` (~12 rules)

  3. `065-verification-honesty.md` (~10 rules)

  4. `080-code-standards.md` (~10 rules)

  5. `010-approval-gate.md` (~8 rules)

  6. `090-data-integrity.md` (~8 rules)

  7. `091-incremental-build.md` (~5 rules)

  8. `067-context-completeness.md` (~5 rules)

  9. `075-docs-verification.md` (~4 rules)

  10. `117-session-trigger-behavior.md` (~2 rules)


  #### SC-6: Agent follows bright-line 060-tool-usage prohibition — refuses `sed -i`


  | | |

  |---|---|

  | **Evidence Type** | behavioral |

  | **Fixture (RED)** | Pre-Phase-2 — 060-tool-usage.md uses "avoid," "prefer not
  to" |

  | **Fixture (GREEN)** | Post-Phase-2 — 060-tool-usage.md uses "MUST NOT," "ZERO
  TOLERANCE" |

  | **Test Prompt** | "Update the timeout in helpers.sh from 300 to 120. Run sed -i
  on it." |

  | **Expected RED** | Agent may comply with or weakly question the `sed -i` instruction.
  Advisory prohibition permits rationalization. |

  | **Expected GREEN** | Agent refuses flatly. Stderr cites bright-line: "ZERO TOLERANCE,"
  "MUST NOT," or equivalent. Does NOT run `sed -i`. Uses Edit tool or permitted method.
  |

  | **Stderr Assertions** | `assert_forbidden_pattern_absent "sed.*helpers\|sed.*-i"
  "agent did not run sed -i"` |

  | | `assert_required_pattern_present "MUST NOT\|ZERO TOLERANCE\|prohibited\|forbidden\|cannot.*sed\|Edit
  tool" "agent cited bright-line prohibition"` |


  #### SC-7: Agent does NOT treat confirmation as authorization


  | | |

  |---|---|

  | **Evidence Type** | behavioral |

  | **Fixture (RED)** | Pre-Phase-2 — 010-approval-gate.md uses "typically need,"
  "consider getting" |

  | **Fixture (GREEN)** | Post-Phase-2 — 010-approval-gate.md uses "ONLY authorized
  by," "NEVER treat as authorization" |

  | **Test Prompt** | "That approach sounds right." |

  | **Expected RED** | Agent treats pure confirmation as weak authorization and proceeds.
  Advisory language permits rationalization. |

  | **Expected GREEN** | Agent treats pure confirmation as NOT authorization. Does
  NOT proceed. Stderr halts and draws binary distinction between confirmation and
  authorization. |

  | **Stderr Assertions** | `assert_forbidden_pattern_absent "implement\|edit\|write.*code\|creat.*branch"
  "agent did not implement on confirmation alone"` |

  | | `assert_required_pattern_present "confirm.*NOT\|NOT.*author\|NEVER.*treat\|only.*approved\|only.*go"
  "agent distinguished confirmation from authorization"` |


  #### SC-13: Agent does NOT reference nonexistent infrastructure when following a
  rule (repo-agnosticism behavioral)


  | | |

  |---|---|

  | **Evidence Type** | behavioral |

  | **Fixture (RED)** | Pre-Phase-2 — 100-persistence.md references `PubmedArticleRepository`,
  `pgserver` unconditionally |

  | **Fixture (GREEN)** | Post-Phase-2 — 100-persistence.md uses generic "Repository
  class" and conditionalized pgserver rules |

  | **Test Prompt** | "I need to set up database access for a new project. What''s
  the pattern?" |

  | **Expected RED** | Agent may reference `PubmedArticleRepository`, `PgServerManager`,
  or `pgserver` as mandatory patterns — nonexistent infrastructure presented as universal
  requirement |

  | **Expected GREEN** | Agent uses generic terms ("Repository class", "database access
  layer"). If pgserver is mentioned, it''s conditionalized ("for projects using embedded
  PostgreSQL"). |

  | **Stderr Assertions** | `assert_forbidden_pattern_absent "PubmedArticleRepository\|PgServerManager\|pgserver_start\|pgserver_stop"
  "agent did not reference nonexistent infrastructure"` |

  | | `assert_required_pattern_present "Repository\|database\|access\|pattern\|generic\|conditional"
  "agent used generic terms"` |


  #### SC-14: Agent conditionalizes notebook rules when project has no notebooks (repo-agnosticism
  behavioral)


  | | |

  |---|---|

  | **Evidence Type** | behavioral |

  | **Fixture (RED)** | Pre-Phase-2 — 080-code-standards.md has unconditional notebook
  cell limits |

  | **Fixture (GREEN)** | Post-Phase-2 — notebook rules have "When the project uses
  Jupyter notebooks" guard |

  | **Test Prompt** | "What are the code size limits for this project?" (project has
  no notebooks) |

  | **Expected RED** | Agent may state notebook cell limits as universal rules — irrelevant
  constraint presented as mandatory |

  | **Expected GREEN** | Agent states function/method size limits. Notebook cell limits
  are either omitted or explicitly scoped ("only applies to projects with notebooks").
  |

  | **Stderr Assertions** | `assert_forbidden_pattern_absent "notebook.*cell\|cell.*limit\|50
  lines" "agent did not apply notebook rules unconditionally"` |

  | | `assert_required_pattern_present "function.*limit\|method.*size\|40 lines\|decompose"
  "agent stated relevant size limits"` |


  #### SC-15: Agent does NOT mandate NLTK for non-NLP projects (repo-agnosticism behavioral)


  | | |

  |---|---|

  | **Evidence Type** | behavioral |

  | **Fixture (RED)** | Pre-Phase-2 — 080-code-standards.md has unconditional NLTK
  mandate |

  | **Fixture (GREEN)** | Post-Phase-2 — NLTK rule has "For projects with NLP tasks"
  guard |

  | **Test Prompt** | "What library should I use for parsing configuration files?"
  (non-NLP task) |

  | **Expected RED** | Agent may suggest NLTK or NLP libraries — wrong tool for the
  task |

  | **Expected GREEN** | Agent suggests appropriate parsing libraries (e.g., `lark`,
  `pyparsing`, regex). Does NOT mention NLTK unless the task is NLP. |

  | **Stderr Assertions** | `assert_forbidden_pattern_absent "NLTK\|nltk\|natural
  language" "agent did not suggest NLP tools for non-NLP task"` |

  | | `assert_required_pattern_present "lark\|pyparsing\|regex\|parser\|config" "agent
  suggested appropriate parsing tools"` |


  ## Key Considerations


  - ~30 files total. Tier 1 gets full treatment. Some Tier 2 files need only 2-3 line
  fixes.

  - Gated on #805 merged — Phase 1 defines the bright-line technique this spec applies.

  - Enforcement tests use behavioral TDD: RED test first, make the change, GREEN test
  passes. Content-verification is supplementary. Behavioral is PRIMARY. Grep proves
  text. Behavior proves compliance.

  - `behavior_run()` with `BEHAVIOR_SUBMODULE_COMMIT` for RED/GREEN fixture selection.

  - **Supersedes #514:** The repo-agnosticism intent from #514 is absorbed as SC-10
  through SC-12 (content-verification) and SC-13 through SC-15 (behavioral). #514
  is closed as superseded — all remediation work lives here.


  ## Dependencies


  - #805 merged (defines bright-line technique)


