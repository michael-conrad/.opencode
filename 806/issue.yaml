body: '# [SPEC] Phase 2: Bright-Line Audit — Rewrite All Guidelines


  - **Issue Number:** 806

  - **Status:** DRAFT

  - **Branch Pattern:** `feature/806-guideline-rewrite`

  - **Authorization Scope:** `for_pr`

  - **PR Strategy:** stacked

  - **Depends On:** #805 (Phase 1 — must be merged for bright-line pattern definition)

  - **Supersedes:** #514 (stale cross-repo references — absorbed as SC-10 through
  SC-12)


  ## Problem


  Professional engineers write binary rules. Amateurs write advisory prose — and call
  it engineering.


  Every guideline file in this project uses advisory-junie language: "prefer," "try
  to," "use where possible," "should," "consider." Every advisory pattern is a rationalization
  surface. Every rationalization surface produces a defect path the agent can navigate.
  The agent navigates them. Every time.


  The guidelines are the highest-impact targets because they load on every session
  start (Tier 1 instructions array). They set the tone for every decision the agent
  makes. Advisory guidelines produce an advisory agent. A binary gate the agent cannot
  reason around is the only instruction that reliably changes behavior.


  Every advisory rule in these files is technical debt. This spec retires that debt.


  ### Second Problem: Repo-Agnosticism


  The `.opencode/` submodule is consumed by multiple repos. Guidelines contain embedded
  project-specific artifacts from their origins (PubMed/NLP pipeline, Jupyter notebooks,
  `ConfigurationManager`, `pubmed_data*`, `pgserver`, `sqlbind`, `notebook_utils`).
  These references are not repo-agnostic — they make the guidelines misleading and
  non-portable for any consuming repository that doesn''t share that origin project''s
  structure. Every project-specific reference is a confusion surface for the agent.
  Every confusion surface produces a wrong decision when the agent tries to follow
  a rule that references nonexistent infrastructure.


  Both problems share the same file scope. Both get fixed in the same pass.


  ## Scope


  Every file matching `guidelines/*.md` containing advisory prose patterns. Each rule
  evaluated and either:

  1. **Rewritten as bright-line** — absolute language, binary compliance, exception
  carve-out, failure definition

  2. **Removed** — rule is dead or redundant; delete without replacement (no data
  loss)

  3. **Migrated** — rule is better expressed in a skill or task card; move content
  to target before removing from guideline

  4. **Preserved** — if already using absolute language and binary gates (zero found
  on initial audit)


  **Additionally**, every file gets a repo-agnosticism pass during the rewrite:


  - **Category A1 (Instructional references):** Replace project-specific names with
  generic patterns (e.g., `PubmedArticleRepository` → "Repository class", `pubmed_data_2`
  → "archived dataset", `ConfigurationManager` → "project configuration utility")

  - **Category A2 (Illustrative references):** May be kept as-is. The pattern is what
  matters, not the example name. Generalization is optional for consistency.

  - **Category B (Conditional rules):** Add applicability guards for notebook/pgserver/NLP
  rules (e.g., "When the project uses Jupyter notebooks, ..." for notebook-specific
  rules; "For projects using embedded PostgreSQL, ..." for pgserver-specific rules)


