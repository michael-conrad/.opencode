body: '## Phase 1: Audit — Identify all `task()` calls in task files


  **Parent plan:** [#866](https://github.com/michael-conrad/.opencode/issues/866)

  **Items:** Item 1


  ### What must be accomplished

  - Run `grep -rn "task()" .opencode/skills/*/tasks/` to produce definitive list

  - Compare results against spec''s affected files table; flag discrepancies

  - Store audit output as evidence artifact


  ### Success criteria

  - Evidence artifact saved to `./tmp/artifacts/task-calls-audit.txt`

  - Documented comparison: spec table vs actual results


  ### Dependencies

  - None — this phase runs first


  ### Risk

  - Grep may match false positives (comments, prose examples) — each match verified
  by reading file context'
