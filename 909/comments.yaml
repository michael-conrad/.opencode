- body: '## GAP 3: Coordination with #951/#952/#954 (identified by Z3 constraint analysis
    in #954)


    Current sub-issues: #872 (merged), #915, #913, #932, #912.


    #951 (solve gates), #952 (solve tests), and #954 (skill inventory) all modify
    the same 36 skill task files that the 14-step pipeline architecture targets, but
    none are sub-issues of #909. This means two uncoordinated workflows may modify
    the same files.


    ### Options (pick one)


    **A)** Add #951, #952, #954 as 909 sub-issues with explicit scope carve-outs.
    They target "pre-#909 task files" and are superseded when the renamed files land.
    This makes the rework explicit but tracked.


    **B)** Document confirmed non-overlap — show that #951/#952/#954 modify adversarial-audit,
    verification-before-completion, and other skills that are NOT replaced by #909''s
    pipeline (which replaces only divide-and-conquer). If confirmed, no coordination
    needed.


    **C)** Block #951/#952/#954 until #909 lands. Cleanest architecture but highest
    latency.


    See #954 Z3 analysis for the full constraint model.


    🤖 Co-authored with AI: OpenCode (deepseek-v4-flash)'
