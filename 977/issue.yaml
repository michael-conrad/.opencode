number: 977
title: '[Bug] tools/local-issues has broken PEP 723 bash guard'
status: open
labels:
- bug
- needs-approval
body: '## Problem


  `tools/local-issues` line 2 has a malformed bash guard:


  ```

  "execuvrun--script$0$@"  # MUST GO BEFORE PEP 723 HEADER

  ```


  All tokens are concatenated into a single string with no spaces or quotes. Bash
  interprets this as one token instead of `exec` + `uv` + `run` + `--script` + `$0`
  + `$@`.


  The correct form (matching `tools/guidelines` and `tools/md`):


  ```

  "exec" "uv" "run" "--script" "$0" "$@" # MUST GO BEFORE PEP 723 HEADER

  ```


  ## Impact


  When invoked as `bash .opencode/tools/local-issues setup`, bash falls through the
  guard and interprets Python `import` statements as shell commands (`import fcntl`
  → creates a file called `fcntl`, etc.), producing stray artifact files in the project
  root.


  ## Fix


  Replace line 2 with the properly tokenized bash guard with spaces between arguments.


  🤖 Co-authored with AI: OpenCode (ollama-cloud/glm-5.1)'
