[project]
name = "opencode-tools"
version = "0.1.0"
description = "OpenCode agent tools — session-init, auth, and CLI utilities"
requires-python = "~=3.12.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "-m 'not pr_validation'"
markers = [
  "pr_validation: ticket PR-check fixtures that run real processes (2624);",
  "    excluded from the default suite, executed at PR-check time only",
]

[dependency-groups]
dev = [
    "pyyaml>=6.0,<7.0",
    "pytest>=8.0,<9.0",
    "pytest-cov>=6.0,<7.0",
]
