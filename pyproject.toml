[project]
name = "opencode-tools"
version = "0.1.2"
description = "OpenCode agent tools — session-init, auth, and CLI utilities"
requires-python = "~=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=6.0,<7.0",
]
