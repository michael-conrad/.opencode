schema_version: "1.0"
last_updated: "2026-07-30T00:00:00Z"

variables:
  current_step:
    type: string
    domain:
      - pre-regression
      - pre-regression-verify
      - red
      - green
      - post-regression
      - verify
      - commit-inline
      - audit
      - z3-check
      - structural-checks
      - sc-count-gate
      - pre-pr-gate
      - rationalization-check
      - regression-check
      - review-prep
      - create-pr
      - exec-summary
  previous_step:
    type: string
    domain:
      - init
      - pre-regression
      - pre-regression-verify
      - red
      - green
      - post-regression
      - verify
      - commit-inline
      - audit
      - z3-check
      - structural-checks
      - sc-count-gate
      - pre-pr-gate
      - rationalization-check
      - regression-check
      - review-prep
      - create-pr
  pipeline_state:
    type: string
    domain: [init, running, complete, failed]

preconditions:
  - "z3.Implies(previous_step == z3.StringVal('init'), current_step == z3.StringVal('pre-regression'))"
  - "z3.Implies(previous_step == z3.StringVal('pre-regression'), current_step == z3.StringVal('pre-regression-verify'))"
  - "z3.Implies(previous_step == z3.StringVal('pre-regression-verify'), z3.Or(current_step == z3.StringVal('red'), current_step == z3.StringVal('pre-regression')))"
  - "z3.Implies(previous_step == z3.StringVal('red'), current_step == z3.StringVal('green'))"
  - "z3.Implies(previous_step == z3.StringVal('green'), current_step == z3.StringVal('post-regression'))"
  - "z3.Implies(previous_step == z3.StringVal('post-regression'), current_step == z3.StringVal('verify'))"
  - "z3.Implies(previous_step == z3.StringVal('verify'), z3.Or(current_step == z3.StringVal('commit-inline'), current_step == z3.StringVal('red')))"
  - "z3.Implies(previous_step == z3.StringVal('commit-inline'), current_step == z3.StringVal('audit'))"
  - "z3.Implies(previous_step == z3.StringVal('audit'), z3.Or(current_step == z3.StringVal('z3-check'), current_step == z3.StringVal('red')))"
  - "z3.Implies(previous_step == z3.StringVal('z3-check'), z3.Or(current_step == z3.StringVal('structural-checks'), current_step == z3.StringVal('red')))"
  - "z3.Implies(previous_step == z3.StringVal('structural-checks'), z3.Or(current_step == z3.StringVal('sc-count-gate'), current_step == z3.StringVal('red')))"
  - "z3.Implies(previous_step == z3.StringVal('sc-count-gate'), z3.Or(current_step == z3.StringVal('pre-pr-gate'), current_step == z3.StringVal('red')))"
  - "z3.Implies(previous_step == z3.StringVal('pre-pr-gate'), z3.Or(current_step == z3.StringVal('rationalization-check'), current_step == z3.StringVal('red')))"
  - "z3.Implies(previous_step == z3.StringVal('rationalization-check'), z3.Or(current_step == z3.StringVal('regression-check'), current_step == z3.StringVal('red')))"
  - "z3.Implies(previous_step == z3.StringVal('regression-check'), z3.Or(current_step == z3.StringVal('review-prep'), current_step == z3.StringVal('red')))"
  - "z3.Implies(previous_step == z3.StringVal('review-prep'), z3.Or(current_step == z3.StringVal('create-pr'), current_step == z3.StringVal('red')))"
  - "z3.Implies(previous_step == z3.StringVal('create-pr'), z3.Or(current_step == z3.StringVal('exec-summary'), current_step == z3.StringVal('red')))"
  - "z3.Or(pipeline_state == z3.StringVal('init'), pipeline_state == z3.StringVal('running'), pipeline_state == z3.StringVal('failed'))"

postconditions:
  - "z3.Implies(current_step == z3.StringVal('exec-summary'), pipeline_state == z3.StringVal('complete'))"
  - "z3.Not(previous_step == current_step)"
  - "z3.Not(z3.And(pipeline_state == z3.StringVal('complete'), z3.Not(current_step == z3.StringVal('exec-summary'))))"
  - "z3.Implies(z3.Not(previous_step == z3.StringVal('init')), pipeline_state == z3.StringVal('running'))"
