# local-issues host→browser-base mapping table.
#
# Maps a git remote hostname to the platform's https browser base, for
# hosts where the web face differs from the SSH host (or is otherwise
# not derivable from the remote URL). Matching is on the hostname only —
# an entry key may carry an informative :port suffix; the mapping is
# scheme-independent and covers every origin form (ssh://, git+ssh://,
# scp-form, https) whose hostname matches.
#
# Format: one `key = value` per line; `#` comments and blank lines are
# ignored; a malformed line is warn-and-skipped on stderr.
#
# Example:
#   git.internal.example.com:2222 = https://git.internal.example.com
tomcat-0002.newsrx.com:29418 = https://gitbucket.newsrx.com/gitbucket
